<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="daylight">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Family Travel Trivia & Academy</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366f1">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Trivia & Academy">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        /* ===================== THEME PALETTES ===================== */
        :root, :root[data-theme="daylight"] {
            --bg: #f4f6fb; --grad1: rgba(99,102,241,0.10); --grad2: rgba(168,85,247,0.10);
            --header-bg: rgba(255,255,255,0.92);
            --card: #ffffff; --card-border: rgba(15,23,42,0.08);
            --text: #1e293b; --muted: #64748b;
            --primary: #6366f1; --primary-2: #a855f7;
            --academic-accent: #0284c7;
            --success: #059669; --error: #e11d48;
            --surface: rgba(15,23,42,0.03); --surface-border: rgba(15,23,42,0.10);
            --shadow: 0 8px 24px rgba(15,23,42,0.08);
            --math-bg: rgba(99,102,241,0.06);
        }
        :root[data-theme="sunrise"] {
            --bg: #fff7ed; --grad1: rgba(249,115,22,0.12); --grad2: rgba(45,212,191,0.12);
            --header-bg: rgba(255,247,237,0.92);
            --card: #fffdf9; --card-border: rgba(120,53,15,0.10);
            --text: #431407; --muted: #9a6b52;
            --primary: #f97316; --primary-2: #fb7185;
            --academic-accent: #ea580c;
            --success: #059669; --error: #e11d48;
            --surface: rgba(120,53,15,0.03); --surface-border: rgba(120,53,15,0.12);
            --shadow: 0 8px 24px rgba(120,53,15,0.10);
            --math-bg: rgba(249,115,22,0.08);
        }
        :root[data-theme="sky"] {
            --bg: #eef6ff; --grad1: rgba(37,99,235,0.10); --grad2: rgba(6,182,212,0.12);
            --header-bg: rgba(238,246,255,0.92);
            --card: #ffffff; --card-border: rgba(12,42,77,0.08);
            --text: #0c2a4d; --muted: #5b7a9e;
            --primary: #2563eb; --primary-2: #06b6d4;
            --academic-accent: #0284c7;
            --success: #059669; --error: #e11d48;
            --surface: rgba(12,42,77,0.03); --surface-border: rgba(12,42,77,0.10);
            --shadow: 0 8px 24px rgba(12,42,77,0.08);
            --math-bg: rgba(37,99,235,0.07);
        }
        :root[data-theme="meadow"] {
            --bg: #f0fdf4; --grad1: rgba(22,163,74,0.10); --grad2: rgba(132,204,22,0.12);
            --header-bg: rgba(240,253,244,0.92);
            --card: #ffffff; --card-border: rgba(20,50,31,0.08);
            --text: #14321f; --muted: #4b7358;
            --primary: #16a34a; --primary-2: #65a30d;
            --academic-accent: #0d9488;
            --success: #059669; --error: #e11d48;
            --surface: rgba(20,50,31,0.03); --surface-border: rgba(20,50,31,0.10);
            --shadow: 0 8px 24px rgba(20,50,31,0.08);
            --math-bg: rgba(22,163,74,0.07);
        }
        :root[data-theme="midnight"] {
            --bg: #0f172a; --grad1: rgba(99,102,241,0.15); --grad2: rgba(139,92,246,0.15);
            --header-bg: rgba(15,23,42,0.88);
            --card: rgba(30,41,59,0.78); --card-border: rgba(255,255,255,0.08);
            --text: #f8fafc; --muted: #94a3b8;
            --primary: #6366f1; --primary-2: #c084fc;
            --academic-accent: #38bdf8;
            --success: #10b981; --error: #f43f5e;
            --surface: rgba(255,255,255,0.04); --surface-border: rgba(255,255,255,0.12);
            --shadow: 0 10px 30px rgba(0,0,0,0.28);
            --math-bg: rgba(99,102,241,0.18);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            background-image:
                radial-gradient(at 0% 0%, var(--grad1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, var(--grad2) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text);
            line-height: 1.6;
            padding-bottom: 48px;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        header {
            position: sticky; top: 0; z-index: 100;
            background: var(--header-bg); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            padding: 12px 18px; padding-top: calc(12px + env(safe-area-inset-top));
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .header-title { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.025em; cursor: pointer; }
        .header-title span {
            background: linear-gradient(to right, var(--primary), var(--primary-2));
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header-right { display: flex; align-items: center; gap: 8px; }

        .mode-btn {
            background: var(--surface); border: 1px solid var(--surface-border);
            color: var(--text); padding: 8px 14px; border-radius: 12px;
            font-size: 0.88rem; font-weight: 700; font-family: inherit;
            cursor: pointer; display: flex; align-items: center; gap: 6px;
            transition: all 0.2s ease;
        }
        .mode-btn:hover { background: var(--card); border-color: var(--primary); transform: translateY(-1px); }
        .mode-btn.academic-active {
            background: linear-gradient(135deg, var(--academic-accent), var(--primary));
            color: #fff; border-color: transparent; box-shadow: 0 4px 12px rgba(2,132,199,0.3);
        }

        .menu-btn {
            background: var(--surface); border: 1px solid var(--surface-border);
            color: var(--text); width: 38px; height: 38px; border-radius: 11px;
            font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .menu-btn:hover { background: var(--card); }

        .menu-panel {
            position: sticky; top: 0; z-index: 90;
            max-width: 680px; margin: 0 auto; padding: 0 18px;
            max-height: 0; overflow: hidden; transition: max-height 0.3s ease;
        }
        .menu-panel.open { max-height: 750px; }
        .menu-inner {
            background: var(--card); border: 1px solid var(--card-border);
            border-radius: 16px; margin-top: 12px; padding: 16px; box-shadow: var(--shadow);
            max-height: 80vh; overflow-y: auto;
        }
        .menu-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 6px 2px 10px; }
        .theme-chips, .opt-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
        .theme-chip {
            border: 2px solid transparent; border-radius: 11px; padding: 8px 12px; cursor: pointer;
            font-size: 0.85rem; font-weight: 600; font-family: inherit; color: #fff;
            display: flex; align-items: center; gap: 7px;
        }
        .theme-chip.active { border-color: var(--text); }
        .swatch { width: 14px; height: 14px; border-radius: 4px; background: #fff; opacity: 0.9; }
        .opt-chip {
            border: 1px solid var(--surface-border); background: var(--surface); color: var(--text);
            border-radius: 11px; padding: 8px 14px; cursor: pointer;
            font-size: 0.88rem; font-weight: 600; font-family: inherit;
        }
        .opt-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .menu-item {
            display: flex; align-items: center; gap: 10px; width: 100%;
            background: var(--surface); border: 1px solid var(--surface-border); color: var(--text);
            padding: 12px 14px; border-radius: 11px; font-size: 0.95rem; font-family: inherit;
            cursor: pointer; margin-top: 8px; text-align: start;
        }
        .menu-item:hover { background: var(--bg); }

        main { max-width: 680px; margin: 20px auto; padding: 0 18px; }

        .view { display: none; animation: fadeIn 0.35s ease-out forwards; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        /* Controls */
        .home-controls { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
        .search-input, .sort-select {
            background: var(--card); border: 1px solid var(--surface-border); color: var(--text);
            border-radius: 12px; padding: 12px 14px; font-size: 0.95rem; font-family: inherit; outline: none;
        }
        .search-input { flex: 1 1 200px; }
        .search-input:focus, .sort-select:focus { border-color: var(--primary); }
        .sort-select { cursor: pointer; }

        /* Card Styles */
        .card {
            background: var(--card); backdrop-filter: blur(12px);
            border: 1px solid var(--card-border); border-radius: 18px; padding: 22px;
            margin-bottom: 16px; box-shadow: var(--shadow);
        }
        .card-head-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
        .card-title { font-size: 1.22rem; font-weight: 700; margin-bottom: 6px; }
        .card-desc { color: var(--muted); font-size: 0.95rem; margin-bottom: 18px; }

        /* Academic Single-Card (Icon + Title only, compact) */
        .academic-topic-card {
            display: flex; align-items: center; gap: 16px; padding: 18px 20px;
            background: var(--card); border: 1px solid var(--card-border); border-radius: 18px;
            margin-bottom: 14px; box-shadow: var(--shadow); cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .academic-topic-card:hover {
            transform: translateY(-2px); border-color: var(--primary);
            box-shadow: 0 10px 28px rgba(0,0,0,0.08);
        }
        .academic-topic-icon {
            font-size: 2.2rem; line-height: 1; flex-shrink: 0;
            width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
            background: var(--surface); border-radius: 14px;
        }
        .academic-topic-content { flex: 1; min-width: 0; }
        .academic-topic-title {
            font-size: 1.15rem; font-weight: 700; color: var(--text); margin-bottom: 2px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .academic-topic-meta {
            font-size: 0.82rem; color: var(--muted); display: flex; align-items: center; gap: 8px;
        }
        .academic-arrow {
            color: var(--muted); font-size: 1.3rem; font-weight: bold; flex-shrink: 0;
            transition: transform 0.2s ease;
        }
        .academic-topic-card:hover .academic-arrow { color: var(--primary); transform: translateX(3px); }
        [dir="rtl"] .academic-topic-card:hover .academic-arrow { transform: translateX(-3px); }

        /* Lesson Roadmap Styles */
        .lesson-card {
            border-inline-start: 4px solid var(--academic-accent);
            padding: 18px 20px; margin-bottom: 14px;
        }
        .lesson-num {
            display: inline-block; font-size: 0.75rem; font-weight: 800; text-transform: uppercase;
            letter-spacing: 0.05em; color: var(--academic-accent); margin-bottom: 4px;
        }

        /* Math & Formulas Typography */
        .math-inline {
            font-family: 'Cambria Math', 'STIX Two Math', 'Latin Modern Math', 'Times New Roman', serif;
            font-style: italic; background: var(--math-bg); padding: 2px 6px;
            border-radius: 6px; font-size: 1.04em; color: var(--text);
            display: inline-block; direction: ltr; unicode-bidi: embed;
        }
        .math-block {
            font-family: 'Cambria Math', 'STIX Two Math', 'Latin Modern Math', 'Times New Roman', serif;
            font-style: italic; background: var(--math-bg); padding: 14px 18px;
            border-radius: 12px; margin: 12px 0; text-align: center; font-size: 1.15em;
            overflow-x: auto; border: 1px solid var(--surface-border); direction: ltr; unicode-bidi: embed;
        }
        .math-frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; padding: 0 4px; font-size: 0.9em; }
        .math-num { border-bottom: 1px solid currentColor; padding-bottom: 1px; }
        .math-den { padding-top: 1px; }
        .math-sqrt { border-top: 1px solid currentColor; padding-left: 2px; }

        /* Figure Blocks */
        .figure-box {
            background: var(--surface); border: 1px solid var(--surface-border);
            border-radius: 14px; padding: 16px; margin: 16px 0; text-align: center;
        }
        .figure-title {
            font-size: 0.82rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.05em; color: var(--primary); margin-bottom: 10px;
        }
        .figure-svg {
            display: flex; justify-content: center; align-items: center;
            overflow-x: auto; max-width: 100%; margin: 8px 0;
        }
        .figure-svg svg {
            max-width: 100%; height: auto; display: block;
        }
        .figure-caption {
            font-size: 0.86rem; color: var(--muted); margin-top: 10px; line-height: 1.45;
        }

        /* Badges */
        .badge { font-size: 0.72rem; font-weight: 700; padding: 4px 10px; border-radius: 99px; white-space: nowrap; }
        .badge-done { background: color-mix(in srgb, var(--success) 18%, transparent); color: var(--success); }
        .badge-partial { background: color-mix(in srgb, var(--primary) 18%, transparent); color: var(--primary); }
        .badge-new { background: var(--surface); color: var(--muted); }
        .badge-family { background: color-mix(in srgb, var(--primary-2) 16%, transparent); color: var(--primary-2); }
        .badge-adult { background: color-mix(in srgb, var(--error) 16%, transparent); color: var(--error); }
        .badge-academic { background: color-mix(in srgb, var(--academic-accent) 18%, transparent); color: var(--academic-accent); }

        /* Buttons */
        .btn {
            background-color: var(--primary); color: #fff; border: none;
            padding: 13px 22px; border-radius: 12px; font-weight: 600; font-size: 0.98rem;
            font-family: inherit; cursor: pointer;
            transition: filter 0.2s ease, transform 0.1s ease, opacity 0.2s ease;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
        .btn:active { transform: translateY(1px); }
        .btn:disabled { opacity: 0.5; cursor: default; transform: none; }
        .btn-full { width: 100%; }
        .btn-ghost { background: var(--surface); border: 1px solid var(--surface-border); color: var(--text); }
        .btn-ghost:hover { background: var(--bg); filter: none; }
        .btn-academic { background-color: var(--academic-accent); }
        .btn-success { background-color: var(--success); }
        .btn-danger { background-color: var(--error); }
        .btn-back { margin-bottom: 18px; }
        .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn-row .btn { flex: 1; }

        .narrative { color: var(--muted); font-size: 1rem; margin-bottom: 18px; border-inline-start: 3px solid var(--primary); padding-inline-start: 15px; }
        .points-title, .section-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 12px; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        .point-item { position: relative; padding-inline-start: 24px; margin-bottom: 12px; font-size: 0.98rem; }
        .point-item::before { content: "\2726"; position: absolute; inset-inline-start: 0; color: var(--primary); font-weight: bold; }
        .subcard { border-inline-start: 4px solid var(--primary); padding: 18px 20px; }
        .subcard-title { font-size: 1.08rem; font-weight: 700; margin-bottom: 10px; color: var(--text); }

        /* Quiz */
        .quiz-topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.85rem; color: var(--muted); }
        .quiz-scope { font-weight: 600; color: var(--primary); }
        .progress-track { height: 8px; background: var(--surface); border: 1px solid var(--surface-border); border-radius: 99px; overflow: hidden; margin-bottom: 22px; }
        .progress-fill { height: 100%; background: linear-gradient(to right, var(--primary), var(--primary-2)); border-radius: 99px; transition: width 0.35s ease; }
        .quiz-question { font-size: 1.18rem; font-weight: 600; margin-bottom: 20px; }

        .option-btn {
            display: block; width: 100%; background: var(--surface); border: 1px solid var(--surface-border);
            color: var(--text); padding: 15px; margin: 9px 0; border-radius: 12px;
            text-align: start; font-size: 0.98rem; font-family: inherit; cursor: pointer; transition: all 0.2s ease;
        }
        .option-btn:hover:not(:disabled) { border-color: var(--primary); }
        .option-btn:disabled { cursor: default; }
        .option-btn.correct { background: color-mix(in srgb, var(--success) 16%, transparent); border-color: var(--success); font-weight: 600; }
        .option-btn.incorrect { background: color-mix(in srgb, var(--error) 16%, transparent); border-color: var(--error); }

        .reveal-box { margin: 6px 0 18px; padding: 16px; border-radius: 12px; background: color-mix(in srgb, var(--success) 12%, transparent); border: 1px solid color-mix(in srgb, var(--success) 40%, transparent); font-size: 1.05rem; }
        .reveal-box .label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); display: block; margin-bottom: 4px; }
        .reveal-box .answer { font-weight: 700; color: var(--success); }
        .self-grade-q { text-align: center; color: var(--muted); font-size: 0.9rem; margin-bottom: 10px; }

        .summary-score { text-align: center; padding: 10px 0 4px; }
        .summary-score .big { font-size: 3rem; font-weight: 800; color: var(--primary); display: block; line-height: 1.1; }
        .summary-score .msg { font-size: 1.1rem; margin-top: 8px; }

        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
        .stat-box { background: var(--surface); border: 1px solid var(--surface-border); border-radius: 14px; padding: 16px; text-align: center; }
        .stat-box .n { font-size: 1.8rem; font-weight: 800; color: var(--primary); }
        .stat-box .l { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
        .prog-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--surface-border); font-size: 0.95rem; }
        .prog-row:last-child { border-bottom: none; }

        .empty { text-align: center; color: var(--muted); padding: 30px 10px; }
        .error-card { border-color: var(--error); text-align: center; }

        @media (max-width: 480px) {
            .btn-row { flex-direction: column; }
            .academic-topic-card { padding: 14px 16px; gap: 12px; }
            .academic-topic-icon { width: 40px; height: 40px; font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <button id="menu-btn" class="menu-btn" aria-label="Menu">&#9776;</button>
            <div class="header-title" id="btn-header-home"><span id="app-title">Travel Trivia & Academy</span></div>
        </div>
        <div class="header-right">
            <button id="mode-toggle-btn" class="mode-btn">🎓 <span id="lbl-mode-btn">Academic</span></button>
        </div>
    </header>

    <div id="menu-panel" class="menu-panel">
        <div class="menu-inner">
            <div class="menu-label" id="lbl-language">Language</div>
            <div id="lang-chips" class="opt-chips"></div>
            <div class="menu-label" id="lbl-audience">Audience</div>
            <div id="aud-chips" class="opt-chips"></div>
            <div class="menu-label" id="lbl-appearance">Appearance</div>
            <div id="theme-chips" class="theme-chips"></div>
            <button class="menu-item" id="menu-academic">🎓 <span id="lbl-academic-switch">Switch to Academic Mode</span></button>
            <button class="menu-item" id="menu-trivia">🚗 <span id="lbl-trivia-switch">Switch to Travel Trivia</span></button>
            <button class="menu-item" id="menu-stats">📊 <span id="lbl-stats">Statistics</span></button>
            <button class="menu-item" id="menu-reset">↺ <span id="lbl-reset">Reset progress</span></button>
        </div>
    </div>

    <main>
        <div id="view-home" class="view active"></div>
        <div id="view-academic-home" class="view"></div>
        <div id="view-topic" class="view"></div>
        <div id="view-academic-topic" class="view"></div>
        <div id="view-learning" class="view"></div>
        <div id="view-academic-lesson" class="view"></div>
        <div id="view-quiz" class="view"></div>
        <div id="view-summary" class="view"></div>
        <div id="view-stats" class="view"></div>
    </main>

    <script>
        "use strict";

        let appData = null;
        let currentMode = localStorage.getItem('trivia_mode') || 'trivia'; // 'trivia' | 'academic'

        // ============================ i18n ============================
        const LANG_NAMES = { en: 'English', he: 'עברית' };
        const I18N = {
            en: {
                appTitle: 'Travel Trivia & Academy',
                triviaMode: 'Travel Trivia',
                academicMode: 'Academic Courses',
                switchToAcademic: 'Switch to Academic Courses',
                switchToTrivia: 'Switch to Travel Trivia',
                academicBtn: 'Academic 🎓',
                triviaBtn: 'Trivia 🚗',
                language: 'Language', audience: 'Audience', appearance: 'Appearance',
                statistics: 'Statistics', resetProgress: 'Reset progress',
                search: '🔍 Search topics…',
                academicSearch: '🔍 Search academic courses…',
                sortTitle: 'A–Z', sortNewest: 'Newest', sortOldest: 'Oldest',
                sortProgress: 'Unfinished first',
                audAll: 'All', audFamily: 'Family', audAdults: 'Adults',
                badgeDone: '✓ Done', badgeNew: 'New',
                explore: 'Explore →', allTopics: '← All Topics', allAcademicTopics: '← All Academic Courses',
                categories: 'Categories',
                syllabus: 'Curriculum & Lessons',
                studyLesson: 'Study Lesson →',
                practiceQuiz: 'Practice Quiz →',
                testCourse: '🏆 Test Entire Course ({n} questions)',
                quizWhole: '🏆 Quiz the whole topic ({n} questions)', learn: 'Learn →',
                keyPoints: 'Key Learning Points',

        let LANG = localStorage.getItem('trivia_lang') || (navigator.language || 'en').slice(0, 2).toLowerCase();

        function t(key, vars) {
            let s = (I18N[LANG] && I18N[LANG][key]) || I18N.en[key] || key;
            if (vars) for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);
            return s;
        }
        function isRTLLang(code) { return code === 'he' || code === 'ar'; }
        function availableLangs() {
            const all = [...((appData && appData.topics) || []), ...((appData && appData.academic_topics) || [])];
            const set = new Set(all.map(x => x.lang || 'en'));
            const order = ['en', 'he'];
            return [...set].sort((a, b) => (order.indexOf(a) + 1 || 99) - (order.indexOf(b) + 1 || 99));
        }

        // ============================ MATH & RICH FORMATTING ============================
        function formatMathAndText(text) {
            if (!text) return '';
            let s = String(text);

            // 1. Process block math $$ ... $$
            s = s.replace(/\$\$([\s\S]*?)\$\$/g, (match, formula) => {
                return `<div class="math-block">${renderFormula(formula)}</div>`;
            });

            // 2. Process inline math $ ... $
            s = s.replace(/\$([^\$\n]+?)\$/g, (match, formula) => {
                return `<span class="math-inline">${renderFormula(formula)}</span>`;
            });

            // 3. Bold **...**
            s = s.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

            // 4. Code `...`
            s = s.replace(/`([^`]+)`/g, '<code>$1</code>');

            return s;
        }

        function renderFormula(raw) {
            let f = raw.trim();
            // Greek letters
            const greek = {
                '\\alpha': 'α', '\\beta': 'β', '\\gamma': 'γ', '\\delta': 'δ', '\\Delta': 'Δ',
                '\\epsilon': 'ε', '\\zeta': 'ζ', '\\eta': 'η', '\\theta': 'θ', '\\Theta': 'Θ',
                '\\lambda': 'λ', '\\Lambda': 'Λ', '\\mu': 'μ', '\\nu': 'ν', '\\xi': 'ξ',
                '\\pi': 'π', '\\Pi': 'Π', '\\rho': 'ρ', '\\sigma': 'σ', '\\Sigma': 'Σ',
                '\\tau': 'τ', '\\phi': 'φ', '\\Phi': 'Φ', '\\chi': 'χ', '\\psi': 'ψ',
                '\\omega': 'ω', '\\Omega': 'Ω'
            };
            for (const [k, v] of Object.entries(greek)) {
                f = f.split(k).join(v);
            }

            // Math symbols
            const symbols = {
                '\\sum': '∑', '\\int': '∫', '\\prod': '∏',
                '\\le': '≤', '\\leq': '≤', '\\ge': '≥', '\\geq': '≥',
                '\\neq': '≠', '\\ne': '≠', '\\approx': '≈', '\\sim': '∼',
                '\\to': '→', '\\rightarrow': '→', '\\infty': '∞',
                '\\cdot': '·', '\\times': '×', '\\pm': '±',
                '\\in': '∈', '\\subset': '⊂', '\\subseteq': '⊆',
                '\\mathbb{R}': 'ℝ', '\\mathbb{Z}': 'ℤ', '\\mathbb{C}': 'ℂ', '\\mathbb{N}': 'ℕ',
                '\\mathcal{Z}': '𝒵', '\\mathcal{F}': 'ℱ',
                '\\circledast': '⊛', '\\ast': '*',
                '\\text': '', '\\mathrm': '', '\\left': '', '\\right': ''
            };
            for (const [k, v] of Object.entries(symbols)) {
                f = f.split(k).join(v);
            }

            // Fractions: \frac{A}{B}
            f = f.replace(/\\frac\s*\{([^{}]+)\}\s*\{([^{}]+)\}/g, '<span class="math-frac"><span class="math-num">$1</span><span class="math-den">$2</span></span>');

            // Square root: \sqrt{A}
            f = f.replace(/\\sqrt\s*\{([^{}]+)\}/g, '√<span class="math-sqrt">$1</span>');

            // Subscripts & Superscripts
            f = f.replace(/_\{([^}]+)\}/g, '<sub>$1</sub>');
            f = f.replace(/_([a-zA-Z0-9])/g, '<sub>$1</sub>');
            f = f.replace(/\^\{([^}]+)\}/g, '<sup>$1</sup>');
            f = f.replace(/\^([a-zA-Z0-9\+\-])/g, '<sup>$1</sup>');

            return f;
        }

        // ============================ THEMES ============================

        function applyTheme(id) {
            document.documentElement.setAttribute('data-theme', id);
            localStorage.setItem('trivia_theme', id);
            const meta = document.querySelector('meta[name="theme-color"]');
            const th = THEMES.find(x => x.id === id);
            if (meta && th) meta.setAttribute('content', th.color);

                chip.appendChild(el('span', { class: 'swatch' }));
                chip.appendChild(el('span', { text: th.name }));
                chip.onclick = () => applyTheme(th.id);
                box.appendChild(chip);

        function renderLangChips() {

            if (avail.length <= 1) { box.style.display = 'none'; lbl.style.display = 'none'; return; }
            box.style.display = ''; lbl.style.display = '';

                box.appendChild(el('button', {

            const box = document.getElementById('aud-chips');

        function refreshAfterFilter() {
            if (currentView === 'view-stats') renderStats();

                    openTopic(currentTopicIdx);
                else renderTopicList();

        // ============================ MODE SWITCHING ============================
        function toggleAppMode() {
            if (currentMode === 'academic') setAppMode('trivia');
            else setAppMode('academic');
        }
        function setAppMode(mode) {
            currentMode = mode;

        // ============================ STATS / PROGRESS ============================
        const stats = {
            explored: new Set(JSON.parse(localStorage.getItem('trivia_explored') || '[]')),
            completedCats: new Set(JSON.parse(localStorage.getItem('trivia_completed') || '[]')),
            correct: parseInt(localStorage.getItem('trivia_correct') || '0', 10),
            answered: parseInt(localStorage.getItem('trivia_answered') || '0', 10),
            save() {
                localStorage.setItem('trivia_explored', JSON.stringify([...this.explored]));
                localStorage.setItem('trivia_completed', JSON.stringify([...this.completedCats]));
                localStorage.setItem('trivia_correct', String(this.correct));
                localStorage.setItem('trivia_answered', String(this.answered));
            },
            markExplored(id) { this.explored.add(id); this.save(); },
            markCatDone(tid, cid) { this.completedCats.add(tid + '|' + cid); this.save(); },
            recordAnswer(ok) { this.answered++; if (ok) this.correct++; this.save(); },
            reset() { this.explored.clear(); this.completedCats.clear(); this.correct = 0; this.answered = 0; this.save(); }
        };

        function catAud(topic, cat) { return cat.audience || topic.audience || 'family'; }
        function isCatVisible(topic, cat) { return AUD === 'all' || catAud(topic, cat) === AUD; }
        function visibleCats(topic) { return (topic.categories || []).filter(c => isCatVisible(topic, c)); }
        function topicAudiences(topic) {
            const set = new Set((topic.categories || []).map(c => catAud(topic, c)));
            return ['family', 'adult'].filter(a => set.has(a));
        }
        function audienceBadge(a) {
            return a === 'adult'
                ? el('span', { class: 'badge badge-adult', text: t('audAdults') })
                : el('span', { class: 'badge badge-family', text: t('audFamily') });
        }
        function topicProgress(topic) {
            const cats = visibleCats(topic);
            const done = cats.filter(c => stats.completedCats.has(topic.id + '|' + c.id)).length;
            return { done, total: cats.length };
        }

        // ============================ DOM HELPERS ============================
        function show(viewId) {
            currentView = viewId;
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            closeMenu();
            window.scrollTo(0, 0);

        function el(tag, opts = {}) {
            const node = document.createElement(tag);
            if (opts.class) node.className = opts.class;
            if (opts.text != null) node.textContent = opts.text;
            if (opts.html != null) node.innerHTML = opts.html;
            if (opts.onclick) node.onclick = opts.onclick;
            if (opts.attrs) for (const [k, v] of Object.entries(opts.attrs)) node.setAttribute(k, v);
            return node;
        }

        function toggleMenu() { document.getElementById('menu-panel').classList.toggle('open'); }

        // ============================ TRIVIA HOME ============================
        let homeSort = localStorage.getItem('trivia_sort') || 'title';

        function renderHome() {
            currentTopicIdx = null;
            const root = document.getElementById('view-home');

            if (!appData || !appData.topics) {
                root.appendChild(el('div', { class: 'card error-card', html: '⚠️ <strong>No topics loaded.</strong>' }));
                show('view-home');

            }

            const controls = el('div', { class: 'home-controls' });

                type: 'text', placeholder: t('search'), list: 'topic-suggestions', value: homeQuery } });

            const datalist = el('datalist', { attrs: { id: 'topic-suggestions' } });
            appData.topics.filter(x => (x.lang || 'en') === LANG)
                .forEach(x => datalist.appendChild(el('option', { attrs: { value: x.title } })));
            const sort = el('select', { class: 'sort-select' });
            [['title', t('sortTitle')], ['newest', t('sortNewest')], ['oldest', t('sortOldest')],
             ['progress', t('sortProgress')]].forEach(([v, label]) => {
                const o = el('option', { text: label, attrs: { value: v } });
                if (v === homeSort) o.selected = true;
                sort.appendChild(o);
            });
            sort.onchange = () => { homeSort = sort.value; localStorage.setItem('trivia_sort', homeSort); renderTopicList(); };
            controls.appendChild(search); controls.appendChild(datalist); controls.appendChild(sort);
            root.appendChild(controls);

            root.appendChild(el('div', { attrs: { id: 'topic-list' } }));
            renderTopicList();
            show('view-home');
        }

        function sortedFilteredTopics() {
            let list = (appData.topics || []).map((t2, i) => ({ t: t2, i }))
                .filter(({ t: x }) => (x.lang || 'en') === LANG);
            if (AUD !== 'all') list = list.filter(({ t: x }) => visibleCats(x).length > 0);
            const q = homeQuery.trim().toLowerCase();
            if (q) list = list.filter(({ t: x }) =>
                x.title.toLowerCase().includes(q) ||
                (x.categories || []).some(c => (c.title || '').toLowerCase().includes(q)));
            const cmp = {
                title: (a, b) => a.t.title.localeCompare(b.t.title),
                newest: (a, b) => String(b.t.created || '').localeCompare(String(a.t.created || '')),
                oldest: (a, b) => String(a.t.created || '').localeCompare(String(b.t.created || '')),
                progress: (a, b) => {
                    const pa = topicProgress(a.t), pb = topicProgress(b.t);
                    const da = pa.total && pa.done >= pa.total ? 1 : 0;
                    const db = pb.total && pb.done >= pb.total ? 1 : 0;
                    return da - db || a.t.title.localeCompare(b.t.title);
                },
            }[homeSort] || (() => 0);
            return list.sort(cmp);
        }

        function progressBadge(topic) {
            const { done, total } = topicProgress(topic);
            if (total && done >= total) return el('span', { class: 'badge badge-done', text: t('badgeDone') });
            if (done > 0) return el('span', { class: 'badge badge-partial', text: `${done}/${total}` });
            return el('span', { class: 'badge badge-new', text: t('badgeNew') });
        }

        function renderTopicList() {
            const container = document.getElementById('topic-list');
            if (!container) return;
            container.innerHTML = '';
            const list = sortedFilteredTopics();
            if (!list.length) {
                container.appendChild(el('div', { class: 'empty', text: homeQuery.trim() ? t('noMatch') : t('noTopics') }));
                return;
            }
            list.forEach(({ t: topic, i: tIdx }) => {
                const card = el('div', { class: 'card' });
                const headRow = el('div', { class: 'card-head-row' });
                headRow.appendChild(el('h3', { class: 'card-title', text: topic.title }));
                const badges = el('div', { attrs: { style: 'display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end' } });
                topicAudiences(topic).forEach(a => badges.appendChild(audienceBadge(a)));
                badges.appendChild(progressBadge(topic));
                headRow.appendChild(badges);
                card.appendChild(headRow);
                card.appendChild(el('p', { class: 'card-desc', text: topic.description || '' }));
                card.appendChild(el('button', { class: 'btn', text: t('explore'), onclick: () => openTopic(tIdx) }));
                container.appendChild(card);
            });
        }

        function renderAcademicTopicList() {
            const container = document.getElementById('academic-topic-list');
            if (!container) return;
            container.innerHTML = '';
            let list = (appData && appData.academic_topics || []).map((t2, i) => ({ t: t2, i }))
                .filter(({ t: x }) => (x.lang || 'en') === LANG);

            const q = academicQuery.trim().toLowerCase();
            if (q) {
                list = list.filter(({ t: x }) =>
                    x.title.toLowerCase().includes(q) ||
                    (x.categories || []).some(c => (c.title || '').toLowerCase().includes(q)));
            }

            if (!list.length) {
                container.appendChild(el('div', { class: 'empty', text: academicQuery.trim() ? t('noMatch') : t('noAcademicTopics') }));
                return;
            }

            list.forEach(({ t: topic, i: aIdx }) => {
                const card = el('div', { class: 'academic-topic-card', onclick: () => openAcademicTopic(aIdx) });
                const iconBox = el('div', { class: 'academic-topic-icon', text: topic.icon || '🎓' });
                const content = el('div', { class: 'academic-topic-content' });
                content.appendChild(el('div', { class: 'academic-topic-title', text: topic.title }));

                const totalQ = (topic.categories || []).reduce((n, c) => n + (c.trivia ? c.trivia.length : 0), 0);
                const meta = el('div', { class: 'academic-topic-meta' });
                meta.appendChild(el('span', { text: `${topic.categories ? topic.categories.length : 0} ${t('categories')}` }));
                meta.appendChild(el('span', { text: '•' }));
                meta.appendChild(el('span', { text: `${totalQ} Qs` }));
                meta.appendChild(progressBadge(topic));
                content.appendChild(meta);

                card.appendChild(iconBox);
                card.appendChild(content);
                card.appendChild(el('div', { class: 'academic-arrow', text: isRTLLang(LANG) ? '←' : '→' }));
                container.appendChild(card);
            });
        }

        // ============================ ACADEMIC TOPIC (COURSE SYLLABUS) ============================
        function openAcademicTopic(aIdx) {
            currentAcademicIdx = aIdx;
            const topic = appData.academic_topics[aIdx];
            stats.markExplored(topic.id);
            const root = document.getElementById('view-academic-topic');
            root.innerHTML = '';
            root.appendChild(el('button', { class: 'btn btn-ghost btn-back', text: t('allAcademicTopics'), onclick: renderAcademicHome }));

            const head = el('div', { class: 'card' });
            const titleRow = el('div', { attrs: { style: 'display:flex;align-items:center;gap:12px;margin-bottom:8px;' } });
            titleRow.appendChild(el('span', { attrs: { style: 'font-size:2.2rem;line-height:1;' }, text: topic.icon || '🎓' }));
            titleRow.appendChild(el('h2', { class: 'card-title', attrs: { style: 'margin:0;' }, text: topic.title }));
            head.appendChild(titleRow);

            if (topic.description) head.appendChild(el('p', { class: 'card-desc', html: formatMathAndText(topic.description) }));
            const totalQ = visibleCats(topic).reduce((n, c) => n + (c.trivia ? c.trivia.length : 0), 0);
            if (totalQ > 0)
                head.appendChild(el('button', { class: 'btn btn-academic btn-full', text: t('testCourse', { n: totalQ }), onclick: () => beginQuiz(aIdx, null, true) }));
            root.appendChild(head);

            root.appendChild(el('h3', { class: 'section-title', html: '📖 ' + t('syllabus') }));
            (topic.categories || []).forEach((cat, cIdx) => {
                if (!isCatVisible(topic, cat)) return;
                const card = el('div', { class: 'card lesson-card' });
                const headRow = el('div', { class: 'card-head-row' });
                const left = el('div');
                left.appendChild(el('span', { class: 'lesson-num', text: `${t('categories')} #${cIdx + 1}` }));
                left.appendChild(el('h3', { class: 'card-title', text: cat.title }));
                headRow.appendChild(left);

                const cbadges = el('div', { attrs: { style: 'display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end' } });
                if (stats.completedCats.has(topic.id + '|' + cat.id)) cbadges.appendChild(el('span', { class: 'badge badge-done', text: '✓' }));
                headRow.appendChild(cbadges);
                card.appendChild(headRow);

                if (cat.description) card.appendChild(el('p', { class: 'card-desc', html: formatMathAndText(cat.description) }));

                const btnRow = el('div', { class: 'btn-row' });
                btnRow.appendChild(el('button', { class: 'btn btn-academic', text: t('studyLesson'), onclick: () => openAcademicLesson(aIdx, cIdx) }));
                if (cat.trivia && cat.trivia.length)
                    btnRow.appendChild(el('button', { class: 'btn btn-ghost', text: t('practiceQuiz'), onclick: () => beginQuiz(aIdx, cIdx, true) }));
                card.appendChild(btnRow);
                root.appendChild(card);
            });
            show('view-academic-topic');
        }

        // ============================ ACADEMIC LESSON ============================
        function openAcademicLesson(aIdx, cIdx) {
            const topic = appData.academic_topics[aIdx];
            const cat = topic.categories[cIdx];
            const root = document.getElementById('view-academic-lesson');
            root.innerHTML = '';
            root.appendChild(el('button', { class: 'btn btn-ghost btn-back', text: '← ' + topic.title, onclick: () => openAcademicTopic(aIdx) }));

            const head = el('div', { class: 'card' });
            head.appendChild(el('span', { class: 'lesson-num', text: `${t('categories')} #${cIdx + 1}` }));
            head.appendChild(el('h2', { class: 'card-title', text: cat.title }));
            if (cat.description) head.appendChild(el('p', { class: 'narrative', html: formatMathAndText(cat.description) }));
            root.appendChild(head);

            if (Array.isArray(cat.cards) && cat.cards.length > 0) {
                cat.cards.forEach(sc => {
                    const sub = el('div', { class: 'card subcard' });
                    sub.appendChild(el('h3', { class: 'subcard-title', text: sc.title }));
                    if (sc.formula) {
                        sub.appendChild(el('div', { class: 'math-block', html: renderFormula(sc.formula) }));
                    }
                    if (sc.figure) {
                        const figBox = el('div', { class: 'figure-box' });
                        if (typeof sc.figure === 'object') {
                            if (sc.figure.title) figBox.appendChild(el('div', { class: 'figure-title', text: sc.figure.title }));
                            if (sc.figure.svg) figBox.appendChild(el('div', { class: 'figure-svg', html: sc.figure.svg }));
                            if (sc.figure.caption) figBox.appendChild(el('div', { class: 'figure-caption', html: formatMathAndText(sc.figure.caption) }));
                        } else if (typeof sc.figure === 'string') {
                            figBox.appendChild(el('div', { class: 'figure-svg', html: sc.figure }));
                        }
                        sub.appendChild(figBox);
                    }
                    (sc.points || []).forEach(pt => {
                        sub.appendChild(el('div', { class: 'point-item', html: formatMathAndText(pt) }));
                    });
                    root.appendChild(sub);
                });
            }

            if (cat.trivia && cat.trivia.length)
                root.appendChild(el('button', { class: 'btn btn-academic btn-full', text: t('startAcademicPractice', { n: cat.trivia.length }), onclick: () => beginQuiz(aIdx, cIdx, true) }));
            show('view-academic-lesson');
        }

        // ============================ TRIVIA TOPIC ============================
        function openTopic(tIdx) {
            currentTopicIdx = tIdx;
            const topic = appData.topics[tIdx];
            stats.markExplored(topic.id);
            const root = document.getElementById('view-topic');
            root.innerHTML = '';
            root.appendChild(el('button', { class: 'btn btn-ghost btn-back', text: t('allTopics'), onclick: renderHome }));

            const head = el('div', { class: 'card' });
            head.appendChild(el('h2', { class: 'card-title', text: topic.title }));
            head.appendChild(el('p', { class: 'card-desc', text: topic.description || '' }));
            const totalQ = visibleCats(topic).reduce((n, c) => n + (c.trivia ? c.trivia.length : 0), 0);
            if (totalQ > 0)
                head.appendChild(el('button', { class: 'btn btn-full', text: t('quizWhole', { n: totalQ }), onclick: () => beginQuiz(tIdx, null, false) }));
            root.appendChild(head);

            root.appendChild(el('h3', { class: 'section-title', html: '📚 ' + t('categories') }));
            (topic.categories || []).forEach((cat, cIdx) => {
                if (!isCatVisible(topic, cat)) return;
                const card = el('div', { class: 'card' });
                const headRow = el('div', { class: 'card-head-row' });
                headRow.appendChild(el('h3', { class: 'card-title', text: cat.title }));
                const cbadges = el('div', { attrs: { style: 'display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end' } });
                if (catAud(topic, cat) === 'adult') cbadges.appendChild(el('span', { class: 'badge badge-adult', text: t('audAdults') }));
                if (stats.completedCats.has(topic.id + '|' + cat.id)) cbadges.appendChild(el('span', { class: 'badge badge-done', text: '✓' }));
                headRow.appendChild(cbadges);
                card.appendChild(headRow);
                if (cat.description) card.appendChild(el('p', { class: 'card-desc', text: cat.description }));
                card.appendChild(el('button', { class: 'btn', text: t('learn'), onclick: () => openLearning(tIdx, cIdx) }));
                root.appendChild(card);
            });
            show('view-topic');
        }

        // ============================ TRIVIA LEARNING ============================
        function openLearning(tIdx, cIdx) {
            const topic = appData.topics[tIdx];
            const cat = topic.categories[cIdx];
            const root = document.getElementById('view-learning');
            root.innerHTML = '';
            root.appendChild(el('button', { class: 'btn btn-ghost btn-back', text: '← ' + topic.title, onclick: () => openTopic(tIdx) }));

            const hasCards = Array.isArray(cat.cards) && cat.cards.length > 0;
            const head = el('div', { class: 'card' });
            head.appendChild(el('h2', { class: 'card-title', text: cat.title }));
            if (cat.description) head.appendChild(el('p', { class: 'narrative', text: cat.description }));
            if (!hasCards) {
                head.appendChild(el('h3', { class: 'points-title', html: '💡 ' + t('keyPoints') }));
                (cat.points || []).forEach(pt => head.appendChild(el('div', { class: 'point-item', html: formatMathAndText(pt) })));
            }
            root.appendChild(head);

            if (hasCards) {
                cat.cards.forEach(sc => {
                    const sub = el('div', { class: 'card subcard' });
                    sub.appendChild(el('h3', { class: 'subcard-title', text: sc.title }));
                    (sc.points || []).forEach(pt => sub.appendChild(el('div', { class: 'point-item', html: formatMathAndText(pt) })));
                    root.appendChild(sub);
                });
            }

            if (cat.trivia && cat.trivia.length)
                root.appendChild(el('button', { class: 'btn btn-full', text: t('startTrivia', { n: cat.trivia.length }), onclick: () => beginQuiz(tIdx, cIdx, false) }));
            show('view-learning');
        }

        // ============================ QUIZ ============================
        let quiz = null;

        function getTopicSource(isAcademic, idx) {
            return isAcademic ? appData.academic_topics[idx] : appData.topics[idx];
        }

        function collectQuestions(tIdx, cIdx, isAcademic) {
            const topic = getTopicSource(isAcademic, tIdx);
            const cats = (cIdx == null) ? visibleCats(topic) : [topic.categories[cIdx]];
            const list = [];
            cats.forEach(cat => (cat.trivia || []).forEach(q => list.push({ q, catTitle: cat.title })));
            return list;
        }

        function shuffle(arr) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
            return a;
        }

        function beginQuiz(tIdx, cIdx, isAcademic = false) {
            const pool = collectQuestions(tIdx, cIdx, isAcademic);
            if (pool.length <= 5) { startQuiz(tIdx, cIdx, pool.length, isAcademic); return; }
            renderQuizSetup(tIdx, cIdx, pool.length, isAcademic);
        }

        function renderQuizSetup(tIdx, cIdx, total, isAcademic) {
            const root = document.getElementById('view-quiz');
            root.innerHTML = '';
            const backTo = isAcademic
                ? ((cIdx == null) ? () => openAcademicTopic(tIdx) : () => openAcademicLesson(tIdx, cIdx))
                : ((cIdx == null) ? () => openTopic(tIdx) : () => openLearning(tIdx, cIdx));

            root.appendChild(el('button', { class: 'btn btn-ghost btn-back', text: t('back'), onclick: backTo }));
            const card = el('div', { class: 'card' });
            card.appendChild(el('h2', { class: 'card-title', text: t('quizLength') }));
            card.appendChild(el('p', { class: 'card-desc', text: t('quizLengthPrompt', { n: total }) }));
            const opts = [5, 10, 20].filter(n => n < total);
            opts.push(total);
            opts.forEach(n => {
                const label = (n === total) ? t('allN', { n: total }) : t('nQuestions', { n });
                const b = el('button', {
                    class: 'btn btn-full' + (isAcademic ? ' btn-academic' : ''),
                    text: label,
                    onclick: () => startQuiz(tIdx, cIdx, n, isAcademic)
                });
                b.style.marginBottom = '10px';
                card.appendChild(b);
            });
            root.appendChild(card);
            show('view-quiz');
        }

        function startQuiz(tIdx, cIdx, limit, isAcademic) {
            let pool = collectQuestions(tIdx, cIdx, isAcademic);
            if (limit && limit < pool.length) pool = shuffle(pool).slice(0, limit);
            quiz = { tIdx, cIdx, limit: limit || pool.length, questions: pool, i: 0, score: 0, scope: (cIdx == null ? 'topic' : 'category'), isAcademic };
            renderQuestion();
            show('view-quiz');
        }

        function renderQuestion() {
            const root = document.getElementById('view-quiz');
            root.innerHTML = '';
            const total = quiz.questions.length;
            const item = quiz.questions[quiz.i];
            const q = item.q;
            const topic = getTopicSource(quiz.isAcademic, quiz.tIdx);
            const scopeLabel = quiz.scope === 'topic' ? topic.title : (item.catTitle || topic.title);

            const bar = el('div', { class: 'quiz-topbar' });
            bar.appendChild(el('span', { class: 'quiz-scope', text: scopeLabel }));
            bar.appendChild(el('span', { text: t('questionOf', { i: quiz.i + 1, n: total }) + '  •  ' + t('score', { s: quiz.score }) }));
            root.appendChild(bar);

            const track = el('div', { class: 'progress-track' });
            track.appendChild(el('div', { class: 'progress-fill', attrs: { style: `width:${(quiz.i / total) * 100}%` } }));
            root.appendChild(track);

            const card = el('div', { class: 'card' });
            card.appendChild(el('p', { class: 'quiz-question', html: formatMathAndText(q.question) }));
            if (q.type === 'single_qa') renderQA(card, q); else renderMC(card, q);
            root.appendChild(card);
        }

        function nextButton(card) {
            const last = quiz.i >= quiz.questions.length - 1;
            const btn = el('button', {
                class: 'btn btn-full' + (quiz.isAcademic ? ' btn-academic' : ''),
                text: last ? t('seeResults') : t('next'),
                onclick: () => { if (last) renderSummary(); else { quiz.i++; renderQuestion(); } }
            });
            btn.style.marginTop = '18px';
            card.appendChild(btn);
        }

        function renderMC(card, q) {
            const wrap = el('div');
            let answered = false;
            (q.options || []).forEach((opt, oIdx) => {
                const b = el('button', { class: 'option-btn', html: formatMathAndText(opt) });
                b.onclick = () => {
                    if (answered) return;
                    answered = true;
                    const ok = (oIdx === q.correct);
                    [...wrap.children].forEach((child, idx) => {
                        child.disabled = true;
                        if (idx === q.correct) child.classList.add('correct');
                        else if (idx === oIdx) child.classList.add('incorrect');
                    });
                    if (ok) quiz.score++;
                    stats.recordAnswer(ok);
                    nextButton(card);
                };
                wrap.appendChild(b);
            });
            card.appendChild(wrap);
        }

        function renderQA(card, q) {
            const revealBtn = el('button', { class: 'btn btn-full', text: t('reveal') });
            revealBtn.onclick = () => {
                revealBtn.remove();
                const box = el('div', { class: 'reveal-box' });
                box.appendChild(el('span', { class: 'label', text: t('answer') }));
                box.appendChild(el('span', { class: 'answer', html: formatMathAndText(q.answer) }));
                card.appendChild(box);
                card.appendChild(el('p', { class: 'self-grade-q', text: t('didYouGet') }));
                const row = el('div', { class: 'btn-row' });
                const grade = (ok) => {
                    if (ok) quiz.score++;
                    stats.recordAnswer(ok);
                    row.remove();
                    const gq = card.querySelector('.self-grade-q'); if (gq) gq.remove();
                    nextButton(card);
                };
                row.appendChild(el('button', { class: 'btn btn-success', text: t('gotIt'), onclick: () => grade(true) }));
                row.appendChild(el('button', { class: 'btn btn-danger', text: t('missed'), onclick: () => grade(false) }));
                card.appendChild(row);
            };
            card.appendChild(revealBtn);
        }

        function renderSummary() {
            const topic = getTopicSource(quiz.isAcademic, quiz.tIdx);
            if (quiz.scope === 'category') stats.markCatDone(topic.id, topic.categories[quiz.cIdx].id);
            else (topic.categories || []).forEach(c => stats.markCatDone(topic.id, c.id));

            const root = document.getElementById('view-summary');
            root.innerHTML = '';
            const total = quiz.questions.length, score = quiz.score, pct = total ? score / total : 0;
            let emoji = '🌟', msg = t('perfect');
            if (pct < 1) { emoji = '🎉'; msg = t('greatJob'); }
            if (pct < 0.7) { emoji = '👍'; msg = t('niceEffort'); }
            if (pct < 0.4) { emoji = '📚'; msg = t('keepLearning'); }

            const card = el('div', { class: 'card' });
            const s = el('div', { class: 'summary-score' });
            s.appendChild(el('span', { class: 'big', text: `${score}/${total}` }));
            s.appendChild(el('div', { class: 'msg', text: `${emoji} ${msg}` }));
            card.appendChild(s);
            root.appendChild(card);

            const row = el('div', { class: 'btn-row' });
            row.appendChild(el('button', { class: 'btn btn-ghost', text: t('tryAgain'), onclick: () => startQuiz(quiz.tIdx, quiz.cIdx, quiz.limit, quiz.isAcademic) }));
            if (quiz.isAcademic) {
                if (quiz.scope === 'category')
                    row.appendChild(el('button', { class: 'btn btn-academic', text: t('backToLearning'), onclick: () => openAcademicLesson(quiz.tIdx, quiz.cIdx) }));
                else
                    row.appendChild(el('button', { class: 'btn btn-academic', text: t('backToTopic'), onclick: () => openAcademicTopic(quiz.tIdx) }));
            } else {
                if (quiz.scope === 'category')
                    row.appendChild(el('button', { class: 'btn', text: t('backToLearning'), onclick: () => openLearning(quiz.tIdx, quiz.cIdx) }));
                else
                    row.appendChild(el('button', { class: 'btn', text: t('backToTopic'), onclick: () => openTopic(quiz.tIdx) }));
            }
            root.appendChild(row);
            show('view-summary');
        }

        // ============================ STATISTICS ============================
        function renderStats() {
            const root = document.getElementById('view-stats');
            root.innerHTML = '';
            root.appendChild(el('button', {
                class: 'btn btn-ghost btn-back', text: t('back'),
                onclick: () => (currentMode === 'academic' ? renderAcademicHome() : renderHome())
            }));

            const acc = stats.answered ? Math.round((stats.correct / stats.answered) * 100) : 0;
            const grid = el('div', { class: 'stat-grid' });
            [[t('topicsExplored'), stats.explored.size], [t('questionsAnswered'), stats.answered],
             [t('correctAnswers'), stats.correct], [t('accuracy'), acc + '%']].forEach(([l, n]) => {
                const box = el('div', { class: 'stat-box' });
                box.appendChild(el('div', { class: 'n', text: String(n) }));
                box.appendChild(el('div', { class: 'l', text: l }));
                grid.appendChild(box);
            });
            const card = el('div', { class: 'card' });
            card.appendChild(el('h2', { class: 'card-title', text: t('yourStats') }));
            card.appendChild(grid);
            root.appendChild(card);

            const allTopics = [...((appData && appData.topics) || []), ...((appData && appData.academic_topics) || [])]
                .filter(x => (x.lang || 'en') === LANG);

            if (allTopics.length) {
                const prog = el('div', { class: 'card' });
                prog.appendChild(el('h3', { class: 'section-title', html: '📈 ' + t('topicProgress') }));
                allTopics.forEach(topic => {
                    const { done, total } = topicProgress(topic);
                    const row = el('div', { class: 'prog-row' });
                    const isAcad = topic.type === 'academic';
                    row.appendChild(el('span', { text: (isAcad ? (topic.icon || '🎓') + ' ' : '') + topic.title }));
                    row.appendChild(el('span', { text: total ? t('nCategories', { done, total }) : '—', attrs: { style: 'color:var(--muted)' } }));
                    prog.appendChild(row);
                });
                root.appendChild(prog);
            }
            show('view-stats');
        }

        // ============================ DATA LOADING ============================
        const DB_NAME = 'FamilyTriviaDB', DB_VERSION = 2, STORE = 'app_data', KEY = 'trivia_json';
        function openDB() {
            return new Promise((resolve, reject) => {
                const r = indexedDB.open(DB_NAME, DB_VERSION);
                r.onupgradeneeded = (e) => { const db = e.target.result; if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE); };
                r.onsuccess = (e) => resolve(e.target.result);
                r.onerror = (e) => reject(e.target.error);
            });
        }
        function idbGet(db) { return new Promise((res, rej) => { const tx = db.transaction(STORE, 'readonly').objectStore(STORE).get(KEY); tx.onsuccess = (e) => res(e.target.result); tx.onerror = (e) => rej(e.target.error); }); }
        function idbPut(db, d) { return new Promise((res, rej) => { const tx = db.transaction(STORE, 'readwrite').objectStore(STORE).put(d, KEY); tx.onsuccess = () => res(); tx.onerror = (e) => rej(e.target.error); }); }

        function initLang() {
            const avail = availableLangs();
            if (!avail.includes(LANG)) {
                const nav = (navigator.language || '').slice(0, 2).toLowerCase();
                LANG = avail.includes(nav) ? nav : (avail.includes('en') ? 'en' : (avail[0] || 'en'));
            }
        }

        async function loadDatabase() {
            let db = null;
            try { db = await openDB(); } catch (e) { console.warn('IndexedDB unavailable:', e); }
            try {
                const res = await fetch('data.json', { cache: 'no-store' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                appData = await res.json();
                if (db) { try { await idbPut(db, appData); } catch (e) { console.warn('cache write failed', e); } }
            } catch (netErr) {
                console.warn('Network load failed, trying offline cache...', netErr);
                if (db) { try { appData = await idbGet(db); } catch (e) { console.error('IndexedDB read failed', e); } }
            }
            if (appData && (appData.topics || appData.academic_topics)) {
                initLang();
                applyLang(LANG);
            } else {
                document.getElementById('view-home').innerHTML = '<div class="card error-card">' + t('offlineFail') + '</div>';
            }
        }

        // ============================ INIT ============================
        applyTheme(localStorage.getItem('trivia_theme') || 'daylight');
        document.documentElement.setAttribute('lang', LANG);
        document.documentElement.setAttribute('dir', isRTLLang(LANG) ? 'rtl' : 'ltr');
        renderMenuLabels();
        document.getElementById('menu-btn').onclick = toggleMenu;
        document.getElementById('mode-toggle-btn').onclick = toggleAppMode;
        document.getElementById('btn-header-home').onclick = () => (currentMode === 'academic' ? renderAcademicHome() : renderHome());
        document.getElementById('menu-academic').onclick = () => setAppMode('academic');
        document.getElementById('menu-trivia').onclick = () => setAppMode('trivia');
        document.getElementById('menu-stats').onclick = renderStats;
        document.getElementById('menu-reset').onclick = () => {
            if (confirm(t('resetConfirm'))) {
                stats.reset();
                closeMenu();
                if (currentMode === 'academic') renderAcademicHome();
                else renderHome();
            }
        };

        window.addEventListener('DOMContentLoaded', loadDatabase);
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registered', reg.scope))
                    .catch(err => console.error('SW registration failed', err));
            });
        }
    </script>
</body>
