title: "ביולוגיה מולקולרית וגנטיקה למהנדסים (ביולוגיה 101)"
description: >
  מסע הנדסי מתוך עקרונות יסוד: מערכת ההפעלה התאית, מכונות מולקולריות, אחסון מידע גנטי,
  ביואנרגטיקה מטבולית, אלגוריתמים אבולוציוניים והנדסה גנטית מודרנית מבוססת קריספר (CRISPR).
lang: he
audience: family
categories:
  - id: cellular_architecture_bioenergetics
    title: "1. ארכיטקטורת התא, קרומיות ביולוגיות וביואנרגטיקה"
    description: >
      חקר החומרה המיקרוסקופית של החיים: מדוריות אברונים בתא, תובלה מולקולרית דרך שכבה פוספוליפידית כפולה,
      וייצור אנרגיית ATP על ידי מנועים מולקולריים מסתובבים.
    cards:
      - title: "מדוריות התא: אברונים כמפעלי ייצור מיקרוסקופיים"
        figure:
          title: "ארכיטקטורת המדוריות בתא איקריוטי"
