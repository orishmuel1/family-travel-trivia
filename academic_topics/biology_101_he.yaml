          caption: "תאים איקריוטיים משתמשים באברונים מוקפי קרום כדי להפריד בין ריאקציות כימיות שאינן תואמות: הגרעין שומר על הקוד, והמיטוכונדריה מפיקה אנרגיה."
        points:
          - "כל היצורים החיים בנויים מתאים — יחידות המבנה האטומיות הבסיסיות של הביולוגיה. החיים מתחלקים לשתי ארכיטקטורות עיקריות: פרוקריוטים (חיידקים וארכאונים חסרי מידור קרומי פנימי) ואיקריוטים (תאים מורכבים בעלי אברונים מופרדים, הכוללים בעלי חיים, צמחים ופטריות)."
          - "גרעין התא מתפקד כחדר השרתים המאובטח של התא, ובו ארוז הגנום השלם במולקולות דנ״א דו-גדיליות מאחורי מעטפת גרעין כפולה המחוררת בנקבוביות בררניות."
          - "אברונים מותאמים מבצעים משימות סדרתיות: הרשת האנדופלזמית (ER) מייצרת שומנים ומסייעת בקיפול פפטידים; מערכת גולג׳י מתפקדת כמרכז המיון, התיוג והשילוח של חלבונים בתוך בועיות; וליזוזומים פועלים כמפעלי מחזור הפולטים אנזימי פירוק חומציים."
          - "תאוריית האנדוסימביוזה (שביססה לין מרגוליס) מוכיחה כי המיטוכונדריה והכלורופלסטים התפתחו מחיידקים עצמאיים קדומים שנבלעו על ידי תא מארח לפני כ-1.5 מיליארד שנים, ומשמרים עד היום גנום מעגלי עצמאי וריבוזומים חיידקיים משלהם."
      - title: "קרום התא הליפידי ומשאבות תובלה אקטיביות"
        points:
          - "כל תא עטוף בקרום פלזמה הבנוי משכבה פוספוליפידית אמפיפתית כפולה: ראשי פוספט פולריים חובבי מים (הידרופיליים) פונים כלפי פנים וחוץ התא, בעוד זנבות חומצות שומן דוחי מים (הידרופוביים) נכלאים במרכז, ויוצרים מחסום בלתי חדיר ליונים ולמולקולות גדולות."
          - "מודל הפסיפס הנוזלי מתאר את הקרום כמטריצה דו-ממדית נוזלית שבה חלבונים חוצי-קרום ומולקולות כולסטרול נעים לצדדים, ומשמרים גמישות מכנית בתנאי טמפרטורה משתנים."
          - "תובלה פסיבית מתרחשת עם מורד מפל הריכוזים ללא השקעת אנרגיה: דיפוזיה פשוטה של גזים קטנים לא-קוטביים ($O_2, CO_2$), ודיפוזיה מואצת של מים דרך תעלות חלבוניות ייעודיות (אקוופורינים)."
          - "תובלה פעילה מזרימה חומרים כנגד מפל הריכוזים באמצעות פירוק מולקולות אנרגיה. משאבת נתרן-אשלגן ($Na^+/K^+$ ATPase) מפרקת מולקולת ATP אחת כדי להוציא 3 יוני $Na^+$ אל מחוץ לתא ולהכניס 2 יוני $K^+$ פנימה, ויוצרת את מתח המנוחה החשמלי ($-70\\text{ mV}$) המאפשר פולסים עצביים ותובלת מזון."
      - title: "ביואנרגטיקה: סינתזת ATP ומנוע הרוטור המיטוכונדריאלי"
        points:
          - "אדנוזין טריפוספט (ATP) הוא סוללת האנרגיה הכימית האוניברסלית של עולם החי. הידרוליזה של ATP ל-ADP ופוספט אי-אורגני משחררת כ-$-30.5\\text{ kJ/mol}$ של אנרגיית גיבס חופשית ($\\Delta G^\\circ$), שהתא מצמד בריאקציות מותאמות כדי להניע תהליכים מטבוליים הדורשים אנרגיה."
          - "נשימה תאית ממצה אנרגיה מגלוקוז ($C_6H_{12}O_6 + 6O_2 \\to 6CO_2 + 6H_2O + \\sim 32\\text{ ATP}$) בשלושה שלבים סדרתיים: (1) גליקוליזה בציטוזול (אנאירובית, מפרקת גלוקוז לשני פירובטים), (2) מעגל קרבס במטריקס של המיטוכונדריה, הפורק אלקטרונים עתירי אנרגיה אל הנשאים $NADH$ ו-$FADH_2$."
          - "שרשרת מעבר האלקטרונים: בקרום המיטוכונדריה הפנימי, אלקטרונים עוברים דרך ארבעה קומפלקסים חלבוניים אל החמצן, ומפעילים משאבות פרוטונים הדוחסות יוני $H^+$ לחלל הבין-קרומי, ויוצרות מפל ריכוזים אלקטרוכימי תלול."
          - "כימואוסמוזה ומנוע ה-ATP סינתאז: יוני הפרוטון שואפים לחזור למטריקס וזורמים דרך האנזים ATP סינתאז, המהווה ננו-מנוע מכני מסתובב לכל דבר. זרימת הפרוטונים מסובבת את ציר המנוע במהירות של עד 6,000 סל״ד, ודוחסת פיזית מולקולות ADP ופוספט ליצירת ATP ביעילות תרמודינמית מדהימה."
    trivia:
      - type: multiple_choice
        question: "איזה מטבע אנרגיה כימי אוניברסלי משמש את כל התאים החיים להנעת תהליכים מטבוליים?"
        options:
          - "אדנוזין טריפוספט (ATP)"
          - "חומצה דאוקסיריבונוקלאית (דנ״א)"
          - "גלוקוז-6-פוספט"
          - "כולסטרול אסטר"
        correct: 0
        explanation: "מולקולת ה-ATP פועלת כסוללה נטענת: ביקוע קשר הפוספט העתיר באנרגיה משחרר אנרגיה חופשית המניעה ריאקציות תאיות."
      - type: multiple_choice
        question: "על פי תאוריית האנדוסימביוזה, מה היה מקורן האבולוציוני של המיטוכונדריות בתוך התאים האיקריוטיים?"
        options:
          - "חיידקים קדומים אווירניים שנבלעו על ידי תא מארח קדום לפני מעל מיליארד שנים"
          - "התגבשות ספונטנית של טיפות שומן בציטופלזמה"
          - "הנצה של קרום הגרעין בעקבות זיהום נגיפי"
          - "שרידי חלבונים שהתאבנו ליד פתחים הידרותרמיים געשיים"
        correct: 0
        explanation: "המיטוכונדריות התפתחו מחיידקים עצמאיים שנבלעו באנדוסימביוזה, כפי שמעידים הדנ״א המעגלי שלהן והריבוזומים החיידקיים."
      - type: multiple_choice
        question: "כמה יוני נתרן (Na+) ויוני אשלגן (K+) מעבירה משאבת הנתרן-אשלגן עבור כל מולקולת ATP שהיא מפרקת?"
        options:
          - "3 יוני נתרן החוצה, ו-2 יוני אשלגן פנימה"
          - "2 יוני נתרן החוצה, ו-3 יוני אשלגן פנימה"
          - "יון נתרן אחד החוצה, ויון אשלגן אחד פנימה"
          - "4 יוני נתרן פנימה, ו-2 יוני אשלגן החוצה"
        correct: 0
        explanation: "משאבת Na+/K+ מוציאה 3 יוני נתרן ומכניסה 2 יוני אשלגן נגד מפל הריכוזים, ובכך יוצרת מתח קרום שלילי בתא."
      - type: multiple_choice
        question: "איזה אברון תאי מתפקד כמרכז הלוגיסטיקה, התיוג והמשלוח של חלבונים המיוצרים ברשת האנדופלזמית?"
        options:
          - "מערכת גולג׳י (Golgi Apparatus)"
          - "ליזוזום"
          - "פרוקסיזום"
          - "צנטרוזום"
        correct: 0
        explanation: "מערכת גולג׳י מקבלת חלבונים מהרשת האנדופלזמית, מוסיפה להם סוכרים (גליקוזילציה), ממיינת אותם ואורזת אותם בבועיות ליעדם."
      - type: multiple_choice
        question: "איזה מנגנון פיזיקלי מניע את ייצור ה-ATP על ידי האנזים המולקולרי ATP סינתאז במיטוכונדריה?"
        options:
          - "זרימת פרוטונים במורד מפל אלקטרוכימי מסובבת פיזית ציר רוטור מולקולרי"
          - "שריפה ישירה של מולקולות גלוקוז בתוך האתר הפעיל"
          - "ביקוע גרעיני של איזוטופי זרחן בתוך המטריקס"
          - "בליעת אור שמש על ידי פיגמנטים במיטוכונדריה"
        correct: 0
        explanation: "האנזים ATP סינתאז פועל כמנוע סיבובי מולקולרי: מפל ריכוזי הפרוטונים מסובב את תת-היחידה F0, ודוחס מכנית ADP ופוספט ל-ATP."
      - type: multiple_choice
        question: "איזו תכונה מבנית מאפיינת את מולקולות הפוספוליפידים בקרום התא, ומאפשרת להן להסתדר בספונטניות בשכבה כפולה במים?"
        options:
          - "אופי אמפיפתי: ראשי פוספט הידרופיליים (אוהבי מים) וזנבות שומן הידרופוביים (דוחי מים)"
          - "היותן מורכבות אך ורק משעוות פחמימניות לא קוטביות"
          - "היותן מוחזקות באמצעות קשרים מתכתיים הדוקים"
          - "מטען חיובי קבוע על כל חלקי המולקולה"
        correct: 0
        explanation: "הפוספוליפידים הם אמפיפתיים: הראשים הפולריים פונים למים והזנבות הלא-פולריים מתכנסים פנימה, ויוצרים מעטפת דו-שכבתית יציבה."
      - type: multiple_choice
        question: "איזה מסלול מטבולי בציטופלזמה מפרק גלוקוז לפירובט ללא צורך בנוכחות חמצן (אנאירובי)?"
        options:
          - "גליקוליזה"
          - "מעגל קרבס"
          - "זרחון חמצוני"
          - "מעגל קלווין"
        correct: 0
        explanation: "גליקוליזה היא מסלול אנאירובי קדום המתרחש בציטוזול ומפרק גלוקוז לשני פירובטים, תוך הפקת 2 מולקולות ATP ו-2 NADH."
      - type: multiple_choice
        question: "מהו תפקידם העיקרי של הליזוזומים בתאי בעלי חיים?"
        options:
          - "פירוק ומחזור של פסולת תאית, אברונים פגומים ופתוגנים באמצעות אנזימי עיכול חומציים"
          - "שכפול הדנ״א הגנומי לקראת חלוקת התא"
          - "ייצור גלוקוז באמצעות פוטוסינתזה"
          - "שאיבת יוני סידן אל הנוזל החוץ-תאי"
        correct: 0
        explanation: "הליזוזומים מכילים אנזימי הידרוליזה הפועלים בסביבה חומצית (pH כ-4.5) ומפרקים חומרי פסולת בתהליך המכונה אוטופגיה."
      - type: multiple_choice
        question: "מה משמש כקולט האלקטרונים הסופי בסוף שרשרת מעבר האלקטרונים במיטוכונדריה בנשימה אווירנית?"
        options:
          - "חמצן מולקולרי (O2)"
          - "פחמן דו-חמצני (CO2)"
          - "חנקן גזי (N2)"
          - "גלוקוז"
        correct: 0
        explanation: "חמצן מולקולרי קולט את האלקטרונים בסוף השרשרת ומתחבר עם פרוטונים ליצירת מים, מה שמונע חסימה של השרשרת."
      - type: multiple_choice
        question: "אילו תעלות חלבוניות ייעודיות מאפשרות דיפוזיה פסיבית ומהירה של מולקולות מים דרך קרומי התאים?"
        options:
          - "אקוופורינים (Aquaporins)"
          - "תעלות נתרן תלויות מתח"
          - "צמתי מעבר (Gap junctions)"
          - "נקבוביות הגרעין"
        correct: 0
        explanation: "פיטר אגרה זכה בפרס נובל על גילוי האקוופורינים — תעלות מיוחדות המזרימות מיליארדי מולקולות מים בשנייה דרך הקרום."
      - type: multiple_choice
        question: "איזה הבדל מבני יסודי מבדיל בין תאים פרוקריוטיים (כגון חיידקי אי-קולי) לתאים איקריוטיים (כגון תאי אדם)?"
        options:
          - "לפרוקריוטים אין גרעין תא מוקף קרום ואין אברונים פנימיים מוקפי קרום"
          - "פרוקריוטים אינם מכילים חומר גנטי או דנ״א כלל"
          - "פרוקריוטים נראים תמיד לעין בלתי מזוינת"
          - "לאיקריוטים אין קרום תא שומני"
        correct: 0
        explanation: "פרוקריוטים מחזיקים דנ״א מעגלי חופשי באזור המכונה נוקלאואיד, ואינם מכילים אברונים מוקפי קרום כמיטוכונדריות או גולג׳י."
      - type: multiple_choice
        question: "איזה רכיב שומני משולב בקרום התא של בעלי חיים ומווסת את מידת נזילותו בטמפרטורות משתנות?"
        options:
          - "כולסטרול"
          - "תאית"
          - "גליקוגן"
          - "עמילן"
        correct: 0
        explanation: "הכולסטרול מווסת את גמישות הקרום: בחום הוא מונע נזילות יתר, ובקור הוא מונע קפיאה והתקשחות של חומצות השומן."
      - type: multiple_choice
        question: "היכן בתא איקריוטי מתרחש מעגל חומצת הלימון (מעגל קרבס)?"
        options:
          - "במטריקס של המיטוכונדריה"
          - "בציטוזול"
          - "בתוך הגרעינון"
          - "בחלל הרשת האנדופלזמית"
        correct: 0
        explanation: "לאחר כניסת הפירובט למיטוכונדריה והמרתו לאצטיל-קואנזים A, מעגל קרבס מתבצע במטריקס הנוזלי של המיטוכונדריה."
      - type: multiple_choice
        question: "איזה אברון פנימי בתוך גרעין התא אחראי לשעתוק רנ״א ריבוזומי (rRNA) ולהרכבת תת-היחידות של הריבוזום?"
        options:
          - "הגרעינון (Nucleolus)"
          - "הצנטרוזום"
          - "הפרוקסיזום"
          - "החלולית"
        correct: 0
        explanation: "הגרעינון הוא אזור צפוף ובלתי מוקף קרום בתוך הגרעין, המוקדש כולו לייצור רנ״א ריבוזומי והרכבת ריבוזומים."
      - type: multiple_choice
        question: "מהו הכוח התרמודינמי המניע דיפוזיה פסיבית פשוטה של מומסים דרך קרום חדיר?"
        options:
          - "השאיפה למקסם אנטרופיה על ידי פיזור חלקיקים מאזור בריכוז גבוה לאזור בריכוז נמוך"
          - "פירוק מולקולות ATP ישירות על פני שטח הקרום"
          - "משיכת כבידה בין חלקיקי המומס"
          - "דחייה חשמלית מגרעין התא"
        correct: 0
        explanation: "דיפוזיה מונעת על ידי החוק השני של התרמודינמיקה: תנועה תרמית אקראית (תנועה בראונית) מפזרת מולקולות ומגדילה את האנטרופיה."

  - id: dna_rna_central_dogma
    title: "2. מבנה הדנ״א, שכפול והדוגמה המרכזית של הביולוגיה"
    description: >
      שליטה בקוד הדיגיטלי של עולם החי: מבנה הסליל הכפול האנטי-מקבילי, מנגנון שכפול הדנ״א,
      שעתוק לרנ״א שליח ותרגום הקוד הגנטי האוניברסלי בריבוזומים.
    cards:
      - title: "מבנה הדנ״א: הסליל הכפול וכללי צימוד הבסיסים"
        figure:
          title: "הדוגמה המרכזית של הביולוגיה המולקולרית"
          svg: >
            <svg viewBox="0 0 520 150" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-height:150px;">
              <rect x="25" y="45" width="100" height="60" rx="8" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="2"/>
              <text x="75" y="72" font-size="13" font-weight="bold" fill="#3b82f6" text-anchor="middle">דנ״א</text>
              <text x="75" y="88" font-size="9" fill="currentColor" text-anchor="middle">A, T, G, C (אחסון)</text>

              <path d="M 130 75 L 205 75" stroke="#ec4899" stroke-width="2.5"/>
              <polygon points="200,70 210,75 200,80" fill="#ec4899"/>
              <text x="170" y="65" font-size="9" font-weight="bold" fill="#ec4899" text-anchor="middle">שעתוק</text>

              <rect x="210" y="45" width="100" height="60" rx="8" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-width="2"/>
              <text x="260" y="72" font-size="13" font-weight="bold" fill="#ec4899" text-anchor="middle">רנ״א שליח</text>
              <text x="260" y="88" font-size="9" fill="currentColor" text-anchor="middle">A, U, G, C (הודעה)</text>

              <path d="M 315 75 L 390 75" stroke="#10b981" stroke-width="2.5"/>
              <polygon points="385,70 395,75 385,80" fill="#10b981"/>
              <text x="355" y="65" font-size="9" font-weight="bold" fill="#10b981" text-anchor="middle">תרגום</text>

              <rect x="395" y="45" width="100" height="60" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="2"/>
              <text x="445" y="72" font-size="13" font-weight="bold" fill="#10b981" text-anchor="middle">חלבון</text>
              <text x="445" y="88" font-size="9" fill="currentColor" text-anchor="middle">20 חומצות אמינו</text>
            </svg>
          caption: "הדוגמה המרכזית מתארת את זרימת המידע הביולוגי: הדנ״א הקבוע משוכתב לרנ״א שליח ארעי, המתורגם לחלבונים מבניים וקטליטיים."
        points:
          - "חומצה דאוקסיריבונוקלאית (דנ״א) היא הפולימר שבו מקודד כל המידע התורשתי. כל נוקלאוטיד מורכב מסוכר דאוקסיריבוז, קבוצת פוספט טעונה שלילית ואחד מארבעה בסיסים חנקניים: אדנין ($A$), תימין ($T$), גואנין ($G$) או ציטוזין ($C$)."
          - "ווטסון, קריק ורוזלינד פרנקלין פענחו את מבנה הסליל הכפול: שני גדילים אנטי-מקביליים הנעים בכיוונים מנוגדים ($5'\\to 3'$ ו-$3'\\to 5'$). שלד הסוכר-פוספט פונה החוצה כעמוד שדרה, בעוד הבסיסים פונים פנימה כשלבי סולם."
          - "צימוד בסיסים משלים (כללי שרגף): אדנין נקשר אך ורק לתימין באמצעות שני קשרי מימן ($A=T$), בעוד גואנין נקשר אך ורק לציטוזין באמצעות שלושה קשרי מימן ($G\\equiv C$). בשל הקשר המשולש, דנ״א עשיר ב-GC יציב יותר תרמית ודורש טמפרטורה גבוהה יותר להפרדה."
          - "המבנה המרחבי יוצר חריץ גדול (Major Groove) וחריץ קטן (Minor Groove). חלבוני בקרה ושעתוק (גורמי שעתוק) מזהים את רצף האותיות הגנטי דרך החריץ הגדול מבלי לפרום את הסליל הכפול."
      - title: "מנגנון שכפול הדנ״א בדיוק מולקולרי גבוה"
        points:
          - "שכפול הדנ״א הוא חצי-משמר (הוכח על ידי מסלסון וסטאל): כל מולקולת סליל כפול חדשה כוללת גדיל הורי מקורי ששימש כתבנית וגדיל בת חדש שסונתז."
          - "השכפול נפתח באתרי מוצא ייעודיים (Origin of Replication). אנזים ההליקאז פורם את הגדילים המפותלים, בעוד חלבונים קושרי חד-גדיל (SSB) מונעים מהם להתחבר מחדש."
          - "אסימטרית הסינתזה: אנזים הדנ״א פולימראז יכול לסנתז גדיל חדש אך ורק בכיוון $5'\\to 3'$, וזקוק למקטע תחילה קצר (פריימר של רנ״א). הגדיל המוביל מסונתז ברציפות לכיוון מזלג השכפול, בעוד הגדיל המפגר מסונתז במקטעים מקוטעים הנקראים מקטעי אוקזקי."
          - "לדנ״א פולימראז מנגנון הגהה מובנה ($3'\\to 5'$ אקסונוקלאז) המזהה שגיאות ומסלק בסיסים שגויים, ומקטין את שיעור הטעויות לפחות משגיאה אחת ל-100 מיליון בסיסים."
      - title: "שעתוק, עיבוד רנ״א ותרגום הקוד הגנטי"
        points:
          - "שעתוק: בגרעין התא, האנזים רנ״א פולימראז נקשר לרצפי פרומוטור (כגון תיבת TATA) ומעתיק את גדיל התבנית למולקולת רנ״א שליח (mRNA). ברנ״א, הבסיס אורציל ($U$) מחליף את התימין ($T$), והסוכר הוא ריבוז."
          - "עיבוד ה-mRNA באיקריוטים: טרם יציאתו לציטופלזמה, התעתיק עובר שלושה שלבים: (1) הוספת כיפה מגנה בקצה 5', (2) הוספת זנב פולי-A מייצב בקצה 3', ו-(3) שחבור (Splicing) על ידי הספלייסוזום, המסלק אינטרונים לא-מקודדים ומחבר אקסונים מקודדים."
          - "הקוד הגנטי הוא קוד שלשות מנוון: כל רצף של שלושה נוקלאוטידים מהווה קודון המקודד לאחת מ-20 חומצות האמינו. ישנם $4^3 = 64$ קודונים אפשריים: 61 מקודדים לחומצות אמינו (AUG משמש כקודון התחלה למתיונין) ו-3 משמשים כקודוני עצירה (UAA, UAG, UGA)."
          - "תרגום בריבוזום: מולקולות רנ״א מוביל (tRNA) נושאות חומצת אמינו ספציפית ומתאימות אנטי-קודון לקודון שעל ה-mRNA. הריבוזום מזרז יצירת קשרים פפטידיים ומחבר את חומצות האמינו לשרשרת חלבונית שלמה."
    trivia:
      - type: multiple_choice
        question: "איזה צמד בסיסים בדנ״א מוחזק באמצעות שלושה קשרי מימן, ומקנה יציבות תרמית גבוהה יותר לגדיל?"
        options:
          - "גואנין וציטוזין (G ≡ C)"
          - "אדנין ותימין (A = T)"
          - "אדנין ואורציל (A = U)"
          - "ציטוזין ותימין (C = T)"
        correct: 0
        explanation: "בין גואנין לציטוזין נוצרים 3 קשרי מימן (לעומת 2 בין אדנין לתימין), ולכן דנ״א עשיר ב-GC דורש טמפרטורה גבוהה יותר להתכה."
      - type: multiple_choice
        question: "באיזה כיוון ביוכימי בלבד מסוגל אנזים הדנ״א פולימראז לסנתז גדיל דנ״א חדש?"
        options:
          - "מכיוון '5 לכיוון '3 בלבד"
          - "מכיוון '3 לכיוון '5 בלבד"
          - "בשני הכיוונים ללא כל הגבלה"
          - "מהצנטרומר אל הטלומר בלבד"
        correct: 0
        explanation: "דנ״א פולימראז יכול להוסיף נוקלאוטידים אך ורק לקצה 3'-OH הפנוי, ולכן הסינתזה מתקדמת אך ורק מכיוון 5' לכיוון 3'."
      - type: multiple_choice
        question: "איזה קודון התחלה אוניברסלי פותח את תהליך תרגום החלבון בריבוזום ומקודד לחומצת האמינו מתיונין?"
        options:
          - "AUG"
          - "UAA"
          - "UAG"
          - "UGA"
        correct: 0
        explanation: "הקודון AUG משמש כקודון הפתיחה האוניברסלי כמעט בכל תעתיקי ה-mRNA, ומגדיר את תחילת מסגרת הקריאה."
      - type: multiple_choice
        question: "מהם מקטעי אוקזקי (Okazaki fragments) הנוצרים במהלך שכפול דנ״א?"
        options:
          - "מקטעי דנ״א קצרים ומקוטעים המסונתזים על גבי הגדיל המפגר"
          - "אנזימים המאחים שברים בשלד הסוכר-פוספט"
          - "רצפים לא מקודדים הנחתכים מתוך מולקולת רנ״א שליח"
          - "כיפות חלבוניות המגנות על קצוות הכרומוזומים"
        correct: 0
        explanation: "כיוון שהגדיל המפגר פונה הפוך מכיוון התקדמות המזלג, הוא מסונתז במקטעים קצרים הנקראים מקטעי אוקזקי המאוחדים בהמשך."
      - type: multiple_choice
        question: "איזה בסיס חנקני מופיע במולקולות רנ״א במקום הבסיס תימין (T) המופיע בדנ״א?"
        options:
          - "אורציל (U)"
          - "אדנין (A)"
          - "ציטוזין (C)"
          - "גואנין (G)"
        correct: 0
        explanation: "ברנ״א הבסיס אורציל (U) מחליף את התימין, ונקשר לאדנין באמצעות שני קשרי מימן."
      - type: multiple_choice
        question: "מהו תפקידו העיקרי של האנזים דנ״א ליגאז (DNA Ligase) בשכפול ותיקון דנ״א?"
        options:
          - "חיבור ואיחוי שברים בשלד הסוכר-פוספט באמצעות יצירת קשר פוספודיאסטרי"
          - "פתיחה ופרימה של הסליל הכפול לפני מזלג השכפול"
          - "סינתזת פריימרים של רנ״א להתחלת השכפול"
          - "חשיפת החריץ הגדול לקשירת גורמי שעתוק"
        correct: 0
        explanation: "דנ״א ליגאז פועל כדבק מולקולרי: הוא מאחה את מקטעי אוקזקי על ידי סגירת הקשרים הקוולנטיים בשלד הפוספטים."
      - type: multiple_choice
        question: "איזה קומפלקס מקרומולקולרי מבצע את תהליך השחבור (Splicing), ומסלק אינטרונים מתעתיק ה-pre-mRNA?"
        options:
          - "ספלייסוזום (Spliceosome)"
          - "ריבוזום"
          - "פרוטאוזום"
          - "דנ״א פולימראז I"
        correct: 0
        explanation: "הספלייסוזום מורכב ממולקולות snRNA וחלבונים, ומזהה במדויק את גבולות האינטרונים כדי לסלקם ולחבר אקסונים."
      - type: multiple_choice
        question: "איזה מונח מתאר את העובדה שמספר קודונים שונים יכולים לקודד לאותה חומצת אמינו בדיוק?"
        options:
          - "ניוון (יתירות) של הקוד הגנטי"
          - "הטיית מוטציה אוניברסלית"
          - "אי-תלות אנטי-מקבילית"
          - "משוב אלוסטרי"
        correct: 0
        explanation: "ישנם 64 קודונים עבור 20 חומצות אמינו בלבד, ולכן הקוד הגנטי מנוון (Degenerate), מה שמקנה עמידות למוטציות נקודתיות."
      - type: multiple_choice
        question: "איזה ניסוי היסטורי מפורסם הוכיח ששכפול הדנ״א הוא חצי-משמר (Semi-Conservative)?"
        options:
          - "ניסוי מסלסון-סטאל באמצעות סימון באיזוטופ חנקן-15"
          - "ניסוי הרשי-צ׳ייס בבלנדר עם בקטריופאג׳ים"
          - "ניסוי הטרנספורמציה של גריפית בחיידקי דלקת ריאות"
          - "ניסוי מילר-יורי במרק הקדום"
        correct: 0
        explanation: "מסלסון וסטאל גידלו חיידקים בחנקן כבד ¹⁵N ואז העבירו ל-¹⁴N, וצנטריפוגה של צפיפות הוכיחה שכל גדיל חדש כולל גדיל אם אחד."
      - type: multiple_choice
        question: "איזה אנזים משעתק את גדיל התבנית של הדנ״א למולקולת רנ״א שליח (mRNA) בגרעין התא?"
        options:
          - "רנ״א פולימראז (RNA Polymerase)"
          - "דנ״א פולימראז III"
          - "טופואיזומראז"
          - "רוורס טרנסקריפטאז"
        correct: 0
        explanation: "רנ״א פולימראז קורא את גדיל התבנית של הדנ״א ומסנתז תעתיק רנ״א משלים הנע מכיוון 5' לכיוון 3'."
      - type: multiple_choice
        question: "איזה רכיב מתאמי נושא חומצת אמינו ספציפית וכולל שלשת אנטי-קודון המתחברת לקודון שעל ה-mRNA בעת תרגום?"
        options:
          - "רנ״א מוביל (tRNA)"
          - "רנ״א ריבוזומי (rRNA)"
          - "מיקרו-רנ״א (miRNA)"
          - "רנ״א מתערב קטן (siRNA)"
        correct: 0
        explanation: "ה-tRNA מתרגם את שפת הנוקלאוטידים לשפת החלבונים: הוא מתאים את האנטי-קודון שלו לקודון ומניח את חומצת האמינו הנכונה."
      - type: multiple_choice
        question: "כיצד מכונים רצפי הדנ״א החוזרים המגנים על קצוות הכרומוזומים הליניאריים באיקריוטים מפני שחיקה?"
        options:
          - "טלומרים (Telomeres)"
          - "צנטרומרים"
          - "פלסמידים"
          - "טרנספוזונים"
        correct: 0
        explanation: "הטלומרים (רצפי TTAGGG בבני אדם) מגנים על קצוות הכרומוזומים, ומתקצרים בכל חלוקת תא אלא אם האנזים טלומראז מאריך אותם."
      - type: multiple_choice
        question: "איזה אנזים משחרר את מתח הפיתול העודף הנוצר לפני מזלג השכפול בעת פרימת הדנ״א?"
        options:
          - "טופואיזומראז (Topoisomerase / Gyrase)"
          - "הליקאז"
          - "פרימאז"
          - "אקסונוקלאז"
        correct: 0
        explanation: "הטופואיזומראז חותך ומאחה מחדש גדילים כדי להפיג את מתח הפיתול הנוצר כשההליקאז פותח את הסליל הכפול."
      - type: multiple_choice
        question: "אילו שלושה שינויים עובר תעתיק pre-mRNA באיקריוטים לפני יציאתו לציטופלזמה?"
        options:
          - "הוספת כיפת 5', הוספת זנב פולי-A ב-3', וסילוק אינטרונים בשחבור"
          - "זרחון שומני, מתילציית דנ״א ודחיסת כרומטין"
          - "סינתזת טלומרים, קשירת ריבוזומים וסילוק פלסמידים"
          - "טעינת אנטי-קודון, ביקוע פפטידי ותיוג יוביקוויטין"
        correct: 0
        explanation: "ה-mRNA הבוגר דורש כיפת 5' להגנה והכוונה לריבוזום, זנב פולי-A ליציבות, ושחבור המסלק את מקטעי האינטרונים הלא מקודדים."
      - type: multiple_choice
        question: "כמה קודונים שונים בני שלושה נוקלאוטידים ניתן להרכיב מארבעת הבסיסים של הרנ״א (A, U, G, C)?"
        options:
          - "64 קודונים (4³)"
          - "20 קודונים"
          - "16 קודונים (4²)"
          - "128 קודונים"
        correct: 0
        explanation: "צירוף של 4 בסיסים בשלשות מניב 4 כפול 4 כפול 4 = 64 קודונים, המספיקים לקודד 20 חומצות אמינו וסימני פסיוק (התחלה ועצירה)."

  - id: genetics_inheritance_gene_regulation
    title: "3. גנטיקה מנדלית, כרומוזומים ובקרת ביטוי גנים"
    description: >
      כיצד תכונות תורשתיות עוברות בין דורות: חוקי מנדל, שחלוף כרומוזומלי במיוזה,
      ובקרה אפיגנטית המאפשרת לאותו גנום לייצר סוגי תאים שונים בתכלית.
    cards:
      - title: "גנטיקה מנדלית, אללים והסתברויות בריבוע פנט"
        figure:
          title: "הכלאה מונוהיברידית הטרוזיגוטית (Aa × Aa)"
          svg: >
            <svg viewBox="0 0 520 150" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-height:150px;">
