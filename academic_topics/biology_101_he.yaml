              <line x1="160" y1="75" x2="360" y2="75" stroke="currentColor" stroke-width="1.5"/>
              <line x1="260" y1="25" x2="260" y2="125" stroke="currentColor" stroke-width="1.5"/>

              <text x="210" y="18" font-size="12" font-weight="bold" fill="#3b82f6" text-anchor="middle">A (0.5)</text>
              <text x="310" y="18" font-size="12" font-weight="bold" fill="#ef4444" text-anchor="middle">a (0.5)</text>
              <text x="140" y="55" font-size="12" font-weight="bold" fill="#3b82f6" text-anchor="middle">A</text>
              <text x="140" y="105" font-size="12" font-weight="bold" fill="#ef4444" text-anchor="middle">a</text>

              <text x="210" y="55" font-size="12" font-weight="bold" fill="#3b82f6" text-anchor="middle">AA (25%)</text>
              <text x="310" y="55" font-size="12" font-weight="bold" fill="#10b981" text-anchor="middle">Aa (25%)</text>
              <text x="210" y="105" font-size="12" font-weight="bold" fill="#10b981" text-anchor="middle">Aa (25%)</text>
              <text x="310" y="105" font-size="12" font-weight="bold" fill="#ef4444" text-anchor="middle">aa (25%)</text>

              <text x="430" y="55" font-size="10" font-weight="bold" fill="#10b981">פנוטיפ: 3 : 1</text>
              <text x="430" y="80" font-size="9" fill="currentColor">75% דומיננטי</text>
              <text x="430" y="98" font-size="9" fill="currentColor">25% רצסיבי</text>
            </svg>
          caption: "ריבוע פנט מחשב הסתברויות גנטיות: הכלאת שני נשאים הטרוזיגוטיים (Aa) מניבה יחס גנוטיפי של 1:2:1 ויחס פנוטיפי של 3:1 לטובת התכונה הדומיננטית."
        points:
          - "גרגור מנדל ייסד את תורת התורשה בניסויי הכלאת אפונים, והוכיח כי תכונות מועברות כיחידות פיזיות בדידות (גנים) ולא כערבוב נוזלי רציף."
          - "אלל הוא גרסה מסוימת של גן. יצורים דיפלואידיים נושאים שני אללים לכל גן: הומוזיגוטים נושאים אללים זהים ($AA$ או $aa$), בעוד הטרוזיגוטים נושאים אללים שונים ($Aa$)."
          - "חוק ההפרדה קובע כי בעת יצירת גמטות (תאי זרע וביצית), שני האללים נפרדים כך שכל גמטה מקבלת אלל בודד. חוק ההתפלגות העצמאית קובע כי גנים בכרומוזומים שונים מתפלגים לגמטות ללא תלות הדדית."
          - "גנוטיפ הוא המבנה הגנטי הפנימי (כגון $Aa$), בעוד פנוטיפ הוא הביטוי הפיזי הנראה לעין (כגון עיניים חומות). בהורשה דומיננטית מלאה, נשאים הטרוזיגוטיים ($Aa$) מציגים את הפנוטיפ הדומיננטי בלבד."
      - title: "מיוזה, שחלוף כרומוזומלי ותאחיזה למין"
        points:
          - "בעוד מיטוזה משכפלת תא דיפלואידי לשני תאים דיפלואידיים זהים ($2n \\to 2n$), מיוזה מפחיתה את מספר הכרומוזומים בחצי ($2n \\to 1n$) בשתי חלוקות עוקבות ליצירת ארבע גמטות הפלואידיות ייחודיות."
          - "שחלוף (Crossing-Over): במהלך פרופאזה I במיוזה, כרומוזומים הומולוגיים נצמדים ומחליפים ביניהם מקטעי דנ״א באתרי כיאזמה, ומייצרים אינסוף צירופים גנטיים חדשים."
          - "קריוטיפ האדם כולל 23 זוגות כרומוזומים (46 בסך הכל): 22 זוגות אוטוזומים וזוג כרומוזומי מין יחיד ($XX$ בנקבות, $XY$ בזכרים)."
          - "הורשה בתאחיזה לכרומוזום X: כרומוזום X גדול ונושא מעל 1,000 גנים חיוניים, בעוד כרומוזום Y קטן ומכיל בעיקר גנים לקביעת מין זכרי (גן SRY). כיוון שלגברים כרומוזום X יחיד (המיזיגוטים), תכונות רצסיביות בתאחיזה ל-X כגון עיוורון צבעים והמופיליה מתבטאות אצלם בשכיחות גבוהה בהרבה."
      - title: "בקרת ביטוי גנים, אפיגנטיקה ואופרון הלקטוז"
        points:
          - "כל תא סומטי בגוף האדם מכיל את אותו גנום של 3 מיליארד בסיסים, אך תא עצב פועל שונה לחלוטין מתא כבד. התמיינות תאית מושגת כולה באמצעות בקרת ביטוי גנים מתוחכמת."
          - "אופרון הלקטוז בחיידק אי-קולי פועל כשער לוגי: החיידק מתעתק אנזימים לפירוק לקטוז אך ורק כשמתקיימים שני תנאים: לקטוז נוכח בתמיסה (קושר ומסלק את החלבון הדכאן מהמפעיל), וגלוקוז אינו נוכח (רמות cAMP גבוהות מפעילות את חלבון ה-CAP)."
          - "בקרת שעתוק באיקריוטים: גורמי שעתוק נקשרים לפרומוטורים ולרצפי בקרה מרוחקים המכונים ׳מגבירים׳ (Enhancers). קיפול הדנ״א בחלל מקרב את המגביר אל קומפלקס השעתוק."
          - "אפיגנטיקה: שינויים תורשתיים בביטוי גנים שאינם כרוכים בשינוי רצף הנוקלאוטידים. מתילציית דנ״א (הוספת קבוצות $-CH_3$ לבסיסי ציטוזין) גורמת לדחיסת הכרומטין ולהשתקת גנים, בעוד אצטילציית היסטונים פותחת את הכרומטין ומאפשרת שעתוק פעיל."
    trivia:
      - type: multiple_choice
        question: "בהכלאה בין שני פרטים הטרוזיגוטיים (Aa × Aa) בעלי תכונה דומיננטית פשוטה, מהו היחס הפנוטיפי הצפוי בקרב הצאצאים?"
        options:
          - "3 בעלי פנוטיפ דומיננטי לעומת 1 בעל פנוטיפ רצסיבי (3:1)"
          - "1 דומיננטי לעומת 1 רצסיבי (1:1)"
          - "יחס של 9:3:3:1"
          - "כל הצאצאים מביעים את הפנוטיפ הרצסיבי"
        correct: 0
        explanation: "ההכלאה מייצרת 1 AA, 2 Aa ו-1 aa. כיוון ש-AA ו-Aa מציגים שניהם את התכונה הדומיננטית, היחס הנראה לעין הוא 3:1."
      - type: multiple_choice
        question: "באיזה שלב בחלוקת המיוזה מתרחש תהליך השחלוף (Crossing-Over) המייצר מגוון גנטי חדש בצאצאים?"
        options:
          - "פרופאזה I"
          - "מטאפאזה II"
          - "אנאפאזה I"
          - "טלופאזה II"
        correct: 0
        explanation: "השחלוף מתרחש בפרופאזה I, שבה כרומוזומים הומולוגיים נצמדים זה לזה ומחליפים פיזית מקטעי דנ״א."
      - type: multiple_choice
        question: "מדוע מחלות גנטיות רצסיביות בתאחיזה לכרומוזום X (כגון עיוורון צבעים או המופיליה) פוגעות בגברים בשכיחות גבוהה בהרבה מבנשים?"
        options:
          - "לגברים יש כרומוזום X יחיד (XY), כך שאלל פגום בודד יתבטא תמיד בהיעדר כרומוזום X שני שימסך אותו"
          - "כרומוזום Y יוצר מוטציות פעילות הגורמות לעיוורון צבעים"
          - "לגברים אין אנזימי תיקון דנ״א בכרומוזומי המין"
          - "כרומוזום X עובר השתקה בכל הרקמות הגבריות"
        correct: 0
        explanation: "אישה (XX) זקוקה לשני אללים פגומים כדי לחלות, בעוד גבר (XY) יחלה אם כרומוזום ה-X היחיד שלו נושא את האלל הפגום."
      - type: multiple_choice
        question: "כיצד פועל אופרון הלקטוז (Lac Operon) כשער לוגי חסכוני בחיידקי אי-קולי?"
        options:
          - "הוא מתעתק אנזימים לפירוק לקטוז אך ורק כאשר לקטוז נוכח במצע וגלוקוז חסר"
          - "הוא מייצר אינסולין בכל פעם שרמת הסוכר צונחת"
          - "הוא מתעתק אנזימי לקטאז בקצב מרבי קבוע ללא קשר לסוג המזון הזמין"
          - "הוא מפרק את דופן התא החיידקי במגע עם מוצרי חלב"
        correct: 0
        explanation: "החיידק מעדיף גלוקוז. אופרון הלקטוז מופעל רק כאשר לקטוז מסיר את הדכאן והיעדר גלוקוז מאפשר הפעלה מלאה של האנזים."
      - type: multiple_choice
        question: "איזה שינוי אפיגנטי גורם בדרך כלל לדחיסת הכרומטין ולהשתקת שעתוק הגנים מבלי לשנות את רצף הדנ״א?"
        options:
          - "מתילציית דנ״א (הוספת קבוצות מתיל לבסיסי ציטוזין)"
          - "זרחון היסטונים"
          - "שחבור חליפי של אקסונים"
          - "פירוק תת-יחידות הריבוזום"
        correct: 0
        explanation: "מתילציה של בסיסי ציטוזין גורמת להידוק מבנה הכרומטין (הטרוכרומטין), וחוסמת גישה של רנ״א פולימראז לפרומוטור."
      - type: multiple_choice
        question: "איזה מונח מגדיר פרט הנושא שני אללים זהים עבור אתר גנטי מסוים (כגון AA או aa)?"
        options:
          - "הומוזיגוט"
          - "הטרוזיגוט"
          - "המיזיגוט"
          - "פוליגני"
        correct: 0
        explanation: "הומוזיגוט נושא שני אללים זהים (AA דומיננטי או aa רצסיבי), בעוד הטרוזיגוט נושא אללים שונים (Aa)."
      - type: multiple_choice
        question: "כמה כרומוזומים בסך הכל מצויים בגרעין של תא גוף (סומטי) תקין באדם?"
        options:
          - "46 כרומוזומים (23 זוגות)"
          - "23 כרומוזומים בסך הכל"
          - "92 כרומוזומים (46 זוגות)"
          - "48 כרומוזומים (24 זוגות)"
        correct: 0
        explanation: "תא סומטי אנושי הוא דיפלואידי ומכיל 46 כרומוזומים: 22 זוגות כרומוזומים אוטוזומליים וזוג כרומוזומי מין אחד."
      - type: multiple_choice
        question: "מה קובע חוק ההתפלגות העצמאית של מנדל?"
        options:
          - "אללים של גנים שונים המצויים בכרומוזומים נפרדים נפרדים לגמטות ללא תלות הדדית"
          - "אללים דומיננטיים משמידים פיזית אללים רצסיביים בעת יצירת גמטות"
          - "כל הצאצאים יורשים מיטוכונדריות אך ורק דרך תאי הזרע של האב"
          - "כרומוזומים משכפלים את עצמם לאינסוף במהלך חלוקת המיטוזה"
        correct: 0
        explanation: "החוק קובע כי הגנים הממוקמים על כרומוזומים נפרדים מתפלגים לגמטות באופן עצמאי לחלוטין זה מזה."
      - type: multiple_choice
        question: "איזה גן מפתח על כרומוזום Y אחראי להתמיינות עוברית ראשונית לרקמות אשכים זכריות באדם?"
        options:
          - "גן SRY (Sex-determining Region Y)"
          - "גן FOXP2"
          - "גן BRCA1"
          - "גן p53"
        correct: 0
        explanation: "הגן SRY מקודד לגורם שעתוק שמכוון את הגונדות העובריות להתפתח לאשכים ולא לשחלות."
      - type: multiple_choice
        question: "איזה תהליך חלוקת תא מפחית את מספר הכרומוזומים מתא דיפלואידי (2n) לארבע גמטות הפלואידיות (1n)?"
        options:
          - "מיוזה (חלוקת הפחתה)"
          - "מיטוזה"
          - "פליגה חיידקית"
          - "הנצה"
        correct: 0
        explanation: "מיוזה כוללת סיבוב הכפלה אחד ושתי חלוקות עוקבות, ומייצרת תאי מין הפלואידיים המכילים מחצית ממספר הכרומוזומים."
      - type: multiple_choice
        question: "כיצד מכונה מכלול התכונות הפיזיות וההתנהגותיות הנראות של יצור הנובעות מפעולת הגנים והסביבה?"
        options:
          - "פנוטיפ"
          - "גנוטיפ"
          - "קריוטיפ"
          - "הפלוטיפ"
        correct: 0
        explanation: "פנוטיפ מייצג את התכונות הגלויות (מבנה גוף, פיזיולוגיה, מראה), בעוד גנוטיפ מייצג את ההרכב הגנטי של הדנ״א."
      - type: multiple_choice
        question: "מהו רצף ׳מגביר׳ (Enhancer) בבקרת שעתוק איקריוטית?"
        options:
          - "רצף דנ״א מרוחק הנקשר לגורמי שעתוק ומגביר דרמטית את שעתוק הגן על ידי קיפול מרחבי"
          - "תת-יחידה בריבוזום המאיצה את מהירות קיפול החלבון"
          - "אנזים במיטוכונדריה הממיר חומצה לקטית ל-ATP"
          - "צבע מולקולרי המשמש לצביעת גדילי דנ״א בג׳ל"
        correct: 0
        explanation: "מגבירים הם מקטעי בקרה הרחוקים אלפי בסיסים מהגן, הנקשרים לחלבוני בקרה ומתקפלים במרחב לעבר הפרומוטור."
      - type: multiple_choice
        question: "כיצד מכונה התופעה שבה גן בודד משפיע על מספר תכונות פנוטיפיות שונות שאינן קשורות זו לזו?"
        options:
          - "פלאוטרופיה (Pleiotropy)"
          - "הורשה פוליגנית"
          - "קו-דומיננטיות"
          - "חדירות חלקית"
        correct: 0
        explanation: "פלאוטרופיה מתארת מצב שבו מוטציה בגן יחיד (כמו בסינדרום מרפן) מחוללת שינויים במערכות גוף מרובות (שלד, ראייה ולב)."
      - type: multiple_choice
        question: "מהי התוצאה של כשל בהפרדת כרומוזומים הומולוגיים (אי-הפרדה / Non-disjunction) בעת מיוזה?"
        options:
          - "אנאפלואידיה, המובילה לגמטות בעלות מספר כרומוזומים לא תקין (כגון טריזומיה 21 / תסמונת דאון)"
          - "שכפול גנטי מיידי של היצור השלם"
          - "הכפלת קצב ייצור ה-ATP במיטוכונדריה"
          - "היפוך מלא של כלל בסיסי הדנ״א"
        correct: 0
        explanation: "אי-הפרדה גורמת לגמטה לקבל כרומוזום עודף או לחסור כרומוזום, מה שמוביל להפרעות כרומוזומליות כמו תסמונת דאון."
      - type: multiple_choice
        question: "מהם חלבוני ההיסטונים (Histones) שסביבם מלופף הדנ״א הגנומי בגרעין התא האיקריוטי?"
        options:
          - "חלבונים בסיסיים בעלי מטען חיובי המארגנים את הדנ״א למבנה נוקלאוזומים קומפקטי"
          - "טיפות שומן האוגרות קלוריות עודפות בגרעין"
          - "רב-סוכרים המחזקים את דפנות התאים"
          - "מולקולות רנ״א המסונתזות במהלך שכפול הגדיל המפגר"
        correct: 0
        explanation: "ההיסטונים הם חלבונים חיוביים; גדיל הדנ״א השלילי נכרך סביבם ליצירת מבנה של ׳חרוזים על חוט׳ המכונה נוקלאוזום."

  - id: evolutionary_mechanisms_population_genetics
    title: "4. ברירה טבעית, דינמיקה אבולוציונית ופילוגנטיקה"
    description: >
      אלגוריתמים אבולוציוניים במערכות חיות: ברירה טבעית, סחף גנטי מקרי,
      שיווי משקל הרדי-ויינברג, תהליכי התמיינות למינים ועץ החיים הפילוגנטי.
    cards:
      - title: "ברירה טבעית כאלגוריתם וארבעת כוחות האבולוציה"
        figure:
          title: "שלושת דפוסי הברירה הטבעית על התפלגות הפנוטיפ"
          svg: >
            <svg viewBox="0 0 520 150" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-height:150px;">
              <rect x="20" y="20" width="145" height="110" rx="6" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-width="1.5"/>
              <text x="92" y="38" font-size="11" font-weight="bold" fill="#3b82f6" text-anchor="middle">ברירה מייצבת</text>
              <path d="M 35 110 Q 92 20 150 110" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
              <text x="92" y="122" font-size="8" fill="currentColor" text-anchor="middle">הצרה סביב הממוצע</text>

              <rect x="185" y="20" width="145" height="110" rx="6" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-width="1.5"/>
              <text x="257" y="38" font-size="11" font-weight="bold" fill="#10b981" text-anchor="middle">ברירה כיוונית</text>
              <path d="M 200 110 Q 285 30 315 110" fill="none" stroke="#10b981" stroke-width="2.5"/>
              <text x="257" y="122" font-size="8" fill="currentColor" text-anchor="middle">הסטת ממוצע הפנוטיפ</text>

              <rect x="350" y="20" width="150" height="110" rx="6" fill="#ef4444" fill-opacity="0.08" stroke="#ef4444" stroke-width="1.5"/>
              <text x="425" y="38" font-size="11" font-weight="bold" fill="#ef4444" text-anchor="middle">ברירה מפרידה</text>
              <path d="M 365 110 Q 390 40 425 90 Q 460 40 485 110" fill="none" stroke="#ef4444" stroke-width="2.5"/>
              <text x="425" y="122" font-size="8" fill="currentColor" text-anchor="middle">העדפת הקצוות</text>
            </svg>
          caption: "הברירה הטבעית מעצבת את עקומת הפנוטיפ: ברירה מייצבת משמרת את הממוצע, ברירה כיוונית מסיטה אותו, וברירה מפרידה מפצלת את האוכלוסייה לשני קצוות."
        points:
          - "אבולוציה באמצעות ברירה טבעית היא אלגוריתם דטרמיניסטי. אם במערכת מתקיימים שלושה תנאים: (1) שונות פנוטיפית, (2) תורשתיות של התכונות בקוד משתכפל, ו-(3) הצלחה רבייתית דיפרנציאלית (חלק מהווריאציות מעמידות יותר צאצאים) — אבולוציה אדפטיבית היא כורח מתמטי."
          - "כשירות ביולוגית (Fitness, $\\omega$) מוגדרת כהצלחה רבייתית יחסית: תרומתו של הגנוטיפ של הפרט למאגר הגנים של הדור הבא, ולא כוח פיזי או אריכות ימים כשלעצמם."
          - "ארבעת כוחות האבולוציה המניעים שינויים גנומיים: (1) ברירה טבעית (הישרדות מועדפת לא-אקראית), (2) סחף גנטי (תנודות מקריות בשכיחות אללים באוכלוסיות קטנות), (3) זרימת גנים (הגירת פרטים בין אוכלוסיות), ו-(4) מוטציות (המקור הבלעדי לכל שונות גנטית חדשה)."
          - "שלושה דפוסי ברירה עיקריים: ברירה מייצבת המעדיפה פנוטיפ בינוני (כמו משקל לידה בתינוקות); ברירה כיוונית המסיטה את האוכלוסייה לכיוון קיצוני אחד (כמו עמידות לאנטיביוטיקה בחיידקים); וברירה מפרידה המעדיפה את שני הקצוות על פני המרכז."
      - title: "גנטיקה של אוכלוסיות ושיווי משקל הרדי-ויינברג"
        points:
          - "גנטיקה של אוכלוסיות עוקבת אחר התפלגות אללים ושינויים בשכיחותם בתוך אוכלוסיות המתרבות ביניהן. סך כל האללים באוכלוסייה מהווה את ׳מאגר הגנים׳ (Gene Pool)."
          - "עקרון הרדי-ויינברג קובע כי שכיחות האללים והגנוטיפים נשמרת קבועה מדור לדור בהיעדר כוחות אבולוציוניים: $p + q = 1$ (שכיחות האללים), ו-$p^2 + 2pq + q^2 = 1$ (שכיחות הגנוטיפים, כאשר $p^2$ הוא הומוזיגוט דומיננטי, $2pq$ הוא הטרוזיגוט, ו-$q^2$ הוא הומוזיגוט רצסיבי)."
          - "תנאי שיווי המשקל משמשים כהשערת אפס: (1) ללא ברירה טבעית, (2) ללא מוטציות, (3) ללא הגירה, (4) אוכלוסייה אינסופית בגודלה, ו-(5) הזדווגות אקראית לחלוטין. סטייה מנוסחה זו מעידה כי מתרחש תהליך אבולוציוני."
          - "סחף גנטי מקרי מתבטא בעוצמה רבה באוכלוסיות קטנות: ׳צוואר בקבוק גנטי׳ (התרסקות חדה בגודל האוכלוסייה בשל אסון) ו-׳אפקט המייסדים׳ (קבוצה חלוצית קטנה המהגרת לאי מבודד) מקבעים או מוחקים אללים באקראי ללא קשר למידת תועלתם."
      - title: "דינמיקת התמיינות למינים ועץ החיים הפילוגנטי"
        points:
          - "הגדרת המין הביולוגי (ארנסט מאייר): מין מוגדר כאוכלוסיות טבעיות המקיימות ביניהן רבייה בפועל או בכוח, ומבודדות רבייתית מאוכלוסיות אחרות."
          - "התמיינות אלופטרית (Allopatric Speciation) מתרחשת כאשר מחסום גאוגרפי פיזי (הרים, קניון, אוקיינוס) מפריד אוכלוסיות, ומאפשר למאגרי הגנים המבודדים להתרחק דרך מוטציות וסחף עד לאובדן התאמה רבייתית."
          - "התמיינות סימפטרית (Sympatric Speciation) מתרחשת באותו שטח גאוגרפי ללא הפרדה פיזית, ומונעת מבידול גומחות אקולוגיות, ברירה מינית או פוליפלואידיות (הכפלת מערכות כרומוזומים, נפוצה בצמחים)."
          - "עצים פילוגנטיים ממפים קרבה אבולוציונית על פי תכונות נגזרות משותפות. ׳שעון מולקולרי׳ מודד קצב הצטברות מוטציות ניטרליות בגנים שמורים (כרנ״א ריבוזומי) כדי לאמוד זמני פיצול גאולוגיים."
          - "שלושת תחומי העל של החיים (קרל ווז, 1977): ריצוף רנ״א ריבוזומי פיצל את עולם החי לשלוש ממלכות על יסודיות: חיידקים (Bacteria), ארכאונים (Archaea — יצורים חד-תאיים החולקים מנגנונים מולקולריים עם איקריוטים) ואיקריוטים (Eukarya)."
    trivia:
      - type: multiple_choice
        question: "מהם שלושת התנאים האלגוריתמיים המחייבים להתרחשותה של אבולוציה באמצעות ברירה טבעית על פי דרווין?"
        options:
          - "שונות פנוטיפית, תורשתיות של התכונות, והצלחה רבייתית דיפרנציאלית"
          - "אקלים טרופי לח, קצב מוטציות מהיר ובידוד גנטי מוחלט"
          - "כוונה מודעת של היצור לשרוד, כוח פיזי והתערבות כוחות עליונים"
          - "שכפול א-מיני בלעדי, אפס תמותה וגודל אוכלוסייה קבוע"
        correct: 0
        explanation: "כאשר קיימת שונות בין פרטים, התכונות מועברות בתורשה, ופרטים מסוימים מעמידים יותר צאצאים — התפלגות האללים משתנה בהכרח מדור לדור."
      - type: multiple_choice
        question: "במשוואת שיווי המשקל של הרדי-ויינברג (p² + 2pq + q² = 1), מה מייצג האיבר 2pq?"
        options:
          - "שכיחות הפרטים ההטרוזיגוטיים (Aa) באוכלוסייה"
          - "שכיחות הפרטים ההומוזיגוטיים הדומיננטיים (AA)"
          - "שכיחות הפרטים ההומוזיגוטיים הרצסיביים (aa)"
          - "שכיחות המוטציות הקטלניות"
        correct: 0
        explanation: "במודל דו-אללי, p בריבוע מייצג הומוזיגוט דומיננטי, q בריבוע מייצג הומוזיגוט רצסיבי, ו-2pq מייצג את שכיחות ההטרוזיגוטים באוכלוסייה."
      - type: multiple_choice
        question: "איזה כוח אבולוציוני מתאר שינויים אקראיים וסטוכסטיים בשכיחות אללים, המשפיעים באופן הדרמטי ביותר על אוכלוסיות קטנות?"
        options:
          - "סחף גנטי מקרי (Genetic Drift)"
          - "ברירה טבעית מכוונת"
          - "התפלגות כיוונית"
          - "ברירה מלאכותית"
        correct: 0
        explanation: "סחף גנטי נובע משגיאות דגימה סטטיסטיות אקראיות; באוכלוסייה קטנה, אללים יכולים להיעלם או להתקבע לחלוטין מסיבות מקריות."
      - type: multiple_choice
        question: "איזה סוג התמיינות מתרחש כאשר מחסום גאוגרפי פיזי (כגון רכס הרים או מצר ים) מפריד ומבודד אוכלוסיות?"
        options:
          - "התמיינות אלופטרית (Allopatric Speciation)"
          - "התמיינות סימפטרית"
          - "הכלאה מלאכותית"
          - "התמיינות פוליפלואידית"
        correct: 0
        explanation: "התמיינות אלופטרית נגרמת מבידוד גאוגרפי פיזי העוצר את זרימת הגנים ומאפשר לכל אוכלוסייה להתרחק באופן בלתי תלוי."
      - type: multiple_choice
        question: "מהם שלושת תחומי העל (Domains) של עולם החי שקבע קרל ווז בשנת 1977 על בסיס ריצוף רנ״א ריבוזומי?"
        options:
          - "חיידקים (Bacteria), ארכאונים (Archaea) ואיקריוטים (Eukarya)"
          - "צמחים, בעלי חיים ופטריות"
          - "בעלי חוליות, חסרי חוליות ומיקרואורגניזמים"
          - "פרוקריוטים, נגיפים ויונקים"
        correct: 0
        explanation: "קרל ווז הוכיח שהחיים מתחלקים לשלושה תחומי על עמוקים: חיידקים אמיתיים, ארכאונים ואיקריוטים."
      - type: multiple_choice
        question: "מהו המקור האולטימטיבי היחיד לכל אלל גנטי חדש ושונות גנטית מקורית בטבע?"
        options:
          - "מוטציות ברצף הדנ״א"
          - "חלוקת תא במיטוזה"
          - "ברירה טבעית מכוונת"
          - "הזדווגות הטרוזיגוטית"
        correct: 0
        explanation: "ברירה, סחף ושחלוף מערבבים את השונות הקיימת, אך רק מוטציות אקראיות יוצרות אותיות ורצפים חדשים לחלוטין בגנום."
      - type: multiple_choice
        question: "איזה דפוס ברירה טבעית פועל כנגד פנוטיפים קיצוניים ומחזק את הפנוטיפ הממוצע (כמו במשקל לידה של תינוקות)?"
        options:
          - "ברירה מייצבת (Stabilizing Selection)"
          - "ברירה כיוונית (Directional Selection)"
          - "ברירה מפרידה (Disruptive Selection)"
          - "ברירה זוויגית"
        correct: 0
        explanation: "ברירה מייצבת מנפה את מקרי הקצה משני צדי הפעמון, ומצרה את השונות סביב ערך הממוצע האופטימלי."
      - type: multiple_choice
        question: "מהי התופעה שבה קבוצה חלוצית קטנה מתנתקת מאוכלוסיית אם ומייסדת מושבה חדשה עם מגוון גנטי מצומצם?"
        options:
          - "אפקט המייסדים (Founder Effect)"
          - "הקרנה סימפטרית"
          - "פולימורפיזם מאוזן"
          - "הלם אפיסטטי"
        correct: 0
        explanation: "אפקט המייסדים הוא מקרה של סחף גנטי שבו מושבה חדשה נושאת רק מדגם מקרי ומצומצם ממאגר הגנים המקורי."
      - type: multiple_choice
        question: "כיצד ביולוגים מולקולריים משתמשים ב-׳שעון מולקולרי׳ לאמוד זמני פיצול גאולוגיים בין מינים שונים?"
        options:
          - "מדידת מספר המוטציות הניטרליות שהצטברו בגנים שמורים לאורך מיליוני שנים בקצב קבוע יחסית"
          - "ספירת אטומי פחמן-14 בתוך ריבוזומים חיים"
          - "מדידת דופק הלב של מאובנים עתיקים"
          - "מעקב אחר קצב נדידת היבשות באמצעות מכ״ם לווייני"
        correct: 0
        explanation: "בהנחה שמוטציות ניטרליות מצטברות בקצב קבוע, הפרשי הרצפים בין מינים מלמדים מתי חי האב הקדמון המשותף שלהם."
      - type: multiple_choice
        question: "מה מגדיר ׳כשירות ביולוגית׳ (Fitness) בתורת האבולוציה?"
        options:
          - "הצלחתו הרבייתית היחסית של הפרט ותרומת צאצאיו למאגר הגנים של הדור הבא"
          - "מסת השרירים, מהירות הריצה ויכולת הקרב של בעל החיים"
          - "אורך חייו של היצור בשנים, ללא קשר למספר צאצאיו"
          - "סך כל האנרגיה הקלורית שהיצור צורך ביום"
        correct: 0
        explanation: "כשירות באבולוציה נמדדת במספר הצאצאים הפוריים שהיצור מעמיד ומצליח להעביר באמצעותם את גניו הלאה."
      - type: multiple_choice
        question: "איזו תופעה אבולוציונית מהירה מתרחשת כאשר מין אב קדמון מתפצל במהירות למגוון מינים בעלי התמחויות אקולוגיות שונות?"
        options:
          - "הקרנה אדפטיבית (Adaptive Radiation)"
          - "צוואר בקבוק גנטי"
          - "אבולוציה מתכנסת"
          - "סטסיס לפי הרדי-ויינברג"
        correct: 0
        explanation: "הקרנה אדפטיבית מתרחשת כאשר מין חודר לסביבה עשירה בגומחות פנויות, ומתפצל למינים רבים (כמו פרושי דרווין בגלפגוס)."
      - type: multiple_choice
        question: "מהי ׳אבולוציה מתכנסת׳ (Convergent Evolution)?"
        options:
          - "התפתחות בלתי תלויה של תכונות דומות בקבוצות לא קרובות בשל לחצי סביבה דומים (כמו צורת גוף של כריש ודולפין)"
          - "התמזגות של שני מינים שונים לאוכלוסייה אחת המתרבה בינה לבין עצמה"
          - "השתקה מוחלטת של שני העותקים של גן הומולוגי"
          - "הכפלת מספר הכרומוזומים במהלך חלוקת המיוזה"
        correct: 0
        explanation: "אבולוציה מתכנסת מוכיחה את כוח הברירה: יצורים משושלות שונות מפתחים פתרונות אנטומיים דומים (כגון כנפיים בעטלף וציפור) לאתגר דומה."
      - type: multiple_choice
        question: "מהו התנאי המרכזי המגדיר שתי אוכלוסיות כמינים ביולוגיים נפרדים על פי ארנסט מאייר?"
        options:
          - "בידוד רבייתי, המונע מהן להעמיד צאצאים פוריים ובני-קיימא בטבע"
          - "הבדל של יותר מ-50% במשקל הגוף הממוצע של בוגר"
          - "מגורים ביבשות גאוגרפיות שונות"
          - "הבדל בצבעי העור או הנוצות"
        correct: 0
        explanation: "על פי הגדרת המין הביולוגי, אי-יכולת להתרבות ולהעמיד צאצאים פוריים היא המחסום המגדיר גבול בין שני מינים."
      - type: multiple_choice
        question: "מה מתרחש במאגר הגנים של אוכלוסייה בעת ׳צוואר בקבוק גנטי׳ (Population Bottleneck)?"
        options:
          - "קריסה חדה בגודל האוכלוסייה מוחקת באקראי אללים רבים ומצמצמת דרמטית את המגוון הגנטי"
          - "קצב המוטציות בגנום מזנק פי אלף באופן מיידי"
          - "כל הפרטים הופכים מיד לפוליפלואידים"
          - "מוטציות רצסיביות מזיקות מושמדות לצמיתות מהגנום"
        correct: 0
        explanation: "אסונות (ציד, מגפה, בצורת) המצמצמים אוכלוסייה למספר שורדים בודד משאירים שרידי מגוון גנטי דלים ביותר."
      - type: multiple_choice
        question: "כיצד מכונה איבר או שריר אנטומי שאיבד את תפקידו המקורי במהלך האבולוציה (כגון עצם הזנב באדם)?"
        options:
          - "איבר שרידי (איבר וסטיגיאלי)"
          - "איבר הומולוגי"
          - "תכונה אנלוגית"
          - "התאמה סימפטרית"
        correct: 0
        explanation: "איברים וסטיגיאליים (כגון שרידי עצמות אגן בלווייתנים או עצם הזנב באדם) הם שרידים של איברים ששימשו אבות קדמונים."

  - id: biotechnology_crispr_synthetic_biology
    title: "5. הנדסה גנטית, קריספר (CRISPR) וביולוגיה סינתטית"
    description: >
      חזית הביו-טכנולוגיה המודרנית: מספריים מולקולריים וליגאזות, שכפול מעריכי ב-PCR,
      עריכת גנים מדויקת בקריספר-Cas9, חיסוני mRNA ורכיבי ביולוגיה סינתטית.
    cards:
      - title: "כלי דנ״א רקומביננטי: אנזימי הגבלה, פלסמידים ו-PCR"
        figure:
          title: "מערכת עריכת הגנים המדויקת קריספר-Cas9"
          svg: >
            <svg viewBox="0 0 520 150" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-height:150px;">
              <ellipse cx="260" cy="75" rx="140" ry="55" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="2"/>
              <text x="260" y="38" font-size="11" font-weight="bold" fill="#8b5cf6" text-anchor="middle">חלבון Cas9 (מספריים מולקולריים)</text>

              <line x1="80" y1="70" x2="440" y2="70" stroke="#3b82f6" stroke-width="3"/>
              <line x1="80" y1="85" x2="440" y2="85" stroke="#3b82f6" stroke-width="3"/>
              <text x="100" y="60" font-size="9" font-weight="bold" fill="#3b82f6">גדיל דנ״א מטרה</text>

              <path d="M 180 115 Q 260 115 280 70" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-dasharray="3,3"/>
              <text x="210" y="130" font-size="9" font-weight="bold" fill="#ec4899">רנ״א מנחה (sgRNA)</text>

              <line x1="300" y1="55" x2="300" y2="100" stroke="#ef4444" stroke-width="2.5"/>
              <text x="340" y="105" font-size="9" font-weight="bold" fill="#ef4444">שבר דו-גדילי (חיתוך מדויק)</text>
            </svg>
          caption: "קריספר-Cas9 פועל כמעבד תמלילים גנטי: רנ״א מנחה סינתטי מנווט את אנזים ה-Cas9 לחתוך במדויק רצף דנ״א מבוקש בגנום."
        points:
          - "טכנולוגיית דנ״א רקומביננטי מאפשרת לחתוך, לחבר ולהנדס מקטעי דנ״א מאורגניזמים שונים. אנזימי הגבלה (Restriction Enzymes — ׳מספריים מולקולריים׳ מחיידקים) מזהים וחותכים רצפים פלינדרומיים ספציפיים ומותירים ׳קצוות דביקים׳ שניתן לאחות באמצעות דנ״א ליגאז."
          - "פלסמידים הם מקטעי דנ״א מעגליים עצמאיים בחיידקים. מהנדסים גנטיים משתמשים בהם כוקטורים להחדרת גנים זרים ומרקר עמידות לאנטיביוטיקה, כדי לייצר חלבונים תרופתיים (כגון אינסולין אנושי המיוצר בחיידקי אי-קולי)."
          - "תגובת שרשרת של פולימראז (PCR, שהמציא קארי מוליס ב-1983) היא מכונת הצילום המולקולרית, המגבירה מולקולת דנ״א בודדת למיליארדי עותקים במחזורי חום: (1) הפרדה ב-95°C, (2) איחוי פריימרים ב-55°C, ו-(3) הארכה ב-72°C באמצעות האנזים העמיד לחום Taq פולימראז ($2^n$ עותקים ב-$n$ מחזורים)."
          - "אלקטרופורזה בג׳ל מפרידה מקטעי דנ״א לפי גודל מולקולרי: שדה חשמלי מושך את שלד הפוספט השלילי של הדנ״א לעבר האנודה החיובית ($+$) דרך רשת פולימר אגרוז, כאשר מקטעים קצרים נעים מהר יותר ומגיעים רחוק יותר."
      - title: "קריספר-Cas9: עריכה גנומית מתוכנתת"
        points:
          - "קריספר (CRISPR) התגלה כמערכת חיסון אדפטיבית בחיידקים ובארכאונים, השומרים מקטעי דנ״א של נגיפים (בקטריופאג׳ים) שתקפו אותם כדי לזהותם ולהשמידם בהדבקה חוזרת."
          - "עמנואל שרפנטייה וג׳ניפר דאודנה (פרס נובל בכימיה 2020) הפכו מנגנון זה לכלי עריכה אוניברסלי באמצעות רנ״א מנחה סינתטי (sgRNA). שינוי של 20 נוקלאוטידים ברנ״א המנחה מאפשר לכוון את האנזים Cas9 לחתוך כל אתר מבוקש בגנום הסמוך לרצף PAM (5'-NGG-3')."
          - "מנגנוני תיקון תאיים לאחר חיתוך: התא מתקן את השבר הדו-גדילי באחד משני נתיבים: (1) איחוי קצוות לא-הומולוגי (NHEJ) — מנגנון מועד לשגיאות המשבית גנים (Knockout), או (2) תיקון מונחה הומולוגיה (HDR) — המשתמש בתבנית מסופקת כדי להחדיר גן חדש ומותאם (Knock-in)."
          - "חזית הקריספר המתקדמת: ׳עורכי בסיסים׳ (Base Editors) משנים כימית אות בודדת (כגון $C\\to T$) ללא חיתוך דו-גדילי של הסליל, ו-Prime Editing פועל כמעבד תמלילים גנטי הכותב ישירות רצפים חדשים לתוך הדנ״א."
      - title: "ביולוגיה סינתטית, חיסוני mRNA וממשקי מידע ביולוגי"
        points:
          - "ביולוגיה סינתטית הופכת את מדעי החיים מתחום תיאורי להנדסה שיטתית: תכנון מעגלים גנטיים מלאכותיים (שערים לוגיים, מתגי הפעלה) באמצעות רכיבים ביולוגיים סטנדרטיים (BioBricks) להנדסת שמרים וחיידקים המייצרים דלק ביולוגי, תרופות למלריה ופלסטיק מתכלה."
          - "חיסוני ותרופות mRNA: במקום הזרקת נגיף מוחלש, חיסוני mRNA מחדירים מולקולת רנ״א סינתטית המקודדת לחלבון הנגיף (כמו חלבון הספייק של הקורונה). ה-mRNA עטוף בננו-חלקיקי שומן (LNPs) החודרים לתאים, והריבוזומים של הגוף מייצרים את האנטיגן ומאמנים את מערכת החיסון במהירות ובבטיחות."
          - "אחסון מידע דיגיטלי בדנ״א: דנ״א מתאפיין בצפיפות אחסון אדירה — כ-215 פטה-בייט (מיליוני גיגה-בייט) של מידע דיגיטלי בגרם בודד — עם שרידות של אלפי שנים, תוך המרת ביטים בינאריים (00, 01, 10, 11) לארבע אותיות הדנ״א."
          - "ביואתיקה ובטיחות ביולוגית: טכנולוגיות עריכה מעלות סוגיות מוסריות כבדות: ׳דחף גנטי׳ (Gene Drive) המסוגל להפיץ תכונה מהונדסת ב-100% מאוכלוסיית יתושים להדברת מלריה אך טומן סיכון אקולוגי, ועריכת תאי מין ועוברים אנושיים המשנה את הגנום של הדורות הבאים."
    trivia:
      - type: multiple_choice
        question: "כיצד מערכת עריכת הגנים קריספר-Cas9 מנווטת ומאתרת את רצף הדנ״א הספציפי שאותו היא מיועדת לחתוך?"
        options:
          - "באמצעות רנ״א מנחה סינתטי (sgRNA) בן 20 נוקלאוטידים הנקשר לרצף הדנ״א המשלים"
          - "האנזים Cas9 מסתמך על תנועה אקראית בלבד ללא שום הכוונה"
          - "ננו-חלקיקים מגנטיים מנווטים את האנזים לפי השדה המגנטי של כדור הארץ"
          - "נוגדנים מזהים את קרום התא ומזריקים אנזימי הגבלה פנימה"
        correct: 0
        explanation: "ה-sgRNA מכיל רצף של 20 בסיסים המתחבר בהתאמה משלימה לרצף הדנ״א המבוקש בגנום, ומכוון את ה-Cas9 לחתוך בדיוק שם."
      - type: multiple_choice
        question: "איזה אנזים עמיד בחום, שבודד מחיידק במעיינות חמים (Thermus aquaticus), איפשר את האוטומציה של בדיקות ה-PCR?"
        options:
          - "Taq פולימראז"
          - "אנזים EcoRI"
          - "T4 דנ״א ליגאז"
          - "רנ״א פולימראז II"
        correct: 0
        explanation: "Taq פולימראז אינו נהרס בטמפרטורת הדנטורציה הגבוהה של 95 מעלות צלזיוס, מה שמאפשר מחזורי שכפול רציפים במכשיר PCR."
      - type: multiple_choice
        question: "כמה מחזורי חום ב-PCR נדרשים כדי להגביר מולקולת דנ״א מקורית אחת ליותר ממיליארד עותקים (2 בחזקת 30)?"
        options:
          - "30 מחזורים"
          - "10 מחזורים"
          - "1,000 מחזורים"
          - "100 מחזורים"
        correct: 0
        explanation: "מכיוון ש-PCR מכפיל את כמות הדנ״א בכל מחזור (שכפול מעריכי של 2 בחזקת n), לאחר 30 מחזורים מתקבלים מעל מיליארד עותקים."
      - type: multiple_choice
        question: "איזה רכב הובלה משמש בחיסוני mRNA מודרניים כדי להגן על מולקולות הרנ״א העדינות ולהחדירן דרך קרום התא?"
        options:
          - "ננו-חלקיקי שומן (Lipid Nanoparticles - LNPs)"
          - "נבגי חיידקים מומתים"
          - "קליעי זהב מיקרוסקופיים"
          - "קפסולות סיבי תאית"
        correct: 0
        explanation: "ננו-חלקיקי שומן מגינים על ה-mRNA מפירוק אנזימטי מהיר בדם ומתמזגים עם קרומי התאים כדי לשחרר את התעתיק לציטופלזמה."
      - type: multiple_choice
        question: "מהם אנזימי הגבלה (Restriction Endonucleases), המשמשים כ-׳מספריים מולקולריים׳ בהנדסה גנטית?"
        options:
          - "אנזימים חיידקיים המזהים וחותכים רצפי דנ״א פלינדרומיים ספציפיים"
          - "חלבונים המסנתזים חומצות אמינו על פני הריבוזום"
          - "הורמונים המעודדים ספיגת גלוקוז בתאי הגוף"
          - "שומנים המרכיבים את מעטפת הנגיפים"
        correct: 0
        explanation: "אנזימי הגבלה התפתחו בחיידקים להגנה מפני נגיפים, וחותכים רצפים פלינדרומיים ספציפיים ליצירת ׳קצוות דביקים׳ להנדסה גנטית."
      - type: multiple_choice
        question: "באלקטרופורזה בג׳ל אגרוז, לאיזה כיוון נודדים מקטעי הדנ״א תחת השפעת שדה חשמלי?"
        options:
          - "לעבר האלקטרודה החיובית (אנודה), כיוון ששלד הפוספטים של הדנ״א טעון שלילית"
          - "לעבר האלקטרודה השלילית (קתודה), כיוון שהבסיסים החנקניים חיוביים"
          - "כלפי מעלה בשל כוח ציפה כבידתי"
          - "באופן אקראי לכל הכיוונים לפי תנועה תרמית"
        correct: 0
        explanation: "מטענו של שלד הסוכר-פוספט של הדנ״א הוא שלילי, ולכן במתח חשמלי המולקולות נעות אל הקוטב החיובי דרך סיבי הג׳ל."
      - type: multiple_choice
        question: "מהו פלסמיד (Plasmid), המשמש כווקטור מרכזי בשיבוט גנים בחיידקים?"
        options:
          - "מולקולת דנ״א מעגלית חוץ-כרומוזומלית המשתכפלת באופן עצמאי בחיידק"
          - "חלקיק נגיפי המשמיד דפנות תאים"
          - "חלבון המחבר כרומוזומים בעת חלוקה"
          - "מבנה חומצי בתוך הליזוזום"
        correct: 0
        explanation: "פלסמידים הם מקטעי דנ״א מעגליים בחיידקים המשתכפלים עצמאית, ומשמשים נשאים (וקטורים) להחדרת גנים רצויים."
      - type: multiple_choice
        question: "איזה מנגנון תיקון דנ״א תאי מנוצל בקריספר להחדרת רצף גנטי מותאם אישית (Knock-in) באמצעות תבנית תורמת?"
        options:
          - "תיקון מונחה הומולוגיה (HDR - Homology-Directed Repair)"
          - "איחוי קצוות לא-הומולוגי (NHEJ)"
          - "מנגנון תיקון אי-התאמה (Mismatch Repair)"
          - "פוטו-ראקטיבציה"
        correct: 0
        explanation: "מנגנון HDR משתמש ברצפי הומולוגיה של מקטע דנ״א תורם כדי לשלב במדויק גן חדש אל תוך אתר החיתוך."
      - type: multiple_choice
        question: "איזה רצף קצר בן שלושה נוקלאוטידים (כגון NGG) חייב להימצא סמוך לאתר המטרה כדי ש-Cas9 יוכל לחתוך?"
        options:
          - "מוטיב PAM (Protospacer Adjacent Motif)"
          - "תיבת TATA"
          - "אות פולי-A"
          - "רצף שיין-דלגרנו"
        correct: 0
        explanation: "רצף ה-PAM (5'-NGG-3' ב-SpCas9) חיוני לקשירת האנזים לדנ״א וליכולתו לפרום את הסליל ולחתוך אותו."
      - type: multiple_choice
        question: "מהו רצף הטמפרטורות התלת-שלבי המתבצע בכל מחזור סטנדרטי של בדיקת PCR?"
        options:
          - "דנטורציה (כ-95°C), איחוי פריימרים (כ-55°C) והארכה (כ-72°C)"
          - "הקפאה, הרתחה וסרכוז"
          - "דגירה בחום הגוף, אלקטרופורוזה והמסה"
          - "ליגציה, שעתוק ותרגום"
        correct: 0
        explanation: "מחזור PCR כולל: דנטורציה ב-95 מעלות להפרדת הגדילים, אנילינג ב-55 מעלות לקשירת הפריימרים, ואקסטנשן ב-72 מעלות לסינתזה."
      - type: multiple_choice
        question: "מהו ׳דחף גנטי׳ (Gene Drive) המתוכנן באמצעות טכנולוגיית קריספר?"
        options:
