id: prob_stats_101_he
type: academic
icon: 🎲
title: הסתברות וסטטיסטיקה למפתחי תוכנה ומהנדסים (Prob & Stats 101)
description: 'מדריך הנדסי מעמיק מעקרונות ראשוניים: קומבינטוריקה, משתנים מקריים בדידים ורציפים, משפט בייס, משפט הגבול המרכזי, בדיקת השערות וניסויי A/B, ושרשראות מרקוב במערכות מחשב.'
lang: he
audience: family
categories:
- id: combinatorics_sample_spaces
  title: '1. יסודות: קומבינטוריקה, מאורעות ומרחבי מדגם'
  description: אקסיומות ההסתברות של קולמוגורוב, עקרונות ספירה, תמורות וצירופים, הסתברות מותנית, אי-תלות סטטיסטית ופרדוקס ימי ההולדת.
  cards:
  - id: axioms_of_probability_kolmogorov
    title: אקסיומות ההסתברות ופעולות על קבוצות
    figure:
      title: 'דיאגרמות ון: איחוד, חיתוך ומאורעות זרים'
      svg: "<svg viewBox=\"0 0 500 130\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-height:130px;\">\n  <rect x=\"20\" y=\"15\" width=\"210\" height=\"100\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" opacity=\"0.3\"/>\n  <text x=\"30\" y=\"32\" font-size=\"10\" fill=\"currentColor\" opacity=\"0.6\">מרחב המדגם Ω</text>\n  <circle cx=\"95\" cy=\"70\" r=\"35\" fill=\"#3b82f6\" fill-opacity=\"0.3\" stroke=\"#3b82f6\" stroke-width=\"2\"/>\n  <text x=\"80\" y=\"73\" font-size=\"11\" font-weight=\"bold\" fill=\"#3b82f6\">A</text>\n  <circle cx=\"145\" cy=\"70\" r=\"35\" fill=\"#10b981\" fill-opacity=\"0.3\" stroke=\"#10b981\" stroke-width=\"2\"/>\n  <text x=\"160\" y=\"73\" font-size=\"11\" font-weight=\"bold\" fill=\"#10b981\">B</text>\n  <text x=\"120\" y=\"73\" font-size=\"10\" font-weight=\"bold\" fill=\"currentColor\">A ∩ B</text>\n  <rect x=\"260\" y=\"15\" width=\"220\" height=\"100\" rx=\"8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"\
        1.5\" opacity=\"0.3\"/>\n  <text x=\"270\" y=\"32\" font-size=\"10\" fill=\"currentColor\" opacity=\"0.6\">מאורעות זרים (מוציאים זה את זה)</text>\n  <circle cx=\"320\" cy=\"70\" r=\"30\" fill=\"#8b5cf6\" fill-opacity=\"0.3\" stroke=\"#8b5cf6\" stroke-width=\"2\"/>\n  <text x=\"320\" y=\"73\" font-size=\"11\" font-weight=\"bold\" fill=\"#8b5cf6\" text-anchor=\"middle\">A</text>\n  <circle cx=\"420\" cy=\"70\" r=\"30\" fill=\"#ec4899\" fill-opacity=\"0.3\" stroke=\"#ec4899\" stroke-width=\"2\"/>\n  <text x=\"420\" y=\"73\" font-size=\"11\" font-weight=\"bold\" fill=\"#ec4899\" text-anchor=\"middle\">B</text>\n  <text x=\"370\" y=\"73\" font-size=\"9\" fill=\"currentColor\" text-anchor=\"middle\">P(A ∩ B) = 0</text>\n</svg>"
      caption: 'אקסיומות קולמוגורוב מגדירות את חוקי ההסתברות במרחב מדגם $\Omega$: הסתברויות אינן שליליות, סך המרחב שווה ל-1.0, ומאורעות זרים מתחברים ישירות.'
    points:
    - 'תורת ההסתברות המודרנית מושתתת על שלוש אקסיומות קולמוגורוב: (1) אי-שליליות: $P(E) \ge 0$ לכל מאורע $E$; (2) נרמול: $P(\Omega) = 1.0$ עבור מרחב המדגם כולו $\Omega$; (3) אדיטיביות בת-מנייה: עבור כל סדרת מאורעות זרים הדדית, $P(\bigcup E_i) = \sum P(E_i)$.'
    - כלל המשלים קובע כי $P(A^c) = 1 - P(A)$. בהנדסת אמינות מערכות מחשב, קל בהרבה לחשב את ההסתברות ש'לפחות רכיב אחד כשל' על ידי חישוב 1 פחות ההסתברות שכל הרכיבים פעלו כשורה.
    - עקרון ההכלה וההפרדה קובע שעבור שני מאורעות כלליים מתקיים $P(A \cup B) = P(A) + P(B) - P(A \cap B)$, כאשר מחסירים את החיתוך המשותף כדי למנוע ספירה כפולה.
    - אי-שוויון בול (חסם האיחוד) מוכיח כי $P(\bigcup A_i) \le \sum P(A_i)$ עבור כל אוסף מאורעות, ומספק חסם עליון קריטי בניתוח סיבוכיות של אלגוריתמים ומבני נתונים אקראיים.
  - id: combinatorics_permutations_combinations
    title: 'קומבינטוריקה: תמורות, צירופים ופרדוקס ימי ההולדת'
    points:
    - עקרון הכפל הבסיסי קובע שאם פעולה אחת יכולה להתבצע ב-$n_1$ דרכים ופעולה שנייה ב-$n_2$ דרכים, שתי הפעולות יחד יכולות להתבצע ב-$n_1 \times n_2$ אופנים נפרדים.
    - 'תמורות (Permutations) מודדות סידורים של $k$ איברים מתוך $n$ כאשר יש חשיבות לסדר: $P(n, k) = \frac{n!}{(n-k)!}$. כאשר הסדר אינו חשוב, אנו מחשבים צירופים (Combinations): $\binom{n}{k} = \frac{n!}{k!(n-k)!}$.'
    - שיטת מחיצות וכוכבים (Stars and Bars) מוכיחה שמספר הדרכים לחלק $k$ משימות זהות בין $n$ שרתים מובחנים הוא $\binom{k + n - 1}{n - 1}$, מדד חיוני בתורת התורים ואיזון עומסים.
    - פרדוקס ימי ההולדת מגלה שבקבוצה של 23 אנשים בלבד, ההסתברות שלפחות שניים יחלקו יום הולדת משותף עולה על 50%. במדעי המחשב, עקרון זה מכתיב את שיעור ההתנגשויות בטבלאות גיבוב (Hash Tables) ואבטחת פונקציות גיבוב קריפטוגרפיות ($O(\sqrt{N})$ למציאת התנגשות).
  - id: conditional_probability_independence
    title: הסתברות מותנית, אי-תלות ופרדוקס סימפסון
    points:
    - 'הסתברות מותנית מודדת את הסיכוי להתרחשות מאורע $A$ בהינתן שמאורע $B$ כבר התרחש: $P(A|B) = \frac{P(A \cap B)}{P(B)}$, ובכך מצמצמת את מרחב המדגם כולו $\Omega$ לתת-המרחב $B$.'
    - 'כלל הכפל מנסח זאת כ-$P(A \cap B) = P(B) \times P(A|B)$. הרחבה למספר מאורעות עוקבים מניבה את כלל השרשרת: $P(A_1 \cap \dots \cap A_n) = P(A_1)P(A_2|A_1)\dots P(A_n|A_1 \dots A_{n-1})$.'
    - שני מאורעות $A$ ו-$B$ הם בלתי תלויים סטטיסטית אם ורק אם $P(A \cap B) = P(A)P(B)$, או באופן שקול $P(A|B) = P(A)$. ידיעת התרחשותו של $B$ אינה מעניקה שום מידע חדש על סיכויי $A$.
    - פרדוקס סימפסון הוא תופעה סטטיסטית מתעתעת שבה מגמה הנצפית במספר תת-קבוצות נפרדות מתהפכת לחלוטין או נעלמת כאשר מאחדים את הקבוצות יחד, עקב קיומו של משתנה מתערב (Confounding Variable).
  trivia:
  - type: multiple_choice
    question: איזה מתמטיקאי ניסח בשנת 1933 את שלוש האקסיומות היסודיות שעליהן נשענת תורת ההסתברות המודרנית?
    options:
    - אנדריי קולמוגורוב
    - פייר-סימון לפלס
    - בלז פסקל
    - קרל פרידריך גאוס
    correct: 0
    explanation: אנדריי קולמוגורוב ביסס את תורת ההסתברות על תורת המידה באמצעות שלוש אקסיומות של אי-שליליות, נרמול ואדיטיביות.
  - type: multiple_choice
    question: מהי הנוסחה לחישוב מספר הצירופים (בחירת תת-קבוצה בגודל $k$ מתוך $n$ איברים ללא חשיבות לסדר)?
    options:
    - $\binom{n}{k} = \frac{n!}{k!(n-k)!}$
    - $P(n, k) = \frac{n!}{(n-k)!}$
    - $n^k$
    - $\frac{n!}{k!}$
    correct: 0
    explanation: נוסחת המקדם הבינומי מחלקת את מספר התמורות ב-!k כדי לבטל את החשיבות של סדר האיברים הפנימי בקבוצה.
  - type: multiple_choice
    question: מהו מספר האנשים המינימלי בחדר שבו ההסתברות שלפחות שניים יחלקו יום הולדת באותו תאריך עולה על 50%?
    options:
    - 23 אנשים
    - 183 אנשים
    - 75 אנשים
    - 50 אנשים
    correct: 0
    explanation: בקבוצה של 23 איש קיימים 253 זוגות אפשריים, מה שמעלה את ההסתברות ליום הולדת משותף ל-50.7%.
  - type: multiple_choice
    question: אם שני מאורעות $A$ ו-$B$ הם זרים (מוציאים זה את זה) ובעלי הסתברויות חיוביות, מהי ההסתברות המשותפת $P(A \cap B)$?
    options:
    - $0$
    - $P(A) \times P(B)$
    - $1.0$
    - $P(A) + P(B)$
    correct: 0
    explanation: מאורעות זרים אינם יכולים להתרחש בו-זמנית לפי הגדרתם, ולכן החיתוך ביניהם הוא הקבוצה הריקה והסתברותו אפס.
  - type: multiple_choice
    question: איזה אי-שוויון קובע כי ההסתברות לאיחוד מאורעות קטנה או שווה לסכום ההסתברויות הבודדות שלהם ($P(\bigcup A_i) \le \sum P(A_i)$)?
    options:
    - אי-שוויון בול (חסם האיחוד)
    - אי-שוויון מרקוב
    - אי-שוויון צ׳בישב
    - אי-שוויון ינסן
    correct: 0
    explanation: אי-שוויון בול (Union Bound) מעניק חסם עליון פשוט ושימושי להסתברות שלפחות מאורע אחד יתרחש ללא תלות בקשרים ביניהם.
  - type: multiple_choice
    question: איזה פרדוקס סטטיסטי מתאר מצב שבו מתאם חיובי הנצפה בכל תת-קבוצה בנפרד מתהפך למתאם שלילי כאשר מאחדים את הנתונים?
    options:
    - פרדוקס סימפסון
    - פרדוקס סנקט פטרבורג
    - פרדוקס ברטראן
    - פרדוקס מונטי הול
    correct: 0
    explanation: פרדוקס סימפסון נגרם עקב קיומו של משתנה מתערב בלתי נצפה המעוות את הפרופורציות בין הקבוצות.
  - type: multiple_choice
    question: מהו התנאי המתמטי הנדרש והמספיק לכך ששני מאורעות $A$ ו-$B$ יהיו בלתי תלויים סטטיסטית?
    options:
    - $P(A \cap B) = P(A) \times P(B)$
    - $P(A \cap B) = 0$
    - $P(A \cup B) = 1$
    - $P(A) = P(B)$
    correct: 0
    explanation: אי-תלות סטטיסטית פירושה שהתרחשות המאורע $B$ אינה משנה את סיכויי $A$, כלומר $P(A|B) = P(A)$, מה שמוביל ל-$P(A \cap B) = P(A)P(B)$.
  - type: multiple_choice
    question: בכמה דרכים שונות ניתן לשייך 8 תהליכונים (Threads) ל-8 ליבות מעבד ייעודיות (Core Affinity) כך שכל תהליכון יקבל ליבה נפרדת?
    options:
    - $8! = 40,320$ דרכים
    - $8^8 = 16,777,216$ דרכים
    - $\binom{8}{2} = 28$ דרכים
    - $64$ דרכים
    correct: 0
    explanation: 'סידור של 8 איברים מובחנים ב-8 מקומות ייחודיים הוא בעיית תמורה מלאה: $8! = 40,320$ אפשרויות.'
  - type: multiple_choice
    question: מהי ההסתברות לקבלת לפחות תוצאת 'עץ' אחת בהטלת מטבע הוגן 4 פעמים ברציפות?
    options:
    - $15/16$ (93.75%)
    - $1/2$ (50%)
    - $1/16$ (6.25%)
    - $7/8$ (87.5%)
    correct: 0
    explanation: 'באמצעות כלל המשלים: $1 - P(\text{הכל פלי}) = 1 - (1/2)^4 = 1 - 1/16 = 15/16$.'
  - type: multiple_choice
    question: איזו נוסחה קומבינטורית מייצגת את מספר הדרכים לחלק $k$ פריטים זהים בין $n$ תאים מובחנים (שיטת מחיצות וכוכבים)?
    options:
    - $\binom{k + n - 1}{n - 1}$
    - $n^k$
    - $\frac{n!}{(n-k)!}$
    - $\binom{n}{k}$
    correct: 0
    explanation: שיטת המחיצות ממקמת $n-1$ מחיצות בין $k$ כוכבים, ומניבה $\binom{k + n - 1}{n - 1}$ דרכי חלוקה אפשריות.
  - type: multiple_choice
    question: בפונקציית גיבוב בעלת מרחב פלט של $N = 2^{64}$ ערכים, כמה ערכים אקראיים נדרש לייצר בקירוב כדי להגיע לסיכוי של 50% להתנגשות?
    options:
    - כ-$2^{32}$ ערכים ($O(\sqrt{N})$)
    - כ-$2^{63}$ ערכים
    - כ-$2^{16}$ ערכים
    - כ-$2^{64}$ ערכים
    correct: 0
    explanation: על פי פרדוקס ימי ההולדת, מספר הדגימות הנדרש להתנגשות בהסתברות 50% בסולם ערכים $N$ פרופורציונלי ל-$\sqrt{N} = \sqrt{2^{64}} = 2^{32}$.
  - type: multiple_choice
    question: מה קובע עקרון ההכלה וההפרדה עבור חישוב ההסתברות לאיחוד שני מאורעות כלליים $P(A \cup B)$?
    options:
    - $P(A) + P(B) - P(A \cap B)$
    - $P(A) + P(B)$
    - $P(A) \times P(B)$
    - $\frac{P(A \cap B)}{P(B)}$
    correct: 0
    explanation: חיבור הסתברויות $A$ ו-$B$ סופר פעמיים את האזור המשותף; החסרת החיתוך $P(A \cap B)$ מאזנת את הסכום במדויק.
  - type: multiple_choice
    question: אם ידוע כי $P(A) = 0.4$, $P(B) = 0.5$ והמאורעות בלתי תלויים, מהי ההסתברות המשותפת $P(A \cap B)$?
    options:
    - $0.20$
    - $0.90$
    - $0.10$
    - $0.0$
    correct: 0
    explanation: 'בהינתן אי-תלות, ההסתברות המשותפת היא מכפלת ההסתברויות: $0.4 \times 0.5 = 0.20$.'
  - type: multiple_choice
    question: מהי ההסתברות המותנית $P(A|B)$ אם ידוע שהמאורע $B$ מוכל לחלוטין בתוך המאורע $A$ ($B \subset A$ ו-$P(B) > 0$)?
    options:
    - $1.0$
    - $P(A)$
    - $0.0$
    - $P(B)$
    correct: 0
    explanation: אם $B$ מוכל ב-$A$, התרחשותו של $B$ גוררת בהכרח את התרחשותו של $A$, ולכן $P(A|B) = 1.0$.
  - type: multiple_choice
    question: בבדיקת תוכנה אוטומטית הכוללת 5 בדיקות יחידה בלתי תלויות שכל אחת עוברת בהסתברות 99%, מה הסיכוי שכל 5 הבדיקות יעברו בהצלחה?
    options:
    - כ-95.1% ($(0.99)^5$)
    - 99.0%
    - 90.0%
    - 99.5%
    correct: 0
    explanation: 'מכיוון שהבדיקות בלתי תלויות, ההסתברות המשותפת היא מכפלת ההסתברויות: $(0.99)^5 \approx 0.951$.'
- id: random_variables_distributions
  title: 2. משתנים מקריים, תוחלת והתפלגויות
  description: משתנים מקריים בדידים מול רציפים, פונקציות הסתברות (PMF/PDF/CDF), תוחלת ושונות, התפלגויות בינומית, פואסונית, נורמלית ומעריכית.
  cards:
  - id: pmf_pdf_cdf_expectation
    title: פונקציות הסתברות, תוחלת ושונות
    figure:
      title: 'התפלגות נורמלית (גאוסית): כלל 68-95-99.7'
      svg: "<svg viewBox=\"0 0 500 130\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-height:130px;\">\n  <line x1=\"30\" y1=\"105\" x2=\"470\" y2=\"105\" stroke=\"currentColor\" stroke-width=\"1.5\" opacity=\"0.4\"/>\n  <!-- Bell curve fill -->\n  <path d=\"M 50 105 Q 150 105 200 65 Q 230 25 250 20 Q 270 25 300 65 Q 350 105 450 105 Z\" fill=\"#3b82f6\" fill-opacity=\"0.15\"/>\n  <!-- Bell curve outline -->\n  <path d=\"M 50 105 Q 150 105 200 65 Q 230 25 250 20 Q 270 25 300 65 Q 350 105 450 105\" fill=\"none\" stroke=\"#3b82f6\" stroke-width=\"2.5\"/>\n  <!-- Mean line -->\n  <line x1=\"250\" y1=\"20\" x2=\"250\" y2=\"105\" stroke=\"#ef4444\" stroke-width=\"1.5\" stroke-dasharray=\"3,3\"/>\n  <text x=\"250\" y=\"118\" font-size=\"10\" font-weight=\"bold\" fill=\"#ef4444\" text-anchor=\"middle\">μ (ממוצע)</text>\n  <!-- 1 sigma -->\n  <line x1=\"200\" y1=\"65\" x2=\"200\" y2=\"105\" stroke=\"#10b981\" stroke-width=\"1\" stroke-dasharray=\"2,2\"/>\n  <line x1=\"300\" y1=\"65\"\
        \ x2=\"300\" y2=\"105\" stroke=\"#10b981\" stroke-width=\"1\" stroke-dasharray=\"2,2\"/>\n  <text x=\"200\" y=\"118\" font-size=\"9\" fill=\"currentColor\" opacity=\"0.7\" text-anchor=\"middle\">-1σ</text>\n  <text x=\"300\" y=\"118\" font-size=\"9\" fill=\"currentColor\" opacity=\"0.7\" text-anchor=\"middle\">+1σ</text>\n  <text x=\"250\" y=\"60\" font-size=\"11\" font-weight=\"bold\" fill=\"#3b82f6\" text-anchor=\"middle\">68.2% בטווח ±1σ</text>\n</svg>"
      caption: 'עקומת הפעמון של ההתפלגות הנורמלית: צפיפות ההסתברות מגיעה לשיאה בתוחלת $\mu$, כאשר כ-68.27% מהמסה נופלים בטווח $\pm 1\sigma$ וכ-95.45% בטווח $\pm 2\sigma$.'
    points:
    - משתנה מקרי $X$ ממפה תוצאות ממרחב המדגם לישר הממשי. משתנה בדיד מאופיין בפונקציית הסתברות (PMF) שבה $\sum p(x) = 1$, בעוד משתנה רציף מאופיין בפונקציית צפיפות (PDF) שבה $P(a \le X \le b) = \int_a^b f(x)dx$ וההסתברות לנקודה בודדת מדויקת היא תמיד אפס.
    - 'פונקציית התפלגות מצטברת (CDF) מוגדרת כ-$F(x) = P(X \le x)$, ועולה מונוטונית מ-0 ל-1. במשתנים רציפים, ה-PDF היא הנגזרת של ה-CDF: $f(x) = \frac{d}{dx}F(x)$.'
    - 'התוחלת $E[X]$ מייצגת את הממוצע המשוקלל: $\sum x p(x)$ או $\int x f(x) dx$. לינאריות התוחלת קובעת כי $E[aX + bY] = aE[X] + bE[Y]$, ומאפיין זה מתקיים תמיד גם אם המשתנים תלויים לחלוטין.'
    - 'שונות (Variance) מודדת את פיזור הערכים סביב התוחלת: $\text{Var}(X) = E[(X - E[X])^2] = E[X^2] - (E[X])^2$. סטיית התקן $\sigma = \sqrt{\text{Var}(X)}$ מחזירה את הפיזור ליחידות המדידה המקוריות.'
  - id: discrete_distributions_bernoulli_binomial_poisson
    title: 'התפלגויות בדידות: ברנולי, בינומית ופואסון'
    points:
    - ניסוי ברנולי מודד תוצאה בוליאנית בודדת (הצלחה/כישלון) עם הסתברות $p$, בעל תוחלת $p$ ושונות $p(1-p)$.
    - 'התפלגות בינומית $\text{Bin}(n, p)$ מודדת את מספר ההצלחות ב-$n$ ניסויי ברנולי בלתי תלויים: $P(X=k) = \binom{n}{k} p^k (1-p)^{n-k}$, עם תוחלת $np$ ושונות $np(1-p)$.'
    - 'התפלגות גאומטרית מודדת את מספר הניסיונות עד להשגת ההצלחה הראשונה: $P(X=k) = (1-p)^{k-1}p$, ומתאפיינת בתכונת חוסר זיכרון (Memorylessness) בעולם הבדיד.'
    - 'התפלגות פואסון $\text{Pois}(\lambda)$ מודדת את מספר המאורעות הנדירים המתרחשים בפרק זמן קבוע בקצב ממוצע $\lambda$: $P(X=k) = \frac{\lambda^k e^{-\lambda}}{k!}$, כאשר התוחלת והשונות שוות שתיהן ל-$\lambda$. היא משמשת למידול הגעת בקשות רשת, עומסי שרתים ושגיאות זיכרון.'
  - id: continuous_distributions_normal_exponential
    title: 'התפלגויות רציפות: אחידה, מעריכית ונורמלית (גאוסית)'
    points:
    - התפלגות רציפה אחידה $U(a, b)$ מעניקה צפיפות הסתברות קבועה לאורך קטע, ומהווה את הבסיס לייצור מספרים פסאודו-אקראיים במחשב (PRNG).
    - 'התפלגות מעריכית $\text{Exp}(\lambda)$ מודלת את זמן ההמתנה הרציף בין מופעי פואסון: $f(x) = \lambda e^{-\lambda x}$ עם תוחלת $1/\lambda$. זוהי ההתפלגות הרציפה היחידה בעלת תכונת חוסר זיכרון: $P(X > s + t | X > s) = P(X > t)$, ומשמשת לחישוב זמן ממוצע בין תקלות (MTBF).'
    - התפלגות נורמלית (גאוסית) $\mathcal{N}(\mu, \sigma^2)$ היא פעמון סימטרי שבו לפי כלל 68-95-99.7, כ-68.27% מהערכים נופלים בטווח $\pm 1\sigma$, כ-95.45% בטווח $\pm 2\sigma$, וכ-99.73% בטווח $\pm 3\sigma$.
    - התפלגויות בעלות זנב כבד (כמו פארטו ו-Power-Law) ממדלות תעבורת רשת, גדלי קבצים וזמני השהיה (Latency) בעולם האמיתי שבהם מקרי קיצון (Outliers) מופיעים בשכיחות גבוהה בהרבה מתחזית גאוסית.
  trivia:
  - type: multiple_choice
    question: איזו תכונה יסודית של התוחלת המתמטית קובעת כי $E[aX + bY] = aE[X] + bE[Y]$ ללא תלות בשאלה האם המשתנים בלתי תלויים?
    options:
    - לינאריות התוחלת
    - חוק המספרים הגדולים
    - אי-שוויון מרקוב
    - אי-שוויון ינסן
    correct: 0
    explanation: לינאריות התוחלת מתקיימת תמיד ובאופן מוחלט לכל שני משתנים מקריים, גם אם הם תלויים לחלוטין או מתואמים שלילית.
  - type: multiple_choice
    question: במשתנה מקרי רציף בעל פונקציית צפיפות $f(x)$, מהי ההסתברות המדויקת שהמשתנה יקבל ערך ממשי ספציפי בודד $c$ ($P(X = c)$)?
    options:
    - $0$
    - $f(c)$
    - $1.0$
    - $1 / \infty$
    correct: 0
    explanation: מכיוון שרוחב האינטרוול של נקודה בודדת הוא אפס, האינטגרל שווה לאפס, וההסתברות לנקודה בודדת במשתנה רציף היא אפס.
  - type: multiple_choice
    question: בהתפלגות פואסון עם פרמטר $\lambda = 4$, מהם ערכי התוחלת $E[X]$ והשונות $\text{Var}(X)$?
    options:
    - שניהם שווים ל-4 ($E[X] = \text{Var}(X) = 4$)
    - $E[X] = 4$ ו-$\text{Var}(X) = 16$
    - $E[X] = 4$ ו-$\text{Var}(X) = 2$
    - $E[X] = 2$ ו-$\text{Var}(X) = 4$
    correct: 0
    explanation: המאפיין הייחודי של התפלגות פואסון הוא שהתוחלת והשונות שלה זהות לחלוטין ושוות שתיהן ל-$\lambda$.
  - type: multiple_choice
    question: על פי הכלל האמפירי (68-95-99.7) בהתפלגות נורמלית, איזה אחוז בקירוב מתוך הנתונים נופל בטווח של עד שתי סטיות תקן מן הממוצע?
    options:
    - כ-95.4%
    - כ-68.3%
    - כ-99.7%
    - כ-50.0%
    correct: 0
    explanation: התפלגות גאוסית מכילה כ-68.27% בטווח $\pm 1\sigma$, כ-95.45% בטווח $\pm 2\sigma$, וכ-99.73% בטווח $\pm 3\sigma$.
  - type: multiple_choice
    question: איזו תכונה מתמטית ייחודית משותפת באופן בלעדי להתפלגות המעריכית (רציפה) ולהתפלגות הגאומטרית (בדידה)?
    options:
    - חוסר זיכרון ($P(X > s + t | X > s) = P(X > t)$)
    - צידוד שווה לאפס
    - מרחב ערכים חסום
    - שוויון בין חציון וממוצע
    correct: 0
    explanation: תכונת חוסר הזיכרון קובעת שזמן ההמתנה שנותר עד להתרחשות המאורע אינו תלוי כלל בזמן שכבר חלף.
  - type: multiple_choice
    question: אם למשתנה מקרי $X$ יש תוחלת $E[X] = 10$ ומומנט שני $E[X^2] = 109$, מהי השונות שלו $\text{Var}(X)$?
    options:
    - $9$
    - $109$
    - $19$
    - $81$
    correct: 0
    explanation: 'לפי נוסחת השונות: $\text{Var}(X) = E[X^2] - (E[X])^2 = 109 - 10^2 = 109 - 100 = 9$.'
  - type: multiple_choice
    question: איזו התפלגות הסתברות מודדת את מספר ההצלחות הכולל ב-$n$ ניסויים בוליאניים בלתי תלויים בעלי הסתברות הצלחה $p$?
    options:
    - התפלגות בינומית
    - התפלגות פואסון
    - התפלגות היפרגאומטרית
    - התפלגות מעריכית
    correct: 0
    explanation: התפלגות בינומית $\text{Bin}(n, p)$ מודדת את סכום ההצלחות ב-$n$ ניסויי ברנולי בלתי תלויים.
  - type: multiple_choice
    question: אם קצב הגעת בקשות רשת מתנהג כתהליך פואסון בקצב $\lambda = 5$ בקשות בשנייה, איזו התפלגות מתארת את זמן ההמתנה הרציף בין בקשות עוקבות?
    options:
    - התפלגות מעריכית עם פרמטר $\lambda = 5$
    - התפלגות נורמלית עם ממוצע $5$
    - התפלגות אחידה בין $0$ ל-$5$
    - התפלגות גאומטרית עם $p = 0.2$
    correct: 0
    explanation: הזמנים הרציפים בין מופעים עוקבים בתהליך פואסון בקצב $\lambda$ מתפלגים מעריכית עם אותו פרמטר $\lambda$.
  - type: multiple_choice
    question: מהו הקשר המתמטי בין פונקציית ההתפלגות המצטברת $F(x)$ לפונקציית הצפיפות $f(x)$ במשתנה מקרי רציף?
    options:
    - $f(x) = \frac{d}{dx} F(x)$ (הצפיפות היא הנגזרת של המצטברת)
    - $F(x) = \frac{d}{dx} f(x)$
    - $F(x) = 1 - f(x)$
    - $f(x) = F(x)^2$
    correct: 0
    explanation: לפי המשפט היסודי של החדו״א, פונקציית הצפיפות $f(x)$ היא הנגזרת הראשונה של פונקציית ההתפלגות המצטברת $F(x)$.
  - type: multiple_choice
    question: אם לקריאת שרת יש סיכוי כשל של $p = 0.05$, מהו מספר הקריאות הצפוי בממוצע עד לקבלת הכשל הראשון?
    options:
    - 20 קריאות ($1/p$)
    - 5 קריאות
    - 100 קריאות
    - 50 קריאות
    correct: 0
    explanation: התוחלת של התפלגות גאומטרית המודדת מספר ניסיונות עד להצלחה או כשל ראשון היא $E[X] = 1/p = 1 / 0.05 = 20$.
  - type: multiple_choice
    question: מהי השונות של ניסוי ברנולי בודד בעל הסתברות הצלחה $p$?
    options:
    - $p(1 - p)$
    - $p^2$
    - $1 - p$
    - $\sqrt{p(1 - p)}$
    correct: 0
    explanation: בניסוי ברנולי $E[X] = p$ ו-$E[X^2] = p$, ולכן השונות היא $p - p^2 = p(1 - p)$.
  - type: multiple_choice
    question: מדוע הנחת התפלגות גאוסית מסוכנת בעת ניטור זמני השהיה קיצוניים במערכות תוכנה (כגון אחוזון p99 או p99.9)?
    options:
    - זמני השהיה בפרודקשן מאופיינים בזנב כבד שבו אירועי קיצון שכיחים בסדרי גודל רבים מתחזית נורמלית
    - התפלגות גאוסית אינה מסוגלת לקבל ערכים חיוביים
    - התפלגות גאוסית מתאימה רק למספרים בדידים של מילישניות
    - הממוצע של התפלגות גאוסית שווה תמיד לאפס
    correct: 0
    explanation: מערכות מחשב אמיתיות מתנהגות לפי התפלגויות זנב כבד; הערכת שגיאות קיצון לפי התפלגות נורמלית מתעלמת משיבושים חמורים.
  - type: multiple_choice
    question: אם $X$ ו-$Y$ הם שני משתנים מקריים בלתי תלויים, מהי השונות של סכומם $\text{Var}(X + Y)$?
    options:
    - $\text{Var}(X) + \text{Var}(Y)$
    - $\text{Var}(X) \times \text{Var}(Y)$
    - $(\text{Var}(X) + \text{Var}(Y))^2$
    - $\sqrt{\text{Var}(X)} + \sqrt{\text{Var}(Y)}$
    correct: 0
    explanation: במשתנים בלתי תלויים השונות המשותפת (Covariance) היא אפס, ולכן שונות הסכום היא פשוט סכום השונויות.
  - type: multiple_choice
    question: למה חייב להיות שווה האינטגרל הכולל של כל פונקציית צפיפות הסתברות חוקית $f(x)$ על פני כל הישר $(-\infty, \infty)$?
    options:
    - בדיוק ל-1.0
    - לאינסוף
    - לאפס
    - ל-$\pi$
    correct: 0
    explanation: לפי אקסיומת הנרמול של קולמוגורוב, סך ההסתברות במרחב כולו חייב להסתכם בדיוק ל-1.0.
  - type: multiple_choice
    question: אם מטבע בעל הטיה של 70% לנפילה על 'עץ' ($p = 0.7$) מוטל 100 פעמים ברציפות, מהו מספר תוצאות ה'עץ' הצפוי בממוצע?
    options:
    - 70 תוצאות ($np$)
    - 50 תוצאות
    - 35 תוצאות
    - 7 תוצאות
    correct: 0
    explanation: 'בהתפלגות בינומית $\text{Bin}(n, p)$, התוחלת מחושבת על ידי מכפלת מספר הניסיונות בהסתברות: $100 \times 0.7 = 70$.'
- id: bayes_theorem_bayesian_inference
  title: 3. משפט בייס, הסקת מסקנות והסתברות בייסיאנית
  description: חוק ההסתברות השלמה, משפט בייס, כשל שיעור הבסיס (Base Rate Fallacy), התפלגויות פריור ופוסטריור, פריורים צמודים וסיווג טקסטים באמצעות Naive Bayes.
  cards:
  - id: bayes_theorem_and_total_probability
    title: חוק ההסתברות השלמה ונוסחת בייס
    figure:
      title: 'משפט בייס: עדכון פריור לפוסטריור באמצעות ראיות'
      svg: "<svg viewBox=\"0 0 500 130\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-height:130px;\">\n  <!-- Prior Box -->\n  <rect x=\"25\" y=\"40\" width=\"100\" height=\"50\" rx=\"8\" fill=\"#3b82f6\" fill-opacity=\"0.15\" stroke=\"#3b82f6\" stroke-width=\"2\"/>\n  <text x=\"75\" y=\"60\" font-size=\"11\" font-weight=\"bold\" fill=\"#3b82f6\" text-anchor=\"middle\">פריור P(H)</text>\n  <text x=\"75\" y=\"75\" font-size=\"9\" fill=\"currentColor\" opacity=\"0.7\" text-anchor=\"middle\">אמונה מוקדמת</text>\n  <!-- Arrow 1 -->\n  <line x1=\"125\" y1=\"65\" x2=\"185\" y2=\"65\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <!-- Likelihood Box -->\n  <rect x=\"185\" y=\"40\" width=\"130\" height=\"50\" rx=\"8\" fill=\"#10b981\" fill-opacity=\"0.15\" stroke=\"#10b981\" stroke-width=\"2\"/>\n  <text x=\"250\" y=\"60\" font-size=\"11\" font-weight=\"bold\" fill=\"#10b981\" text-anchor=\"middle\">נראות P(E|H)</text>\n  <text x=\"250\" y=\"75\" font-size=\"9\" fill=\"currentColor\"\
        \ opacity=\"0.7\" text-anchor=\"middle\">ראיות שנצפו</text>\n  <!-- Arrow 2 -->\n  <line x1=\"315\" y1=\"65\" x2=\"375\" y2=\"65\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <!-- Posterior Box -->\n  <rect x=\"375\" y=\"40\" width=\"105\" height=\"50\" rx=\"8\" fill=\"#8b5cf6\" fill-opacity=\"0.15\" stroke=\"#8b5cf6\" stroke-width=\"2\"/>\n  <text x=\"427\" y=\"60\" font-size=\"11\" font-weight=\"bold\" fill=\"#8b5cf6\" text-anchor=\"middle\">פוסטריור P(H|E)</text>\n  <text x=\"427\" y=\"75\" font-size=\"9\" fill=\"currentColor\" opacity=\"0.7\" text-anchor=\"middle\">אמונה מעודכנת</text>\n  <!-- Formula below -->\n  <text x=\"250\" y=\"115\" font-size=\"10\" font-weight=\"bold\" fill=\"currentColor\" text-anchor=\"middle\">P(H|E) = [P(E|H) · P(H)] / P(E)</text>\n</svg>"
      caption: משפט בייס מעדכן את האמונה ההסתברותית המוקדמת $P(H)$ להתפלגות פוסטריור מעודכנת $P(H|E)$ עם קבלת ראיות חדשות $E$ דרך פונקציית הנראות $P(E|H)$.
    points:
    - חוק ההסתברות השלמה קובע כי אם $\{B_1, \dots, B_n\}$ מהווים חלוקה זרה של מרחב המדגם, ההסתברות לכל מאורע $A$ מחושבת כ-$P(A) = \sum P(A|B_i)P(B_i)$.
    - 'משפט בייס מעדכן את האמונות ההסתברותיות שלנו בעקבות צפייה בראיות חדשות: $P(H|E) = \frac{P(E|H)P(H)}{P(E)}$, כאשר $P(H)$ הוא הסיכוי המוקדם (Prior), $P(E|H)$ היא הנראות (Likelihood), ו-$P(H|E)$ הוא הפוסטריור המעודכן.'
    - 'פירוק המכנה באמצעות חוק ההסתברות השלמה יוצר את הנוסחה המעשית: $P(H|E) = \frac{P(E|H)P(H)}{P(E|H)P(H) + P(E|\neg H)P(\neg H)}$.'
    - 'צורת יחסי הסיכויים (Odds Form) קובעת כי: סיכויי פוסטריור = סיכויי פריור $\times$ יחס הנראויות (Bayes Factor), מה שמאפשר עדכון סדרתי מהיר של מידע.'
  - id: base_rate_fallacy_and_medical_testing
    title: כשל שיעור הבסיס ופרדוקס החיובי השגוי
    points:
    - כשל שיעור הבסיס (Base Rate Fallacy) מתרחש כאשר מתעלמים מהשכיחות המוקדמת של התופעה באוכלוסייה בעת פירוש תוצאת בדיקה חיובית.
    - אם מחלה נדירה פוגעת ב-1 מתוך 1,000 אנשים (0.1%), ובדיקה מאבחנת מדויקת ב-99% (1% שגיאה חיובית), אדם שנמצא חיובי הוא בעל סיכוי של כ-9% בלבד להיות חולה בפועל.
    - במערכות אבטחת מידע לזיהוי חדירות (IDS), התרעה בעלת דיוק של 99.9% תוביל לעומס התראות שווא אם תקיפות אמיתיות מהוות רק 0.001% מכלל תעבורת הרשת.
    - 'הדרך האינטואיטיבית לפתרון היא המרת אחוזים למספרים מוחלטים: מתוך 100,000 פריטים, 100 פגומים ו-99 מזוהים כפגומים, בעוד שמתוך 99,900 התקינים כ-999 יקבלו התראת שווא.'
  - id: bayesian_inference_conjugate_priors_naive_bayes
    title: פריורים צמודים, אומדן פוסטריור ו-Naive Bayes
    points:
    - 'גישה תכופתנית מול בייסיאנית: תכופתנים (Frequentists) רואים בהסתברות גבול של תדירות בניסויים חוזרים עם פרמטר קבוע, בעוד בייסיאנים רואים בהסתברות מדד של רמת אמון על פני התפלגות הפרמטר עצמו.'
    - 'פריורים צמודים (Conjugate Priors): כאשר התפלגות הפוסטריור שייכת לאותה משפחה של הפריור. התפלגות בטא צמודה לנראות בינומית ומאפשרת עדכון סגור: $\text{Beta}(\alpha + k, \beta + n - k)$ כאשר $\alpha, \beta$ משמשים כספירות דמה מוקדמות.'
    - 'אומדן פוסטריור מקסימלי (MAP) בוחר את ערך הפרמטר הממקסם את הפוסטריור: $\hat{\theta}_{MAP} = \arg\max_\theta P(D|\theta)P(\theta)$, ומשמש כמקבילה הבייסיאנית לרגולריזציה (L1/L2) מעל MLE.'
    - 'מסווג Naive Bayes מניח שכל התכונות (Features) בלתי תלויות הדדית בהינתן המחלקה: $P(C|x_1,\dots,x_n) \propto P(C) \prod P(x_i|C)$. למרות הפשטת היתר, האלגוריתם מהיר ביותר ומצטיין בסינון דואר זבל (Spam) וסיווג טקסטים.'
  trivia:
  - type: multiple_choice
    question: במשפט בייס $P(H|E) = \frac{P(E|H) P(H)}{P(E)}$, כיצד מכונה ההסתברות ההתחלתית $P(H)$ לפני קבלת הראיות החדשות?
    options:
    - הסתברות פריור (Prior)
    - נראות (Likelihood)
    - הסתברות פוסטריור (Posterior)
    - נראות שולית
    correct: 0
    explanation: הסתברות הפריור מייצגת את דרגת האמון בהשערה $H$ לפני שנחשפנו לראיות או לנתונים חדשים.
  - type: multiple_choice
    question: כיצד מכונה ההסתברות המותנית $P(E|H)$ בסטטיסטיקה בייסיאנית?
    options:
    - נראות (Likelihood)
    - פריור
    - פוסטריור
    - גורם הראיות
    correct: 0
    explanation: הנראות מודדת את ההסתברות לצפות בראיות $E$ בהינתן שההשערה $H$ אכן מתקיימת.
  - type: multiple_choice
    question: איזה כשל קוגניטיבי וסטטיסטי מתרחש כאשר אדם מפריז בהסתברות לתופעה עקב התעלמות משכיחותה המקורית הנמוכה באוכלוסייה?
    options:
    - כשל שיעור הבסיס (Base Rate Fallacy)
    - כשל המהמר
    - כשל היד החמה
    - פרדוקס ברקסון
    correct: 0
    explanation: כשל שיעור הבסיס מתרחש כאשר מפרשים תוצאת בדיקה חיובית מבלי להתחשב בשכיחות הנמוכה של התופעה באוכלוסייה הכללית.
  - type: multiple_choice
    question: אם מחלה פוגעת ב-1 מכל 1,000 איש ובדיקה מאבחנת מדייקת ב-99% עם 1% שגיאות שווא, מה הסיכוי שאדם עם תוצאה חיובית אכן חולה במחלה?
    options:
    - כ-9% (כ-1 מתוך 11)
    - כ-99%
    - כ-50%
    - כ-0.1%
    correct: 0
    explanation: במדגם של 100,000 איש יהיו 100 חולים (99 יאובחנו) ו-99,900 בריאים (כ-999 יקבלו אבחון שווא), ולכן שיעור החולים האמיתי מתוך החיוביים הוא כ-9%.
  - type: multiple_choice
    question: איזו הנחה מפשטת מעניקה למסווג Naive Bayes את הכינוי 'נאיבי'?
    options:
    - כל התכונות (Features) בלתי תלויות מותנית בהינתן סיווג המחלקה
    - כל הסתברויות הפריור שוות בדיוק ל-0.5
    - בנתוני האימון אין שגיאות תיוג כלל
    - כל המשתנים הרציפים מתפלגים באופן אחיד
    correct: 0
    explanation: האלגוריתם מניח בנאיביות שכל מאפיין מתנהג ללא כל תלות במאפיינים האחרים בהינתן המחלקה, מה שמפשט משמעותית את החישוב.
  - type: multiple_choice
    question: איזו התפלגות משמשת כפריור צמוד (Conjugate Prior) עבור פרמטר ההצלחה $p$ בהתפלגות בינומית?
    options:
    - התפלגות בטא (Beta)
    - התפלגות גאוסית
    - התפלגות גמא
    - התפלגות פואסון
    correct: 0
    explanation: התפלגות בטא היא הפריור הצמוד לנראות בינומית; הוספת הצלחות וכישלונות מעדכנת את הפרמטרים שלה באופן אלגברי סגור.
  - type: multiple_choice
    question: במה שונה באופן יסודי אומדן פוסטריור מקסימלי (MAP) מאומדן נראות מקסימלית (MLE)?
    options:
    - אומדן MAP משלב התפלגות פריור מוקדמת $P(\theta)$ על הפרמטרים
    - אומדן MAP אינו משתמש בנתוני תצפית
    - אומדן MAP מחזיר ערך נקודתי בעוד MLE מחזיר התפלגות שלמה
    - אומדן MAP מתאים אך ורק לנתונים בינאריים
    correct: 0
    explanation: בעוד MLE ממקסם את הנראות $P(D|\theta)$, אומדן MAP ממקסם את המכפלה $P(D|\theta)P(\theta)$ ובכך מוסיף רגולריזציה מובנית.
  - type: multiple_choice
    question: איזה משפט מתמטי מבטא את ההסתברות השולית $P(A)$ כסכום משוקלל $\sum P(A|B_i)P(B_i)$ על פני חלוקה זרה של המרחב?
    options:
    - חוק ההסתברות השלמה
    - משפט הגבול המרכזי
    - משפט ההרחבה של קולמוגורוב
    - משפט פוביני
    correct: 0
    explanation: חוק ההסתברות השלמה מאפשר לחשב את ההסתברות למאורע כולל על ידי פירוקו לתת-מרחבים זרים.
  - type: multiple_choice
    question: במסנן דואר זבל, אם מילה מסוימת מופיעה ב-80% מהודעות הספאם וב-2% בלבד מההודעות התקינות, מהו יחס הנראויות (Bayes Factor) שלה?
    options:
    - 40 ($0.80 / 0.02$)
    - '78'
    - '1.6'
    - '0.025'
    correct: 0
    explanation: 'גורם בייס מחושב כיחס הנראויות בין שתי המחלקות: $0.80 / 0.02 = 40$.'
  - type: multiple_choice
    question: בהסקה בייסיאנית, כיצד נקראת התפלגות ההסתברות המעודכנת המתקבלת לאחר שקלול הפריור עם נתוני התצפית החדשים?
    options:
    - התפלגות פוסטריור
    - התפלגות נראות
    - התפלגות אמפירית
    - התפלגות דגימה
    correct: 0
    explanation: התפלגות הפוסטריור $P(\theta|D)$ מייצגת את הידע המעודכן שלנו אודות הפרמטרים לאחר צפייה בנתונים.
  - type: multiple_choice
    question: אם האמונה המוקדמת מוגדרת כ-$\text{Beta}(2, 2)$ ובניסוי חדש נצפו 3 הצלחות וכישלון אחד, מהי התפלגות הפוסטריור המעודכנת?
    options:
    - $\text{Beta}(5, 3)$
    - $\text{Beta}(6, 2)$
    - $\text{Beta}(3, 2)$
    - $\text{Beta}(5, 5)$
    correct: 0
    explanation: "בעדכון בטא-בינומי מוסיפים הצלחות ל-$\alpha$ וכישלונות ל-$\beta$: $\alpha = 2 + 3 = 5$, $\beta = 2 + 1 = 3$."
  - type: multiple_choice
    question: מדוע מערכות לגילוי חדירות (IDS) בעלות דיוק גבוה של 99.9% עדיין מוצפות בכמויות גדולות של התראות שווא?
    options:
    - מכיוון שמתקפות אמיתיות מהוות חלק מזערי (למשל 0.001%) מכלל התעבורה, ולכן שגיאות השווא שולטות בסך ההתראות
    - מכיוון שחומות אש ברשת דוחות חישובים בייסיאניים
    - מכיוון שדיוק של 99.9% גורר בהכרח 10% שגיאות קבועות
    - מכיוון שחבילות נתונים אינן מצייתות להתפלגות ברנולי
    correct: 0
    explanation: עקב כשל שיעור הבסיס, כאשר תקיפות מהוות שיעור זעיר ביותר מכלל התעבורה, אפילו אחוז שגיאה קטן יוצר אלפי התראות שווא על כל התרעת אמת.
  - type: multiple_choice
    question: בניסוח יחסי הסיכויים (Odds) של משפט בייס, איזה גורם מוכפל ביחסי הסיכויים המוקדמים כדי לקבל את יחסי הפוסטריור?
    options:
    - גורם בייס (יחס הנראויות)
    - ההסתברות השולית $P(E)$
    - סטיית התקן $\sigma$
    - מקדם המתאם $r$
    correct: 0
    explanation: 'לפי צורת יחסי הסיכויים: יחסי פוסטריור שווים ליחסי פריור מוכפלים בגורם בייס (Bayes Factor).'
  - type: multiple_choice
    question: איזו גישה פילוסופית רואה בהסתברות מדד סובייקטיבי או אפיסטמי של דרגת אמון, ולא תדירות גבולית של ניסויים אינסופיים?
    options:
    - הגישה הבייסיאנית
    - הגישה התכופתנית (Frequentist)
    - הגישה הקלאסית של לפלס
    - גישת הנטייה הפיזיקלית
    correct: 0
    explanation: הגישה הבייסיאנית מגדירה הסתברות כמידת הוודאות או האמון של הסוכן בהינתן המידע הקיים, ומתאימה גם למאורעות חד-פעמיים.
  - type: multiple_choice
    question: אם להשערה $H$ יש פריור $P(H) = 0.5$, נראות $P(E|H) = 0.8$, ונראות משלימה $P(E|\neg H) = 0.2$, מהי ההסתברות הכוללת לצפות בראיה $P(E)$?
    options:
    - $0.50$
    - $1.00$
    - $0.16$
    - $0.80$
    correct: 0
    explanation: 'לפי חוק ההסתברות השלמה: $P(E) = (0.8)(0.5) + (0.2)(0.5) = 0.4 + 0.1 = 0.50$.'
- id: sampling_clt_hypothesis_testing
  title: 4. דגימה, משפט הגבול המרכזי ובדיקת השערות
  description: חוק המספרים הגדולים, משפט הגבול המרכזי (CLT), רווחי סמך, ערכי p, שגיאות מסוג I ו-II, ותכנון מבוקר של ניסויי A/B בתוכנה.
  cards:
  - id: law_of_large_numbers_and_clt
    title: חוק המספרים הגדולים ומשפט הגבול המרכזי
    figure:
      title: 'משפט הגבול המרכזי: התכנסות התפלגות הממוצע עם גודל המדגם n'
      svg: "<svg viewBox=\"0 0 500 130\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-height:130px;\">\n  <!-- n=1 Uniform -->\n  <rect x=\"30\" y=\"45\" width=\"90\" height=\"60\" fill=\"#3b82f6\" fill-opacity=\"0.2\" stroke=\"#3b82f6\" stroke-width=\"1.5\"/>\n  <text x=\"75\" y=\"40\" font-size=\"10\" font-weight=\"bold\" fill=\"#3b82f6\" text-anchor=\"middle\">n = 1 (אחידה)</text>\n  <!-- Arrow -->\n  <line x1=\"135\" y1=\"75\" x2=\"165\" y2=\"75\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <!-- n=4 Triangular -->\n  <polygon points=\"180,105 230,45 280,105\" fill=\"#10b981\" fill-opacity=\"0.2\" stroke=\"#10b981\" stroke-width=\"1.5\"/>\n  <text x=\"230\" y=\"40\" font-size=\"10\" font-weight=\"bold\" fill=\"#10b981\" text-anchor=\"middle\">n = 4 (מוחלקת)</text>\n  <!-- Arrow -->\n  <line x1=\"295\" y1=\"75\" x2=\"325\" y2=\"75\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <!-- n=30 Bell Curve -->\n  <path d=\"M 340 105 Q 380 105 400 65 Q 410 40 420 38 Q 430\
        \ 40 440 65 Q 460 105 480 105\" fill=\"#8b5cf6\" fill-opacity=\"0.2\" stroke=\"#8b5cf6\" stroke-width=\"2\"/>\n  <text x=\"410\" y=\"32\" font-size=\"10\" font-weight=\"bold\" fill=\"#8b5cf6\" text-anchor=\"middle\">n ≥ 30 (גאוסית)</text>\n  <line x1=\"20\" y1=\"105\" x2=\"485\" y2=\"105\" stroke=\"currentColor\" stroke-width=\"1\" opacity=\"0.4\"/>\n</svg>"
      caption: משפט הגבול המרכזי מראה כיצד סכום וממוצע של $n$ משתנים מקריים בלתי תלויים מתכנסים לעקומת פעמון נורמלית, ללא קשר להתפלגות המקורית של האוכלוסייה.
    points:
    - חוק המספרים הגדולים מוכיח שממוצע המדגם של משתנים מקריים בלתי תלויים ובעלי אותה התפלגות (i.i.d.) מתכנס בהסתברות אל תוחלת האוכלוסייה האמיתית $\mu$ כאשר גודל המדגם $n \to \infty$.
    - משפט הגבול המרכזי (CLT) קובע כי ללא קשר לצורת ההתפלגות המקורית של האוכלוסייה (אחידה, מוטה או רב-שיאית), סכום וממוצע הדגימות מתכנסים להתפלגות נורמלית $\mathcal{N}(\mu, \sigma^2/n)$ כאשר $n$ גדול מספיק ($n \ge 30$).
    - שגיאת התקן של הממוצע (SEM) שווה ל-$\frac{\sigma}{\sqrt{n}}$. כדי לצמצם את אי-הוודאות או את מרווח השגיאה לחצי, נדרש להגדיל את גודל המדגם פי 4.
    - 'משמעות הנדסית: ה-CLT מסביר מדוע רעש בחיישנים פיזיקליים, אותות שמע ומדדי ביצועים מצטברים במערכות מחשב מתפלגים באופן טבעי בצורת פעמון גאוסי.'
  - id: hypothesis_testing_pvalues_errors
    title: בדיקת השערות, ערכי p ושגיאות החלטה
    points:
    - 'בדיקת השערות סטטיסטית מציבה את השערת האפס ($H_0$: אין שינוי או השפעה) מול השערת המחקר ($H_1$: קיים הבדל אמיתי בביצועים).'
    - שגיאה מסוג I (רמת מובהקות $\alpha$, חיובי שגוי) מתרחשת כאשר דוחים בטעות את השערת האפס הנכונה. שגיאה מסוג II (שגיאת $\beta$, שלילי שגוי) מתרחשת כאשר נכשלים בדחיית השערת אפס שגויה.
    - עוצמה סטטיסטית ($1 - \beta$) היא ההסתברות לזהות אפקט קיים בפועל; הסטנדרט המקובל בניסויים הוא עוצמה של 80% לפחות ברמת מובהקות $\alpha = 0.05$.
    - ערך ה-p (p-value) הוא ההסתברות לקבל תוצאה קיצונית לפחות כמו זו שנצפתה במדגם, בהנחה שהשערת האפס אכן נכונה. ערך ה-p אינו ההסתברות שהשערת האפס נכונה.
  - id: ab_testing_confidence_intervals_pitfalls
    title: 'ניסויי A/B בפרודקשן: רווחי סמך ומלכודת ההצצה המוקדמת'
    points:
    - רווח סמך של 95% פירושו שבחזרות רבות על הדגימה, 95% מהמרווחים $[\bar{X} - 1.96 \frac{\sigma}{\sqrt{n}}, \bar{X} + 1.96 \frac{\sigma}{\sqrt{n}}]$ יכילו את פרמטר האוכלוסייה האמיתי.
    - 'אפקט מינימלי לזיהוי (MDE) קובע את גודל המדגם הנדרש: זיהוי שיפור זעיר של 0.5% בהמרות דורש מדגם ענק ביחס לזיהוי קפיצה של 10% ($O(1/\text{MDE}^2)$).'
    - 'בעיית ההצצה המוקדמת (Peeking Problem): בדיקה חוזרת ונשנית של ערכי p במהלך ניסוי A/B ועצירתו ברגע שמתקבל $p < 0.05$ מקפיצה את שיעור השגיאה מסוג I מ-5% ליותר מ-30%.'
    - 'בעיית הבדיקות המרובות: הרצת ניסוי על 20 מדדים שונים בו-זמנית ברמת $\alpha = 0.05$ מביאה להסתברות של $1 - (0.95)^{20} \approx 64\%$ לגילוי שווא שגוי אחד לפחות, ומחייבת תיקון בונפרוני (Bonferroni) או בקרת שיעור תגליות השווא (FDR).'
  trivia:
  - type: multiple_choice
    question: מה מבטיח משפט הגבול המרכזי (CLT) לגבי התפלגות הדגימה של ממוצע המדגם עבור דגימות בלתי תלויות ככל שגודל המדגם $n$ גדל?
    options:
    - היא מתכנסת להתפלגות נורמלית (גאוסית) ללא תלות בצורת האוכלוסייה המקורית
    - היא מתכנסת להתפלגות אחידה
    - היא גורמת לשונות האוכלוסייה לקרוס לאפס
    - היא מבטיחה אפס שגיאה בכל דגימה בודדת
    correct: 0
    explanation: משפט הגבול המרכזי מבטיח שהתפלגות הממוצעים מתכנסת לצורת פעמון גאוסי $\mathcal{N}(\mu, \sigma^2/n)$ ככל ש-$n$ גדל.
  - type: multiple_choice
    question: בכדי לצמצם את שגיאת התקן של הממוצע (SEM) פי 2 (חציית מרווח השגיאה), באיזה פקטור יש להגדיל את גודל המדגם $n$?
    options:
    - בפקטור של פי 4 ($4\times$)
    - בפקטור של פי 2 ($2\times$)
    - בפקטור של פי 8 ($8\times$)
    - בפקטור של פי 16 ($16\times$)
    correct: 0
    explanation: מכיוון ששגיאת התקן פרופורציונלית ל-$1/\sqrt{n}$, חצייתה דורשת הגדלת המדגם פי $2^2 = 4$.
  - type: multiple_choice
    question: איזה סוג שגיאה סטטיסטית מבוצע כאשר מבחן דוחה בטעות השערת אפס נכונה (גילוי חיובי שגוי)?
    options:
    - שגיאה מסוג I (רמת מובהקות $\alpha$)
    - שגיאה מסוג II (שגיאת $\beta$)
    - הטיית דגימה
    - שגיאת משתנה מתערב
    correct: 0
    explanation: שגיאה מסוג I מתרחשת כאשר מכריזים על גילוי שינוי או אפקט חיובי בעוד שבפועל השערת האפס נכונה לחלוטין.
  - type: multiple_choice
    question: כיצד מוגדרת עוצמה סטטיסטית (Statistical Power) של ניסוי מדעי?
    options:
    - $1 - \beta$ (ההסתברות לדחות בצדק השערת אפס שגויה)
    - $1 - \alpha$
    - $\alpha / \beta$
    - גודל המדגם $n$
    correct: 0
    explanation: עוצמה סטטיסטית מודדת את ההסתברות שהניסוי יזהה בהצלחה הבדל או אפקט קיים בפועל.
  - type: multiple_choice
    question: מהי ההגדרה המדויקת של ערך ה-p (p-value) בבדיקת השערות סטטיסטית?
    options:
    - ההסתברות לקבל תוצאות מדגם קיצוניות לפחות כמו אלו שנצפו, בהנחה שהשערת האפס אכן נכונה
    - ההסתברות שהשערת האפס נכונה
    - ההסתברות שהשערת המחקר שגויה
    - שיעור הדגימות הפגומות במדגם
    correct: 0
    explanation: ערך ה-p מודד את ההסתברות לצפות בנתונים קיצוניים כאלו תחת ההנחה שהשערת האפס מתקיימת, ולא את ההסתברות של השערת האפס עצמה.
  - type: multiple_choice
    question: איזה כשל מתודולוגי חמור מתרחש כאשר מהנדסים עוקבים ברציפות אחר לוח ניסוי A/B ועוצרים אותו ברגע הראשון שבו מתקבל $p < 0.05$?
    options:
    - בעיית ההצצה המוקדמת (Peeking Problem)
    - פרדוקס סימפסון
    - התאמת יתר (Overfitting)
    - הטיית הישרדות
    correct: 0
    explanation: הצצה מוקדמת ועצירה מותנית מקפיצות את שיעור התוצאות החיוביות השגויות לעיתים מעבר ל-30% עקב תנודתיות אקראית.
  - type: multiple_choice
    question: אם חוקר בודק 20 מדדי מוצר בלתי תלויים בו-זמנית ברמת מובהקות $\alpha = 0.05$ כאשר אין שום אפקט אמיתי, מה הסיכוי לקבלת לפחות תוצאה חיובית שגויה אחת?
    options:
    - כ-64% ($1 - (0.95)^{20}$)
    - בדיוק 5%
    - בדיוק 100%
    - כ-1%
    correct: 0
    explanation: ההסתברות לגילוי שווא אחד לפחות ב-20 בדיקות שונות היא $1 - (0.95)^{20} \approx 0.6415$ (כ-64.15%).
  - type: multiple_choice
    question: איזה תיקון סטטיסטי קלאסי מחלק את רמת המובהקות הרצויה במספר הבדיקות המבוצעות ($\alpha / m$) כדי למנוע גילויי שווא?
    options:
    - תיקון בונפרוני (Bonferroni)
    - החלקת לפלס
    - מבחן טוקי
    - תיקון ייטס
    correct: 0
    explanation: תיקון בונפרוני מציב סף מחמיר של $\alpha / m$ לכל בדיקה בודדת במטרה לשמור על מובהקות כוללת $\alpha$.
  - type: multiple_choice
    question: איזה חוק מתמטי יסודי מבטיח שממוצע הדגימה של משתנים מקריים מתכנס לתוחלת האוכלוסייה ככל שמספר הניסיונות שואף לאינסוף?
    options:
    - חוק המספרים הגדולים
    - חוק ההסתברות השלמה
    - חוק התפוקה השולית הפוחתת
    - חוק מור
    correct: 0
    explanation: חוק המספרים הגדולים (LLN) מוכיח שממוצעי דגימות מתכנסים בהסתברות אל התוחלת האמיתית ככל שהמדגם גדל.
  - type: multiple_choice
    question: ברווח סמך דו-צדדי סטנדרטי של 95% עבור התפלגות נורמלית, באיזה מקדם ציון תקן (z-score) מקובל להשתמש?
    options:
    - $1.96$
    - $2.58$
    - $1.645$
    - $3.00$
    correct: 0
    explanation: בהתפלגות נורמלית סטנדרטית, בדיוק 95% מהשטח נמצא בין $z = -1.96$ ל-$z = +1.96$.
  - type: multiple_choice
    question: מהי השערת האפס ($H_0$) הטיפוסית בניסוי A/B הבודק שינוי בדף תשלום באתר מסחר אלקטרוני?
    options:
    - אין הבדל בשיעור ההמרה בין גרסה A לגרסה B
    - גרסה B עדיפה באופן מובהק על גרסה A
    - בגרסה A יירשמו אפס המרות
    - משתמשים יעדיפו את גרסה B בשיעור של 10% לפחות
    correct: 0
    explanation: השערת האפס מייצגת את נקודת המוצא של סטטוס קוו שבו שתי הגרסאות מציגות ביצועים זהים ללא שינוי.
  - type: multiple_choice
    question: איזה מדד מתאר את השינוי היחסי הקטן ביותר בביצועים שניסוי A/B מסוגל לזהות ברמת ודאות סטטיסטית נתונה?
    options:
    - אפקט מינימלי לזיהוי (MDE)
    - שגיאת תקן של הממוצע (SEM)
    - שיעור תגליות השווא (FDR)
    - גורם בייס
    correct: 0
    explanation: ה-MDE (Minimum Detectable Effect) קובע את סף הרגישות של הניסוי בהתבסס על גודל המדגם והעוצמה הסטטיסטית.
  - type: multiple_choice
    question: אם חוקר מחמיר את סף המובהקות $\alpha$ ומוריד אותו מ-0.05 ל-0.01, מה קורה לסיכון לביצוע שגיאה מסוג I?
    options:
    - הסיכון יורד מ-5% ל-1%
    - הסיכון עולה מ-1% ל-5%
    - הסיכון נותר ללא שינוי
    - הסיכון מוכפל פי 2
    correct: 0
    explanation: רמת המובהקות $\alpha$ היא לפי הגדרתה ההסתברות לביצוע שגיאה מסוג I; הפחתתה מפחיתה ישירות את שיעור תוצאות השווא החיוביות.
  - type: multiple_choice
    question: מהי הנוסחה לחישוב שגיאת התקן של ממוצע המדגם (SEM) מתוך אוכלוסייה בעלת סטיית תקן $\sigma$ וגודל מדגם $n$?
    options:
    - $\sigma / \sqrt{n}$
    - $\sigma \times \sqrt{n}$
    - $\sigma^2 / n$
    - $\sqrt{\sigma / n}$
    correct: 0
    explanation: 'שגיאת התקן של התפלגות הממוצעים מחושבת על ידי חלוקת סטיית התקן בשורש גודל המדגם: $\sigma / \sqrt{n}$.'
  - type: multiple_choice
    question: אם לניסוי A/B נקבעה עוצמה סטטיסטית של 80% ($1 - \beta = 0.80$), מהי ההסתברות לביצוע שגיאה מסוג II (שגיאת $\beta$)?
    options:
    - 20% ($\beta = 0.20$)
    - 80%
    - 5%
    - 10%
    correct: 0
    explanation: 'שגיאה מסוג II משלימה את העוצמה הסטטיסטית ל-100%: $\beta = 1 - 0.80 = 0.20$ (20%).'
- id: markov_chains_stochastic_processes
  title: 5. שרשראות מרקוב ותהליכים סטוכסטיים במחשוב
  description: תכונת מרקוב, מטריצות מעבר הסתברותיות, התפלגות יציבה (סטציונרית), אלגוריתם PageRank, ודגימת מונטה קרלו בשרשראות מרקוב (MCMC).
  cards:
  - id: markov_property_and_transition_matrices
    title: תכונת מרקוב ומטריצות מעבר
    figure:
      title: מכונת מצבים של שרשרת מרקוב בדידה בת 3 מצבים
      svg: "<svg viewBox=\"0 0 500 130\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-height:130px;\">\n  <!-- State A -->\n  <circle cx=\"80\" cy=\"70\" r=\"28\" fill=\"#3b82f6\" fill-opacity=\"0.2\" stroke=\"#3b82f6\" stroke-width=\"2\"/>\n  <text x=\"80\" y=\"74\" font-size=\"12\" font-weight=\"bold\" fill=\"#3b82f6\" text-anchor=\"middle\">S₁</text>\n  <!-- State B -->\n  <circle cx=\"250\" cy=\"70\" r=\"28\" fill=\"#10b981\" fill-opacity=\"0.2\" stroke=\"#10b981\" stroke-width=\"2\"/>\n  <text x=\"250\" y=\"74\" font-size=\"12\" font-weight=\"bold\" fill=\"#10b981\" text-anchor=\"middle\">S₂</text>\n  <!-- State C -->\n  <circle cx=\"420\" cy=\"70\" r=\"28\" fill=\"#8b5cf6\" fill-opacity=\"0.2\" stroke=\"#8b5cf6\" stroke-width=\"2\"/>\n  <text x=\"420\" y=\"74\" font-size=\"12\" font-weight=\"bold\" fill=\"#8b5cf6\" text-anchor=\"middle\">S₃</text>\n  <!-- Transitions -->\n  <path d=\"M 108 60 Q 165 40 222 60\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"\
        />\n  <text x=\"165\" y=\"45\" font-size=\"10\" font-weight=\"bold\" fill=\"currentColor\" text-anchor=\"middle\">0.7</text>\n  <path d=\"M 222 80 Q 165 100 108 80\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"165\" y=\"100\" font-size=\"10\" font-weight=\"bold\" fill=\"currentColor\" text-anchor=\"middle\">0.4</text>\n  <path d=\"M 278 60 Q 335 40 392 60\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"335\" y=\"45\" font-size=\"10\" font-weight=\"bold\" fill=\"currentColor\" text-anchor=\"middle\">0.6</text>\n  <path d=\"M 392 80 Q 335 100 278 80\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"335\" y=\"100\" font-size=\"10\" font-weight=\"bold\" fill=\"currentColor\" text-anchor=\"middle\">0.3</text>\n  <!-- Self loop on S1 -->\n  <path d=\"M 60 50 C 40 20 100 20 90 45\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"70\" y=\"22\" font-size=\"9\" font-weight=\"bold\"\
        \ fill=\"currentColor\">0.3</text>\n</svg>"
      caption: 'שרשרת מרקוב בזמן בדיד: המעבר בין המצבים תלוי אך ורק במצב הנוכחי. סכום כל שורה במטריצת המעבר $P$ שווה בדיוק ל-1.0.'
    points:
    - 'תהליך סטוכסטי מקיים את תכונת מרקוב (חוסר זיכרון) אם העתיד תלוי אך ורק במצב הנוכחי, ללא תלות בהיסטוריית המצבים שקדמו לו: $P(X_{t+1} = s | X_t, \dots, X_0) = P(X_{t+1} = s | X_t)$.'
    - שרשרת מרקוב בזמן בדיד מוגדרת על ידי מרחב מצבים $S$ ומטריצת מעבר $P$, שבה האיבר $P_{ij}$ מייצג את ההסתברות לעבור ממצב $i$ למצב $j$. כל שורה במטריצה מסתכמת בדיוק ל-1.0 (מטריצה סטוכסטית).
    - 'מעברים מרובי-צעדים נשלטים על ידי משוואות צ׳פמן-קולמוגורוב, המתבטאות בכפל מטריצות: ההסתברות לעבור ממצב $i$ למצב $j$ ב-$n$ צעדים נתונה באיבר $(i, j)$ של חזקת המטריצה $P^n$.'
    - 'מידול מערכות מחשב: שרשראות מרקוב מדמות התנהגות מנגנוני זיכרון מטמון (LRU), בקרת עומסים בפרוטוקול TCP (הגדלה חיבורית והקטנה כפלית) ומעגלי התאוששות שרתים מתקלות.'
  - id: stationary_distributions_and_pagerank
    title: התפלגות יציבה, ארגודיות ואלגוריתם PageRank
    points:
    - 'התפלגות יציבה (סטציונרית) $\pi$ היא וקטור הסתברות שאינו משתנה תחת מעברי המטריצה: $\pi P = \pi$, כלומר $\pi$ הוא וקטור עצמי שמאלי של $P$ עם ערך עצמי $\lambda = 1$.'
    - שרשרת מרקוב היא ארגודית (Ergodic) אם היא בלתי פריקה (ניתן להגיע מכל מצב לכל מצב) ולא מחזורית. משפט פרון-פרובניוס מבטיח שלשרשרת כזו קיימת התפלגות יציבה יחידה שאליה המערכת תתכנס מכל מצב התחלתי.
    - 'אלגוריתם PageRank של גוגל ממדל את רשת האינטרנט כגרף מכוון שבו ''גולש אקראי'' מטייל בין קישורים. כדי לפתור מלכודות ללא מוצא (Sinks), מוכנס מקדם ריסון $d \approx 0.85$: הגולש עוקב אחר קישור בהסתברות $d$, או משגר את עצמו לדף אקראי בהסתברות $(1-d)$.'
    - 'חישוב דירוג הדפים PageRank הוא מציאת ההתפלגות היציבה של מטריצת המעבר המותאמת באמצעות שיטת החזקה (Power Iteration: $\pi_{k+1} = \pi_k P$).'
  - id: mcmc_metropolis_hastings_simulated_annealing
    title: דגימת MCMC, מטרופוליס-הייסטינגס ואלגוריתם חישול
    points:
    - במרחבי הסתברות מרובי-ממדים (כמו מודלים בייסיאניים ומערכות פיזיקליות), חישוב אינטגרל הנרמול במכנה בלתי אפשרי מעשית. דגימת מונטה קרלו בשרשראות מרקוב (MCMC) פותרת זאת על ידי בניית שרשרת מרקוב שההתפלגות היציבה שלה שווה בדיוק להתפלגות היעד.
    - אלגוריתם מטרופוליס-הייסטינגס מציע מעבר $x \to x'$ ומקבל אותו בהסתברות $\alpha = \min(1, \frac{P(x')q(x|x')}{P(x)q(x'|x)})$. מהלכים שמפחיתים את ההסתברות מתקבלים לעיתים, מה שמונע הילכדות בנקודות מקסימום מקומיות.
    - 'תנאי האיזון המפורט (Detailed Balance): $P(x) T(x \to x'') = P(x'') T(x'' \to x)$ מבטיח מתמטית שהתפלגות היעד היא אכן ההתפלגות הסטציונרית של שרשרת המרקוב.'
    - חישול מדומה (Simulated Annealing) רותם עקרון זה לאופטימיזציה קומבינטורית (כגון בעיית הסוכן הנוסע ותכנון שבבים) על ידי שימוש בפרמטר 'טמפרטורה' היורד בהדרגה, ועובר מחקירה אקראית רחבה לחיפוש מקומי ממוקד.
  trivia:
  - type: multiple_choice
    question: איזה תנאי יסודי מגדיר את תכונת מרקוב (Markov Property) בתהליך סטוכסטי בדיד?
    options:
    - המצב הבא תלוי אך ורק במצב הנוכחי, ללא תלות בהיסטוריית המצבים שקדמו לו
    - לכל המצבים העתידיים יש הסתברות שווה לחלוטין
    - התהליך אינו מסוגל לעבור למצב בולע (Absorbing State)
    - מטריצת המעברים חייבת להיות סימטרית לחלוטין ($P = P^T$)
    correct: 0
    explanation: 'תכונת מרקוב (חוסר זיכרון) קובעת שההסתברות למצב הבא תלויה אך ורק במצב הנוכחי: $P(X_{t+1}|X_t, \dots) = P(X_{t+1}|X_t)$.'
  - type: multiple_choice
    question: במטריצת מעבר הסתברותית חוקית $P$ של שרשרת מרקוב, למה חייב להיות שווה סכום האיברים בכל שורה בודדת?
    options:
    - בדיוק ל-1.0
    - לאפס
    - למספר המצבים הכולל במערכת
    - לערך העצמי הסטציונרי $\lambda$
    correct: 0
    explanation: מכיוון שכל שורה מייצגת התפלגות הסתברות שלמה של המעבר למצבים הבאים האפשריים, סכומה חייב להיות 1.0 (מטריצה סטוכסטית).
  - type: multiple_choice
    question: כיצד מכונה וקטור הסתברות $\pi$ המקיים את המשוואה המטריציונית $\pi P = \pi$?
    options:
    - התפלגות יציבה (סטציונרית)
    - התפלגות ארעית (Transient)
    - וקטור בסיס אורתוגונלי
    - פולינום אופייני
    correct: 0
    explanation: התפלגות סטציונרית מקיימת $\pi P = \pi$, כלומר התפלגות המצבים במערכת אינה משתנה ככל שהזמן מתקדם.
  - type: multiple_choice
    question: כיצד מחושבת ההסתברות לעבור ממצב $i$ למצב $j$ בתוך $n$ צעדים בדידים מתוך מטריצת המעבר הבסיסית $P$?
    options:
    - על ידי חישוב האיבר במיקום $(i, j)$ של חזקת המטריצה $P^n$
    - על ידי הכפלת האיבר $P_{ij}$ ב-$n$
    - על ידי חלוקת המטריצה $P / n$
    - על ידי מציאת המטריצה ההופכית $P^{-n}$
    correct: 0
    explanation: לפי משוואות צ׳פמן-קולמוגורוב, הסתברויות המעבר ב-$n$ צעדים שוות בדיוק לאיברים של חזקת המטריצה $P^n$.
  - type: multiple_choice
    question: באלגוריתם PageRank של גוגל, איזה מנגנון מונע מהגולש האקראי להילכד בדפים ללא מוצא (Sinks) או במעגלים אינסופיים?
    options:
    - מקדם ריסון ($d \approx 0.85$) המאפשר שיגור אקראי לכל דף ברשת
    - מחיקת כל הדפים המכילים פחות מ-10 קישורים
    - מיון הקישורים לפי סדר האלפבית
    - אילוץ הגרף המכוון להיות סימטרי לחלוטין
    correct: 0
    explanation: מקדם הריסון מעניק הסתברות של כ-15% לשיגור אקראי (Teleportation) לדף שרירותי, ומבטיח שהשרשרת תהיה בלתי פריקה ולא מחזורית.
  - type: multiple_choice
    question: איזו משפחת אלגוריתמים מייצרת דגימות מתוך התפלגויות פוסטריור מורכבות על ידי בניית שרשרת מרקוב שהתפלגותה היציבה שווה להתפלגות היעד?
    options:
    - דגימת מונטה קרלו בשרשראות מרקוב (MCMC)
    - התמרת פורייה מהירה (FFT)
    - עצי החלטה מוגברים (Gradient Boosting)
    - אלגוריתם אשכולות K-Means
    correct: 0
    explanation: שיטות MCMC (כמו מטרופוליס-הייסטינגס ודגימת גיבס) מייצרות דגימות מייצגות מהתפלגויות מורכבות ללא צורך בחישוב אינטגרל הנרמול.
  - type: multiple_choice
    question: בתורת שרשראות מרקוב, איזה תנאי ($P(x) T(x \to x') = P(x') T(x' \to x)$) מבטיח שהתפלגות $P(x)$ היא אכן התפלגות סטציונרית?
    options:
    - תנאי האיזון המפורט (Detailed Balance)
    - גבול ארגודי
    - גבול מרכזי
    - אדיטיביות קולמוגורוב
    correct: 0
    explanation: תנאי האיזון המפורט דורש ששטף ההסתברות בין כל זוג מצבים יהיה שווה בשני הכיוונים, ובכך מבטיח יציבות (Reversibility).
  - type: multiple_choice
    question: איזו תכונה מתקיימת בשרשרת מרקוב אם קיים מסלול בעל הסתברות חיובית המאפשר להגיע מכל מצב לכל מצב אחר במספר סופי של צעדים?
    options:
    - אי-פריקות (Irreducibility)
    - אי-מחזוריות (Aperiodicity)
    - בליעה (Absorbing)
    - אורתוגונליות
    correct: 0
    explanation: שרשרת מרקוב מוגדרת כבלתי פריקה אם כל המצבים בה מתקשרים זה עם זה וניתן להגיע מכל מצב לכל מצב אחר.
  - type: multiple_choice
    question: איזה אלגוריתם אופטימיזציה יוריסטי משתמש במעברי מרקוב אקראיים ובטמפרטורה יורדת כדי להימנע מהילכדות בנקודות מינימום מקומיות?
    options:
    - חישול מדומה (Simulated Annealing)
    - אלגוריתם דייקסטרה
    - מיון מהיר (Quicksort)
    - חיפוש בינארי
    correct: 0
    explanation: חישול מדומה מחקה תהליך פיזיקלי של חימום וקירור מבוקר של מתכות, ומאפשר קבלת מהלכים שמפחיתים את הטיב כדי לצאת מבורות מקומיים.
  - type: multiple_choice
    question: בשרשרת מרקוב בת שני מצבים, אם ההסתברות לעבור ממצב 1 למצב 2 היא 0.2, מהי ההסתברות להישאר במצב 1?
    options:
    - 0.8 ($1 - 0.2$)
    - '0.2'
    - '0.5'
    - '0.04'
    correct: 0
    explanation: 'סכום ההסתברויות בכל שורה במטריצה חייב להיות 1.0: $P_{11} = 1 - 0.2 = 0.8$.'
  - type: multiple_choice
    question: איזה משפט מתמטי יסודי מבטיח שלכל שרשרת מרקוב סופית שהיא בלתי פריקה ולא מחזורית קיימת התפלגות יציבה חיובית ויחידה?
    options:
    - משפט פרון-פרובניוס
    - המשפט היסודי של החדו״א
    - משפט אוילר
    - משפט אי-השלמות של גדל
    correct: 0
    explanation: משפט פרון-פרובניוס קובע כי למטריצה סטוכסטית בלתי פריקה ולא מחזורית יש ערך עצמי מקסימלי יחיד $\lambda = 1$ עם וקטור עצמי חיובי.
  - type: multiple_choice
    question: איזו שיטה נומרית איטרטיבית מכפילה שוב ושוב וקטור הסתברות במטריצת המעבר ($\pi_{k+1} = \pi_k P$) עד להתכנסות לצורך חישוב PageRank?
    options:
    - שיטת החזקה (Power Iteration)
    - שיטת ניוטון-רפסון
    - אלימינציית גאוס
    - שיטת רונגה-קוטה
    correct: 0
    explanation: שיטת החזקה מפעילה כפל מטריצות חוזר ונשנה עד שהווקטור מתכנס לווקטור העצמי הסטציונרי $\pi$.
  - type: multiple_choice
    question: בתורת התורים למידול שרתי ענן, איזו התפלגות מתארת את קצב הגעת המשימות בתור מסוג M/M/1?
    options:
    - תהליך הגעה פואסוני (עם זמני ביניים מעריכיים)
    - תהליך הגעה אחיד
    - תהליך הגעה גאוסי
    - תהליך הגעה בינומי
    correct: 0
    explanation: האות 'M' בסימון קנדל מציינת תהליך מרקובי ללא זיכרון (Memoryless), קרי תהליך הגעות פואסוני עם זמני המתנה מעריכיים.
  - type: multiple_choice
    question: בשרשרת מרקוב ארגודית, מה קורה להתפלגות המצבים במערכת כאשר מספר הצעדים שואף לאינסוף ($t \to \infty$)?
    options:
    - היא מתכנסת להתפלגות היציבה היחידה $\pi$ מכל מצב התחלתי
    - היא מתנדנדת בפראות בין מצבי קיצון
    - היא קורסת כולה למצב 0
    - כל ההסתברויות דועכות בהדרגה לאפס
    correct: 0
    explanation: שרשרת ארגודית מאבדת את זיכרון מצב המוצא שלה ומתכנסת באופן אסימפטוטי להתפלגות הסטציונרית היחידה שלה $\pi$.
  - type: multiple_choice
    question: בארכיטקטורת מחשבים, מדוע משתמשים בשרשראות מרקוב כדי לנתח מנגנוני פינוי בזיכרון מטמון כמו LRU?
    options:
    - הן ממדלות הסתברויות מעבר בין רמות שונות של מקומיות גישה לזיכרון ועומק במחסנית
    - הן דוחסות את שורות המטמון כדי לחסוך שטח סיליקון
    - הן מעלימות לחלוטין את החטאות המטמון
    - הן הופכות גישה ל-DRAM למהירה כמו גישה לאוגרי SRAM
    correct: 0
    explanation: שרשראות מרקוב מאפשרות לנתח מתמטית את דינמיקת מחסנית המטמון ולחזות שיעורי החטאה (Miss Rates) תחת דפוסי גישה שונים.
