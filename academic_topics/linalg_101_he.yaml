        לפי ערכים יחידים ($\Sigma$), וסיבוב סופי ($U$).'
    points:
    - לכסון על פי ערכים עצמיים עובד אך ורק על מטריצות ריבועיות בעלות בסיס עצמי מלא. מה לגבי מטריצות מלבניות
      כלליות ($m \times n$, כגון מערך נתונים של 10,000 משתמשים $\times$ 500 סרטים)?
    - 'פירוק ערכים יחידים (Singular Value Decomposition / SVD) הוא משפט המופת האוניברסלי: כל מטריצה ממשית
      $A$ בגודל $m \times n$ ניתנת לפירוק מדויק: $A = U \Sigma V^T$.'
    - $U$ היא מטריצה אורתוגונלית $m \times m$ (וקטורים יחידים שמאליים). $\Sigma$ היא מטריצה אלכסונית $m
      \times n$ של ערכים יחידים אי-שליליים $\sigma_1 \ge \sigma_2 \ge \dots \ge 0$ בסדר יורד. $V$ היא
      מטריצה אורתוגונלית $n \times n$ (וקטורים יחידים ימניים).
    - גאומטרית, משפט SVD מוכיח שכל טרנספורמציה לינארית מעבירה כדור יחידה ב-$\mathbb{R}^n$ לאליפסואיד ב-$\mathbb{R}^m$,
      כאשר אורכי חצאי הצירים של האליפסואיד הם במדויק הערכים היחידים $\sigma_i$!
  - title: קירוב בעל דרגה נמוכה ומשפט אקהארט-יאנג
    points:
    - 'פירוק SVD מאפשר להציג כל מטריצה כסכום של מכפלות חיצוניות בעלות דרגה 1: $A = \sum_{i=1}^{r} \sigma_i
      \mathbf{u}_i \mathbf{v}_i^T$.'
    - משפט אקהארט-יאנג-מירסקי מוכיח שהקירוב האופטימלי ביותר בעל דרגה $k$ למטריצה $A$ (שממזער את שגיאת
      השחזור) מתקבל פשוט על ידי שמירת $k$ הערכים היחידים הגדולים ביותר ומחיקת השאר ($A_k = \sum_{i=1}^{k}
      \sigma_i \mathbf{u}_i \mathbf{v}_i^T$).
    - 'דחיסת תמונות: תמונה ברזולוציה של $1000 \times 1000$ דורשת 1,000,000 מספרים. שמירת $k=20$ הערכים
      היחידים המובילים בלבד דורשת רק $20 \times (1000 + 1000 + 1) = 40,020$ מספרים - חיסכון של 96% בנפח
      תוך שמירה על איכות תמונה מרהיבה!'
  - title: מערכות המלצה (פרס נטפליקס) וניתוח סמנטי חבוי (LSA)
    points:
    - 'מערכות המלצה וסינון שיתופי: מטריצת דירוגים ענקית $A$ שבה שורות הן משתמשים ועמודות הן סרטים (ברובה
      ריקה).'
    - 'פירוק $A \approx U_k \Sigma_k V_k^T$ מייצר וקטורי שיכון צפופים: שורות $U_k$ מייצגות העדפות משתמש
      לפי $k$ ''מושגים חבויים'' (כגון מידת אקשן, רומנטיקה, מתח); שורות $V_k$ מייצגות את מאפייני הסרטים
      באותם מושגים בדיוק.'
    - ניתוח סמנטי חבוי (LSA) בעיבוד שפה טבעית מפעיל SVD על מטריצות תדירות מילים במסמכים כדי לגלות נושאים
      סמנטיים משותפים ולקבץ מילים נרדפות באופן אוטומטי.
  trivia:
  - type: multiple_choice
    question: מהו הניסוח המתמטי של פירוק ערכים יחידים (SVD) עבור מטריצה מלבנית A בגודל m x n?
    options:
    - A = U Sigma V^T (כאשר U ו-V הן מטריצות אורתוגונליות ו-Sigma היא מטריצה אלכסונית של ערכים יחידים
      אי-שליליים)
    - A = P D P^-1
    - A = L U
    - A = Q R Q^T
    correct: 0
    explanation: פירוק SVD מפרק כל מטריצה ל-$U \Sigma V^T$, כאשר $U$ מכילה וקטורים יחידים שמאליים, $\Sigma$
      מכילה ערכים יחידים ממוינים, ו-$V^T$ מכילה וקטורים יחידים ימניים.
  - type: multiple_choice
    question: מה מוכיח משפט אקהארט-יאנג-מירסקי לגבי קירוב מטריצות בדרגה נמוכה?
    options:
    - שהקירוב האופטימלי בעל דרגה k (הממזער שגיאת שחזור) מתקבל על ידי קטימת פירוק ה-SVD ל-k הערכים היחידים
      הגדולים ביותר
    - שלכל מטריצה ריבועית יש דטרמיננטה השווה לעקבה שלה
    - שמטריצות בעלות דרגה קטנה מ-5 אינן ניתנות להיפוך
    - שערכים יחידים גדלים באופן מעריכי עם ממדי המטריצה
    correct: 0
    explanation: משפט אקהארט-יאנג מוכיח שסכום $k$ האיברים הראשונים בפירוק ה-SVD ($A_k = \sum_{i=1}^k \sigma_i
      \mathbf{u}_i \mathbf{v}_i^T$) הוא הקירוב הטוב ביותר האפשרי בנורמת פרובניוס ובנורמה ספקטרלית.
  - type: multiple_choice
    question: כיצד קשורים הערכים היחידים (sigma_i) של מטריצה A לערכים העצמיים של המטריצה הסימטרית A^T
      A?
    options:
    - הערכים היחידים הם השורשים הריבועיים האי-שליליים של הערכים העצמיים של A^T A (sigma_i = sqrt(lambda_i))
    - הערכים היחידים שווים לערכים העצמיים חלקי 2
    - הערכים היחידים הם ההופכיים של הערכים העצמיים
    - אין שום קשר מתמטי ביניהם
    correct: 0
    explanation: 'הווקטורים היחידים הימניים הם הווקטורים העצמיים של $A^T A$, והערכים היחידים שווים לשורש
      הריבועי של ערכיה העצמיים: $\sigma_i = \sqrt{\lambda_i(A^T A)}$.'
  - type: multiple_choice
    question: במערכות המלצה (כגון בתחרות פרס נטפליקס), מה מייצגות מטריצות הגורמים הצפופות U ו-V המתקבלות
      מפירוק SVD?
    options:
    - וקטורי שיכון (Embeddings) המייצגים העדפות משתמשים ומאפייני סרטים במרחב מושגים חבוי משותף
    - את כתובות ה-IP של שרתי ההזרמה
    - את חותמות הזמן המדויקות של הצפייה
    - את מפתחות ההצפנה של סיסמאות המשתמשים
    correct: 0
    explanation: פירוק מטריצות בלמידת מכונה מייצג העדפות משתמשים ($U$) ומאפייני פריטים ($V$) כווקטורים
      במרחב מושגים חבוי בן $k$ ממדים.
  - type: multiple_choice
    question: מהו 'מספר ההתניה' (Condition Number) של מטריצה (kappa(A) = sigma_max / sigma_min)?
    options:
    - 'מדד לרגישות נומרית: עד כמה שגיאות או רעש קטן בקלט עלולים להיות מוגברים בפתרון הפלט'
    - מגבלת הטמפרטורה של זיכרון ה-DRAM
    - מספר הערכים השליליים במטריצה
    - כמות פעולות הנקודה הצפה בשנייה
    correct: 0
    explanation: מספר ההתניה $\kappa(A) = \frac{\sigma_{\max}}{\sigma_{\min}}$ מודד יציבות נומרית; מטריצה
      בעלת מספר התניה ענק מגבירה שגיאות עיגול בנוסחאות חישוב.
  - type: multiple_choice
    question: כיצד מחושבת המטריצה הפסאודו-הופכית (A+) באמצעות פירוק ה-SVD של המטריצה (A = U Sigma V^T)?
    options:
    - 'A+ = V Sigma^+ U^T (כאשר Sigma^+ הופכת את כל הערכים היחידים שאינם אפס: 1/sigma_i)'
    - A+ = U^T Sigma V
    - A+ = (U Sigma V^T)^-1
    - A+ = Sigma^-1
    correct: 0
    explanation: המטריצה הפסאודו-הופכית מחושבת בקלות באמצעות $A^+ = V \Sigma^+ U^T$, כאשר $\Sigma^+$ משחאלפת
      את $\Sigma$ ומחליפה כל $\sigma_i > 0$ ב-$1/\sigma_i$.
  - type: multiple_choice
    question: כמה ערכים יחידים של מטריצה A הם גדולים ממש מאפס (sigma_i > 0)?
    options:
    - בדיוק כמספר הדרגה המתמטית (Rank) של המטריצה A
    - תמיד כמספר השורות m
    - תמיד כמספר העמודות n
    - אף ערך יחיד אינו גדול מאפס
    correct: 0
    explanation: מספר הערכים היחידים החיוביים $\sigma_i > 0$ שווה במדויק לדרגת המטריצה (ממד מרחב העמודות
      שלה).
  - type: multiple_choice
    question: מהי נורמת פרובניוס (Frobenius Norm) של מטריצה?
    options:
    - השורש של סכום ריבועי כל איברי המטריצה (השווה גם לשורש סכום ריבועי כל הערכים היחידים)
    - המספר הבודד הגדול ביותר במטריצה
    - הערך המוחלט של הדטרמיננטה
    - מספר השורות שאינן אפס בצורה מדורגת
    correct: 0
    explanation: נורמת פרובניוס $\|A\|_F = \sqrt{\sum_{i,j} A_{ij}^2}$ מודדת את הגודל הכולל של המטריצה,
      ושווה לנורמת וקטור הערכים היחידים שלה $\sqrt{\sum_i \sigma_i^2}$.
  - type: multiple_choice
    question: בניתוח סמנטי חבוי (LSA) בעיבוד שפה טבעית, איזו מטריצה מפורקת באמצעות SVD?
    options:
    - מטריצת תדירות מילים במסמכים (Term-Document Matrix)
    - טבלת ניתוב כתובות רשת
    - מטריצת תווי ASCII בינאריים
    - טבלת מסד נתונים של שמות משתמשים
    correct: 0
    explanation: ב-LSA מפרקים מטריצת תדירות של מילים במסמכים (כמו TF-IDF) באמצעות SVD כדי לחשוף נושאים
      סמנטיים חבויים.
  - type: multiple_choice
    question: מדוע פירוק SVD פועל על כל מטריצה מלבנית שהיא, בניגוד ללכסון ערכים עצמיים רגיל?
    options:
    - מכיוון שהמכפלות A A^T ו-A^T A הן תמיד סימטריות וחיוביות למחצה, מה שמבטיח קיום ערכים יחידים ממשיים
      ואי-שליליים תמיד
    - מכיוון שלמטריצות מלבניות יש יותר שורות מעמודות
    - מכיוון שפירוק SVD אינו משתמש במספרי נקודה צפה
    - מכיוון ש-SVD מאפס את כל ערכי המטריצה
    correct: 0
    explanation: לכל מטריצה ממשית $A$, המכפלות $A^T A$ ו-$A A^T$ הן תמיד סימטריות וחיוביות למחצה, מה שמבטיח
      קיום וקטורים עצמיים אורתוגונליים וערכים יחידים ממשיים תמיד.
  - type: multiple_choice
    question: לאיזו צורה גאומטרית הופך כדור יחידה ב-R^n לאחר טרנספורמציה של מטריצה A עם ערכים יחידים sigma_1,
      sigma_2, ...?
    options:
    - לאליפסואיד במרחב R^m שחצאי ציריו הראשיים שווים באורכם לערכים היחידים sigma_i
    - לקובייה מושלמת שאורך צלעה שווה ל-det(A)
    - לקו ישר חד-ממדי
    - למשולש שטוח העובר בראשית
    correct: 0
    explanation: גאומטרית, פירוק SVD מוכיח שכל טרנספורמציה ממפה כדור יחידה לאליפסואיד שציריו הראשיים שווים
      באורכם לערכים היחידים $\sigma_i$.
  - type: multiple_choice
    question: מהו פירוק QR (QR Decomposition) של מטריצה A?
    options:
    - פירוק A למכפלה של מטריצה אורתוגונלית Q (שבה Q^T Q = I) ומטריצה משולשית עליונה R
    - חלוקת מטריצה A לארבעה רבעים שווים
    - חישוב שורש ריבועי של המטריצה A
    - הכפלת מטריצה A במספר קוונטי אקראי
    correct: 0
    explanation: פירוק QR מפרק מטריצה למטריצה אורתוגונלית $Q$ (מגרם-שמידט או שיקופי האוסהולדר) ולמטריצה
      משולשית עליונה $R$, המשמשת לפתרון יציב של ריבועים פחותים.
  - type: multiple_choice
    question: מהו פירוק LU של מטריצה ריבועית A?
    options:
    - פירוק A למכפלה של מטריצה משולשית תחתונה L ומטריצה משולשית עליונה U (A = L U)
    - פירוק A למטריצה שמאלית ומטריצה עליונה
    - פירוק A למנטיסה ומעריך בנקודה צפה
    - תרגום A למשוואה לינארית
    correct: 0
    explanation: 'פירוק LU מייצג את פעולות דירוג גאוס בצורת מטריצות: $L$ שומרת את מכפילי הדירוג ו-$U$
      היא הצורה המדורגת המשולשית העליונה.'
  - type: multiple_choice
    question: מהו פירוק חולסקי (Cholesky Decomposition) למטריצה סימטרית חיובית מוגדרת A?
    options:
    - 'פירוק A למכפלת מטריצה משולשית תחתונה בשחלוף של עצמה: A = L L^T'
    - פירוק A לשלוש מטריצות אלכסוניות
    - קירוב A באמצעות רעש גאוסיאני
    - הפיכת A באמצעות חישוב הדטרמיננטה שלה
    correct: 0
    explanation: למטריצות סימטריות חיוביות מוגדרות, פירוק חולסקי מחשב $A = L L^T$ במחצית מפעולות החישוב
      של פירוק LU, ונפוץ במיוחד בסינון קלמן ותהליכים גאוסיאניים.
  - type: multiple_choice
    question: מהו הטרייד-אוף בעת בחירת דרגת הקטימה k בדחיסת מטריצות באמצעות SVD?
    options:
    - ערך k קטן יותר מספק חיסכון ניכר בזיכרון אך מאבד פרטים דקים ומגדיל את שגיאת השחזור
    - ערך k קטן יותר מאריך את זמן היפוך המטריצה
    - ערך k גדול יותר גורם לערכים היחידים להפוך לשליליים
    - ערך k גדול יותר משנה את גודל הגופן של התמונה
    correct: 0
    explanation: 'בחירת $k$ מאזנת בין דחיסה לדיוק: $k$ קטן דוחס משמעותית את נפח הזיכרון, בעוד ש-$k$ גדול
      משמר נאמנות מקסימלית לפרטים הדקים של הנתונים.'
