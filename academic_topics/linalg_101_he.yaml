        10\" font-weight=\"bold\" fill=\"#3b82f6\" text-anchor=\"middle\">i_hat [1, 0]</text>\n\n    <line\
        \ x1=\"0\" y1=\"100\" x2=\"0\" y2=\"0\" stroke=\"#10b981\" stroke-width=\"3\"/>\n    <polygon\
        \ points=\"-4,6 0,-4 4,6\" fill=\"#10b981\"/>\n    <text x=\"-8\" y=\"50\" font-size=\"10\" font-weight=\"\
        bold\" fill=\"#10b981\" text-anchor=\"end\">j_hat [0, 1]</text>\n    <text x=\"50\" y=\"55\" font-size=\"\
        11\" font-weight=\"bold\" fill=\"currentColor\" text-anchor=\"middle\">שטח = 1.0</text>\n  </g>\n\
        \n  <path d=\"M 180 70 L 250 70\" stroke=\"currentColor\" stroke-width=\"2\" marker-end=\"url(#arr)\"\
        \ opacity=\"0.6\"/>\n  <text x=\"215\" y=\"60\" font-size=\"11\" font-weight=\"bold\" fill=\"\
        #8b5cf6\" text-anchor=\"middle\">מטריצה A</text>\n\n  <g transform=\"translate(290,20)\">\n  \
        \  <polygon points=\"0,100 120,70 160,0 40,30\" fill=\"#8b5cf6\" fill-opacity=\"0.2\" stroke=\"\
        #8b5cf6\" stroke-width=\"2\"/>\n    <line x1=\"0\" y1=\"100\" x2=\"120\" y2=\"70\" stroke=\"#3b82f6\"\
        \ stroke-width=\"3\"/>\n    <polygon points=\"116,66 126,69 120,76\" fill=\"#3b82f6\"/>\n    <text\
        \ x=\"70\" y=\"100\" font-size=\"10\" font-weight=\"bold\" fill=\"#3b82f6\">A * i_hat</text>\n\
        \n    <line x1=\"0\" y1=\"100\" x2=\"40\" y2=\"30\" stroke=\"#10b981\" stroke-width=\"3\"/>\n\
        \    <polygon points=\"36,26 44,24 42,34\" fill=\"#10b981\"/>\n    <text x=\"10\" y=\"45\" font-size=\"\
        10\" font-weight=\"bold\" fill=\"#10b981\">A * j_hat</text>\n    <text x=\"85\" y=\"50\" font-size=\"\
        11\" font-weight=\"bold\" fill=\"#8b5cf6\" text-anchor=\"middle\">שטח = |det(A)|</text>\n  </g>\n\
        </svg>"
      caption: טרנספורמציה של מטריצה מתוארת במלואה על פי המיקום שאליו עוברים וקטורי הבסיס $\hat{i}$ ו-$\hat{j}$.
        הדטרמיננטה מודדת את יחס שינוי השטח.
    points:
    - 'טרנספורמציה לינארית היא פונקציה גאומטרית $T(\mathbf{v})$ המעוותת את המרחב תוך שמירה על שני כללים:
      (1) ראשית הצירים $[0,0]$ נשארת מקובעת במקומה, ו-(2) כל קווי הרשת הישרים נשארים ישרים ומרווחים באופן
      אחיד.'
    - ניתן לדעת מה מטריצה תעשה לכל המרחב האינסופי כולו פשוט על ידי מעקב לאן נוחתים וקטורי הבסיס! לאן עובר
      $\hat{i} = [1,0]$? זהו עמודה מס' 1 במטריצה. לאן עובר $\hat{j} = [0,1]$? זהו עמודה מס' 2.
    - 'כפל מטריצה בווקטור $A\mathbf{x}$ הוא פשוט מתיחה וחיבור של וקטורי הבסיס שהותמרו: $A \begin{bmatrix}
      x \\ y \end{bmatrix} = x (\text{עמודה 1}) + y (\text{עמודה 2})$.'
    - 'כפל מטריצות $(AB)$ מייצג הרכבה של טרנספורמציות מרחביות: החלת $B$ תחילה ואחריה $A$. מכיוון שסדר
      הפעולות במרחב משנה את התוצאה (למשל סיבוב ואז גזירה $\neq$ גזירה ואז סיבוב), כפל מטריצות אינו חילופי:
      $AB \neq BA$!'
  - title: 'הדטרמיננטה: יחס שינוי שטח ונפח'
    points:
    - הדטרמיננטה $\det(A)$ מודדת את הפקטור שבו שטחים (ב-2D) או נפחים (ב-3D ומעלה) משתנים כתוצאה מהטרנספורמציה.
    - אם $\det(A) = 3$, שטח כל צורה במרחב ישלש את עצמו. אם $\det(A) = 1$, הטרנספורמציה משמרת שטח במדויק
      (כמו סיבוב טהור).
    - דטרמיננטה שלילית (למשל $\det(A) = -2$) מעידה על כך שהטרנספורמציה הופכת את האוריינטציה של המרחב (כמו
      השתקפות במראה).
    - אם $\det(A) = 0$, הטרנספורמציה מכווצת את המרחב לממד נמוך יותר (למשל שיטוח מישור דו-ממדי לישר או
      לנקודה). כאשר זה קורה, מידע נמחק לצמיתות ולמטריצה אין מטריצה הופכית ($A^{-1}$ אינה קיימת)!
  - title: מטריצה הופכית ומחלקות מטריצות מיוחדות
    points:
    - 'המטריצה ההופכית $A^{-1}$ ''מבטלת'' את הטרנספורמציה שביצעה $A$, ומחזירה כל וקטור למיקומו המקורי:
      $A^{-1} A = I$ (מטריצת היחידה).'
    - 'מטריצה אורתוגונלית $Q$ משמרת את כל האורכים והזוויות במרחב: $Q^T Q = I$, כלומר עמודותיה הן וקטורי
      יחידה ניצבים, והמטריצה ההופכית שלה שווה פשוט לשחלוף שלה ($Q^{-1} = Q^T$).'
    - מטריצה סימטרית שווה לשחלוף של עצמה ($A = A^T$), וממלאת תפקיד מפתח במטריצות שונות משותפת (Covariance),
      אופטימיזציה, וטנזורי אינרציה בפיזיקה.
  trivia:
  - type: multiple_choice
    question: מהי המשמעות הגאומטרית של הדטרמיננטה של מטריצה 2x2 (det(A))?
    options:
    - הפקטור שבו הטרנספורמציה מגדילה או מקטינה את שטחה של כל צורה גאומטרית במישור
    - שיפוע הישר העובר דרך ראשית הצירים
    - סכום כל המספרים במטריצה
    - זווית התאוצה הסיבובית של וקטורי הבסיס
    correct: 0
    explanation: הדטרמיננטה מודדת את יחס שינוי השטח של הטרנספורמציה; ריבוע יחידה של $1 \times 1$ הופך
      למקבילית ששטחה $|\det(A)|$.
  - type: multiple_choice
    question: מה מעידה דטרמיננטה השווה לאפס (det(A) = 0) על טרנספורמציה לינארית?
    options:
    - הטרנספורמציה מוחצת את המרחב לממד נמוך יותר (למשל מישור דו-ממדי לישר), ולכן המטריצה אינה הפיכה (סינגולרית)
    - הטרנספורמציה היא סיבוב טהור ללא אובדן מידע
    - המטריצה מכילה אפסים בלבד בכל שורותיה
    - המטריצה ההופכית שווה למטריצת היחידה
    correct: 0
    explanation: כאשר $\det(A) = 0$, נפח המרחב מתאפס ונמחק ממד שלם, מה שגורם לאובדן מידע בלתי הפיך ומונע
      קיום מטריצה הופכית $A^{-1}$.
  - type: multiple_choice
    question: מדוע כפל מטריצות אינו חילופי באופן כללי (AB != BA)?
    options:
    - מכיוון שכפל מטריצות מייצג הרכבת טרנספורמציות מרחביות, וסדר הפעולות במרחב משנה את התוצאה הגאומטרית
      הסופית
    - בשל שגיאות עיגול של החומרה בפעולות נקודה צפה
    - מכיוון שחובה להעלות בריבוע את איברי המטריצה תחילה
    - מכיוון שלא ניתן להכפיל מספרים שליליים מימין
    correct: 0
    explanation: כפל מטריצות הוא הרכבת פונקציות; ביצוע סיבוב ואחריו גזירה במרחב מייצר תוצאה שונה לחלוטין
      מביצוע גזירה תחילה וסיבוב לאחריה.
  - type: multiple_choice
    question: מהי התכונה המגדירה מטריצה אורתוגונלית Q?
    options:
    - המטריצה המשוחלפת שלה שווה למטריצה ההופכית שלה (Q^T Q = I), והיא משמרת אורכים וזוויות במרחב
    - כל האיברים שמחוץ לאלכסון הראשי שווים ל-0
    - הדטרמיננטה שלה תמיד שווה ל-0
    - הערכים העצמיים שלה הם כולם מספרים מדומים טהורים
    correct: 0
    explanation: מטריצה אורתוגונלית מורכבת מעמודות אורתונורמליות, משמרת אורכי וקטורים וזוויות (סיבובים/שיקופים),
      ומקיימת $Q^{-1} = Q^T$.
  - type: multiple_choice
    question: מה מייצגות העמודות של מטריצת טרנספורמציה 2x2?
    options:
    - את הקואורדינטות של המיקומים שאליהם מגיעים וקטורי הבסיס הסטנדרטיים i_hat ו-j_hat לאחר הטרנספורמציה
    - את ריבועי הערכים העצמיים של המטריצה
    - את הוקטורים הניצבים לצירים הראשיים
    - את הקואורדינטות של מרחב האפס
    correct: 0
    explanation: עמודה 1 במטריצה היא הווקטור שאליו מגיע $\hat{i} = [1, 0]^T$, ועמודה 2 היא הווקטור שאליו
      מגיע $\hat{j} = [0, 1]^T$.
  - type: multiple_choice
    question: מהי מטריצה סימטרית?
    options:
    - מטריצה ריבועית הזהה למטריצה המשוחלפת של עצמה (A = A^T)
    - מטריצה שהדטרמיננטה שלה שווה ל-1
    - מטריצה בעלת מספר שווה של איברים חיוביים ושליליים
    - מטריצה הפועלת אך ורק על קואורדינטות דו-ממדיות
    correct: 0
    explanation: מטריצה היא סימטרית כאשר $A_{ij} = A_{ji}$ לכל איבר, כלומר החלפת שורות בעמודות ($A^T$)
      מותירה אותה ללא כל שינוי.
  - type: multiple_choice
    question: איזו פעולה גאומטרית מבצעת מטריצת סיבוב 2x2 (R(theta))?
    options:
    - סיבוב של כל המרחב נגד כיוון השעון בזווית theta סביב ראשית הצירים תוך שימור אורכים ושטח
    - מתיחה של ציר ה-X בפקטור theta ללא שינוי ציר Y
    - הטלה של כל הווקטורים על גבי ישר בזווית theta
    - מעיכה של המישור הדו-ממדי לקו ישר
    correct: 0
    explanation: מטריצת סיבוב $R(\theta) = \begin{bmatrix} \cos\theta & -\sin\theta \\ \sin\theta & \cos\theta
      \end{bmatrix}$ מסובבת את כל המישור בזווית $\theta$ ומשמרת אורכים ושטחים (דטרמיננטה = 1).
  - type: multiple_choice
    question: מהי המשמעות הגאומטרית של דטרמיננטה שלילית (det(A) < 0)?
    options:
    - הטרנספורמציה הופכת את האוריינטציה המרחבית (כמו שיקוף במראה)
    - הטרנספורמציה מכווצת את כל הווקטורים לאורך אפס
    - המטריצה אינה ניתנת לכפל באף מטריצה אחרת
    - השטח הופך לשלילי ביחידות סנטימטר פיזיות
    correct: 0
    explanation: דטרמיננטה שלילית מעידה על היפוך אוריינטציה מרחבית (Handedness Inversion), בדומה להשתקפות
      של עצם דרך מראה.
  - type: multiple_choice
    question: מהי מטריצת היחידה I?
    options:
    - מטריצה ריבועית עם 1 באלכסון הראשי ו-0 בשאר האיברים המשמשת כטרנספורמציה שאינה משנה דבר (I v = v)
    - מטריצה שכל איבריה שווים ל-1
    - מטריצה ההופכת את הסימנים של כל הקואורדינטות
    - מטריצה המוחקת את השורה האחרונה בכל וקטור
    correct: 0
    explanation: מטריצת היחידה $I$ היא איבר היחידה הכפלי באלגברה לינארית; כפל של כל וקטור או מטריצה ב-$I$
      מותיר אותם ללא שינוי ($I\mathbf{v} = \mathbf{v}$).
  - type: multiple_choice
    question: מהי פעולת השחלוף (Transpose / A^T) של מטריצה?
    options:
    - פעולה המחליפה שורות ועמודות על גבי האלכסון הראשי
    - היפוך הסימנים החשבוניים של כל איברי המטריצה
    - הכפלת המטריצה בדטרמיננטה שלה
    - גזירת המטריצה לפי הזמן
    correct: 0
    explanation: 'שחלוף מטריצה ($A^T$) מחליף את אינדקסי השורות והעמודות: $(A^T)_{ij} = A_{ji}$.'
  - type: multiple_choice
    question: מהי הדטרמיננטה של מכפלת שתי מטריצות ריבועיות (det(AB))?
    options:
    - det(A) * det(B)
    - det(A) + det(B)
    - det(A) / det(B)
    - max(det(A), det(B))
    correct: 0
    explanation: 'הדטרמיננטה של מכפלת מטריצות שווה למכפלת הדטרמיננטות: $\det(AB) = \det(A) \det(B)$, בהתאם
      להרכבת שינויי השטח.'
  - type: multiple_choice
    question: מהי העקבה (Trace) של מטריצה ריבועית?
    options:
    - סכום כל האיברים לאורך האלכסון הראשי (A_11 + A_22 + ... + A_nn)
    - מכפלת האיברים בפינות המטריצה
    - מספר השורות שאינן אפס בצורה מדורגת
    - האורך האוקלידי של וקטור העמודה הראשון
    correct: 0
    explanation: העקבה $\text{Tr}(A)$ היא סכום איברי האלכסון הראשי, ושווה באופן מופלא גם לסכום כל הערכים
      העצמיים של המטריצה.
  - type: multiple_choice
    question: מהי 'מטריצה אלכסונית' (Diagonal Matrix)?
    options:
    - מטריצה שבה כל האיברים מחוץ לאלכסון הראשי שווים ל-0
    - מטריצה בעלת איברים רק באלכסון המשני
    - מטריצה שסכום כל שורה בה הוא 1.0
    - מטריצה בעלת יותר עמודות משורות
    correct: 0
    explanation: במטריצה אלכסונית כל האיברים שמחוץ לאלכסון ($i \neq j$) הם אפס, וכפל בה מבצע מתיחה ישירה
      של צירי הקואורדינטות בנפרד.
  - type: multiple_choice
    question: אם מטריצה A מקיימת A^2 = A, איזה סוג של טרנספורמציה היא מייצגת?
    options:
    - הטלה (Idempotent Matrix / Projection)
    - סיבוב מתמשך של 360 מעלות
    - טרנספורמציית צמיחה מעריכית
    - שיקוף דרך ראשית הצירים
    correct: 0
    explanation: מטריצה אידמפוטנטית ($A^2 = A$) מייצגת הטלה גאומטרית; ברגע שווקטור הוטל על תת-מרחב, הטלה
      חוזרת משאירה אותו באותו מקום בדיוק.
  - type: multiple_choice
    question: כיצד משפיעה הכפלת מטריצה n x n בסקלר c על הדטרמיננטה שלה (det(c A))?
    options:
    - c^n * det(A)
    - c * det(A)
    - c + det(A)
    - det(A) / c
    correct: 0
    explanation: מכיוון שמתיחת מרחב $n$-ממדי בפקטור $c$ בכל $n$ הצירים מכפילה את הנפח ה-$n$-ממדי ב-$c^n$,
      מתקיים $\det(c A) = c^n \det(A)$.
- id: linear_systems_nullspace_rank
  title: 3. מערכות משוואות, מרחב עמודות ודרגת מטריצה (Rank)
  description: פתרון מערכות משוואות Ax = b כצירוף לינארי של עמודות, תתי-המרחבים היסודיים, מרחב האפס (Nullspace),
    ומשפט הדרגה והאפסיות.
  cards:
  - title: Ax = b כצירוף לינארי של עמודות המטריצה
    figure:
      title: מרחב העמודות (Image) מול מרחב האפס (Kernel)
      svg: "<svg viewBox=\"0 0 520 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-height:150px;\"\
        >\n  <rect x=\"20\" y=\"20\" width=\"200\" height=\"110\" rx=\"10\" fill=\"#3b82f6\" fill-opacity=\"\
        0.1\" stroke=\"#3b82f6\" stroke-width=\"2\"/>\n  <text x=\"120\" y=\"42\" font-size=\"12\" font-weight=\"\
        bold\" fill=\"#3b82f6\" text-anchor=\"middle\">מרחב התחום (R^n)</text>\n  <rect x=\"40\" y=\"\
        55\" width=\"160\" height=\"35\" rx=\"6\" fill=\"#ef4444\" fill-opacity=\"0.2\" stroke=\"#ef4444\"\
        \ stroke-width=\"1.5\"/>\n  <text x=\"120\" y=\"77\" font-size=\"11\" font-weight=\"bold\" fill=\"\
        #ef4444\" text-anchor=\"middle\">מרחב האפס: A x = 0</text>\n  <text x=\"120\" y=\"115\" font-size=\"\
        9\" fill=\"currentColor\" text-anchor=\"middle\">מרחב השורות (ניצב למרחב האפס)</text>\n\n  <path\
        \ d=\"M 225 75 L 290 75\" stroke=\"currentColor\" stroke-width=\"2\" marker-end=\"url(#arr)\"\
        \ opacity=\"0.6\"/>\n  <text x=\"257\" y=\"65\" font-size=\"11\" font-weight=\"bold\" fill=\"\
        #8b5cf6\" text-anchor=\"middle\">מטריצה A</text>\n\n  <rect x=\"295\" y=\"20\" width=\"205\" height=\"\
        110\" rx=\"10\" fill=\"#10b981\" fill-opacity=\"0.1\" stroke=\"#10b981\" stroke-width=\"2\"/>\n\
        \  <text x=\"397\" y=\"42\" font-size=\"12\" font-weight=\"bold\" fill=\"#10b981\" text-anchor=\"\
        middle\">מרחב הטווח (R^m)</text>\n  <rect x=\"315\" y=\"55\" width=\"165\" height=\"35\" rx=\"\
        6\" fill=\"#10b981\" fill-opacity=\"0.25\" stroke=\"#10b981\" stroke-width=\"1.5\"/>\n  <text\
        \ x=\"397\" y=\"77\" font-size=\"11\" font-weight=\"bold\" fill=\"#10b981\" text-anchor=\"middle\"\
        >מרחב העמודות: Col(A)</text>\n  <circle cx=\"397\" cy=\"115\" r=\"4\" fill=\"#ef4444\"/>\n  <text\
        \ x=\"410\" y=\"118\" font-size=\"10\" fill=\"#ef4444\">וקטור האפס 0</text>\n</svg>"
      caption: כל הווקטורים במרחב האפס נמעכים לנקודת האפס $\mathbf{0}$. מרחב העמודות הוא תת-המרחב של כל
        הפלטים האפשריים של $A\mathbf{x}$.
    points:
    - 'במקום לראות מערכת משוואות כהצטלבות ישרים, באלגברה לינארית אנו רואים אותה כמשוואה וקטורית יחידה:
      $x \begin{bmatrix} 2 \\ 4 \end{bmatrix} + y \begin{bmatrix} 3 \\ -1 \end{bmatrix} = \begin{bmatrix}
      8 \\ 2 \end{bmatrix}$ ($A\mathbf{x} = \mathbf{b}$).'
    - מרחב העמודות $\text{Col}(A)$ הוא מרחב הפרישה של כל עמודות המטריצה $A$. למשוואה $A\mathbf{x} = \mathbf{b}$
      קיים פתרון אם ורק אם וקטור המטרה $\mathbf{b}$ שוכן בתוך מרחב העמודות של $A$!
    - 'מרחב האפס (Kernel / Null Space) $\text{Null}(A)$ הוא אוסף כל וקטורי הקלט $\mathbf{x}$ הנמעכים לווקטור
      האפס: $A\mathbf{x} = \mathbf{0}$.'
    - 'דרגת המטריצה (Rank) היא ממד מרחב העמודות שלה (מספר העמודות הבלתי תלויות לינארית). משפט הדרגה והאפסיות
      קובע כי: $\text{Rank}(A) + \text{Nullity}(A) = n$ (סך עמודות הקלט).'
  - title: דירוג גאוס, צורה מדורגת ואיברים מובילים (Pivots)
    points:
    - 'דירוג גאוס פותר את $A\mathbf{x} = \mathbf{b}$ באמצעות 3 פעולות שורה אלמנטריות: (1) החלפת שורות,
      (2) הכפלת שורה בסקלר שאינו אפס, ו-(3) הוספת כפולה של שורה אחת לאחרת.'
    - פעולות אלו ממירות את המטריצה לצורה מדורגת משולשית עליונה (Row Echelon Form) בעלת איברים מובילים
      (Pivots).
    - מספר האיברים המובילים שאינם אפס שווה במדויק לדרגה המתמטית (Rank) של המטריצה.
    - משתנים בעלי איבר מוביל הם משתנים תלויים; משתנים בעמודות ללא איבר מוביל הם משתנים חופשיים (המגדירים
      אינסוף פתרונות).
  - title: מערכות יתר ושיטת הריבועים הפחותים (Least Squares)
    points:
    - 'מערכת בעלת אינסוף פתרונות (יותר נעלמים ממשוואות, $m < n$): פתרון בעל נורמה מינימלית נמצא באמצעות
      המטריצה הפסאודו-הופכית.'
    - 'מערכת יתר (יותר משוואות מנעלמים, $m > n$, כמו התאמת 100 נקודות מדידה רועשות לישר): לרוב אין פתרון
      מדויק כי $\mathbf{b}$ אינו בתוך $\text{Col}(A)$.'
    - 'שיטת הריבועים הפחותים (Least Squares) מוצאת את הפתרון המקורב הטוב ביותר שממזער את שגיאת המרחק $\|A\mathbf{x}
      - \mathbf{b}\|^2$. היא מטילה את $\mathbf{b}$ בהטלה אורתוגונלית על מרחב העמודות באמצעות המשוואות
      הנורמליות: $A^T A \mathbf{\hat{x}} = A^T \mathbf{b} \implies \mathbf{\hat{x}} = (A^T A)^{-1} A^T
      \mathbf{b}$.'
  trivia:
  - type: multiple_choice
    question: מהו 'מרחב העמודות' (Column Space / Image) של מטריצה A?
    options:
    - אוסף כל וקטורי הפלט שניתן להגיע אליהם על ידי צירופים לינאריים של עמודות המטריצה A (מרחב הפרישה של
      עמודותיה)
    - אוסף כל הווקטורים המתאפסים בעת כפל ב-A
    - סכום המספרים בעמודה הראשונה של A
    - איברי האלכסון של המטריצה ההופכית
    correct: 0
    explanation: מרחב העמודות $\text{Col}(A)$ הוא תת-המרחב הנוצר מכל הצירופים הלינאריים של עמודות $A$,
      ומייצג את כל הפלטים האפשריים $A\mathbf{x}$.
  - type: multiple_choice
    question: מהו 'מרחב האפס' (Null Space / Kernel) של מטריצה A?
    options:
    - אוסף כל וקטורי הקלט x המקיימים את המשוואה ההומוגנית A x = 0
    - אוסף כל הווקטורים שאורכם שווה ל-0
    - שטח הזיכרון ב-RAM שאינו מוקצה
    - אוסף הערכים העצמיים השווים ל-1
    correct: 0
    explanation: מרחב האפס $\text{Null}(A)$ מכיל את כל וקטורי הקלט $\mathbf{x}$ שנמעכים לווקטור האפס בעת
      הכפלה במטריצה $A$ ($A\mathbf{x} = \mathbf{0}$).
  - type: multiple_choice
    question: איזה קשר יסודי קובע משפט הדרגה והאפסיות (Rank-Nullity Theorem) עבור מטריצה m x n?
    options:
    - Rank(A) + Nullity(A) = n (סך עמודות הקלט / ממד התחום)
    - Rank(A) * Nullity(A) = m * n
    - Rank(A) = Nullity(A) - 1
    - Rank(A) + Nullity(A) = det(A)
    correct: 0
    explanation: משפט הדרגה והאפסיות קובע שממד מרחב העמודות ועוד ממד מרחב האפס שווה תמיד למספר עמודות
      הקלט הכולל $n$.
  - type: multiple_choice
    question: מתי למערכת משוואות לינאריות A x = b קיים בוודאות פתרון אחד לפחות?
    options:
    - כאשר וקטור המטרה b מוכל בתוך מרחב העמודות של המטריצה A
    - כאשר הדטרמיננטה של A שווה ל-0
    - כאשר המטריצה A היא סימטרית וחיובית מוגדרת
    - כאשר הווקטור b ניצב לכל שורות A
    correct: 0
    explanation: מכיוון ש-$A\mathbf{x}$ הוא צירוף לינארי של עמודות $A$, פתרון $\mathbf{x}$ קיים אם ורק
      אם וקטור המטרה $\mathbf{b}$ שייך למרחב העמודות $\text{Col}(A)$.
  - type: multiple_choice
    question: מהן 'המשוואות הנורמליות' המשמשות למציאת פתרון הריבועים הפחותים במערכות יתר (A x ~= b)?
    options:
    - A^T A x = A^T b
    - A x = b
    - A A^T x = b
    - det(A) x = b
    correct: 0
    explanation: המשוואות הנורמליות $A^T A \mathbf{\hat{x}} = A^T \mathbf{b}$ מטילות את וקטור המטרה $\mathbf{b}$
      בהטלה אורתוגונלית על מרחב העמודות וממזערות את שגיאת המרחק $\|A\mathbf{x} - \mathbf{b}\|^2$.
  - type: multiple_choice
    question: מהי 'דרגה' (Rank) של מטריצה?
    options:
    - המספר המרבי של וקטורי עמודה (או שורה) בלתי תלויים לינארית במטריצה
    - המספר הכולל של איברים שאינם אפס במטריצה
    - מספר השורות כפול מספר העמודות
    - הערך המספרי הגדול ביותר במטריצה
    correct: 0
    explanation: דרגת המטריצה היא ממד תת-המרחב הנפרש על ידי עמודותיה, ושווה תמיד לממד תת-המרחב הנפרש על
      ידי שורותיה.
  - type: multiple_choice
    question: מה מאפיין מטריצה ריבועית n x n בעלת 'דרגה מלאה' (Full Rank)?
    options:
    - דרגתה שווה ל-n, כל עמודותיה בלתי תלויות לינארית, והמטריצה הפיכה לחלוטין
    - המטריצה מכילה אך ורק מספרים הגדולים מאפס
    - דרגתה שווה ל-0
    - הדטרמיננטה שלה שווה לאפס
    correct: 0
    explanation: מטריצה ריבועית בעלת דרגה מלאה $n$ היא בעלת דטרמיננטה שאינה אפס, מרחב אפס המכיל את $\{\mathbf{0}\}$
      בלבד, והיא הפיכה לחלוטין.
  - type: multiple_choice
    question: בדירוג גאוס, מהו 'איבר מוביל' (Pivot)?
    options:
    - האיבר הראשון שאינו אפס בשורה המשמש לאיפוס הערכים שמתחתיו
    - נקודת המרכז של סיבוב תמונה
    - העמודה האחרונה במטריצה המורחבת
    - הדטרמיננטה חלקי העקבה
    correct: 0
    explanation: איבר מוביל (Pivot) הוא המקדם הראשון שאינו אפס בשורה במהלך דירוג גאוס, המשמש לאיפוס הערכים
      בעמודה שמתחתיו.
  - type: multiple_choice
    question: מה מאפיין 'מערכת יתר' (Overdetermined System) של משוואות לינאריות?
    options:
    - יש יותר משוואות (אילוצים) מנעלמים (משתנים), m > n
    - יש יותר נעלמים ממשוואות, n > m
    - הדטרמיננטה של מטריצת המקדמים היא שלילית
    - כל המשתנים מוגבלים לערכים שלמים בלבד
    correct: 0
    explanation: מערכת יתר כוללת יותר משוואות מנעלמים ($m > n$); במערכות נתונים מציאותיות עם רעש, לרוב
      אין פתרון מדויק ויש להשתמש בריבועים פחותים.
  - type: multiple_choice
    question: מה מאפיין מערכת משוואות בעלת אינסוף פתרונות (Underdetermined System, m < n)?
    options:
    - יש פחות משוואות מנעלמים, מה שיוצר משתנים חופשיים ואינסוף פתרונות אפשריים
    - אין למערכת שום פתרון מתמטי
    - יש למערכת פתרון יחיד ומדויק
    - דטרמיננטת המטריצה תמיד שווה ל-1.0
    correct: 0
    explanation: כאשר יש פחות משוואות מנעלמים ($m < n$), קיימים משתנים חופשיים המאפשרים אינסוף צירופי
      פתרונות במרחב אפיני.
  - type: multiple_choice
    question: מהו הקשר הגאומטרי בין מרחב השורות למרחב האפס של מטריצה A?
    options:
    - הם מרחבים משלימים אורתוגונליים ב-R^n (כל וקטור במרחב האפס ניצב לכל וקטור במרחב השורות)
    - הם מרחבים זהים לחלוטין
    - הם פורשים רבעים מנוגדים במערכת הצירים
    - החיתוך ביניהם הוא המרחב R^n כולו
    correct: 0
    explanation: מכיוון ש-$A\mathbf{x} = \mathbf{0}$ פירושו שכל שורה במטריצה במכפלה סקלרית עם $\mathbf{x}$
      שווה לאפס, מרחב האפס הוא המשלים האורתוגונלי המדויק של מרחב השורות.
  - type: multiple_choice
    question: מה מאפיין צורה מדורגת קנונית (Reduced Row Echelon Form - RREF)?
    options:
    - כל איבר מוביל הוא 1.0 והוא האיבר היחיד שאינו אפס בעמודה שלו
    - מטריצה אלכסונית בעלת ערכים שליליים בלבד
    - מטריצה שהומרה למספרים מרוכבים
    - מטריצה שסכום כל שורותיה הוא אפס
    correct: 0
    explanation: בצורה מדורגת קנונית (RREF), כל איבר מוביל הוא 1, והוא האיבר היחיד שאינו אפס בעמודה שלו,
      מה שמאפשר קריאה ישירה של פתרון המערכת.
  - type: multiple_choice
    question: לשם מה משמשת המטריצה הפסאודו-הופכית של מור-פנרוז (Moore-Penrose Pseudoinverse / A+)?
    options:
    - להכללת מושג המטריצה ההופכית למטריצות מלבניות או סינגולריות ולמציאת פתרון ריבועים פחותים
    - להפיכת מספרים סקלריים של 1x1
    - לסיבוב וקטורים תלת-ממדיים סביב ציר ה-Z
    - להצפנת קודי גיבוב קריפטוגרפיים
    correct: 0
    explanation: המטריצה הפסאודו-הופכית $A^+$ מספקת הופכי מוכלל לכל מטריצה מלבנית, ומחשבת את פתרון הריבועים
      הפחותים בעל הנורמה המינימלית $\mathbf{\hat{x}} = A^+ \mathbf{b}$.
  - type: multiple_choice
    question: אם למטריצה 3x3 יש דרגה Rank = 2, איזו צורה גאומטרית מהווה מרחב העמודות שלה במרחב התלת-ממדי?
    options:
    - מישור דו-ממדי שטוח העובר דרך ראשית הצירים
    - קו ישר חד-ממדי
    - המרחב התלת-ממדי המלא
    - נקודה בודדת בראשית הצירים [0, 0, 0]
    correct: 0
    explanation: דרגה מייצגת את ממד מרחב העמודות; דרגה 2 במרחב תלת-ממדי פורשת מישור דו-ממדי שטוח העובר
      דרך הראשית.
  - type: multiple_choice
    question: מהם 'משתנים חופשיים' (Free Variables) במערכת משוואות לינאריות?
    options:
    - משתנים בעמודות ללא איבר מוביל שניתן להציב בהם כל ערך סקלרי שרירותי כדי לייצר פתרונות
    - משתנים שאינם מוגדרים בקוד המקור
    - משתנים שאין להם כתובת זיכרון ב-RAM
    - קבועים שאינם ניתנים להכפלה במספרים
    correct: 0
    explanation: משתנים חופשיים מייצגים דרגות חופש במערכת ללא איברים מובילים, ופרמטריזציה שלהם מייצרת
      את כל אינסוף הפתרונות של המערכת.
- id: eigenvalues_eigenvectors_pca
  title: 4. ערכים עצמיים, וקטורים עצמיים וניתוח רכיבים ראשיים (PCA)
  description: הבנת כיוונים במרחב שאינם מסתובבים בעת טרנספורמציה, המשוואה האופיינית, לכסון מטריצות, והפחתת
    ממדים בבינה מלאכותית באמצעות PCA.
  cards:
  - title: מהם וקטורים עצמיים? כיוונים בלתי משתנים במרחב
    figure:
      title: 'שימור כיוון של וקטור עצמי: A v = λ v'
