id: linalg_101_he
type: academic
icon: 📐
title: אלגברה לינארית וגאומטריה לבינה מלאכותית והנדסה (LinAlg 101)
description: 'מדריך ויזואלי ומעמיק מעקרונות ראשונים: כיצד וקטורים פורשים ממדים, כיצד מטריצות מעוותות את
  המרחב, וכיצד ערכים עצמיים ופירוק SVD מניעים בינה מלאכותית, למידת מכונה וגרפיקה ממוחשבת.'
lang: he
audience: family
categories:
- id: vectors_spaces_projections
  title: 1. וקטורים, מכפלה סקלרית והטלות מרחביות
  description: הבנת וקטורים כחצי העתקה גאומטריים במרחב, מכפלה סקלרית כהטלת צל ומדד זוויתי, תלות לינארית,
    ומרחב פרישה אורתוגונלי.
  cards:
  - title: מהו וקטור? חצים במרחב לעומת רשימות מספרים
    figure:
      title: חיבור וקטורים והטלת מכפלה סקלרית
      svg: "<svg viewBox=\"0 0 520 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-height:150px;\"\
        >\n  <line x1=\"30\" y1=\"120\" x2=\"480\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"\
        1.5\" opacity=\"0.3\"/>\n  <line x1=\"60\" y1=\"10\" x2=\"60\" y2=\"140\" stroke=\"currentColor\"\
        \ stroke-width=\"1.5\" opacity=\"0.3\"/>\n\n  <line x1=\"60\" y1=\"120\" x2=\"260\" y2=\"120\"\
        \ stroke=\"#3b82f6\" stroke-width=\"3\"/>\n  <polygon points=\"260,116 270,120 260,124\" fill=\"\
        #3b82f6\"/>\n  <text x=\"160\" y=\"140\" font-size=\"12\" font-weight=\"bold\" fill=\"#3b82f6\"\
        \ text-anchor=\"middle\">וקטור v</text>\n\n  <line x1=\"60\" y1=\"120\" x2=\"200\" y2=\"30\" stroke=\"\
        #8b5cf6\" stroke-width=\"3\"/>\n  <polygon points=\"196,26 206,30 202,38\" fill=\"#8b5cf6\"/>\n\
        \  <text x=\"120\" y=\"65\" font-size=\"12\" font-weight=\"bold\" fill=\"#8b5cf6\">וקטור u</text>\n\
        \n  <line x1=\"200\" y1=\"30\" x2=\"200\" y2=\"120\" stroke=\"#ec4899\" stroke-width=\"2\" stroke-dasharray=\"\
        4,4\"/>\n\n  <rect x=\"60\" y=\"116\" width=\"140\" height=\"8\" fill=\"#10b981\" fill-opacity=\"\
        0.5\"/>\n  <text x=\"130\" y=\"110\" font-size=\"10\" font-weight=\"bold\" fill=\"#10b981\" text-anchor=\"\
        middle\">הטלה: ||u|| cos(θ)</text>\n  <text x=\"360\" y=\"75\" font-size=\"12\" font-weight=\"\
        bold\" fill=\"currentColor\">u · v = ||u|| ||v|| cos(θ)</text>\n</svg>"
      caption: 'מכפלה סקלרית מודדת התאמה כיוונית: היא מטילה את וקטור $\mathbf{u}$ על גבי וקטור $\mathbf{v}$
        ומכפילה את אורכיהם.'
    points:
    - עבור מפתח תוכנה, וקטור הוא מערך סדור של מספרים (למשל $[3.2, -1.5, 4.0]$). עבור פיזיקאי או מהנדס
      גרפיקה, וקטור הוא חץ גאומטרי בעל גודל (אורך) וכיוון במרחב.
    - חיבור וקטורים $(\mathbf{u} + \mathbf{v})$ מתבטא בחיבור חצים קצה-אל-זנב. כפל בסקלר $(c \mathbf{v})$
      מותח, מכווץ או הופך את אורך החץ מבלי לשנות את קו הפעולה שלו במרחב.
    - 'מכפלה סקלרית (Dot Product) משלבת שני וקטורים למספר סקלרי בודד: $\mathbf{u} \cdot \mathbf{v} = u_1
      v_1 + u_2 v_2 + \dots + u_n v_n = \|\mathbf{u}\| \|\mathbf{v}\| \cos(\theta)$.'
    - 'גאומטרית, מכפלה סקלרית מודדת תיאום כיווני: אם $\mathbf{u} \cdot \mathbf{v} > 0$, הווקטורים מצביעים
      בכיוון דומה; אם $\mathbf{u} \cdot \mathbf{v} = 0$, הם ניצבים (אורתוגונליים) לחלוטין; ואם $\mathbf{u}
      \cdot \mathbf{v} < 0$, הם פונים בכיוונים מנוגדים.'
  - title: צירופים לינאריים, פרישה (Span) ותלות לינארית
    points:
    - 'צירוף לינארי (Linear Combination) של וקטורים $\mathbf{v}_1, \dots, \mathbf{v}_k$ הוא כל וקטור הנוצר
      על ידי הכפלתם בסקלרים וחיבורם: $c_1 \mathbf{v}_1 + \dots + c_k \mathbf{v}_k$.'
    - מרחב הפרישה (Span) של קבוצת וקטורים הוא תת-המרחב הגאומטרי של כל הווקטורים שניתן להגיע אליהם באמצעות
      צירופים לינאריים. שני וקטורים שאינם מקבילים פורשים את כל המישור הדו-ממדי $\mathbb{R}^2$.
    - 'תלות לינארית: קבוצת וקטורים תלויה לינארית אם ניתן לבנות לפחות וקטור אחד מתוכה כצירוף לינארי של
      שאר הווקטורים (הוא אינו מוסיף ממד חדש).'
    - בסיס (Basis) למרחב וקטורי הוא קבוצה מינימלית של וקטורים בלתי תלויים לינארית הפורשת את המרחב כולו
      (למשל וקטורי היחידה הסטנדרטיים $\hat{i} = [1, 0]$ ו-$\hat{j} = [0, 1]$).
  - title: הטלות אורתוגונליות ותהליך גרם-שמידט
    points:
    - 'הטלה אורתוגונלית של וקטור $\mathbf{b}$ על גבי וקטור $\mathbf{a}$ מוצאת את הנקודה על $\mathbf{a}$
      הקרובה ביותר ל-$\mathbf{b}$, ומפרקת את $\mathbf{b}$ לרכיב מקביל ולרכיב ניצב: $\text{proj}_{\mathbf{a}}(\mathbf{b})
      = \frac{\mathbf{a} \cdot \mathbf{b}}{\|\mathbf{a}\|^2} \mathbf{a}$.'
    - הטלה גאומטרית זו היא המנוע המתמטי שמאחורי רגרסיה לינארית, פירוק טורי פורייה, ומנגנוני תשומת לב (Attention)
      ברשתות נוירונים עמוקות.
    - תהליך גרם-שמידט (Gram-Schmidt) לוקח קבוצה של וקטורים בלתי תלויים וממיר אותם באופן שיטתי לבסיס אורתונורמלי
      (וקטורים שכולם באורך 1.0 וכולם ניצבים הדדית זה לזה).
  trivia:
  - type: multiple_choice
    question: איזה מצב גאומטרי מתקיים כאשר המכפלה הסקלרית של שני וקטורים שאינם אפס שווה בדיוק לאפס (u
      · v = 0)?
    options:
    - הווקטורים ניצבים (אורתוגונליים) זה לזה בזווית של 90 מעלות
    - הווקטורים מצביעים בדיוק לאותו כיוון
    - הווקטורים שווים לחלוטין באורכם המתמטי
    - הווקטורים נמצאים מחוץ למערכת הצירים הקרטזית
    correct: 0
    explanation: מכיוון ש-$\mathbf{u} \cdot \mathbf{v} = \|\mathbf{u}\| \|\mathbf{v}\| \cos(\theta)$,
      מכפלה סקלרית ששווה ל-0 מחייבת $\cos(\theta) = 0$, כלומר הזווית ביניהם היא בדיוק $90^\circ$ (ניצבים).
  - type: multiple_choice
    question: מהו 'מרחב הפרישה' (Span) של קבוצת וקטורים?
    options:
    - אוסף כל הווקטורים שניתן לייצר באמצעות צירופים לינאריים (מתיחה וחיבור) של אותם וקטורים
    - המרחק הפיזי בין ראשית הצירים לווקטור הארוך ביותר
    - מספר הערכים שאינם אפס במערך הנתונים
    - הדטרמיננטה של המכפלה הווקטורית
    correct: 0
    explanation: ה-Span של קבוצת וקטורים הוא תת-המרחב הנוצר מכל הצירופים הלינאריים האפשריים $c_1 \mathbf{v}_1
      + \dots + c_k \mathbf{v}_k$.
  - type: multiple_choice
    question: מתי קבוצת וקטורים נחשבת ל'תלויה לינארית' (Linearly Dependent)?
    options:
    - כאשר לפחות וקטור אחד בקבוצה ניתן לביטוי כצירוף לינארי של שאר הווקטורים (ממד מיותר)
    - כאשר כל הווקטורים שווים באורכם הפיזי
    - כאשר הווקטורים כולם ניצבים זה לזה
    - כאשר המכפלה הסקלרית של כל זוג היא חיובית
    correct: 0
    explanation: תלות לינארית מעידה על יתירות בקבוצה; לפחות וקטור אחד מוכל כבר בתוך מרחב הפרישה של הווקטורים
      האחרים ואינו מוסיף ממד חדש.
  - type: multiple_choice
    question: מה מייצר תהליך גרם-שמידט (Gram-Schmidt) באלגברה לינארית?
    options:
    - הוא ממיר בסיס של וקטורים בלתי תלויים לבסיס אורתונורמלי של וקטורי יחידה הניצבים כולם זה לזה
    - הוא הופך מטריצה מלבנית באמצעות דירוג גאוס
    - הוא מוצא את השורשים של פולינומים ממעלה גבוהה
    - הוא דוחס קבצי תמונה בפורמט JPEG
    correct: 0
    explanation: אלגוריתם גרם-שמידט לוקח וקטורים בלתי תלויים ומחסר מהם הטלות מקביליות כדי לבנות בסיס שבו
      כל הווקטורים ניצבים ובאורך יחידה 1.0.
  - type: multiple_choice
    question: מהי הנוסחה לחישוב האורך האוקלידי (נורמת L2) של וקטור תלת-ממדי v = [x, y, z]?
    options:
    - sqrt(x^2 + y^2 + z^2)
    - x + y + z
    - x * y * z
    - max(|x|, |y|, |z|)
    correct: 0
    explanation: 'על פי משפט פיתגורס המורחב ל-$n$ ממדים, הנורמה האוקלידית שווה לשורש סכום ריבועי האיברים:
      $\sqrt{x^2 + y^2 + z^2} = \sqrt{\mathbf{v} \cdot \mathbf{v}}$.'
  - type: multiple_choice
    question: מהו 'וקטור יחידה' (Unit Vector)?
    options:
    - וקטור שאורכו (הגודל הגאומטרי שלו) שווה בדיוק ל-1.0
    - וקטור המכיל מספרים שלמים בלבד
    - מטריצה בעלת אחדות באלכסון הראשי
    - וקטור המצביע אך ורק לאורך ציר ה-X החיובי
    correct: 0
    explanation: וקטור יחידה הוא וקטור שעבר נרמול כך שאורכו $\|\mathbf{v}\| = 1$, ומייצג כיוון טהור במרחב
      ללא תלות בסקאלה.
  - type: multiple_choice
    question: מה קובע אי-שוויון קושי-שוורץ עבור שני וקטורים ממשיים u ו-v?
    options:
    - '|u · v| <= ||u|| ||v||'
    - '||u + v|| = ||u|| + ||v||'
    - u · v >= ||u|| ||v||
    - u · v = 0
    correct: 0
    explanation: אי-שוויון קושי-שוורץ $|\mathbf{u} \cdot \mathbf{v}| \leq \|\mathbf{u}\| \|\mathbf{v}\|$
      נובע מכך ש-$|\cos(\theta)| \leq 1$, כאשר שוויון מתקבל רק כאשר הווקטורים מקבילים.
  - type: multiple_choice
    question: מהי התוצאה של מכפלה וקטורית (Cross Product) בין שני וקטורים תלת-ממדיים (u x v)?
    options:
    - וקטור תלת-ממדי חדש הניצב בו-זמנית הן ל-u והן ל-v
    - מספר סקלרי יחיד המייצג את המכפלה הסקלרית
    - מטריצת יחידה אלכסונית בגודל 3x3
    - סכום האיברים של שני הווקטורים
    correct: 0
    explanation: המכפלה הווקטורית $\mathbf{u} \times \mathbf{v}$ מפיקה וקטור הניצב למישור שבו שוכנים $\mathbf{u}$
      ו-$\mathbf{v}$, שאורכו שווה לשטח המקבילית שהם פורשים.
  - type: multiple_choice
    question: מה מגדיר 'בסיס' (Basis) למרחב וקטורי V?
    options:
    - קבוצת וקטורים בלתי תלויים לינארית הפורשת את המרחב V כולו
    - כל קבוצת וקטורים בעלי ערכים שלמים
    - קבוצת וקטורים שהמכפלות הסקלריות ביניהם כולן שליליות
    - נקודת ראשית הצירים [0, 0, 0]
    correct: 0
    explanation: 'בסיס הוא קבוצת פרישה מינימלית: הווקטורים חייבים להיות בלתי תלויים לינארית ולפרוש את
      המרחב כולו, מה שמאפשר להציג כל וקטור במרחב כצירוף לינארי יחיד.'
  - type: multiple_choice
    question: כיצד מטילים וקטור b בצורה אורתוגונלית על גבי ישר המוגדר על ידי וקטור יחידה u (שבו ||u||
      = 1)?
    options:
    - (b · u) u
    - b + u
    - b / u
    - sqrt(b · u)
    correct: 0
    explanation: כאשר $\mathbf{u}$ הוא וקטור יחידה, גודל ההטלה הסקלרית הוא $(\mathbf{b} \cdot \mathbf{u})$,
      והכפלה בכיוון $\mathbf{u}$ נותנת את וקטור ההטלה $(\mathbf{b} \cdot \mathbf{u}) \mathbf{u}$.
  - type: multiple_choice
    question: מהו הממד (Dimension) של מרחב וקטורי?
    options:
    - מספר הווקטורים המדויק בכל בסיס של אותו מרחב וקטורי
    - גודל הזיכרון בבייטים של מערך המספרים
    - הדטרמיננטה של מטריצת השונות המשותפת
    - הערך המקסימלי של רכיבי הווקטורים
    correct: 0
    explanation: ממד המרחב הווקטורי מוגדר כמספר הווקטורים המרכיבים כל בסיס של אותו מרחב.
  - type: multiple_choice
    question: מהי קבוצת וקטורים 'אורתונורמלית' (Orthonormal)?
    options:
    - קבוצה שבה כל וקטור הוא באורך 1.0 וכל זוג וקטורים שונים ניצבים זה לזה (מכפלה סקלרית = 0)
    - קבוצת וקטורים בעלי ערכים חיוביים בלבד
    - קבוצת וקטורים היוצרת מצולע סגור במרחב
    - קבוצת וקטורים שאינה ניתנת להכפלה בסקלרים
    correct: 0
    explanation: 'קבוצה אורתונורמלית מקיימת שני תנאים: אורתוגונליות (ניצבות הדדית $\mathbf{u}_i \cdot
      \mathbf{u}_j = 0$ עבור $i \neq j$) ונורמליות (אורך יחידה $\|\mathbf{u}_i\| = 1$ לכולם).'
  - type: multiple_choice
    question: במדד דמיון קוסינוס (Cosine Similarity) המשמש במנועי חיפוש ו-NLP, מה מעיד ערך קוסינוס של
      1.0 בין שני וקטורים?
    options:
    - הווקטורים מצביעים בדיוק לאותו כיוון במרחב (דמיון סמנטי מקסימלי)
    - הווקטורים ניצבים לחלוטין וללא קשר סמנטי
    - הווקטורים מייצגים משמעויות מנוגדות לחלוטין
    - הווקטורים מכילים שגיאות מספריות
    correct: 0
    explanation: דמיון קוסינוס מגיע ל-1.0 כאשר הזווית ביניהם $\theta = 0^\circ$, מה שמעיד על כיוון ומשמעות
      סמנטית זהה במרחב השיכון.
  - type: multiple_choice
    question: מה יקרה אם תנסה לפרוש את המרחב התלת-ממדי (R^3) באמצעות 2 וקטורים בלתי תלויים בלבד?
    options:
    - 2 הווקטורים יפרשו מישור דו-ממדי שטוח בלבד, ויותירו את יתר המרחב התלת-ממדי בלתי נגיש
    - 2 הווקטורים ייצרו מעצמם וקטור שלישי במרחב
    - הדטרמיננטה של הווקטורים תהפוך לאינסופית
    - הווקטורים יתעקמו במרחב לא-אוקלידי
    correct: 0
    explanation: ב-$\mathbb{R}^3$, בסיס דורש בדיוק 3 וקטורים בלתי תלויים; שני וקטורים יכולים לפרוש אך
      ורק מישור דו-ממדי בתוך המרחב התלת-ממדי.
  - type: multiple_choice
    question: מהו וקטור האפס [0, 0, ..., 0] באלגברה לינארית?
    options:
    - איבר היחידה לחיבור במרחב הווקטורי, כך ש-v + 0 = v לכל וקטור v
    - וקטור שאינו ניתן להכפלה בסקלרים
    - וקטור שאורכו המתמטי אינו מוגדר
    - וקטור הפורש את כל הממדים בו-זמנית
    correct: 0
    explanation: וקטור האפס הוא איבר היחידה החיבורי במרחב הווקטורי; חיבורו לכל וקטור משאיר את הווקטור
      ללא שינוי, ואורכו שווה ל-0.
- id: matrix_transformations_determinants
  title: 2. מטריצות כטרנספורמציות מרחביות ודטרמיננטה
  description: הבנת מטריצות לא כטבלאות מספרים משעממות, אלא כפונקציות דינמיות המעוותות את המרחב, מיפוי
    וקטורי בסיס, והדטרמיננטה כמדד לשינוי שטח ונפח.
  cards:
  - title: מטריצה כטרנספורמציה מרחבית דינמית
    figure:
      title: כיצד מטריצה 2x2 מעוותת את רשת הצירים
      svg: "<svg viewBox=\"0 0 520 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-height:150px;\"\
        >\n  <g transform=\"translate(40,20)\">\n    <rect x=\"0\" y=\"0\" width=\"100\" height=\"100\"\
        \ fill=\"#3b82f6\" fill-opacity=\"0.15\" stroke=\"#3b82f6\" stroke-dasharray=\"2,2\"/>\n    <line\
