        \ y2=\"50\" stroke=\"#ec4899\" stroke-width=\"3\"/>\n    <polygon points=\"106,46 116,51 108,56\"\
        \ fill=\"#ec4899\"/>\n    <text x=\"70\" y=\"120\" font-size=\"10\" fill=\"#ec4899\" text-anchor=\"\
        middle\">וקטור רגיל: מסתובב!</text>\n  </g>\n\n  <g transform=\"translate(260,20)\">\n    <line\
        \ x1=\"0\" y1=\"120\" x2=\"220\" y2=\"10\" stroke=\"#8b5cf6\" stroke-width=\"1.5\" stroke-dasharray=\"\
        3,3\" opacity=\"0.4\"/>\n\n    <line x1=\"20\" y1=\"110\" x2=\"80\" y2=\"80\" stroke=\"#3b82f6\"\
        \ stroke-width=\"3\"/>\n    <polygon points=\"76,76 86,77 80,86\" fill=\"#3b82f6\"/>\n    <text\
        \ x=\"50\" y=\"70\" font-size=\"11\" font-weight=\"bold\" fill=\"#3b82f6\">וקטור עצמי v</text>\n\
        \n    <line x1=\"20\" y1=\"110\" x2=\"170\" y2=\"35\" stroke=\"#10b981\" stroke-width=\"3\"/>\n\
        \    <polygon points=\"166,31 176,32 170,41\" fill=\"#10b981\"/>\n    <text x=\"130\" y=\"25\"\
        \ font-size=\"11\" font-weight=\"bold\" fill=\"#10b981\">A v = λ v (רק נמתח על אותו קו!)</text>\n\
        \  </g>\n</svg>"
      caption: מרבית הווקטורים משנים כיוון בעת כפל במטריצה. וקטור עצמי $\mathbf{v}$ נשאר על קו הפעולה
        המקורי שלו ורק נמתח בפקטור $\lambda$.
    points:
    - כאשר מטריצה מעוותת את המרחב, כמעט כל וקטור מוסט מקו הפעולה המקורי שלו ומסתובב לכיוון חדש.
    - 'עם זאת, קיימים כיוונים מיוחדים במרחב שאינם מסתובבים כלל - הם רק נמתחים, מתכווצים או הופכים כיוון
      על גבי הישר שלהם! וקטורים מיוחדים אלו נקראים וקטורים עצמיים (Eigenvectors - $\mathbf{v}$), ופקטור
      המתיחה נקרא ערך עצמי (Eigenvalue - $\lambda$): $A\mathbf{v} = \lambda \mathbf{v}$.'
    - 'כדי למצוא ערכים עצמיים, נכתוב $(A - \lambda I)\mathbf{v} = \mathbf{0}$. כדי שיהיה וקטור עצמי שאינו
      אפס במרחב האפס, המטריצה חייבת להיות סינגולרית: $\det(A - \lambda I) = 0$ (הפולינום האופייני).'
    - פתרון הפולינום נותן את הערכים העצמיים $\lambda_i$, והצבתם במשוואה מחזירה את כיווני הווקטורים העצמיים
      המתאימים.
  - title: לכסון מטריצות וחזקות של מטריצות
    points:
    - 'אם למטריצה $A$ בגודל $n \times n$ יש $n$ וקטורים עצמיים בלתי תלויים, נוכל לסדרם כעמודות במטריצה
      $P$, ואת הערכים העצמיים במטריצה אלכסונית $D$. זהו לכסון מטריצה: $A = P D P^{-1}$.'
    - 'לכסון ממיר את מערכת הצירים: $P^{-1}$ מעביר לבסיס הווקטורים העצמיים, $D$ מבצע מתיחה טהורה של הצירים
      ב-$\lambda_i$, ו-$P$ מחזיר לבסיס הסטנדרטי.'
    - 'חישוב חזקות גבוהות של מטריצה הופך לפשוט ביותר: $A^k = (P D P^{-1})^k = P D^k P^{-1}$. במקום $k$
      כפלי מטריצות יקרים, פשוט מעלים בחזקה את הערכים העצמיים לאורך האלכסון של $D$!'
  - title: המשפט הספקטרלי וניתוח רכיבים ראשיים (PCA)
    points:
    - 'המשפט הספקטרלי למטריצות סימטריות ממשיות: אם $A = A^T$, מובטח כי: (1) כל הערכים העצמיים הם ממשיים
      לחלוטין, ו-(2) כל הווקטורים העצמיים ניצבים הדדית ויוצרים בסיס אורתונורמלי: $A = Q D Q^T$.'
    - 'ניתוח רכיבים ראשיים (PCA): בלמידת מכונה, מערכי נתונים עתירי ממדים (כגון 1,000 מאפיינים למשתמש)
      כוללים מתאמים רבים. אלגוריתם PCA מחשב את מטריצת השונות המשותפת $\Sigma = \frac{1}{N} X^T X$, שהיא
      תמיד סימטרית וממשית.'
    - הווקטורים העצמיים של $\Sigma$ מצביעים בכיווני השונות המקסימלית של הנתונים! על ידי הטלת המידע על
      $k$ הווקטורים העצמיים המובילים, מהנדסים דוחסים 1,000 ממדים ל-2 או 3 ממדים בלבד תוך שימור 99% מהמידע.
  trivia:
  - type: multiple_choice
    question: מהי המשוואה האלגברית המגדירה וקטור עצמי v וערך עצמי lambda של מטריצה A?
    options:
    - A v = lambda v
    - A + v = lambda
    - A v = 0
    - det(A) = lambda v
    correct: 0
    explanation: 'וקטור עצמי $\mathbf{v}$ במכפלה עם מטריצה $A$ מפיק וקטור השוכן על אותו קו פעולה בדיוק,
      מוכפל בסקלר הערך העצמי $\lambda$: $A\mathbf{v} = \lambda\mathbf{v}$.'
  - type: multiple_choice
    question: כיצד מחשבים את הערכים העצמיים של מטריצה ריבועית A?
    options:
    - על ידי פתרון משוואת הפולינום האופייני det(A - lambda I) = 0 עבור lambda
    - על ידי ממוצע איברי האלכסון של המטריצה
    - על ידי חישוב המטריצה ההופכית A^-1
    - על ידי חלוקת העקבה בדרגת המטריצה
    correct: 0
    explanation: איפוס הדטרמיננטה של $(A - \lambda I)$ מבטיח קיום מרחב אפס שאינו טריוויאלי, ומייצר את
      הפולינום האופייני ששורשיו הם הערכים העצמיים.
  - type: multiple_choice
    question: מה מבטיח המשפט הספקטרלי עבור כל מטריצה סימטרית ממשית (A = A^T)?
    options:
    - כל הערכים העצמיים הם מספרים ממשיים, וקיים בסיס אורתונורמלי של וקטורים עצמיים (A = Q D Q^T)
    - כל הערכים העצמיים שווים לאפס
    - דטרמיננטת המטריצה היא תמיד שלילית
    - המטריצה אינה ניתנת ללכסון
    correct: 0
    explanation: המשפט הספקטרלי מוכיח שכל מטריצה סימטרית ממשית היא בעלת ערכים עצמיים ממשיים בלבד וניתנת
      ללכסון אורתוגונלי מלא עם וקטורים עצמיים ניצבים.
  - type: multiple_choice
    question: בניתוח רכיבים ראשיים (PCA), מה מייצגים הווקטורים העצמיים של מטריצת השונות המשותפת?
    options:
    - את צירי השונות המקסימלית של הנתונים במרחב (הרכיבים הראשיים)
    - את קואורדינטות הממוצע של אשכולות הנתונים
    - את נקודות הרעש שיש למחוק מהמדגם
    - את קצב הלמידה של רשת הנוירונים
    correct: 0
    explanation: הווקטורים העצמיים של מטריצת השונות המשותפת מצביעים בכיוונים שבהם המידע מפוזר ביותר (שונות
      מרבית), ומאפשרים הפחתת ממדים אופטימלית.
  - type: multiple_choice
    question: מדוע לכסון מטריצה (A = P D P^-1) יעיל חישובית במיוחד לצורך חישוב חזקות גבוהות כמו A^100?
    options:
    - מכיוון ש-A^100 = P D^100 P^-1, מה שדורש רק העלאה בחזקת 100 של איברי האלכסון בנפרד
    - מכיוון שהוא הופך את המטריצה למספר שלם בודד
    - מכיוון שהוא מבטל את הצורך בפעולות כפל בנקודה צפה
    - מכיוון שהוא מבטיח שכל איברי המטריצה יתאפסו
    correct: 0
    explanation: העלאת מטריצה אלכסונית $D$ בחזקה דורשת רק העלאה בחזקה של הערכים העצמיים $\lambda_i^{100}$,
      וחוסכת 100 כפלי מטריצות יקרים.
  - type: multiple_choice
    question: מהו הקשר בין הערכים העצמיים של מטריצה לבין הדטרמיננטה שלה (det(A))?
    options:
    - הדטרמיננטה שווה למכפלת כל הערכים העצמיים (det(A) = lambda_1 * lambda_2 * ... * lambda_n)
    - הדטרמיננטה שווה לסכום כל הערכים העצמיים
    - הדטרמיננטה שווה לריבוע הערך העצמי הגדול ביותר
    - אין שום קשר מתמטי ביניהם
    correct: 0
    explanation: 'הדטרמיננטה של מטריצה שווה למכפלת כל ערכיה העצמיים: $\det(A) = \prod_{i=1}^n \lambda_i$.'
  - type: multiple_choice
    question: מהו הקשר בין הערכים העצמיים של מטריצה לבין העקבה שלה (Tr(A))?
    options:
    - העקבה שווה לסכום כל הערכים העצמיים (Tr(A) = lambda_1 + lambda_2 + ... + lambda_n)
    - העקבה שווה למכפלת כל הערכים העצמיים
    - העקבה שווה לערך העצמי הקטן ביותר
    - העקבה שווה תמיד ל-0
    correct: 0
    explanation: 'עקבת המטריצה (סכום איברי האלכסון הראשי) שווה תמיד לסכום כל הערכים העצמיים שלה: $\text{Tr}(A)
      = \sum_{i=1}^n \lambda_i$.'
  - type: multiple_choice
    question: מה מעיד קיומו של ערך עצמי lambda = 0 במטריצה?
    options:
    - המטריצה היא סינגולרית (det = 0) וקיים מרחב אפס שאינו ריק המכיל את הווקטור העצמי המתאים
    - המטריצה היא מטריצת יחידה
    - המטריצה אינה ניתנת לכפל בווקטורים
    - כל איברי המטריצה שווים לאפס
    correct: 0
    explanation: אם $\lambda = 0$, אז $A\mathbf{v} = 0\mathbf{v} = \mathbf{0}$, מה שמוכיח ש-$\mathbf{v}$
      שייך למרחב האפס ולכן $\det(A) = 0$ (אינה הפיכה).
  - type: multiple_choice
    question: מהם הערכים העצמיים של מטריצת היחידה I?
    options:
    - כל הערכים העצמיים שווים ל-1.0
    - כל הערכים העצמיים שווים ל-0.0
    - הערכים העצמיים הם אינסופיים
    - הערכים העצמיים הם מספרים מדומים טהורים
    correct: 0
    explanation: מכיוון ש-$I\mathbf{v} = 1\mathbf{v}$ לכל וקטור במרחב, כל וקטור שאינו אפס הוא וקטור עצמי
      עם ערך עצמי $\lambda = 1$.
  - type: multiple_choice
    question: מהי המשמעות לכך שמטריצת סיבוב 2x2 היא בעלת ערכים עצמיים מרוכבים?
    options:
    - אין שום ישר ממשי במישור שאינו מסתובב במהלך הסיבוב
    - המטריצה שגויה מתמטית
    - אורכי הווקטורים מתכווצים לאפס
    - דטרמיננטת המטריצה היא שלילית
    correct: 0
    explanation: סיבוב טהור (שאינו ב-$180^\circ$) מסובב כל וקטור ממשי במישור, ולכן אין וקטורים עצמיים
      ממשיים והערכים העצמיים הם צמודים מרוכבים.
  - type: multiple_choice
    question: מהו 'מרחב עצמי' (Eigenspace) המתאים לערך עצמי lambda?
    options:
    - אוסף כל הווקטורים העצמיים המתאימים ל-lambda יחד עם וקטור האפס (מרחב האפס של A - lambda I)
    - גבולות התצוגה של מערך הנתונים בגרף
    - שטח הזיכרון של חוצץ המטריצה
    - אוסף הערכים העצמיים החיוביים
    correct: 0
    explanation: המרחב העצמי $E_\lambda = \text{Null}(A - \lambda I)$ הוא תת-המרחב הלינארי המורכב מכל
      הווקטורים העצמיים של $\lambda$ בתוספת וקטור האפס.
  - type: multiple_choice
    question: מהי 'מטריצה חיובית מוגדרת' (Positive Definite Matrix)?
    options:
    - מטריצה סימטרית שבה x^T A x > 0 לכל וקטור שאינו אפס (כל ערכיה העצמיים חיוביים ממש)
    - מטריצה המכילה מספרים שלמים חיוביים בלבד
    - מטריצה שהדטרמיננטה שלה שווה ל-1+
    - מטריצה בעלת יותר שורות מעמודות
    correct: 0
    explanation: מטריצה סימטרית היא חיובית מוגדרת אם כל ערכיה העצמיים חיוביים ($\lambda_i > 0$), מה שמבטיח
      שתבניות ריבועיות מתנהגות כקערה קמורה באופטימיזציה.
  - type: multiple_choice
    question: איזה אלגוריתם ששימש את גוגל במנוע החיפוש המקורי שלה מבוסס ביסודו על חישוב וקטור עצמי של
      מטריצת קישורים ענקית?
    options:
    - אלגוריתם פייג'ראנק (PageRank)
    - אלגוריתם דייקסטרה למסלול קצר
    - חיפוש בינארי
    - מיון מהיר (QuickSort)
    correct: 0
    explanation: אלגוריתם PageRank מחשב את הווקטור העצמי הראשי (עם $\lambda = 1$) של מטריצת מעברי ההסתברות
      בין דפי אינטרנט באמצעות שיטת החזקה.
  - type: multiple_choice
    question: מהי שיטת החזקה (Power Iteration) באלגברה לינארית חישובית?
    options:
    - אלגוריתם המכפיל שוב ושוב וקטור אקראי במטריצה A כדי להתכנס לווקטור העצמי בעל הערך העצמי הגדול ביותר
    - טכניקת חומרה להפחתת צריכת חשמל במעבד
    - שיטה לפתרון אי-שוויונות לינאריים
    - אלגוריתם לחישוב שורש ריבועי של מטריצות
    correct: 0
    explanation: שיטת החזקה מפעילה שוב ושוב כפל במטריצה ונרמול; מכיוון שהרכיב של הערך העצמי הדומיננטי
      גדל בקצב המהיר ביותר, הווקטור מתכנס במהירות לווקטור העצמי הראשי.
  - type: multiple_choice
    question: מתי מטריצה ריבועית אינה ניתנת ללכסון ('פגומה' / Defective)?
    options:
    - כאשר אין לה מספיק וקטורים עצמיים בלתי תלויים לפרישת בסיס מלא (ריבוי גאומטרי קטן מריבוי אלגברי)
    - כאשר הדטרמיננטה שלה היא מספר ראשוני
    - כאשר כל איבריה הם מספרי נקודה צפה
    - כאשר היא מוכפלת במטריצה אלכסונית
    correct: 0
    explanation: מטריצה פגומה חסרה בסיס של $n$ וקטורים עצמיים (כמו מטריצות גזירה $\begin{bmatrix} 1 &
      1 \\ 0 & 1 \end{bmatrix}$), ולכן לא ניתן ללכסנה.
- id: svd_matrix_factorizations
  title: 5. פירוק ערכים יחידים (SVD) ויישומי למידת מכונה
  description: 'המשפט המרכזי של האלגברה הלינארית: פירוק כל מטריצה מלבנית ל-U Sigma V^T, קירוב בעל דרגה
