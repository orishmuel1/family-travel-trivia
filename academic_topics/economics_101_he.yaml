              <circle cx="380" cy="35" r="5" fill="#ef4444"/>
              <text x="395" y="38" font-size="9" fill="#ef4444">נקודה D (בלתי ניתנת להשגה)</text>
            </svg>
          caption: "עקומת התמורה מדגימה חלופות ופשרות: ייצור מוגבר של מוצרי צריכה מחייב ויתור על מוצרי הון, ובכך מגדיר עלות אלטרנטיבית."
        points:
          - "כלכלה היא חקר הבחירה בתנאי מחסור. מחסור פירושו שהרצונות האנושיים למוצרים, שירותים וכוח מחשוב הם בלתי-מוגבלים, בעוד המשאבים הפיזיים (זמן, חומרי גלם, אנרגיה, כוח עבודה) מוגבלים לחלוטין."
          - "עלות אלטרנטיבית (Opportunity Cost) היא המושג המרכזי ביותר בקבלת החלטות: העלות האמיתית של כל בחירה היא שווייה של החלופה הטובה ביותר עליה ויתרנו. אם מהנדס משקיע שעתיים בדיבוג במקום בפיתוח תכונה חדשה, העלות האלטרנטיבית היא התכונה שלא נבנתה."
          - "עקומת התמורה (PPF) מציגה את צירופי התפוקה המרביים שמשק או צוות יכולים לייצר ביעילות מלאה. העקומה קעורה כלפי הראשית בשל חוק העלות האלטרנטיבית השולית הגדלה — משאבים אינם מותאמים במידה שווה לכל המשימות."
          - "ניתוח שולי (Marginal Analysis) מנחה קבלת החלטות רציונלית: אופטימיזציה מתבצעת על ידי השוואת התועלת השולית ($MB$) לעלות השולית ($MC$). סוכן רציונלי ירחיב פעילות כל עוד $MB \\ge MC$, ויעצור בדיוק כאשר $MB = MC$. עלויות שקועות (Sunk Costs, כספים שהושקעו בעבר ולא ניתנים להשבה) אינן רלוונטיות להחלטות עתידיות."
      - title: "חוק ההיצע והביקוש ושיווי משקל בשוק"
        points:
          - "חוק הביקוש קובע כי בהנחת שאר התנאים ללא שינוי (Ceteris Paribus), ככל שמחיר המוצר יורד, הצרכנים ידרשו כמות גדולה יותר ($P \\downarrow \\implies Q_d \\uparrow$). השיפוע השלילי משקף תועלת שולית פוחתת — כל יחידה נוספת של המוצר מספקת פחות סיפוק מקודמתה."
          - "חוק ההיצע קובע כי ככל שהמחיר בשוק עולה, יצרנים הממקסמים רווח יציעו כמות גדולה יותר ($P \\uparrow \\implies Q_s \\uparrow$). השיפוע החיובי משקף עלויות ייצור שוליות עולות ככל שהתפוקה גדלה."
          - "שיווי משקל בשוק מתרחש במחיר ($P^*$) שבו הכמות המבוקשת שווה במדויק לכמות המוצעת ($Q_d = Q_s$). אם המחיר גבוה משיווי המשקל, נוצר עודף היצע המפעיל לחץ תחרותי להורדת מחירים; אם המחיר נמוך ממנו, נוצר עודף ביקוש המעלה את המחיר."
          - "יש להבחין בין תנועה לאורך העקומה (הנגרמת אך ורק משינוי במחיר המוצר עצמו) לבין תזוזה של העקומה כולה (הנובעת מגורמים חיצוניים כמו שינויים בהכנסות הצרכנים, העדפות, טכנולוגיה, מחירי תשומות או ציפיות)."
      - title: "גמישות מחירים, עודף רווחה ועיוותי שוק"
        points:
          - "גמישות הביקוש ביחס למחיר ($\\epsilon_d$) מודדת את רגישות הצרכנים לשינויי מחיר: $\\epsilon_d = \\frac{\\% \\Delta Q_d}{\\% \\Delta P}$. כאשר $|\\epsilon_d| > 1$, הביקוש גמיש (עליית מחיר קטנה מבריחה קונים רבים); כאשר $|\\epsilon_d| < 1$, הביקוש קשיח (מוצרים חיוניים כמו אינסולין או דלק, שבהם הכמות המבוקשת כמעט שאינה משתנה)."
          - "עודף הצרכן הוא ההפרש הכספי בין המחיר המרבי שהצרכנים היו מוכנים לשלם לבין המחיר ששילמו בפועל בשוק. עודף היצרן הוא ההפרש בין מחיר השוק לבין העלות המינימלית שהיצרנים דרשו כדי לייצר את המוצר."
          - "בשיווי משקל תחרותי, סכום עודף הצרכן ועודף היצרן (הרווחה החברתית הכוללת) מגיע לערכו המרבי, ומשיג יעילות פארטו — מצב שבו לא ניתן להיטיב עם סוכן אחד מבלי לפגוע באחר."
          - "התערבויות ממשלתיות עלולות לשבש שיווי משקל: מחיר מקסימום (תקרה חוקית, כגון פיקוח על שכר דירה) מתחת לשיווי המשקל גורר מחסור כרוני, שווקים שחורים ואובדן רווחה (Deadweight Loss). מחיר מינימום (רצפה חוקית, כגון שכר מינימום) מעל שיווי המשקל יוצר עודף היצע מתמיד."
    trivia:
      - type: multiple_choice
        question: "בכלכלה, מהי ההגדרה המדויקת של ׳עלות אלטרנטיבית׳ (Opportunity Cost)?"
        options:
          - "ערכה של החלופה הטובה ביותר עליה נאלצנו לוותר בעת קבלת החלטה"
          - "סך ההוצאה הכספית שנרשמה בספרי החשבונות של העסק"
          - "ההוצאה ההיסטורית על ציוד שלא ניתן למכור או להחזיר"
          - "מס רווחי ההון שחברה משלמת לרשויות המס בסוף השנה"
        correct: 0
        explanation: "עלות אלטרנטיבית מודדת את העלות הכלכלית האמיתית של כל בחירה כרווח הנקי שיכול היה להניב הוויתור על האפשרות הבאה בתור."
      - type: multiple_choice
        question: "מדוע חוק הביקוש מורה כי הצרכנים רוכשים כמות גדולה יותר ממוצר ככל שמחירו יורד (עקומת ביקוש יורדת)?"
        options:
          - "כל יחידת צריכה נוספת מספקת תועלת שולית פוחתת, ולכן קונים ירכשו יחידות נוספות רק במחיר נמוך יותר"
          - "יצרנים סוגרים מפעלים באופן אוטומטי בעת ירידת מחירים"
          - "עקומת ההיצע זזה ימינה באופן מיידי בכל פעם שהביקוש יורד"
          - "הכנסת הצרכנים מוכפלת פי ארבעה באופן אוטומטי כשהמחירים יורדים"
        correct: 0
        explanation: "תועלת שולית פוחתת מורה שהיחידה השנייה או השלישית מעניקה פחות סיפוק מהראשונה, ולכן הצרכן יהיה מוכן לרכוש אותה אך ורק במחיר מופחת."
      - type: multiple_choice
        question: "מה מתרחש בשוק חופשי ותחרותי כאשר המחיר נקבע בפועל מֵעַל למחיר שיווי המשקל?"
        options:
          - "נוצר עודף היצע (Surplus), המפעיל לחץ תחרותי על המוכרים להוריד מחירים כדי להיפטר מהמלאי"
          - "נוצר מחסור חריף כיוון שהקונים מחסלים מיד את כל המלאים"
          - "עקומת הביקוש נעה ימינה לצמיתות"
          - "הכמות המוצעת צונחת לאפס באופן מיידי"
        correct: 0
        explanation: "כאשר המחיר גבוה משיווי המשקל, הכמות המוצעת עולה על הכמות המבוקשת (Qs > Qd), מה שיוצר עודף ומאלץ יצרנים להוריד מחירים."
      - type: multiple_choice
        question: "מהי גמישות הביקוש ביחס למחיר עבור תרופה מצילת חיים (כגון אינסולין) שהחולים חייבים לצרוך בכל מחיר?"
        options:
          - "ביקוש קשיח לחלוטין (|ε| קרוב מאוד ל-0)"
          - "ביקוש גמיש לחלוטין (|ε| שואף לאינסוף)"
          - "גמישות יחידתית (|ε| = 1)"
          - "גמישות שלילית אינסופית"
        correct: 0
        explanation: "כאשר למוצר אין תחליפים והוא חיוני להישרדות, הביקוש קשיח (גמישות קרובה לאפס), כלומר עליית מחיר חדה כמעט שאינה מפחיתה את הכמות הנרכשת."
      - type: multiple_choice
        question: "איזה מונח כלכלי מתאר עלויות עבר שלא ניתן להשיבן, שסוכן רציונלי חייב להתעלם מהן לחלוטין בהחלטות עתידיות?"
        options:
          - "עלויות שקועות (Sunk Costs)"
          - "עלויות שוליות (Marginal Costs)"
          - "עלויות משתנות (Variable Costs)"
          - "עלויות מובלעות (Implicit Costs)"
        correct: 0
        explanation: "עלויות שקועות הן כספים שהוצאו בעבר ולא ניתנים להחזרה; קבלת החלטות רציונלית מתחשבת אך ורק בעלויות ובתועלות השוליות העתידיות."
      - type: multiple_choice
        question: "מה יקרה למחיר ולכמות שיווי המשקל של מכוניות חשמליות אם עלויות ייצור הסוללות יצנחו הודות לחדשנות טכנולוגית?"
        options:
          - "עקומת ההיצע תזוז ימינה, מחיר שיווי המשקל ירד וכמות שיווי המשקל תעלה"
          - "עקומת ההיצע תזוז שמאלה ומחיר שיווי המשקל יעלה"
          - "עקומת הביקוש תזוז שמאלה ונפח המכירות ירד"
          - "מחיר שיווי המשקל יעלה בעוד הכמות תישאר קבועה"
        correct: 0
        explanation: "הוזלת תשומות הייצור מאפשרת ליצרנים לספק יותר מכוניות בכל רמת מחיר (תזוזת היצע ימינה), מה שמוריד את המחיר ומגדיל את הכמות הנמכרת."
      - type: multiple_choice
        question: "איזה שטח גאומטרי בגרף היצע וביקוש מייצג את ׳נטל המס העודף׳ (Deadweight Loss) הנובע מעיוותי שוק כגון מסי קנייה או פיקוח מחירים?"
        options:
          - "אובדן הרווחה החברתית הכוללת שאף גורם במשק אינו זוכה ליהנות ממנו"
          - "סך הכנסות המדינה מגביית מיסים"
          - "הרווח הנקי העודף שמפיק מונופול"
          - "השטח שמתחת לעקומת ההיצע המייצג את סך העלויות המשתנות"
        correct: 0
        explanation: "נטל עודף הוא הפסד של רווחה חברתית (עודף צרכן ויצרן) שמתפוגג כיוון שהשוק מנוע מלהגיע לכמות שיווי המשקל היעילה ביותר."
      - type: multiple_choice
        question: "מהו ההבדל המהותי בין ׳שינוי בביקוש׳ לבין ׳שינוי בכמות המבוקשת׳?"
        options:
          - "שינוי בביקוש מסיט את העקומה כולה בשל גורמים חיצוניים; שינוי בכמות המבוקשת הוא תנועה לאורך העקומה בשל שינוי מחיר המוצר"
          - "שינוי בביקוש חל אך ורק על מוצרי יוקרה, בעוד כמות מבוקשת חלה על מוצרי יסוד"
          - "שינוי בביקוש נגרם אך ורק משינויים בשיעורי מס הכנסה לחברות"
          - "אין שום הבדל; מדובר במונחים זהים לחלוטין במיקרו-כלכלה"
        correct: 0
        explanation: "שינוי במחיר המוצר עצמו מזיז את הנקודה לאורך העקומה הקיימת (כמות מבוקשת). שינוי בהכנסה או בטעמים מסיט את העקומה כולה (ביקוש)."
      - type: multiple_choice
        question: "מה משקפת צורתה הקעורה של עקומת התמורה (PPF) כלפי ראשית הצירים?"
        options:
          - "את חוק העלות האלטרנטיבית השולית הגדלה, הנובע מכך שמשאבים אינם מותאמים במידה שווה לכל תחומי הייצור"
          - "כושר ייצור בלתי מוגבל הודות למערכות רובוטיקה ואוטומציה"
          - "אפס עלות אלטרנטיבית בייצור מוצרי צריכה המוניים"
          - "שיעורי תחלופה טכנית קבועים בין כל התשומות"
        correct: 0
        explanation: "משאבים (קרקע, עבודה, הון) מותאמים לתחומים מסוימים. הסטת משאבים מיומנים לתחומים שאינם מתמחים בהם מייקרת את העלות האלטרנטיבית."
      - type: multiple_choice
        question: "אם הממשלה קובעת מחיר מקסימום מחייב על שכר דירה מתחת למחיר שיווי המשקל החופשי, מהי התוצאה הצפויה?"
        options:
          - "מחסור כרוני בדירות להשכרה, ירידה באיכות תחזוקת הבניינים ופריחת שוק שחור"
          - "עודף עצום של דירות ריקות שבעלי בתים אינם מצליחים להשכיר"
          - "זינוק מיידי בבניית דירות חדשות להשכרה על ידי קבלנים פרטיים"
          - "עלייה ביעילות השוק וברווחה החברתית הכוללת"
        correct: 0
        explanation: "קביעת מחיר נמוך משיווי משקל מגדילה את הכמות המבוקשת אך מתמרצת בעלי בתים לצאת מהשוק ולהזניח תחזוקה, מה שיוצר תורי ענק ומחסור."
      - type: multiple_choice
        question: "אם גמישות הביקוש הצולבת בין שני מוצרים (כגון קפה ומאפים) היא שלילית, איזה קשר מתקיים ביניהם?"
        options:
          - "הם מוצרים משלימים (עליית מחיר של האחד מקטינה את הביקוש לאחר)"
          - "הם מוצרים תחליפיים (עליית מחיר של האחד מגדילה את הביקוש לאחר)"
          - "הם מוצרי גיפן נחותים"
          - "הם מוצרים בלתי תלויים לחלוטין ללא כל קשר צרכני"
        correct: 0
        explanation: "במוצרים משלימים (גמישות צולבת שלילית), המוצרים נצרכים יחדיו. התייקרות של מוצר אחד מפחיתה את צריכתו ופוגעת בביקוש למוצר המשלים."
      - type: multiple_choice
        question: "באיזו נקודה מקבל החלטות רציונלי ממקסם את הרווח הנקי מפעילות מסוימת?"
        options:
          - "בנקודה שבה התועלת השולית שווה בדיוק לעלות השולית (MB = MC)"
          - "בנקודה שבה התועלת הכוללת שווה לסך העלות הכוללת"
          - "בנקודה שבה העלות השולית מתאפסת לחלוטין"
          - "בנקודה שבה העלות הכוללת מגיעה לערכה המרבי"
        correct: 0
        explanation: "הרווח הנקי מגיע לשיאו כאשר התועלת מיחידת הפעילות האחרונה שווה במדויק לעלותה (MB = MC). הרחבה מעבר לכך תגרום לעלות לעלות על התועלת."
      - type: multiple_choice
        question: "איזה מונח מתאר מוצר שהביקוש אליו גדל ככל שהכנסת הצרכנים עולה (גמישות הכנסה חיובית)?"
        options:
          - "מוצר נורמלי (Normal Good)"
          - "מוצר נחות (Inferior Good)"
          - "מוצר ובלן (Veblen Good)"
          - "מוצר ציבורי"
        correct: 0
        explanation: "מוצר נורמלי מתאפיין בגמישות הכנסה חיובית. לעומתו, במוצר נחות (כמו שימורים זולים או נסיעות בתחבורה ישנה), הביקוש דווקא יורד כשההכנסה עולה."
      - type: multiple_choice
        question: "מהו ׳עודף הצרכן׳ (Consumer Surplus)?"
        options:
          - "ההפרש בין הסכום המרבי שהצרכן היה מוכן לשלם לבין המחיר ששילם בפועל בשוק"
          - "עודפי סחורות שנותרו בחנויות לאחר עונת המבצעים"
          - "שולי הרווח של חברות הייצור לאחר תשלום מסי קנייה"
          - "יתרות המזומנים השמורות בחשבונות העובר ושב של משקי הבית"
        correct: 0
        explanation: "עודף הצרכן מודד את התועלת הכלכלית הנקייה של הקונים — השטח שבין עקומת הביקוש (הנכונות לשלם) לבין מחיר השוק בפועל."
      - type: multiple_choice
        question: "כיצד משפיעה זמינותם של מוצרים תחליפיים קרובים על גמישות הביקוש של מוצר מסוים?"
        options:
          - "היא הופכת את הביקוש לגמיש יותר, כיוון שקונים יכולים לעבור בקלות לחלופות בעת עליית מחיר"
          - "היא הופכת את הביקוש לקשיח לחלוטין"
          - "אין לה שום השפעה על תגובת הצרכנים למחיר"
          - "היא כופה על עקומת הביקוש להפוך לקו אנכי מושלם"
        correct: 0
        explanation: "ככל שיש יותר חלופות זמינות (כגון חברות תעופה שונות או מותגי חמאה), הצרכן רגיש יותר למחיר ויעבור מיד לתחליף בעת התייקרות."

  - id: firms_costs_market_structures
    title: "2. עלויות ייצור, תחרות ומבני שוק"
    description: >
      כיצד פירמות מייעלות ייצור: עלויות קבועות ושוליות, יתרונות לגודל, תמחור תחרותי,
      מונופולים, אוליגופולים ואפקטי רשת בפלטפורמות מודרניות.
    cards:
      - title: "מבנה עלויות: קבועות, משתנות, שוליות וממוצעות"
        figure:
          title: "עקומות עלות במיקרו-כלכלה: MC, ATC ו-AVC"
          svg: >
            <svg viewBox="0 0 520 150" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-height:150px;">
              <line x1="60" y1="125" x2="480" y2="125" stroke="currentColor" stroke-width="1.5"/>
              <line x1="60" y1="125" x2="60" y2="15" stroke="currentColor" stroke-width="1.5"/>
              <text x="470" y="140" font-size="10" fill="currentColor" text-anchor="end">כמות תפוקה (Q) ←</text>
              <text x="35" y="25" font-size="10" fill="currentColor" transform="rotate(-90 35 25)">עלות ($) ←</text>

              <!-- ATC Curve -->
              <path d="M 90 35 Q 260 110 430 50" stroke="#3b82f6" stroke-width="2.5" fill="none"/>
              <text x="435" y="55" font-size="11" font-weight="bold" fill="#3b82f6">ATC</text>

              <!-- AVC Curve -->
              <path d="M 90 75 Q 250 120 430 80" stroke="#10b981" stroke-width="2" fill="none"/>
              <text x="435" y="85" font-size="11" font-weight="bold" fill="#10b981">AVC</text>

              <!-- MC Curve -->
              <path d="M 90 115 Q 160 115 250 80 L 380 20" stroke="#ef4444" stroke-width="2.5" fill="none"/>
              <text x="385" y="25" font-size="11" font-weight="bold" fill="#ef4444">MC</text>

              <!-- Min ATC point -->
              <circle cx="260" cy="80" r="4" fill="#ef4444"/>
              <text x="260" y="98" font-size="9" fill="currentColor" text-anchor="middle">נקודת מינימום ATC (גודל יעיל)</text>
            </svg>
          caption: "עקומת העלות השולית ($MC$) חותכת תמיד את עקומות העלות הממוצעת הכוללת ($ATC$) והמשתנה ($AVC$) בנקודות המינימום שלהן בדיוק."
        points:
          - "העלות הכוללת של הפירמה ($TC$) מתחלקת לעלויות קבועות ($FC$, שאינן תלויות בכמות המיוצרת, כגון חוזי שכירות ופיתוח תוכנה) ועלויות משתנות ($VC$, הצומחות עם הייצור, כמו שרתי ענן וחומרי גלם): $TC = FC + VC$."
          - "עלות שולית ($MC = \\frac{\\Delta TC}{\\Delta Q}$) היא העלות של ייצור יחידה נוספת אחת. בשל חוק התפוקה השולית הפוחתת, כאשר מוסיפים תשומות משתנות (עובדים) להון קבוע נתון, התפוקה השולית יורדת והעלות השולית מזנקת."
          - "העלות הממוצעת הכוללת ($ATC = \\frac{TC}{Q}$) מתאפיינת בצורת U: בתפוקה נמוכה העלויות הקבועות מתחלקות על מעט יחידות; בתפוקה גבוהה התפוקה הפוחתת מייקרת את העלות. עקומת ה-$MC$ חותכת את ה-$ATC$ תמיד בנקודת המינימום שלו (גודל יעיל מינימלי)."
          - "יתרונות לגודל (Economies of Scale) מתרחשים כאשר הגדלת הייצור בטווח הארוך מורידה את העלות הממוצעת ליחידה (הודות לרכש מרוכז, אוטומציה ופריסת עלויות מחקר). חסרונות לגודל מתעוררים כאשר בירוקרטיה ניהולית, עומס תיאום וסרבול ארגוני מייקרים את העלות הממוצעת."
      - title: "תחרות משוכללת מול כוח מונופוליסטי"
        points:
          - "בתחרות משוכללת, פירמות רבות וקטנות מייצרות מוצר אחיד ללא חסמי כניסה. הפירמות הן ׳מקבלות מחיר׳ (Price Takers) וניצבות בפני ביקוש אופקי ($P = MR$). בטווח הארוך כניסה חופשית של מתחרים מוחקת רווחים כלכליים עודפים ($P = MC = \\min(ATC)$)."
          - "מונופול הוא ספק בלעדי המוגן על ידי חסמי כניסה אדירים (פטנטים, זיכיונות ממשלתיים, רשתות תשתית או עלויות הון כבדות). המונופול ניצב בפני כלל הביקוש של השוק, ולכן הפדיון השולי שלו נמוך תמיד מהמחיר ($MR < P$)."
          - "כלל הזהב האוניברסלי למקסום רווחים עבור כל פירמה: ייצור בכמות שבה הפדיון השולי שווה לעלות השולית ($MR = MC$). בעוד פירמה תחרותית גובה $P = MC$, המונופול גובה מחיר גבוה מהעלות השולית ($P > MC$) בהתאם לגמישות הביקוש."
          - "נטל עודף של מונופול: המונופול מצמצם תפוקה ומעלה מחירים ביחס לשוק תחרותי, מה שמעביר רווחה מהצרכנים לכיסו ומאבד נתח מהרווחה החברתית כליל. מונופול טבעי מתקיים כאשר ה-$ATC$ יורד לכל אורך הביקוש בשוק (כמו תשתיות מים וחשמל), מה שהופך ספק יחיד לחסכוני ביותר."
      - title: "אוליגופול, תחרות מונופוליסטית ואפקטי רשת"
        points:
          - "תחרות מונופוליסטית כוללת יצרנים רבים המציעים מוצרים מבודלים (כגון מסעדות, מותגי הלבשה או אפליקציות). לפירמות יש כוח תמחור מסוים בטווח הקצר, אך חסמי כניסה נמוכים מבטלים רווח עודף בטווח הארוך."
          - "אוליגופול הוא שוק הנשלט על ידי מספר קטן של שחקנים גדולים (כגון יצרניות מטוסי נוסעים, מערכות הפעלה לסלולר או חברות תקשורת). כיוון שמהלך של שחקן אחד משפיע מיידית על מתחריו, אוליגופולים מחייבים חשיבה אסטרטגית מובהקת."
          - "קרטל (כדוגמת אופ״ק) הוא הסכם מפורש בין מתחרים לתיאום כמויות ומחירים כמונופול מאוחד. קרטלים אינם יציבים מטבעם כיוון שלכל חבר פרטי יש תמריץ סמוי לרמות ולייצר מעבר למכסה כדי לגרוף רווח מהיר."
          - "אפקטי רשת (Network Externalities) מופיעים כאשר ערך המוצר לכל משתמש מזנק ככל שמצטרפים משתמשים נוספים (חוק מטקלף: ערך הרשת $V \\propto n^2$). פלטפורמות דו-צדדיות כגון מערכות הפעלה ורשתות תשלום נהנות מיתרונות גודל עצומים המובילים לרוב לשווקים של ׳המנצח לוקח כמעט הכל׳."
    trivia:
      - type: multiple_choice
        question: "מהו התנאי האוניברסלי למקסום רווחים של כל פירמה באשר היא, ללא תלות במבנה השוק שבו היא פועלת?"
        options:
          - "פדיון שולי שווה לעלות השולית (MR = MC)"
          - "המחיר שווה לסך העלות הקבועה הכוללת"
          - "העלות הממוצעת הכוללת מגיעה לשיאה המרבי"
          - "סך הפדיון שווה לסך העלויות השקועות"
        correct: 0
        explanation: "אם הפדיון השולי עולה על העלות השולית (MR > MC), ייצור יחידה נוספת מגדיל רווח. אם הוא נמוך ממנה, היחידה מסבה הפסד. הרווח מקסימלי בנקודת השוויון MR = MC."
      - type: multiple_choice
        question: "מדוע עקומת העלות השולית (MC) חותכת תמיד את עקומת העלות הממוצעת (ATC) בנקודת המינימום שלה בדיוק?"
        options:
          - "כל עוד עלות היחידה הבאה נמוכה מהממוצע היא מושכת אותו מטה; כאשר היא יקרה מהממוצע היא מושכת אותו מעלה"
          - "העלויות הקבועות מתאפסות לחלוטין באותה נקודת חיתוך בדיוק"
          - "הפדיון הכולל מובטח להיות אפס באותה כמות ייצור"
          - "הוראות חוק ההגבלים העסקיים מחייבות התאמה מדויקת כזו"
        correct: 0
        explanation: "בדיוק כמו בממוצע ציונים: אם הציון במבחן האחרון גבוה מהממוצע הוא יעלה אותו, ואם הוא נמוך הוא יוריד אותו. לכן הממוצע מגיע למינימום בדיוק כש-MC = ATC."
      - type: multiple_choice
        question: "מה מאפיין את הרווח הכלכלי של פירמות בשוק בעל תחרות משוכללת בטווח הארוך?"
        options:
          - "הרווח הכלכלי שואף לאפס, כיוון שכניסת מתחרים חדשים מגדילה את ההיצע ומורידה את מחיר השוק"
          - "הפירמות גורפות רווחי עתק בלתי מוגבלים לצמיתות"
          - "הפירמות פועלות בהפסדים מתמשכים הממומנים על ידי המדינה"
          - "מחיר השוק נשמר לצמיתות מעל העלות הממוצעת הכוללת"
        correct: 0
        explanation: "רווח כלכלי חיובי מושך מתחרים חדשים ללא חסמי כניסה. ההיצע גדל והמחיר יורד עד שהוא משתווה למינימום ATC, והרווח הכלכלי מתאפס."
      - type: multiple_choice
        question: "מה מבדיל בין רווח חשבונאי לרווח כלכלי?"
        options:
          - "רווח כלכלי מנכה מהפדיון גם עלויות מפורשות וגם עלויות אלטרנטיביות מובלעות, בעוד רווח חשבונאי מתעלם מעלויות אלטרנטיביות"
          - "רווח חשבונאי מנכה הוצאות פחת בעוד רווח כלכלי מתעלם מהן"
          - "רווח כלכלי מחושב אך ורק עבור מוסדות ממשלתיים ללא כוונת רווח"
          - "רווח חשבונאי תמיד קטן יותר מרווח כלכלי"
        correct: 0
        explanation: "רווח חשבונאי מודד תקבולים פחות הוצאות כספיות ישירות. רווח כלכלי מחשיב גם את שווי הזמן וההון האלטרנטיבי שהושקע במיזם."
      - type: multiple_choice
        question: "מהו ׳מונופול טבעי׳ (Natural Monopoly)?"
        options:
          - "ענף שבו פירמה יחידה מסוגלת לספק את כל צורכי השוק בעלות ממוצעת נמוכה יותר משני מתחרים בשל יתרונות גודל עצומים"
          - "מונופול שנוצר משליטה בלעדית במכרה של מחצב טבעי יקר"
          - "חברה המשתלטת על כל יריבותיה באמצעות ריגול תעשייתי"
          - "שוק שבו הממשלה אוסרת על קיומו של מסחר פרטי"
        correct: 0
        explanation: "בתשתיות רשת כבדות (רשת מים, רכבות, חשמל), העלות הממוצעת יורדת לכל אורך השוק, כך שספק יחיד ומפוקח זול ויעיל יותר מכפילות תשתיות."
      - type: multiple_choice
        question: "על פי חוק מטקלף (Metcalfe's Law), כיצד צומח ערכה המערכתי של רשת תקשורת או פלטפורמה חברתית כפונקציה של מספר המשתמשים (n)?"
        options:
          - "הערך צומח ביחס ישר לריבוע מספר המשתמשים (V ∝ n²)"
          - "הערך צומח באופן ליניארי עם מספר המשתמשים (V ∝ n)"
          - "הערך צומח באופן לוגריתמי מתון (V ∝ log n)"
          - "ערך הרשת קבוע לחלוטין ואינו תלוי במספר המשתתפים"
        correct: 0
        explanation: "ברשת של n צמתים, מספר החיבורים הייחודיים האפשריים הוא n(n-1)/2, מה שגורם לערך הרשת לצמוח בריבוע ולהעניק יתרון אדיר לפלטפורמות מובילות."
      - type: multiple_choice
        question: "מדוע קרטלים לתמחור מונופוליסטי מאוחד (כגון קרטלי נפט) סובלים מאי-יציבות פנימית כרונית?"
        options:
          - "לכל חבר בקרטל יש תמריץ כלכלי פרטי לרמות בסתר ולייצר מעבר למכסה שנקבעה לו כדי לגרוף רווח נוסף"
          - "חברי הקרטל מחויבים בחוק לתרום את כל רווחיהם למוסדות צדקה"
          - "לכל חברי הקרטל יש עקומות עלות זהות המונעות קביעת מחיר"
          - "המדינות החברות אינן מסוגלות לאחסן סחורות עודפות במחסנים"
        correct: 0
        explanation: "בעוד הגבלת הייצור הכללית שומרת על מחיר גבוה, כל שחקן בודד מרוויח הון אם ימכור עוד יחידות במחיר הגבוה, מה שמוביל לקריסת ההסכם."
      - type: multiple_choice
        question: "באילו תנאים פירמה תבחר להשבית את הייצור שלה באופן מיידי בטווח הקצר (נקודת סגירה)?"
        options:
          - "כאשר מחיר השוק צונח אל מתחת לעלות המשתנה הממוצעת (P < AVC)"
          - "כאשר מחיר השוק צונח אל מתחת לעלות הכוללת הממוצעת (P < ATC)"
          - "כאשר לפירמה יש חובות הלוואה קבועים בבנק"
          - "כאשר הרווח החשבונאי מתאזן על אפס"
        correct: 0
        explanation: "אם המחיר אינו מכסה אפילו את העלויות המשתנות השוטפות (שכר עובדים וחומרי גלם), המשך הייצור מגדיל את ההפסד מעבר לעלויות הקבועות, ויש לסגור מיד."
      - type: multiple_choice
        question: "באיזה מבנה שוק מתחרים יצרנים רבים המוכרים מוצרים מבודלים תוך השקעה רבה בפרסום ומיתוג, עם חסמי כניסה נמוכים?"
        options:
          - "תחרות מונופוליסטית (Monopolistic Competition)"
          - "מונופול טהור"
          - "תחרות משוכללת"
          - "דואופול הדוק"
        correct: 0
        explanation: "תחרות מונופוליסטית (כמו בבתי קפה, אופנה ומסעדות) משלבת בידול מוצרים המעניק שליטה מתונה במחיר עם כניסה קלה המוחקת רווחי יתר בטווח הארוך."
      - type: multiple_choice
        question: "כיצד מכונה התופעה שבה הרחבת קנה המידה של ארגון מייקרת את העלות הממוצעת ליחידה בשל סרבול בירוקרטי וקשיי תיאום?"
        options:
          - "חסרונות לגודל (Diseconomies of Scale)"
          - "תועלת שולית פוחתת"
          - "יתרונות למגוון (Economies of Scope)"
          - "יתרון יחסי"
        correct: 0
        explanation: "כאשר חברה הופכת למפלצתית, שכבות הניהול, עיכובי התקשורת ואיטיות התיאום מייקרים את העלות הממוצעת לייצור כל יחידה נוספת."
      - type: multiple_choice
        question: "מדוע מונופול בעל מחיר אחיד מייצר כמות קטנה יותר וגובה מחיר גבוה יותר מענף תחרותי בעל אותו מבנה עלויות?"
        options:
          - "כדי למכור יחידה נוספת על המונופול להוריד את המחיר על כלל היחידות, מה שגורם לפדיון השולי להיות נמוך מהמחיר (MR < P)"
          - "מונופולים פועלים תמיד ללא ציוד הוני קבוע"
          - "החוק אוסר על מנהלי מונופול לבצע חישוב של עלויות שוליות"
          - "ביקוש הצרכנים הופך לגמיש לחלוטין בתנאי מונופול"
        correct: 0
        explanation: "כדי למכור יותר, המונופול חייב להוזיל גם את היחידות הקודמות, כך ש-MR < P. השוואת MR = MC גורמת לו להגביל תפוקה ולגבות מחיר מונופוליסטי גבוה."
      - type: multiple_choice
        question: "מהי ׳אפליית מחירים מושלמת׳ (אפליית מחירים מדרגה ראשונה)?"
        options:
          - "גביית המחיר המרבי המדויק שכל לקוח ספציפי מוכן לשלם, המנכסת 100% מעודף הצרכן לכיס היצרן"
          - "הענקת הנחות כמות על רכישת חבילות סיטונאיות"
          - "הצעת כרטיסים מוזלים לסטודנטים ולאזרחים ותיקים"
          - "מכירת סחורות במחיר הנמוך מהעלות המשתנה הממוצעת"
        correct: 0
        explanation: "באפליית מחירים מדרגה ראשונה, המוכר מכיר את הנכונות המקסימלית לשלם של כל קונה וגובה אותה במלואה, ובכך ממיר את כל עודף הצרכן לרווח ללא נטל עודף."
      - type: multiple_choice
        question: "מה מאפיין שוק במבנה של ׳אוליגופול׳?"
        options:
          - "שליטה של מספר קטן של פירמות ענק שפעולותיהן האסטרטגיות משפיעות ישירות זו על זו"
          - "אלפי חקלאים קטנים המוכרים חיטה זהה לחלוטין"
          - "חברת דואר ממשלתית יחידה ללא כל מתחרים חוקיים"
          - "שוק ללא זכויות קניין וללא אכיפת חוזים מסחריים"
        correct: 0
        explanation: "אוליגופול (כמו בואינג ואיירבוס או חברות הסלולר) מתאפיין בריכוזיות גבוהה שבה כל שחקן חייב לחשב את תגובות היריבים בתורת המשחקים."
      - type: multiple_choice
        question: "מה קורה לעלות הממוצעת הכוללת (ATC) של חברת תוכנה ככל שמספר ההורדות הדיגיטליות של המוצר מזנק מ-1,000 למיליון עותקים?"
        options:
          - "ה-ATC צונחת בחדות לעבר האפס, כיוון שהעלות הקבועה העצומה נפרסת על פני עלות שולית אפסית של העתקה"
          - "ה-ATC מזנקת מעריכית בשל חוק התפוקה השולית הפוחתת"
          - "ה-ATC נשארת יציבה וקבועה ללא שום שינוי"
          - "ה-ATC הופכת במלואה להתחייבות הונית קבועה"
        correct: 0
        explanation: "במוצרים דיגיטליים יש עלות פיתוח קבועה גבוהה מאוד (R&D) אך עלות שולית אפסית להפצת עותק נוסף (MC שואף ל-0), ולכן ATC מתרסקת כמעט לאפס."
      - type: multiple_choice
        question: "מהי ׳יעילות הקצאתית׳ (Allocative Efficiency) בניתוח רווחה כלכלית?"
        options:
          - "ייצור תמהיל המוצרים המדויק שהחברה הכי מעוניינת בו, שבו המחיר שווה לעלות השולית (P = MC)"
          - "ייצור מוצרים בנקודה הנמוכה ביותר של עקומת העלות הממוצעת"
          - "חלוקת כלל העושר הלאומי באופן שווה בין כלל האזרחים"
          - "מקסום גביית המכסים של הממשלה על מוצרי יבוא"
        correct: 0
        explanation: "יעילות הקצאתית מושגת כאשר המחיר שהצרכנים מוכנים לשלם עבור היחידה השולית שווה בדיוק לעלות המשאבים שנדרשו לייצורה (P = MC)."

  - id: macroeconomics_money_banking
    title: "3. מאקרו-כלכלה, מערכות כספיות ומדיניות פיסקלית"
    description: >
      הבנת המנוע המאקרו-כלכלי: מדידת תוצר (GDP), דינמיקת אינפלציה,
      שליטת הבנק המרכזי בריבית, יצירת כסף בבנקאות ברזרבה חלקית ומכפיל פיסקלי קיינסיאני.
    cards:
      - title: "תוצר מקומי גולמי (GDP), אינפלציה ומחזורי עסקים"
        figure:
          title: "הזרימה המעגלית של הכנסות והוצאות במשק"
          svg: >
            <svg viewBox="0 0 520 150" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-height:150px;">
              <rect x="30" y="45" width="110" height="60" rx="8" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="2"/>
              <text x="85" y="72" font-size="12" font-weight="bold" fill="#3b82f6" text-anchor="middle">משקי בית</text>
              <text x="85" y="88" font-size="9" fill="currentColor" text-anchor="middle">(צרכנים ועובדים)</text>

              <rect x="380" y="45" width="110" height="60" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="2"/>
              <text x="435" y="72" font-size="12" font-weight="bold" fill="#10b981" text-anchor="middle">פירמות</text>
              <text x="435" y="88" font-size="9" fill="currentColor" text-anchor="middle">(יצרנים ועסקים)</text>

              <path d="M 140 55 L 380 55" stroke="#ec4899" stroke-width="2"/>
              <polygon points="375,51 385,55 375,59" fill="#ec4899"/>
              <text x="260" y="48" font-size="10" font-weight="bold" fill="#ec4899" text-anchor="middle">הוצאות צריכה פרטית (C$) ←</text>

              <path d="M 380 95 L 140 95" stroke="#8b5cf6" stroke-width="2"/>
              <polygon points="145,91 135,95 145,99" fill="#8b5cf6"/>
              <text x="260" y="112" font-size="10" font-weight="bold" fill="#8b5cf6" text-anchor="middle">→ שכר, רווחים ותשואות (Y$)</text>

              <circle cx="260" cy="75" r="16" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.5"/>
              <text x="260" y="79" font-size="9" font-weight="bold" fill="#f59e0b" text-anchor="middle">ממשלה</text>
            </svg>
          caption: "מודל הזרימה המעגלית: הוצאות משקי הבית מהוות פדיון לפירמות, אשר מומר בחזרה להכנסות משקי הבית כשכר ודיבידנדים."
        points:
          - "תוצר מקומי גולמי (תמ״ג, GDP) מודד את הערך הכספי הכולל של כל המוצרים והשירותים הסופיים שיוצרו בגבולות המדינה בתקופה נתונה. בגישת ההוצאות: $Y = C + I + G + (X - M)$, כאשר $C$ מייצג צריכה פרטית, $I$ השקעות עסקיות, $G$ הוצאות ממשלה, ו-$(X - M)$ יצוא נטו."
          - "תמ״ג ריאלי מתקן את התמ״ג הנומינלי בהשפעת האינפלציה באמצעות מדד מחירי התוצר, ומבודד בכך את הצמיחה הפיזית האמיתית בנפח הייצור מעליית מחירים מלאכותית."
          - "אינפלציה היא עלייה מתמשכת ברמת המחירים הכללית השוחקת את כוח הקנייה. היא מונעת מלחצי ׳אינפלציית ביקוש׳ (יותר מדי כסף רודף אחרי מעט מדי מוצרים) או מ׳אינפלציית עלויות׳ (זעזועי היצע בלתי צפויים, כגון זינוק במחירי הנפט או שיבושי שרשרת אספקה)."
          - "מחזור העסקים מאופיין בתנודות גליות חוזרות בין תקופות גאות (צמיחת תוצר וירידה באבטלה) לתקופות מיתון (המוגדרות לרוב כשני רבעונים רצופים של צמיחה שלילית בתמ״ג הריאלי המלווים באבטלה גואה)."
      - title: "בנקים מרכזיים, יצירת כסף ובנקאות ברזרבה חלקית"
        points:
          - "לכסף שלושה תפקידים יסודיים: אמצעי חליפין (המבטל את הצורך בסחר חליפין מסורבל), יחידת חישוב (המאפשרת השוואת מחירים סטנדרטית), ומאגר ערך (המשמר כוח קנייה לעתיד)."
          - "בנקאות מסחרית מודרנית פועלת במודל של בנקאות ברזרבה חלקית: הבנקים שומרים רק חלק קטן מכספי הפיקדונות של הציבור כרזרבה נזילה ($R$), ומלווים את היתרה לציבור. תהליך זה מייצר כסף חדש במשק דרך מכפיל הפיקדונות: $M = \\frac{1}{R} \\times \\text{פיקדון מקורי}$."
          - "הבנק המרכזי מנהל את המדיניות המוניטרית: קביעת שער הריבית הבין-בנקאי, שינוי יחס הרזרבה המחייב, וביצוע פעולות בשוק הפתוח (קנייה ומכירה של איגרות חוב ממשלתיות כדי לווסת נזילות)."
          - "תורת הכמות של הכסף מנוסחת במשוואת החליפין: $M \\times V = P \\times Y$, כאשר $M$ הוא היצע הכסף, $V$ מהירות מחזור הכסף, $P$ רמת המחירים, ו-$Y$ התוצר הריאלי. אם מהירות המחזור והתפוקה יציבות, הדפסת כסף מופרזת מתורגמת ישירות לזינוק אינפלציוני."
      - title: "מדיניות פיסקלית, חוב לאומי והמכפיל הקיינסיאני"
        points:
          - "מדיניות פיסקלית עוסקת בהחלטות הממשלה על מיסוי ($T$) והוצאות ציבוריות ($G$) במטרה לנהל את הביקוש המצרפי, כפי שנוסח על ידי הכלכלן הבריטי ג׳ון מיינרד קיינס בעת השפל הגדול."
          - "בעת מיתון חריף, התאוריה הקיינסיאנית ממליצה על מדיניות פיסקלית מרחיבה אנטי-מחזורית: הגדלת השקעות ציבוריות והפחתת מיסים. ההוצאה הממשלתית מתגלגלת במשק דרך המכפיל הפיסקלי: $M = \\frac{1}{1 - MPC}$, כאשר $MPC$ היא הנטייה השולית לצרוך."
          - "מייצבים אוטומטיים (כגון מדרגות מס הכנסה פרוגרסיביות ודמי אבטלה) מרככים זעזועים כלכליים ללא צורך בחקיקה חדשה: בעת האטה הכנסות המדינה ממסים יורדות אוטומטית בעוד תשלומי ההעברה עולים, ומזרימים נזילות מידית למשקי הבית."
          - "אפקט הדחיקה החוצה (Crowding-Out Effect): כאשר הממשלה מגדילה את הגירעון התקציבי ומגייסת הון באג״ח, הדרישה להלוואות מעלה את שער הריבית הריאלי, מה שעלול לדחוק החוצה השקעות עסקיות פרטיות בטכנולוגיה ומכונות."
    trivia:
      - type: multiple_choice
        question: "מהי הנוסחה המאקרו-כלכלית הסטנדרטית לחישוב התוצר המקומי הגולמי (GDP) לפי גישת ההוצאות?"
        options:
          - "Y = C + I + G + (X - M)"
          - "Y = C + S + T"
          - "Y = M × V / P"
          - "Y = P × Q - ATC"
        correct: 0
        explanation: "התמ״ג (Y) מחושב כסכום הצריכה הפרטית (C), ההשקעות הפרטיות (I), הרכש הממשלתי (G) ויצוא נטו (יצוא X פחות יבוא M)."
      - type: multiple_choice
        question: "במה שונה ׳תמ״ג ריאלי׳ מ׳תמ״ג נומינלי׳?"
        options:
          - "תמ״ג ריאלי מנוכה מהשפעות האינפלציה כדי לשקף שינויים פיזיים אמיתיים בכמות התפוקה, בעוד נומינלי מודד מחירים שוטפים"
          - "תמ״ג ריאלי כולל פעילות כלכלית בלתי חוקית בשוק השחור"
          - "תמ״ג ריאלי נמדד אך ורק באונקיות של מטילי זהב טהור"
          - "תמ״ג נומינלי עוקב אחרי רווחי חברות בעוד ריאלי עוקב אחרי שכר עבודה בלבד"
        correct: 0
        explanation: "תמ״ג נומינלי עלול לצמוח רק בגלל שהמחירים התייקרו. תמ״ג ריאלי מודד במחירי שנת בסיס קבועים כדי לאמוד צמיחה פיזית אמיתית."
      - type: multiple_choice
        question: "בבנקאות ברזרבה חלקית, מהו מכפיל הכסף המרבי התאורטי אם יחס הרזרבה שהבנק המרכזי קבע הוא 10% (0.10)?"
        options:
          - "10 (מכפיל = 1 / 0.10)"
          - "1"
          - "100"
          - "0.10"
        correct: 0
        explanation: "מכפיל הפיקדונות מוגדר כ-1 חלקי יחס הרזרבה R. עבור רזרבה של 10%, 1 / 0.10 = 10, כלומר כל שקל של רזרבה חדשה יכול לתמוך בעד 10 שקלים פיקדונות."
      - type: multiple_choice
        question: "איזה כלי מדיניות מרכזי מפעיל הבנק המרכזי כדי להשפיע על עלויות האשראי, הצריכה וההשקעה במשק כולו?"
        options:
          - "קביעת שער הריבית המוניטרי הבין-בנקאי"
          - "קביעת מחירי המזון ברשתות השיווק הקמעונאיות"
          - "אישור תקציב הביטחון השנתי של הממשלה"
          - "גביית מסי הכנסה ישירים ממשקי הבית"
        correct: 0
        explanation: "שער הריבית של הבנק המרכזי מעגן את עלות ההלוואות קצרות הטווח, ומשפיע ישירות על הריביות במשק: משכנתאות, אשראי עסקי ופיקדונות."
      - type: multiple_choice
        question: "איזה קשר קלאסי מתואר במשוואת החליפין של תורת הכמות: M × V = P × Y?"
        options:
          - "היצע הכסף כפול מהירות המחזור שווה לרמת המחירים כפול התוצר הריאלי"
          - "פדיון שולי כפול כמות שווה לרווח כפול תשואה"
          - "בסיס הכסף כפול מהירות שווה לסך החוב הלאומי"
          - "יבוא כפול מהירות שווה ליצוא כפול שער חליפין"
        correct: 0
        explanation: "המשוואה מראה שסך כל התשלומים הכספיים במשק (כמות הכסף כפול מהירות סיבובו) חייב להשתוות לשווי הנומינלי של התוצר המיוצר (מחיר כפול כמות)."
      - type: multiple_choice
        question: "איזה סוג אינפלציה מתפרץ כאשר זעזוע גיאו-פוליטי חריף חותך את אספקת חומרי הגלם ומקפיץ את מחירי הנפט בעולם?"
        options:
          - "אינפלציית היצע (Cost-Push Inflation)"
          - "אינפלציית ביקוש (Demand-Pull Inflation)"
          - "היפר-אינפלציה מוניטרית"
          - "דפלציה מחזורית"
        correct: 0
        explanation: "אינפלציית היצע (דחיפת עלויות) נגרמת מזינוק בעלויות הייצור ותשומות האנרגיה, המסיט את עקומת ההיצע המצרפי שמאלה ומייקר את המחירים."
      - type: multiple_choice
        question: "מהו ׳אפקט הדחיקה החוצה׳ (Crowding-Out Effect) הנובע מגירעונות ממשלתיים כבדים?"
        options:
          - "גיוס חוב ממשלתי מוגבר מעלה את הריבית הריאלית, ומקטין את ההשקעות הפרטיות של עסקים בהתרחבות"
          - "מיסים כבדים מאלצים את האזרחים להחביא מזומנים מתחת לבלטות"
          - "בנקים מסחריים נשארים ללא מקום פיזי לאחסון שטרות כסף"
          - "עומס תיירים בבתי מלון מקפיץ את מחירי הנופש"
        correct: 0
        explanation: "כשהממשלה לווה סכומי עתק בשוק איגרות החוב, היא מתחרה על מקורות המימון, מייקרת את הריבית ודוחקת הצידה חברות שרצו להשקיע בציוד וטכנולוגיה."
      - type: multiple_choice
        question: "אם למשקי בית נטייה שולית לצרוך (MPC) של 0.80, מהו המכפיל הפיסקלי הקיינסיאני הפשוט (1 חלקי 1 פחות MPC)?"
        options:
          - "5.0 (מכפיל = 1 / 0.20)"
          - "1.25"
          - "0.80"
          - "10.0"
        correct: 0
        explanation: "כאשר MPC = 0.80, הנטייה לחסוך היא 0.20. המכפיל הוא 1 / 0.20 = 5, כלומר כל שקל של הוצאה ממשלתית מחולל עד 5 שקלים בסך התוצר המצטבר."
      - type: multiple_choice
        question: "איזה צעד ינקוט לרוב בנק מרכזי כדי להילחם באינפלציה גבוהה ומאיצה בעת גאות כלכלית?"
        options:
          - "העלאת שער הריבית וצמצום היצע הכסף (מדיניות מוניטרית מרסנת)"
          - "הורדת הריבית לאפס והדפסת שטרות כסף נוספים"
          - "הפחתת יחס הרזרבה המחייב עבור בנקים מסחריים"
          - "סבסוד רכישת מניות על ידי מענקים ממשלתיים"
        correct: 0
        explanation: "העלאת ריבית מייקרת הלוואות ומשכנתאות, מתמרצת חיסכון ומצמצמת ביקושים והשקעות, ובכך מקררת את לחצי עליות המחירים."
      - type: multiple_choice
        question: "איזה מצב כלכלי מוגדר כשילוב של צמיחה כלכלית קפואה (מיתון), אבטלה גבוהה ואינפלציה דוהרת בו-זמנית?"
        options:
          - "סטגפלציה (Stagflation)"
          - "היפר-צמיחה"
          - "מלכודת נזילות"
          - "סחרור דפלציוני"
        correct: 0
        explanation: "סטגפלציה משלבת מיתון ואבטלה (סטגנציה) עם אינפלציה מתמשכת, ומציבה דילמה קשה לבנק המרכזי כיוון שריסון האינפלציה עלול להעמיק את האבטלה."
      - type: multiple_choice
        question: "כיצד פועלים ׳מייצבים אוטומטיים׳ בעת מיתון כלכלי ללא צורך בחקיקה חדשה בפרלמנט?"
        options:
          - "הכנסות המדינה ממסים צונחות מעצמן בעוד תשלומי העברה ודמי אבטלה מזנקים אוטומטית, ובכך תומכים בביקוש"
          - "הבנק המרכזי מוחק אוטומטית את כל חובות כרטיסי האשראי של האזרחים"
          - "הריבית במשק ננעלת אוטומטית על מינוס חמישה אחוזים"
          - "פשיטות רגל של תאגידים נאסרות על פי חוק"
        correct: 0
        explanation: "כשמשכורות ורווחים יורדים, תשלומי המס לפי מדרגות פוחתים מיד, ודמי אבטלה מוזרמים אוטומטית לנזקקים, מה שממתן את עוצמת הנפילה הכלכלית."
      - type: multiple_choice
        question: "מהי ׳מלכודת נזילות׳ (Liquidity Trap) במאקרו-כלכלה מוניטרית?"
        options:
          - "מצב שבו הריבית יורדת קרוב לאפס, והזרמת כסף נוסף אינה מצליחה לעודד הוצאות כי הציבור מעדיף לאגור מזומן"
          - "מצב שבו כספומטים בבנקים מושבתים עקב תקלות מחשוב"
          - "איסור ממשלתי גורף על העברות מטבע זר מחוץ לגבולות המדינה"
          - "קריסה פתאומית של יתרות מטבע החוץ בשל שער חליפין קבוע"
        correct: 0
        explanation: "במלכודת נזילות (תופעה קיינסיאנית), הריבית שואפת לאפס והביקוש לכסף הופך לגמיש לחלוטין. הורדות ריבית נוספות אינן מצליחות להמריץ פעילות."
      - type: multiple_choice
        question: "איזה מדד עוקב אחרי השינוי החודשי הממוצע במחירי סל מוצרים ושירותים מייצג הנצרך על ידי משפחה עירונית ממוצעת?"
        options:
          - "מדד המחירים לצרכן (CPI)"
          - "מדד מניות הדאו ג׳ונס"
          - "מדד מנהלי הרכש (PMI)"
          - "מדד ג׳יני לאי-שוויון"
        correct: 0
        explanation: "מדד המחירים לצרכן מודד את השינוי בסל מוצרים קבוע (מזון, דיור, אנרגיה, בריאות) ומשמש כמדד הרשמי המרכזי לבחינת האינפלציה."
      - type: multiple_choice
        question: "מהי המטרה העיקרית של ׳הקלה כמותית׳ (QE) המופעלת על ידי בנקים מרכזיים כאשר הריבית קצרת הטווח תקועה באפס?"
        options:
          - "רכישת איגרות חוב ממשלתיות ארוכות טווח בשווקים כדי להוריד את הריביות ארוכות הטווח ולהרחיב נזילות"
          - "הטלת שטרות כסף ממסוקים מעל ערים מרכזיות"
          - "רכישת עודפי מוצרי צריכה ממחסני חנויות קמעונאיות"
          - "הצמדת שער החליפין של המטבע המקומי למטילי זהב"
        correct: 0
        explanation: "בהקלה כמותית הבנק המרכזי מייצר רזרבות אלקטרוניות ורוכש אג״ח לטווח ארוך, במטרה להוריד את תשואות השוק ולהמריץ מתן אשראי והשקעות."
      - type: multiple_choice
        question: "איזו עקומה מאקרו-כלכלית תיארה היסטורית יחס הפוך בטווח הקצר בין שיעור האבטלה לקצב אינפלציית השכר?"
        options:
          - "עקומת פיליפס (Phillips Curve)"
          - "עקומת לאפר (Laffer Curve)"
          - "עקומת לורנץ (Lorenz Curve)"
          - "עקומת קוזנץ (Kuznets Curve)"
        correct: 0
        explanation: "עקומת פיליפס הצביעה על כך שאבטלה נמוכה מלווה בלחצי שכר ואינפלציה גבוהה יותר בטווח הקצר (אף שהיחס התערער בתקופות סטגפלציה)."

  - id: game_theory_strategic_interactions
    title: "4. תורת המשחקים, שיווי משקל נאש ועיצוב מנגנונים"
    description: >
      שליטה במתמטיקה של קבלת החלטות אסטרטגית: מטריצות תשלומים, אסטרטגיות שולטות,
      שיווי משקל נאש, אינדוקציה לאחור, א-סימטריה במידע ועיצוב מנגנונים כלכליים.
    cards:
      - title: "משחקים סימולטניים, מטריצות תשלומים ודילמת האסיר"
        figure:
          title: "מטריצת התשלומים הקלאסית של דילמת האסיר"
          svg: >
            <svg viewBox="0 0 520 150" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-height:150px;">
              <rect x="140" y="25" width="280" height="100" fill="none" stroke="currentColor" stroke-width="2"/>
              <line x1="140" y1="75" x2="420" y2="75" stroke="currentColor" stroke-width="1.5"/>
              <line x1="280" y1="25" x2="280" y2="125" stroke="currentColor" stroke-width="1.5"/>

              <text x="210" y="18" font-size="11" font-weight="bold" fill="#3b82f6" text-anchor="middle">שחקן ב: שיתוף פעולה</text>
              <text x="350" y="18" font-size="11" font-weight="bold" fill="#ef4444" text-anchor="middle">שחקן ב: בגידה</text>
              <text x="40" y="55" font-size="11" font-weight="bold" fill="#3b82f6">שחקן א: שת״פ</text>
              <text x="40" y="105" font-size="11" font-weight="bold" fill="#ef4444">שחקן א: בגידה</text>

              <text x="210" y="55" font-size="12" font-weight="bold" fill="#10b981" text-anchor="middle">-1, -1 (פארטו)</text>
              <text x="350" y="55" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">-3, 0</text>
              <text x="210" y="105" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">0, -3</text>

              <rect x="282" y="77" width="136" height="46" fill="#ef4444" fill-opacity="0.2"/>
              <text x="350" y="105" font-size="12" font-weight="bold" fill="#ef4444" text-anchor="middle">-2, -2 (שיווי משקל נאש)</text>
            </svg>
          caption: "בדילמת האסיר, ׳בגידה׳ היא אסטרטגיה שלטת לשני השחקנים, המובילה לשיווי משקל נאש נחות (-2, -2) אף ששת״פ הדדי (-1, -1) עדיף לשניהם."
        points:
          - "תורת המשחקים ממדלת מצבים שבהם התוצאה עבור כל משתתף (שחקן) תלויה לא רק בבחירתו האישית, אלא גם בהחלטותיהם האסטרטגיות של שאר השחקנים העצמאיים במערכת."
          - "אסטרטגיה שלטת (Dominant Strategy) היא מהלך המניב לשחקן את התוצאה הטובה ביותר ללא תלות במה שיבחרו יריביו. אם קיימת אסטרטגיה שלטת, שחקן רציונלי יבחר בה תמיד."
          - "שיווי משקל נאש (Nash Equilibrium) הוא מצב שבו לאף שחקן אין תמריץ לסטות באופן חד-צדדי מהאסטרטגיה שבחר, בהינתן האסטרטגיות שנבחרו על ידי שאר השחקנים. ג׳ון נאש הוכיח כי בכל משחק סופי קיים לפחות שיווי משקל אחד (באסטרטגיות טהורות או מעורבות)."
          - "דילמת האסיר ממחישה את הטרגדיה של החלטות רציונליות מבוזרות: לשני החשודים אסטרטגיה שלטת ׳לבגוד׳ ולהודות, מה שמפיל אותם לשיווי משקל נאש עם עונש מאסר כבד ($-2, -2$). שיתוף פעולה הדדי (שתיקה, $-1, -1$) עדיף לשניהם במובן פארטו, אך אינו יציב ללא חוזה אכיפה חיצוני."
      - title: "משחקים סדרתיים, אינדוקציה לאחור ומחויבות"
        points:
          - "בעוד משחקים סימולטניים מוצגים בטבלה, משחקים סדרתיים מתפתחים צעד-אחר-צעד לאורך זמן ומיוצגים באמצעות ׳עצי משחק׳ (צורה רחבה) הכוללים צמתי החלטה, ענפים ותשלומי סיום."
          - "אינדוקציה לאחור (Backward Induction) פותרת משחקים סדרתיים מהסוף להתחלה: מנתחים מה יבחר השחקן האחרון בצמתים הסופיים, גוזמים ענפים נחותים וגוזרים את המהלכים המיטביים של השחקנים הקודמים. שיטה זו מובילה לשיווי משקל נאש תת-משחקי מושלם (SPNE)."
          - "יתרון המוביל הראשון נוצר כאשר התחייבות מוקדמת כופה על המתחרים להתאים את עצמם (כגון בניית מפעל ענק ראשון). יתרון המוביל השני מתרחש כאשר לימוד מטעויות החלוץ וגילוי צורכי השוק חוסכים עלויות פיתוח כבדות (נפוץ מאוד באימוץ טכנולוגיות תוכנה)."
          - "מחויבות אמינה (Credible Commitment): במשא ומתן ובהרתעה, איום או הבטחה אפקטיביים רק אם היריב משוכנע שתבצע אותם ברגע האמת. ׳שריפת הגשרים׳ או אוטומציה של תגובת תגמול הופכות איומים לאמינים על ידי שלילה מודעת של יכולת הנסיגה העצמית."
      - title: "א-סימטריה במידע, בחירה שלילית ותורת המכרזים"
        points:
          - "מודלים קלאסיים מניחים מידע מושלם, אך שווקים אמיתיים מוצפים בא-סימטריה במידע (צד אחד לעסקה יודע עובדות מהותיות שהצד השני אינו יודע)."
          - "בחירה שלילית (Adverse Selection, לפני חתימת חוזה): ג׳ורג׳ אקרלוף הוכיח במאמרו ׳שוק הלימונים׳ שכאשר קונים אינם יכולים להבדיל בין רכב משומש מעולה לגרוטאה (לימון), הם יציעו רק מחיר ממוצע. מוכרי הרכבים המעולים יוצאים מהשוק, ואיכות השוק מתדרדרת בספירלת קריסה עד שנותרות גרוטאות בלבד."
          - "סיכון מוסרי (Moral Hazard, לאחר חתימת חוזה): מתרחש כאשר סוכן מבוטח או מוגן נוטל סיכונים פזיזים יותר כיוון שצד אחר נושא בעלויות הכישלון (כגון נהגים מבוטחים הנוהגים בחוסר זהירות, או בנקים הנוטלים הימורים תחת הבטחת חילוץ ממשלתי)."
          - "תורת המכרזים ועיצוב מנגנונים: הנדסת כללי משחק כך שסוכנים בעלי אינטרס אישי ייאלצו לחשוף מידע אמיתי. במכרז מחיר שני (מכרז ויקרי), הזוכה הוא המציע הגבוה ביותר אך משלם את המחיר של ההצעה השנייה; במנגנון זה, הגשת הצעת המחיר המשקפת את ערכך האמיתי היא אסטרטגיה שלטת."
    trivia:
      - type: multiple_choice
        question: "מהו התנאי המגדיר ׳שיווי משקל נאש׳ (Nash Equilibrium) בתורת המשחקים?"
        options:
          - "מצב שבו אף שחקן אינו יכול לשפר את התוצאה שלו על ידי שינוי חד-צדדי של האסטרטגיה שלו"
          - "מצב שבו כל השחקנים זוכים בתגמול כספי שווה לחלוטין"
          - "מצב שבו סך כל התשלומים של השחקנים מגיע לרווחה מקסימלית לחברה"
          - "מצב שבו כל שחקן נוקט באסטרטגיה אקראית לחלוטין"
        correct: 0
        explanation: "בשיווי משקל נאש, בחירתו של כל שחקן מהווה את התגובה המיטבית לבחירותיהם של שאר השחקנים, כך שלאף אחד אין תמריץ לסטות לבדו."
      - type: multiple_choice
        question: "מדוע שני שחקנים רציונליים בוגדים זה בזה בדילמת האסיר החד-פעמית ומגיעים לתוצאה נחותה?"
        options:
          - "בגידה היא אסטרטגיה שלטת המניבה תוצאה אישית טובה יותר ללא תלות במה שיבחר היריב"
          - "נאסר על השחקנים לתקשר ביניהם טרם המשחק על פי חוק"
          - "הכללים קובעים שמי שבוגד ראשון מקבל את כל הפרס הכספי"
          - "השחקנים מנסים למקסם את הרווחה החברתית הקולקטיבית של שניהם יחד"
        correct: 0
        explanation: "בין אם היריב ישתף פעולה ובין אם יבגוד, השחקן הבודד תמיד יקבל עונש מופחת אם יבגוד, מה שהופך את הבגידה לאסטרטגיה שלטת."
      - type: multiple_choice
        question: "באיזו טכניקה מתמטית משתמשים כדי לפתור עצי משחק סדרתיים על ידי ניתוח מהצמתים הסופיים חזרה להתחלה?"
        options:
          - "אינדוקציה לאחור (Backward Induction)"
          - "רגרסיה ליניארית"
          - "דגימת מונטה קרלו"
          - "מורד הגרדיאנט"
        correct: 0
        explanation: "אינדוקציה לאחור בוחנת מה יבחר השחקן הסופי בסוף העץ, גוזמת ענפים לא כדאיים וחוזרת אחורה כדי לקבוע שיווי משקל תת-משחקי מושלם."
      - type: multiple_choice
        question: "מדוע במכרז ויקרי (מכרז מחיר שני חתום) נקיטת כנות מלאה בהצעה היא אסטרטגיה שלטת?"
        options:
          - "ההצעה קובעת האם תזכה, אך המחיר שתשלם בפועל נקבע לפי ההצעה השנייה ולא לפי הצעתך שלך"
          - "עורך המכרז מעניק מענק כספי קבוע לכל מי שמשתתף במכרז"
          - "כל המשתתפים מחויבים להצהיר על תקציבם המרבי בפומבי"
          - "המוצר מוענק למציע הנמוך ביותר במחיר הגבוה ביותר שהוגש"
        correct: 0
        explanation: "כיוון שאינך משלם את הצעתך אלא את ההצעה השנייה, הגשת הצעה נמוכה מערכך מסכנת הפסד רווחי, והגשת הצעה מנופחת מסכנת זכייה במחיר הפסד."
      - type: multiple_choice
        question: "איזו תופעה כלכלית הדגים ג׳ורג׳ אקרלוף במאמרו זוכה פרס נובל ׳שוק הלימונים׳?"
        options:
          - "א-סימטריה במידע גורמת למוצרים איכותיים לנטוש את השוק, מה שמוביל לבחירה שלילית ולקריסת השוק"
          - "קרטלים של פירות הדר מעלים באופן מלאכותי את מחירי הלימונים"
          - "סוכנויות רכב משומש מרוויחות אפס רווח כלכלי בשיווי משקל תחרותי"
          - "מונופולים מייצרים מוצרים באיכות גבוהה יותר מפירמות תחרותיות"
        correct: 0
        explanation: "חוסר יכולתם של קונים לאמת איכות גורם להם להציע מחיר ממוצע בלבד. בעלי רכבים איכותיים מסרבים למכור במחיר זה ויוצאים, והשוק קורס."
      - type: multiple_choice
        question: "מהו ׳סיכון מוסרי׳ (Moral Hazard) בחוזים כלכליים ובביטוח?"
        options:
          - "סוכן נוטל סיכונים מופרזים לאחר שרכש הגנה כיוון שצד אחר יישא בנטל הפיננסי של כישלון"
          - "קונה המסרב להעביר תשלום לאחר שקיבל את הסחורה לידיו"
          - "צרכן המסרב לרכוש פוליסת ביטוח מטעמי אמונה אישית"
          - "חברת ביטוח הגובה פרמיות מוגדלות מאנשים מבוגרים"
        correct: 0
        explanation: "סיכון מוסרי נובע מכך שהגנה מפני הפסדים משנה את תמריצי הסוכן ומעודדת אותו להתנהג בפזיזות (כמו בנקים גדולים מדי מכדי ליפול)."
      - type: multiple_choice
        question: "מהי המשמעות של תוצאה שהיא ׳יעילה במובן פארטו׳ (Pareto Efficient)?"
        options:
          - "מצב שבו לא ניתן להיטיב עם אדם אחד מבלי להרע את מצבו של אדם אחר לפחות"
          - "מצב שבו כל המשאבים והעושר מחולקים באופן שווה בין כלל השחקנים"
          - "מצב שבו כל שחקן זוכה בתשלום המרבי האפשרי שהיה יכול לחלום עליו"
          - "מצב שבו הממשלה גובה את סך המס הגבוה ביותר האפשרי"
        correct: 0
        explanation: "יעילות פארטו פירושה שכל ההזדמנויות לשיתוף פעולה או לרווחים הדדיים מוצו במלואן, כך שלא ניתן לעזור לאיש בלי לפגוע באחר."
      - type: multiple_choice
        question: "כיצד יכול מנהיג או מנהל להפוך איום אסטרטגי לאמין (Credible) במשחק סדרתי?"
        options:
          - "על ידי כבילת ידיו מראש ושלילת יכולתו שלו עצמו לסגת או להיכנע (כגון ׳שריפת הגשרים׳)"
          - "על ידי שליחת מכתב כוונות מנומס ומפורט"
          - "על ידי שמירה על סודיות מוחלטת של תוכניותיו מפני כל יריב"
          - "על ידי התחייבות להעביר כל סכסוך לבוררות בינלאומית"
        correct: 0
        explanation: "איום אמין רק אם היריב יודע שברגע האמת תיאלץ לבצעו. ביטול אפשרות הנסיגה של עצמך הופך את האיום לוודאי ואמין."
      - type: multiple_choice
        question: "באיזו אסטרטגיה נוקט שחקן הפועל לפי ׳מידה כנגד מידה׳ (Tit-for-Tat) בדילמת האסיר החוזרת ונשנית?"
        options:
          - "פתיחה בשיתוף פעולה בסיבוב הראשון, ולאחר מכן העתקה מדויקת של המהלך שביצע היריב בסיבוב הקודם"
          - "בגידה תמידית בכל סיבוב ללא יוצא מן הכלל"
          - "שיתוף פעולה נאיבי ללא תלות במספר הבגידות של היריב"
          - "הטלת מטבע אקראית בכל תור כדי לקבוע האם לשתף פעולה"
        correct: 0
        explanation: "אסטרטגיית Tit-for-Tat פותחת בשת״פ, מענישה מיד על בגידה, וסולחת מיד כשהיריב חוזר לשתף פעולה, מה שמייצר שת״פ יציב לאורך זמן."
      - type: multiple_choice
        question: "מהו ׳איתות׳ (Signaling) בנוכחות מידע א-סימטרי בשווקים, על פי מודל מייקל ספנס?"
        options:
          - "נקיטת פעולה גלויה ויקרה שקשה לחקותה כדי להוכיח איכות סמויה (כגון השגת תואר אקדמי מפרך)"
          - "שידור פרסומות מסחריות בערוצי טלוויזיה מובילים"
          - "הטלת מכסים על ידי ממשלה לאיתות מורת רוח למדינות זרות"
          - "בקשת תעודת אחריות בכתב לפני רכישת מוצר חשמלי"
        correct: 0
        explanation: "כדי שאיתות יהיה אמין, עליו להיות יקר או קשה יותר לביצוע עבור שחקנים באיכות נמוכה מאשר לשחקנים באיכות גבוהה (כגון תואר יוקרתי)."
      - type: multiple_choice
        question: "מהו ׳משחק סכום אפס׳ (Zero-Sum Game) בתורת המשחקים?"
        options:
          - "משחק שבו רווחו של שחקן אחד שווה במדויק להפסדו של שחקן אחר (סך התשלומים תמיד אפס)"
          - "משחק שבו כל השחקנים מסיימים ללא כל רווח כספי"
          - "שוק שבו כל הפירמות גורפות אפס רווח חשבונאי"
          - "משחק שבו אין שום שיווי משקל נאש אפשרי"
        correct: 0
        explanation: "במשחק סכום אפס (כשחמט, פוקר או כיבוש טריטוריה), לא נוצר ערך חדש; כל נקודה או שקל שאחד גורף מגיעים ישירות על חשבון הפסדו של האחר."
      - type: multiple_choice
        question: "איזו אסטרטגיה כוללת בחירה אקראית מכוונת בין מספר פעולות טהורות על פי התפלגות הסתברות מוגדרת מראש?"
        options:
          - "אסטרטגיה מעורבת (Mixed Strategy)"
          - "אסטרטגיה שלטת"
          - "אסטרטגיית פארטו"
          - "אסטרטגיה קולוסיבית"
        correct: 0
        explanation: "באסטרטגיה מעורבת (כמו בחירת ׳אבן, נייר או מספריים׳ בהסתברות שליש), השחקן מערבב מהלכים כדי למנוע מהיריב לנחש ולנצל דפוס קבוע."
      - type: multiple_choice
        question: "מהו ׳סינון׳ (Screening) בהתמודדות עם מידע א-סימטרי בשווקים?"
        options:
          - "הצד חסר המידע מציע תפריט אפשרויות המאלץ את הצד בעל המידע לבחור ולחשוף בכך את סוגו האמיתי"
          - "פירמה המבצעת בדיקות רקע מקיפות לכל מועמד לעבודה"
          - "ממשלה המסננת תעבורת אינטרנט למניעת הונאות מסחריות"
          - "עורך מכרז הפוסל הצעות מחיר הנמוכות ממחיר רצפה"
        correct: 0
        explanation: "בסינון, הצד הלא מיודע מעצב תפריט (כגון ביטוח עם השתתפות עצמית גבוהה לנהגים זהירים ונמוכה לנהגים מסוכנים) המניע מיון עצמי."
      - type: multiple_choice
        question: "בעיצוב מנגנונים כלכליים, איזה מאפיין מבטיח שמשתתפים לא יוכלו להרוויח באמצעות שיקור או עיוות העדפותיהם האמיתיות?"
        options:
          - "תאימות תמריצים (Incentive Compatibility)"
          - "שיווי משקל מונופוליסטי"
          - "אי-עקביות דינמית"
          - "הערכה שלילית"
        correct: 0
        explanation: "מנגנון הוא תואם תמריצים אם אמירת האמת וחשיפת ההעדפות הכנות מהוות אסטרטגיה שלטת לכל משתתף במערכת."
      - type: multiple_choice
        question: "איזה משחק קלאסי ממדל מרוץ חימוש שבו שני שחקנים דוהרים זה לקראת זה, והסלמה הדדית מובילה לקטסטרופה מוחלטת לשניהם?"
        options:
          - "משחק השפן / נץ-יונה (Chicken / Hawk-Dove)"
          - "מלחמת המינים"
          - "התאמת מטבעות"
          - "דואופול קורנו"
        correct: 0
        explanation: "במשחק השפן, נסיגה נתפסת כפחדנית אך התנגשות חזיתית (שני שחקנים שאינם סוטים) מובילה לאסון הגדול ביותר לשני הצדדים."

  - id: behavioral_economics_public_goods
    title: "5. כלכלה התנהגותית, השפעות חיצוניות ומוצרים ציבוריים"
    description: >
      כשלי שוק מול פסיכולוגיה אנושית אמיתית: השפעות חיצוניות, מסי פיגו מתקנים,
      טרגדיית נחלת הכלל, תורת הערך של כהנמן וטברסקי, שנאת הפסד וארכיטקטורת בחירה (Nudge).
    cards:
      - title: "השפעות חיצוניות, כשלי שוק ופתרונות פיגוביאניים"
        figure:
          title: "השפעה חיצונית שלילית ותיקון באמצעות מס פיגו"
          svg: >
            <svg viewBox="0 0 520 150" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-height:150px;">
              <line x1="60" y1="125" x2="480" y2="125" stroke="currentColor" stroke-width="1.5"/>
              <line x1="60" y1="125" x2="60" y2="15" stroke="currentColor" stroke-width="1.5"/>
              <text x="470" y="140" font-size="10" fill="currentColor" text-anchor="end">כמות (Q) ←</text>
              <text x="35" y="25" font-size="10" fill="currentColor" transform="rotate(-90 35 25)">מחיר/עלות ($) ←</text>

              <line x1="90" y1="30" x2="420" y2="115" stroke="#3b82f6" stroke-width="2.5"/>
              <text x="425" y="115" font-size="10" font-weight="bold" fill="#3b82f6">ביקוש (MSB)</text>

              <line x1="90" y1="110" x2="420" y2="35" stroke="#10b981" stroke-width="2"/>
              <text x="425" y="40" font-size="10" font-weight="bold" fill="#10b981">PMC (היצע פרטי)</text>

              <line x1="90" y1="75" x2="420" y2="10" stroke="#ef4444" stroke-width="2"/>
              <text x="425" y="15" font-size="10" font-weight="bold" fill="#ef4444">SMC (עלות חברתית)</text>

              <polygon points="230,55 290,65 290,40" fill="#ef4444" fill-opacity="0.25"/>
              <text x="295" y="55" font-size="9" fill="#ef4444">נטל עודף</text>
            </svg>
          caption: "השפעה חיצונית שלילית (זיהום) גורמת לייצור יתר בשוק הפרטי. מס פיגו מתקן את העיוות ומתאים את העלות הפרטית לעלות החברתית הכוללת."
        points:
          - "השפעה חיצונית (Externality) מתרחשת כאשר ייצור או צריכה של מוצר מטילים עלות או מעניקים תועלת לצד שלישי שאינו מעורב בעסקה ללא פיצוי כספי. השפעות שליליות (פליטות פחמן, זיהום מים, רעש) יוצרות נזק חברתי; השפעות חיוביות (חיסונים, השכלה, ספריות קוד פתוח) מניבות תועלת חברתית חיצונית."
          - "בנוכחות השפעות שליליות, השוק הפרטי מייצר כמות מופרזת ביחס לכמות האופטימלית לחברה ($Q_{\\text{market}} > Q_{\\text{social}}$) כיוון שפירמות מתעלמות מהנזק החיצוני. בהשפעות חיוביות, השוק הפרטי מייצר בחסר ($Q_{\\text{market}} < Q_{\\text{social}}$)."
          - "מס פיגו (Pigouvian Tax) מטיל היטל על יחידת מוצר מזהמת בגובה הנזק השולי החיצוני, ובכך ׳מפנים׳ את ההשפעה החיצונית ומתאים את התמריצים הפרטיים ליעילות חברתית. באופן דומה, סובסידיות פיגוביאניות מתמרצות השפעות חיוביות."
          - "משפט קוז (Coase Theorem) קובע כי אם זכויות הקניין מוגדרות בבירור ועלויות העסקה הן אפסיות, הצדדים הפרטיים יוכלו לשאת ולתת ביניהם ולהגיע להקצאה יעילה ללא צורך בהתערבות ממשלתית, ללא תלות בזהות הצד שקיבל את הזכות המשפטית במקור."
      - title: "מוצרים ציבוריים, משאבים משותפים וטרגדיית נחלת הכלל"
        points:
          - "מוצרים מסווגים לפי שני ממדים: בלעדיות (Excludability — האם ניתן למנוע ממי שלא שילם לצרוך?) ויריבות (Rivalry — האם צריכת אדם אחד גורעת מהאפשרות של אחרים לצרוך?)."
          - "ארבע קטגוריות מוצרים: (1) מוצרים פרטיים (יריביים ובלעדיים: מחשב נייד, סנדוויץ׳), (2) מוצרי מועדון (בלתי יריביים ובלעדיים: מנוי נטפליקס, כביש אגרה פנוי), (3) משאבים משותפים (יריביים ואינם בלעדיים: דגה באוקיינוס, שטחי מרעה, אשכול מחשוב שיתופי), (4) מוצרים ציבוריים (בלתי יריביים ואינם בלעדיים: ביטחון לאומי, לווייני GPS, משפטים מדעיים בסיסיים)."
          - "בעיית הטרמפיסט (Free-Rider Problem) מונעת משווקים תחרותיים לממן מוצרים ציבוריים: כיוון שלא ניתן למנוע ממשתמשי חינם ליהנות מהמוצר, לכל אדם רציונלי יש תמריץ לתת לאחרים לשלם במקומו, מה שיוצר כשל שוק הדורש מימון באמצעות מיסוי ממשלתי."
          - "טרגדיית נחלת הכלל (אלינור אוסטרום וגארט הרדין) נוצרת במשאבים משותפים: כל פרט גורף 100% מהרווח האישי של ניצול המשאב בעוד עלות הדלדול מתחלקת על כולם, מה שמוביל לכיליון המשאב אלא אם מוסדרים כללי קהילה, מכסות או זכויות סחירות."
      - title: "כלכלה התנהגותית, תורת הערך וארכיטקטורת בחירה (Nudge)"
        points:
          - "הכלכלה הקלאסית ממדלת בני אדם כ-׳הומו אקונומיקוס׳ — סוכנים רציונליים לחלוטין בעלי כוח חישוב אינסופי וכוח רצון מושלם. כלכלה התנהגותית משלבת פסיכולוגיה קוגניטיבית כדי לחשוף את ההטיות השיטתיות שבהן בני אדם סוטים מרציונליות זו."
          - "תורת הערך (Prospect Theory, שפותחה על ידי דניאל כהנמן ועמוס טברסקי) מוכיחה שאנשים שופטים תוצאות כרווחים והפסדים יחסיים לנקודת ייחוס מסוימת ולא כרמות עושר מוחלטות. פונקציית הערך קעורה ברווחים (שנאת סיכון) וקמורה בהפסדים (חיפוש סיכון)."
          - "שנאת הפסד (Loss Aversion): הכאב הפסיכולוגי של הפסד 100 דולר עז בערך פי שניים מעוצמת ההנאה של זכייה ב-100 דולר. תופעה זו מסבירה את ׳אפקט הבעלות׳ (הערכת יתר של חפץ רק כי הוא שייך לך) ואת כשל העלות השקועה."
          - "היוריסטיקות והטיות קוגניטיביות: קיצורי דרך מחשבתיים מייצרים הטיות קבועות: עגינה (הישענות יתר על המספר הראשון שנזרק במשא ומתן), זמינות (הערכת יתר של סכנות בולטות רגשית כהתרסקות מטוס), והיוון היפרבולי (העדפת יתר קיצונית של סיפוק מיידי על פני תועלת עתידית)."
          - "תורת הדחיפה (Nudge Theory, ריצ׳רד תיילר וקאס סאנסטיין): שינוי ארכיטקטורת הבחירה מבלי לחסום חלופות ומבלי לשנות תמריצים כלכליים (כגון הפיכת הצטרפות לחיסכון פנסיוני לברירת מחדל אוטומטית שניתן לבטלה), מנתבת אנשים לקבלת החלטות המיטיבות עימם."
    trivia:
      - type: multiple_choice
        question: "מהם שני המאפיינים הכלכליים המגדירים ׳מוצר ציבורי טהור׳ (כגון ביטחון לאומי או מערכת לווייני GPS)?"
        options:
          - "היעדר בלעדיות (לא ניתן למנוע שימוש) והיעדר יריבות (שימוש של אדם אחד אינו גורע מאחרים)"
          - "בלעדיות מלאה ויריבות בצריכה"
          - "מימון על ידי קרנות הון סיכון פרטיות והגנה בפטנט"
          - "מכירה בלעדית דרך פלטפורמות מכרזים מקוונות"
        correct: 0
        explanation: "מוצר ציבורי הוא בלתי-בלעדי (אי אפשר לחסום משתמשים שלא שילמו) ובלתי-יריבי (צריכתו על ידי אזרח אחד אינה מונעת מאחרים ליהנות ממנו)."
      - type: multiple_choice
        question: "מהי ׳בעיית הטרמפיסט׳ (Free-Rider Problem) הגורמת לשווקים פרטיים לספק מוצרים ציבוריים בחסר?"
        options:
          - "אנשים נהנים ממוצרים בלתי-בלעדיים מבלי לשלם עליהם, מתוך ציפייה שאחרים יישאו בעלויות"
          - "נוסעים המתפלחים לרכבות תחתיות ללא רכישת כרטיס נסיעה"
          - "מתכנתים המשתמשים בקוד פתוח ללא מתן קרדיט ליוצר"
          - "מפעלים המזרימים שפכים תעשייתיים לנחלים ציבוריים ללא תשלום"
        correct: 0
        explanation: "במוצרים שאי אפשר למנוע את הגישה אליהם, לאנשים יש תמריץ רציונלי ׳לתפוס טרמפ׳ על כספי אחרים, מה שמכשיל מימון וולונטרי בשוק החופשי."
      - type: multiple_choice
        question: "לפי תורת הערך של כהנמן וטברסקי, מהי ׳שנאת הפסד׳ (Loss Aversion)?"
        options:
          - "הכאב הפסיכולוגי מהפסד סכום כספי עז בערך פי שניים מעוצמת ההנאה של זכייה באותו סכום בדיוק"
          - "משקיעים מעדיפים תמיד להחזיק במניות טכנולוגיה ספקולטיביות ותנודתיות"
          - "צרכנים מסרבים לקנות פוליסות ביטוח הכוללות דמי השתתפות עצמית"
          - "מנהלים בכירים מאשרים אך ורק פרויקטים עם תשואה חיובית מובטחת"
        correct: 0
        explanation: "שנאת הפסד מראה שפסיכולוגית, הפסדים צורבים הרבה יותר מרווחים מקבילים (מקדם שנאת הפסד של כ-2), מה שמעוות התנהגות מול סיכונים."
      - type: multiple_choice
        question: "מהו ׳מס פיגו׳ (Pigouvian Tax)?"
        options:
          - "היטל מתקן המוטל על פעילות שוק המייצרת השפעות חיצוניות שליליות כדי ליישר את העלות הפרטית עם העלות החברתית"
          - "מס הכנסה מיוחד המוטל על משקיעי נדל״ן אמידים"
          - "מכס אוניברסלי המוטל על כלל מוצרי האלקטרוניקה המיובאים"
          - "קנס המוטל על חברות שאינן עומדות ביעדי גיוון תעסוקתי"
        correct: 0
        explanation: "מס פיגו (כמו מס פחמן) מאלץ גורמים מזהמים לשלם על הנזק החיצוני שהם גורמים לחברה, ובכך מחזיר את השוק להקצאה יעילה."
      - type: multiple_choice
        question: "על פי משפט קוז (Coase Theorem), איזה תנאי מאפשר לצדדים פרטיים להגיע להסדר יעיל להשפעה חיצונית ללא התערבות ממשלתית?"
        options:
          - "זכויות הקניין מוגדרות בבירור ועלויות העסקה במשא ומתן אפסיות או זניחות"
          - "הממשלה קובעת מחיר מקסימום נוקשה בחוק"
          - "הענף כולו פועל במבנה של מונופול טבעי טהור"
          - "כל העסקים המעורבים נמצאים בבעלות מלאה של המדינה"
        correct: 0
        explanation: "רונלד קוז הוכיח שאם זכויות הקניין מוגדרות ועלויות המשא ומתן אפסיות, הצדדים יגיעו לפשרה יעילה כלכלית בכוחות עצמם."
      - type: multiple_choice
        question: "איזו בעיה כלכלית מתארת את הכיליון והדלדול של משאבים משותפים יריביים שאינם בלעדיים (כגון דגה באוקיינוסים או שדות מרעה פתוחים)?"
        options:
          - "טרגדיית נחלת הכלל (Tragedy of the Commons)"
          - "נטל עודף של מונופול"
          - "פרדוקס ובלן למוצרי יוקרה"
          - "מלכודת נזילות"
        correct: 0
        explanation: "טרגדיית נחלת הכלל מתרחשת כאשר כל פרט מרוויח ישירות מניצול יתר של משאב משותף אך עלות הדלדול נופלת על כלל הציבור."
      - type: multiple_choice
        question: "מהו ׳אפקט הבעלות׳ (Endowment Effect) שנחקר בכלכלה התנהגותית?"
        options:
          - "אנשים מעריכים חפץ בשווי כספי גבוה בהרבה רק משום שהוא כבר בבעלותם ביחס לסכום שהיו מוכנים לשלם כדי לקנותו"
          - "קרנות גידור אוניברסיטאיות מנצחות באופן עקבי את מדדי המניות הפסיביים"
          - "יורשי הון משפחתי נוטים לעבוד פחות שעות שבועיות"
          - "צרכנים מוציאים כספי זכייה בהימורים מהר יותר ממשכורת עבודה"
        correct: 0
        explanation: "אפקט הבעלות (הנובע משנאת הפסד) גורם לאדם לדרוש מחיר מכירה גבוה בהרבה על חפץ שברשותו לעומת המחיר שהיה מוכן לשלם כדי לרוכשו."
      - type: multiple_choice
        question: "מהי דוגמה מובהקת ל-׳דחיפה קלה׳ (Nudge) בארכיטקטורת בחירה, לפי תיילר וסאנסטיין?"
        options:
          - "הפיכת הצטרפות לתוכנית פנסיה לברירת מחדל אוטומטית שניתן לבטלה בכל עת"
          - "חקיקת חוק פדרלי המטיל עונשי מאסר על אזרחים שאינם חוסכים"
          - "הטלת מס בשיעור 100% על משקאות ממותקים"
          - "איסור מסחרי גורף על מכירת נורות להט בכל רחבי המדינה"
        correct: 0
        explanation: "׳נאדג׳׳ משנה את עיצוב הבחירה (כמו קביעת ברירת מחדל מיטיבה) כדי לכוון להחלטה בריאה יותר מבלי לשלול חופש בחירה או לשנות תמריצים כלכליים."
      - type: multiple_choice
        question: "איזו הטיה קוגניטיבית מתארת את הנטייה האנושית להישען יתר על המידה על הנתון המספרי הראשון שנשמע בעת הערכת שווי?"
        options:
          - "הטיית העגינה (Anchoring Bias)"
          - "הטיית האישור (Confirmation Bias)"
          - "היוריסטיקת הזמינות"
          - "הטיית החוכמה בדיעבד"
        correct: 0
        explanation: "הטיית עגינה גורמת למספר ראשוני (אפילו אקראי לחלוטין) להשפיע באופן בלתי פרופורציונלי על הערכות שווי ומשאים ומתנים עוקבים."
      - type: multiple_choice
        question: "כיצד ׳היוון היפרבולי׳ (הטיית ההווה) מסביר מדוע אנשים מתקשים להתמיד בדיאטה או לחסוך לפנסיה?"
        options:
          - "אנשים מעניקים משקל יתר לא פרופורציונלי לסיפוק והנאה בהווה המיידי על פני תועלות גדולות בהרבה בעתיד הרחוק"
          - "בני אדם אינם מסוגלים לחשב ריבית דריבית באופן מעריכי"
          - "כספי עתיד נשחקים באופן קיצוני על ידי שערי חליפין רשמיים"
          - "צרכנים פועלים באופק זמן אינסופי של שושלות נצחיות"
        correct: 0
        explanation: "הטיית ההווה גורמת לנו להעדיף פיתויים מיידיים (שוקולד, בזבוז) על פני תוכניות עתידיות רציונליות (בריאות, פרישה בכבוד)."
      - type: multiple_choice
        question: "איזה מהמוצרים הבאים מוגדר כ-׳מוצר מועדון׳ (Club Good)?"
        options:
          - "שירות הזרמת סרטים מקוון (בלעדי באמצעות סיסמה, אך בלתי יריבי בצריכה)"
          - "דגי ים פראיים השוחים במים בינלאומיים"
          - "משולש פיצה שנרכש במזנון המקומי"
          - "מערכת הגנה לאומית מפני טילים"
        correct: 0
        explanation: "מוצר מועדון הוא בלעדי (ניתן לחסום גישה למי שלא שילם מנוי) אך בלתי יריבי (צפייה של מנוי אחד בסרט אינה פוגעת באיכות הצפייה של אחר)."
      - type: multiple_choice
        question: "מדוע השפעה חיצונית חיובית (כגון חיסון למחלות מידבקות או מחקר מדעי בסיסי) מובילה לייצור בחסר בשוק החופשי?"
        options:
          - "התועלת השולית הפרטית של הרוכש הבודד נמוכה מהתועלת החברתית הכוללת שמופקת לכלל הציבור"
          - "פטנטים מונעים לחלוטין מצרכנים לרכוש תרופות"
          - "העלות השולית של ייצור חיסונים מזנקת לאינסוף"
          - "היצרנים גורפים רווחי עתק מונופוליסטיים המבריחים את כל הקונים"
        correct: 0
        explanation: "כיוון שהצרכן הבודד משלם את מלוא המחיר אך החברה כולה נהנית מההגנה החיסונית (MSB > MPB), הביקוש בשוק החופשי נמוך מהרמה הרצויה חברתית."
      - type: multiple_choice
        question: "איזו היוריסטיקה קוגניטיבית גורמת לאנשים להפריז דרמטית בהערכת הסיכון של התקפת כריש או תאונת מטוס לאחר צפייה בחדשות סנסציוניות?"
        options:
          - "היוריסטיקת הזמינות (Availability Heuristic)"
          - "כשל המהמר"
          - "הטיית היציגות"
          - "הטיית הסטטוס קוו"
        correct: 0
        explanation: "היוריסטיקת הזמינות גורמת למוח לאמוד שכיחות או סכנה על סמך הקלות שבה דוגמאות חיות ודרמטיות צצות בזיכרון."
      - type: multiple_choice
        question: "מה הוכיחה חוקרת מדעי המדינה אלינור אוסטרום על ניהול משאבים משותפים, הישג שזיכה אותה בפרס נובל בכלכלה?"
        options:
          - "קהילות מקומיות מסוגלות לנהל בהצלחה משאבים משותפים דרך מוסדות וכללים קהילתיים ללא צורך בהפרטה או בשליטה ממשלתית כפויה"
          - "כל המשאבים המשותפים חייבים לעבור הפרטה מיידית ולהימכר לתאגידים"
          - "תכנון ריכוזי ממשלתי הוא הדרך היחידה למנוע כיליון משאבי דגה"
          - "למשאבים משותפים אין שום ערך כלכלי בשווקים הפיננסיים המודרניים"
        correct: 0
        explanation: "אוסטרום הוכיחה במחקר שדה עשיר שקהילות מפתחות הסדרים קהילתיים מתוחכמים המונעים את טרגדיית נחלת הכלל ללא התערבות כוחנית מלמעלה."
      - type: multiple_choice
        question: "איזו תופעה התנהגותית מסבירה מדוע מהמר שהפסיד חמש פעמים רצופות בהטלת מטבע בטוח שניצחון ׳מגיע לו׳ בהטלה הבאה?"
        options:
          - "כשל המהמר (Gambler's Fallacy)"
          - "הטיית האישור"
          - "כשל העלות השקועה"
          - "הטיית הבעלות"
        correct: 0
        explanation: "כשל המהמר הוא האמונה המוטעית שאירועים אקראיים בלתי תלויים חייבים ׳לתקן את עצמם׳ כדי להתאזן במדגם קצר."
