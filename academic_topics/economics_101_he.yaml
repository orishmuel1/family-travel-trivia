              <circle cx="340" cy="85" r="5" fill="#10b981"/>
              <text x="355" y="82" font-size="10" font-weight="bold" fill="#10b981">נקודה B (יעילה)</text>

              <circle cx="180" cy="95" r="5" fill="#f59e0b"/>
