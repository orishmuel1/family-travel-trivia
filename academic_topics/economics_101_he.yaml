id: economics_101_he
type: academic
icon: "📊"
title: "כלכלה ותורת ההחלטות למהנדסים (כלכלה 101)"
description: >
  מסע יסודי ומעמיק מתוך עקרונות ראשוניים: מיקרו-כלכלה, מנגנוני היצע וביקוש, מבנה עלויות,
  מאקרו-כלכלה ומערכות כספיות, תורת המשחקים האסטרטגית וכלכלה התנהגותית למהנדסים והוגים אנליטיים.
lang: he
audience: family
categories:
  - id: scarcity_markets_supply_demand
    title: "1. מחסור, עלות אלטרנטיבית ומנגנון ההיצע והביקוש"
    description: >
      הבנת עקרונות היסוד של הקצאת משאבים: עלות אלטרנטיבית, תועלת שולית פוחתת,
      גילוי מחירים דרך שיווי משקל בין היצע לביקוש, וגמישות מחירים.
    cards:
      - title: "מחסור, עלות אלטרנטיבית ועקומת התמורה"
        figure:
          title: "עקומת התמורה (PPF)"
          svg: >
