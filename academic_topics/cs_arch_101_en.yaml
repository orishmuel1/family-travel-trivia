id: cs_arch_101_en
type: academic
icon: 💻
title: Computer Architecture & Operating Systems (CS Arch 101)
description: A comprehensive, first-principles guide for software engineers exploring how silicon transistors
  execute instructions, how caches beat the memory wall, and how operating system kernels manage memory,
  processes, and concurrency.
lang: en
audience: family
categories:
- id: cpu_pipeline_execution
  title: 1. CPU Architecture & The Instruction Pipeline
  description: 'From silicon clock pulses to machine code execution: understanding the 5-stage RISC pipeline,
    branch prediction, and how processors maximize Instructions Per Cycle (IPC).'
  cards:
  - title: The Von Neumann Architecture & The Instruction Cycle
    figure:
      title: Classic 5-Stage CPU Instruction Pipeline
      svg: "<svg viewBox=\"0 0 520 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-height:140px;\"\
        >\n  <rect x=\"10\" y=\"40\" width=\"90\" height=\"55\" rx=\"8\" fill=\"#3b82f6\" fill-opacity=\"\
        0.15\" stroke=\"#3b82f6\" stroke-width=\"2\"/>\n  <text x=\"55\" y=\"65\" font-size=\"12\" font-weight=\"\
        bold\" fill=\"#3b82f6\" text-anchor=\"middle\">IF</text>\n  <text x=\"55\" y=\"82\" font-size=\"\
        9\" fill=\"currentColor\" opacity=\"0.8\" text-anchor=\"middle\">Instruction Fetch</text>\n\n\
        \  <path d=\"M 100 67 L 115 67\" stroke=\"#3b82f6\" stroke-width=\"2\" marker-end=\"url(#arr)\"\
        />\n\n  <rect x=\"115\" y=\"40\" width=\"90\" height=\"55\" rx=\"8\" fill=\"#6366f1\" fill-opacity=\"\
        0.15\" stroke=\"#6366f1\" stroke-width=\"2\"/>\n  <text x=\"160\" y=\"65\" font-size=\"12\" font-weight=\"\
        bold\" fill=\"#6366f1\" text-anchor=\"middle\">ID</text>\n  <text x=\"160\" y=\"82\" font-size=\"\
        9\" fill=\"currentColor\" opacity=\"0.8\" text-anchor=\"middle\">Decode / Reg</text>\n\n  <path\
        \ d=\"M 205 67 L 220 67\" stroke=\"#6366f1\" stroke-width=\"2\"/>\n\n  <rect x=\"220\" y=\"40\"\
        \ width=\"90\" height=\"55\" rx=\"8\" fill=\"#8b5cf6\" fill-opacity=\"0.15\" stroke=\"#8b5cf6\"\
        \ stroke-width=\"2\"/>\n  <text x=\"265\" y=\"65\" font-size=\"12\" font-weight=\"bold\" fill=\"\
        #8b5cf6\" text-anchor=\"middle\">EX</text>\n  <text x=\"265\" y=\"82\" font-size=\"9\" fill=\"\
        currentColor\" opacity=\"0.8\" text-anchor=\"middle\">Execute (ALU)</text>\n\n  <path d=\"M 310\
        \ 67 L 325 67\" stroke=\"#8b5cf6\" stroke-width=\"2\"/>\n\n  <rect x=\"325\" y=\"40\" width=\"\
        90\" height=\"55\" rx=\"8\" fill=\"#ec4899\" fill-opacity=\"0.15\" stroke=\"#ec4899\" stroke-width=\"\
        2\"/>\n  <text x=\"370\" y=\"65\" font-size=\"12\" font-weight=\"bold\" fill=\"#ec4899\" text-anchor=\"\
        middle\">MEM</text>\n  <text x=\"370\" y=\"82\" font-size=\"9\" fill=\"currentColor\" opacity=\"\
        0.8\" text-anchor=\"middle\">Memory Access</text>\n\n  <path d=\"M 415 67 L 430 67\" stroke=\"\
        #ec4899\" stroke-width=\"2\"/>\n\n  <rect x=\"430\" y=\"40\" width=\"80\" height=\"55\" rx=\"\
        8\" fill=\"#10b981\" fill-opacity=\"0.15\" stroke=\"#10b981\" stroke-width=\"2\"/>\n  <text x=\"\
        470\" y=\"65\" font-size=\"12\" font-weight=\"bold\" fill=\"#10b981\" text-anchor=\"middle\">WB</text>\n\
        \  <text x=\"470\" y=\"82\" font-size=\"9\" fill=\"currentColor\" opacity=\"0.8\" text-anchor=\"\
        middle\">Write Back</text>\n</svg>"
      caption: In a 5-stage RISC pipeline, up to 5 distinct instructions are processed simultaneously
        in different hardware stages during every clock cycle.
    points:
    - 'Every modern computer follows the Von Neumann architecture: a Central Processing Unit (CPU) connected
      to a unified memory holding both program instructions and application data.'
    - The CPU contains high-speed internal storage locations called Registers (such as the Program Counter
      %rip/%pc, Stack Pointer %rsp, and general-purpose registers like %rax, %rbx).
    - 'To execute code, the CPU continuously loops through the Instruction Cycle: (1) Fetch the next instruction
      byte from memory pointed to by the Program Counter, (2) Decode the binary opcode into control signals,
      (3) Execute the arithmetic/logic operation in the ALU, (4) Access data memory if reading/writing
      RAM, and (5) Write the result back to a register.'
    - 'Instead of waiting 5 whole clock cycles for one instruction to finish before starting the next,
      hardware engineers invented Instruction Pipelining — like an automotive assembly line. While instruction
      #1 is in the Writeback stage, instruction #2 is in Memory, #3 in Execute, #4 in Decode, and #5 in
      Fetch, achieving an ideal throughput of 1 instruction completed per cycle (IPC = 1.0).'
  - title: Pipeline Hazards & Branch Prediction
    points:
    - A pipeline runs at peak efficiency only when instructions flow smoothly without interruptions. When
      an instruction cannot execute on the next clock cycle, a Pipeline Hazard occurs, forcing the CPU
      to insert 'bubbles' (idle stall cycles).
    - Data Hazards occur when an instruction needs the output of a preceding instruction that has not
      yet finished its writeback stage. Hardware uses 'Data Forwarding' (bypassing the register file and
      routing the ALU output wire directly to the next ALU input) to resolve most data dependencies without
      stalling.
    - Control Hazards occur whenever the CPU encounters a conditional jump or branch (`if / else`, loops,
      function calls). Because the condition is calculated in the Execute stage, the CPU does not know
      which instruction to fetch next for several clock cycles.
    - 'To prevent devastating pipeline stalls, modern CPUs use sophisticated Branch Predictors: branch
      history tables and neural predictors guess whether a branch will be taken with over 95% accuracy.
      If the prediction is correct, execution continues at full speed; if mispredicted, the entire speculative
      pipeline must be flushed (discarded), costing 15–20 wasted clock cycles.'
  - title: Superscalar, Out-of-Order (OoO) & Speculative Execution
    points:
    - 'Modern high-performance processors (like Intel Core, AMD Zen, and Apple M-series) are Superscalar:
      they contain multiple parallel execution units (multiple ALUs, vector units, load/store units) and
      can dispatch 4 to 8 instructions per clock cycle (IPC > 1).'
    - 'Programs are written in sequential order, but if instruction #2 is waiting for data from main memory,
      waiting sequentially would freeze the entire processor. Out-of-Order (OoO) execution dynamically
      analyzes the instruction stream, identifies independent instructions later in the code (e.g., instruction
      #5 and #6), and executes them immediately on idle ALUs.'
    - To maintain strict correctness, the CPU uses Register Renaming (mapping architectural registers
      to a larger pool of physical registers to eliminate false dependencies) and a Reorder Buffer (ROB).
      The ROB holds speculative results and commits them in exact program order only when all prior instructions
      have successfully retired.
  trivia:
  - type: multiple_choice
    question: What is the primary purpose of instruction pipelining in a modern CPU?
    options:
    - To execute multiple instructions concurrently across staggered hardware stages to increase throughput
    - To decrease the physical clock cycle duration of the silicon oscillator
    - To eliminate the need for an internal register file
    - To convert machine code into high-level programming languages
    correct: 0
    explanation: 'Instruction pipelining functions like a factory assembly line: by staggering the fetch,
      decode, execute, memory, and writeback stages, multiple instructions execute concurrently, aiming
      for 1 completed instruction per clock cycle.'
  - type: multiple_choice
    question: What happens when a modern CPU's branch predictor incorrectly guesses the path of an 'if-else'
      condition?
    options:
    - The pipeline must be flushed, discarding all speculatively executed instructions and wasting 15–20
      cycles
    - The operating system immediately triggers a kernel panic
    - The CPU permanently halts execution until an external interrupt arrives
    - The ALU reverses its physical clock polarity to undo the arithmetic
    correct: 0
    explanation: When a branch misprediction occurs, the speculative work in flight is invalid; the CPU
      must flush the pipeline, reset the program counter to the true branch target, and restart fetching,
      costing a penalty of ~15–20 cycles.
  - type: multiple_choice
    question: Which component in an Out-of-Order (OoO) CPU ensures that instructions commit their results
      in the original program order?
    options:
    - Reorder Buffer (ROB)
    - Arithmetic Logic Unit (ALU)
    - Translation Lookaside Buffer (TLB)
    - Direct Memory Access Controller (DMA)
    correct: 0
    explanation: The Reorder Buffer (ROB) tracks instructions executed out of order and ensures their
      architectural register updates and memory writes commit strictly in original program sequence.
  - type: multiple_choice
    question: Which hardware optimization allows the ALU output of one instruction to be fed directly
      to the ALU input of the next instruction without waiting for register writeback?
    options:
    - Data Forwarding (Bypassing)
    - Virtual Paging
    - Context Switching
    - Bus Mastering
    correct: 0
    explanation: Data Forwarding (or bypassing) wires the output of the execution stage directly to the
      input multiplexers of the next stage, preventing pipeline stalls from register read-after-write
      delays.
  - type: multiple_choice
    question: What does a 'Superscalar' CPU architecture enable?
    options:
    - Dispatching and completing multiple instructions per single clock cycle across multiple execution
      units
    - Running code without an operating system kernel
    - Multiplying the physical RAM size through software compression
    - Executing analog signals directly without digital binary encoding
    correct: 0
    explanation: A Superscalar CPU contains duplicate execution pipelines and execution units (multiple
      ALUs, FPUs), allowing it to fetch, decode, and execute several instructions simultaneously in a
      single clock cycle.
  - type: multiple_choice
    question: What is the function of the Program Counter (PC / RIP) register?
    options:
    - Holding the memory address of the next instruction to be fetched and executed
    - Storing the return value of the most recently called function
    - Counting the total number of hardware clock pulses since boot
    - Managing the encryption keys for Secure Boot
    correct: 0
    explanation: The Program Counter (PC) holds the memory address of the next instruction the CPU will
      fetch from memory for decoding and execution.
  - type: multiple_choice
    question: Why do engineers use 'Register Renaming' in modern superscalar processors?
    options:
    - To eliminate false data dependencies (Write-After-Read and Write-After-Write) by mapping to a larger
      physical register pool
    - To translate variable names from C++ to machine code strings
    - To decrease the electrical voltage consumed by static RAM cells
    - To allow user-mode software to overwrite kernel control registers
    correct: 0
    explanation: Register renaming dynamically maps a small set of architectural registers (e.g. 16 registers
      in x86-64) to a larger internal physical pool (e.g. 180+ registers), removing false WAR and WAW
      hazards.
  - type: multiple_choice
    question: In the classic 5-stage RISC pipeline, what operation occurs during the 'ID' stage?
    options:
    - Instruction Decode and reading operand values from the Register File
    - Writing calculation results into L3 cache memory
    - Fetching instruction bytes from the L1 instruction cache
    - Performing 64-bit floating-point division
    correct: 0
    explanation: During the Instruction Decode (ID) stage, the CPU decodes the binary opcode bits to determine
      the operation type and reads the source registers from the register file.
  - type: multiple_choice
    question: What is a 'Structural Hazard' in a CPU pipeline?
    options:
    - When two concurrent instructions attempt to access the same physical hardware resource simultaneously
    - When an instruction references an unallocated memory address
    - When thermal limits cause the silicon clock frequency to throttle down
    - When an operating system driver crashes due to a null pointer
    correct: 0
    explanation: A Structural Hazard occurs when the hardware cannot support all possible combinations
      of instructions in the pipeline simultaneously (e.g. only one memory port shared between instruction
      fetch and data read).
  - type: multiple_choice
    question: How does dynamic branch prediction differ from static branch prediction?
    options:
    - Dynamic prediction uses runtime execution history to predict branches, whereas static uses fixed
      heuristics (like backward branches taken)
    - Dynamic prediction requires code to be recompiled while running
    - Dynamic prediction only works on floating-point arithmetic instructions
    - Static prediction is performed exclusively by the operating system kernel scheduler
    correct: 0
    explanation: Static prediction relies on fixed rules (e.g. backward loop branches predicted taken),
      whereas dynamic branch prediction maintains runtime history tables in hardware to adapt to actual
      program behavior.
  - type: multiple_choice
    question: What metric represents the average number of machine instructions a CPU completes in one
      clock cycle?
    options:
    - Instructions Per Cycle (IPC)
    - Clock Jitter Ratio (CJR)
    - Thermal Design Power (TDP)
    - Cache Miss Penalty (CMP)
    correct: 0
    explanation: IPC (Instructions Per Cycle) measures CPU throughput efficiency; modern superscalar out-of-order
      processors regularly achieve IPC values between 2.0 and 4.0 on optimized workloads.
  - type: multiple_choice
    question: Which condition describes a 'Read-After-Write' (RAW) data dependency?
    options:
    - An instruction requires an input operand produced by an earlier instruction that has not yet completed
    - An instruction writes to memory before the operating system boots
    - Two threads write to the same cache line simultaneously without locks
    - A peripheral device reads DMA memory while the CPU is powered down
    correct: 0
    explanation: A RAW dependency is a true data dependency where instruction J reads a register modified
      by instruction I; J cannot proceed until I's result is available.
  - type: multiple_choice
    question: What is the primary role of the Arithmetic Logic Unit (ALU)?
    options:
    - Performing fundamental integer arithmetic (addition, subtraction) and bitwise logical operations
      (AND, OR, XOR)
    - Translating virtual addresses to physical RAM addresses
    - Managing the clock signal distribution across the motherboard
    - Scheduling software threads across multiple CPU cores
    correct: 0
    explanation: The ALU is the core computational circuit of the processor that carries out fundamental
      integer math, bitwise manipulations, and comparisons.
  - type: multiple_choice
    question: What is the 'Von Neumann Bottleneck'?
    options:
    - The throughput limitation caused by sharing a single physical bus between CPU instruction fetching
      and data transfers
    - The electrical resistance generated by copper interconnects at high temperatures
    - The inability of RISC CPUs to execute variable-length instructions
    - The latency delay introduced by operating system context switches
    correct: 0
    explanation: The Von Neumann bottleneck refers to the throughput limit caused because data and instructions
      share the same bus between memory and the CPU, restricting execution speed to bus bandwidth.
  - type: multiple_choice
    question: In computer architecture, what does 'Speculative Execution' mean?
    options:
    - Executing instructions along a predicted path before knowing with certainty whether that path will
      actually be taken
    - Overclocking the processor voltage to speculate on maximum silicon stability
    - Running untrusted user code inside a sandboxed virtual machine
    - Compressing machine code in main memory before execution
    correct: 0
    explanation: Speculative execution is the technique where a CPU guesses the direction of a branch
      and executes ahead along that path; if the guess was correct, latency is hidden, and if wrong, the
      results are discarded.
- id: memory_hierarchy_caching
  title: 2. Memory Hierarchy & Cache Coherence
  description: 'Beating the ''Memory Wall'': understanding L1/L2/L3 caches, spatial and temporal locality,
    cache line associativity, and multi-core cache coherence (MESI).'
  cards:
  - title: The Memory Wall & The Memory Hierarchy Pyramid
    figure:
      title: 'The Latency Gap: CPU Registers to Main Memory'
      svg: "<svg viewBox=\"0 0 520 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-height:150px;\"\
        >\n  <!-- Pyramid Levels -->\n  <polygon points=\"260,10 320,40 200,40\" fill=\"#ef4444\" fill-opacity=\"\
        0.2\" stroke=\"#ef4444\" stroke-width=\"1.5\"/>\n  <text x=\"260\" y=\"32\" font-size=\"10\" font-weight=\"\
        bold\" fill=\"#ef4444\" text-anchor=\"middle\">Registers (&lt;1ns)</text>\n\n  <polygon points=\"\
        200,42 320,42 360,72 160,72\" fill=\"#f59e0b\" fill-opacity=\"0.2\" stroke=\"#f59e0b\" stroke-width=\"\
        1.5\"/>\n  <text x=\"260\" y=\"62\" font-size=\"10\" font-weight=\"bold\" fill=\"#f59e0b\" text-anchor=\"\
        middle\">L1 / L2 Cache (1–4ns)</text>\n\n  <polygon points=\"160,74 360,74 400,104 120,104\" fill=\"\
        #3b82f6\" fill-opacity=\"0.2\" stroke=\"#3b82f6\" stroke-width=\"1.5\"/>\n  <text x=\"260\" y=\"\
        94\" font-size=\"10\" font-weight=\"bold\" fill=\"#3b82f6\" text-anchor=\"middle\">L3 Shared Cache\
        \ (10–20ns)</text>\n\n  <polygon points=\"120,106 400,106 450,136 70,136\" fill=\"#10b981\" fill-opacity=\"\
        0.2\" stroke=\"#10b981\" stroke-width=\"1.5\"/>\n  <text x=\"260\" y=\"126\" font-size=\"10\"\
        \ font-weight=\"bold\" fill=\"#10b981\" text-anchor=\"middle\">Main RAM (DRAM, 50–100ns)</text>\n\
        </svg>"
      caption: Smaller, faster static SRAM caches (L1/L2/L3) sit directly on the CPU die to shield the
        fast core from the ~100-cycle latency of main DRAM.
    points:
    - In 1980, CPU clock speeds and memory access speeds were roughly balanced. Over the next four decades,
      CPU processing power exploded exponentially, while Dynamic RAM (DRAM) access latency improved very
      slowly. This vast speed disparity is known as the 'Memory Wall'.
    - A modern CPU executes instructions in ~0.3 nanoseconds (a fraction of a clock cycle), but fetching
      a value from main DDR RAM takes 50 to 80 nanoseconds — an eternity of 200+ wasted clock cycles where
      the CPU core sits completely stalled.
    - 'To solve this, hardware engineers organize memory into a Hierarchy based on SRAM (Static RAM):
      fast, expensive, tiny caches built directly onto the silicon die right next to the execution units.'
    - L1 Cache is private to each core, split into L1-Instruction and L1-Data (typically 32–64 KB, ~1ns
      access latency). L2 Cache is larger (512 KB–1 MB per core, ~3–4ns). L3 Cache is shared across all
      cores on the chip (16–64+ MB, ~10–15ns), backed up by system DRAM.
  - title: Locality of Reference & Cache Lines
    points:
    - 'Caches work because of the fundamental Principle of Locality: computer programs do not access memory
      randomly; they exhibit two powerful behavioral patterns.'
    - 'Temporal Locality: If a memory location was accessed once, it is extremely likely to be accessed
      again soon (e.g. loop counter variables, accumulator sums, frequently called functions).'
    - 'Spatial Locality: If a memory location is accessed, memory locations with nearby addresses are
      extremely likely to be accessed soon (e.g. sequential array elements, adjacent struct fields, sequential
      instruction bytes).'
    - Because of spatial locality, the CPU never transfers a single byte from RAM. It always fetches a
      contiguous chunk called a Cache Line (universally 64 bytes in modern x86 and ARM architectures).
      Iterating sequentially over a contiguous array gets 1 cache miss followed by 15 cache hits for 4-byte
      integers!
  - title: Cache Associativity, False Sharing & MESI Coherence
    points:
    - Caches are organized into Sets and Lines. In a Direct-Mapped cache, each memory address maps to
      exactly one cache slot (high collision rate). Modern CPUs use Set-Associative Caches (e.g. 8-way
      or 16-way associative), allowing any memory address to reside in any of $N$ slots in its assigned
      set, drastically reducing thrashing.
    - 'When multiple CPU cores have private L1/L2 caches holding copies of the same RAM address, writes
      by one core must be synchronized. The MESI Protocol maintains hardware cache coherence across cores
      using four states: Modified (dirty, only in this cache), Exclusive (clean, only in this cache),
      Shared (clean, present in multiple caches), and Invalid (stale data).'
    - False Sharing occurs when two threads running on different cores modify independent variables that
      happen to sit within the SAME 64-byte cache line. The hardware MESI protocol repeatedly invalidates
      and bounces the cache line between cores over the interconnect bus, causing severe performance degradation.
  trivia:
  - type: multiple_choice
    question: What is the typical size of a standard CPU cache line in modern x86 and ARM processors?
    options:
    - 64 bytes
    - 4 kilobytes
    - 8 bits
    - 1 megabyte
    correct: 0
    explanation: Virtually all modern x86-64 and ARM processors utilize a 64-byte cache line as the fundamental
      atomic unit of data transfer between main memory and caches.
  - type: multiple_choice
    question: Which principle describes the phenomenon where accessing one array element makes accessing
      adjacent elements much faster?
    options:
    - Spatial Locality
    - Temporal Locality
    - Virtual Translation
    - Instruction Level Parallelism
    correct: 0
    explanation: Spatial Locality states that data physically near recently accessed memory is likely
      to be accessed soon; because the CPU loads an entire 64-byte cache line, adjacent elements are already
      present in L1 cache.
  - type: multiple_choice
    question: What is 'False Sharing' in multi-threaded programming?
    options:
    - When independent variables accessed by different threads reside on the same 64-byte cache line,
      causing constant cache invalidations
    - When two processes try to bind to the same TCP port number
    - When virtual memory pages share the same physical RAM frame across users
    - When a thread unlocks a mutex owned by another thread
    correct: 0
    explanation: False sharing happens when threads on separate cores write to distinct variables that
      happen to occupy the same 64-byte cache line, triggering the MESI protocol to bounce the cache line
      between cores.
  - type: multiple_choice
    question: In the MESI cache coherence protocol, what does the 'M' (Modified) state signify?
    options:
    - The cache line is present only in the current cache, is dirty (modified), and differs from main
      memory
    - The cache line is shared in read-only mode by all cores
    - The cache line has been marked for deletion by the garbage collector
    - The cache line is mapped to virtual memory swap space
    correct: 0
    explanation: In MESI, 'Modified' indicates the cache line exists only in the local cache, has been
      written to by the local CPU core, and must be written back to main memory before eviction or sharing.
  - type: multiple_choice
    question: What is the primary trade-off between Static RAM (SRAM) used in caches and Dynamic RAM (DRAM)
      used in main memory?
    options:
    - SRAM is extremely fast (~1ns) but expensive and area-heavy (6 transistors/bit); DRAM is slower (~60ns)
      but dense and cheap (1 transistor + capacitor/bit)
    - SRAM requires periodic electrical refresh cycles, whereas DRAM retains data indefinitely without
      power
    - SRAM can only store read-only executable instructions, whereas DRAM stores read-write data
    - SRAM connects via PCIe bus, while DRAM connects directly to the ALU
    correct: 0
    explanation: SRAM uses a 6-transistor flip-flop circuit for instant, high-speed access without refresh
      cycles (ideal for on-die L1/L2/L3 caches), whereas DRAM uses a single transistor and tiny capacitor
      for massive storage density at lower speeds.
  - type: multiple_choice
    question: What is an 'N-way Set-Associative' cache?
    options:
    - A cache architecture where any given memory address can be placed in any of N specific cache line
      slots within its assigned set
    - A cache that simultaneously connects to N separate CPU motherboards
    - A cache that compresses data by a factor of N using hardware gzip
    - A cache that divides each 64-byte line into N sub-byte nibbles
    correct: 0
    explanation: An N-way set-associative cache splits the cache into sets of N lines each; a memory address
      hashes to a specific set and can occupy any of the N slots in that set, balancing hit latency and
      collision rates.
  - type: multiple_choice
    question: Why does traversing a 2D matrix row-by-row execute drastically faster in C/C++ than column-by-column?
    options:
    - Row-major layout stores elements of a row in contiguous memory, maximizing spatial locality and
      cache line hits
    - Column traversal disables the CPU instruction pipeline
    - Row traversal uses floating-point hardware instead of integer ALUs
    - The compiler converts column traversal into recursive function calls
    correct: 0
    explanation: C/C++ matrices use row-major memory order; iterating row-by-row accesses adjacent bytes
      in sequence (spatial locality), while column-by-column jumps across memory strides larger than 64
      bytes, causing a cache miss on almost every access.
  - type: multiple_choice
    question: What is the difference between a 'Write-Through' cache and a 'Write-Back' cache?
    options:
    - Write-Through immediately writes updates to lower memory levels; Write-Back updates only the cache
      and writes to memory when evicted
    - Write-Through only caches reads; Write-Back only caches writes
    - Write-Through is used exclusively in GPU video memory
    - Write-Back bypasses the CPU cache hierarchy entirely
    correct: 0
    explanation: Write-through updates both the cache and underlying main memory simultaneously on every
      write; write-back updates only the cache line (marking it dirty) and postpones writing to main RAM
      until the line is evicted.
  - type: multiple_choice
    question: What is the term for the historical divergence between fast CPU clock improvements and sluggish
      DRAM access latency?
    options:
    - The Memory Wall
    - Moore's Law Collapse
    - Amdahl's Limit
    - The Pipelining Penalty
    correct: 0
    explanation: The 'Memory Wall' describes the increasing gap between processing speed and DRAM access
      latency, making caching and memory hierarchy design the primary determinants of system performance.
  - type: multiple_choice
    question: What happens when a CPU experiences a 'Cache Miss'?
    options:
    - The CPU must stall execution while fetching the missing 64-byte block from a higher-level cache
      or main DRAM
    - The operating system terminates the process with a segmentation fault
    - The CPU flushes its entire hard drive cache to physical flash sectors
    - The BIOS restarts the motherboard power distribution unit
    correct: 0
    explanation: On a cache miss, the requested data is not present in that cache level; the processor
      must issue a request to the next cache level or main RAM, suffering a latency delay before resuming
      execution.
  - type: multiple_choice
    question: In the MESI protocol, what state is assigned to a cache line if another core writes to that
      memory location?
    options:
    - Invalid (I)
    - Shared (S)
    - Exclusive (E)
    - Modified (M)
    correct: 0
    explanation: When another core performs a bus write broadcast to a shared line, all other cores holding
      that line must transition their local copy to 'Invalid' (I) so they don't read stale data.
  - type: multiple_choice
    question: Which cache replacement policy evicts the line that has not been accessed for the longest
      period of time?
    options:
    - Least Recently Used (LRU)
    - First-In, First-Out (FIFO)
    - Random Replacement (RR)
    - Most Frequently Used (MFU)
    correct: 0
    explanation: The Least Recently Used (LRU) policy tracks access recency and evicts the cache line
      whose last access occurred furthest in the past, exploiting temporal locality.
  - type: multiple_choice
    question: What is a 'Hardware Prefetcher' in a CPU memory controller?
    options:
    - A hardware unit that detects sequential memory access patterns and speculatively loads future cache
      lines before they are requested
    - A tool that pre-compiles source code into binary executables at system boot
    - A voltage regulator that pre-charges DRAM capacitors before cold reboots
    - A software background daemon that defragments physical hard disks
    correct: 0
    explanation: Hardware prefetchers analyze address streams; when they detect constant strides (e.g.
      iterating over an array), they proactively fetch upcoming cache lines from DRAM into L2/L1 to hide
      memory latency.
  - type: multiple_choice
    question: What is the key advantage of an 'Inclusive Cache' hierarchy (e.g. L3 inclusive of L1/L2)?
    options:
    - Checking if another core has a cached line can be done by probing only the shared L3 cache, without
      disturbing private L1/L2 caches
    - It doubles the effective storage capacity of the silicon die
    - It eliminates the need for cache tags and index bits
    - It allows L1 caches to store infinite lines without eviction
    correct: 0
    explanation: In an inclusive hierarchy, everything in L1 and L2 is guaranteed to also exist in L3;
      hardware can perform snoop checks across cores by inspecting only the L3 tags, saving interconnect
      traffic.
  - type: multiple_choice
    question: Which level of the CPU cache hierarchy is typically shared among all processor cores on
      a multi-core silicon die?
    options:
    - L3 Cache (Last Level Cache / LLC)
    - L1 Instruction Cache
    - L1 Data Cache
    - CPU Register File
    correct: 0
    explanation: While L1 and L2 caches are dedicated private hardware for individual cores, the L3 cache
      (Last-Level Cache) is unified and shared across all cores on the processor chip.
- id: virtual_memory_paging
  title: 3. Virtual Memory, Paging & The MMU
  description: How operating systems provide memory isolation, address translation via page tables, Translation
    Lookaside Buffers (TLB), page faults, and demand paging.
  cards:
  - title: Why Virtual Memory? Isolation & The Illusion of Infinite RAM
    figure:
      title: Virtual-to-Physical Address Translation Flow
      svg: "<svg viewBox=\"0 0 520 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-height:140px;\"\
        >\n  <!-- Virtual Address -->\n  <rect x=\"20\" y=\"45\" width=\"130\" height=\"50\" rx=\"8\"\
        \ fill=\"#3b82f6\" fill-opacity=\"0.15\" stroke=\"#3b82f6\" stroke-width=\"2\"/>\n  <text x=\"\
        85\" y=\"67\" font-size=\"11\" font-weight=\"bold\" fill=\"#3b82f6\" text-anchor=\"middle\">Virtual\
        \ Address</text>\n  <text x=\"85\" y=\"83\" font-size=\"9\" fill=\"currentColor\" opacity=\"0.8\"\
        \ text-anchor=\"middle\">VPN + Page Offset</text>\n\n  <path d=\"M 150 70 L 195 70\" stroke=\"\
        #3b82f6\" stroke-width=\"2\"/>\n\n  <!-- MMU / TLB -->\n  <rect x=\"195\" y=\"35\" width=\"130\"\
        \ height=\"70\" rx=\"8\" fill=\"#8b5cf6\" fill-opacity=\"0.15\" stroke=\"#8b5cf6\" stroke-width=\"\
        2\"/>\n  <text x=\"260\" y=\"60\" font-size=\"12\" font-weight=\"bold\" fill=\"#8b5cf6\" text-anchor=\"\
        middle\">MMU / TLB</text>\n  <text x=\"260\" y=\"78\" font-size=\"9\" fill=\"currentColor\" opacity=\"\
        0.8\" text-anchor=\"middle\">Fast Hardware Lookup</text>\n  <text x=\"260\" y=\"92\" font-size=\"\
        9\" fill=\"#10b981\" text-anchor=\"middle\">Page Table Translation</text>\n\n  <path d=\"M 325\
        \ 70 L 370 70\" stroke=\"#10b981\" stroke-width=\"2\"/>\n\n  <!-- Physical RAM -->\n  <rect x=\"\
        370\" y=\"45\" width=\"130\" height=\"50\" rx=\"8\" fill=\"#10b981\" fill-opacity=\"0.15\" stroke=\"\
        #10b981\" stroke-width=\"2\"/>\n  <text x=\"435\" y=\"67\" font-size=\"11\" font-weight=\"bold\"\
        \ fill=\"#10b981\" text-anchor=\"middle\">Physical RAM</text>\n  <text x=\"435\" y=\"83\" font-size=\"\
        9\" fill=\"currentColor\" opacity=\"0.8\" text-anchor=\"middle\">PPN Frame + Offset</text>\n</svg>"
      caption: The Memory Management Unit (MMU) uses page tables and the high-speed TLB cache to dynamically
        translate virtual addresses into physical RAM frames.
    points:
    - 'In early computing, programs ran directly on physical memory: if program A overwrote memory address
      `0x1000`, it could corrupt program B or crash the operating system. Furthermore, total memory was
      strictly limited to physical RAM chips.'
    - Virtual Memory solves this by giving every single process its own private, isolated virtual address
      space (e.g. 128 TB in 64-bit x86-64). A process believes it owns all of memory from address `0x0000000000000000`
      to `0x7FFFFFFFFFFF`.
    - Memory is divided into fixed-size blocks called Pages (typically 4 KB, or 2 MB / 1 GB for HugePages).
      Physical RAM is divided into matching Page Frames.
    - The operating system maintains a Page Table for each process. When a program reads address `0x401000`,
      the hardware Memory Management Unit (MMU) consults the page table to translate the Virtual Page
      Number (VPN) into a Physical Frame Number (PFN).
  - title: The Translation Lookaside Buffer (TLB) & Multi-Level Page Tables
    points:
    - In a 64-bit architecture, a single flat page table mapping every possible 4KB page would consume
      millions of gigabytes of RAM. Modern operating systems use 4-Level (or 5-Level) Hierarchical Page
      Tables (PML4 -> PDPT -> PD -> PT in x86-64), creating sub-tables only for memory regions the process
      actually allocates.
    - Walking a 4-level page table tree requires 4 separate memory lookups just to translate ONE pointer
      address — which would slow down every memory access by 400%!
    - To make translation instantaneous, the CPU contains a specialized, ultra-fast hardware associative
      cache called the Translation Lookaside Buffer (TLB). The TLB caches recently translated VPN -> PFN
      mappings.
    - A TLB Hit resolves the physical address in less than 1 clock cycle (~0.5ns). A TLB Miss forces the
      MMU hardware page-table walker to traverse RAM tables, costing 30–50ns.
  - title: Page Faults, Demand Paging & Memory Protection
    points:
    - 'Each Page Table Entry (PTE) contains metadata permission and status bits: Present (valid in RAM),
      Read/Write, User/Supervisor (Ring 3 vs Ring 0), and NX (No-Execute / XD bit for security against
      buffer overflows).'
    - 'If a process accesses an address whose Present bit is 0, the MMU hardware triggers a CPU interrupt
      called a Page Fault (Exception #14 in x86). The CPU immediately pauses user code and switches to
      the OS kernel page fault handler.'
    - 'Demand Paging: If the page exists on disk swap or is a memory-mapped file (`mmap`), the OS allocates
      a physical RAM frame, loads the 4KB data from storage via DMA, sets Present = 1, and resumes the
      user process seamlessly.'
    - 'Segmentation Fault: If the process attempted an illegal operation (writing to read-only code, accessing
      an unmapped address, or executing data memory), the OS delivers a `SIGSEGV` signal, terminating
      the offending program.'
  trivia:
  - type: multiple_choice
    question: What is the standard base page size in modern x86-64 and ARM operating systems?
    options:
    - 4 Kilobytes (4096 bytes)
    - 64 bytes
    - 1 Megabyte
    - 512 bytes
    correct: 0
    explanation: 4 KB (4,096 bytes) is the standard base page size for virtual memory allocation, page
      tables, and physical frame management in modern architectures.
  - type: multiple_choice
    question: What is the primary role of the Translation Lookaside Buffer (TLB)?
    options:
    - To cache virtual-to-physical address translations in hardware to avoid multi-level page table walks
      in RAM
    - To translate high-level Python bytecode into machine instructions
    - To buffer network packets before transmitting them to the NIC
    - To hold backup copies of CPU registers during power outages
    correct: 0
    explanation: The TLB is a high-speed associative hardware cache in the CPU that stores recent virtual-to-physical
      page translations, enabling single-cycle memory address resolution.
  - type: multiple_choice
    question: What hardware event occurs when a process attempts to access a virtual memory page that
      is currently not loaded into physical RAM?
    options:
    - A Page Fault exception is raised, transferring control to the OS kernel handler
    - The CPU reboots the motherboard immediately
    - The ALU returns a random 64-bit integer without error
    - The hard disk triggers an out-of-memory kernel panic
    correct: 0
    explanation: When the Present bit in the Page Table Entry is 0, the MMU fires a Page Fault interrupt;
      the OS kernel handler then loads the page from disk into RAM (demand paging) and resumes execution.
  - type: multiple_choice
    question: Which security feature marks memory regions (like the Stack and Heap) as non-executable
      to prevent malicious code injection attacks?
    options:
    - The NX (No-Execute) / XD (Execute Disable) bit
    - The Dirty bit
    - The Access Timestamp counter
    - The Parity Check register
    correct: 0
    explanation: The NX/XD bit in the page table entry allows the OS to designate data pages (stack, heap)
      as non-executable; attempting to jump to and execute code there triggers an immediate hardware fault.
  - type: multiple_choice
    question: Why do modern 64-bit operating systems use Multi-Level Page Tables instead of a single flat
      table?
    options:
    - To save vast amounts of RAM by allocating page table structures only for virtual address regions
      actually in use
    - To make memory address translations run 10x faster than a flat array
    - To eliminate the need for physical DRAM chips
    - To allow 32-bit CPUs to execute 64-bit instructions
    correct: 0
    explanation: A flat 64-bit page table would require terabytes of RAM per process; multi-level hierarchical
      trees allocate lower-level page tables on-demand only for populated virtual address spaces.
  - type: multiple_choice
    question: What is 'Demand Paging' in an operating system?
    options:
    - A strategy where pages are brought into physical RAM only when the running program actually attempts
      to access them
    - Loading the entire executable binary and all shared libraries into RAM at initial launch
    - Requiring user software to manually issue RAM allocation syscalls for every byte
    - Compressing idle virtual memory pages onto flash storage
    correct: 0
    explanation: Demand paging defers loading memory from disk into physical RAM until the exact moment
      a process touches that page, triggering a page fault that loads the requested 4KB block.
  - type: multiple_choice
    question: What is the purpose of 'HugePages' (e.g. 2 MB or 1 GB page sizes) in high-performance databases
      and virtualization?
    options:
    - To drastically reduce the number of TLB entries required, improving TLB hit rates for massive datasets
    - To increase the clock speed of the memory bus
    - To enable 128-bit integer arithmetic in user space
    - To encrypt physical DRAM against cold-boot physical attacks
    correct: 0
    explanation: Using 2MB or 1GB HugePages allows a single TLB entry to cover thousands of times more
      memory, preventing TLB thrashing in memory-intensive workloads like databases and virtual machines.
  - type: multiple_choice
    question: What happens during a 'TLB Shootdown' in a multi-core operating system?
    options:
    - An inter-processor interrupt (IPI) forces other CPU cores to invalidate stale translations in their
      local TLBs when page mappings change
    - The CPU powers down idle cores to reduce thermal throttling
    - The memory controller clears all physical RAM contents
    - A user process is killed for exceeding memory quotas
    correct: 0
    explanation: When one core alters a shared page mapping (e.g. unmapping or reallocating memory), it
      must send Inter-Processor Interrupts (IPIs) to all other cores running that process to flush their
      local TLB entries.
  - type: multiple_choice
    question: Which CPU register in the x86-64 architecture holds the physical base address of the current
      process's top-level page table (PML4)?
    options:
    - CR3 Control Register
    - RSP Stack Pointer
    - EFLAGS Status Register
    - RIP Instruction Pointer
    correct: 0
    explanation: The CR3 control register points to the root physical address of the active process's
      page table directory; updating CR3 during a context switch instantly activates that process's virtual
      address space.
  - type: multiple_choice
    question: What is Address Space Layout Randomization (ASLR)?
    options:
    - A security technique that randomizes the memory locations of the stack, heap, and libraries to hinder
      buffer overflow exploits
    - A hardware algorithm that spreads cache lines across memory banks
    - A file system format that randomizes disk block storage
    - An OS scheduler that randomly assigns threads to CPU cores
    correct: 0
    explanation: ASLR randomizes the base addresses of the stack, heap, and loaded shared libraries every
      time a program executes, preventing attackers from predicting target function addresses in memory.
  - type: multiple_choice
    question: What does a 'Segmentation Fault' (SIGSEGV) indicate to a software developer?
    options:
    - The program attempted an unauthorized virtual memory access (e.g. dereferencing a null/invalid pointer
      or writing to read-only memory)
    - The physical RAM module has suffered a hardware transistor failure
    - The CPU clock multiplier was adjusted during a mathematical calculation
    - The hard disk storage capacity has reached 100% full
    correct: 0
    explanation: A segmentation fault occurs when the hardware MMU catches a process attempting to access
      an unmapped virtual address or violate permissions (such as writing to a read-only code page).
  - type: multiple_choice
    question: What is 'Memory Thrashing' in an operating system?
    options:
    - When physical RAM is overcommitted, causing the OS to spend more time swapping pages to/from disk
      than executing useful code
    - When two threads simultaneously acquire the same spinlock
    - When the CPU cache lines become corrupt due to thermal radiation
    - When a file system runs out of free inode entries
    correct: 0
    explanation: Thrashing occurs when active working sets exceed physical RAM; the OS continuously evicts
      and reads pages from swap storage, causing system throughput to collapse.
  - type: multiple_choice
    question: In virtual memory, what is the role of the 'Dirty Bit' in a Page Table Entry?
    options:
    - It indicates whether the page has been written to since being loaded into physical RAM
    - It indicates whether the page contains a security virus
    - It tells the CPU that the page is stored on an optical DVD drive
    - It forces the page to be deleted when the thread exits
    correct: 0
    explanation: The MMU hardware automatically sets the Dirty bit to 1 whenever a write operation occurs
      on that page; the OS checks this bit when evicting a page to know if it must be written back to
      disk.
  - type: multiple_choice
    question: What is the 'Working Set' of a process?
    options:
    - The collection of virtual memory pages that the process actively references during a given time
      window
    - The total count of open file descriptors owned by the process
    - The set of CPU cores assigned to execute the process threads
    - The list of shared libraries compiled into the executable
    correct: 0
    explanation: The working set is the set of memory pages actively used by a process at a specific time;
      if physical RAM cannot hold the working sets of running processes, thrashing begins.
  - type: multiple_choice
    question: How does 'Copy-on-Write' (COW) optimize the `fork()` system call in Unix-like operating
      systems?
    options:
    - Parent and child share the same physical RAM pages read-only; duplicate pages are allocated only
      when one process writes to memory
    - The OS copies the entire physical RAM footprint of the parent immediately to new memory frames
    - The child process runs inside the parent's CPU registers without memory allocation
    - The disk controller writes the parent memory state directly to flash swap
    correct: 0
    explanation: Instead of duplicating megabytes or gigabytes of RAM during `fork()`, COW marks all pages
      read-only and shared; physical duplication occurs on-demand only for pages that are modified.
- id: processes_threads_concurrency
  title: 4. OS Concurrency, Scheduling & Synchronization
  description: Understanding process address spaces, kernel vs user space (Ring 0 vs Ring 3), context
    switches, race conditions, mutexes, spinlocks, futexes, and atomic operations.
  cards:
  - title: Processes vs. Threads & Context Switching
    figure:
      title: Process Memory Layout vs Multi-Threading
      svg: "<svg viewBox=\"0 0 520 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-height:150px;\"\
        >\n  <!-- Process Box -->\n  <rect x=\"20\" y=\"20\" width=\"220\" height=\"115\" rx=\"8\" fill=\"\
        #3b82f6\" fill-opacity=\"0.1\" stroke=\"#3b82f6\" stroke-width=\"2\"/>\n  <text x=\"130\" y=\"\
        40\" font-size=\"11\" font-weight=\"bold\" fill=\"#3b82f6\" text-anchor=\"middle\">Process Address\
        \ Space</text>\n  <rect x=\"35\" y=\"55\" width=\"85\" height=\"30\" rx=\"4\" fill=\"#3b82f6\"\
        \ fill-opacity=\"0.2\"/>\n  <text x=\"77\" y=\"74\" font-size=\"9\" fill=\"currentColor\" text-anchor=\"\
        middle\">Code &amp; Global</text>\n  <rect x=\"135\" y=\"55\" width=\"85\" height=\"30\" rx=\"\
        4\" fill=\"#10b981\" fill-opacity=\"0.2\"/>\n  <text x=\"177\" y=\"74\" font-size=\"9\" fill=\"\
        currentColor\" text-anchor=\"middle\">Shared Heap</text>\n  <rect x=\"35\" y=\"95\" width=\"185\"\
        \ height=\"28\" rx=\"4\" fill=\"#ec4899\" fill-opacity=\"0.15\"/>\n  <text x=\"127\" y=\"113\"\
        \ font-size=\"9\" fill=\"#ec4899\" text-anchor=\"middle\">Open Files / Descriptors</text>\n\n\
        \  <!-- Threads -->\n  <rect x=\"275\" y=\"20\" width=\"225\" height=\"115\" rx=\"8\" fill=\"\
        #8b5cf6\" fill-opacity=\"0.1\" stroke=\"#8b5cf6\" stroke-width=\"2\"/>\n  <text x=\"387\" y=\"\
        40\" font-size=\"11\" font-weight=\"bold\" fill=\"#8b5cf6\" text-anchor=\"middle\">Threads (Execution\
        \ Units)</text>\n  <rect x=\"290\" y=\"55\" width=\"95\" height=\"68\" rx=\"4\" fill=\"#8b5cf6\"\
        \ fill-opacity=\"0.2\"/>\n  <text x=\"337\" y=\"75\" font-size=\"10\" font-weight=\"bold\" fill=\"\
        #8b5cf6\" text-anchor=\"middle\">Thread 1</text>\n  <text x=\"337\" y=\"92\" font-size=\"8\" fill=\"\
        currentColor\" opacity=\"0.8\" text-anchor=\"middle\">Stack &amp; %rsp</text>\n  <text x=\"337\"\
        \ y=\"106\" font-size=\"8\" fill=\"currentColor\" opacity=\"0.8\" text-anchor=\"middle\">CPU Registers</text>\n\
        \n  <rect x=\"395\" y=\"55\" width=\"95\" height=\"68\" rx=\"4\" fill=\"#8b5cf6\" fill-opacity=\"\
        0.2\"/>\n  <text x=\"442\" y=\"75\" font-size=\"10\" font-weight=\"bold\" fill=\"#8b5cf6\" text-anchor=\"\
        middle\">Thread 2</text>\n  <text x=\"442\" y=\"92\" font-size=\"8\" fill=\"currentColor\" opacity=\"\
        0.8\" text-anchor=\"middle\">Stack &amp; %rsp</text>\n  <text x=\"442\" y=\"106\" font-size=\"\
        8\" fill=\"currentColor\" opacity=\"0.8\" text-anchor=\"middle\">CPU Registers</text>\n</svg>"
      caption: A Process owns an isolated virtual memory space (code, heap, file descriptors); Threads
        within the process share that memory but own private execution stacks and registers.
    points:
    - A Process is an instance of a running computer program, owning an isolated virtual address space,
      heap memory, open file descriptors, and security tokens. The OS manages this via the Process Control
      Block (PCB).
    - A Thread is the smallest unit of execution scheduled by the OS kernel. Multiple threads within the
      same process share the same virtual address space and heap, but each thread owns its own private
      Call Stack, Stack Pointer (%rsp), and CPU Register context.
    - A Context Switch occurs when the OS scheduler pauses one thread/process and switches the CPU core
      to execute another. The kernel saves all active CPU registers into the thread's control block, switches
      the stack pointer, and loads the new thread's registers.
    - Switching between processes is significantly more expensive than switching between threads because
      process switching requires writing the new page table base address into the CR3 register, which
      invalidates non-global TLB entries and triggers cache miss cascades.
  - title: Kernel Mode vs. User Mode (Ring 0 vs. Ring 3) & System Calls
    points:
    - 'CPUs enforce hardware-level privilege rings: Ring 0 (Kernel Mode) has unrestricted access to physical
      hardware, control registers, and memory; Ring 3 (User Mode) runs application software with restricted
      instructions to prevent crashes.'
    - User software cannot access disk, network cards, or allocate physical RAM directly. Whenever an
      application needs hardware services (e.g. `open()`, `read()`, `write()`, `socket()`), it executes
      a System Call (`syscall` instruction in x86-64).
    - The `syscall` instruction causes a controlled hardware transition from Ring 3 to Ring 0, saving
      the user instruction pointer (%rcx) and status flags (%r11), and jumping to the kernel system call
      entry point defined in a Model-Specific Register (MSR).
  - title: Race Conditions, Mutexes, Spinlocks, Futexes & Atomic Operations
    points:
    - 'When multiple threads read and modify shared heap memory simultaneously without synchronization,
      non-deterministic Race Conditions occur (e.g. `counter++` is actually 3 distinct assembly steps:
      read from RAM, increment in register, write to RAM).'
    - Atomic Operations (like `Compare-And-Swap` / CAS or `test-and-set`) are executed as single, indivisible
      hardware memory bus transactions (`LOCK CMPXCHG` on x86), forming the fundamental building block
      for all lock-free algorithms.
    - A Spinlock actively loops in a tight CPU cycle check until a lock becomes available; it is ideal
      for very short kernel critical sections but wastes 100% of a CPU core if held for long periods.
    - 'A Mutex puts waiting threads to sleep so other tasks can use the CPU. Modern Linux mutexes are
      built on Futexes (Fast Userspace Mutexes): uncontended lock acquisition takes place entirely in
      user space in ~5ns via atomic CAS; the kernel syscall is invoked only when lock contention requires
      putting a thread to sleep.'
  trivia:
  - type: multiple_choice
    question: What memory resource is uniquely private to each thread within a multi-threaded process?
    options:
    - The execution Call Stack and CPU register context
    - The dynamic Heap allocation pool
    - The Global variable memory segment
    - The process File Descriptor table
    correct: 0
    explanation: Threads share their parent process's virtual address space, heap, and open file descriptors,
      but each thread has its own private call stack and CPU register state.
  - type: multiple_choice
    question: Why is a process context switch significantly more expensive than a thread context switch
      within the same process?
    options:
    - A process context switch requires changing the CR3 page table pointer, which invalidates TLB entries
      and causes memory cache misses
    - A process switch requires rebooting the network interface card
    - Thread switches must always be validated by physical cryptographic hardware chips
    - A process switch copies all heap data to the physical hard drive
    correct: 0
    explanation: Switching processes switches virtual address spaces (reloading the CR3 register), invalidating
      non-global TLB entries and causing subsequent memory access cache misses.
  - type: multiple_choice
    question: What mechanism enables a user-space application (Ring 3) to request services from the operating
      system kernel (Ring 0)?
    options:
    - System Call (syscall instruction)
    - Direct Memory Access (DMA) channel request
    - Floating-point rounding interrupt
    - Modifying the BIOS clock counter
    correct: 0
    explanation: System calls (`syscall` / `sysenter`) provide a controlled hardware gateway for user-mode
      software to request privileged OS kernel services (like reading files or opening sockets).
  - type: multiple_choice
    question: What is a 'Race Condition' in concurrent programming?
    options:
    - A bug where the correctness of a program depends on the non-deterministic execution timing or interleaving
      of multiple threads
    - When two CPUs compete to run at the highest clock frequency
    - When an application consumes more bandwidth than the network card supports
    - When a thread crashes because it ran out of physical stack space
    correct: 0
    explanation: A race condition occurs when two or more concurrent threads access shared state without
      proper synchronization, producing unpredictable and corrupted results depending on timing.
  - type: multiple_choice
    question: How does a 'Futex' (Fast Userspace Mutex) achieve high performance in Linux?
    options:
    - It acquires and releases uncontended locks entirely in user space via atomic instructions, calling
      into the kernel only on contention
    - It runs all synchronization code inside the GPU hardware shader units
    - It disables CPU hardware interrupts during critical sections
    - It converts multi-threaded programs into single-threaded coroutines
    correct: 0
    explanation: Futexes perform lock acquisition in user space using fast atomic operations (like Compare-And-Swap
      in ~5ns); expensive kernel syscalls are executed only if a thread must sleep or be woken up.
  - type: multiple_choice
    question: Which hardware assembly instruction on x86-64 provides the foundation for lock-free data
      structures by atomically updating a value if it matches an expected value?
    options:
    - LOCK CMPXCHG (Compare-and-Exchange)
    - NOP (No Operation)
    - JMP (Unconditional Jump)
    - HLT (Halt Processor)
    correct: 0
    explanation: The atomic `LOCK CMPXCHG` instruction compares a memory location with a register and
      swaps in a new value only if they match, executing as an indivisible bus transaction.
  - type: multiple_choice
    question: What are the four necessary conditions for a Deadlock to occur (the Coffman conditions)?
    options:
    - Mutual Exclusion, Hold and Wait, No Preemption, and Circular Wait
    - Atomic Access, Virtual Paging, Branch Prediction, and Context Switching
    - Read Only, Write Only, Execute Only, and No Execute
    - Ring 0, Ring 1, Ring 2, and Ring 3
    correct: 0
    explanation: 'The 4 Coffman conditions for deadlock are: (1) Mutual exclusion, (2) Hold and wait,
      (3) No preemption, and (4) Circular wait; breaking any one condition prevents deadlocks.'
  - type: multiple_choice
    question: What is the primary drawback of using a 'Spinlock' for long critical sections?
    options:
    - It wastes 100% of a CPU core's cycles in a busy-wait loop while waiting for the lock to be released
    - It triggers a kernel panic if held longer than 1 millisecond
    - It automatically unlocks itself after 100 clock cycles
    - It causes physical thermal degradation to the DDR RAM module
    correct: 0
    explanation: Spinlocks do not put waiting threads to sleep; they continuously loop and query the lock
      status, consuming 100% CPU time that could otherwise execute other useful threads.
  - type: multiple_choice
    question: What is a 'Memory Barrier' (or Memory Fence) instruction?
    options:
    - A CPU instruction that enforces strict ordering on memory load and store operations across out-of-order
      execution and caches
    - A physical firewall circuit between the motherboard and power supply
    - An operating system security sandbox preventing processes from using RAM
    - A compiler optimization that removes unreferenced local variables
    correct: 0
    explanation: Memory barriers prevent the CPU and compiler from reordering read and write instructions
      across the barrier, ensuring correct visibility in multi-core concurrent programs.
  - type: multiple_choice
    question: What state does a Unix process enter when it has terminated execution, but its parent process
      has not yet called `wait()` to read its exit code?
    options:
    - Zombie Process (Defunct)
    - Orphan Process
    - Daemon Process
    - Real-Time Process
    correct: 0
    explanation: A Zombie process has completed execution and released its memory, but its PID and exit
      status remain in the kernel Process Table until the parent calls `wait()`/`waitpid()`.
  - type: multiple_choice
    question: What is the difference between Preemptive and Non-Preemptive multitasking?
    options:
    - In preemptive multitasking, the OS timer interrupt forcibly pauses running tasks; in non-preemptive,
      tasks run until they voluntarily yield
    - Preemptive multitasking is used exclusively on single-core 8-bit microcontrollers
    - Non-preemptive multitasking executes code without physical RAM
    - Preemptive multitasking requires user programs to be written in Rust
    correct: 0
    explanation: Modern preemptive OS kernels use hardware timer ticks to slice CPU time and forcibly
      switch tasks, preventing a single rogue loop from freezing the entire system.
  - type: multiple_choice
    question: What is 'Priority Inversion' in real-time operating systems?
    options:
    - When a high-priority task is blocked waiting for a lock held by a low-priority task, which is itself
      preempted by a medium-priority task
    - When the CPU clock speed runs backwards to save battery power
    - When a user-mode process executes with higher privilege than Ring 0
    - When a thread's stack pointer points to heap memory
    correct: 0
    explanation: Priority inversion happens when a high-priority thread is stalled waiting for a resource
      held by a low-priority thread, which is prevented from finishing by medium-priority tasks (famously
      solved by Priority Inheritance on the Mars Pathfinder).
  - type: multiple_choice
    question: What is the purpose of the 'Completely Fair Scheduler' (CFS) in the Linux kernel?
    options:
    - To allocate CPU time proportionally using red-black trees based on the virtual runtime (vruntime)
      of runnable tasks
    - To ensure every thread receives exactly identical network bandwidth
    - To distribute power evenly across physical motherboard voltage rails
    - To randomize thread execution to prevent denial-of-service attacks
    correct: 0
    explanation: Linux CFS models an ideal multi-tasking CPU by tracking each process's accumulated execution
      time (`vruntime`) in a red-black tree, always scheduling the task that has received the least CPU
      time.
  - type: multiple_choice
    question: What does a Counting Semaphore with an initial value of $K$ represent?
    options:
    - A synchronization primitive that allows at most K concurrent threads to access a finite pool of
      shared resources
    - A hardware register that counts CPU clock cycles up to K
    - A process that spawns K child processes at system boot
    - A file descriptor that permits K simultaneous network connections
    correct: 0
    explanation: A counting semaphore initialized to $K$ acts as a resource counter; calling `wait()`
      (`P`) decrements the counter and blocks when it reaches 0, allowing up to $K$ concurrent accesses.
  - type: multiple_choice
    question: Why is `volatile` in C/C++ insufficient for thread synchronization on multi-core processors?
    options:
    - It only prevents compiler register caching; it does not emit CPU memory barriers or guarantee atomic
      hardware memory operations
    - It is a deprecated keyword that modern compilers ignore entirely
    - It converts 64-bit integer variables into 8-bit character bytes
    - It forces the thread to execute exclusively in single-user mode
    correct: 0
    explanation: '`volatile` tells the compiler not to optimize away reads/writes to a variable, but it
      does NOT generate atomic CPU instructions or memory fences, leaving it vulnerable to hardware race
      conditions on multi-core CPUs.'
- id: io_storage_interrupts
  title: 5. I/O, Storage, Interrupts & File Systems
  description: Hardware interrupts, Interrupt Service Routines (ISRs), Direct Memory Access (DMA), Inodes,
    File systems, and the storage evolution from HDDs to NVMe SSDs.
  cards:
  - title: Hardware Interrupts vs. Polling & The Interrupt Vector Table (IVT)
    figure:
      title: Direct Memory Access (DMA) vs Programmed I/O
      svg: "<svg viewBox=\"0 0 520 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-height:140px;\"\
        >\n  <!-- CPU -->\n  <rect x=\"20\" y=\"45\" width=\"90\" height=\"50\" rx=\"8\" fill=\"#3b82f6\"\
        \ fill-opacity=\"0.15\" stroke=\"#3b82f6\" stroke-width=\"2\"/>\n  <text x=\"65\" y=\"75\" font-size=\"\
        12\" font-weight=\"bold\" fill=\"#3b82f6\" text-anchor=\"middle\">CPU Core</text>\n\n  <!-- DMA\
        \ Controller -->\n  <rect x=\"180\" y=\"20\" width=\"160\" height=\"45\" rx=\"8\" fill=\"#8b5cf6\"\
        \ fill-opacity=\"0.15\" stroke=\"#8b5cf6\" stroke-width=\"2\"/>\n  <text x=\"260\" y=\"42\" font-size=\"\
        10\" font-weight=\"bold\" fill=\"#8b5cf6\" text-anchor=\"middle\">DMA Controller</text>\n  <text\
        \ x=\"260\" y=\"56\" font-size=\"8\" fill=\"currentColor\" opacity=\"0.8\" text-anchor=\"middle\"\
        >Direct High-Speed Transfer</text>\n\n  <!-- Physical RAM -->\n  <rect x=\"410\" y=\"45\" width=\"\
        90\" height=\"50\" rx=\"8\" fill=\"#10b981\" fill-opacity=\"0.15\" stroke=\"#10b981\" stroke-width=\"\
        2\"/>\n  <text x=\"455\" y=\"75\" font-size=\"12\" font-weight=\"bold\" fill=\"#10b981\" text-anchor=\"\
        middle\">RAM Memory</text>\n\n  <!-- Storage / NIC -->\n  <rect x=\"180\" y=\"85\" width=\"160\"\
        \ height=\"45\" rx=\"8\" fill=\"#f59e0b\" fill-opacity=\"0.15\" stroke=\"#f59e0b\" stroke-width=\"\
        2\"/>\n  <text x=\"260\" y=\"107\" font-size=\"10\" font-weight=\"bold\" fill=\"#f59e0b\" text-anchor=\"\
        middle\">NVMe SSD / Network NIC</text>\n\n  <path d=\"M 260 85 L 260 65\" stroke=\"#8b5cf6\" stroke-width=\"\
        2\" stroke-dasharray=\"3,3\"/>\n  <path d=\"M 340 42 L 410 60\" stroke=\"#10b981\" stroke-width=\"\
        2\"/>\n  <path d=\"M 110 65 L 180 42\" stroke=\"#3b82f6\" stroke-width=\"2\"/>\n</svg>"
      caption: With Direct Memory Access (DMA), the storage device transfers megabytes of data directly
        into RAM over the PCIe bus without wasting CPU cycles.
    points:
    - If a CPU had to continuously check (Polling) whether a network packet arrived or a key was pressed,
      it would waste 99% of its computational power in useless loops.
    - Instead, peripheral devices use Hardware Interrupts. When a network packet arrives or an SSD finishes
      reading a block, the device pulses an electrical interrupt line (or sends a PCIe MSI-X message)
      to the CPU's Interrupt Controller (APIC).
    - The CPU immediately pauses the current instruction stream, saves key registers to the kernel stack,
      and indexes into the Interrupt Vector Table (IVT / IDT) to execute the matching Interrupt Service
      Routine (ISR) in kernel space.
    - 'Direct Memory Access (DMA): Rather than forcing the CPU to read every 4-byte word from the disk
      controller into a register and write it to RAM, the DMA controller transfers massive data streams
      directly between peripheral storage and physical RAM over the system bus, interrupting the CPU only
      once when the entire multi-megabyte transfer is finished.'
  - title: File Systems, Inodes & Journaling
    points:
    - Storage devices (SSDs, HDDs) are raw arrays of 512-byte or 4096-byte sectors. A File System (like
      ext4, APFS, NTFS, or XFS) organizes these raw blocks into named directories, files, and metadata.
    - 'In Unix file systems, every file is represented by an Inode (Index Node). The Inode contains file
      metadata: size, permissions (chmod), owner UID/GID, modification timestamps, and pointers to the
      physical data blocks storing the file''s contents. Crucially, the file''s name and directory location
      are stored in directory entries, not in the Inode itself!'
    - 'Hard Links: Two directory entries pointing to the exact same Inode number share the exact same
      underlying file. The data is physically deleted only when the Inode link count reaches zero.'
    - Journaling File Systems prevent data corruption during sudden power losses. Before modifying complex
      disk structures (e.g. creating an Inode and updating block allocation bitmaps), the file system
      writes the intended transaction to a sequential on-disk Journal log. If power fails mid-write, the
      OS replays the journal on reboot to restore a consistent state instantly without full disk scans
      (`fsck`).
  - title: 'Storage Evolution: HDDs, NAND Flash SSDs & NVMe PCIe'
    points:
    - Traditional Hard Disk Drives (HDDs) use mechanical spinning magnetic platters and actuator read/write
      arms. Seeking a random sector takes 5–10 milliseconds (dominated by mechanical seek and rotational
      latency) — over 100,000 times slower than RAM.
    - Solid State Drives (SSDs) use solid-state NAND Flash memory with zero moving parts. NAND flash is
      organized into Pages (4–16 KB) and Blocks (128–512 Pages). A crucial physical limitation is that
      Flash pages can be read/written individually, but can only be erased at the Block level.
    - The Flash Translation Layer (FTL) in the SSD controller performs wear leveling and garbage collection
      to evenly distribute writes across flash cells and avoid premature silicon burnout.
    - NVMe (Non-Volatile Memory Express) replaced legacy SATA protocols by attaching SSDs directly to
      PCIe lanes, supporting up to 64,000 parallel I/O queues (with 64,000 commands per queue), fully
      unlocking multi-gigabyte/sec throughput on modern multi-core CPUs.
  trivia:
  - type: multiple_choice
    question: What is the primary advantage of Direct Memory Access (DMA) over Programmed I/O?
    options:
    - Hardware devices transfer data directly to/from physical RAM without consuming CPU instruction cycles
      for each byte
    - It completely eliminates the need for physical RAM
    - It enables mechanical hard drives to spin at infinite RPM
    - It encrypts files automatically using quantum cryptography
    correct: 0
    explanation: DMA allows peripherals (like NVMe SSDs and NICs) to transfer bulk data directly into
      physical RAM over the bus, notifying the CPU via an interrupt only when the complete transfer is
      done.
  - type: multiple_choice
    question: In Unix-like file systems, what information is stored inside an Inode (Index Node)?
    options:
    - File size, permissions, ownership, timestamps, and pointers to physical data blocks (but NOT the
      filename)
    - The file's absolute path and the user's password hash
    - The entire binary code of the operating system kernel
    - The IP address of the remote network server
    correct: 0
    explanation: An Inode stores all metadata for a file (size, timestamps, owner, permissions, block
      pointers), while the filename itself is stored separately inside the parent directory's entry table.
  - type: multiple_choice
    question: What is the function of 'Journaling' in modern file systems (such as ext4, NTFS, and XFS)?
    options:
    - Logging metadata changes to a dedicated journal buffer before writing them to disk to ensure instant
      recovery after sudden crashes
    - Recording user keystrokes for debugging software bugs
    - Compressing text files into ZIP archives in the background
    - Formatting raw SSD sectors every 24 hours
    correct: 0
    explanation: Journaling writes intended disk structure changes to a sequential log before committing
      them; if a power failure occurs, the journal is replayed upon boot to restore file system consistency
      in seconds.
  - type: multiple_choice
    question: What is a major physical constraint of NAND Flash memory used in Solid State Drives (SSDs)?
    options:
    - Data can be written in Pages, but overwriting requires erasing an entire Block of pages
    - It cannot read data faster than a mechanical floppy disk
    - It requires liquid nitrogen cooling to function
    - It loses all stored data whenever the computer is rebooted
    correct: 0
    explanation: NAND flash can be programmed at the page level (e.g. 4KB), but cannot overwrite in place;
      an entire multi-megabyte block must be erased before pages within it can be reprogrammed.
  - type: multiple_choice
    question: What key architectural enhancement did the NVMe (Non-Volatile Memory Express) protocol introduce
      over legacy SATA AHCI?
    options:
    - Direct PCIe lane connection and support for up to 64,000 parallel command queues with 64,000 commands
      each
    - Converting solid-state drives into optical laser discs
    - Limiting disk access to a single serialized queue to prevent bus contention
    - Executing user-space Python scripts directly on the flash chips
    correct: 0
    explanation: NVMe was designed specifically for flash storage over PCIe, supporting up to 64,000 parallel
      queues with 64,000 commands per queue (compared to SATA AHCI's single queue of 32 commands).
  - type: multiple_choice
    question: What happens when you create a 'Hard Link' to an existing file in Linux?
    options:
    - A new directory entry is created that points directly to the existing file's Inode number, incrementing
      its link count
    - A complete duplicate copy of all physical data blocks is written to disk
    - A special pointer file is created that stores the text path of the target file
    - The target file is converted into an executable binary
    correct: 0
    explanation: A hard link creates an additional directory entry pointing to the same Inode number;
      both filenames reference the exact same data blocks on disk, and the file is deleted only when the
      link count reaches 0.
  - type: multiple_choice
    question: What is the role of the 'Flash Translation Layer' (FTL) inside an SSD controller?
    options:
    - Managing logical-to-physical block mapping, wear leveling, and garbage collection to protect NAND
      flash cells
    - Translating HTML web pages into binary machine code
    - Controlling the mechanical rotational speed of the spindle motor
    - Encrypting RAM contents before executing CPU context switches
    correct: 0
    explanation: The FTL is the onboard firmware in an SSD that maps logical OS block addresses to physical
      NAND flash pages, performing out-of-place writes, wear leveling, and garbage collection.
  - type: multiple_choice
    question: What is an Interrupt Service Routine (ISR)?
    options:
    - A specialized kernel software handler executed immediately when a specific hardware or software
      interrupt occurs
    - A user-space daemon that cleans temporary cache files
    - A hardware circuit that supplies electric current to the CPU socket
    - A compiler pass that optimizes arithmetic loops
    correct: 0
    explanation: An ISR is a low-level kernel callback function registered in the Interrupt Descriptor
      Table (IDT) that runs with high priority to handle events from hardware devices or exceptions.
  - type: multiple_choice
    question: What is the primary purpose of the OS 'Page Cache' in Linux when reading and writing files?
    options:
    - Caching recently read and written disk blocks in unused physical RAM to provide near-instantaneous
      I/O speeds
    - Storing web browser cookies in encrypted flash sectors
    - Preventing unauthorized users from viewing file permissions
    - Translating assembly language code into microcode instructions
    correct: 0
    explanation: The Linux Page Cache dynamically uses free physical RAM to hold copies of recently accessed
      file blocks; subsequent reads hit RAM directly (~100ns) rather than issuing storage requests (~100μs).
  - type: multiple_choice
    question: What is the difference between Polling and Interrupt-Driven I/O?
    options:
    - Polling continuously queries the device status in a loop; Interrupts allow the CPU to perform other
      work until the device signals readiness
    - Polling requires DMA hardware, whereas Interrupts do not
    - Interrupts can only be generated by keyboard devices
    - Polling is executed exclusively inside the CPU arithmetic logic unit
    correct: 0
    explanation: Polling wastes CPU cycles repeatedly checking device status registers; interrupt-driven
      I/O allows the processor to execute other tasks until the hardware asserts an electrical line when
      ready.
  - type: multiple_choice
    question: What is 'Memory-Mapped I/O' (MMIO)?
    options:
    - A mechanism where hardware peripheral control registers are mapped into the CPU's physical address
      space and accessed via normal load/store instructions
    - Mapping physical hard disk storage directly into optical DVD lasers
    - Using virtual memory paging to defragment flash drives
    - Converting RAM chips into network routers
    correct: 0
    explanation: With MMIO, peripheral control and data registers are assigned specific physical memory
      addresses; the CPU interacts with hardware using standard `MOV` load and store instructions.
  - type: multiple_choice
    question: What is the function of the `fsync()` system call in software engineering?
    options:
    - Flushing all buffered, dirty file data and metadata from the OS Page Cache directly to non-volatile
      physical storage
    - Synchronizing the system clock with an NTP time server
    - Re-indexing the search database across all hard drives
    - Closing all active TCP socket connections on the machine
    correct: 0
    explanation: '`fsync()` forces the operating system to flush all modified in-memory cached pages for
      a file descriptor directly onto the physical storage medium before returning, ensuring durability
      for databases.'
  - type: multiple_choice
    question: What is a 'Soft Link' (Symbolic Link / Symlink)?
    options:
    - A small file containing the textual path of another file or directory that is dynamically resolved
      by the OS
    - A hardware cable connecting the motherboard to the power switch
    - A duplicate Inode that shares data blocks with another Inode
    - A process thread that executes with low CPU priority
    correct: 0
    explanation: A symbolic link is a special file whose content is simply a path string pointing to another
      target file or directory; if the target file is deleted, the symlink becomes 'broken' (dangling).
  - type: multiple_choice
    question: What is the primary factor causing traditional HDDs to suffer high latency on random I/O
      operations?
    options:
    - Mechanical seek time (moving the physical actuator arm) and rotational latency (waiting for the
      platter sector to spin beneath the head)
    - The encryption overhead of the SATA bus controller
    - The thermal cooling requirements of the spindle motor
    - The time needed to translate ASCII file names into binary numbers
    correct: 0
    explanation: 'HDDs are mechanical devices: moving the physical head arm to the requested track (seek
      time) and waiting for the magnetic disk to rotate to the sector takes 5–10ms, making random I/O
      slow.'
  - type: multiple_choice
    question: What is 'VFS' (Virtual File System) in the Linux kernel?
    options:
    - An abstraction layer that provides a uniform, standard API (`open`, `read`, `write`) across diverse
      concrete file systems (ext4, XFS, NFS, procfs)
    - A virtual machine hypervisor for running Windows inside Linux
    - A compression format for creating ISO image files
    - A network protocol for downloading kernel patches
    correct: 0
    explanation: The Virtual File System (VFS) defines a standard object-oriented interface (inodes, dentries,
      files, superblocks) so user applications interact with all file systems identically.
