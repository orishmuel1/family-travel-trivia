        זיכרון זה אך מחזיקים במחסנית ואוגרים פרטיים.
    points:
    - תהליך (Process) הוא מופע של תוכנית רצה, המחזיק במרחב כתובות וירטואלי מבודד, זיכרון Heap, מתארי קבצים
      פתוחים (File Descriptors) והרשאות אבטחה, המנוהלים באמצעות בלוק בקרת תהליך (PCB).
    - תהליכון (Thread) הוא יחידת הביצוע הקטנה ביותר המתוזמנת על ידי המעבד. תהליכונים באותו תהליך חולקים
      את אותו מרחב זיכרון ו-Heap, אך לכל תהליכון יש מחסנית קריאות פרטית (Stack), מצביע מחסנית (%rsp) ומצב
      אוגרי מעבד משלו.
    - החלפת הקשר (Context Switch) מתרחשת כאשר מתזמן מערכת ההפעלה עוצר תהליכון אחד ומעביר את ליבת המעבד
      להריץ תהליכון אחר. הליבה שומרת את אוגרי המעבד של התהליכון היוצא וטוענת את אוגרי התהליכון הנכנס.
    - החלפת הקשר בין תהליכים נפרדים יקרה משמעותית מהחלפה בין תהליכונים באותו תהליך, כיוון שהיא מחייבת
      כתיבת כתובת טבלת דפים חדשה לאוגר CR3, מה שפוסל את ה-TLB וגורר גל החטאות מטמון.
  - title: מצב ליבה מול מצב משתמש (טבעת 0 מול טבעת 3) וקריאות מערכת
    points:
    - 'מעבדים אוכפים טבעות הרשאה בחומרה: Ring 0 (מצב ליבה / Kernel Mode) נהנה מגישה בלתי מוגבלת לחומרה,
      לאוגרי בקרה ולזיכרון הפיזי; Ring 3 (מצב משתמש / User Mode) מריץ יישומי תוכנה עם סט הוראות מוגבל
      כדי למנוע קריסות מערכת.'
    - תוכנת משתמש אינה יכולה לגשת לדיסק, לכרטיס הרשת או להקצות RAM ישירות. בכל פעם שתוכנה זקוקה לשירותי
      חומרה (כגון `open()`, `read()`, `write()`, `socket()`), היא מבצעת קריאת מערכת (System Call באמצעות
      הוראת `syscall` ב-x86).
    - הוראת `syscall` מבצעת מעבר חומרתי מבוקר מטבעת 3 לטבעת 0, שומרת את מצביע ההוראות של המשתמש (%rcx)
      ואת דגלי הסטטוס (%r11), וקופצת לכתובת הכניסה של הליבה המוגדרת באוגר חומרה ייעודי (MSR).
  - title: תנאי מרוץ, נעילות Mutex, Spinlock, Futex ופעולות אטומיות
    points:
    - 'כאשר מספר תהליכונים קוראים וכותבים לזיכרון משותף בו-זמנית ללא סנכרון, נוצרים תנאי מרוץ (Race Conditions)
      בלתי צפויים (למשל `counter++` מורכב מ-3 שלבי אסמבלי: קריאה מזיכרון, הגדלה באוגר, וכתיבה חזרה).'
    - פעולות אטומיות (כגון `Compare-And-Swap` / CAS) מבוצעות כטרנזקציית חומרה בלתי ניתנת לחלוקה על אפיק
      הזיכרון (`LOCK CMPXCHG` ב-x86), ומהוות את הבסיס לכל מבני הנתונים ללא נעילות (Lock-Free).
    - מנעול סחרור (Spinlock) רץ בלולאת בדיקה צפופה של המעבד עד שהמנעול מתפנה; הוא אידיאלי לקטעים קריטיים
      קצרצרים בליבה, אך מבזבז 100% ממשאבי הליבה אם הוא מוחזק לזמן ממושך.
    - 'מנעול Mutex מרדים תהליכונים ממתינים כדי לפנות את המעבד. מנעולי Mutex מודרניים בלינוקס מבוססים על
      Futex (מנעול מהיר במרחב המשתמש): נעילה ללא תחרות מתבצעת כולה במרחב המשתמש תוך כ-5ns בפעולה אטומית,
      וקריאת מערכת יקרה לליבה מתבצעת רק אם נדרש להרדים תהליכון.'
  trivia:
  - type: multiple_choice
    question: איזה משאב זיכרון הוא פרטי וייחודי לכל תהליכון (Thread) בתוך תהליך מרובה תהליכונים?
    options:
    - מחסנית הקריאות (Call Stack) ומצב אוגרי המעבד
    - מאגר הזיכרון הדינמי (Heap)
    - מקטע הזיכרון הגלובלי של התוכנית
    - טבלת מתארי הקבצים הפתוחים
    correct: 0
    explanation: תהליכונים חולקים את מרחב הכתובות הווירטואלי, ה-Heap והקבצים הפתוחים של התהליך, אך לכל
      תהליכון יש מחסנית קריאות פרטית ואוגרי מעבד משלו.
  - type: multiple_choice
    question: מדוע החלפת הקשר בין תהליכים נפרדים יקרה משמעותית מהחלפה בין תהליכונים באותו תהליך?
    options:
    - החלפת תהליך מחייבת החלפת מצביע טבלת הדפים ב-CR3, מה שפוסל את רשומות ה-TLB וגורר החטאות מטמון
    - החלפת תהליך דורשת אתחול של כרטיס הרשת
    - החלפת תהליכונים מחייבת אימות חומרתי באמצעות שבב הצפנה
    - החלפת תהליך מעתיקה את כל נתוני ה-Heap לדיסק הקשיח
    correct: 0
    explanation: החלפת תהליכים מחייבת מעבר למרחב כתובות וירטואלי חדש (טעינת CR3), מה שפוסל את רשומות ה-TLB
      שאינן גלובליות וגורר החטאות זיכרון רבות.
  - type: multiple_choice
    question: איזה מנגנון מאפשר לתוכנית במרחב המשתמש (טבעת 3) לבקש שירותים מליבת מערכת ההפעלה (טבעת 0)?
    options:
    - קריאת מערכת (System Call / הוראת syscall)
    - בקשת ערוץ גישה ישירה לזיכרון (DMA)
    - פסיקת עיגול בנקודה צפה
    - שינוי מונה השעון של ה-BIOS
    correct: 0
    explanation: קריאות מערכת (`syscall`) מספקות שער חומרה מאובטח שבאמצעותו תוכנות משתמש מבקשות שירותי
      ליבה מיוחסים (כמו קריאת קבצים או פתיחת חיבורי רשת).
  - type: multiple_choice
    question: מהו 'תנאי מרוץ' (Race Condition) בתכנות מקבילי?
    options:
    - באג שבו תקינות התוכנית תלויה בתזמון הבלתי צפוי או בסדר שזירת הביצוע של מספר תהליכונים
    - מצב שבו שני מעבדים מתחרים מי יגיע לתדר השעון הגבוה ביותר
    - מצב שבו תוכנה צורכת רוחב פס גבוה מקיבולת כרטיס הרשת
    - מצב שבו תהליכון קורס כתוצאה מסיום מקום במחסנית הפיזית
    correct: 0
    explanation: תנאי מרוץ מתרחש כאשר מספר תהליכונים ניגשים לנתונים משותפים ללא סנכרון מתאים, מה שמייצר
      תוצאות שגויות התלויות בתזמון ההרצה.
  - type: multiple_choice
    question: כיצד מנגנון ה-Futex (Fast Userspace Mutex) משיג ביצועים גבוהים במיוחד בלינוקס?
    options:
    - הוא מבצע נעילה ושחרור ללא תחרות במרחב המשתמש באמצעות פעולות אטומיות, ופונה לליבה רק כשיש תחרות
    - הוא מריץ את כל קוד הסנכרון ביחידות העיבוד של כרטיס המסך
    - הוא מכבה את פסיקות החומרה של המעבד במהלך קטעים קריטיים
    - הוא הופך תוכניות מרובות תהליכונים לקורוטינות יחידות
    correct: 0
    explanation: Futexes מבצעים נעילה מהירה במרחב המשתמש תוך ננו-שניות ספורות באמצעות הוראות אטומיות (CAS);
      קריאת מערכת לליבה מתבצעת אך ורק כאשר יש צורך להרדים תהליכון מתחרה.
  - type: multiple_choice
    question: איזו הוראת אסמבלי ב-x86-64 מהווה את הבסיס למבני נתונים ללא נעילות (Lock-Free) על ידי עדכון
      אטומי של ערך רק אם הוא תואם לערך צפוי?
    options:
    - LOCK CMPXCHG (השווה והחלף)
    - NOP (ללא פעולה)
    - JMP (קפיצה בלתי מותנית)
    - HLT (עצירת מעבד)
    correct: 0
    explanation: הוראת `LOCK CMPXCHG` משווה ערך בזיכרון לערך צפוי ומחליפה אותו בערך חדש בפעולה אטומית
      אחת שאינה ניתנת להפרעה על גבי אפיק הזיכרון.
  - type: multiple_choice
    question: מהם ארבעת התנאים ההכרחיים להתרחשות קיפאון (Deadlock / תנאי קופמן)?
    options:
    - מניעה הדדית, החזק והמתן, היעדר הפקעה, והמתנה מעגלית
    - גישה אטומית, דפדוף וירטואלי, חיזוי הסתעפויות, והחלפת הקשר
    - קריאה בלבד, כתיבה בלבד, הרצה בלבד, ואיסור הרצה
    - טבעת 0, טבעת 1, טבעת 2, וטבעת 3
    correct: 0
    explanation: 'ארבעת תנאי קופמן הם: (1) Mutual Exclusion, (2) Hold and Wait, (3) No Preemption, ו-(4)
      Circular Wait; שבירת אחד מהם מונעת קיפאון.'
  - type: multiple_choice
    question: מהו החיסרון המרכזי בשימוש במנעול סחרור (Spinlock) עבור קטעים קריטיים ממושכים?
    options:
    - הוא מבזבז 100% מזמן ליבת המעבד בלולאת בדיקה פעילה בזמן ההמתנה לשחרור המנעול
    - הוא גורם לקריסת ליבה מיידית אם מוחזק מעל מילי-שנייה
    - הוא משתחרר מעצמו באופן אוטומטי לאחר 100 מחזורי שעון
    - הוא גורם לבלאי תרמי פיזי לזיכרון ה-DRAM
    correct: 0
    explanation: מנעולי סחרור אינם מרדימים את התהליכון הממתין אלא מסובבים אותו בלולאה פעילה, מה שמכלה
      100% מזמן המעבד שיכול היה לשמש משימות אחרות.
  - type: multiple_choice
    question: מהי מטרתה של הוראת מחסום זיכרון (Memory Barrier / Fence)?
    options:
    - לאכוף סדר קשיח על פעולות קריאה וכתיבה לזיכרון כנגד שינויי סדר של המעבד והמהדר
    - לשמש כמעגל חומת אש פיזי בין לוח האם לספק הכוח
    - לבודד תהליכים בארגז חול ולמנוע מהם שימוש ב-RAM
    - לבצע אופטימיזציה להסרת משתנים מקומיים שאינם בשימוש
    correct: 0
    explanation: מחסום זיכרון מונע מהמעבד ומהמהדר לסדר מחדש פעולות קריאה וכתיבה סביב המחסום, ומבטיח סדר
      נראות נכון במערכות מרובות ליבות.
  - type: multiple_choice
    question: לאיזה מצב נכנס תהליך ביוניקס כאשר סיים את ריצתו אך תהליך האב שלו טרם קרא ל-`wait()` כדי
      לקבל את קוד היציאה שלו?
    options:
    - תהליך זומבי (Zombie / Defunct)
    - תהליך יתום (Orphan)
    - תהליך דמון (Daemon)
    - תהליך זמן-אמת (Real-Time)
    correct: 0
    explanation: תהליך זומבי סיים את ריצתו ושחרר את משאבי הזיכרון, אך רשומת ה-PID וקוד היציאה שלו נשמרים
      בטבלת התהליכים בליבה עד שהאב יקרא ל-`wait()`.
  - type: multiple_choice
    question: מהו ההבדל בין ריבוי משימות מפקיע (Preemptive) ללא-מפקיע (Non-Preemptive)?
    options:
    - בריבוי משימות מפקיע, פסיקת שעון הליבה עוצרת תהליכים בכוח; בלא-מפקיע, תהליך רץ עד שהוא מוותר על המעבד
      מרצונו
    - ריבוי משימות מפקיע מיושם אך ורק במיקרו-בקרים פשוטים של 8-ביט
    - ריבוי משימות לא-מפקיע מריץ תוכניות ללא זיכרון פיזי
    - ריבוי משימות מפקיע מחייב כתיבת קוד בשפת Rust
    correct: 0
    explanation: מערכות הפעלה מודרניות משתמשות בפסיקות שעון חומרתיות כדי להפקיע את המעבד ולהחליף משימות,
      ובכך מונעות מלולאה תקועה להקפיא את המחשב.
  - type: multiple_choice
    question: מהי תופעת 'היפוך עדיפויות' (Priority Inversion) במערכות הפעלה לזמן אמת?
    options:
    - מצב שבו משימה בעדיפות גבוהה נחסמת בהמתנה למשאב המוחזק על ידי משימה בעדיפות נמוכה, שמופקעת על ידי
      משימה בעדיפות בינונית
    - מצב שבו שעון המעבד רץ לאחור לחיסכון בסוללה
    - מצב שבו תוכנת משתמש רצה עם הרשאות גבוהות יותר מטבעת 0
    - מצב שבו מצביע המחסנית מצביע על זיכרון ה-Heap
    correct: 0
    explanation: היפוך עדיפויות מתרחש כאשר משימה דחופה ממתינה למנעול שמוחזק בידי משימה נחותה, שאינה מקבלת
      מעבד כי משימות בינוניות רצות (נפתר על ידי Priority Inheritance).
  - type: multiple_choice
    question: מהי מטרתו של מתזמן ה-CFS (Completely Fair Scheduler) בליבת לינוקס?
    options:
    - לחלק את זמן המעבד בצורה הוגנת באמצעות עצי אדום-שחור בהתבסס על זמן הריצה הווירטואלי (vruntime) של
      כל משימה
    - להבטיח שכל תהליכון יקבל רוחב פס רשת זהה
    - לחלק את החשמל בצורה אחידה בין ערוצי המתח בלוח האם
    - להגריל את סדר ביצוע התהליכונים למניעת התקפות מניעת שירות
    correct: 0
    explanation: מתזמן CFS בלינוקס עוקב אחר זמן הריצה הווירטואלי (`vruntime`) של משימות בעץ אדום-שחור,
      ותמיד בוחר להריץ את המשימה שקיבלה הכי מעט זמן מעבד עד כה.
  - type: multiple_choice
    question: מה מייצג סמפור סופר (Counting Semaphore) שאתחולו הוגדר לערך K?
    options:
    - פרימיטיב סנכרון המאפשר לעד K תהליכונים לגשת במקביל למאגר משאבים משותף מוגבל
    - אוגר חומרה הסופר פולסי שעון עד למספר K
    - תהליך המייצר K תהליכי בן בעת עליית המחשב
    - מתאר קובץ המאפשר עד K חיבורי רשת בו-זמנית
    correct: 0
    explanation: סמפור סופר המאותחל ל-K משמש לניהול מאגר משאבים; פעולת `wait()` מפחיתה את המונה וחוסמת
      כאשר הוא מגיע ל-0, ובכך מגבילה את הגישה ל-K תהליכונים במקביל.
  - type: multiple_choice
    question: מדוע שימוש במילת המפתח `volatile` ב-C/C++ אינו מספק לצורך סנכרון תהליכונים במעבדים מרובי
      ליבות?
    options:
    - הוא מונע רק שמירת משתנה באוגרי המהדר, אך אינו מייצר מחסומי זיכרון של המעבד ואינו מבטיח פעולות אטומיות
      בחומרה
    - מדובר במילת מפתח ישנה שמהדרים מודרניים מתעלמים ממנה לחלוטין
    - הוא ממיר משתנים של 64-ביט למשתני בייט בודד
    - הוא מאלץ את התהליכון לרוץ במצב משתמש יחיד בלבד
    correct: 0
    explanation: '`volatile` מונע מהמהדר לייעל קריאות/כתיבות ממשתנה, אך אינו מייצר הוראות חומרה אטומיות
      או מחסומי זיכרון של המעבד, ולכן אינו פותר תנאי מרוץ בין ליבות.'
- id: io_storage_interrupts
  title: 5. קלט/פלט (I/O), פסיקות, מנהלי התקנים ומערכות קבצים
  description: פסיקות חומרה מול דגימה (Polling), שגרות שירות פסיקה (ISR), גישה ישירה לזיכרון (DMA), מבנה
    Inodes, מערכות קבצים יומניות (Journaling), והתפתחות האחסון מ-HDD ל-NVMe SSD.
  cards:
  - title: פסיקות חומרה מול דגימה (Polling) וגישה ישירה לזיכרון (DMA)
    figure:
      title: גישה ישירה לזיכרון (DMA) לעומת העברה דרך המעבד
      svg: "<svg viewBox=\"0 0 520 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-height:140px;\"\
        >\n  <rect x=\"20\" y=\"45\" width=\"90\" height=\"50\" rx=\"8\" fill=\"#3b82f6\" fill-opacity=\"\
        0.15\" stroke=\"#3b82f6\" stroke-width=\"2\"/>\n  <text x=\"65\" y=\"75\" font-size=\"12\" font-weight=\"\
        bold\" fill=\"#3b82f6\" text-anchor=\"middle\">ליבת מעבד</text>\n\n  <rect x=\"180\" y=\"20\"\
        \ width=\"160\" height=\"45\" rx=\"8\" fill=\"#8b5cf6\" fill-opacity=\"0.15\" stroke=\"#8b5cf6\"\
        \ stroke-width=\"2\"/>\n  <text x=\"260\" y=\"42\" font-size=\"10\" font-weight=\"bold\" fill=\"\
        #8b5cf6\" text-anchor=\"middle\">בקר DMA</text>\n  <text x=\"260\" y=\"56\" font-size=\"8\" fill=\"\
        currentColor\" opacity=\"0.8\" text-anchor=\"middle\">העברה ישירה במהירות גבוהה</text>\n\n  <rect\
        \ x=\"410\" y=\"45\" width=\"90\" height=\"50\" rx=\"8\" fill=\"#10b981\" fill-opacity=\"0.15\"\
