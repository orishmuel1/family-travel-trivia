        בכל מחזור שעון.
    points:
    - 'כל מחשב מודרני מבוסס על ארכיטקטורת פון-נוימן (Von Neumann): יחידת עיבוד מרכזית (CPU) המחוברת לזיכרון
      אחוד המכיל הן את הוראות התוכנית והן את הנתונים שעליהם היא פועלת.'
    - המעבד מכיל תאי אחסון פנימיים מהירים במיוחד הנקראים אוגרים (Registers) - כגון מונה התוכנית (Program
      Counter / PC), מצביע המחסנית (Stack Pointer / %rsp) ואוגרים לשימוש כללי (%rax, %rbx).
    - 'כדי להריץ קוד, המעבד מבצע בלולאה מתמדת את מחזור ההוראה: (1) שליפת ההוראה הבאה מהזיכרון שאליו מצביע
      מונה התוכנית, (2) פענוח קוד המכונה (Opcode) לאותות בקרה, (3) ביצוע הפעולה החישובית ב-ALU, (4) גישה
      לזיכרון הנתונים במידת הצורך, ו-(5) כתיבת התוצאה בחזרה לאוגר היעד.'
    - במקום להמתין 5 מחזורי שעון שלמים לסיום הוראה אחת לפני שמתחילים את הבאה, מהנדסי חומרה פיתחו את צינור
      ההוראות (Pipeline) - בדומה לפס ייצור במפעל מכוניות. בעוד הוראה מס' 1 נמצאת בשלב הכתיבה לאוגר, הוראה
      מס' 2 בשלב הזיכרון, מס' 3 בביצוע, מס' 4 בפענוח ומס' 5 בשליפה, ומגיעים לקצב אידיאלי של הוראה אחת
      שהושלמה בכל מחזור שעון (IPC = 1.0).
  - title: סיכוני צינור (Hazards) וחיזוי הסתעפויות (Branch Prediction)
    points:
    - צינור הוראות פועל ביעילות שיא רק כאשר הוראות זורמות ברצף חלק ללא הפרעה. כאשר הוראה אינה יכולה להתבצע
      במחזור השעון הבא, נוצר 'סיכון צינור' (Hazard), המאלץ את המעבד להחדיר מחזורי המתנה ריקים (Stall /
      Bubbles).
    - סיכוני נתונים (Data Hazards) מתרחשים כאשר הוראה זקוקה לפלט של הוראה קודמת שטרם הספיקה לכתוב את ערכה
      חזרה לאוגר. החומרה משתמשת ב'עקיפת נתונים' (Data Forwarding) כדי לנתב את חוט הפלט של ה-ALU ישירות
      לקלט של ה-ALU בשלב הבא ללא המתנה.
    - סיכוני בקרה (Control Hazards) מתרחשים בכל פעם שהמעבד פוגש פקודת תנאי או קפיצה (`if / else`, לולאות,
      קריאות לפונקציה). מכיוון שתוצאת התנאי מחושבת רק בשלב הביצוע, המעבד אינו יודע מאיזו כתובת לשלוף את
      ההוראות הבאות.
    - 'כדי למנוע עיכובי ענק, מעבדים מודרניים כוללים מנגנוני חיזוי הסתעפויות (Branch Predictors): טבלאות
      היסטוריה ומודלים מנחשים האם התנאי יתקיים בדיוק של מעל 95%. אם הניחוש נכון, ההרצה ממשיכה במלוא המהירות;
      אם הניחוש שגוי, המעבד שוטף ומבטל (Flush) את כל ההוראות שנשלפו בטעות, בעלות של 15–20 מחזורי שעון
      מבוזבזים.'
  - title: ביצוע סופר-סקלארי, מחוץ לסדר (OoO) והרצה ספקולטיבית
    points:
    - 'מעבדים מודרניים עתירי ביצועים (כגון Intel Core, AMD Zen ו-Apple M-Series) הם מעבדים סופר-סקלאריים
      (Superscalar): הם כוללים מספר יחידות ביצוע מקביליות (מספר יחידות ALU, יחידות וקטוריות ויחידות טעינה/שמירה)
      ומסוגלים לשלוח ולבצע 4 עד 8 הוראות במקביל בכל מחזור שעון (IPC > 1).'
    - תוכניות נכתבות כרצף טורי, אך אם הוראה מס' 2 ממתינה לנתונים מזיכרון ה-RAM האיטי, המתנה סדרתית הייתה
      משביתה את המעבד כולו. מנגנון ביצוע מחוץ לסדר (Out-of-Order Execution / OoO) מנתח את זרם ההוראות,
      מזהה הוראות עצמאיות בהמשך הקוד (כגון הוראות 5 ו-6), ומריץ אותן מיד על גבי יחידות ALU פנויות.
    - כדי לשמור על תקינות מוחלטת, המעבד משתמש בשינוי שמות אוגרים (Register Renaming) ובחוצץ סידור מחדש
      (Reorder Buffer / ROB). ה-ROB שומר את התוצאות הספקולטיביות ומעדכן את המצב הארכיטקטוני של המחשב אך
      ורק בסדר התוכנית המקורי, לאחר שכל ההוראות שקדמו להן הסתיימו בהצלחה.
  trivia:
  - type: multiple_choice
    question: מהי המטרה העיקרית של צינור ביצוע ההוראות (Pipelining) במעבד מודרני?
    options:
    - להריץ מספר הוראות במקביל בשלבי חומרה מדורגים כדי להגדיל את תפוקת ההוראות (Throughput)
    - לקצר את זמן מחזור השעון הפיזי של גביש הסיליקון
    - לבטל לחלוטין את הצורך במערך אוגרים פנימי
    - לתרגם שפת מכונה בינארית לשפות תכנות עיליות
    correct: 0
    explanation: 'צינור ההוראות פועל כפס ייצור במפעל: על ידי חלוקת הביצוע לשלבים מדורגים (שליפה, פענוח,
      ביצוע, זיכרון, כתיבה), מספר הוראות מעובדות במקביל, במטרה להשלים הוראה אחת בכל מחזור שעון.'
  - type: multiple_choice
    question: מה קורה כאשר מנגנון חיזוי ההסתעפויות (Branch Predictor) מנחש באופן שגוי את תוצאת תנאי ה-'if'?
    options:
    - המעבד שוטף ומבטל (Flush) את צינור ההוראות, מוחק את ההוראות הספקולטיביות ומבזבז כ-15–20 מחזורי שעון
    - מערכת ההפעלה קורסת מיד עם שגיאת ליבה (Kernel Panic)
    - המעבד עוצר את פעולתו לצמיתות עד להגעת פסיקת חומרה חיצונית
    - יחידת ה-ALU הופכת את קוטביות השעון כדי לבטל את החישוב
    correct: 0
    explanation: במקרה של חיזוי שגוי, כל העבודה שבוצעה בספקולציה אינה תקפה; המעבד שוטף את הצינור, מאפס
      את מונה התוכנית לכתובת הנכונה ומתחיל שליפה מחדש, בעלות של כ-15 עד 20 מחזורים.
  - type: multiple_choice
    question: איזה רכיב במעבד הפועל מחוץ לסדר (Out-of-Order) מבטיח שהתוצאות יישמרו ויחויבו בדיוק לפי סדר
      התוכנית המקורי?
    options:
    - חוצץ סידור מחדש (Reorder Buffer - ROB)
    - יחידת חישוב אריתמטית ולוגית (ALU)
    - חוצץ תרגום כתובות וירטואליות (TLB)
    - בקר גישה ישירה לזיכרון (DMA)
    correct: 0
    explanation: ה-Reorder Buffer (ROB) עוקב אחר הוראות שבוצעו מחוץ לסדר ומבטיח שעדכון האוגרים והכתיבה
      לזיכרון יתבצעו אך ורק לפי סדר התוכנית המקורי שכתב המתכנת.
  - type: multiple_choice
    question: איזה מנגנון חומרה מאפשר לפלט של שלב הביצוע (ALU) לעבור ישירות כקלט לשלב הביצוע הבא ללא המתנה
      לכתיבה לאוגרים?
    options:
    - עקיפת נתונים (Data Forwarding / Bypassing)
    - דפדוף זיכרון וירטואלי (Paging)
    - החלפת הקשר (Context Switching)
    - ניהול ערוץ אפיק (Bus Mastering)
    correct: 0
    explanation: עקיפת נתונים (Data Forwarding) מחברת את חוטי הפלט של ה-ALU ישירות למרבבי הקלט של שלב
      הביצוע הבא, ומונעת השבתת צינור עקב תלות בקריאת אוגרים.
  - type: multiple_choice
    question: מה מאפיין ארכיטקטורת מעבד 'סופר-סקלארית' (Superscalar)?
    options:
    - יכולת לשלוח ולבצע מספר הוראות במקביל בכל מחזור שעון בודד על גבי מספר יחידות ביצוע
    - הרצת תוכניות ללא צורך בליבת מערכת הפעלה
    - הכפלת נפח ה-RAM הפיזי באמצעות דחיסת תוכנה
    - עיבוד ישיר של אותות אנלוגיים ללא המרה לבינארי
    correct: 0
    explanation: מעבד סופר-סקלארי כולל מספר יחידות ביצוע חומרתיות מקביליות (כגון מספר יחידות ALU), ומאפשר
      שליפה וביצוע של יותר מהוראה אחת בכל מחזור שעון (IPC > 1).
  - type: multiple_choice
    question: מה תפקידו של אוגר מונה התוכנית (Program Counter / PC / RIP)?
    options:
    - להחזיק את כתובת הזיכרון של ההוראה הבאה המיועדת לשליפה וביצוע
    - לאחסן את ערך ההחזרה של הפונקציה האחרונה שנקראה
    - לספור את סך פולסי השעון החומרתיים מרגע הדלקת המחשב
    - לנהל את מפתחות ההצפנה של מנגנון ה-Secure Boot
    correct: 0
    explanation: אוגר מונה התוכנית (PC) שומר תמיד את כתובת הזיכרון שממנה ישלוף המעבד את ההוראה הבאה במחזור
      הביצוע.
  - type: multiple_choice
    question: מדוע מהנדסי חומרה משתמשים ב'שינוי שמות אוגרים' (Register Renaming) במעבדים מודרניים?
    options:
    - כדי לבטל תלויות נתונים מלאכותיות (WAR ו-WAW) על ידי מיפוי למאגר אוגרים פיזיים רחב בהרבה
    - כדי לתרגם שמות משתנים משפת C++ למחרוזות שפת מכונה
    - כדי להפחית את מתח החשמל הנצרך על ידי תאי SRAM
    - כדי לאפשר לתוכנות במרחב המשתמש לדרוס אוגרי בקרה של הליבה
    correct: 0
    explanation: שינוי שמות אוגרים ממפה באופן דינמי את האוגרים הארכיטקטוניים (למשל 16 אוגרים ב-x86) למאגר
      פיזי פנימי של מאות אוגרים, ובכך מסיר חסימות מלאכותיות בביצוע מקבילי.
  - type: multiple_choice
    question: בצינור הוראות קלאסי בן 5 שלבים, מה מתרחש במהלך שלב ה-'ID'?
    options:
    - פענוח בינארי של ההוראה וקריאת ערכי האופרנדים ממערך האוגרים (Register File)
    - כתיבת תוצאות החישוב לזיכרון המטמון L3
    - שליפת בייטים של הוראות מקובץ ה-ELF בדיסק
    - ביצוע חילוק במספרים בעלי נקודה צפה
    correct: 0
    explanation: בשלב ה-Instruction Decode (ID), יחידת הבקרה מפענחת את קוד הפעולה (Opcode) ושולפת את ערכי
      האוגרים הדרושים לביצוע החישוב.
  - type: multiple_choice
    question: מהו 'סיכון מבני' (Structural Hazard) בצינור ביצוע של מעבד?
    options:
    - כאשר שתי הוראות הרצות במקביל בצינור דורשות גישה לאותו משאב חומרה פיזי בו-זמנית
    - כאשר הוראה מנסה לגשת לכתובת זיכרון שאינה מוקצית
    - כאשר התחממות הסיליקון מאלצת הורדת תדר שעון
    - כאשר דרייבר של מערכת ההפעלה קורס עקב מצביע Null
    correct: 0
    explanation: סיכון מבני מתרחש כאשר החומרה אינה מסוגלת לתמוך בכל צירופי ההוראות בו-זמנית (למשל כאשר
      יש פורט זיכרון יחיד ונדרשת שליפת הוראה וקריאת נתונים באותו מחזור).
  - type: multiple_choice
    question: במה שונה חיזוי הסתעפויות דינמי מחיזוי הסתעפויות סטטי?
    options:
    - חיזוי דינמי משתמש בהיסטוריית הביצוע בזמן ריצה כדי לנחש הסתעפויות, בעוד סטטי מסתמך על כללים קבועים
      מראש
    - חיזוי דינמי דורש הידור מחדש של הקוד בזמן ריצה
    - חיזוי דינמי פועל אך ורק על הוראות נקודה צפה
    - חיזוי סטטי מבוצע בלעדית על ידי מתזמן מערכת ההפעלה
    correct: 0
    explanation: חיזוי סטטי מסתמך על כללים קבועים (כגון הנחה שלולאות אחורה תמיד מתקיימות), בעוד חיזוי
      דינמי נעזר בטבלאות חומרה המתעדות את התנהגות ההסתעפות בזמן ריצה.
  - type: multiple_choice
    question: איזה מדד מייצג את מספר הוראות המכונה הממוצע שמעבד משלים במחזור שעון בודד?
    options:
    - הוראות למחזור שעון (Instructions Per Cycle - IPC)
    - יחס ריצוד השעון (Clock Jitter Ratio)
    - מעטפת הספק תרמי (Thermal Design Power - TDP)
    - קנס החטאת מטמון (Cache Miss Penalty)
    correct: 0
    explanation: מדד ה-IPC (הוראות למחזור שעון) מודד את תפוקת המעבד; מעבדים מודרניים הפועלים מחוץ לסדר
      מגיעים לערכי IPC של 2.0 עד 4.0 במשימות מותאמות.
  - type: multiple_choice
    question: איזה מצב מתאר תלות נתונים מסוג 'קריאה לאחר כתיבה' (Read-After-Write / RAW)?
    options:
    - הוראה זקוקה לערך קלט המיוצר על ידי הוראה קודמת שטרם השלימה את חישובה
    - הוראה כותבת לזיכרון לפני שמערכת ההפעלה עלתה
    - שני תהליכונים כותבים לאותה שורת מטמון ללא נעילות
    - התקן היקפי קורא מזיכרון ה-DMA כשהמעבד כבוי
    correct: 0
    explanation: תלות RAW היא תלות נתונים אמיתית שבה הוראה שנייה קוראת ערך שנכתב על ידי הוראה ראשונה;
      ההוראה השנייה אינה יכולה להמשיך עד שפלט ההוראה הראשונה מוכן.
  - type: multiple_choice
    question: מהו תפקידה המרכזי של יחידת ה-ALU (יחידת חישוב אריתמטית ולוגית)?
    options:
    - ביצוע פעולות חישוב בסיסיות על מספרים שלמים (חיבור, חיסור) ופעולות לוגיות סיביתיות (AND, OR, XOR)
    - תרגום כתובות וירטואליות לכתובות פיזיות ב-RAM
    - ניהול חלוקת אות השעון על גבי לוח האם
    - תזמון תהליכוני תוכנה בין ליבות המעבד השונות
    correct: 0
    explanation: ה-ALU הוא המעגל החישובי המרכזי במעבד המבצע את כל פעולות החשבון במספרים שלמים, השוואות
      ופעולות מניפולציה על סיביות.
  - type: multiple_choice
    question: מהו 'צוואר הבקבוק של פון-נוימן' (Von Neumann Bottleneck)?
    options:
    - מגבלת התפוקה הנובעת משיתוף אפיק נתונים יחיד בין שליפת הוראות להעברת נתונים בין הזיכרון למעבד
    - ההתנגדות החשמלית של מוליכי נחושת בטמפרטורות גבוהות
    - חוסר היכולת של מעבדי RISC לבצע הוראות באורך משתנה
    - זמן ההשהיה הנוצר בעת החלפת הקשר בליבת מערכת ההפעלה
    correct: 0
    explanation: צוואר הבקבוק של פון-נוימן נובע מכך שהוראות ונתונים חולקים את אותו ערוץ תקשורת אל הזיכרון
      הראשי, מה שמגביל את מהירות העיבוד לרוחב הפס של האפיק.
  - type: multiple_choice
    question: מהי המשמעות של 'הרצה ספקולטיבית' (Speculative Execution) בארכיטקטורת מחשבים?
    options:
    - הרצת הוראות לאורך נתיב שנחזה מראש, עוד בטרם ידוע בוודאות האם נתיב זה אכן ייבחר בפועל
    - העלאת מתח המעבד בניסיון לבדוק את יציבות הסיליקון המרבית
    - הרצת קוד משתמש לא מאובטח בתוך מכונה וירטואלית מבודדת
    - דחיסת קוד מכונה בזיכרון הראשי לפני הרצתו
    correct: 0
    explanation: הרצה ספקולטיבית היא טכניקה שבה המעבד מנחש את כיוון ההסתעפות ומריץ מראש את ההוראות; אם
      הניחוש התברר כנכון, זמן ההמתנה נחסך, ואם שגוי – התוצאות מבוטלות.
- id: memory_hierarchy_caching
  title: 2. מדרג הזיכרון ועקביות זיכרון מטמון (Cache Coherence)
  description: 'התגברות על ''קיר הזיכרון'': הבנת זיכרונות מטמון L1/L2/L3, מקומיות מרחבית וזמנית, שורות
    מטמון (Cache Lines), ופרוטוקול עקביות הזיכרון MESI במעבדים מרובי ליבות.'
  cards:
  - title: קיר הזיכרון ופירמידת מדרג הזיכרון
    figure:
      title: 'פער ההשהיה: מאוגרי המעבד ועד לזיכרון הראשי'
      svg: "<svg viewBox=\"0 0 520 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-height:150px;\"\
        >\n  <polygon points=\"260,10 320,40 200,40\" fill=\"#ef4444\" fill-opacity=\"0.2\" stroke=\"\
        #ef4444\" stroke-width=\"1.5\"/>\n  <text x=\"260\" y=\"32\" font-size=\"10\" font-weight=\"bold\"\
        \ fill=\"#ef4444\" text-anchor=\"middle\">אוגרים (&lt;1ns)</text>\n\n  <polygon points=\"200,42\
        \ 320,42 360,72 160,72\" fill=\"#f59e0b\" fill-opacity=\"0.2\" stroke=\"#f59e0b\" stroke-width=\"\
        1.5\"/>\n  <text x=\"260\" y=\"62\" font-size=\"10\" font-weight=\"bold\" fill=\"#f59e0b\" text-anchor=\"\
        middle\">מטמון L1 / L2 (1–4ns)</text>\n\n  <polygon points=\"160,74 360,74 400,104 120,104\" fill=\"\
        #3b82f6\" fill-opacity=\"0.2\" stroke=\"#3b82f6\" stroke-width=\"1.5\"/>\n  <text x=\"260\" y=\"\
        94\" font-size=\"10\" font-weight=\"bold\" fill=\"#3b82f6\" text-anchor=\"middle\">מטמון משותף\
        \ L3 (10–20ns)</text>\n\n  <polygon points=\"120,106 400,106 450,136 70,136\" fill=\"#10b981\"\
        \ fill-opacity=\"0.2\" stroke=\"#10b981\" stroke-width=\"1.5\"/>\n  <text x=\"260\" y=\"126\"\
        \ font-size=\"10\" font-weight=\"bold\" fill=\"#10b981\" text-anchor=\"middle\">זיכרון ראשי DRAM\
        \ (50–100ns)</text>\n</svg>"
      caption: זיכרונות מטמון סטטיים (SRAM) קטנים ומהירים יושבים ישירות על שבב המעבד כדי לגשר על פער של
        מאות מחזורי שעון מול זיכרון ה-DRAM הראשי.
    points:
    - בשנת 1980, מהירות השעון של המעבדים וזמן הגישה לזיכרון הראשי היו מתואמים למדי. בארבעת העשורים שלאחר
      מכן, כוח העיבוד של ה-CPU זינק באופן מעריכי, בעוד שזמן ההשהיה של זיכרון ה-DRAM השתפר באיטיות רבה.
      פער ביצועים אדיר זה ידוע בשם 'קיר הזיכרון' (Memory Wall).
    - מעבד מודרני מריץ הוראה בפחות מ-0.3 ננו-שניות, אך שליפת נתון מזיכרון ה-DRAM הראשי אורכת 50 עד 80
      ננו-שניות - נצח של 200+ מחזורי שעון מבוזבזים שבהם הליבה מושבתת בהמתנה.
    - 'כדי לפתור זאת, מהנדסים מארגנים את הזיכרון במדרג היררכי המבוסס על SRAM (זיכרון סטטי): זיכרונות מטמון
      זעירים, יקרים ומהירים ביותר הבנויים ישירות על גבי שבב הסיליקון לצד יחידות הביצוע.'
    - מטמון L1 הוא פרטי לכל ליבה ומחולק להוראות ונתונים (32–64 KB, זמן גישה כ-1ns). מטמון L2 גדול יותר
      (512 KB–1 MB לליבה, ~3–4ns). מטמון L3 משותף לכל הליבות על השבב (16–64+ MB, ~10–15ns), ומגובה על
      ידי זיכרון ה-DRAM הראשי.
  - title: עקרון המקומיות (Locality) ושורות מטמון (Cache Lines)
    points:
    - 'זיכרונות מטמון פועלים ביעילות תודות לעקרון המקומיות: תוכניות מחשב אינן ניגשות לזיכרון בצורה אקראית,
      אלא מפגינות שני דפוסי התנהגות מובהקים.'
    - 'מקומיות זמנית (Temporal Locality): אם התבצעה גישה לכתובת זיכרון מסוימת, סביר מאוד שייגשו אליה שוב
      בזמן הקרוב (למשל משתני לולאה, סכומי צבירה ופונקציות הנקראות בתדירות גבוהה).'
    - 'מקומיות מרחבית (Spatial Locality): אם התבצעה גישה לכתובת זיכרון מסוימת, סביר מאוד שייגשו לכתובות
      זיכרון הסמוכות לה פיזית בזמן הקרוב (למשל איברי מערך עוקבים ושדות של מבנה נתונים).'
    - בשל המקומיות המרחבית, המעבד לעולם אינו קורא בייט בודד מ-RAM; הוא תמיד טוען בלוק רציף הנקרא שורת
      מטמון (Cache Line - תמיד 64 בייטים בארכיטקטורות x86 ו-ARM מודרניות). מעבר סדרתי על מערך בזיכרון
      מייצר החטאת מטמון אחת ואחריה 15 פגיעות מטמון רצופות עבור שלמים של 4 בייטים!
  - title: אסוציאטיביות, שיתוף כוזב (False Sharing) ועקביות MESI
    points:
    - זיכרונות מטמון מאורגנים בסטים (Sets). במטמון Direct-Mapped, כל כתובת בזיכרון יכולה להתמקם במיקום
      יחיד (שיעור התנגשויות גבוה). מעבדים מודרניים משתמשים במטמון אסוציאטיבי (Set-Associative Cache -
      למשל 8-Way או 16-Way), המאפשר לכתובת להתמקם בכל אחד מ-$N$ המקומות בסט המוקצה לה, ובכך מצמצם התנגשויות
      באופן דרמטי.
    - 'כאשר לליבות מרובות יש עותקים של אותה כתובת זיכרון במטמוני L1/L2 הפרטיים שלהן, כתיבה על ידי ליבה
      אחת חייבת להסתנכרן. פרוטוקול MESI שומר על עקביות זיכרון בחומרה באמצעות 4 מצבים: Modified (עודכן,
      קיים רק במטמון זה), Exclusive (נקי, קיים רק במטמון זה), Shared (נקי, משותף למספר מטמונים), ו-Invalid
      (נתונים מיושנים ולא תקפים).'
    - שיתוף כוזב (False Sharing) מתרחש כאשר שני תהליכונים הרצים על ליבות נפרדות מעדכנים משתנים עצמאיים
      לחלוטין שבמקרה יושבים על אותה שורת מטמון בת 64 בייטים. פרוטוקול MESI פוסל שוב ושוב את שורת המטמון
      ומקפיץ אותה בין הליבות על גבי אפיק התקשורת, מה שגורם להאטה קשה בביצועים.
  trivia:
  - type: multiple_choice
    question: מהו הגודל האופייני של שורת מטמון (Cache Line) במעבדי x86 ו-ARM מודרניים?
    options:
    - 64 בייטים
    - 4 קילובייטים
    - 8 סיביות
    - 1 מגה-בייט
    correct: 0
    explanation: במרבית מעבדי x86-64 ו-ARM המודרניים, שורת המטמון הבסיסית היא בגודל 64 בייטים, ומהווה
      את יחידת הנתונים המינימלית המועברת בין ה-RAM למטמון.
  - type: multiple_choice
    question: איזה עקרון מסביר מדוע גישה לאיבר אחד במערך הופכת את הגישה לאיברים הסמוכים לו למהירה בהרבה?
    options:
    - מקומיות מרחבית (Spatial Locality)
    - מקומיות זמנית (Temporal Locality)
    - תרגום וירטואלי (Virtual Translation)
    - מקביליות ברמת הוראות (ILP)
    correct: 0
    explanation: מקומיות מרחבית קובעת שגישה לכתובת מסוימת מעידה על סבירות גבוהה לגישה לכתובות סמוכות;
      טעינת שורת מטמון מלאה בת 64 בייטים מביאה את האיברים הסמוכים ישירות למטמון L1.
  - type: multiple_choice
    question: מהו 'שיתוף כוזב' (False Sharing) בתכנות מרובה תהליכונים?
    options:
    - מצב שבו משתנים בלתי תלויים הנקראים/נכתבים על ידי תהליכונים שונים חולקים את אותה שורת מטמון בת 64
      בייטים, מה שגורם לפסילות מטמון תכופות
    - כאשר שני תהליכים מנסים להאזין לאותו פורט רשת TCP בו-זמנית
    - כאשר דפי זיכרון וירטואלי חולקים את אותה מסגרת פיזית ללא הרשאות
    - כאשר תהליכון משחרר נעילת Mutex השייכת לתהליכון אחר
    correct: 0
    explanation: שיתוף כוזב מתרחש כאשר ליבות נפרדות מעדכנות משתנים עצמאיים הממוקמים באותה שורת מטמון (64
      בייטים); פרוטוקול MESI נאלץ להקפיץ ולפסול את השורה בין הליבות שוב ושוב.
  - type: multiple_choice
    question: בפרוטוקול עקביות המטמון MESI, מה מסמל המצב 'M' (Modified)?
    options:
    - שורת המטמון קיימת אך ורק במטמון הנוכחי, שונתה (Dirty), ושונה מהתוכן בזיכרון הראשי
    - שורת המטמון משותפת לקריאה בלבד לכל הליבות במעבד
    - שורת המטמון סומנה למחיקה על ידי מנגנון איסוף הזבל
    - שורת המטמון ממופה לאזור החלפת הזיכרון (Swap) בדיסק
    correct: 0
    explanation: בפרוטוקול MESI, מצב 'Modified' מציין שהשורה קיימת אך ורק במטמון המקומי של הליבה שביצעה
      את הכתיבה, וטרם סונכרנה ונכתבה חזרה ל-RAM.
  - type: multiple_choice
    question: מהו ההבדל המרכזי בין זיכרון סטטי (SRAM) המשמש במטמון לזיכרון דינמי (DRAM) המשמש ב-RAM הראשי?
    options:
    - SRAM מהיר במיוחד (~1ns) אך יקר וגדול שטחית (6 טרנזיסטורים לביט); DRAM איטי יותר (~60ns) אך דחוס
      וזול (טרנזיסטור + קבל לביט)
    - SRAM דורש רענון חשמלי מתמיד, בעוד DRAM שומר נתונים ללא מתח
    - SRAM מסוגל לשמור אך ורק הוראות לקריאה בלבד, בעוד DRAM שומר נתוני קריאה-כתיבה
    - SRAM מתחבר דרך אפיק PCIe, בעוד DRAM מחובר ישירות ל-ALU
    correct: 0
    explanation: SRAM בנוי ממעגל נעילה בן 6 טרנזיסטורים המאפשר גישה מהירה במיוחד ללא צורך במחזורי רענון,
      בעוד DRAM משתמש בקבל זעיר המאפשר דחיסות זיכרון גבוהה במחיר מהירות נמוכה יותר.
  - type: multiple_choice
    question: מהו זיכרון מטמון 'N-way Set-Associative'?
    options:
    - מטמון שבו כל כתובת בזיכרון יכולה להתמקם בכל אחד מ-N מקומות שונים בתוך הסט (Set) המיועד לה
    - מטמון המתחבר במקביל ל-N לוחות אם שונים
    - מטמון הדוחס נתונים בפקטור של N בחומרה בזמן אמת
    - מטמון המחלק כל שורת 64 בייטים ל-N חלקים שווים
    correct: 0
    explanation: מטמון N-way Set-Associative מחלק את המטמון לסטים של N שורות; כתובת זיכרון ממפה לסט מסוים
      ויכולה להתאחסן בכל אחד מ-N המקומות באותו סט, מה שמצמצם התנגשויות.
  - type: multiple_choice
    question: מדוע סריקת מטריצה דו-ממדית שורה-אחר-שורה בשפת C מהירה משמעותית מסריקה עמודה-אחר-עמודה?
    options:
    - שפת C שומרת מטריצות בסדר שורות (Row-Major), מה שממקסם מקומיות מרחבית ופגיעות שורת מטמון
    - סריקת עמודות משביתה את צינור ביצוע ההוראות במעבד
    - סריקת שורות מבוצעת בחומרת הנקודה הצפה במקום ב-ALU
    - המהדר מתרגם סריקת עמודות לפונקציות רקורסיביות כבדות
    correct: 0
    explanation: מטריצות ב-C מסודרות ברצף לפי שורות; מעבר שורה-אחר-שורה ניגש לבייטים עוקבים בזיכרון (מקומיות
      מרחבית), בעוד סריקת עמודות קופצת במרחקים הגדולים מ-64 בייטים וגורמת להחטאת מטמון כמעט בכל איבר.
  - type: multiple_choice
    question: מהו ההבדל בין מדיניות כתיבה 'Write-Through' לבין 'Write-Back' במטמון?
    options:
    - Write-Through כותב מיד את השינוי גם לזיכרון הראשי; Write-Back מעדכן רק את המטמון וכותב ל-RAM רק
      כשהשורה מפונה
    - Write-Through מיועד לקריאה בלבד; Write-Back מיועד לכתיבה בלבד
    - Write-Through מיושם אך ורק בזיכרון כרטיסי מסך (VRAM)
    - Write-Back עוקף לחלוטין את מדרג המטמון של המעבד
    correct: 0
    explanation: Write-Through מעדכן את הזיכרון הראשי במקביל לכל כתיבה במטמון; Write-Back מעדכן רק את
      המטמון ומסמן את השורה כ-Dirty, ודוחה את הכתיבה ל-RAM עד לרגע שבו השורה מפונה.
  - type: multiple_choice
    question: מה מתאר המונח 'קיר הזיכרון' (The Memory Wall)?
    options:
    - הפער ההולך וגדל בין מהירות העיבוד של המעבדים לבין זמן ההשהיה האיטי של זיכרון ה-DRAM הראשי
    - מגבלת החוק של מור הנובעת מהתחממות טרנזיסטורים
    - חוק אמדל המגביל ביצועים במעבדים מרובי ליבות
    - קנס ההשהיה הנובע משטיפת צינור ההוראות
    correct: 0
    explanation: '''קיר הזיכרון'' מתאר את הפער ההיסטורי שנוצר כאשר מהירות המעבדים גדלה במהירות עצומה בעוד
      מהירות הגישה ל-DRAM השתפרה לאט, מה שהפך את המטמון לרכיב קריטי לביצועים.'
  - type: multiple_choice
    question: מה מתרחש כאשר המעבד נתקל ב'החטאת מטמון' (Cache Miss)?
    options:
    - המעבד מושהה ונאלץ להמתין לשליפת בלוק הנתונים בן 64 הבייטים ממטמון עמוק יותר או מזיכרון ה-DRAM הראשי
    - מערכת ההפעלה סוגרת את התוכנית בשגיאת חריגת זיכרון
    - המעבד מרוקן את כל נתוני הדיסק הקשיח למחיצות פלאש
    - ה-BIOS מאתחל את בקר החשמל של לוח האם
    correct: 0
    explanation: בעת החטאת מטמון, הנתון המבוקש אינו נמצא ברמת המטמון הנוכחית; המעבד פונה לרמת המטמון הבאה
      או ל-RAM, וסופג עונש השהיה של עשרות עד מאות מחזורי שעון.
  - type: multiple_choice
    question: בפרוטוקול MESI, לאיזה מצב תעבור שורת מטמון מקומית כאשר ליבה אחרת מבצעת כתיבה לאותה כתובת
      זיכרון?
    options:
    - פסול (Invalid - I)
    - משותף (Shared - S)
    - בלעדי (Exclusive - E)
    - שונה (Modified - M)
    correct: 0
    explanation: כאשר ליבה אחת משדרת באפיק שהיא כותבת לשורה משותפת, כל שאר הליבות המחזיקות עותק של אותה
      שורה מעבירות אותו למצב 'Invalid' כדי לא לקרוא נתונים ישנים.
  - type: multiple_choice
    question: איזו מדיניות פינוי מטמון מוציאה את השורה שלא נעשה בה שימוש במשך פרק הזמן הארוך ביותר?
    options:
    - הכי פחות בשימוש לאחרונה (Least Recently Used - LRU)
    - נכנס ראשון יוצא ראשון (FIFO)
    - פינוי אקראי (Random Replacement)
    - הכי בשימוש תדיר (Most Frequently Used - MFU)
    correct: 0
    explanation: אלגוריתם LRU עוקב אחר מועד הגישה האחרון לכל שורת מטמון ומפנה את השורה שעבר הזמן הרב ביותר
      מאז שניגשו אליה, בהתבסס על עקרון המקומיות הזמנית.
  - type: multiple_choice
    question: מה תפקידו של מנגנון ה-'Hardware Prefetcher' בבקר הזיכרון של המעבד?
    options:
    - לזהות דפוסי גישה סדרתיים בזיכרון ולטעון מראש שורות מטמון עתידיות עוד בטרם התבקשו על ידי הקוד
    - להדר קבצי קוד מקור לקבצים בינאריים בעת עליית המחשב
    - לטעון קבלים בזיכרון ה-DRAM לפני אתחול קר
    - לבצע איחוי (Defragmentation) לדיסק הקשיח ברקע
    correct: 0
    explanation: ה-Hardware Prefetcher עוקב אחר כתובות הגישה; כאשר הוא מזהה צעדים קבועים (כגון סריקת מערך),
      הוא מושך מראש שורות מטמון מ-RAM כדי להעלים את זמן ההשהיה.
  - type: multiple_choice
    question: מהו היתרון המרכזי של מדרג מטמון מכיל (Inclusive Cache - למשל L3 המכיל את L1/L2)?
    options:
    - בדיקה אם ליבה אחרת מחזיקה בשורת מטמון יכולה להתבצע בסריקת תגיות L3 בלבד, מבלי להפריע למטמוני L1/L2
      הפרטיים
    - הכפלת קיבולת האחסון האפקטיבית של שבב הסיליקון
    - ביטול מוחלט של הצורך בסיביות תג ואינדקס במטמון
    - אפשרות למטמון L1 לשמור כמות אינסופית של שורות
    correct: 0
    explanation: במדרג מכיל, כל נתון ב-L1/L2 מובטח שיהיה קיים גם ב-L3; בדיקות עקביות בין ליבות מבוצעות
      מול תגיות L3 בלבד, מה שחוסך תעבורה באפיקי הליבות הפנימיים.
  - type: multiple_choice
    question: איזו רמת זיכרון מטמון משותפת לרוב לכלל הליבות במעבד מודרני מרובה ליבות?
    options:
    - מטמון רמה 3 (L3 Cache / Last Level Cache)
    - מטמון הוראות רמה 1 (L1 Instruction)
    - מטמון נתונים רמה 1 (L1 Data)
    - מערך האוגרים (Register File)
    correct: 0
    explanation: בעוד שמטמוני L1 ו-L2 הם בדרך כלל פרטיים לכל ליבה, מטמון L3 (הנקרא גם Last Level Cache
      / LLC) הוא אחוד ומשותף לכל הליבות על השבב.
- id: virtual_memory_paging
  title: 3. זיכרון וירטואלי, דפדוף (Paging) ויחידת ה-MMU
  description: כיצד מערכות הפעלה מספקות בידוד זיכרון, תרגום כתובות באמצעות טבלאות דפים, חוצץ תרגום מהיר
    (TLB), שגיאות דף (Page Faults), ודפדוף לפי דרישה.
  cards:
  - title: מדוע זיכרון וירטואלי? בידוד ואשליית זיכרון אינסופי
    figure:
      title: זרימת תרגום כתובת וירטואלית לכתובת פיזית ב-RAM
      svg: "<svg viewBox=\"0 0 520 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-height:140px;\"\
        >\n  <rect x=\"20\" y=\"45\" width=\"130\" height=\"50\" rx=\"8\" fill=\"#3b82f6\" fill-opacity=\"\
        0.15\" stroke=\"#3b82f6\" stroke-width=\"2\"/>\n  <text x=\"85\" y=\"67\" font-size=\"11\" font-weight=\"\
        bold\" fill=\"#3b82f6\" text-anchor=\"middle\">כתובת וירטואלית</text>\n  <text x=\"85\" y=\"83\"\
        \ font-size=\"9\" fill=\"currentColor\" opacity=\"0.8\" text-anchor=\"middle\">VPN + היסט (Offset)</text>\n\
        \n  <path d=\"M 150 70 L 195 70\" stroke=\"#3b82f6\" stroke-width=\"2\"/>\n\n  <rect x=\"195\"\
        \ y=\"35\" width=\"130\" height=\"70\" rx=\"8\" fill=\"#8b5cf6\" fill-opacity=\"0.15\" stroke=\"\
        #8b5cf6\" stroke-width=\"2\"/>\n  <text x=\"260\" y=\"60\" font-size=\"12\" font-weight=\"bold\"\
        \ fill=\"#8b5cf6\" text-anchor=\"middle\">MMU / TLB</text>\n  <text x=\"260\" y=\"78\" font-size=\"\
        9\" fill=\"currentColor\" opacity=\"0.8\" text-anchor=\"middle\">חיפוש חומרתי מהיר</text>\n  <text\
        \ x=\"260\" y=\"92\" font-size=\"9\" fill=\"#10b981\" text-anchor=\"middle\">תרגום טבלת דפים</text>\n\
        \n  <path d=\"M 325 70 L 370 70\" stroke=\"#10b981\" stroke-width=\"2\"/>\n\n  <rect x=\"370\"\
        \ y=\"45\" width=\"130\" height=\"50\" rx=\"8\" fill=\"#10b981\" fill-opacity=\"0.15\" stroke=\"\
        #10b981\" stroke-width=\"2\"/>\n  <text x=\"435\" y=\"67\" font-size=\"11\" font-weight=\"bold\"\
        \ fill=\"#10b981\" text-anchor=\"middle\">זיכרון פיזי RAM</text>\n  <text x=\"435\" y=\"83\" font-size=\"\
        9\" fill=\"currentColor\" opacity=\"0.8\" text-anchor=\"middle\">מסגרת PFN + היסט</text>\n</svg>"
      caption: יחידת ניהול הזיכרון (MMU) נעזרת בטבלאות דפים ובמטמון ה-TLB המהיר כדי לתרגם כתובות וירטואליות
        למסגרות פיזיות ב-RAM בזמן אמת.
    points:
    - 'בראשית ימי המחשוב, תוכניות רצו ישירות על כתובות זיכרון פיזיות: אם תוכנית א'' כתבה בטעות לכתובת
      `0x1000`, היא יכלה לדרוס את תוכנית ב'' או להפיל את מערכת ההפעלה כולה.'
    - מנגנון הזיכרון הווירטואלי פותר זאת על ידי הענקת מרחב כתובות וירטואלי פרטי ומבודד לחלוטין לכל תהליך
      (128 טרה-בייט ב-x86-64). מבחינת התהליך, הוא היחיד הקיים במחשב וברשותו כל הזיכרון מ-`0x0` ועד סוף
      המרחב.
    - הזיכרון מחולק למקטעים בגודל קבוע הנקראים דפים (Pages - בדרך כלל 4 קילובייט). זיכרון ה-RAM הפיזי
      מחולק למסגרות דף תואמות (Page Frames).
    - מערכת ההפעלה מנהלת טבלת דפים (Page Table) עבור כל תהליך. כאשר התוכנית ניגשת לכתובת וירטואלית, יחידת
      החומרה לניהול זיכרון (MMU) מתרגמת את מספר הדף הווירטואלי (VPN) למספר המסגרת הפיזית (PFN) ב-RAM.
  - title: חוצץ תרגום מהיר (TLB) וטבלאות דפים מרובות רמות
    points:
    - במערכות 64-ביט, טבלת דפים שטוחה יחידה הייתה דורשת מיליוני גיגה-בייט של RAM רק כדי להחזיק את המיפויים.
      מערכות הפעלה מודרניות משתמשות בטבלאות דפים היררכיות בנות 4 או 5 רמות (PML4 -> PDPT -> PD -> PT ב-x86),
      ויוצרות טבלאות משנה אך ורק עבור כתובות שהתהליך באמת משתמש בהן.
    - מעבר על עץ טבלת דפים בן 4 רמות דורש 4 קריאות זיכרון נפרדות מ-RAM רק כדי לתרגם מצביע בודד - מה שהיה
      מאט את הגישה לזיכרון ב-400%!
    - כדי להפוך את התרגום למיידי, המעבד כולל זיכרון מטמון חומרתי אסוציאטיבי מהיר במיוחד הנקרא Translation
      Lookaside Buffer (TLB). ה-TLB שומר תרגומים אחרונים של VPN -> PFN.
    - פגיעת TLB מתורגמת בפחות ממחזור שעון יחיד (~0.5ns). החטאת TLB מאלצת את חומרת ה-MMU לסרוק את טבלאות
      הדפים ב-RAM, בעלות של 30–50 ננו-שניות.
  - title: שגיאות דף (Page Faults), דפדוף לפי דרישה והגנות זיכרון
    points:
    - 'כל רשומת דף בטבלה (PTE) כוללת ביטים של סטטוס והרשאות: Present (קיים ב-RAM פיזי), Read/Write (קריאה/כתיבה),
      User/Supervisor (משתמש לעומת ליבה), ו-NX (No-Execute - איסור הרצה למניעת פריצות אבטחה).'
    - אם תהליך ניגש לכתובת שבה ביט ה-Present הוא 0, חומרת ה-MMU מפעילה פסיקה הנקראת שגיאת דף (Page Fault).
      המעבד עוצר מיד את קוד המשתמש ומעביר שליטה למטפל שגיאות הדף של ליבת מערכת ההפעלה.
    - 'דפדוף לפי דרישה (Demand Paging): אם הדף שמור בקובץ ה-Swap בדיסק או ממופה מקובץ (`mmap`), הליבה
      מקצה מסגרת RAM, טוענת את ה-4KB מהאחסון, מעדכנת Present = 1, ומחדשת את הרצת התוכנית בשקיפות מלאה.'
    - 'שגיאת חריגת מקטע (Segmentation Fault / SIGSEGV): אם התהליך ביצע פעולה בלתי חוקית (ניסיון כתיבה
      לקוד קריאה בלבד או גישה לכתובת לא מוקצית), הליבה שולחת אות סגירה ומפילה את התוכנית.'
  trivia:
  - type: multiple_choice
    question: מהו גודל דף הזיכרון הבסיסי הסטנדרטי במערכות הפעלה מודרניות ב-x86-64 ו-ARM?
    options:
    - 4 קילובייטים (4096 בייטים)
    - 64 בייטים
    - 1 מגה-בייט
    - 512 בייטים
    correct: 0
    explanation: 4 קילובייט (4,096 בייטים) הוא גודל הדף הבסיסי הסטנדרטי להקצאת זיכרון וירטואלי וניהול
      מסגרות דף ב-RAM.
  - type: multiple_choice
    question: מהו תפקידו העיקרי של חוצץ ה-TLB (Translation Lookaside Buffer)?
    options:
    - לשמור במטמון חומרתי תרגומים מכתובת וירטואלית לפיזית כדי למנוע סריקות חוזרות של טבלאות דפים ב-RAM
    - לתרגם בייטקוד של שפת פייתון להוראות מכונה
    - לאגור חבילות רשת לפני שליחתן לכרטיס הרשת
    - לשמור גיבוי של אוגרי המעבד בעת הפסקת חשמל
    correct: 0
    explanation: ה-TLB הוא זיכרון מטמון מהיר במיוחד בתוך המעבד השומר את תרגומי הכתובות הווירטואליות לפיזיות
      האחרונים, ומאפשר תרגום במחזור שעון בודד.
  - type: multiple_choice
    question: איזה אירוע חומרה מתרחש כאשר תהליך מנסה לגשת לדף זיכרון וירטואלי שאינו טעון כרגע ב-RAM הפיזי?
    options:
    - נזרקת שגיאת דף (Page Fault) המעבירה את השליטה לטיפול ליבת מערכת ההפעלה
    - המעבד מאתחל מיד את לוח האם
    - ה-ALU מחזיר מספר אקראי של 64 ביט ללא שגיאה
    - הדיסק הקשיח מפעיל קריסת ליבה מוחלטת
    correct: 0
    explanation: כאשר ביט ה-Present ברשומת הדף הוא 0, ה-MMU מייצר פסיקת Page Fault; ליבת מערכת ההפעלה
      טוענת את הדף מהדיסק ל-RAM (Demand Paging) וממשיכה בהרצה.
  - type: multiple_choice
    question: איזה מנגנון אבטחה מסמן מקטעי זיכרון (כגון המחסנית וה-Heap) כבלתי ניתנים להרצה כדי למנוע
      הזרקת קוד זדוני?
    options:
    - סיבית ה-NX (No-Execute) / XD (Execute Disable)
    - סיבית ה-Dirty
    - מונה חותמת הזמן של הגישה
    - אוגר בדיקת הזוגיות (Parity Check)
    correct: 0
    explanation: סיבית ה-NX/XD ברשומת טבלת הדפים מאפשרת למערכת ההפעלה לקבוע שדפי נתונים לא יורצו כקוד;
      ניסיון להריץ פקודות מתוכם גורם להפלת התוכנית מיד.
  - type: multiple_choice
    question: מדוע מערכות הפעלה מודרניות של 64-ביט משתמשות בטבלאות דפים מרובות רמות במקום בטבלה שטוחה
      יחידה?
    options:
    - כדי לחסוך כמויות עצומות של RAM על ידי הקצאת מבני טבלאות דפים רק עבור אזורי כתובות שנמצאים בשימוש
      בפועל
    - כדי לתרגם כתובות במהירות גבוהה פי 10 מטבלה שטוחה
    - כדי לבטל לחלוטין את הצורך ברכיבי DRAM פיזיים
    - כדי לאפשר למעבדי 32-ביט להריץ הוראות 64-ביט
    correct: 0
    explanation: טבלה שטוחה ב-64-ביט הייתה דורשת טרה-בייטים של זיכרון לכל תהליך; עץ רב-שלבי מקצה רמות
      נמוכות אך ורק עבור מרחבי כתובות שבאמת הוקצו על ידי התוכנית.
  - type: multiple_choice
    question: מהו 'דפדוף לפי דרישה' (Demand Paging) במערכת הפעלה?
    options:
    - טכניקה שבה דפי זיכרון נטענים ל-RAM הפיזי רק ברגע שהתוכנית מנסה לגשת אליהם בפועל
    - טעינה של כל הקובץ הבינארי וספריותיו ל-RAM כבר בעת ההפעלה
    - דרישה מתוכנת המשתמש לבצע קריאת מערכת להקצאת כל בייט
    - דחיסה של דפי זיכרון שאינם בשימוש לאחסון פלאש
    correct: 0
    explanation: דפדוף לפי דרישה דוחה את טעינת הדפים מהאחסון ל-RAM עד לרגע שבו התוכנית נוגעת בכתובת הרלוונטית,
      מה שיוצר Page Fault שטוען את ה-4KB הדרושים.
  - type: multiple_choice
    question: מהו היתרון בשימוש בדפי ענק (HugePages - למשל בגודל 2MB או 1GB) בבסיסי נתונים עתירי ביצועים?
    options:
    - הפחתה דרמטית בכמות רשומות ה-TLB הנדרשות, מה שמעלה את אחוז פגיעות ה-TLB עבור מערכי נתונים ענקיים
    - העלאת תדר השעון של אפיק הזיכרון
    - אפשור חישובי מספרים שלמים ב-128 ביט במרחב המשתמש
    - הצפנת ה-RAM הפיזי כנגד התקפות Cold-Boot
    correct: 0
    explanation: שימוש בדפי 2MB מאפשר לרשומת TLB בודדת לכסות שטח זיכרון הגדול פי 512 מדף רגיל, ובכך מונע
      החטאות TLB תכופות בבסיסי נתונים ומכונות וירטואליות.
  - type: multiple_choice
    question: מה מתרחש במהלך 'TLB Shootdown' במערכת הפעלה מרובת ליבות?
    options:
    - פסיקה בין-מעבדית (IPI) מאלצת ליבות אחרות לפסול תרגומים ישנים ב-TLB המקומי שלהן כאשר מיפוי דפים משתנה
    - המעבד מכבה ליבות שאינן פעילות לצמצום חום
    - בקר הזיכרון מוחק את כל תוכן ה-RAM הפיזי
    - תהליך משתמש מושמד עקב חריגה ממכסת הזיכרון
    correct: 0
    explanation: כאשר ליבה אחת משנה מיפוי של דף משותף (למשל שחרור זיכרון), היא שולחת פסיקה לשאר הליבות
      כדי שינקו את המיפוי הישן מה-TLB המקומי שלהן.
  - type: multiple_choice
    question: איזה אוגר מעבד ב-x86-64 מחזיק את הכתובת הפיזית של טבלת הדפים הראשית (PML4) של התהליך הנוכחי?
    options:
    - אוגר הבקרה CR3
    - מצביע המחסנית RSP
    - אוגר הדגלים EFLAGS
    - מונה התוכנית RIP
    correct: 0
    explanation: אוגר CR3 מצביע על הכתובת הפיזית של טבלת הדפים העליונה של התהליך הפעיל; עדכון CR3 בעת
      החלפת הקשר מפעיל מיד את מרחב הזיכרון של התהליך החדש.
  - type: multiple_choice
    question: מהי מטרת מנגנון האבטחה ASLR (הגרלת פריסת מרחב הכתובות)?
    options:
    - להגריל את כתובות הבסיס של המחסנית, ה-Heap והספריות בכל הפעלה כדי למנוע ניצול של גלישות חוצץ
    - לפזר שורות מטמון בצורה אקראית בין בנקי הזיכרון
    - לשמור קבצים בדיסק בסדר בלוקים אקראי
    - לתזמן תהליכונים בצורה אקראית בין ליבות המעבד
    correct: 0
    explanation: ASLR מגריל את מיקומי הזיכרון של הספריות, המחסנית וה-Heap בכל הרצה של התוכנית, ובכך מונע
      מתוקפים לנחש כתובות פונקציות בזיכרון.
  - type: multiple_choice
    question: מה מעידה קבלת שגיאת 'Segmentation Fault' (SIGSEGV) למפתח תוכנה?
    options:
    - התוכנית ניסתה לבצע גישה בלתי מורשית לזיכרון וירטואלי (כגון דה-רפרנס למצביע Null או כתיבה לזיכרון
      קריאה בלבד)
    - רכיב ה-RAM הפיזי סבל מכשל חומרתי בטרנזיסטור
    - מכפיל השעון של המעבד השתנה במהלך חישוב מתמטי
    - נפח האחסון בדיסק הקשיח הגיע ל-100% תפוסה
    correct: 0
    explanation: שגיאת Segmentation Fault מתרחשת כאשר ה-MMU תופס ניסיון גישה לכתובת וירטואלית לא ממופה
      או הפרת הרשאות (כגון ניסיון כתיבה לקוד שמוגדר לקריאה בלבד).
  - type: multiple_choice
    question: מהי תופעת ה-'Thrashing' במערכת הפעלה?
    options:
    - מצב שבו ה-RAM הפיזי מלא מדי, ומערכת ההפעלה מבזבזת את רוב זמנה בהחלפת דפים לדיסק וממנו במקום להריץ
      קוד
    - מצב שבו שני תהליכונים תופסים במקביל את אותו Spinlock
    - השחתה של שורות מטמון עקב קרינה תרמית במעבד
    - מצב שבו במערכת הקבצים נגמרו ה-Inodes הפנויים
    correct: 0
    explanation: Thrashing מתרחש כאשר דרישות הזיכרון של התוכניות עולות על ה-RAM הפיזי; המערכת נכנסת ללולאת
      החלפות דפים בלתי פוסקת מול הדיסק והביצועים קורסים.
  - type: multiple_choice
    question: מה תפקידה של סיבית ה-'Dirty' ברשומת טבלת הדפים (PTE)?
    options:
    - לסמן האם נכתב מידע לדף מאז שנטען לזיכרון ה-RAM הפיזי
    - לסמן האם הדף מכיל וירוס או קוד זדוני
    - לסמן למעבד שהדף מאוחסן על גבי כונן אופטי
    - למחוק את הדף מיד בסיום התהליכון הנוכחי
    correct: 0
    explanation: חומרת ה-MMU מדליקה את סיבית ה-Dirty ל-1 בכל פעם שמתבצעת כתיבה לדף; מערכת ההפעלה בודקת
      סיבית זו בעת פינוי דף כדי לדעת אם חובה לשמור אותו בדיסק.
  - type: multiple_choice
    question: מהי 'קבוצת העבודה' (Working Set) של תהליך?
    options:
    - אוסף דפי הזיכרון הווירטואלי שהתהליך ניגש אליהם בפועל במהלך חלון זמן נתון
    - מספר מתארי הקבצים (File Descriptors) הפתוחים של התהליך
    - קבוצת הליבות המוקצות להרצת התהליך במעבד
    - רשימת הספריות הדינמיות המקושרות לתוכנית
    correct: 0
    explanation: קבוצת העבודה היא אוסף הדפים שהתהליך משתמש בהם באופן פעיל ברגע נתון; אם אין מספיק RAM
      להחזיק את קבוצות העבודה של כל התהליכים, מתחילה תופעת Thrashing.
  - type: multiple_choice
    question: כיצד מנגנון 'העתקה בעת כתיבה' (Copy-on-Write / COW) מייעל את קריאת המערכת `fork()` ביוניקס?
    options:
    - תהליך האב והבן חולקים את אותם דפי RAM לקריאה בלבד; דף מועתק פיזית רק כאשר אחד התהליכים מנסה לכתוב
      אליו
    - המערכת מעתיקה מיד את כל נפח ה-RAM של האב למסגרות חדשות
    - תהליך הבן רץ ישירות בתוך אוגרי המעבד של האב ללא זיכרון
    - בקר הדיסק כותב את זיכרון האב ישירות לקובץ Swap
    correct: 0
    explanation: במקום להעתיק גיגה-בייטים של זיכרון ב-`fork()`, מנגנון COW מסמן את כל הדפים כמשותפים ולקריאה
      בלבד; שכפול דף ב-RAM מבוצע רק ברגע שאחד הצדדים מבצע כתיבה.
- id: processes_threads_concurrency
  title: 4. תהליכים, תהליכונים, מקביליות וסנכרון
  description: הבנת מרחבי כתובות של תהליכים, מצב ליבה לעומת מצב משתמש (Ring 0 מול Ring 3), החלפות הקשר,
    תנאי מרוץ (Race Conditions), מנעולי Mutex, Spinlock, Futex ופעולות אטומיות.
  cards:
