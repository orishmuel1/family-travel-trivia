id: cs_arch_101_he
type: academic
icon: 💻
title: ארכיטקטורת מחשבים ומערכות הפעלה (CS Arch 101)
description: 'מדריך מקיף מעקרונות ראשונים למהנדסי תוכנה: כיצד טרנזיסטורים מסיליקון מריצים הוראות, כיצד
  מדרג הזיכרון מתגבר על ''קיר הזיכרון'', וכיצד ליבת מערכת ההפעלה מנהלת זיכרון וירטואלי, תהליכים ומקביליות.'
lang: he
audience: family
categories:
- id: cpu_pipeline_execution
  title: 1. ארכיטקטורת מעבדים וצינור ביצוע ההוראות (Pipeline)
  description: 'מפולסי שעון סיליקון ועד להרצת שפת מכונה: הבנת צינור ה-RISC בן 5 השלבים, חיזוי הסתעפויות
    וכיצד מעבדים ממקסמים הוראות למחזור שעון (IPC).'
  cards:
  - title: ארכיטקטורת פון-נוימן ומחזור ביצוע ההוראה
