        bold\" fill=\"#10b981\" text-anchor=\"middle\">זיכרון RAM</text>\n\n  <rect x=\"180\" y=\"85\"\
        \ width=\"160\" height=\"45\" rx=\"8\" fill=\"#f59e0b\" fill-opacity=\"0.15\" stroke=\"#f59e0b\"\
        \ stroke-width=\"2\"/>\n  <text x=\"260\" y=\"107\" font-size=\"10\" font-weight=\"bold\" fill=\"\
        #f59e0b\" text-anchor=\"middle\">אחסון NVMe / כרטיס רשת</text>\n\n  <path d=\"M 260 85 L 260 65\"\
        \ stroke=\"#8b5cf6\" stroke-width=\"2\" stroke-dasharray=\"3,3\"/>\n  <path d=\"M 340 42 L 410\
        \ 60\" stroke=\"#10b981\" stroke-width=\"2\"/>\n  <path d=\"M 110 65 L 180 42\" stroke=\"#3b82f6\"\
        \ stroke-width=\"2\"/>\n</svg>"
      caption: בקר ה-DMA מעביר מגה-בייטים של נתונים ישירות מהאחסון ל-RAM על גבי אפיק ה-PCIe מבלי להעסיק
        את המעבד בכל בייט.
    points:
    - אילו המעבד היה צריך לבדוק ברציפות בלולאה (Polling) האם הגיעה חבילת רשת או נלחץ מקש, הוא היה מבזבז
      99% מכוח החישוב שלו בבדיקות סרק.
    - במקום זאת, התקנים היקפיים משתמשים בפסיקות חומרה (Hardware Interrupts). כאשר חבילת רשת מגיעה או שה-SSD
      סיים לקרוא בלוק, ההתקן שולח אות פסיקה לבקר הפסיקות של המעבד (APIC).
    - המעבד עוצר מיד את רצף ההוראות הנוכחי, שומר את אוגרי המשתמש במחסנית הליבה, וקופץ לשגרת שירות הפסיקה
      המתאימה (ISR) מתוך טבלת וקטורי הפסיקות (IDT).
    - 'גישה ישירה לזיכרון (Direct Memory Access / DMA): במקום שהמעבד יקרא כל 4 בייטים מהדיסק לאוגר ויכתוב
      אותם ל-RAM, בקר ה-DMA מעביר זרמי נתונים מסיביים ישירות בין ההתקן ל-RAM הפיזי על גבי האפיק, ופוסק
      את המעבד רק פעם אחת בסיום כל ההעברה.'
  - title: מערכות קבצים, מבנה Inodes ויומניות (Journaling)
    points:
    - התקני אחסון פיזיים (SSDs, HDDs) הם מערך רציף של סקטורים בני 512 או 4096 בייטים. מערכת קבצים (כגון
      ext4, APFS, NTFS, XFS) מארגנת בלוקים אלו במבנה היררכי של תיקיות, קבצים ומטא-נתונים.
    - 'במערכות יוניקס, כל קובץ מיוצג על ידי Inode (Index Node). ה-Inode שומר את כל המטא-נתונים של הקובץ:
      גודל, הרשאות (chmod), בעלות UID/GID, חותמות זמן, ומצביעים לבלוקים הפיזיים בדיסק. שם הקובץ והמיקום
      בתיקייה נשמרים ברשומת התיקייה בלבד ולא בתוך ה-Inode עצמו!'
    - 'קישורים קשיחים (Hard Links): שתי רשומות בתיקיות המצביעות לאותו מספר Inode חולקות את אותו קובץ פיזי
      בדיוק; המידע נמחק מהדיסק רק כאשר מונה הקישורים של ה-Inode מגיע לאפס.'
    - מערכות קבצים יומניות (Journaling) מונעות השחתת מידע בהפסקות חשמל פתאומיות. לפני ביצוע שינוי מורכב
      במבנה הדיסק, השינוי נכתב ליומן רציף (Journal). אם המחשב נכבה באמצע הפעולה, הליבה משחזרת ומסיימת
      את הטרנזקציה מהיומן בשניות ספורות בעת האתחול ללא צורך בסריקת דיסק מלאה (`fsck`).
  - title: 'התפתחות האחסון: כוננים מכניים (HDDs), זיכרונות פלאש (SSDs) ו-NVMe'
    points:
    - כוננים מגנטיים קלאסיים (HDDs) משתמשים בפלטות מסתובבות ובזרוע מכנית. חיפוש סקטור אקראי אורך 5–10
      מילי-שניות (בשל תנועת הזרוע וסיבוב הפלטה) - איטי פי 100,000 מזמן הגישה ל-RAM.
    - כונני מצב מוצק (SSDs) מבוססים על זיכרון NAND Flash ללא חלקים נעים. זיכרון הפלאש מאורגן בדפים (4–16
      KB) ובבלוקים (128–512 דפים). מגבלה פיזית מרכזית היא שניתן לקרוא ולכתוב ברמת דף, אך מחיקה יכולה להתבצע
      אך ורק ברמת בלוק שלם.
    - שכבת תרגום הפלאש (FTL) בבקר ה-SSD מנהלת פיזור שחיקה (Wear Leveling) ואיסוף זבל כדי לחלק את הכתיבות
      בצורה אחידה בין תאי הסיליקון ולמנוע שחיקה מוקדמת.
    - פרוטוקול NVMe (Non-Volatile Memory Express) החליף את ממשק ה-SATA המיושן על ידי חיבור ישיר של ה-SSD
      לנתיבי PCIe, ותמיכה בעד 64,000 תורי פקודות מקביליים (עם 64,000 פקודות בכל תור), מה שמאפשר קצב העברה
      של גיגה-בייטים לשנייה במעבדים מרובי ליבות.
  trivia:
  - type: multiple_choice
    question: מהו היתרון המרכזי של גישה ישירה לזיכרון (DMA) לעומת קלט/פלט מתוכנת (Programmed I/O)?
    options:
    - התקני חומרה מעבירים נתונים ישירות ל-RAM הפיזי ללא שימוש במחזורי הוראות מעבד עבור כל בייט
