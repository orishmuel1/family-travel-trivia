  - id: dft_and_fft_algorithms
    title: "5. התמרת פורייה בדידה (DFT) ואלגוריתמים מהירים (FFT)"
    description: >
      המנסרה החישובית של המדע: חשיפת ספקטרום התדרים באמצעות ה-DFT, ריסון דליפות וההאצה ההיסטורית פי 1000 של ה-FFT.
    cards:
      - title: "ה-DFT: המנסרה הדיגיטלית של המדע"
        points:
          - "בשנת 1666 גילה אייזק ניוטון שמנסרת זכוכית מפרקת את אור השמש הלבן לקשת הצבעים המרכיבה אותו. **התמרת פורייה בדידה (DFT)** היא המנסרה הדיגיטלית של המדע המודרני."
          - "בהינתן בלוק של $N$ דגימות שמע בזמן, ה-DFT מחשבת את העוצמה והפאזה המדויקות של $N$ הרמוניות גלי סינוס טהורים המרכיבות יחד את הצליל: $X[k] = \\sum_{n=0}^{N-1} x[n] W_N^{k n}$ כאשר $W_N = e^{-j \\frac{2\\pi}{N}}$."
          - "זהו המנגנון שמאפשר לאפליקציית Shazam לזהות שיר המתנגן במסעדה רועשת תוך 3 שניות, לאקולייזר בטלפון להציג עמודות קצב צבעוניות ולמכשירי MRI להמיר אותות מגנטיים להדמיות תלת-ממדיות חדות של גוף האדם."
          - "מכיוון שה-DFT מתייחסת לבלוק הדגימות כאילו הוא חוזר על עצמו במחזוריות אינסופית, כפל של שתי התמרות DFT בתדר שקול ל**קונבולוציה מעגלית (מחזורית)** בזמן. כדי לחשב הדים פיזיקליים לינאריים, מרפדים את האותות באפסים (Zero-Padding)."
      - title: "דליפה ספקטרלית ופשרת הרזולוציה"
        points:
          - "אם צליל מוזיקלי אינו משלים מספר מחזורים שלם ומדויק בתוך חלון ההקלטה שלנו, הקצוות הפתאומיים בתחילת החלון ובסופו יוצרים קפיצה חדה."
          - "קפיצה זו גורמת ל**דליפה ספקטרלית (Spectral Leakage)**: אנרגיה מתו בודד וטהור 'נוזלת' ומלכלכת תאי תדר שכנים כמו כתם צבע מרוח."
          - "עיגול שולי הבלוק באמצעות פונקציית חלון (המינג, בלקמן) מחליק את הקצוות, נועל את הדליפה ומספק שיאי תדר צלולים וחדים."
          - "**תובנת הרזולוציה האמיתית**: הוספת אפסים בסוף קובץ הקול (Zero-Padding) יוצרת אינטרפולציה חלקה של הגרף, אך אינה משפרת את הרזולוציה הפיזיקלית האמיתית. כדי להפריד בין שני תווים קרובים מאוד, חובה להקליט את הצליל למשך זמן כולל ארוך יותר $T_{\\text{total}} = N T_s$."
      - title: "מהפכת ה-FFT (האלגוריתם ששינה את פני ההיסטוריה)"
        points:
          - "חישוב ישיר של נוסחת ה-DFT דורש $N^2$ פעולות כפל מרוכבות. עבור בלוק קול צנוע של 1024 דגימות, מדובר ביותר מ-**1,000,000 פעולות בכל שבריר שנייה**—דבר שחנק את המחשבים הראשונים."
          - "בשנת 1965 פירסמו קולי וטוקי את **התמרת פורייה המהירה (FFT)**, המפרקת את החישוב באופן רקורסיבי בין אינדקסים זוגיים לאי-זוגיים (מבנה ה'פרפר' המפורסם)."
          - "ה-FFT קיצץ את הסיבוכיות מ-$O(N^2)$ ל-$O(N \\log_2 N)$. עבור $N=1024$, כמות הפעולות צנחה מ-1,048,576 לכ-**10,240 בלבד**—האצה של **פי 100 ויותר**!"
          - "קפיצת מדרגה עוצרת נשימה זו הפכה את עיבוד האותות מנוסחאות תאורטיות על הלוח לטכנולוגיה המעשית שמניעה את האנושות: תקשורת סלולרית 5G, רשתות Wi-Fi, שידורי וידאו, מכ״מים ומוזיקה בסטרימינג."
