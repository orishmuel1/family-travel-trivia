      - type: multiple_choice
        question: "כיצד מחושב מוצא מערכת LTI, $y[n]$, עבור אות כניסה $x[n]$ ותגובת הלם $h[n]$?"
        options:
          - "באמצעות סכום הקונבולוציה: $\\sum_{k=-\\infty}^{\\infty} x[k] h[n-k]$"
          - "באמצעות כפל אלגברי נקודתי: $x[n] \\cdot h[n]$"
          - "באמצעות גזירת אות הכניסה"
          - "באמצעות חיבור סקלרי: $x[n] + h[n]$"
