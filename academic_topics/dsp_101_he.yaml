    explanation: 'התשובה הנכונה היא: הוספת רעש לבן אקראי זעיר לפני הקוונטיזציה כדי לפרק עיוותים הרמוניים גסים לרחש רך בלתי
      מורגש.'
  - type: multiple_choice
    question: כיצד נקרא תהליך הפחתת קצב הדגימה של קובץ שמע על ידי שמירת כל דגימה ה-$M$ בלבד?
    options:
    - דסימציה
