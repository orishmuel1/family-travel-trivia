  - id: sampling_reconstruction
    title: "3. דגימה ושחזור אותות"
    description: >
      משפט הדגימה של נייקוויסט-שאנון, שכפול ספקטרלי, מניעת עיוותי קיפול (Aliasing), שחזור אידיאלי ואינטרפולציית sinc.
    cards:
      - title: "משפט הדגימה של נייקוויסט-שאנון"
        points:
          - "משפט נייקוויסט-שאנון קובע כי אות רציף חסום-סרט $x(t)$ בעל תדר מרבי $f_{\\max}$ ניתן לשחזור מושלם וחד-ערכי מדגימותיו $x[n] = x(n T_s)$ אם ורק אם תדר הדגימה מקיים $f_s > 2 f_{\\max}$."
          - "קצב הסף $f_{\\text{Nyquist}} = 2 f_{\\max}$ נקרא קצב נייקוויסט (Nyquist Rate); מחצית תדר הדגימה $f_s/2$ נקראת תדר נייקוויסט או תדר הקיפול (Folding Frequency)."
          - "במישור התדר, דגימה באמצעות רכבת הלמים תקופתית משכפלת את הספקטרום הרציף $X(j\\Omega)$ במרווחים שווים לכפולות שלמות של תדר הדגימה: $X_s(j\\Omega) = \\frac{1}{T_s} \\sum_{k=-\\infty}^{\\infty} X(j(\\Omega - k \\Omega_s))$ כאשר $\\Omega_s = \\frac{2\\pi}{T_s}$."
      - title: "תופעת הקיפול (Aliasing) ומסנן אנטי-אליאסינג"
        points:
          - "תופעת הקיפול (Aliasing) מתרחשת כאשר $f_s < 2 f_{\\max}$: העתקי הספקטרום חופפים זה לזה, וגורמים לתדרים גבוהים להתחזות לתדרים נמוכים יותר עקב קיפול סביב $f_s/2$."
          - "הקיפול גורם לאובדן מידע בלתי הפיך: מרגע שתדרים גבוהים התקפלו לתחום הנמוך, שום עיבוד דיגיטלי מאוחר יותר אינו יכול להפריד ביניהם."
          - "מסנן מונע קיפול (Anti-Aliasing Filter - AAF) הוא מסנן אנלוגי מעביר נמוכים (Lowpass) המוצב לפני הממיר מאנלוגי לספרתי (ADC), במטרה לסנן תדרים שמעל $f_s/2$ לפני ביצוע הדגימה."
      - title: "שחזור אידיאלי ואינטרפולציית Sinc"
        points:
          - "שחזור מושלם של האות הרציף מתבצע באמצעות מסנן אנלוגי אידיאלי מעביר נמוכים בעל תדר קטעון $\\Omega_c = \\Omega_s / 2$ והגבר $T_s$."
          - "במישור הזמן, כפל בפונקציית המלבן בתדר שקול לקונבולוציה של הדגימות עם פונקציית sinc רציפה: $x(t) = \\sum_{n=-\\infty}^{\\infty} x[n] \\text{sinc}\\left(\\frac{t - n T_s}{T_s}\\right)$ כאשר $\\text{sinc}(u) = \\frac{\\sin(\\pi u)}{\\pi u}$."
          - "בממירים מעשיים (DAC) מיושם מעגל החזקה מסדר אפס (ZOH - Zero-Order Hold) השומר על ערך מתח קבוע למשך $T_s$, מה שיוצר אות מדרגות המוחלק על ידי מסנן שחזור."
    trivia:
      - type: multiple_choice
        question: "מהו קצב הדגימה המינימלי הנדרש למניעת קיפול (Aliasing) עבור אות שמע המוגבל לתדר מרבי של 20 קילו-הרץ?"
        options:
          - "40 קילו-הרץ (לפחות פי שניים מהתדר המרבי)"
          - "20 קילו-הרץ"
