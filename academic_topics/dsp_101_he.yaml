  - id: z_transform_frequency
    title: "2. התמרת Z וניתוח תדר"
    description: >
      מישור ה-z המרוכב, קטבים כעמודי אוהל של תהודה, אפסים כנעצים משתיקים והמוזיקה של ה-DTFT.
    cards:
      - title: "צעד לתוך המישור המרוכב (סיפורה של התמרת Z)"
        points:
          - "במישור הזמן, שיר הוא רק רצף כרונולוגי של מספרים. אך כדי להבין את אופיו המוזיקלי—אילו צלילים מהדהדים, אילו דועכים ואילו נבלמים—אנו זקוקים למפה גאומטרית עשירה יותר."
          - "התמרת Z הנתונה על ידי $X(z) = \\sum x[n] z^{-n}$ פועלת כעדשה המאפשרת לבחון כיצד האות מגיב לספירלות מרוכבות דועכות וצומחות ($z = r e^{j\\omega}$)."
          - "היתרון האדיר שלה הוא הפיכת פעולות קונבולוציה מסובכות וארוכות בזמן לפעולות כפל אלגבריות פשוטות ומהירות: $Y(z) = H(z) \\cdot X(z)$."
          - "תחום ההתכנסות (ROC) הוא 'אזור הביטחון' במפה שבו הטור האינסופי אינו מתבדר לאינסוף. אם מעגל היחידה ($|z|=1$) נמצא בתוך ה-ROC, מובטח שהמערכת תעבוד ביציבות מושלמת."
      - title: "קטבים ואפסים (עמודי אוהל ונעצים על יריעת גומי)"
        points:
          - "דמיינו את פונקציית התמסורת $H(z)$ כיריעת גומי גמישה ומתוחה מעל שולחן המייצג את מישור ה-z המרוכב."
          - "**קוטב (Pole)** הוא עמוד אוהל המוצב מתחת ליריעה ודוחף אותה מעלה אל האינסוף. כאשר צליל נכנס בתדר הקרוב לקוטב, נוצרת תהודה (רזוננס) צלצולית עזה (כמו נשיפה על פיית בקבוק זכוכית)."
          - "**אפס (Zero)** הוא נעץ הננעץ ביריעה ומצמיד אותה ללוח השולחן ($0$). אם תדר הצליל נוחת בדיוק על אפס, התדר הזה מושתק ונמחק לחלוטין (כמו מסנן Notch המסלק רחש רשת חשמל של 50 הרץ)."
          - "**כלל הזהב של היציבות**: כדי שמסנן סיבתי לא יתפוצץ לעולם, כל עמודי האוהל (הקטבים) חייבים להימצא ממש **בתוך מעגל היחידה** ($|z| < 1$). אם אפילו קוטב אחד יוצא החוצה, ההד יגדל ויתעצם בכל צעד עד לקריסת המערכת."
      - title: "ה-DTFT: טיול לאורך מעגל היחידה"
        points:
          - "אם נטייל לאורך שפתו של מעגל היחידה ($|z| = 1$, על ידי הצבת $z = e^{j\\omega}$), התמרת ה-Z חושפת את **התמרת פורייה בזמן בדיד (DTFT)**: $X(e^{j\\omega}) = \\sum x[n] e^{-j\\omega n}$."
          - "ה-DTFT מציגה את ספקטרום התדרים הרציף של הצליל, מהבאסים העמוקים ביותר (DC, $\\omega=0$) ועד לתדר הבדיד המרבי האפשרי ($\\omega=\\pi$, מחצית קצב הדגימה)."
          - "מדוע ה-DTFT מחזורית במחזור של $2\\pi$? מכיוון שסיבוב של $360^\\circ$ ($2\\pi$ רדיאנים) סביב מעגל היחידה מחזיר אתכם בדיוק לאותה נקודה התחלתית! בעולם הבדיד, תדרים שמעבר ל-$\\pi$ פשוט מתקפלים סביב המעגל."
          - "**פאזה לינארית והשהיית חבורה**: כאשר כל תווי המוזיקה עוברים דרך מסנן באותו זמן השהיה בדיוק, צורת גל השמע נשמרת חדה ומדויקת ללא עיוותי מריחה."
    trivia:
      - type: multiple_choice
