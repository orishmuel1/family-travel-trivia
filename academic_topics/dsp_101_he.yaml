  - id: sampling_reconstruction
    title: "3. דגימה ושחזור אותות"
    description: >
      אשליית גלגל הכרכרה והקיפול הספקטרלי, גבול המהירות של נייקוויסט, שומרי האנטי-אליאסינג וקסם אינטרפולציית ה-sinc.
    cards:
      - title: "סיפור נייקוויסט ואשליית גלגל הכרכרה"
        points:
          - "האם צפיתם פעם במערבון ישן שבו גלגלי כרכרה דוהרת נראים פתאום מאטים, קופאים במקום או אפילו מסתובבים לאחור? האשליה האופטית הזו מתרחשת מכיוון שקצב צילום המצלמה (24 פריימים בשנייה) איטי מדי מכדי לעקוב אחר חישורי הגלגל המהירים."
          - "זוהי תמציתה של תופעת ה-**Aliasing (קיפול תדרים)**: כאשר דוגמים גל מהיר בקצב איטי מדי, נקודות הדגימה יוצרות גל מתחזה בעל תדר נמוך בהרבה שכלל לא היה בצליל המקורי!"
          - "**משפט נייקוויסט-שאנון**: כדי להקליט צליל בעל תדר מרבי $f_{\\max}$ באופן מושלם וללא גלים מתחזים, חובה לדגום בקצב הגדול ממש מפי שניים מאותו תדר: $f_s > 2 f_{\\max}$."
          - "המהירות המינימלית הבטוחה $2 f_{\\max}$ נקראת קצב נייקוויסט. התדר המרבי שמעבד יכול לייצג ($f_s / 2$) נקרא תדר נייקוויסט או תדר הקיפול."
      - title: "שומרי האנטי-אליאסינג (מדוע תוכנה לא יכולה לתקן דגימה שגויה)"
        points:
          - "במישור התדר, דגימה מחזורית משכפלת את הספקטרום המקורי בכל כפולה של $f_s$. כאשר $f_s < 2 f_{\\max}$, השכפולים מתנגשים ופולשים זה לזה כמו גלים בים סוער."
          - "מדוע אי אפשר לתקן עיוות קיפול באמצעות תוכנה לאחר ההקלטה? מכיוון שברגע שההרמוניות הגבוהות של כינור התקפלו על תדרי הבאס של צ'לו, הן מתמזגות לאותם מספרים בדיוק. זה כמו לערבב צבע צהוב וכחול לירוק—שום אלגוריתם אינו יכול להפריד חזרה את הצבע הצהוב המקורי!"
          - "לכן, **מסנן אנטי-אליאסינג (AAF)** חייב לעמוד כמאבטח בתחום האנלוגי *לפני* שבב ה-ADC, ולחתוך ללא רחם כל תדר שמעל $f_s/2$ בטרם תתבצע הדגימה."
          - "זהו ההסבר לתקן ה-CD של 44.1 קילו-הרץ: השמיעה האנושית מגיעה עד 20 קילו-הרץ. כפול מזה הוא 40 קילו-הרץ, מה שמשאיר מרווח ביטחון נוח של 4.1 קילו-הרץ למסננים אנלוגיים מעשיים לדעוך בצורה חלקה."
      - title: "בנייה מחדש של העולם הרציף (קסם גלי ה-Sinc)"
        points:
          - "כיצד משחזרים גל קול אנלוגי רציף וטבעי מאוסף דל של נקודות דיגיטליות? האינטואיציה אומרת שהמידע שבין הנקודות אבד לנצח—אך המתמטיקה מוכיחה שלא!"
          - "שאנון הוכיח שאם נחליף כל נקודת דגימה בודדת ב**גל sinc** עדין $\\text{sinc}(t/T_s) = \\frac{\\sin(\\pi t / T_s)}{\\pi t / T_s}$ ונחבר את כולם, האדוות משתלבות בשלמות מתמטית מופלאה ומשחזרות במדויק של 100% את הגל הרציף המקורי!"
          - "בממירים מעשיים (DAC), שבבים משתמשים במעגל החזקה מסדר אפס (ZOH) השומר על מתח קבוע כמו מדרגות זעירות למשך $T_s$, ולאחריו מסנן שחזור אנלוגי המלטש את המדרגות למוזיקה חלקה."
