- id: z_transform_frequency
  title: 2. התמרת Z וניתוח תדר
  description: 'המרת לולאות זמן לאלגברה פשוטה, הבנת קטבים (תהודה) ואפסים (השתקה), וניתוח תדרים על מעגל היחידה.

    '
  cards:
  - title: מדוע התמרת Z? הפיכת לולאות לאלגברה פשוטה
    figure:
      title: מישור ה-Z המרוכב ומעגל היחידה
      svg: "<svg viewBox=\"0 0 400 220\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-height:220px;\">\n  <line\
        \ x1=\"20\" y1=\"110\" x2=\"380\" y2=\"110\" stroke=\"currentColor\" stroke-width=\"1.5\" opacity=\"0.4\"/>\n  <line\
