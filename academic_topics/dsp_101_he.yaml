  - id: z_transform_frequency
    title: "2. התמרת Z וניתוח תדר"
    description: >
      מישור התדר המרוכב, תחום התכנסות (ROC), ניתוח קטבים ואפסים, פונקציית תמסורת והתמרת פורייה בזמן בדיד (DTFT).
    cards:
      - title: "התמרת Z ותחום ההתכנסות (ROC)"
        points:
          - "התמרת Z הדו-צדדית ממפה סדרה בדידה $x[n]$ למישור המרוכב של המשתנה $z = r e^{j\\omega}$: $X(z) = \\mathcal{Z}\\{x[n]\\} = \\sum_{n=-\\infty}^{\\infty} x[n] z^{-n}$."
          - "תחום ההתכנסות (ROC - Region of Convergence) הוא קבוצת כל המספרים המרוכבים $z$ שעבורם טור החזקות $\\sum |x[n] z^{-n}|$ מתכנס בהחלט."
          - "ה-ROC במישור ה-z הוא תמיד טבעת מעגלית: $r_R < |z| < r_L$, שמרכזה בראשית הצירים."
          - "תכונות מרכזיות של ה-ROC: (1) ה-ROC לעולם אינו מכיל קטבים; (2) עבור אות ימני סיבתי, ה-ROC משתרע מהקוטב החיצוני ביותר כלפי חוץ: $|z| > r_{\\max}$; (3) עבור אות שמאלי, ה-ROC משתרע מהקוטב הפנימי ביותר כלפי פנים: $|z| < r_{\\min}$."
          - "מערכת LTI היא יציבה במובן BIBO אם ורק אם תחום ההתכנסות שלה מכיל את מעגל היחידה $|z| = 1$."
      - title: "קטבים, אפסים ופונקציית התמסורת H(z)"
        points:
          - "פונקציית התמסורת הרציונלית מוגדרת כיחס המוצא לכניסה: $H(z) = \\frac{Y(z)}{X(z)} = \\frac{\\sum_{m=0}^M b_m z^{-m}}{\\sum_{k=0}^N a_k z^{-k}} = b_0 \\frac{\\prod_{m=1}^M (1 - c_m z^{-1})}{\\prod_{k=1}^N (1 - d_k z^{-1})}$."
          - "אפסים ($c_m$) הם ערכי $z$ שבהם $H(z) = 0$; קטבים ($d_k$) הם ערכי $z$ שבהם $H(z) \\to \\infty$."
          - "מערכת LTI סיבתית היא יציבה במובן BIBO אם ורק אם כל הקטבים שלה נמצאים ממש בתוך מעגל היחידה ($|d_k| < 1$ לכל $k$)."
          - "קטבים הקרובים למעגל היחידה יוצרים שיאי תהודה (רזוננס) בהגבר התדר; אפסים הממוקמים על מעגל היחידה או בסמוך לו יוצרים ניחות מוחלט (Notch / Null)."
      - title: "התמרת פורייה בזמן בדיד (DTFT)"
        points:
          - "ה-DTFT מייצגת את תכולת התדר של אותות בדידים: $X(e^{j\\omega}) = \\sum_{n=-\\infty}^{\\infty} x[n] e^{-j\\omega n}$."
          - "ה-DTFT היא למעשה התמרת Z המוערכת על גבי מעגל היחידה: $X(e^{j\\omega}) = X(z)|_{z = e^{j\\omega}}$."
          - "ה-DTFT היא תמיד מחזורית בתדר המנורמל $\\omega$ עם מחזור בסיסי של $2\\pi$: $X(e^{j(\\omega + 2\\pi)}) = X(e^{j\\omega})$."
          - "התמרת DTFT הפוכה משחזרת את האות בזמן: $x[n] = \\frac{1}{2\\pi} \\int_{-\\pi}^{\\pi} X(e^{j\\omega}) e^{j\\omega n} d\\omega$."
          - "משפט פרסבל (Parseval) קובע שימור אנרגיה בין תחום הזמן לתחום התדר: $\\sum_{n=-\\infty}^{\\infty} |x[n]|^2 = \\frac{1}{2\\pi} \\int_{-\\pi}^{\\pi} |X(e^{j\\omega})|^2 d\\omega$."
    trivia:
      - type: multiple_choice
        question: "כיצד מתקשרת התמרת פורייה בזמן בדיד (DTFT) להתמרת Z של אותו אות?"
        options:
          - "ה-DTFT היא התמרת Z המוערכת על גבי מעגל היחידה ($z = e^{j\\omega}$)"
          - "ה-DTFT היא התמרת Z על הציר הממשי בלבד"
          - "ה-DTFT היא הנגזרת של התמרת Z לפי z"
          - "אין קשר ישיר בין השתיים"
        correct: 0
      - type: multiple_choice
        question: "היכן חייבים להימצא כל הקטבים של מערכת LTI סיבתית כדי שהיא תהיה יציבה (BIBO)?"
        options:
          - "ממש בתוך מעגל היחידה במישור ה-z ($|z| < 1$)"
          - "מחוץ למעגל היחידה ($|z| > 1$)"
          - "בדיוק על הציר המדומה"
          - "בחצי המישור השמאלי של מישור ה-s"
        correct: 0
      - type: multiple_choice
        question: "מהו המחזור היסודי של התמרת ה-DTFT, $X(e^{j\\omega})$, ביחס לתדר $\\omega$?"
        options:
          - "$2\\pi$ רדיאנים"
          - "$\\pi$ רדיאנים"
          - "$4\\pi$ רדיאנים"
          - "היא אינה מחזורית"
        correct: 0
      - type: multiple_choice
        question: "מהו תחום ההתכנסות (ROC) עבור סדרה סיבתית ימנית בעלת קוטב ב-$z = a$?"
        options:
          - "$|z| > |a|$"
          - "$|z| < |a|$"
          - "כל מישור ה-z כולל הראשית"
          - "מעגל היחידה בלבד"
        correct: 0
      - type: multiple_choice
        question: "האם קוטב של פונקציית תמסורת $H(z)$ יכול להימצא בתוך תחום ההתכנסות (ROC)?"
        options:
          - "לא, ה-ROC לעולם אינו מכיל קטבים"
          - "כן, אם המערכת יציבה"
          - "כן, אם מדובר במסנן FIR"
          - "רק אם ריבוי הקוטב גדול מ-2"
        correct: 0
      - type: multiple_choice
        question: "איזה אלמנט גאומטרי במישור ה-z גורם להתאפסות מוחלטת של ההגבר בתדר מסוים $\\omega_0$?"
        options:
          - "אפס המוצב בדיוק על מעגל היחידה ב-$z = e^{j\\omega_0}$"
          - "קוטב בראשית הצירים"
          - "קוטב על מעגל היחידה"
          - "אפס באינסוף"
        correct: 0
      - type: multiple_choice
        question: "מהי התמרת ה-Z של אות מוזז בזמן $x[n - k]$ במונחי $X(z)$?"
        options:
          - "$z^{-k} X(z)$"
          - "$z^{+k} X(z)$"
          - "$k \\cdot z^{-1} X(z)$"
          - "$X(z - k)$"
        correct: 0
      - type: multiple_choice
        question: "מה קובע משפט פרסבל (Parseval) עבור אותות בזמן בדיד?"
        options:
          - "שימור ושקילות האנרגיה בין תחום הזמן לתחום התדר"
          - "לינאריות הפאזה בכל תחומי המעבר"
          - "את מספר סיביות הקוונטיזציה הנדרשות"
          - "את גבול היציבות של מסננים רקורסיביים"
        correct: 0
      - type: multiple_choice
        question: "מהי התמרת ה-Z של הלם היחידה $\\delta[n]$?"
        options:
