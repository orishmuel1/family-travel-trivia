  - id: digital_filter_design
    title: "4. תכנון מסננים ספרתיים"
    description: >
      ארכיטקטורות FIR לעומת IIR, תכנון מסנני FIR בעלי פאזה לינארית בשיטת החלונות, אופטימיזציית פארקס-מקלילן ותכנון מסנני IIR בהתמרת בילינאר.
    cards:
      - title: "ארכיטקטורות FIR לעומת IIR ושיקולי תכנון"
        figure:
          title: "מבני מסננים ספרתיים: FIR לעומת IIR"
          svg: >
            <svg viewBox="0 0 500 180" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-height:180px;">
              <!-- FIR Structure -->
              <text x="20" y="20" font-size="11" font-weight="bold" fill="#6366f1">FIR: קו השהיה מוזן קדימה ללא משוב (All-Zero)</text>
              <line x1="40" y1="45" x2="260" y2="45" stroke="currentColor" stroke-width="1.5"/>
              <rect x="80" y="35" width="30" height="20" fill="currentColor" fill-opacity="0.08" stroke="#6366f1"/>
              <text x="95" y="49" font-size="9" fill="currentColor" text-anchor="middle">z⁻¹</text>
              <rect x="150" y="35" width="30" height="20" fill="currentColor" fill-opacity="0.08" stroke="#6366f1"/>
              <text x="165" y="49" font-size="9" fill="currentColor" text-anchor="middle">z⁻¹</text>
              <line x1="60" y1="45" x2="60" y2="75" stroke="#6366f1"/>
              <line x1="130" y1="45" x2="130" y2="75" stroke="#6366f1"/>
              <line x1="200" y1="45" x2="200" y2="75" stroke="#6366f1"/>
              <circle cx="60" cy="75" r="8" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1"/><text x="60" y="78" font-size="8" fill="currentColor" text-anchor="middle">b0</text>
              <circle cx="130" cy="75" r="8" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1"/><text x="130" y="78" font-size="8" fill="currentColor" text-anchor="middle">b1</text>
              <circle cx="200" cy="75" r="8" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1"/><text x="200" y="78" font-size="8" fill="currentColor" text-anchor="middle">b2</text>
              <line x1="60" y1="83" x2="240" y2="83" stroke="currentColor" stroke-width="1.5"/>
              <text x="260" y="86" font-size="10" font-weight="bold" fill="currentColor">y[n]</text>

              <!-- IIR Structure -->
              <text x="20" y="115" font-size="11" font-weight="bold" fill="#0284c7">IIR: מבנה רקורסיבי בעל חוגי משוב (Poles &amp; Zeros)</text>
              <rect x="180" y="125" width="140" height="45" rx="6" fill="currentColor" fill-opacity="0.06" stroke="#0284c7" stroke-width="1.5"/>
              <text x="250" y="145" font-size="10" font-weight="bold" fill="currentColor" text-anchor="middle">Feedforward (b) +</text>
              <text x="250" y="160" font-size="10" font-weight="bold" fill="#e11d48" text-anchor="middle">Feedback Loop (a)</text>
            </svg>
          caption: "מסנני FIR פועלים ללא חוגי משוב (יציבים ללא תנאי, בעלי פאזה לינארית). מסנני IIR משלבים חוגי משוב רקורסיביים (סדר נמוך, דורשים בקרת יציבות)."
        points:
          - "מסנני FIR (תגובת הלם סופית) פועלים ללא משוב רקורסיבי: $y[n] = \\sum_{k=0}^{M} b_k x[n-k]$. כל קטביהם ממוקמים בראשית $z=0$, מה שהופך אותם ליציבים ללא תנאי ללא תלות בשגיאות קוונטיזציה."
          - "מסנני FIR מסוגלים להשיג פאזה לינארית מדויקת (השהיית חבורה קבועה) כאשר מקדמיהם סימטריים או אנטי-סימטריים ($h[n] = \\pm h[M-n]$), ללא עיוותי מריחת פאזה."
          - "מסנני IIR (תגובת הלם אינסופית) משלבים חוגי משוב: $y[n] = \\sum_{m=0}^M b_m x[n-m] - \\sum_{k=1}^N a_k y[n-k]$. הם משיגים שיפוע קטעון חד בסדר מסנן נמוך בהרבה מ-FIR, אך סובלים מפאזה לא-לינארית ועלולים לאבד יציבות אם קטבים נודדים מחוץ למעגל היחידה."
      - title: "תכנון מסנני FIR בשיטת החלונות ואופטימיזציית Minimax"
        points:
          - "מסננים סלקטיביים אידיאליים הם בעלי תגובת הלם אינסופית ואי-סיבתית: $h_{\\text{ideal}}[n] = \\frac{\\sin(\\omega_c (n - M/2))}{\\pi (n - M/2)}$."
          - "שיטת החלונות קוטמת את $h_{\\text{ideal}}[n]$ באמצעות פונקציית חלון: $h[n] = h_{\\text{ideal}}[n] \\cdot w[n]$. קטימה מלבנית חדה יוצרת את תופעת גיבס (Gibbs Phenomenon), עם אדוות וניחות קבוע של $-13\\text{ dB}$ בלבד בפס החסימה."
          - "חלונות מדורגים מבצעים פשרה בין רוחב תחום המעבר לניחות אונות הצד: חלון המינג ($-43\\text{ dB}$ אונה ראשונה, $-53\\text{ dB}$ בפס החסימה), בלקמן ($-58\\text{ dB}$ אונה ראשונה, $-74\\text{ dB}$ בפס החסימה) וקייזר (בעל פרמטר מתכוונן $\\beta$)."
          - "אלגוריתם פארקס-מקלילן (Parks-McClellan / Remez Exchange) מתכנן מסנני FIR אופטימליים בעלי פאזה לינארית ואדווה שווה (Equiripple) הממזערים את שגיאת צ'בישב המרבית."
      - title: "תכנון מסנני IIR באמצעות התמרת בילינאר"
        points:
          - "מסנני IIR מתוכננים לרוב על ידי המרת אבות-טיפוס אנלוגיים קלאסיים (באטרוורת', צ'בישב מסוג 1 ו-2, אליפטי) למישור ה-z הבדיד."
          - "התמרת בילינאר ממפה את מישור ה-s האנלוגי למישור ה-z לפי $s = \\frac{2}{T} \\frac{1 - z^{-1}}{1 + z^{-1}}$, וממפה את כל הציר המדומה $j\\Omega$ על מעגל היחידה $|z|=1$, ללא עיוותי קיפול."
          - "מכיוון שההתמרה דוחסת את ציר התדר באופן לא-לינארי ($\\omega = 2 \\arctan(\\Omega T / 2)$), חובה לבצע תיקון מקדים (Pre-Warping) לתדרי המטרה: $\\Omega = \\frac{2}{T} \\tan(\\omega / 2)$."
          - "למניעת רגישות מקדמים ותנודות מחזור גבול במעבדי נקודה קבועה, מסנני IIR מסדר גבוה ממומשים כשרשרת של מקטעים מסדר שני (Biquads)."
    trivia:
      - type: multiple_choice
        question: "מדוע מסנני FIR ספרתיים הם יציבים ללא תנאי?"
        options:
