  - id: dft_and_fft_algorithms
    title: "5. התמרת פורייה בדידה (DFT) ואלגוריתמים מהירים (FFT)"
    description: >
      התמרת פורייה הבדידה, קונבולוציה מעגלית לעומת לינארית, רזולוציה ספקטרלית ודליפת חלונות, ואלגוריתם ה-FFT של קולי-טוקי.
    cards:
      - title: "התמרת פורייה הבדידה (DFT)"
        figure:
          title: "מבנה פעולת הפרפר (Butterfly) באלגוריתם Radix-2 FFT"
          svg: >
            <svg viewBox="0 0 450 140" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-height:140px;">
              <text x="30" y="45" font-size="12" font-weight="bold" fill="currentColor">A</text>
              <text x="30" y="105" font-size="12" font-weight="bold" fill="currentColor">B</text>
              <line x1="50" y1="40" x2="350" y2="40" stroke="currentColor" stroke-width="2"/>
              <line x1="50" y1="100" x2="350" y2="100" stroke="currentColor" stroke-width="2"/>
              <line x1="100" y1="100" x2="300" y2="40" stroke="#6366f1" stroke-width="2"/>
              <line x1="100" y1="40" x2="300" y2="100" stroke="#6366f1" stroke-width="2"/>
              <circle cx="150" cy="100" r="14" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="1.5"/>
              <text x="150" y="104" font-size="10" font-weight="bold" fill="#0284c7" text-anchor="middle">WN^k</text>
              <text x="280" y="80" font-size="11" font-weight="bold" fill="#e11d48">-1</text>
              <text x="365" y="45" font-size="12" font-weight="bold" fill="currentColor">A + WN^k · B</text>
              <text x="365" y="105" font-size="12" font-weight="bold" fill="currentColor">A - WN^k · B</text>
            </svg>
          caption: "פעולת הפרפר הבסיסית ב-Radix-2 FFT המשלבת שתי כניסות מרוכבות עם מקדם הסיבוב $W_N^k = e^{-j 2\\pi k / N}$."
        points:
          - "התמרת פורייה הבדידה (DFT) ממירה סדרה סופית של $N$ דגימות זמן ל-$N$ דגימות תדר בדידות: $X[k] = \\sum_{n=0}^{N-1} x[n] W_N^{k n}$ כאשר $W_N = e^{-j \\frac{2\\pi}{N}}$ הוא מקדם הסיבוב (Twiddle Factor)."
          - "ההתמרה ההפוכה (IDFT) משחזרת את הסדרה: $x[n] = \\frac{1}{N} \\sum_{k=0}^{N-1} X[k] W_N^{-k n}$."
          - "ה-DFT באורך $N$ דוגמת את ספקטרום ה-DTFT הרציף $X(e^{j\\omega})$ ב-$N$ נקודות מרווחות באופן אחיד לאורך מעגל היחידה: $\\omega_k = \\frac{2\\pi k}{N}$ עבור $k = 0, 1, \\dots, N-1$."
          - "מכיוון שה-DFT מתייחסת לאותות כאילו הם מחזוריים במחזור $N$, כפל של שתי התמרות DFT בתדר שקול לקונבולוציה מעגלית (מחזורית) בזמן: $y[n] = (x_1 \\circledast x_2)[n] = \\sum_{m=0}^{N-1} x_1[m] x_2[((n - m))_N]$."
          - "כדי לחשב קונבולוציה לינארית של סדרות באורכים $L$ ו-$P$ באמצעות ה-DFT ללא עיוותי קיפול מעגלי, חובה לרפד את שתי הסדרות באפסים לאורך מינימלי $N \\ge L + P - 1$."
      - title: "רזולוציה ספקטרלית, דליפה ופונקציות חלון"
        points:
          - "הרזולוציה הספקטרלית הפיזיקלית נקבעת על ידי משך זמן המדידה הכולל $T_{\\text{total}} = N T_s$: ההפרדה המינימלית הניתנת לאבחנה בין שני תדרי סינוס היא $\\Delta f = 1 / T_{\\text{total}} = f_s / N$."
          - "ריפוד באפסים (Zero-Padding) מגדיל את צפיפות דגימות התדר (אינטרפולציה חלקה של תצוגת ה-DTFT), אך אינו משפר את כושר ההפרדה הפיזיקלי בין שני תדרים קרובים."
          - "דליפה ספקטרלית (Spectral Leakage) מתרחשת כאשר תדר אינו נופל במדויק על כפולה שלמה של $f_s/N$, מה שיוצר אי-רציפות בקצוות המפזרת אנרגיה לתאי תדר סמוכים."
          - "הפעלת חלונות מדורגים (המינג, בלקמן) מקטינה את דליפת אונות הצד במחיר הרחבת רוחב האונה הראשית."
      - title: "אלגוריתם התמרת פורייה המהירה (FFT)"
        points:
          - "חישוב ישיר של ה-DFT באורך $N$ דורש $N^2$ פעולות כפל וחיבור מרוכבות, דבר שהופך לבלתי מעשי עבור $N$ גדול."
          - "אלגוריתם ה-FFT של קולי-טוקי בבסיס 2 (Radix-2 DIT) מפרק באופן רקורסיבי את ה-DFT של $N$ נקודות לשתי התמרות DFT באורך $N/2$ (דגימות זוגיות ואי-זוגיות)."
          - "ה-FFT מקצץ את הסיבוכיות החישובית מ-$O(N^2)$ ל-$O(N \\log_2 N)$. עבור $N=1024$, מספר הפעולות צונח מ-1,048,576 לכ-10,240 בלבד (האצה של פי 100 ויותר)."
          - "סינון מהיר של בלוקים על זרם אודיו רציף ממומש באמצעות שיטות Overlap-Add (OLA) או Overlap-Save (OLS)."
