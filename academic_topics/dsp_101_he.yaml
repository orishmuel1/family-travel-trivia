- id: dft_and_fft_algorithms
  title: 5. התמרת פורייה בדידה (DFT) ואלגוריתמים מהירים (FFT)
  description: 'המנסרה החישובית: פירוק צורות גל מורכבות לרכיבי סינוס טהורים, רזולוציה ספקטרלית ומהפכת ה-FFT של קולי-טוקי.

    '
  cards:
  - title: 'ה-DFT: המנסרה הדיגיטלית של המחשוב המודרני'
    figure:
      title: מבנה פעולת הפרפר (Butterfly) באלגוריתם Radix-2 FFT
      svg: "<svg viewBox=\"0 0 450 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-height:140px;\">\n  <text\
        \ x=\"30\" y=\"45\" font-size=\"12\" font-weight=\"bold\" fill=\"currentColor\">A</text>\n  <text x=\"30\" y=\"105\"\
        \ font-size=\"12\" font-weight=\"bold\" fill=\"currentColor\">B</text>\n  <line x1=\"50\" y1=\"40\" x2=\"350\" y2=\"\
        40\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <line x1=\"50\" y1=\"100\" x2=\"350\" y2=\"100\" stroke=\"currentColor\"\
        \ stroke-width=\"2\"/>\n  <line x1=\"100\" y1=\"100\" x2=\"300\" y2=\"40\" stroke=\"#6366f1\" stroke-width=\"2\"/>\n\
        \  <line x1=\"100\" y1=\"40\" x2=\"300\" y2=\"100\" stroke=\"#6366f1\" stroke-width=\"2\"/>\n  <circle cx=\"150\"\
        \ cy=\"100\" r=\"14\" fill=\"#0284c7\" fill-opacity=\"0.2\" stroke=\"#0284c7\" stroke-width=\"1.5\"/>\n  <text x=\"\
        150\" y=\"104\" font-size=\"10\" font-weight=\"bold\" fill=\"#0284c7\" text-anchor=\"middle\">WN^k</text>\n  <text\
        \ x=\"280\" y=\"80\" font-size=\"11\" font-weight=\"bold\" fill=\"#e11d48\">-1</text>\n  <text x=\"365\" y=\"45\"\
        \ font-size=\"12\" font-weight=\"bold\" fill=\"currentColor\">A + WN^k · B</text>\n  <text x=\"365\" y=\"105\" font-size=\"\
        12\" font-weight=\"bold\" fill=\"currentColor\">A - WN^k · B</text>\n</svg>\n"
      caption: פעולת הפרפר הבסיסית ב-Radix-2 FFT המשלבת שתי תת-בעיות באמצעות מקדם הסיבוב $W_N^k = e^{-j 2\pi k / N}$ להשגת
        מהירות $O(N \log_2 N)$.
    points:
    - בדיוק כפי שמנסרת זכוכית מפרקת את אור השמש הלבן לקשת צבעים, **התמרת פורייה בדידה (DFT)** מפרקת צורת גל קול לרכיבי תדרי
      הסינוס הטהורים המרכיבים אותה.
    - 'בהינתן בלוק של $N$ דגימות זמן $x[n]$, ה-DFT מחשבת את המשרעת והפאזה המדויקות של $N$ תאי תדר בדידים: $X[k] = \sum_{n=0}^{N-1}
      x[n] W_N^{k n}$ כאשר $W_N = e^{-j \frac{2\pi}{N}}$ הוא מקדם הסיבוב (Twiddle Factor).'
    - זהו המנגנון שמאפשר ל-Spotify להציג עמודות אקולייזר גרפיות, ל-Shazam לזהות טביעת אצבע קולית במסעדה רועשת תוך 3 שניות,
      ולתחנות סלולר 5G לפענח אותות רדיו בשיטת OFDM.
    - מכיוון שה-DFT מתייחסת לבלוק של $N$ דגימות כאילו הוא חוזר על עצמו במחזוריות אינסופית, כפל של שתי התמרות DFT בתדר יוצר
      **קונבולוציה מעגלית (מחזורית)** בזמן. כדי לחשב הדים פיזיקליים לינאריים, מרפדים את האותות באפסים (Zero-Padding) לאורך
      $N \ge L + P - 1$.
  - title: דליפה ספקטרלית והמשמעות האמיתית של רזולוציה
    points:
    - אם צליל מוזיקלי אינו משלים מספר מחזורים שלם ומדויק בתוך חלון ההקלטה שלנו, הקצוות הפתאומיים בתחילת החלון ובסופו פועלים
      כקפיצת אי-רציפות חדה.
    - 'קפיצה זו יוצרת **דליפה ספקטרלית (Spectral Leakage)**: אנרגיה מתו בודד וטהור ''נוזלת'' ומלכלכת תאי תדר שכנים כמו כתם
      צבע מרוח.'
    - עיגול שולי הבלוק באמצעות פונקציית חלון (המינג, בלקמן) מחליק את הקצוות, נועל את הדליפה ומספק שיאי תדר צלולים וחדים.
    - '**תובנת הרזולוציה האמיתית**: הוספת אפסים בסוף קובץ הקול (Zero-Padding) יוצרת אינטרפולציה חלקה של תצוגת הגרף, אך אינה
      משפרת את הרזולוציה הפיזיקלית האמיתית. כושר ההפרדה הפיזיקלי האמיתי בין שני תדרים קרובים נקבע אך ורק על פי משך זמן ההקלטה
