      שמעל $f_s/2$ טרם ביצוע הדגימה.
  - type: multiple_choice
    question: אם צליל בתדר 7 קילו-הרץ נדגם בקצב של 10 קילו-הרץ (מתחת לקצב נייקוויסט הנדרש של 14 קילו-הרץ), באיזה תדר שגוי
      הוא יופיע?
    options:
    - 3 קילו-הרץ
