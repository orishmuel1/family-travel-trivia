    points:
    - 'בטבע, כל האותות הם רציפים: קול הוא תנודות לחץ באוויר, אור הוא גל אלקטרומגנטי ומיקרופון מייצר מתח חשמלי רציף $x(t)$.
      האתגר במעגלים אנלוגיים הוא שכל רכיב, כבל ומגבר מוסיפים רעש תרמי ועיוותים בלתי נמנעים.'
    - 'עיבוד אותות ספרתי (DSP) פותר זאת על ידי המרת הגל הרציף למערך סדור של מספרים $x[n]$. שעון חומרה מפעיל ממיר אנלוגי-לספרתי
      (ADC) בכל $T_s$ שניות (זמן מחזור הדגימה), ורושם את המתח המדויק כמספר בזיכרון: $x[n] = x(n T_s)$.'
    - האינדקס $n$ הוא מונה שלם פשוט ($n = 0, 1, 2, 3, \dots$) המצביע על מיקום הדגימה במערך. קצב הדגימה $f_s = 1/T_s$ קובע
      כמה דגימות נרשמות בשנייה (למשל, תקן שמע מקליט $44,100\text{ דגימות/שנייה}$).
    - 'אבן הבניין הבסיסית של עולם האותות הבדידים היא **הלם היחידה** $\delta[n]$: מערך המכיל ערך של 1 באינדקס $n=0$ ואפס בכל
      מקום אחר. כל אות מורכב $x[n]$ ניתן לפירוק כסכום מדויק של הלמים מוזזים ומדורגים: $x[n] = \sum x[k] \delta[n-k]$.'
    - '**מדרגת היחידה** $u[n]$ מייצגת כניסה קבועה של 1 עבור כל $n \ge 0$ (ואפס לפני כן). הקשר בין המדרגה להלם הוא הפרש בדיד
      פשוט: $\delta[n] = u[n] - u[n-1]$.'
  - title: 'מערכות LTI וקונבולוציה: כיצד מערכות מעבדות אותות'
    figure:
      title: אפיון מערכת LTI על ידי תגובת הלם וקונבולוציה
      svg: "<svg viewBox=\"0 0 500 120\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-height:120px;\">\n  <rect\
        \ x=\"180\" y=\"25\" width=\"140\" height=\"70\" rx=\"10\" fill=\"currentColor\" fill-opacity=\"0.06\" stroke=\"#6366f1\"\
        \ stroke-width=\"2\"/>\n  <text x=\"250\" y=\"55\" font-size=\"13\" font-weight=\"bold\" fill=\"currentColor\" text-anchor=\"\
        middle\">LTI System</text>\n  <text x=\"250\" y=\"75\" font-size=\"12\" fill=\"#6366f1\" text-anchor=\"middle\">h[n]\
        \ (זיכרון)</text>\n  <line x1=\"60\" y1=\"60\" x2=\"175\" y2=\"60\" stroke=\"currentColor\" stroke-width=\"2\"/>\n\
        \  <polygon points=\"175,60 165,55 165,65\" fill=\"currentColor\"/>\n  <text x=\"110\" y=\"48\" font-size=\"12\" font-weight=\"\
        bold\" fill=\"currentColor\" text-anchor=\"middle\">x[n] (כניסה)</text>\n  <line x1=\"325\" y1=\"60\" x2=\"435\" y2=\"\
        60\" stroke=\"currentColor\" stroke-width=\"2\"/>\n  <polygon points=\"440,60 430,55 430,65\" fill=\"currentColor\"\
        />\n  <text x=\"385\" y=\"48\" font-size=\"12\" font-weight=\"bold\" fill=\"currentColor\" text-anchor=\"middle\"\
        >y[n] = x[n] * h[n]</text>\n</svg>\n"
      caption: אם מערכת היא לינארית ואינה משתנה בזמן (LTI), תגובתה להלם יחיד $h[n]$ מאפיינת אותה באופן מלא ומאפשרת לחשב את
        המוצא לכל אות כניסה באמצעות קונבולוציה.
    points:
    - מסנן שמע, אקוסטיקה של חדר או חיישן מוגדרים כ'מערכת' המקבלת מערך כניסה $x[n]$ ומייצרת מערך מוצא $y[n]$.
    - 'שתי תכונות מפתח הופכות מערכות לניתנות לניתוח ולחיזוי: **לינאריות** (הכפלת עוצמת הכניסה מכפילה את המוצא, וחיבור שני
      צלילים שקול לחיבור התגובות שלהם) ו**אי-תלות בזמן** (האלגוריתם מפיק אותה תוצאה בדיוק בין אם נפעיל אותו בשעה 9:00 או בשעה
      9:05).'
    - 'במערכת לינארית ובלתי משתנה בזמן (**מערכת LTI**), נוכל לגלות את כל התנהגותה על ידי בדיקה פשוטה אחת: נזין אליה הלם יחיד
      $\delta[n]$. סדרת המוצא שתתקבל נקראת **תגובת ההלם** $h[n]$ (המייצגת את זיכרון המערכת).'
    - מדוע $h[n]$ כה רבת עוצמה? כי כל אות כניסה $x[n]$ הוא רצף של הלמים בדידים בגבהים שונים. בגלל הלינאריות, אות המוצא $y[n]$
      הוא פשוט סכום כל תגובות ההלם שנפרסו לאורך הזמן.
    - 'פעולה חישובית זו נקראת **קונבולוציה (קיפול אותות)**: $y[n] = (x * h)[n] = \sum_{k=-\infty}^{\infty} x[k] h[n-k]$. בקוד
      תוכנה, זוהי לולאת חלון רץ המכפילה דגימות כניסה קודמות במשקולות של תגובת ההלם וסוכמת אותן.'
  - title: משוואות הפרשים, סיבתיות וכלל היציבות
    points:
    - 'בקוד ובשבבי חומרה, מסננים ממומשים כ**משוואות הפרשים**: $y[n] = \sum_{m=0}^M b_m x[n-m] - \sum_{k=1}^N a_k y[n-k]$.
      זוהי לולאה ישירה המחשבת כל דגימה חדשה משילוב של דגימות כניסה אחרונות ותוצאות מוצא קודמות.'
    - '**סיבתיות (Causality)** פירושה שהמערכת מכבדת את ציר הזמן: מעבד שמע בזמן אמת אינו יכול להגיב לצליל שטרם הושמע. במונחי
      תגובת ההלם, המוצא חייב להיות אפס לפני הגעת ההלם: $h[n] = 0$ עבור כל $n < 0$.'
    - '**יציבות BIBO (כניסה חסומה - מוצא חסום)** מבטיחה שהמערכת לא תתבדר או תתפוצץ: אם נזין אות בעל משרעת סופית, המוצא יישאר
      תמיד חסום ולא ישאף לאינסוף.'
    - 'מערכת LTI מובטחת להיות יציבה BIBO אם ורק אם סכום ערכיה המוחלטים של תגובת ההלם הוא מספר סופי: $\sum_{n=-\infty}^{\infty}
      |h[n]| < \infty$. אם תגובת המערכת דועכת לאפס לאורך זמן, היא בטוחה ויציבה.'
