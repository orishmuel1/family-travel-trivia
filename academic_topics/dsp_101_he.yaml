        options:
          - "תופעת גיבס (Gibbs Phenomenon), הגורמת לאדוות בולטות וניחות ירוד של $-13\\text{ dB}$ בלבד"
          - "המסנן הופך לבלתי לינארי לחלוטין"
          - "קטבי המסנן יוצאים מחוץ למעגל היחידה"
