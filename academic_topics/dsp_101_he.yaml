title: עיבוד אותות ספרתי (DSP 101)
description: 'מדריך הנדסי מעמיק מיסודות ראשונים: כיצד גלים פיזיקליים הופכים למספרים בדידים, כיצד מסננים מעצבים צליל וכיצד
  אלגוריתמי פורייה מהירים (FFT) מנתחים ספקטרום תדרים.

  '
