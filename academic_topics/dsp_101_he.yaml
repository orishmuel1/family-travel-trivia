- id: digital_filter_design
  title: 4. תכנון מסננים ספרתיים
  description: 'פיסול צלילים: הביטחון המוחלט של מסנני FIR כממוצע נע, עוצמת חוגי המשוב של מסנני IIR, אומנות החלונות והמרת מסננים
    אנלוגיים.

    '
  cards:
  - title: 'מסנני FIR לעומת IIR: שתי ארכיטקטורות המפתח'
    figure:
      title: מבנה מסנן FIR מוזן-קדימה לעומת מסנן IIR רקורסיבי
      svg: "<svg viewBox=\"0 0 500 180\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-height:180px;\">\n  <text\
        \ x=\"20\" y=\"20\" font-size=\"11\" font-weight=\"bold\" fill=\"#6366f1\">FIR: קו השהיה מוזן קדימה ללא חוג משוב</text>\n\
        \  <line x1=\"40\" y1=\"45\" x2=\"260\" y2=\"45\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <rect x=\"80\"\
        \ y=\"35\" width=\"30\" height=\"20\" fill=\"currentColor\" fill-opacity=\"0.08\" stroke=\"#6366f1\"/>\n  <text x=\"\
        95\" y=\"49\" font-size=\"9\" fill=\"currentColor\" text-anchor=\"middle\">z⁻¹</text>\n  <rect x=\"150\" y=\"35\"\
        \ width=\"30\" height=\"20\" fill=\"currentColor\" fill-opacity=\"0.08\" stroke=\"#6366f1\"/>\n  <text x=\"165\" y=\"\
        49\" font-size=\"9\" fill=\"currentColor\" text-anchor=\"middle\">z⁻¹</text>\n  <line x1=\"60\" y1=\"45\" x2=\"60\"\
        \ y2=\"75\" stroke=\"#6366f1\"/>\n  <line x1=\"130\" y1=\"45\" x2=\"130\" y2=\"75\" stroke=\"#6366f1\"/>\n  <line\
        \ x1=\"200\" y1=\"45\" x2=\"200\" y2=\"75\" stroke=\"#6366f1\"/>\n  <circle cx=\"60\" cy=\"75\" r=\"8\" fill=\"#6366f1\"\
        \ fill-opacity=\"0.2\" stroke=\"#6366f1\"/><text x=\"60\" y=\"78\" font-size=\"8\" fill=\"currentColor\" text-anchor=\"\
        middle\">b0</text>\n  <circle cx=\"130\" cy=\"75\" r=\"8\" fill=\"#6366f1\" fill-opacity=\"0.2\" stroke=\"#6366f1\"\
        /><text x=\"130\" y=\"78\" font-size=\"8\" fill=\"currentColor\" text-anchor=\"middle\">b1</text>\n  <circle cx=\"\
        200\" cy=\"75\" r=\"8\" fill=\"#6366f1\" fill-opacity=\"0.2\" stroke=\"#6366f1\"/><text x=\"200\" y=\"78\" font-size=\"\
        8\" fill=\"currentColor\" text-anchor=\"middle\">b2</text>\n  <line x1=\"60\" y1=\"83\" x2=\"240\" y2=\"83\" stroke=\"\
        currentColor\" stroke-width=\"1.5\"/>\n  <text x=\"260\" y=\"86\" font-size=\"10\" font-weight=\"bold\" fill=\"currentColor\"\
        >y[n]</text>\n  <text x=\"20\" y=\"115\" font-size=\"11\" font-weight=\"bold\" fill=\"#0284c7\">IIR: מבנה רקורסיבי\
        \ בעל חוגי משוב (חזרה מדגימות מוצא קודמות)</text>\n  <rect x=\"180\" y=\"125\" width=\"140\" height=\"45\" rx=\"6\"\
        \ fill=\"currentColor\" fill-opacity=\"0.06\" stroke=\"#0284c7\" stroke-width=\"1.5\"/>\n  <text x=\"250\" y=\"145\"\
        \ font-size=\"10\" font-weight=\"bold\" fill=\"currentColor\" text-anchor=\"middle\">Feedforward (b) +</text>\n  <text\
        \ x=\"250\" y=\"160\" font-size=\"10\" font-weight=\"bold\" fill=\"#e11d48\" text-anchor=\"middle\">Feedback Loop\
        \ (a)</text>\n</svg>\n"
      caption: מסנני FIR מחשבים ממוצע משוקלל נע ללא משוב (יציבים ללא תנאי, בעלי פאזה לינארית). מסנני IIR ממחזרים דגימות מוצא
        קודמות (יעילים וקומפקטיים, אך דורשים בקרת יציבות).
    points:
    - 'מסננים ספרתיים הם פסלי הצליל: הם מגבירים באסים, מסננים רעשי מאוורר ברקע או מבודדים ערוצי שידור אלחוטיים מגלי רדיו.'
    - '**מסנני FIR (תגובת הלם סופית)**: חשבו עליהם כממוצע משוקלל נע: $y[n] = b_0 x[n] + b_1 x[n-1] + \dots + b_M x[n-M]$.
      מכיוון שאין בהם **שום חוג משוב**, הם **יציבים ללא תנאי**—זה בלתי אפשרי פיזיקלית עבור מסנן FIR להתנדנד ללא שליטה או להתפוצץ.
      יתרה מזאת, כאשר המקדמים סימטריים ($b_k = b_{M-k}$), המסנן משיג **פאזה לינארית מושלמת** (ללא עיוותי צורת גל). החיסרון:
      נדרשים מקדמים רבים (סדר גבוה) כדי להשיג חיתוך תדרים חד.'
    - '**מסנני IIR (תגובת הלם אינסופית)**: חשבו עליהם כמערכת משוב רקורסיבית: $y[n] = \sum b_m x[n-m] - \sum a_k y[n-k]$. מכיוון
      שהם ממחזרים דגימות מוצא קודמות, הם משיגים חיתוך תדרים חד ביותר במעט מאוד משוואות וחיסכון משמעותי במעבד. הפשרה: הפאזה
      שלהם אינה לינארית, ואם קטבים נודדים מחוץ למעגל היחידה עקב שגיאות עיגול, המסנן עלול לצפצף באי-יציבות.'
  - title: תכנון מסנני FIR בשיטת החלונות (ריסון אדוות גיבס)
    points:
    - 'למסנן אידיאלי בעל קירות זקופים יש תגובת הלם בצורת גל sinc הנמשכת לאינסוף הן בעבר והן בעתיד: $h_{\text{ideal}}[n] =
      \frac{\sin(\omega_c n)}{\pi n}$.'
    - מכיוון שמחשב אינו יכול לאחסן מערך אינסופי, חובה לקטום את גל ה-sinc לאורך סופי באמצעות **פונקציית חלון** $w[n]$.
    - 'קטימה מלבנית חדה פועלת כטריקת דלת: היא יוצרת אדוות חריפות ודליפת אונות צד המכונות **תופעת גיבס (Gibbs Phenomenon)**
      (אונת הצד הראשונה נמצאת רק $-13\text{ dB}$ מתחת לפס, מה שיוצר זמזום שמיע).'
    - חלונות מדורגים (המינג, האנינג, בלקמן וקייזר) מעגלים את הקצוות ברכות לאפס, ומדכאים את אונות הצד המזיקות (המינג משיג $-43\text{
      dB}$, בלקמן $-58\text{ dB}$) במחיר של הרחבה מתונה של תחום המעבר.
    - אלגוריתם **פארקס-מקלילן (Parks-McClellan)** מתכנן מסנני FIR אופטימליים בעלי פאזה לינארית ואדווה שווה על פי קריטריון
      מינימקס של צ'בישב.
  - title: תכנון מסנני IIR באמצעות התמרת בילינאר
    points:
    - 'במהלך המאה ה-20 שיכללו מהנדסים מעגלי סינון אנלוגיים קלאסיים מופלאים: באטרוורת'' (פס מעבר חלק ושטוח לחלוטין כמו חמאה),
      צ''בישב (שיפוע חד עם אדוות מבוקרות) ואליפטי (שיפוע הקטעון החד ביותר האפשרי עם אדוות בשני הפסים).'
    - '**התמרת בילינאר** $s = \frac{2}{T} \frac{1 - z^{-1}}{1 + z^{-1}}$ ממפה מסננים אנלוגיים אלה ישירות למישור ה-z הדיגיטלי
      ללא כל עיוותי קיפול (Aliasing).'
    - מכיוון שההתמרה דוחסת ציר תדר אנלוגי אינסופי על מעגל יחידה בדיד סופי, היא מעוותת את ערכי התדרים באופן לא-לינארי. מהנדסים
      מבצעים תיקון מקדים (**Pre-Warping**) של תדרי המטרה לפני ההמרה.
    - כדי למנוע שגיאות עיגול ותנודות מחזור גבול במעבדי נקודה קבועה, מסנני IIR מסדר גבוה ממומשים כשרשרת של מקטעים מסדר שני
      (**Biquads**).
  trivia:
  - type: multiple_choice
    question: מדוע מסנן FIR (תגובת הלם סופית) לעולם אינו יכול להפוך לבלתי יציב או להתפוצץ במשוב אינסופי?
    options:
    - מכיוון שאין בו חוגי משוב כלל; כל הקטבים שלו ממוקמים בבטחה בראשית הצירים $z=0$
    - מכיוון שהוא משתמש רק במספרים חיוביים
    - מכיוון שהוא פועל בתדר שעון כפול
