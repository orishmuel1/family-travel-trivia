          - "חלון מלבני"
          - "חלון המינג"
          - "חלון ברטלט"
        correct: 0
      - type: multiple_choice
        question: "מדוע חובה לבצע תיקון מקדים (Pre-Warping) לתדרים בעת תכנון מסנני IIR בהתמרת בילינאר?"
        options:
          - "כדי לפצות על הדחיסה הלא-לינארית הממפה את הציר המדומה $j\\Omega$ על מעגל היחידה הבדיד"
          - "כדי למנוע סחיפה תרמית ברכיבים פיזיקליים"
          - "כדי להמיר מספרים בנקודה צפה למספרים שלמים"
          - "כדי לסלק רעש של רשת החשמל"
