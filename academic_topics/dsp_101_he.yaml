    - כל המישור המרוכב כולל אינסוף
    correct: 0
    explanation: '**תחום ההתכנסות (ROC)** הוא קבוצת הנקודות במישור המרוכב שבהן הטור האינסופי מתכנס לערך סופי. עבור מערכת פיזיקלית
      וסיבתית, ה-ROC הוא תמיד האזור שמחוץ לקוטב הרחוק ביותר ($|z| > r_{\max}$).'
  - type: multiple_choice
    question: כיצד התמרת ה-Z מפשטת את הניתוח של חיבור כמה מסננים בשרשרת (Cascade)?
    options:
    - 'היא ממירה פעולת קונבולוציה מורכבת בזמן לכפל אלגברי פשוט: $H_{\text{total}}= H_1H_2$'
    - היא מחליפה מספרים במילים
    - היא חותכת את קצב הדגימה הנדרש בחצי
    - היא מוחקת את תגובת ההלם
    correct: 0
    explanation: 'בהתמרת ה-Z, קונבולוציה מורכבת בזמן הופכת לכפל פשוט: $Y(z) = H(z) \cdot X(z)$. היחס $H(z) = Y(z) / X(z)$
      נקרא **פונקציית התמסורת**, ומתאר את המסנן כשבר של שני פולינומים: $H(z) = \frac{B(z)}{A(z)} = \frac{b_0 + b_1 z^{-1}
      + \dots}{1 + a_1 z^{-1} + \dots}$.'
  - type: multiple_choice
    question: כיצד מוגדר מסנן מופע מינימלי (Minimum Phase) ספרתי?
    options:
    - כל קטביו וכל אפסיו נמצאים ממש בתוך מעגל היחידה, מה שמספק את השהיית הזמן הקצרה ביותר
    - הוא משתמש במספר פעולות החיבור המינימלי
    - ההגבר שלו הוא אפס בכל התדרים
    - הוא מסנן אי-סיבתי
    correct: 0
    explanation: '**כלל הזהב של היציבות**: כדי שמסנן סיבתי יישאר יציב ולעולם לא יתפוצץ במשוב אינסופי, **כל הקטבים חייבים להימצא
      ממש בתוך מעגל היחידה** ($|z| < 1$). אם אפילו קוטב בודד נמצא על מעגל היחידה או מחוצה לו ($|z| \ge 1$), תגובת המערכת תגדל
      מעריכית עד לקריסה.'
  - type: multiple_choice
    question: מהי תגובת המשרעת $|H(e^{j\omega})|$ של מסנן All-Pass?
    options:
    - הגבר יחידה קבוע| = 1$) בכל התדרים, תוך שינוי יחסי הפאזה בלבד
    - הגבר אפס בכל מקום למעט ב-DC
    - הגבר העולה מונוטונית עם התדר
    - חסימה חדה וזקופה של תדרים נמוכים
    correct: 0
    explanation: 'התשובה הנכונה היא: הגבר יחידה קבוע ($|H(e^{j\omega})| = 1$) בכל התדרים, תוך שינוי יחסי הפאזה בלבד.'
  - type: multiple_choice
    question: מהי התמרת ה-Z של השהיית דגימה אחת בזמן $\delta[n - 1]$?
    options:
    - $z^{-1}$
    - $z^{+1}$
    - $\frac{1}{1 - z}$
    - $1$
    correct: 0
    explanation: '**התמרת Z** הנתונה על ידי $X(z) = \sum_{n=-\infty}^{\infty} x[n] z^{-n}$ פותרת זאת על ידי המרת השהיות זמן
      ($z^{-1}$) לאלגברה פולינומית פשוטה. השהיה של דגימה אחת בזמן היא בסך הכול כפל ב-$z^{-1}$ במישור ה-z.'
  - type: multiple_choice
    question: מהי התמרת ה-Z של הסדרה המעריכית הדועכת $a^n u[n]$ (כאשר $|a| < 1$)?
    options:
    - $\frac{1}{1 - a z^{-1}}$ עם תחום התכנסות $|z| > |a|$
    - $\frac{1}{1 - a z^{-1}}$ עם תחום התכנסות $|z| < |a|$
    - $\frac{z}{z + a}$ עם תחום התכנסות $|z| = 1$
    - $\ln(1 - a z^{-1})$
    correct: 0
    explanation: 'התשובה הנכונה היא: $\frac{1}{1 - a z^{-1}}$ עם תחום התכנסות $|z| > |a|$.'
  - type: multiple_choice
    question: מה קובע משפט פרסבל (Parseval) לגבי האנרגיה של אות דיגיטלי?
    options:
    - 'האנרגיה הכוללת נשמרת במדויק: סכום ריבועי הדגימות בזמן שווה לאינטגרל האנרגיה על פני כל התדרים'
    - האנרגיה בתדר מוכפלת ב-$2\pi^2$
    - תדרים גבוהים נושאים תמיד יותר אנרגיה מתדרים נמוכים
    - אנרגיה נעלמת בתוך מעגלים ספרתיים
    correct: 0
    explanation: 'התשובה הנכונה היא: האנרגיה הכוללת נשמרת במדויק: סכום ריבועי הדגימות בזמן שווה לאינטגרל האנרגיה על פני כל
      התדרים.'
  - type: multiple_choice
    question: מה מודדת השהיית החבורה (Group Delay) $\tau_g(\omega) = -\frac{d\theta}{d\omega}$ מבחינה פיזיקלית?
    options:
    - את השהיית הזמן הממשיתשחווה חבילת גלים בתדר $\omega$ במעברה דרך המסנן
    - את הזמן הכולל הנדרש להורדת קובץ אודיו
    - את ההפרש בין לחיצה על Play לשמיעת הצליל
    - את תדר השעון של המעבד
    correct: 0
    explanation: '**פאזה לינארית והשהיית חבורה**: כאשר כל רכיבי התדר עוברים דרך המסנן באותה השהיית זמן בדיוק (השהיית חבורה
      קבועה $\tau_g = -d\theta/d\omega$), צורת גל השמע נשמרת באופן מושלם ללא עיוותי מריחה.'
  - type: multiple_choice
    question: היכן על מעגל היחידה ממוקם התדר הבדיד הגבוה ביותר (תדר נייקוויסט $\omega = \pi$)?
    options:
    - ב-$z = -1$ על הציר הממשי השלילי
    - ב-$z = +1$ על הציר הממשי החיובי (DC)
    - בראשית הצירים $z = 0$
    - ב-$z = +j$ על הציר המדומה
    correct: 0
    explanation: 'הזווית $\omega$ סביב מעגל היחידה מייצגת את התדר: $\omega = 0$ (ב-$z = +1$) הוא תדר DC (באס / 0 הרץ), בעוד
      $\omega = \pi$ (ב-$z = -1$) מייצג את התדר הבדיד הגבוה ביותר האפשרי (מחצית קצב הדגימה, $f_s / 2$).'
  - type: multiple_choice
    question: מדוע תחום ההתכנסות (ROC) אינו יכול להכיל קטבים לעולם?
    options:
    - כי קטבים הם נקודות שבהן ערך פונקציית התמסורת שואף לאינסוף, דבר המפר את תנאי ההתכנסות לסכום סופי
    - כי קטבים הם מספרים שליליים
    - כי אפסים דוחפים קטבים החוצה מהמישור
    - כי ה-ROC מוגדר רק על הציר הממשי
    correct: 0
    explanation: '**תחום ההתכנסות (ROC)** הוא קבוצת הנקודות במישור המרוכב שבהן הטור האינסופי מתכנס לערך סופי. עבור מערכת פיזיקלית
      וסיבתית, ה-ROC הוא תמיד האזור שמחוץ לקוטב הרחוק ביותר ($|z| > r_{\max}$).'
- id: sampling_reconstruction
  title: 3. דגימה ושחזור אותות
  description: 'גבול המהירות של נייקוויסט-שאנון, אשליית גלגל הכרכרה ועיוותי קיפול, מדוע תוכנה לא יכולה לתקן דגימה שגויה ושחזור
    גל רציף.

    '
  cards:
  - title: משפט נייקוויסט-שאנון ואשליית גלגל הכרכרה
    figure:
      title: 'דגימה במישור התדר: קצב נייקוויסט לעומת התנגשות קיפול (Aliasing)'
