  - id: digital_filter_design
    title: "4. תכנון מסננים ספרתיים"
    description: >
      פיסול צלילים: הביטחון המוחלט של מסנני FIR, עוצמת המשוב של מסנני IIR, אומנות החלונות ומנהרת הבילינאר.
    cards:
      - title: "מסנני FIR לעומת IIR: שתי פילוסופיות העיצוב"
        points:
          - "מסננים ספרתיים הם פסלי הצליל: הם מגבירים באסים באוזניות, מסננים את נהמת מנוע המטוס באוזניות מבטלות רעשים ומבודדים פעימות לב חלשות במוניטורים רפואיים."
          - "**מסנני FIR (תגובת הלם סופית)**: חשבו עליהם כממוצע נע חלק. מכיוון שאין בהם חוגי משוב ($y[n] = \\sum b_k x[n-k]$), הם **יציבים ללא תנאי**—הם לעולם אינם יכולים להתנדנד ללא שליטה או להתפוצץ. יתרה מזאת, הם מסוגלים להשיג **פאזה לינארית מושלמת** ללא עיוותי צורת גל. המחיר: נדרשות פעולות חישוב רבות יותר (סדר מסנן גבוה)."
          - "**מסנני IIR (תגובת הלם אינסופית)**: חשבו עליהם כעל חוג משוב אקוסטי ($y[n] = \\sum b_m x[n-m] - \\sum a_k y[n-k]$). מכיוון שהם ממחזרים דגימות מוצא קודמות, הם מסוגלים לחתוך תדרים בשיפועים חדים ביותר עם מעט מאוד משוואות. אך כמו מיקרופון הקרוב מדי לרמקול, תכנון שגוי עלול לגרום להם לצפצף באי-יציבות."
      - title: "אומנות החלונות (ריסון אדוות גיבס)"
        points:
          - "מסנן אידיאלי בעל קירות זקופים (החוסם תדרים בשיפוע אנכי מושלם) דורש תגובת הלם בצורת גל sinc הנמשכת לאינסוף הן בעבר והן בעתיד—דבר בלתי אפשרי במכשיר אמיתי."
          - "כדי ליצור מסנן FIR מעשי, חובה לקטום את גל ה-sinc באמצעות **פונקציית חלון** $w[n]$."
          - "חיתוך מלבני חד פועל כטריקת דלת: הוא יוצר אדוות חריפות ודליפת אונות צד המכונות **תופעת גיבס (Gibbs Phenomenon)** (אונת הצד הראשונה נמצאת רק $-13\\text{ dB}$ מתחת לפס)."
          - "חלונות מדורגים (המינג, האנינג, בלקמן וקייזר) מעגלים את הקצוות ברכות לאפס, ומדכאים דרמטית את אונות הצד המזיקות (המינג משיג $-43\\text{ dB}$, בלקמן $-58\\text{ dB}$) במחיר של הרחבה מתונה של תחום המעבר."
      - title: "התמרת בילינאר (תרגום קלאסיקות אנלוגיות)"
        points:
          - "במהלך המאה ה-20 שיכללו מהנדסים מעגלי סינון אנלוגיים קלאסיים מופלאים: באטרוורת' (פס מעבר חלק ושטוח כמו חמאה), צ'בישב (מעבר חד עם אדוות) ואליפטי (שיפוע הקטעון החד ביותר האפשרי)."
          - "**התמרת בילינאר** $s = \\frac{2}{T} \\frac{1 - z^{-1}}{1 + z^{-1}}$ היא מנהרת זמן מתמטית הממפה מסננים אנלוגיים ממישור ה-s ישירות למישור ה-z הדיגיטלי ללא כל עיוותי קיפול (Aliasing)."
          - "מכיוון שההתמרה דוחסת ציר תדר אנלוגי אינסופי על מעגל בדיד סופי, היא מעוותת את ערכי התדרים. מהנדסים מבצעים תיקון מקדים (**Pre-Warping**) של התדרים המיועדים לפני ההמרה כדי שינחתו בדיוק במיקום הרצוי."
          - "כדי למנוע אי-יציבות חישובית במעבדי נקודה קבועה, מסנני IIR מסדר גבוה ממומשים כשרשרת של מקטעים מסדר שני (**Biquads**)."
    trivia:
      - type: multiple_choice
        question: "מדוע מסנן FIR (תגובת הלם סופית) לעולם אינו יכול להפוך לבלתי יציב או להתפוצץ במשוב אינסופי?"
        options:
          - "מכיוון שאין בו חוגי משוב כלל; כל הקטבים שלו ממוקמים בבטחה בראשית הצירים $z=0$"
          - "מכיוון שהוא משתמש רק במספרים חיוביים"
          - "מכיוון שהוא פועל בתדר שעון כפול"
          - "מכיוון שהוא עשוי מחוטי נחושת פיזיים"
        correct: 0
      - type: multiple_choice
        question: "מהו היתרון התפעולי המרכזי של מסנן IIR לעומת מסנן FIR בעל שיפוע חיתוך תדרים דומה?"
        options:
          - "הוא דורש משמעותית פחות פעולות חישוב ומקדמים, מה שחוסך עוצמת מעבד וסוללה"
          - "הוא מבטיח אפס השהיית פאזה"
