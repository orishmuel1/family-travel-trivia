id: dsp_101_he
type: academic
icon: "📡"
title: "עיבוד אותות ספרתי (DSP 101)"
description: >
  תכנית לימודים אקדמית מקיפה באותות בזמן בדיד, מערכות לינאריות בלתי משתנות בזמן, התמרת Z, תכנון מסננים ספרתיים ואלגוריתמים מהירים להתמרת פורייה.
lang: he
audience: family
categories:
  - id: foundations_discrete_time
    title: "1. יסודות ומערכות בזמן בדיד"
    description: >
      ייצוג אותות בזמן בדיד, לינאריות, אי-תלות בזמן, סכום הקונבולוציה, סיבתיות ומשוואות הפרשים.
    cards:
      - title: "אותות בזמן רציף לעומת אותות בזמן בדיד"
        points:
          - "אות בזמן רציף $x(t)$ מוגדר על פני ציר זמן רציף $t \\in \\mathbb{R}$, בעוד שאות בזמן בדיד $x[n]$ מוגדר אך ורק עבור אינדקסים שלמים $n \\in \\mathbb{Z}$."
          - "דגימה מחזורית במרווחי זמן $T_s$ ממירה את האות הרציף לסדרה בדידה $x[n] = x(n T_s)$, כאשר $f_s = 1/T_s$ הוא קצב הדגימה בדגימות לשנייה (הרץ)."
          - "פונקציית הלם היחידה הבדידה $\\delta[n]$ מוגדרת כ-$1$ עבור $n=0$ וכ-$0$ עבור כל $n \\neq 0$. בניגוד להלם רציף של דיראק, ל-$\\delta[n]$ יש משרעת סופית ושטח יחידה."
          - "מדרגת היחידה הבדידה $u[n]$ שווה ל-$1$ עבור $n \\ge 0$ ול-$0$ עבור $n < 0$. הקשר בינה לבין ההלם נתון על ידי $u[n] = \\sum_{k=-\\infty}^n \\delta[k]$ וכן $\\delta[n] = u[n] - u[n-1]$."
          - "אנרגיה של אות מוגדרת כ-$E = \\sum_{n=-\\infty}^{\\infty} |x[n]|^2$. אם $E < \\infty$, האות מוגדר כאות אנרגיה. אם ההספק הממוצע $P = \\lim_{N\\to\\infty} \\frac{1}{2N+1} \\sum_{n=-N}^N |x[n]|^2$ סופי ושונה מאפס, האות מוגדר כאות הספק."
      - title: "מערכות לינאריות בלתי משתנות בזמן (LTI) וקונבולוציה"
        points:
          - "מערכת היא לינארית אם היא מקיימת את עקרון הסופרפוזיציה והכפל בסקלר: $T\\{a x_1[n] + b x_2[n]\\} = a T\\{x_1[n]\\} + b T\\{x_2[n]\\}$."
          - "מערכת היא בלתי תלויה בזמן (Time-Invariant) אם הזזת הכניסה בזמן גורמת להזזה זהה לחלוטין במוצא: אם $x[n] \\to y[n]$, אזי $x[n-n_0] \\to y[n-n_0]$."
          - "כל מערכת LTI בדידה מאופיינת באופן מלא וחד-ערכי על ידי תגובת ההלם שלה $h[n] = T\\{\\delta[n]\\}$."
          - "מוצא המערכת לכל כניסה כללית $x[n]$ מחושב באמצעות סכום הקונבולוציה הבדיד: $y[n] = (x * h)[n] = \\sum_{k=-\\infty}^{\\infty} x[k] h[n-k]$."
          - "תכונות הקונבולוציה: קומוטטיבית (חילופית: $x*h = h*x$), אסוציאטיבית (קיבוצית: $x*(h_1*h_2) = (x*h_1)*h_2$) ודיסטריבוטיבית (פילוגית: $x*(h_1+h_2) = x*h_1 + x*h_2$)."
      - title: "משוואות הפרשים, סיבתיות ויציבות BIBO"
        points:
          - "משוואות הפרשים לינאריות במקדמים קבועים (LCCDE) מתארות מערכות בדידות: $\\sum_{k=0}^N a_k y[n-k] = \\sum_{m=0}^M b_m x[n-m]$ כאשר $a_0 = 1$."
          - "מערכת היא סיבתית (Causal) אם המוצא $y[n]$ בכל רגע תלוי אך ורק בערכי כניסה עכשוויים וקודמים $x[k]$ ($k \\le n$), מה שמחייב עבור מערכת LTI שתגובת ההלם תתאפס עבור זמנים שליליים: $h[n] = 0$ לכל $n < 0$."
          - "יציבות כניסה חסומה - מוצא חסום (BIBO Stability): לכל כניסה חסומה $|x[n]| \\le B_x < \\infty$, המוצא המתקבל חסום אף הוא $|y[n]| \\le B_y < \\infty$."
          - "מערכת LTI היא יציבה במובן BIBO אם ורק אם תגובת ההלם שלה סכימה בהחלט: $\\sum_{n=-\\infty}^{\\infty} |h[n]| < \\infty$."
    trivia:
      - type: multiple_choice
        question: "מהי ההגדרה המתמטית של הלם היחידה הבדיד $\\delta[n]$?"
        options:
          - "$\\delta[n] = 1$ עבור $n=0$, ו-$0$ עבור כל $n \\neq 0$"
          - "$\\delta[n] = \\infty$ ב-$n=0$ עם אינטגרל השווה ל-1"
          - "$\\delta[n] = 1$ לכל $n \\ge 0$"
          - "$\\delta[n] = n$ עבור ערכים שלמים"
        correct: 0
      - type: multiple_choice
        question: "תחת איזה תנאי הכרחי ומספיק מערכת LTI בדידה היא יציבה במובן BIBO?"
        options:
          - "תגובת ההלם שלה סכימה בהחלט: $\\sum |h[n]| < \\infty$"
          - "תגובת ההלם שונה מאפס לכל זמן"
          - "המערכת חייבת להיות חסרת זיכרון"
          - "אות הכניסה חייב להיות בעל אנרגיה אינסופית"
