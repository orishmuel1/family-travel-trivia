      - type: multiple_choice
        question: "מהו התנאי על תגובת ההלם $h[n]$ של מערכת LTI כדי שהיא תהיה סיבתית (Causal)?"
        options:
          - "$h[n] = 0$ עבור כל $n < 0$"
