        \ fill=\"currentColor\" opacity=\"0.8\">Im(z)</text>\n  <text x=\"280\" y=\"104\" font-size=\"11\" fill=\"#6366f1\"\
        >|z|=1 (מעגל היחידה)</text>\n  <text x=\"256\" y=\"78\" font-size=\"11\" font-weight=\"bold\" fill=\"#e11d48\">קוטב\
        \ (× תהודה)</text>\n  <text x=\"210\" y=\"40\" font-size=\"11\" font-weight=\"bold\" fill=\"#0284c7\">אפס (○ השתקה)</text>\n\
        </svg>\n"
      caption: 'מישור ה-z המרוכב: תנועה סביב מעגל היחידה ($|z|=1$) מייצגת את תגובת התדר הפיזיקלית. קטבים ($\times$) מגבירים
        תדרים (תהודה), ואפסים ($\circ$) משתיקים תדרים (Notch).'
    points:
    - עבודה עם משוואות הפרשים וסכומי קונבולוציה במישור הזמן עלולה להיות מסורבלת. אם מחברים שלושה מסננים בשרשרת, חישוב סכומי
      קונבולוציה מקוננים דורש מאמץ חישובי רב.
    - '**התמרת Z** הנתונה על ידי $X(z) = \sum_{n=-\infty}^{\infty} x[n] z^{-n}$ פותרת זאת על ידי המרת השהיות זמן ($z^{-1}$)
      לאלגברה פולינומית פשוטה. השהיה של דגימה אחת בזמן היא בסך הכול כפל ב-$z^{-1}$ במישור ה-z.'
    - 'בהתמרת ה-Z, קונבולוציה מורכבת בזמן הופכת לכפל פשוט: $Y(z) = H(z) \cdot X(z)$. היחס $H(z) = Y(z) / X(z)$ נקרא **פונקציית
      התמסורת**, ומתאר את המסנן כשבר של שני פולינומים: $H(z) = \frac{B(z)}{A(z)} = \frac{b_0 + b_1 z^{-1} + \dots}{1 + a_1
      z^{-1} + \dots}$.'
    - '**תחום ההתכנסות (ROC)** הוא קבוצת הנקודות במישור המרוכב שבהן הטור האינסופי מתכנס לערך סופי. עבור מערכת פיזיקלית וסיבתית,
      ה-ROC הוא תמיד האזור שמחוץ לקוטב הרחוק ביותר ($|z| > r_{\max}$).'
  - title: 'קטבים ואפסים: ארכיטקטורת התהודה וההשתקה'
    points:
    - 'שבר פונקציית התמסורת $H(z) = \frac{B(z)}{A(z)}$ מוגדר באופן מלא על ידי השורשים שלו:'
    - '**אפסים (Zeros)** הם שורשי המונה $B(z) = 0$. אם תדר הכניסה נוחת בדיוק על אפס, המוצא מוכפל ב-0 והתדר הזה נמחק לחלוטין
      מהאודיו (משמש לבניית מסנני Notch להסרת רחש רשת החשמל).'
    - '**קטבים (Poles)** הם שורשי המכנה $A(z) = 0$ שבהם השבר מתחלק באפס ($H(z) \to \infty$). כאשר תדר כניסה עובר קרוב לקוטב,
      המערכת מגיבה בהגברה ותהודה צלצולית עזה באותו תדר.'
    - '**כלל הזהב של היציבות**: כדי שמסנן סיבתי יישאר יציב ולעולם לא יתפוצץ במשוב אינסופי, **כל הקטבים חייבים להימצא ממש בתוך
      מעגל היחידה** ($|z| < 1$). אם אפילו קוטב בודד נמצא על מעגל היחידה או מחוצה לו ($|z| \ge 1$), תגובת המערכת תגדל מעריכית
      עד לקריסה.'
  - title: 'ה-DTFT: טיול סביב מעגל היחידה'
    points:
    - מהו הקשר הפיזיקלי בין מישור ה-z לתדרי המוזיקה שאנו שומעים באוזניים?
    - 'אם נחשב את התמרת ה-Z אך ורק לאורך שפתו של **מעגל היחידה** (על ידי הצבת $|z| = 1$, כלומר $z = e^{j\omega}$), נקבל את
      **התמרת פורייה בזמן בדיד (DTFT)**: $X(e^{j\omega}) = \sum x[n] e^{-j\omega n}$.'
    - 'הזווית $\omega$ סביב מעגל היחידה מייצגת את התדר: $\omega = 0$ (ב-$z = +1$) הוא תדר DC (באס / 0 הרץ), בעוד $\omega =
      \pi$ (ב-$z = -1$) מייצג את התדר הבדיד הגבוה ביותר האפשרי (מחצית קצב הדגימה, $f_s / 2$).'
    - מדוע ה-DTFT מחזורית במחזור של $2\pi$? כי סיבוב של $360^\circ$ ($2\pi$ רדיאנים) סביב מעגל מחזיר אתכם בדיוק לאותה נקודה.
      תדרים בדידים מתקפלים מעגלית באופן טבעי.
    - '**פאזה לינארית והשהיית חבורה**: כאשר כל רכיבי התדר עוברים דרך המסנן באותה השהיית זמן בדיוק (השהיית חבורה קבועה $\tau_g
      = -d\theta/d\omega$), צורת גל השמע נשמרת באופן מושלם ללא עיוותי מריחה.'
