  - title: מהפכת ה-FFT (האלגוריתם ששינה את פני ההיסטוריה)
    points:
    - חישוב ישיר של נוסחת ה-DFT דורש $N^2$ פעולות כפל מרוכבות. עבור בלוק קול צנוע של 1024 דגימות, מדובר ביותר מ-**1,000,000
      פעולות בכל שבריר שנייה**—דבר שחנק את המחשבים הראשונים.
    - בשנת 1965 פירסמו קולי וטוקי את **התמרת פורייה המהירה (FFT)**, המשתמשת בגישת 'הפרד ומשול' לפירוק רקורסיבי של החישוב בין
      אינדקסים זוגיים לאי-זוגיים (מבנה ה'פרפר' המפורסם).
    - ה-FFT קיצץ את הסיבוכיות החישובית מ-$O(N^2)$ ל-$O(N \log_2 N)$. עבור $N=1024$, כמות הפעולות צנחה מ-1,048,576 לכ-**10,240
      בלבד**—האצה של **פי 100 ויותר**!
    - 'קפיצת מדרגה עוצרת נשימה זו הפכה את עיבוד האותות מנוסחאות תאורטיות על הלוח לטכנולוגיה המעשית שמניעה את האנושות: תקשורת
      סלולרית 5G, רשתות Wi-Fi, מכ״מים, הדמיות MRI ומוזיקה בסטרימינג.'
