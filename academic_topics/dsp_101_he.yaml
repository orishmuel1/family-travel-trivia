id: dsp_101_he
type: academic
icon: "📡"
title: "עיבוד אותות ספרתי (DSP 101)"
description: >
  תכנית לימודים אקדמית יסודית ומעמיקה להנדסת חשמל ומחשבים: אותות ומערכות בזמן בדיד, קונבולוציית LTI, ניתוח קטבים ואפסים במישור ה-Z, תורת הדגימה, תכנון מסננים ספרתיים ואלגוריתמי פורייה מהירים (FFT).
lang: he
audience: family
categories:
  - id: foundations_discrete_time
    title: "1. יסודות ומערכות בזמן בדיד"
    description: >
      ייצוג אותות בדידים, אפיון מערכות LTI ותגובת הלם, מכניקת הקונבולוציה, סיבתיות וגבול יציבות BIBO.
    cards:
