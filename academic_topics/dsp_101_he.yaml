  - id: sampling_reconstruction
    title: "3. דגימה ושחזור אותות"
    description: >
      משפט הדגימה של נייקוויסט-שאנון, שכפול ספקטרלי, עיוותי קיפול (Aliasing), סינון אנטי-אליאסינג ושחזור Sinc לפי ויטאקר-שאנון.
    cards:
      - title: "משפט הדגימה של נייקוויסט-שאנון"
        figure:
          title: "דגימה במישור התדר: קצב נייקוויסט לעומת קיפול ספקטרלי"
          svg: >
            <svg viewBox="0 0 500 180" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-height:180px;">
              <text x="20" y="20" font-size="11" font-weight="bold" fill="#059669">(a) fs ≥ 2·fmax (ללא קיפול תדרים)</text>
              <line x1="20" y1="75" x2="480" y2="75" stroke="currentColor" stroke-width="1.2" opacity="0.4"/>
              <polygon points="120,75 160,35 200,75" fill="#6366f1" fill-opacity="0.3" stroke="#6366f1" stroke-width="1.5"/>
              <text x="160" y="70" font-size="10" fill="currentColor" text-anchor="middle">0</text>
              <text x="200" y="90" font-size="9" fill="currentColor" opacity="0.8" text-anchor="middle">fmax</text>
              <text x="120" y="90" font-size="9" fill="currentColor" opacity="0.8" text-anchor="middle">-fmax</text>
              <polygon points="320,75 360,35 400,75" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="3,3"/>
              <text x="360" y="70" font-size="10" fill="currentColor" text-anchor="middle">fs</text>
              <line x1="200" y1="55" x2="320" y2="55" stroke="#059669" stroke-width="1.5"/>
              <text x="260" y="50" font-size="9" fill="#059669" text-anchor="middle">Guard Band</text>
              <text x="20" y="115" font-size="11" font-weight="bold" fill="#e11d48">(b) fs &lt; 2·fmax (עיוות קיפול Aliasing)</text>
              <line x1="20" y1="165" x2="480" y2="165" stroke="currentColor" stroke-width="1.2" opacity="0.4"/>
              <polygon points="110,165 170,125 230,165" fill="#6366f1" fill-opacity="0.3" stroke="#6366f1" stroke-width="1.5"/>
              <polygon points="210,165 270,125 330,165" fill="#e11d48" fill-opacity="0.3" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="3,3"/>
              <polygon points="210,165 220,152 230,165" fill="#e11d48" fill-opacity="0.8"/>
              <text x="220" y="145" font-size="9" font-weight="bold" fill="#e11d48" text-anchor="middle">חפיפה</text>
              <text x="170" y="160" font-size="10" fill="currentColor" text-anchor="middle">0</text>
              <text x="270" y="160" font-size="10" fill="currentColor" text-anchor="middle">fs</text>
            </svg>
          caption: "דגימה מחזורית משכפלת את הספקטרום הרציף בכל כפולה של $f_s$. כאשר $f_s < 2 f_{\\max}$, השכפולים חופפים ויוצרים עיוות קיפול בלתי הפיך."
        points:
          - "משפט הדגימה של נייקוויסט-שאנון קובע כי אות רציף וחסום-סרט $x(t)$ בעל רכיב תדר עליון $f_{\\max}$ ניתן לשחזור יחיד ומושלם מדגימותיו $x[n] = x(n T_s)$ אם ורק אם קצב הדגימה מקיים: $f_s > 2 f_{\\max}$."
          - "הסף $f_{\\text{Nyquist}} = 2 f_{\\max}$ נקרא קצב נייקוויסט. התדר המרבי שמערכת בדידה מסוגלת לייצג ללא עמימות נקרא תדר נייקוויסט (תדר הקיפול) $f_{\\text{fold}} = f_s / 2$."
          - "במישור התדר, פעולת הדגימה ברכבת הלמים אידיאלית שקולה לקונבולוציה מחזורית, המשכפלת את הספקטרום הרציף $X(j\\Omega)$ בכל הרמוניה של תדר הדגימה: $X_s(j\\Omega) = \\frac{1}{T_s} \\sum_{k=-\\infty}^{\\infty} X\\left(j\\left(\\Omega - k \\frac{2\\pi}{T_s}\\right)\\right)$."
      - title: "עיוותי קיפול (Aliasing) וסינון Anti-Aliasing"
        points:
          - "כאשר קצב הדגימה נמוך מסף נייקוויסט ($f_s < 2 f_{\\max}$), השכפולים הספקטרליים חופפים. רכיבי תדר גבוה מתקפלים סביב גבול נייקוויסט $f_s/2$ ומופיעים כרכיבי תדר נמוך שגויים."
          - "עיוות קיפול גורם לאיבוד מידע בלתי הפיך: מרגע שרכיבי תדר חופפים סוכמו ברגיסטרי ה-ADC, שום אלגוריתם סינון דיגיטלי אינו יכול להפרידם."
          - "מסנן מונע קיפול (Anti-Aliasing Filter - AAF) אנלוגי חייב להיות מוצב בשרשרת החומרה מיד לפני הממיר האנלוגי-לספרתי (ADC), כדי להנחית בחריפות כל רכיב תדר שמעל $f_s / 2$ טרם הדגימה."
          - "תקן השמע של תקליטורי CD ($f_s = 44.1\\text{ kHz}$) מכסה את תחום השמיעה האנושית עד $20\\text{ kHz}$ ($2 \\times 20\\text{ kHz} = 40\\text{ kHz}$), ומספק מרווח מעבר של $4.1\\text{ kHz}$ לדעוך המסנן האנלוגי המעשי."
      - title: "שחזור אידיאלי ואינטרפולציית Sinc לפי ויטאקר-שאנון"
        points:
          - "שחזור רציף אידיאלי מתבצע על ידי העברת הדגימות דרך מסנן מעביר נמוכים אנלוגי אידיאלי בעל תדר קטעון $\\Omega_c = \\pi / T_s$ והגבר $T_s$ בפס המעבר."
          - "במישור הזמן, הכפלה בחלון מלבני אידיאלי בתדר שקולה לקונבולוציה של הדגימות עם פולס sinc רציף: $x(t) = \\sum_{n=-\\infty}^{\\infty} x[n] \\text{sinc}\\left(\\frac{t - n T_s}{T_s}\\right)$ כאשר $\\text{sinc}(u) = \\frac{\\sin(\\pi u)}{\\pi u}$."
          - "ממירים דיגיטליים לאנלוגיים מעשיים משתמשים במעגל החזקה מסדר אפס (ZOH) השומר על מתח קבוע למשך $T_s$, ולאחריו מסנן שחזור אנלוגי המנחית את מדרגות המתח הגבוהות."
