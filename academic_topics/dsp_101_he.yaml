  - type: multiple_choice
    question: מה נוצר בספקטרום בעת ביצוע אינטרפולציה (הוספת $L-1$ אפסים בין דגימות) שיש לסננו?
    options:
    - העתקי בבואה ספקטרלייםהמסולקים על ידי מסנן Anti-Imaging
    - רעש תרמי מהמעבד
    - עיוותי היפוך פאזה
    - היסט מתח ישר
    correct: 0
    explanation: לכן, **מסנן אנטי-אליאסינג (AAF)** אנלוגי חייב לעמוד בחומרה הפיזית *לפני* שבב ה-ADC, ולחתוך לחלוטין כל תדר
      שמעל $f_s/2$ טרם ביצוע הדגימה.
  - type: multiple_choice
    question: אם אות אנלוגי מכיל תדרים בין 200 הרץ ל-500 הרץ בלבד, מהו קצב נייקוויסט שלו?
    options:
    - 1000 הרץ
    - 500 הרץ
    - 300 הרץ
    - 2000 הרץ
    correct: 0
    explanation: קצב הדגימה המינימלי הבטוח $2 f_{\max}$ נקרא **קצב נייקוויסט**. התדר המרבי שמערכת דיגיטלית מסוגלת לייצג חוקית
      ($f_s / 2$) נקרא **תדר נייקוויסט** (או תדר הקיפול).
  - type: multiple_choice
    question: מהו הקשר בין התדר הדיגיטלי המנורמל $\omega$ (רדיאנים/דגימה) לתדר האנלוגי הפיזיקלי $\Omega$ (רדיאנים/שנייה)?
    options:
    - $\omega = \Omega T_s = \frac{\Omega}{f_s}$
    - $\omega = \frac{\Omega}{T_s}$
    - $\omega = \Omega^2$
    - $\omega = 2\pi \Omega$
    correct: 0
    explanation: 'קלוד שאנון הוכיח שאם נחליף כל נקודת דגימה ב**גל Sinc** רציף $\text{sinc}(t/T_s) = \frac{\sin(\pi t / T_s)}{\pi
      t / T_s}$ ונסכום אותם, האדוות משתלבות בשלמות מתמטית מופלאה ומשחזרות במדויק של 100% את הגל הרציף המקורי: $x(t) = \sum
      x[n] \text{sinc}\left(\frac{t - n T_s}{T_s}\right)$.'
  - type: multiple_choice
    question: מהו תדר נייקוויסט במערכת הקלטה מקצועית הדוגמת בקצב של 96 קילו-הרץ?
    options:
    - 48 קילו-הרץ
    - 96 קילו-הרץ
