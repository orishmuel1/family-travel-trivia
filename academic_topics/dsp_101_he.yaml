        \ x=\"20\" y=\"20\" font-size=\"11\" font-weight=\"bold\" fill=\"#059669\">(a) fs ≥ 2·fmax (ללא קיפול — שכפולים מופרדים)</text>\n\
        \  <line x1=\"20\" y1=\"75\" x2=\"480\" y2=\"75\" stroke=\"currentColor\" stroke-width=\"1.2\" opacity=\"0.4\"/>\n\
