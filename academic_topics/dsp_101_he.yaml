  - type: multiple_choice
    question: מדוע חובה להפעיל מסנן דיגיטלי מעביר נמוכים לפני ביצוע דסימציה בפקטור $M$?
    options:
    - כדי לסלק תדרים שמעל $\pi/M$ ולמנוע קיפול ספקטרלי באות המוקטן
    - כדי להגביר את עוצמת השמע
    - כדי שהקובץ ייקרא בטלפונים ניידים
    - כדי להמיר צליל סטריאו למונו
    correct: 0
    explanation: לכן, **מסנן אנטי-אליאסינג (AAF)** אנלוגי חייב לעמוד בחומרה הפיזית *לפני* שבב ה-ADC, ולחתוך לחלוטין כל תדר
