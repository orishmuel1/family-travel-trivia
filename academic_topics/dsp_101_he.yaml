      - type: multiple_choice
        question: "מהו היתרון התפעולי המרכזי של מסנן IIR בהשוואה למסנן FIR בעל מפרט משרעת זהה?"
        options:
          - "הוא דורש משמעותית פחות מקדמים ופעולות חישוב להשגת שיפוע מעבר חד"
