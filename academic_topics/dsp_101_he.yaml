id: dsp_101_he
type: academic
icon: "📡"
title: "עיבוד אותות ספרתי (DSP 101)"
description: >
  תכנית לימודים אקדמית חווייתית ואינטואיטיבית החוקרת כיצד גלים פיזיקליים הופכים למספרים דיגיטליים נצחיים, כיצד מסננים מעצבים צלילים וכיצד אלגוריתמים מהירים מניעים את עולם התקשורת.
lang: he
audience: family
categories:
  - id: foundations_discrete_time
    title: "1. יסודות ומערכות בזמן בדיד"
    description: >
      מדוע עוברים לדיגיטל, מודל ההד בקתדרלה של הקונבולוציה, לינאריות, אי-תלות בזמן וגבול היציבות.
    cards:
      - title: "למה לעבור לדיגיטל? (מגלים פיזיקליים למספרים נצחיים)"
        points:
          - "בעולם הפיזיקלי, קול, אור וגלי רדיו הם גלים אנלוגיים רציפים. אך אותות אנלוגיים הם שבריריים: כל כבל מוסיף רחש, כל מגבר יוצר עיוותים וסרטי קלטות נשחקים ומאבדים איכות עם הזמן."
          - "המהפכה הדיגיטלית מעניקה לגלים חיי נצח. במקום לשמור את הגל הפיזיקלי הרגיש עצמו, אנו דוגמים את גובהו במרווחי זמן קצובים $T_s$ ורושמים אותם כסדרה של מספרים $x[n] = x(n T_s)$."
          - "ברגע שהצליל הופך למספרים טהורים, ניתן לשכפל אותו אינסוף פעמים בלי לאבד אפילו ביט בודד של איכות, לשדר אותו ברחבי הגלובוס, להצפין אותו ולעבד אותו בקוד."
          - "הלם היחידה הבדיד $\\delta[n]$ הוא 'האטום' של עולם עיבוד האותות: נקישה חדה ובודדת בעוצמה של 1 ברגע $n=0$ ואפס בכל זמן אחר. כל צליל מורכב הוא מקהלה של אינספור הלמים מוזזים ומדורגים."
          - "מדרגת היחידה $u[n]$ מייצגת הפעלת מתג שנשאר דלוק לנצח ($1$ עבור $n \\ge 0$, ו-$0$ לפני כן). ההלם הוא פשוט הקפיצה הפתאומית בין ערכי מדרגה עוקבים: $\\delta[n] = u[n] - u[n-1]$."
      - title: "חדר ההד בקתדרלה (מערכות LTI וסיפור הקונבולוציה)"
        points:
          - "דמיינו שאתם עומדים בתוך קתדרלת אבן ענקית ומוחאים כף בחוזקה פעם אחת. מחיאת הכף החדה הזו היא הלם $\\delta[n]$. ההד העשיר והמתמשך שמתגלגל באולם בשניות שלאחר מכן הוא תגובת ההלם הייחודית של המבנה $h[n]$."
          - "למערכות לינאריות בלתי משתנות בזמן (LTI) יש תכונת-על: אם אתם יודעים כיצד החדר מגיב למחיאת כף בודדת ($h[n]$), תוכלו לחזות במדויק כיצד יישמע כל שיר או סימפוניה בתוך החדר מבלי לנגן בו אפילו פעם אחת!"
          - "מדוע? כי כל קטע מוזיקלי $x[n]$ הוא בסך הכול רצף של מיליוני מחיאות כף קטנות בעוצמות שונות. עקרון הלינאריות קובע שסך כל הצליל שתשמעו הוא חיבור פשוט של כל ההדים הנפרדים."
          - "הקונבולוציה $y[n] = (x * h)[n] = \\sum_{k=-\\infty}^{\\infty} x[k] h[n-k]$ היא הנוסחה של אותו הד: כדי לדעת מה נשמע כעת ברגע $n$, אנו סוכמים את ההדים שנותרו מכל התווים $x[k]$ שנוגנו $n-k$ צעדים בעבר."
          - "הקונבולוציה היא חילופית ($x * h = h * x$): מתמטית, השמעת שיר בתוך קתדרלה יוצרת בדיוק את אותו צליל כמו השמעת טביעת ההד של הקתדרלה דרך השיר שלכם."
      - title: "זיכרון, סיבתיות ואיזון היציבות"
        points:
          - "סיבתיות (Causality) מכבדת את חץ הזמן: אפקט אודיו בזמן אמת בטלפון שלכם אינו יכול להגיב למילים שעדיין לא אמרתם. עבור מערכת LTI, סיבתיות פירושה שההד אינו יכול להישמע לפני שמחאתם כף: $h[n] = 0$ עבור כל $n < 0$."
          - "משוואות הפרשים $\\sum a_k y[n-k] = \\sum b_m x[n-m]$ הן האלגוריתם המעשי שמחשב את הצליל הבא במעבדים: הן מחשבות את הדגימה הבאה משילוב של דגימות הכניסה העדכניות ורשרושי המוצא הקודמים."
          - "יציבות BIBO (כניסה חסומה - מוצא חסום) היא תעודת הביטוח של המערכת: אם תלחשו לתוך מיקרופון, המערכת לעולם לא תגביר את הלחישה לתנודות אינסופיות שיפוצצו את הרמקולים."
          - "מערכת LTI מובטחת להיות יציבה אם ורק אם ההדים שלה דועכים ונעלמים באופן טבעי עם הזמן, כלומר סכום ערכי ההד המוחלטים הוא סופי: $\\sum_{n=-\\infty}^{\\infty} |h[n]| < \\infty$."
    trivia:
