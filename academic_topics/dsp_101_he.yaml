  - id: dft_and_fft_algorithms
    title: "5. התמרת פורייה בדידה (DFT) ואלגוריתמים מהירים (FFT)"
    description: >
      התמרת DFT, קונבולוציה מעגלית לעומת לינארית, רזולוציה ספקטרלית, דליפה וחלונות, ואלגוריתם ה-FFT של קולי-טוקי.
    cards:
      - title: "התמרת פורייה בדידה (DFT)"
        points:
          - "ה-DFT ממירה סדרה בדידה באורך סופי $N$ ל-$N$ דגימות תדר בדידות: $X[k] = \\sum_{n=0}^{N-1} x[n] W_N^{k n}$ כאשר $W_N = e^{-j \\frac{2\\pi}{N}}$ נקרא גורם הטווידל (Twiddle Factor)."
          - "התמרת DFT הפוכה משחזרת במדויק את האות בזמן: $x[n] = \\frac{1}{N} \\sum_{k=0}^{N-1} X[k] W_N^{-k n}$."
          - "ה-DFT באורך $N$ דוגמת למעשה את התמרת ה-DTFT הרציפה $X(e^{j\\omega})$ ב-$N$ נקודות שוות-מרווח על מעגל היחידה: $\\omega_k = \\frac{2\\pi k}{N}$ עבור $k = 0, 1, \\dots, N-1$."
          - "תכונות גורם הטווידל: מחזוריות ($W_N^{k+N} = W_N^k$), סימטריה ($W_N^{k + N/2} = -W_N^k$) וצמצום ($W_N^{2k} = W_{N/2}^k$)."
      - title: "קונבולוציה מעגלית לעומת קונבולוציה לינארית"
        points:
          - "כפל נקודתי של שתי התמרות DFT בתדר $Y[k] = X_1[k] X_2[k]$ שקול לקונבולוציה מעגלית (מחזורית) בזמן: $y[n] = (x_1 \\circledast x_2)[n] = \\sum_{m=0}^{N-1} x_1[m] x_2[((n - m))_N]$."
          - "כדי לחשב קונבולוציה לינארית של אותות באורכים $L$ ו-$P$ באמצעות DFT ללא עיוותי חפיפה מעגליים, חובה לרפד את שני האותות באפסים (Zero-Padding) לאורך מינימלי של $N \\ge L + P - 1$."
          - "סינון אותות שמע ארוכים או בזרימה רציפה (Streaming) מתבצע ביעילות בבלוקים באמצעות שיטות Overlap-Add (OLA) או Overlap-Save (OLS)."
      - title: "רזולוציה ספקטרלית, דליפה ואלגוריתם ה-FFT"
        points:
          - "מרווח תאי התדר בהרץ הוא $\\Delta f = \\frac{f_s}{N} = \\frac{1}{T_{\\text{total}}}$, ונקבע אך ורק על ידי משך זמן המדידה הכולל $T_{\\text{total}} = N T_s$. ריפוד באפסים מבצע אינטרפולציה בלבד אך אינו משפר את הרזולוציה הפיזיקלית."
          - "דליפה ספקטרלית (Spectral Leakage) מתרחשת כאשר תדר האות אינו נופל בדיוק על אינדקס שלם של תא DFT, ומורחת אנרגיה לתאים סמוכים; שימוש בחלונות מפחית את אונות הדליפה על חשבון הרחבת האונה הראשית."
          - "חישוב ישיר של DFT דורש סיבוכיות של $O(N^2)$ כפלים מרוכבים."
          - "אלגוריתם ה-FFT של קולי-טוקי בבסיס 2 (Radix-2 DIT) מפרק באופן רקורסיבי DFT של $N$ נקודות לשני תתי-DFT של $N/2$ נקודות, ומקצץ את הסיבוכיות החישובית ל-$O(N \\log_2 N)$."
          - "עבור $N = 1024$, חישוב ישיר דורש כ-$1,048,576$ פעולות כפל; אלגוריתם FFT דורש כ-$10,240$ פעולות בלבד — חיסכון של פי 100 במהירות!"
