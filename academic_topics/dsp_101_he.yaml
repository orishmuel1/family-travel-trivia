              <text x="56" y="24" font-size="11" fill="currentColor" opacity="0.8">x[n]</text>
              <text x="140" y="98" font-size="10" fill="#6366f1">Ts</text>
            </svg>
          caption: "אות רציף $x(t)$ (קו מקווקו) הנדגם במרווחי זמן אחידים $T_s$ לסדרה הבדידה $x[n] = x(n T_s)$."
        points:
          - "אותות פיזיקליים (לחץ אקוסטי, קרינה אלקטרומגנטית, מתחי חיישנים) הם פונקציות רציפות בזמן $x(t) \\in \\mathbb{R}$. בעיבוד אנלוגי, כל דרגת מעגל מוסיפה רעש תרמי, עיוותים וסחיפה."
          - "עיבוד אותות ספרתי (DSP) פועל על סדרות מספרים בדידות $x[n]$, כאשר האינדקס השלם $n \\in \\mathbb{Z}$ מייצג דגימות שנלקחו במרווחי זמן קבועים $T_s = 1/f_s$."
          - "הייצוג הספרתי מאפשר שמירה, שידור ושכפול נטולי שגיאות, הצפנה ועיבוד מתמטי דטרמיניסטי באמצעות אלגוריתמי תוכנה וחומרות ייעודיות."
          - "אות הבסיס של המרחב הבדיד הוא הלם היחידה $\\delta[n]$, המוגדר כ-$\\delta[0] = 1$ ו-$\\delta[n] = 0$ עבור כל $n \\neq 0$. כל אות בדיד ניתן לפירוק מדויק כסכום משוקלל של הלמים מוזזים: $x[n] = \\sum_{k=-\\infty}^{\\infty} x[k] \\delta[n-k]$."
          - "סדרת מדרגת היחידה $u[n] = 1$ עבור $n \\ge 0$ (ו-$0$ עבור $n < 0$) מייצגת כניסה מתמדת. הקשר בין המדרגה להלם מוגדר על ידי גזירה לאחור: $\\delta[n] = u[n] - u[n-1]$."
      - title: "מערכות לינאריות בלתי משתנות בזמן (LTI) וקונבולוציה"
        figure:
          title: "תגובת הלם וקונבולוציה של מערכת LTI"
          svg: >
            <svg viewBox="0 0 500 120" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-height:120px;">
              <rect x="180" y="25" width="140" height="70" rx="10" fill="currentColor" fill-opacity="0.06" stroke="#6366f1" stroke-width="2"/>
              <text x="250" y="55" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">LTI System</text>
              <text x="250" y="75" font-size="12" fill="#6366f1" text-anchor="middle">h[n]</text>
              <line x1="60" y1="60" x2="175" y2="60" stroke="currentColor" stroke-width="2"/>
              <polygon points="175,60 165,55 165,65" fill="currentColor"/>
              <text x="110" y="48" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">x[n]</text>
              <line x1="325" y1="60" x2="435" y2="60" stroke="currentColor" stroke-width="2"/>
              <polygon points="440,60 430,55 430,65" fill="currentColor"/>
              <text x="385" y="48" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">y[n] = x[n] * h[n]</text>
            </svg>
          caption: "מערכת LTI מאופיינת באופן מלא על ידי תגובת ההלם שלה $h[n]$. המוצא לכל אות כניסה שרירותי $x[n]$ מחושב באמצעות קונבולוציה."
        points:
          - "מערכת מוגדרת כלינארית אם היא מקיימת את עקרון הסופרפוזיציה וההומוגניות: $T\\{a x_1[n] + b x_2[n]\\} = a T\\{x_1[n]\\} + b T\\{x_2[n]\\}$."
          - "מערכת מוגדרת כבלתי משתנה בזמן (Time-Invariant) אם הזזת הכניסה בזמן גוררת הזזה זהה במוצא: אם $x[n] \\to y[n]$, אזי $x[n - n_0] \\to y[n - n_0]$."
          - "תגובת ההלם $h[n] = T\\{\\delta[n]\\}$ היא מוצא המערכת עבור כניסת הלם יחידה. מכיוון שכל כניסה היא סכום של הלמים מוזזים, $h[n]$ מאפיין את המערכת באופן מלא ובלעדי לכל כניסה אפשרית."
          - "מוצא המערכת מחושב באמצעות סכום הקונבולוציה הבדיד: $y[n] = (x * h)[n] = \\sum_{k=-\\infty}^{\\infty} x[k] h[n-k]$. כל דגימת מוצא היא סופרפוזיציה של תגובות הלם מהעבר המשוקללות בדגימות הכניסה."
          - "הקונבולוציה הבדידה היא פעולה חילופית ($x * h = h * x$), אסוציאטיבית ($x * (h_1 * h_2) = (x * h_1) * h_2$) ודיסטריבוטיבית ($x * (h_1 + h_2) = x * h_1 + x * h_2$)."
      - title: "משוואות הפרשים, סיבתיות ויציבות BIBO"
        points:
          - "מערכות מעשיות ממומשות על ידי משוואות הפרשים לינאריות במקדמים קבועים (LCCDE): $\\sum_{k=0}^N a_k y[n-k] = \\sum_{m=0}^M b_m x[n-m]$ (עם $a_0 = 1$), המספקות את האלגוריתם החישובי לזמן אמת."
          - "מערכת היא סיבתית (Causal) אם המוצא ברגע $n$ תלוי אך ורק בדגימות כניסה עכשוויות וקודמות ($k \\le n$), ללא תלות בעתיד. במערכת LTI, סיבתיות מחייבת $h[n] = 0$ עבור כל $n < 0$."
          - "יציבות BIBO (כניסה חסומה - מוצא חסום) מבטיחה שכל אות כניסה חסום $|x[n]| \\le B_x < \\infty$ יניב מוצא חסום $|y[n]| \\le B_y < \\infty$, ללא התבדרות פנימית."
          - "התנאי ההכרחי והמספיק ליציבות BIBO במערכת LTI הוא שתגובת ההלם תהיה בעלת סכום ערכים מוחלטים סופי: $\\sum_{n=-\\infty}^{\\infty} |h[n]| < \\infty$."
    trivia:
      - type: multiple_choice
        question: "מדוע המרת אותות רציפים למספרים בדידים מונעת שחיקה ואיבוד איכות בשלבי עיבוד מרובים?"
        options:
          - "ערכים בדידים נשמרים כמספרים דיגיטליים מדויקים הניתנים להעתקה ולשידור ללא צבירת רעש אנלוגי"
          - "אותות בדידים מבטלים את כל התדרים הגבוהים"
          - "אותות בדידים נעים במוליכים ללא כל התנגדות חשמלית"
          - "מעבדים ספרתיים אינם צורכים הספק חשמלי"
        correct: 0
      - type: multiple_choice
        question: "מהי החשיבות המרכזית של תגובת ההלם $h[n]$ במערכת LTI?"
        options:
          - "היא מאפיינת את המערכת באופן מלא ומאפשרת לחשב את המוצא לכל אות כניסה באמצעות קונבולוציה"
          - "היא מודדת את תדר השעון של המעבד"
          - "היא המתח המרבי שהמערכת מסוגלת לספוג"
          - "היא מוגדרת אך ורק עבור אותות סינוס רציפים"
        correct: 0
      - type: multiple_choice
        question: "מהו הניסוח המתמטי של סכום הקונבולוציה הבדיד $y[n] = (x * h)[n]$?"
        options:
          - "$y[n] = \\sum_{k=-\\infty}^{\\infty} x[k] h[n-k]$"
          - "$y[n] = x[n] \\cdot h[n]$"
          - "$y[n] = \\frac{x[n]}{h[n]}$"
          - "$y[n] = \\sum_{k=0}^n (x[k] + h[k])$"
        correct: 0
      - type: multiple_choice
        question: "איזה תנאי חייבת תגובת ההלם $h[n]$ לקיים על מנת שמערכת LTI תהיה סיבתית (Causal)?"
        options:
          - "$h[n] = 0$ עבור כל $n < 0$"
          - "$h[n] = 0$ עבור כל $n > 0$"
          - "$h[0] = 1$"
          - "$\\sum_{n=0}^{\\infty} h[n] = 0$"
        correct: 0
      - type: multiple_choice
        question: "תחת איזה תנאי מערכת LTI בזמן בדיד מובטחת להיות יציבה במובן BIBO?"
        options:
          - "תגובת ההלם שלה מסתכמת בערכה המוחלט לערך סופי: $\\sum_{n=-\\infty}^{\\infty} |h[n]| < \\infty$"
          - "תגובת ההלם שלה קבועה ושווה ל-1"
          - "תגובת ההלם מתאפסת עבור כל $n \\ge 0$"
          - "אות הכניסה חייב להיות בעל אנרגיה אינסופית"
        correct: 0
      - type: multiple_choice
        question: "כיצד מוגדר מתמטית הלם היחידה הבדיד $\\delta[n]$?"
        options:
          - "$\\delta[n] = 1$ כאשר $n=0$, ו-$0$ עבור כל $n \\neq 0$"
          - "$\\delta[n] = \\infty$ בעל שטח של 1"
          - "$\\delta[n] = n$ עבור אינדקסים שלמים"
          - "$\\delta[n] = 1$ לכל $n \\ge 0$"
        correct: 0
      - type: multiple_choice
        question: "איזו תכונה מבטיחה שהכפלת הכניסה בסקלר $\\alpha$ תכפיל את המוצא באותו סקלר $\\alpha$ בדיוק?"
        options:
          - "לינאריות (הומוגניות / כפל בסקלר)"
          - "אי-תלות בזמן"
          - "סיבתיות"
          - "חוסר זיכרון"
        correct: 0
      - type: multiple_choice
        question: "אם מערכת LTI מניבה מוצא $y[n]$ עבור כניסה $x[n]$, מה יהיה המוצא עבור כניסה $x[n - k]$?"
        options:
          - "המוצא המוזז בזמן $y[n - k]$"
          - "המוצא המוכפל $k \\cdot y[n]$"
          - "מוצא הפוך בסימנו $-y[n]$"
          - "מוצא מאופס"
        correct: 0
      - type: multiple_choice
        question: "מהי התוצאה של קונבולוציה בין סדרה $x[n]$ להלם יחידה מוזז $\\delta[n - n_0]$?"
        options:
          - "הסדרה המוזזת $x[n - n_0]$"
          - "המכפלה $n_0 \\cdot x[n]$"
          - "סדרת האפסים"
          - "ההפרש $x[n] - x[n_0]$"
        correct: 0
      - type: multiple_choice
        question: "אם מבצעים קונבולוציה בין סדרה $x_1[n]$ באורך $L_1$ לסדרה $x_2[n]$ באורך $L_2$, מה יהיה אורכה הכולל של סדרת המוצא?"
        options:
          - "$L_1 + L_2 - 1$"
          - "$L_1 \\times L_2$"
          - "$\\max(L_1, L_2)$"
          - "$L_1 + L_2$"
        correct: 0
      - type: multiple_choice
        question: "מדוע משוואות הפרשים מהוות בסיס מרכזי במימוש מעשי של עיבוד אותות ספרתי?"
        options:
          - "הן מגדירות את הפעולות האריתמטיות הרקורסיביות המבוצעות בכל דגימה בתוכנה ובחומרה"
          - "הן מבטלות את הצורך במסנני אנטי-אליאסינג"
          - "הן מאפשרות לאותות שמע אינסופיים לתפוס בייט בודד של זיכרון"
          - "הן ממירות אותות דיגיטליים למתח פיזיקלי"
        correct: 0
      - type: multiple_choice
        question: "כיצד מוגדר אות אנרגיה בזמן בדיד?"
        options:
          - "אות שסך האנרגיה הכוללת שלו $E = \\sum_{n=-\\infty}^{\\infty} |x[n]|^2$ היא מספר סופי"
          - "אות בעל הספק ממוצע אינסופי"
          - "תהליך אקראי בלתי דטרמיניסטי"
          - "רשת מעבירת-כל"
        correct: 0
      - type: multiple_choice
        question: "אם מערכת מוגדרת על ידי $y[n] = x[n] + 5$, מדוע היא אינה מערכת לינארית?"
        options:
          - "עבור כניסת אפס $x[n]=0$ מתקבל מוצא $y[n]=5 \\neq 0$, מה שמפר את תנאי הלינאריות $T\\{0\\}=0$"
          - "היא משהה את האות ב-5 דגימות"
          - "5 הוא מספר אי-זוגי"
          - "יש לה זיכרון אינסופי"
        correct: 0
      - type: multiple_choice
        question: "אם מערכת מוגדרת על ידי $y[n] = n \\cdot x[n]$, איזו תכונה יסודית היא מפרה?"
        options:
          - "אי-תלות בזמן (המקדם $n$ התלוי בזמן גורם לתגובת המערכת להשתנות לאורך הזמן)"
          - "לינאריות"
          - "סיבתיות"
          - "חוסר זיכרון"
        correct: 0
      - type: multiple_choice
        question: "מהו הקשר המתמטי בין מדרגת היחידה $u[n]$ להלם היחידה $\\delta[n]$?"
        options:
          - "$\\delta[n] = u[n] - u[n-1]$ ו-$u[n] = \\sum_{k=-\\infty}^n \\delta[k]$"
          - "$\\delta[n] = u[n] \\cdot u[n-1]$"
          - "$\\delta[n] = u[n] + u[n-1]$"
          - "$u[n] = \\delta[n] - \\delta[n-1]$"
        correct: 0

  - id: z_transform_frequency
    title: "2. התמרת Z וניתוח תדר"
    description: >
      מישור ה-z המרוכב, פונקציות תמסורת, ניתוח גאומטרי של קטבים ואפסים, תחום התכנסות (ROC) והתמרת פורייה בזמן בדיד (DTFT).
    cards:
      - title: "התמרת Z ותחום ההתכנסות (ROC)"
        figure:
          title: "מפת קטבים ואפסים במישור ה-Z ומעגל היחידה"
          svg: >
            <svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-height:220px;">
              <line x1="20" y1="110" x2="380" y2="110" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
              <line x1="200" y1="10" x2="200" y2="210" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
              <circle cx="200" cy="110" r="75" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="5,3"/>
              <circle cx="200" cy="110" r="50" fill="none" stroke="#059669" stroke-width="1.5"/>
              <!-- Poles (x) and Zeros (o) -->
              <line x1="240" y1="75" x2="250" y2="85" stroke="#e11d48" stroke-width="2.5"/>
              <line x1="250" y1="75" x2="240" y2="85" stroke="#e11d48" stroke-width="2.5"/>
              <line x1="240" y1="135" x2="250" y2="145" stroke="#e11d48" stroke-width="2.5"/>
              <line x1="250" y1="135" x2="240" y2="145" stroke="#e11d48" stroke-width="2.5"/>
              <circle cx="200" cy="35" r="5" fill="none" stroke="#0284c7" stroke-width="2.5"/>
              <circle cx="200" cy="185" r="5" fill="none" stroke="#0284c7" stroke-width="2.5"/>
              <text x="375" y="104" font-size="11" fill="currentColor" opacity="0.8">Re(z)</text>
              <text x="206" y="22" font-size="11" fill="currentColor" opacity="0.8">Im(z)</text>
              <text x="280" y="104" font-size="11" fill="#6366f1">|z|=1</text>
              <text x="256" y="78" font-size="11" font-weight="bold" fill="#e11d48">קוטב (×)</text>
              <text x="210" y="40" font-size="11" font-weight="bold" fill="#0284c7">אפס (○)</text>
            </svg>
          caption: "מישור ה-z המרוכב עם מעגל היחידה ($|z|=1$), קטבים צמודים ($\\times$) בתוך המעגל המייצרים הגבר תהודה, ואפסים ($\\circ$) על המעגל המייצרים ניחות אפס."
        points:
          - "התמרת Z הדו-צדדית מכלילה את ניתוח התדר הבדיד על ידי היטל של הסדרה $x[n]$ על פונקציות בסיס מרוכבות $z = r e^{j\\omega}$: $X(z) = \\mathcal{Z}\\{x[n]\\} = \\sum_{n=-\\infty}^{\\infty} x[n] z^{-n}$."
          - "התמרת ה-Z ממירה קונבולוציה בזמן לכפל אלגברי: $\\mathcal{Z}\\{x[n] * h[n]\\} = X(z) \\cdot H(z)$, מה שהופך משוואות הפרשים לפונקציות תמסורת רציונליות $H(z) = Y(z) / X(z)$."
          - "תחום ההתכנסות (ROC) הוא קבוצת הנקודות במישור ה-z שבהן טור החזקות $\\sum |x[n] z^{-n}|$ מתכנס בהחלט. ה-ROC מהווה תמיד טבעת מעגלית סביב הראשית: $r_R < |z| < r_L$."
          - "תכונות מפתח של ה-ROC: (1) ה-ROC אינו מכיל קטבים לעולם; (2) עבור סדרות סיבתיות ימניות, ה-ROC משתרע מהקוטב החיצוני ביותר החוצה: $|z| > r_{\\max}$; (3) מערכת LTI היא יציבה במובן BIBO אם ורק אם מעגל היחידה $|z| = 1$ מוכל בתוך ה-ROC."
      - title: "גאומטריית קטבים ואפסים ופונקציית התמסורת H(z)"
        points:
          - "פונקציית התמסורת הרציונלית $H(z) = \\frac{\\sum_{m=0}^M b_m z^{-m}}{\\sum_{k=0}^N a_k z^{-k}} = b_0 \\frac{\\prod_{m=1}^M (1 - c_m z^{-1})}{\\prod_{k=1}^N (1 - d_k z^{-1})}$ מתוארת באופן מלא על ידי אפסיה $c_m$ (שבהם $H(z)=0$) וקטביה $d_k$ (שבהם $H(z) \\to \\infty$)."
          - "הערכת תדר גאומטרית: כאשר התדר $\\omega$ נע לאורך מעגל היחידה $z = e^{j\\omega}$, תגובת המשרעת $|H(e^{j\\omega})|$ פרופורציונית למכפלת מרחקי הווקטורים מכל האפסים ל-$e^{j\\omega}$, מחולקת במכפלת המרחקים מכל הקטבים ל-$e^{j\\omega}$."
          - "קטבים הממוקמים בסמוך למעגל היחידה יוצרים שיאי הגבר תהודה חדים בזווית $\\omega = \\arg(d_k)$. אפסים הממוקמים ישירות על מעגל היחידה מייצרים ניחות מלא (מסנני Notch)."
          - "מערכת LTI סיבתית היא יציבה BIBO אם ורק אם כל קטביה ממוקמים ממש בתוך מעגל היחידה: $|d_k| < 1$ לכל $k$."
      - title: "התמרת פורייה בזמן בדיד (DTFT)"
        points:
          - "הערכת התמרת ה-Z לאורך מעגל היחידה ($z = e^{j\\omega}$) מניבה את התמרת פורייה בזמן בדיד (DTFT): $X(e^{j\\omega}) = \\sum_{n=-\\infty}^{\\infty} x[n] e^{-j\\omega n}$."
          - "ה-DTFT מייצגת את ספקטרום התדר הרציף של סדרות בדידות. מכיוון שתנועה של $2\\pi$ רדיאנים סביב מעגל היחידה מחזירה לאותה נקודה גאומטרית, ה-DTFT היא מחזורית ב-$2\\pi$: $X(e^{j(\\omega + 2\\pi)}) = X(e^{j\\omega})$."
          - "התמרת ה-DTFT ההפוכה משחזרת את הסדרה באמצעות אינטגרציה: $x[n] = \\frac{1}{2\\pi} \\int_{-\\pi}^{\\pi} X(e^{j\\omega}) e^{j\\omega n} d\\omega$."
          - "תגובת הפאזה $\\theta(\\omega) = \\arg H(e^{j\\omega})$ קובעת את השהיית האות. מסנני פאזה לינארית מאופיינים בהשהיית חבורה קבועה $\\tau_g(\\omega) = -\\frac{d\\theta(\\omega)}{d\\omega} = \\text{const}$, המונעת עיוותי צורת גל."
    trivia:
