              <line x1="380" y1="80" x2="380" y2="35" stroke="#6366f1" stroke-width="2.5"/><circle cx="380" cy="35" r="4" fill="#6366f1"/>
              <line x1="410" y1="80" x2="410" y2="80" stroke="#6366f1" stroke-width="2.5"/><circle cx="410" cy="80" r="4" fill="#6366f1"/>
