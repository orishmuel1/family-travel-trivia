        \  <text x=\"260\" y=\"50\" font-size=\"9\" fill=\"#059669\" text-anchor=\"middle\">מרווח הפרדה</text>\n  <text x=\"\
        20\" y=\"115\" font-size=\"11\" font-weight=\"bold\" fill=\"#e11d48\">(b) fs &lt; 2·fmax (דגימת חסר — התנגשות ועיוות\
        \ קיפול)</text>\n  <line x1=\"20\" y1=\"165\" x2=\"480\" y2=\"165\" stroke=\"currentColor\" stroke-width=\"1.2\" opacity=\"\
        0.4\"/>\n  <polygon points=\"110,165 170,125 230,165\" fill=\"#6366f1\" fill-opacity=\"0.3\" stroke=\"#6366f1\" stroke-width=\"\
        1.5\"/>\n  <polygon points=\"210,165 270,125 330,165\" fill=\"#e11d48\" fill-opacity=\"0.3\" stroke=\"#e11d48\" stroke-width=\"\
        1.5\" stroke-dasharray=\"3,3\"/>\n  <polygon points=\"210,165 220,152 230,165\" fill=\"#e11d48\" fill-opacity=\"0.8\"\
        />\n  <text x=\"220\" y=\"145\" font-size=\"9\" font-weight=\"bold\" fill=\"#e11d48\" text-anchor=\"middle\">חפיפה</text>\n\
        \  <text x=\"170\" y=\"160\" font-size=\"10\" fill=\"currentColor\" text-anchor=\"middle\">0</text>\n  <text x=\"\
        270\" y=\"160\" font-size=\"10\" fill=\"currentColor\" text-anchor=\"middle\">fs</text>\n</svg>\n"
      caption: הדגימה משכפלת את הספקטרום הרציף בכל כפולה של $f_s$. אם $f_s \ge 2 f_{\max}$, השכפולים מופרדים. אם $f_s < 2
        f_{\max}$, תדרים גבוהים מתנגשים ומתקפלים לתחום הנמוך (Aliasing).
    points:
    - האם ראיתם פעם סרט שבו גלגלי מכונית נוסעת נראים פתאום כאילו הם מסתובבים לאחור? האשליה האופטית הזו מתרחשת מכיוון שמצלמת
      הקולנוע (הדוגמת 24 תמונות בשנייה) מצלמת בקצב איטי מכדי לעקוב אחר מהירות החישורים.
    - 'בעיבוד אותות, תופעה זו נקראת **Aliasing (קיפול תדרים)**: כאשר דוגמים גל מהיר בקצב איטי מדי, נקודות הדגימה משרטטות גל
      מדומה בעל תדר נמוך בהרבה שכלל לא היה קיים באות המקורי.'
    - '**משפט הדגימה של נייקוויסט-שאנון**: כדי להקליט צליל במדויק וללא גלים מתחזים, חובה לדגום בקצב הגדול ממש מפי שניים מהתדר
      המרבי הקיים בצליל: $f_s > 2 f_{\max}$.'
    - קצב הדגימה המינימלי הבטוח $2 f_{\max}$ נקרא **קצב נייקוויסט**. התדר המרבי שמערכת דיגיטלית מסוגלת לייצג חוקית ($f_s /
      2$) נקרא **תדר נייקוויסט** (או תדר הקיפול).
  - title: 'שומרי ה-Anti-Aliasing: מדוע תוכנה לא יכולה לתקן דגימה שגויה'
    points:
    - 'במישור התדר, פעולת הדגימה פועלת כמראה מחזורית: היא משכפלת עותקים אינסופיים של הספקטרום המקורי בכל כפולה של תדר הדגימה
      ($0, \pm f_s, \pm 2f_s, \dots$).'
    - אם קצב הדגימה מהיר מספיק ($f_s \ge 2 f_{\max}$), העותקים עומדים בנחת זה לצד זה עם מרווחי הפרדה ריקים ביניהם.
    - אם $f_s < 2 f_{\max}$, העותקים מתנגשים וחופפים. אנרגיית תדר גבוה גולשת מעבר לגבול $f_s/2$ ומתקפלת לתוך התחום הנשמע.
    - מדוע אי אפשר לתקן עיוות קיפול באמצעות תוכנה לאחר ההקלטה? מכיוון שברגע שהרמוניות גבוהות של כינור התקפלו על תדרי באס,
      הן מסתכמות לאותם מספרים ממש בזיכרון. זה כמו לערבב צבע כחול וצהוב לירוק—שום קוד אינו יכול להפריד חזרה את הצבע הכחול המקורי.
    - לכן, **מסנן אנטי-אליאסינג (AAF)** אנלוגי חייב לעמוד בחומרה הפיזית *לפני* שבב ה-ADC, ולחתוך לחלוטין כל תדר שמעל $f_s/2$
      טרם ביצוע הדגימה.
    - 'זהו ההסבר לתקן ה-CD: השמיעה האנושית מגיעה עד $20\text{ kHz}$. כפול מזה הוא $40\text{ kHz}$. התקן נקבע על $44.1\text{
      kHz}$ כדי לספק מרווח מעבר של $4.1\text{ kHz}$ למסננים אנלוגיים מעשיים לדעוך בצורה חלקה.'
  - title: 'שחזור העולם הרציף: נוסחת ה-Sinc המושלמת'
    points:
    - כיצד בונים מחדש גל רציף וחלק מרשימה של נקודות בדידות? נדמה שהמידע שבין הנקודות אבד לנצח—אך מתמטית הוא אינו אבוד!
    - 'קלוד שאנון הוכיח שאם נחליף כל נקודת דגימה ב**גל Sinc** רציף $\text{sinc}(t/T_s) = \frac{\sin(\pi t / T_s)}{\pi t /
      T_s}$ ונסכום אותם, האדוות משתלבות בשלמות מתמטית מופלאה ומשחזרות במדויק של 100% את הגל הרציף המקורי: $x(t) = \sum x[n]
      \text{sinc}\left(\frac{t - n T_s}{T_s}\right)$.'
    - בחומרת ממירי DAC מעשיים, מעגל **Zero-Order Hold (ZOH)** שומר על מתח מוצא קבוע בערך הדגימה למשך $T_s$, מה שיוצר גל מדרגות
      זעיר, ולאחריו מסנן שחזור אנלוגי המלטש את המדרגות למוזיקה חלקה.
