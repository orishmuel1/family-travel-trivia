  - id: digital_filter_design
    title: "4. תכנון מסננים ספרתיים"
    description: >
      ארכיטקטורות FIR לעומת IIR, תכנון מסנני פאזה לינארית באמצעות חלונות, אלגוריתם פארקס-מקלילן והתמרת בילינאר.
    cards:
      - title: "מסנני FIR לעומת מסנני IIR: ארכיטקטורה ושיקולי תכנון"
        points:
          - "מסנני תגובת הלם סופית (FIR) מתאפיינים בתגובת הלם שדועכת לאפס תוך זמן סופי: $y[n] = \\sum_{k=0}^{M} b_k x[n-k]$. הם אינם רקורסיביים, מבוססי משוב קדמי בלבד ויציבים ללא תנאי."
          - "מסנני תגובת הלם אינסופית (IIR) כוללים משוב חוזר: $y[n] = \\sum_{m=0}^M b_m x[n-m] - \\sum_{k=1}^N a_k y[n-k]$. הם משיגים שיפועי קטעון חדים בהרבה עם פחות מקדמים, אך עלולים להיות לא יציבים והפאזה שלהם אינה לינארית."
          - "מסנני FIR יכולים להבטיח פאזה לינארית מדויקת (השהיית חבורה קבועה לחלוטין), דבר שבלתי אפשרי במסנני IIR סיבתיים מעשיים."
      - title: "תכנון מסנני FIR בשיטת החלונות"
        points:
          - "מסנן אידיאלי בעל קירות זקופים (Brick-wall) דורש תגובת הלם אינסופית ולא-סיבתית: $h_{\\text{ideal}}[n] = \\frac{\\sin(\\omega_c (n - M/2))}{\\pi (n - M/2)}$."
          - "שיטת החלון קוטמת ומשקללת את $h_{\\text{ideal}}[n]$ באמצעות פונקציית חלון $w[n]$: $h[n] = h_{\\text{ideal}}[n] \\cdot w[n]$."
          - "טרייד-אוף החלונות: רוחב האונה הראשית קובע את רוחב תחום המעבר; גובה אונות הצד קובע את עוצמת הניחות בפס החסימה."
          - "חלונות מקובלים: חלון מלבני (אונה ראשית צרה, אך ניחות גרוע של $-13\\text{ dB}$ בלבד), חלון האנינג ($-31\\text{ dB}$), חלון המינג ($-43\\text{ dB}$), חלון בלקמן ($-58\\text{ dB}$) וחלון קייזר (הכולל פרמטר $\\beta$ לכוונון גמיש ורציף)."
      - title: "תכנון מסנני IIR והתמרת בילינאר (Bilinear Transformation)"
        points:
          - "מסנני IIR מתוכננים על פי רוב על ידי התמרת אבות-טיפוס אנלוגיים קלאסיים (באטרוורת', צ'בישב מסוג 1 ו-2, אליפטי) למישור ה-z הבדיד."
          - "התמרת בילינאר ממפה את מישור ה-s הרציף למישור ה-z הבדיד באמצעות: $s = \\frac{2}{T} \\frac{1 - z^{-1}}{1 + z^{-1}}$."
          - "ההתמרה ממפה את כל הציר המדומה $j\\Omega$ של מישור ה-s על מעגל היחידה $|z| = 1$, ובכך מונעת לחלוטין עיוותי קיפול (Aliasing)."
          - "מכיוון שהמיפוי אינו לינארי (עיוות תדר / Frequency Warping: $\\omega = 2 \\arctan(\\Omega T / 2)$), חובה לבצע תיקון מקדים של התדרים האנלוגיים (Pre-warping) לפני ההתמרה: $\\Omega = \\frac{2}{T} \\tan(\\omega / 2)$."
    trivia:
      - type: multiple_choice
        question: "מדוע מסנני FIR (תגובת הלם סופית) יציבים ללא תנאי תמיד?"
        options:
          - "מכיוון שכל הקטבים שלהם ממוקמים אך ורק בראשית הצירים $z = 0$"
          - "מכיוון שהם משתמשים בחוגי משוב"
          - "מכיוון שזמן ההשהיה שלהם אפס"
          - "מכיוון שתגובת התדר שלהם קבועה"
        correct: 0
      - type: multiple_choice
        question: "מהו היתרון המרכזי של מסנני IIR לעומת מסנני FIR עבור מפרט סינון נתון?"
        options:
          - "הם דורשים משמעותית פחות מקדמים ומשאבי חישוב כדי להשיג שיפוע הנחתה חד"
          - "הם מבטיחים פאזה לינארית מושלמת"
          - "אין בהם שגיאות עיגול כלל"
          - "הם תמיד אינם רקורסיביים"
        correct: 0
      - type: multiple_choice
        question: "בתכנון מסנני FIR בשיטת החלונות, איזו תופעה לא רצויה נגרמת מקטימה חדה באמצעות חלון מלבני?"
        options:
