    - 17 קילו-הרץ
    correct: 0
    explanation: 'בעיבוד אותות, תופעה זו נקראת **Aliasing (קיפול תדרים)**: כאשר דוגמים גל מהיר בקצב איטי מדי, נקודות הדגימה
      משרטטות גל מדומה בעל תדר נמוך בהרבה שכלל לא היה קיים באות המקורי.'
  - type: multiple_choice
    question: איזו פונקציה מתמטית משמשת כפולס האינטרפולציה הרציף האידיאלי בנוסחת השחזור של ויטאקר-שאנון?
    options:
    - 'פונקציית ה-sinc המנורמלת: $\text{sinc}= \frac{\sin}{\pi u}$'
    - פעמון גאוסי
    - פולס משולש חד
    - שיפוע לינארי
    correct: 0
    explanation: 'קלוד שאנון הוכיח שאם נחליף כל נקודת דגימה ב**גל Sinc** רציף $\text{sinc}(t/T_s) = \frac{\sin(\pi t / T_s)}{\pi
      t / T_s}$ ונסכום אותם, האדוות משתלבות בשלמות מתמטית מופלאה ומשחזרות במדויק של 100% את הגל הרציף המקורי: $x(t) = \sum
