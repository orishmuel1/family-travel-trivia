          - "Because it runs at double the clock speed"
          - "Because it is made of physical copper wires"
        correct: 0
      - type: multiple_choice
        question: "What is the primary operational advantage of an IIR filter over an FIR filter of equivalent frequency steepness?"
        options:
          - "It requires significantly fewer calculations and coefficients, conserving CPU power"
