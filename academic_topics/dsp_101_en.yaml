          - "The impulse response is equal to a constant 1 forever"
          - "The impulse response is non-causal"
          - "The input signal must have infinite energy"
        correct: 0
      - type: multiple_choice
        question: "How is the discrete unit impulse $\\delta[n]$ defined mathematically?"
        options:
          - "$\\delta[n] = 1$ when $n=0$, and $0$ for all other integer indices $n \\neq 0$"
          - "$\\delta[n] = \\infty$ with an area of 1"
          - "$\\delta[n] = n$ for all positive numbers"
          - "$\\delta[n] = 1$ for all time"
        correct: 0
      - type: multiple_choice
        question: "Which property of a system ensures that doubling the amplitude of the input doubles the amplitude of the output?"
        options:
          - "Linearity (Homogeneity / Scaling property)"
