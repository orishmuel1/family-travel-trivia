      - type: multiple_choice
        question: "Why was 44.1 kHz selected as the standard sampling frequency for Compact Disc (CD) digital audio?"
        options:
          - "To cover the 20 kHz human hearing limit (40 kHz Nyquist rate) while providing a 4.1 kHz transition band for analog anti-aliasing filters"
          - "Because it equals the speed of sound in air"
