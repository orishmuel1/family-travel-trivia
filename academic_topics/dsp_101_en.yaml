  - id: dft_and_fft_algorithms
    title: "5. The Discrete Fourier Transform & Fast Algorithms"
    description: >
      The discrete Fourier transform, circular vs. linear convolution, spectral resolution and windowing leakage, and the Cooley-Tukey radix-2 FFT algorithm.
    cards:
      - title: "The Discrete Fourier Transform (DFT)"
        figure:
          title: "The Radix-2 FFT 2-Point Butterfly Operation"
          svg: >
            <svg viewBox="0 0 450 140" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-height:140px;">
              <!-- Inputs -->
              <text x="30" y="45" font-size="12" font-weight="bold" fill="currentColor">A</text>
              <text x="30" y="105" font-size="12" font-weight="bold" fill="currentColor">B</text>
              <!-- Lines -->
              <line x1="50" y1="40" x2="350" y2="40" stroke="currentColor" stroke-width="2"/>
              <line x1="50" y1="100" x2="350" y2="100" stroke="currentColor" stroke-width="2"/>
              <!-- Cross lines -->
              <line x1="100" y1="100" x2="300" y2="40" stroke="#6366f1" stroke-width="2"/>
              <line x1="100" y1="40" x2="300" y2="100" stroke="#6366f1" stroke-width="2"/>
              <!-- Twiddle factor -->
              <circle cx="150" cy="100" r="14" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="1.5"/>
              <text x="150" y="104" font-size="10" font-weight="bold" fill="#0284c7" text-anchor="middle">WN^k</text>
              <!-- -1 on lower cross -->
              <text x="280" y="80" font-size="11" font-weight="bold" fill="#e11d48">-1</text>
              <!-- Outputs -->
              <text x="365" y="45" font-size="12" font-weight="bold" fill="currentColor">A + WN^k · B</text>
              <text x="365" y="105" font-size="12" font-weight="bold" fill="currentColor">A - WN^k · B</text>
            </svg>
          caption: "The basic Cooley-Tukey Radix-2 FFT Butterfly computation combining two complex inputs with twiddle factor $W_N^k = e^{-j 2\\pi k / N}$."
        points:
          - "The Discrete Fourier Transform (DFT) converts a finite sequence of $N$ time samples into $N$ discrete frequency samples: $X[k] = \\sum_{n=0}^{N-1} x[n] W_N^{k n}$ where $W_N = e^{-j \\frac{2\\pi}{N}}$ is the twiddle factor."
          - "The Inverse DFT reconstructs the sequence: $x[n] = \\frac{1}{N} \\sum_{k=0}^{N-1} X[k] W_N^{-k n}$."
          - "The $N$-point DFT samples the continuous DTFT spectrum $X(e^{j\\omega})$ at $N$ uniformly spaced points along the unit circle: $\\omega_k = \\frac{2\\pi k}{N}$ for $k = 0, 1, \\dots, N-1$."
          - "Because the DFT implicitly treats signals as periodic with period $N$, multiplying two DFTs in frequency produces Circular (cyclic) Convolution in time: $y[n] = (x_1 \\circledast x_2)[n] = \\sum_{m=0}^{N-1} x_1[m] x_2[((n - m))_N]$."
          - "To compute linear convolution of lengths $L$ and $P$ using the DFT without circular wrap-around distortion, both sequences must be zero-padded to minimum length $N \\ge L + P - 1$."
      - title: "Spectral Resolution, Leakage & Windowing"
        points:
          - "Physical frequency resolution is governed by observation duration $T_{\\text{total}} = N T_s$: the minimum resolvable separation between two sinusoidal tones is $\\Delta f = 1 / T_{\\text{total}} = f_s / N$."
          - "Zero-padding increases the density of frequency samples (interpolating the DTFT display smoothly), but does NOT improve physical separation between closely spaced spectral peaks."
