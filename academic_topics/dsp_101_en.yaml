id: dsp_101_en
type: academic
icon: "📡"
title: "Digital Signal Processing (DSP 101)"
description: >
  A rigorous and intuitive engineering curriculum covering discrete-time systems, LTI convolution, Z-plane pole-zero analysis, sampling theory, digital filter design, and fast spectral algorithms.
lang: en
audience: family
categories:
  - id: foundations_discrete_time
    title: "1. Foundations & Discrete-Time Systems"
    description: >
      Discrete-time signal representations, impulse response characterization, convolution mechanics, causality, and the BIBO stability boundary.
    cards:
      - title: "Discrete-Time Signals & Discretization"
        figure:
          title: "Continuous vs. Discrete-Time Sampling"
          svg: >
            <svg viewBox="0 0 500 160" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-height:160px;">
              <line x1="30" y1="80" x2="480" y2="80" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
              <line x1="50" y1="10" x2="50" y2="150" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
              <path d="M 50 80 Q 110 -10, 170 80 T 290 80 T 410 80 T 480 80" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.5"/>
              <!-- Stems -->
              <line x1="50" y1="80" x2="50" y2="80" stroke="#6366f1" stroke-width="2.5"/><circle cx="50" cy="80" r="4" fill="#6366f1"/>
              <line x1="80" y1="80" x2="80" y2="35" stroke="#6366f1" stroke-width="2.5"/><circle cx="80" cy="35" r="4" fill="#6366f1"/>
              <line x1="110" y1="80" x2="110" y2="20" stroke="#6366f1" stroke-width="2.5"/><circle cx="110" cy="20" r="4" fill="#6366f1"/>
              <line x1="140" y1="80" x2="140" y2="35" stroke="#6366f1" stroke-width="2.5"/><circle cx="140" cy="35" r="4" fill="#6366f1"/>
              <line x1="170" y1="80" x2="170" y2="80" stroke="#6366f1" stroke-width="2.5"/><circle cx="170" cy="80" r="4" fill="#6366f1"/>
              <line x1="200" y1="80" x2="200" y2="125" stroke="#6366f1" stroke-width="2.5"/><circle cx="200" cy="125" r="4" fill="#6366f1"/>
              <line x1="230" y1="80" x2="230" y2="140" stroke="#6366f1" stroke-width="2.5"/><circle cx="230" cy="140" r="4" fill="#6366f1"/>
              <line x1="260" y1="80" x2="260" y2="125" stroke="#6366f1" stroke-width="2.5"/><circle cx="260" cy="125" r="4" fill="#6366f1"/>
              <line x1="290" y1="80" x2="290" y2="80" stroke="#6366f1" stroke-width="2.5"/><circle cx="290" cy="80" r="4" fill="#6366f1"/>
              <line x1="320" y1="80" x2="320" y2="35" stroke="#6366f1" stroke-width="2.5"/><circle cx="320" cy="35" r="4" fill="#6366f1"/>
              <line x1="350" y1="80" x2="350" y2="20" stroke="#6366f1" stroke-width="2.5"/><circle cx="350" cy="20" r="4" fill="#6366f1"/>
              <line x1="380" y1="80" x2="380" y2="35" stroke="#6366f1" stroke-width="2.5"/><circle cx="380" cy="35" r="4" fill="#6366f1"/>
              <line x1="410" y1="80" x2="410" y2="80" stroke="#6366f1" stroke-width="2.5"/><circle cx="410" cy="80" r="4" fill="#6366f1"/>
              <text x="440" y="72" font-size="11" fill="currentColor" opacity="0.8">n</text>
              <text x="56" y="24" font-size="11" fill="currentColor" opacity="0.8">x[n]</text>
              <text x="140" y="98" font-size="10" fill="#6366f1">Ts</text>
            </svg>
          caption: "Continuous signal $x(t)$ (dashed curve) sampled uniformly at intervals $T_s$ into the discrete sequence $x[n] = x(n T_s)$."
        points:
          - "Physical signals (acoustic pressure, electromagnetic radiation, sensor voltages) exist as continuous functions of time $x(t) \\in \\mathbb{R}$. In analog processing, every transmission stage and active component introduces thermal noise and physical distortion."
          - "Digital Signal Processing operates on ordered discrete sequences $x[n]$, where index $n \\in \\mathbb{Z}$ represents the integer sample count acquired at uniform sampling intervals $T_s = 1/f_s$."
          - "Once digitized, signals are represented as exact numerical data words. They can be transmitted losslessly across digital networks, stored indefinitely without degradation, and processed by deterministic software algorithms."
          - "The elementary probe of discrete systems is the unit impulse $\\delta[n]$, defined as $\\delta[0] = 1$ and $\\delta[n] = 0$ for all $n \\neq 0$. Any discrete sequence can be decomposed into an exact weighted sum of shifted impulses: $x[n] = \\sum_{k=-\\infty}^{\\infty} x[k] \\delta[n-k]$."
          - "The unit step sequence $u[n] = 1$ for $n \\ge 0$ (and $0$ for $n < 0$) represents the response to a sustained constant input. It relates to the impulse via backward differentiation: $\\delta[n] = u[n] - u[n-1]$."
      - title: "Linear Time-Invariant (LTI) Systems & Convolution"
        figure:
          title: "LTI System Impulse Response & Convolution"
          svg: >
            <svg viewBox="0 0 500 120" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-height:120px;">
              <rect x="180" y="25" width="140" height="70" rx="10" fill="currentColor" fill-opacity="0.06" stroke="#6366f1" stroke-width="2"/>
              <text x="250" y="55" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">LTI System</text>
              <text x="250" y="75" font-size="12" fill="#6366f1" text-anchor="middle">h[n]</text>
              <!-- Arrows -->
              <line x1="60" y1="60" x2="175" y2="60" stroke="currentColor" stroke-width="2" marker-end="url(#arrow)"/>
              <polygon points="175,60 165,55 165,65" fill="currentColor"/>
              <text x="110" y="48" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">x[n]</text>
              <line x1="325" y1="60" x2="435" y2="60" stroke="currentColor" stroke-width="2"/>
              <polygon points="440,60 430,55 430,65" fill="currentColor"/>
              <text x="385" y="48" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">y[n] = x[n] * h[n]</text>
            </svg>
          caption: "An LTI system is fully characterized by its impulse response $h[n]$. The output $y[n]$ for any arbitrary input $x[n]$ is computed via convolution."
        points:
          - "A system is Linear if it satisfies the principle of superposition: scaling and summing inputs produces an identical scaled sum of outputs: $T\\{a x_1[n] + b x_2[n]\\} = a T\\{x_1[n]\\} + b T\\{x_2[n]\\}$."
          - "A system is Time-Invariant if a time shift in the input signal causes an identical time shift in the output: if $x[n] \\to y[n]$, then $x[n - n_0] \\to y[n - n_0]$."
          - "The impulse response $h[n] = T\\{\\delta[n]\\}$ is the output of an LTI system when excited by a single unit impulse. Because any input is a sum of shifted impulses, $h[n]$ completely and uniquely defines the system behavior for all possible inputs."
          - "The system output is computed via the discrete convolution sum: $y[n] = (x * h)[n] = \\sum_{k=-\\infty}^{\\infty} x[k] h[n-k]$. Each output sample is a superposition of past impulse responses weighted by prior input samples."
          - "Discrete convolution is commutative ($x * h = h * x$), associative ($x * (h_1 * h_2) = (x * h_1) * h_2$), and distributive ($x * (h_1 + h_2) = x * h_1 + x * h_2$)."
      - title: "Difference Equations, Causality & BIBO Stability"
        points:
          - "Practical discrete-time processors implement Linear Constant-Coefficient Difference Equations (LCCDE): $\\sum_{k=0}^N a_k y[n-k] = \\sum_{m=0}^M b_m x[n-m]$ (with $a_0 = 1$), which provide the recursive arithmetic formula for real-time computation."
          - "A system is Causal if the output at index $n$ depends only on current and previous inputs ($k \\le n$), preventing non-physical dependence on future events. For an LTI system, causality requires $h[n] = 0$ for all $n < 0$."
          - "Bounded-Input Bounded-Output (BIBO) Stability requires that every finite input $|x[n]| \\le B_x < \\infty$ produces a finite output $|y[n]| \\le B_y < \\infty$, preventing unbounded internal energy accumulation."
          - "The necessary and sufficient condition for an LTI system to be BIBO stable is that its impulse response is absolutely summable: $\\sum_{n=-\\infty}^{\\infty} |h[n]| < \\infty$."
    trivia:
      - type: multiple_choice
