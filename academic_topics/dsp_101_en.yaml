  - id: digital_filter_design
    title: "4. Digital Filter Design"
    description: >
      Sculpting sound: the rock-solid safety of FIR filters, the acoustic feedback power of IIR filters, windowing art, and the bilinear wormhole.
    cards:
      - title: "FIR vs. IIR: The Two Master Philosophies"
        points:
          - "Digital filters are the sculptors of sound: boosting bass on headphones, canceling background airplane engine roar, or isolating faint heartbeat pulses in medical monitors."
          - "**FIR (Finite Impulse Response)**: Think of an FIR filter as a smooth rolling average. Because it has no feedback loops ($y[n] = \\sum b_k x[n-k]$), it is **unconditionally stable**—it can never oscillate out of control or blow up. Even better, it can achieve perfect **Linear Phase** (zero waveform distortion). The tradeoff: it needs many calculations (high order)."
          - "**IIR (Infinite Impulse Response)**: Think of an IIR filter as an acoustic feedback loop ($y[n] = \\sum b_m x[n-m] - \\sum a_k y[n-k]$). Because it recycles previous outputs, it can create razor-sharp frequency cuts with very few equations. But like a microphone placed too close to a speaker, poor design can cause it to squeal uncontrollably into instability."
      - title: "The Windowing Art (Taming the Gibbs Ripple)"
        points:
          - "An 'ideal' brick-wall filter (cutting off audio with vertical steepness) would require an impulse response that stretches infinitely into both the past and future—impossible on a real device."
          - "To create a real FIR filter, we must truncate the ideal sinc wave using a **Window function** $w[n]$."
          - "A blunt rectangular cut acts like slamming a door: it creates harsh ripples and side-lobe leakage known as the **Gibbs Phenomenon** (first side lobe only $-13\\text{ dB}$ down)."
          - "Tapered windows (Hamming, Hanning, Blackman, and Kaiser) gently fade the edges to zero, dramatically suppressing unwanted side lobes (Hamming gives $-43\\text{ dB}$, Blackman gives $-58\\text{ dB}$) at the cost of a slightly wider transition boundary."
      - title: "The Bilinear Transformation (Translating Analog Classics)"
        points:
          - "Over the 20th century, electrical engineers perfected master analog filter circuits: Butterworth (buttery-smooth flat passband), Chebyshev (sharp transition with ripples), and Elliptic (steepest possible cut with equiripple in both bands)."
          - "The **Bilinear Transformation** $s = \\frac{2}{T} \\frac{1 - z^{-1}}{1 + z^{-1}}$ is a mathematical wormhole that maps continuous analog filters directly into digital z-plane filters without creating any aliasing."
          - "Because it compresses an infinite analog frequency axis onto a finite discrete circle, it warps frequency values. Engineers compensate by **Pre-Warping** target frequencies before conversion so they land precisely where intended."
          - "To prevent numerical instability in fixed-point software, high-order IIR filters are constructed as cascades of simple **Second-Order Sections (Biquads)**."
