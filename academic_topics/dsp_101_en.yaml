  - id: sampling_reconstruction
    title: "3. Sampling & Reconstruction"
    description: >
      The Nyquist-Shannon sampling theorem, spectral replication, aliasing fold-over distortion, anti-aliasing filtering, and Whittaker-Shannon sinc reconstruction.
    cards:
      - title: "The Nyquist-Shannon Sampling Theorem"
        figure:
          title: "Sampling in Frequency: Nyquist Rate vs. Aliasing"
          svg: >
            <svg viewBox="0 0 500 180" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-height:180px;">
              <!-- (a) No Aliasing -->
              <text x="20" y="20" font-size="11" font-weight="bold" fill="#059669">(a) fs ≥ 2·fmax (No Aliasing)</text>
              <line x1="20" y1="75" x2="480" y2="75" stroke="currentColor" stroke-width="1.2" opacity="0.4"/>
              <!-- Baseband triangle -->
              <polygon points="120,75 160,35 200,75" fill="#6366f1" fill-opacity="0.3" stroke="#6366f1" stroke-width="1.5"/>
              <text x="160" y="70" font-size="10" fill="currentColor" text-anchor="middle">0</text>
              <text x="200" y="90" font-size="9" fill="currentColor" opacity="0.8" text-anchor="middle">fmax</text>
              <text x="120" y="90" font-size="9" fill="currentColor" opacity="0.8" text-anchor="middle">-fmax</text>
              <!-- Replica at fs -->
              <polygon points="320,75 360,35 400,75" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="3,3"/>
              <text x="360" y="70" font-size="10" fill="currentColor" text-anchor="middle">fs</text>
              <!-- Guard band -->
              <line x1="200" y1="55" x2="320" y2="55" stroke="#059669" stroke-width="1.5"/>
              <text x="260" y="50" font-size="9" fill="#059669" text-anchor="middle">Guard Band</text>

              <!-- (b) Aliasing -->
              <text x="20" y="115" font-size="11" font-weight="bold" fill="#e11d48">(b) fs &lt; 2·fmax (Aliasing Overlap)</text>
              <line x1="20" y1="165" x2="480" y2="165" stroke="currentColor" stroke-width="1.2" opacity="0.4"/>
              <polygon points="110,165 170,125 230,165" fill="#6366f1" fill-opacity="0.3" stroke="#6366f1" stroke-width="1.5"/>
              <polygon points="210,165 270,125 330,165" fill="#e11d48" fill-opacity="0.3" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="3,3"/>
              <!-- Overlap region -->
              <polygon points="210,165 220,152 230,165" fill="#e11d48" fill-opacity="0.8"/>
              <text x="220" y="145" font-size="9" font-weight="bold" fill="#e11d48" text-anchor="middle">Overlap</text>
              <text x="170" y="160" font-size="10" fill="currentColor" text-anchor="middle">0</text>
              <text x="270" y="160" font-size="10" fill="currentColor" text-anchor="middle">fs</text>
            </svg>
          caption: "Periodic sampling replicates continuous spectra at integer multiples of $f_s$. When $f_s < 2 f_{\\max}$, spectral replicas overlap, causing irreversible aliasing distortion."
        points:
          - "The Nyquist-Shannon Sampling Theorem establishes that a continuous, bandlimited signal $x(t)$ with highest frequency component $f_{\\max}$ can be uniquely and losslessly reconstructed from samples $x[n] = x(n T_s)$ if and only if $f_s > 2 f_{\\max}$."
          - "The threshold $f_{\\text{Nyquist}} = 2 f_{\\max}$ is the Nyquist Rate. The maximum frequency a discrete system can represent without ambiguity is the Nyquist Frequency (folding frequency) $f_{\\text{fold}} = f_s / 2$."
          - "In the frequency domain, sampling by an ideal continuous impulse train corresponds to periodic convolution, replicating the original continuous spectrum $X(j\\Omega)$ at every integer harmonic of the sampling frequency: $X_s(j\\Omega) = \\frac{1}{T_s} \\sum_{k=-\\infty}^{\\infty} X\\left(j\\left(\\Omega - k \\frac{2\\pi}{T_s}\\right)\\right)$."
      - title: "Aliasing Distortion & Anti-Aliasing Filtering"
        points:
          - "When sampling rate falls below the Nyquist threshold ($f_s < 2 f_{\\max}$), spectral replicas overlap. High-frequency components fold back across the Nyquist boundary $f_s/2$ and disguise themselves as lower-frequency baseband components."
          - "Aliasing causes permanent, irreversible information loss: once overlapping spectral components sum together in the ADC registers, no subsequent digital filtering algorithm can separate the original components."
          - "An analog Anti-Aliasing Filter (AAF) must be placed in the hardware signal path immediately before the Analog-to-Digital Converter (ADC) to strictly attenuate all frequency components above $f_s / 2$ prior to sampling."
          - "Standard CD audio sampling ($f_s = 44.1\\text{ kHz}$) covers the nominal $20\\text{ kHz}$ limit of human hearing ($2 \\times 20\\text{ kHz} = 40\\text{ kHz}$), providing a $4.1\\text{ kHz}$ transition band for practical analog anti-aliasing filter roll-off."
      - title: "Ideal Reconstruction & Whittaker-Shannon Sinc Interpolation"
        points:
          - "Ideal continuous signal reconstruction from discrete samples is achieved by passing sampled impulses through an ideal analog lowpass filter with cutoff $\\Omega_c = \\pi / T_s$ and passband gain $T_s$."
          - "In the time domain, multiplication by the ideal frequency rectangular window corresponds to convolving discrete samples with a continuous sinc pulse: $x(t) = \\sum_{n=-\\infty}^{\\infty} x[n] \\text{sinc}\\left(\\frac{t - n T_s}{T_s}\\right)$ where $\\text{sinc}(u) = \\frac{\\sin(\\pi u)}{\\pi u}$."
          - "Practical digital-to-analog conversion utilizes a Zero-Order Hold (ZOH) circuit that holds each sample's voltage constant for period $T_s$, followed by an analog reconstruction filter that attenuates high-frequency staircase harmonics."
    trivia:
      - type: multiple_choice
        question: "What is the minimum sampling frequency required to prevent aliasing for a signal bandlimited to 22 kHz?"
        options:
          - "Strictly greater than 44 kHz ($f_s > 2 f_{\\max}$)"
          - "Exactly 22 kHz"
          - "11 kHz"
          - "88 kHz"
        correct: 0
      - type: multiple_choice
        question: "Why must an Anti-Aliasing Filter be implemented in the analog domain before the ADC?"
        options:
          - "Because spectral overlap caused by undersampling is irreversible once digitized, making software separation impossible"
          - "Because digital filters cannot perform mathematical multiplication"
          - "Because analog filters use zero physical space"
          - "Because digital filters only operate on DC signals"
        correct: 0
      - type: multiple_choice
        question: "If a 7 kHz sinusoidal wave is sampled at $f_s = 10\\text{ kHz}$, at what aliased frequency will it appear in the discrete spectrum?"
        options:
          - "3 kHz ($|10 - 7|\\text{ kHz}$, folded across the 5 kHz Nyquist frequency)"
