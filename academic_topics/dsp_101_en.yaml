  - id: digital_filter_design
    title: "4. Digital Filter Design"
    description: >
      FIR vs IIR architectures, linear phase FIR design via windowing, Parks-McClellan equiripple algorithm, and IIR design via Bilinear Transformation.
    cards:
      - title: "FIR vs. IIR Filters: Architecture & Trade-Offs"
        points:
          - "Finite Impulse Response (FIR) filters have an impulse response that settles to zero in finite time: $y[n] = \\sum_{k=0}^{M} b_k x[n-k]$. They are non-recursive, feedforward-only, and unconditionally stable."
          - "Infinite Impulse Response (IIR) filters contain feedback loops: $y[n] = \\sum_{m=0}^M b_m x[n-m] - \\sum_{k=1}^N a_k y[n-k]$. They achieve much steeper roll-off with fewer coefficients, but can become unstable and have non-linear phase."
          - "FIR filters can guarantee exact linear phase (constant group delay), which is impossible for causal IIR filters."
      - title: "FIR Filter Design via Windowing"
        points:
          - "Ideal brick-wall filters have infinite, non-causal impulse responses: $h_{\\text{ideal}}[n] = \\frac{\\sin(\\omega_c (n - M/2))}{\\pi (n - M/2)}$."
          - "The Window Method truncates and tapers $h_{\\text{ideal}}[n]$ using a window $w[n]$: $h[n] = h_{\\text{ideal}}[n] \\cdot w[n]$."
          - "Window trade-off: main lobe width determines transition bandwidth; peak side lobe level determines stopband attenuation."
          - "Common windows: Rectangular (narrowest main lobe, poor stopband $-13\\text{ dB}$), Hanning ($-31\\text{ dB}$), Hamming ($-43\\text{ dB}$), Blackman ($-58\\text{ dB}$), and Kaiser (parameter $\\beta$ dynamically tunes trade-off)."
      - title: "IIR Filter Design & The Bilinear Transformation"
        points:
          - "IIR filters are commonly designed by transforming well-known analog prototypes (Butterworth, Chebyshev Type I/II, Elliptic) into the discrete z-domain."
          - "The Bilinear Transformation maps the continuous s-plane to the discrete z-plane via: $s = \\frac{2}{T} \\frac{1 - z^{-1}}{1 + z^{-1}}$."
