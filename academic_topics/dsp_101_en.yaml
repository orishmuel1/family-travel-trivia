          - "It can only be used on analog signals"
        correct: 0
      - type: multiple_choice
        question: "In FIR filter design, what unwanted effect occurs if an ideal sinc response is abruptly truncated with a sharp rectangular window?"
        options:
          - "Gibbs Phenomenon, causing prominent ringing ripples and poor stopband attenuation ($-13\\text{ dB}$)"
          - "The filter immediately catches fire"
          - "The sampling rate is doubled"
          - "All bass frequencies turn into noise"
        correct: 0
      - type: multiple_choice
        question: "Which window function features a tunable parameter $\\beta$ that lets engineers continuously dial in the tradeoff between transition sharpness and stopband silence?"
        options:
          - "Kaiser Window"
          - "Rectangular Window"
          - "Hamming Window"
          - "Bartlett Window"
        correct: 0
      - type: multiple_choice
        question: "Why must frequencies be 'pre-warped' when designing digital IIR filters using the Bilinear Transformation?"
        options:
          - "To compensate for the non-linear mathematical compression that maps the infinite analog frequency axis onto the finite unit circle"
          - "To prevent thermal drift in physical resistors"
          - "To translate English words to Hebrew"
