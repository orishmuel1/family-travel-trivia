  - id: sampling_reconstruction
    title: "3. Sampling & Reconstruction"
    description: >
      The Nyquist-Shannon speed limit, the wagon-wheel illusion of aliasing, why software cannot fix bad sampling, and continuous wave reconstruction.
    cards:
      - title: "The Nyquist-Shannon Theorem & The Wagon Wheel Illusion"
        figure:
          title: "Sampling in Frequency: Nyquist Rate vs. Aliasing Overlap"
          svg: >
            <svg viewBox="0 0 500 180" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-height:180px;">
              <text x="20" y="20" font-size="11" font-weight="bold" fill="#059669">(a) fs ≥ 2·fmax (No Aliasing — Clean Replicas)</text>
              <line x1="20" y1="75" x2="480" y2="75" stroke="currentColor" stroke-width="1.2" opacity="0.4"/>
              <polygon points="120,75 160,35 200,75" fill="#6366f1" fill-opacity="0.3" stroke="#6366f1" stroke-width="1.5"/>
              <text x="160" y="70" font-size="10" fill="currentColor" text-anchor="middle">0</text>
              <text x="200" y="90" font-size="9" fill="currentColor" opacity="0.8" text-anchor="middle">fmax</text>
              <text x="120" y="90" font-size="9" fill="currentColor" opacity="0.8" text-anchor="middle">-fmax</text>
              <polygon points="320,75 360,35 400,75" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="3,3"/>
              <text x="360" y="70" font-size="10" fill="currentColor" text-anchor="middle">fs</text>
              <line x1="200" y1="55" x2="320" y2="55" stroke="#059669" stroke-width="1.5"/>
              <text x="260" y="50" font-size="9" fill="#059669" text-anchor="middle">Guard Band</text>
              <text x="20" y="115" font-size="11" font-weight="bold" fill="#e11d48">(b) fs &lt; 2·fmax (Undersampling — Aliasing Collision)</text>
              <line x1="20" y1="165" x2="480" y2="165" stroke="currentColor" stroke-width="1.2" opacity="0.4"/>
              <polygon points="110,165 170,125 230,165" fill="#6366f1" fill-opacity="0.3" stroke="#6366f1" stroke-width="1.5"/>
              <polygon points="210,165 270,125 330,165" fill="#e11d48" fill-opacity="0.3" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="3,3"/>
              <polygon points="210,165 220,152 230,165" fill="#e11d48" fill-opacity="0.8"/>
              <text x="220" y="145" font-size="9" font-weight="bold" fill="#e11d48" text-anchor="middle">Overlap</text>
              <text x="170" y="160" font-size="10" fill="currentColor" text-anchor="middle">0</text>
              <text x="270" y="160" font-size="10" fill="currentColor" text-anchor="middle">fs</text>
            </svg>
          caption: "Sampling replicates the continuous spectrum every $f_s$ Hz. If $f_s \\ge 2 f_{\\max}$, replicas remain separate. If $f_s < 2 f_{\\max}$, high frequencies collide and fold into lower bands (Aliasing)."
        points:
          - "Have you ever watched a movie where the wheels of a fast-moving car look like they are spinning backwards? That optical illusion happens because the movie camera (taking 24 frames/sec) is shooting too slowly to track the rapid spoke movement."
          - "In signal processing, this is **Aliasing**: when you sample a fast continuous wave too slowly, the sample dots inadvertently trace out a false, lower-frequency wave that was never present in the original signal."
          - "**The Nyquist-Shannon Sampling Theorem**: To perfectly capture a sound without creating false aliased ghost frequencies, you must sample at a rate strictly greater than twice the highest frequency present: $f_s > 2 f_{\\max}$."
          - "The minimum safe sampling rate $2 f_{\\max}$ is called the **Nyquist Rate**. The highest frequency a digital system can legally represent ($f_s / 2$) is the **Nyquist Frequency** (or folding frequency)."
      - title: "The Anti-Aliasing Guard: Why Software Can't Fix Bad Sampling"
        points:
          - "In the frequency domain, sampling acts like a periodic mirror: it creates infinite copies of the original spectrum centered at every multiple of the sampling rate ($0, \\pm f_s, \\pm 2f_s, \\dots$)."
          - "If the sampling rate is high enough ($f_s \\ge 2 f_{\\max}$), these copies sit peacefully side-by-side with empty guard bands between them."
          - "If $f_s < 2 f_{\\max}$, the copies collide and overlap. High-frequency energy folds back over the $f_s/2$ boundary into the audible band."
          - "Why can't we fix aliasing with software after recording? Because once high-frequency violin harmonics fold on top of low-frequency bass notes, they sum into the exact same numbers in memory. It is like mixing blue and yellow paint into green—no software code can unmix them afterwards."
          - "Therefore, an analog **Anti-Aliasing Filter (AAF)** must stand guard in the physical hardware *before* the ADC chip, cutting off all ultrasound frequencies above $f_s/2$ before sampling occurs."
          - "This explains the Compact Disc (CD) standard: human hearing tops out around $20\\text{ kHz}$. Twice that is $40\\text{ kHz}$. The standard was set at $44.1\\text{ kHz}$ to provide a comfortable $4.1\\text{ kHz}$ transition band for physical analog filters to roll off smoothly."
      - title: "Reconstructing the Continuous World: The Sinc Formula"
        points:
          - "How do you recreate a smooth, natural continuous waveform from a discrete list of dots? It feels as if the information between the dots is lost forever—yet mathematically it is not!"
          - "Claude Shannon proved that if you replace each discrete sample dot with a continuous **Sinc Pulse** $\\text{sinc}(t/T_s) = \\frac{\\sin(\\pi t / T_s)}{\\pi t / T_s}$ and sum them up, the undulating ripples interlock with mathematical perfection to reconstruct the 100% exact original continuous waveform: $x(t) = \\sum x[n] \\text{sinc}\\left(\\frac{t - n T_s}{T_s}\\right)$."
          - "In practical hardware (DACs), a **Zero-Order Hold (ZOH)** holds the output voltage steady at each sample value for duration $T_s$, creating a tiny staircase waveform, which is then smoothed by an analog reconstruction filter."
    trivia:
      - type: multiple_choice
        question: "In the wagon wheel optical illusion, why do spinning spokes appear to rotate backwards?"
        options:
