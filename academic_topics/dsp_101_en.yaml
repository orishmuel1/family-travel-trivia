  - id: z_transform_frequency
    title: "2. The Z-Transform & Frequency Analysis"
    description: >
      The complex z-plane, transfer functions, pole-zero geometric analysis, Region of Convergence, and the Discrete-Time Fourier Transform (DTFT).
    cards:
      - title: "The Z-Transform & Region of Convergence (ROC)"
        figure:
          title: "Z-Plane Pole-Zero Plot & Unit Circle"
          svg: >
            <svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-height:220px;">
              <!-- Axes -->
              <line x1="20" y1="110" x2="380" y2="110" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
              <line x1="200" y1="10" x2="200" y2="210" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
              <!-- Unit Circle -->
              <circle cx="200" cy="110" r="75" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="5,3"/>
              <!-- ROC Shading -->
              <circle cx="200" cy="110" r="50" fill="none" stroke="#059669" stroke-width="1.5"/>
              <!-- Poles (x) and Zeros (o) -->
              <!-- Pole at 0.6, 0.4 -->
              <line x1="240" y1="75" x2="250" y2="85" stroke="#e11d48" stroke-width="2.5"/>
              <line x1="250" y1="75" x2="240" y2="85" stroke="#e11d48" stroke-width="2.5"/>
              <!-- Pole at 0.6, -0.4 -->
              <line x1="240" y1="135" x2="250" y2="145" stroke="#e11d48" stroke-width="2.5"/>
              <line x1="250" y1="135" x2="240" y2="145" stroke="#e11d48" stroke-width="2.5"/>
              <!-- Zero at unit circle (0, 1) and (0, -1) -->
              <circle cx="200" cy="35" r="5" fill="none" stroke="#0284c7" stroke-width="2.5"/>
              <circle cx="200" cy="185" r="5" fill="none" stroke="#0284c7" stroke-width="2.5"/>
              <!-- Labels -->
              <text x="375" y="104" font-size="11" fill="currentColor" opacity="0.8">Re(z)</text>
              <text x="206" y="22" font-size="11" fill="currentColor" opacity="0.8">Im(z)</text>
              <text x="280" y="104" font-size="11" fill="#6366f1">|z|=1</text>
              <text x="256" y="78" font-size="11" font-weight="bold" fill="#e11d48">Pole (×)</text>
              <text x="210" y="40" font-size="11" font-weight="bold" fill="#0284c7">Zero (○)</text>
            </svg>
          caption: "Complex z-plane showing the Unit Circle ($|z|=1$), conjugate poles ($\\times$) inside the circle producing resonant peaks, and zeros ($\\circ$) on the circle producing transmission nulls."
        points:
          - "The bilateral Z-transform generalizes discrete frequency analysis by projecting sequences $x[n]$ onto complex exponential basis functions $z = r e^{j\\omega}$: $X(z) = \\mathcal{Z}\\{x[n]\\} = \\sum_{n=-\\infty}^{\\infty} x[n] z^{-n}$."
          - "The Z-transform maps time-domain convolution into algebraic multiplication: $\\mathcal{Z}\\{x[n] * h[n]\\} = X(z) \\cdot H(z)$, converting difference equations into rational transfer functions $H(z) = Y(z) / X(z)$."
          - "The Region of Convergence (ROC) is the set of points in the complex z-plane for which the power series $\\sum |x[n] z^{-n}|$ converges absolutely. The ROC is always an annular ring centered at the origin: $r_R < |z| < r_L$."
          - "Key ROC properties: (1) The ROC never contains poles; (2) For right-sided causal sequences, the ROC extends outward from the outermost pole: $|z| > r_{\\max}$; (3) An LTI system is BIBO stable if and only if its ROC includes the unit circle $|z| = 1$."
      - title: "Pole-Zero Geometry & Transfer Function H(z)"
        points:
          - "The rational transfer function $H(z) = \\frac{\\sum_{m=0}^M b_m z^{-m}}{\\sum_{k=0}^N a_k z^{-k}} = b_0 \\frac{\\prod_{m=1}^M (1 - c_m z^{-1})}{\\prod_{k=1}^N (1 - d_k z^{-1})}$ is completely described by its zeros $c_m$ (where $H(z)=0$) and poles $d_k$ (where $H(z) \\to \\infty$)."
          - "Geometric frequency evaluation: As frequency $\\omega$ progresses around the unit circle $z = e^{j\\omega}$, the magnitude response $|H(e^{j\\omega})|$ is proportional to the product of vector lengths from the zeros to $e^{j\\omega}$, divided by vector lengths from the poles to $e^{j\\omega}$."
          - "Poles positioned close to the unit circle produce sharp resonant amplification peaks at angle $\\omega = \\arg(d_k)$. Zeros placed directly on the unit circle create complete transmission nulls (notch filters)."
          - "A causal LTI system is BIBO stable if and only if all its poles lie strictly inside the unit circle: $|d_k| < 1$ for all $k$."
      - title: "The Discrete-Time Fourier Transform (DTFT)"
        points:
          - "Evaluating the Z-transform along the unit circle ($z = e^{j\\omega}$) yields the Discrete-Time Fourier Transform (DTFT): $X(e^{j\\omega}) = \\sum_{n=-\\infty}^{\\infty} x[n] e^{-j\\omega n}$."
          - "The DTFT represents the continuous frequency spectrum of discrete sequences. Because moving $2\\pi$ radians around the unit circle returns to the origin point, the DTFT is inherently periodic in $\\omega$ with fundamental period $2\\pi$: $X(e^{j(\\omega + 2\\pi)}) = X(e^{j\\omega})$."
          - "The inverse DTFT synthesizes the sequence via integration: $x[n] = \\frac{1}{2\\pi} \\int_{-\\pi}^{\\pi} X(e^{j\\omega}) e^{j\\omega n} d\\omega$."
          - "Phase response $\\theta(\\omega) = \\arg H(e^{j\\omega})$ determines signal delay. Linear Phase filters exhibit constant group delay $\\tau_g(\\omega) = -\\frac{d\\theta(\\omega)}{d\\omega} = \\text{const}$, preventing waveform dispersion and phase distortion."
    trivia:
      - type: multiple_choice
        question: "How is the Discrete-Time Fourier Transform (DTFT) related geometrically to the Z-transform?"
        options:
          - "It is the Z-transform evaluated specifically on the unit circle ($z = e^{j\\omega}$)"
          - "It is the derivative of the Z-transform with respect to $z$"
          - "It is the Z-transform evaluated only on the real axis"
          - "There is no direct mathematical connection between them"
        correct: 0
      - type: multiple_choice
        question: "Where must all poles of a causal discrete-time transfer function $H(z)$ lie for the system to be BIBO stable?"
        options:
          - "Strictly inside the unit circle ($|z| < 1$)"
          - "Strictly outside the unit circle ($|z| > 1$)"
          - "Directly on the unit circle ($|z| = 1$)"
          - "On the negative imaginary axis"
        correct: 0
      - type: multiple_choice
        question: "What effect does placing a zero directly on the unit circle at $z = e^{j\\omega_0}$ have on the frequency response?"
        options:
          - "It creates a complete transmission null (zero gain) at frequency $\\omega_0$"
          - "It causes an infinite resonant spike at frequency $\\omega_0$"
          - "It doubles the phase delay across all frequencies"
          - "It destabilizes the filter output"
        correct: 0
      - type: multiple_choice
        question: "Why is the DTFT periodic in frequency with a period of $2\\pi$ radians?"
        options:
          - "Traversing $2\\pi$ radians around the complex unit circle returns to the identical geometric point"
          - "Digital memory registers are organized in powers of two"
          - "Sampling clocks oscillate at $2\\pi$ Hz"
          - "Continuous audio waves have no negative frequencies"
        correct: 0
      - type: multiple_choice
        question: "Why is a Linear Phase response essential in communications and high-fidelity audio filtering?"
        options:
          - "All frequency components undergo the exact same time delay (constant group delay), eliminating phase distortion"
          - "It reduces power consumption to zero"
          - "It allows the filter to operate without multipliers"
          - "It maximizes stopband attenuation to infinity"
        correct: 0
      - type: multiple_choice
        question: "What is the Region of Convergence (ROC) for a causal right-sided sequence with pole at $z = d_1$?"
        options:
          - "$|z| > |d_1|$ (the exterior of the disk bounded by the pole)"
          - "$|z| < |d_1|$ (the interior of the disk)"
          - "The origin $z = 0$ only"
          - "The entire complex plane including infinity"
        correct: 0
      - type: multiple_choice
        question: "How does the Z-transform simplify the analysis of multiple cascaded LTI stages?"
        options:
          - "It converts time-domain convolution into algebraic polynomial multiplication: $H_{\\text{total}}(z) = H_1(z) H_2(z)$"
          - "It eliminates the need for complex numbers"
          - "It reduces the total number of poles to zero"
          - "It converts discrete signals into analog voltages"
        correct: 0
      - type: multiple_choice
        question: "What defines a Minimum Phase discrete system?"
        options:
          - "All of its poles AND zeros lie strictly inside the unit circle ($|z| < 1$)"
          - "Its group delay is zero across all frequencies"
          - "It contains zero multiplications in its signal flow graph"
          - "It is non-causal"
        correct: 0
      - type: multiple_choice
        question: "What is the magnitude response $|H(e^{j\\omega})|$ of an ideal All-Pass filter?"
        options:
          - "Unity gain ($|H(e^{j\\omega})| = 1$) for all frequencies"
          - "Zero gain everywhere except at $\\omega = 0$"
          - "Monotonically increasing with frequency"
          - "A brick-wall lowpass characteristic"
        correct: 0
      - type: multiple_choice
        question: "What is the Z-transform of the unit impulse sequence $\\delta[n]$?"
        options:
          - "$X(z) = 1$ for all $z$"
          - "$X(z) = \\frac{1}{1 - z^{-1}}$"
          - "$X(z) = z^{-1}$"
          - "$X(z) = 0$"
        correct: 0
      - type: multiple_choice
        question: "What is the Z-transform of the causal exponential sequence $a^n u[n]$?"
        options:
          - "$\\frac{1}{1 - a z^{-1}}$ with ROC $|z| > |a|$"
          - "$\\frac{1}{1 - a z^{-1}}$ with ROC $|z| < |a|$"
          - "$\\frac{z}{z + a}$ with ROC $|z| = 1$"
          - "$\\ln(1 - a z^{-1})$"
        correct: 0
      - type: multiple_choice
        question: "What does Parseval's Theorem state regarding discrete signals in time and frequency?"
        options:
          - "Total energy is conserved between the time domain and frequency domain: $\\sum |x[n]|^2 = \\frac{1}{2\\pi} \\int |X(e^{j\\omega})|^2 d\\omega$"
          - "Energy in frequency is scaled by $2\\pi^2$"
          - "High frequencies carry more energy than low frequencies"
          - "Total power is independent of amplitude"
        correct: 0
      - type: multiple_choice
        question: "What is the Group Delay $\\tau_g(\\omega)$ of a discrete transfer function?"
        options:
          - "The negative derivative of the phase response: $\\tau_g(\\omega) = -\\frac{d\\theta(\\omega)}{d\\omega}$"
          - "The ratio of input power to output power"
          - "The time required to compile the DSP code"
          - "The sampling period $T_s$"
        correct: 0
      - type: multiple_choice
        question: "Where on the unit circle does the Nyquist frequency (highest discrete frequency $\\omega = \\pi$) reside?"
        options:
          - "At $z = -1$ on the negative real axis"
          - "At $z = +1$ on the positive real axis (DC)"
          - "At $z = 0$ (the origin)"
          - "At $z = +j$ on the positive imaginary axis"
        correct: 0
      - type: multiple_choice
        question: "Why can the Region of Convergence (ROC) never contain any poles?"
        options:
          - "Poles are singularities where the transfer function magnitude approaches infinity, violating series convergence"
          - "Poles are imaginary numbers"
          - "Zeros cancel out the ROC"
