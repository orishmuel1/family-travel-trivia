  - id: sampling_reconstruction
    title: "3. Sampling & Reconstruction"
    description: >
      The Nyquist-Shannon sampling theorem, spectral replication, aliasing prevention, ideal bandlimited interpolation, and continuous processing.
    cards:
      - title: "The Nyquist-Shannon Sampling Theorem"
        points:
          - "The Nyquist-Shannon theorem states that a continuous bandlimited signal $x(t)$ with highest frequency $f_{\\max}$ can be uniquely and perfectly reconstructed from samples $x[n] = x(n T_s)$ if and only if the sampling frequency satisfies $f_s > 2 f_{\\max}$."
          - "The threshold rate $f_{\\text{Nyquist}} = 2 f_{\\max}$ is called the Nyquist rate; half the sampling frequency $f_s/2$ is called the Nyquist frequency or folding frequency."
          - "In the frequency domain, periodic impulse-train sampling replicates the continuous spectrum $X(j\\Omega)$ at integer multiples of sampling frequency: $X_s(j\\Omega) = \\frac{1}{T_s} \\sum_{k=-\\infty}^{\\infty} X(j(\\Omega - k \\Omega_s))$ where $\\Omega_s = \\frac{2\\pi}{T_s}$."
      - title: "Aliasing & Anti-Aliasing Filtering"
        points:
          - "Aliasing occurs when $f_s < 2 f_{\\max}$: spectral replicas overlap, causing high-frequency components to disguise themselves as lower frequencies (folding around $f_s/2$)."
          - "Aliasing causes irreversible information loss: once high frequencies fold into lower bands, they cannot be separated by subsequent digital processing."
          - "An Anti-Aliasing Filter (AAF) is an analog lowpass filter placed before the Analog-to-Digital Converter (ADC) to eliminate frequencies above $f_s/2$ before sampling takes place."
      - title: "Ideal Reconstruction & Sinc Interpolation"
        points:
          - "Perfect reconstruction uses an ideal analog lowpass filter with cutoff $\\Omega_c = \\Omega_s / 2$ and gain $T_s$."
          - "In the time domain, multiplying by the ideal frequency rect corresponds to convolving samples with a continuous sinc function: $x(t) = \\sum_{n=-\\infty}^{\\infty} x[n] \\text{sinc}\\left(\\frac{t - n T_s}{T_s}\\right)$ where $\\text{sinc}(u) = \\frac{\\sin(\\pi u)}{\\pi u}$."
          - "Practical DACs implement a Zero-Order Hold (ZOH), which keeps each sample constant for duration $T_s$, creating staircase artifacts smoothed by a reconstruction filter."
    trivia:
      - type: multiple_choice
        question: "What is the minimum sampling rate required to avoid aliasing for an audio signal bandlimited to 20 kHz?"
        options:
          - "40 kHz (twice the highest frequency component)"
          - "20 kHz"
          - "10 kHz"
          - "80 kHz"
        correct: 0
      - type: multiple_choice
        question: "What happens in the frequency domain when a continuous signal is uniformly sampled in time?"
        options:
          - "Its continuous spectrum is periodically replicated at integer multiples of the sampling frequency"
          - "Its spectrum is compressed to zero"
          - "Its phase is rotated by 90 degrees"
          - "Its amplitude is converted to decibels"
        correct: 0
      - type: multiple_choice
        question: "Where must an anti-aliasing filter be positioned in a signal processing pipeline?"
        options:
          - "In the analog domain, immediately BEFORE the Analog-to-Digital Converter (ADC)"
          - "In the digital domain, after the FFT calculation"
          - "At the output of the DAC"
          - "Inside the digital microprocessor accumulator"
        correct: 0
      - type: multiple_choice
        question: "If a 7 kHz sine wave is sampled at $f_s = 10\\text{ kHz}$, at what aliased frequency will it appear in the discrete spectrum?"
        options:
          - "3 kHz ($|10 - 7|\\text{ kHz}$)"
          - "7 kHz"
          - "5 kHz"
          - "14 kHz"
        correct: 0
      - type: multiple_choice
        question: "What mathematical function serves as the ideal continuous interpolation kernel in Shannon's Whittaker-Shannon interpolation formula?"
        options:
          - "The $\\text{sinc}$ function: $\\frac{\\sin(\\pi t / T_s)}{\\pi t / T_s}$"
          - "The Gaussian bell curve"
          - "A triangular Bartlett window"
          - "A polynomial spline"
        correct: 0
      - type: multiple_choice
