  - id: dft_and_fft_algorithms
    title: "5. The Discrete Fourier Transform & Fast Algorithms"
    description: >
      The computational prism: breaking complex waveforms into pure sine notes, spectral resolution, and the Cooley-Tukey FFT revolution.
    cards:
      - title: "The DFT: The Digital Prism of Modern Computing"
        figure:
          title: "The Radix-2 FFT 2-Point Butterfly Operation"
          svg: >
            <svg viewBox="0 0 450 140" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-height:140px;">
              <text x="30" y="45" font-size="12" font-weight="bold" fill="currentColor">A</text>
              <text x="30" y="105" font-size="12" font-weight="bold" fill="currentColor">B</text>
              <line x1="50" y1="40" x2="350" y2="40" stroke="currentColor" stroke-width="2"/>
              <line x1="50" y1="100" x2="350" y2="100" stroke="currentColor" stroke-width="2"/>
              <line x1="100" y1="100" x2="300" y2="40" stroke="#6366f1" stroke-width="2"/>
              <line x1="100" y1="40" x2="300" y2="100" stroke="#6366f1" stroke-width="2"/>
              <circle cx="150" cy="100" r="14" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="1.5"/>
              <text x="150" y="104" font-size="10" font-weight="bold" fill="#0284c7" text-anchor="middle">WN^k</text>
              <text x="280" y="80" font-size="11" font-weight="bold" fill="#e11d48">-1</text>
              <text x="365" y="45" font-size="12" font-weight="bold" fill="currentColor">A + WN^k · B</text>
              <text x="365" y="105" font-size="12" font-weight="bold" fill="currentColor">A - WN^k · B</text>
            </svg>
          caption: "The basic Cooley-Tukey Radix-2 FFT Butterfly operation: combining two sub-problems using twiddle factor $W_N^k = e^{-j 2\\pi k / N}$ to achieve $O(N \\log_2 N)$ speed."
        points:
          - "Just as a glass prism splits white sunlight into its rainbow of colors, the **Discrete Fourier Transform (DFT)** splits an audio waveform into its constituent pure sine wave frequencies."
          - "Given a block of $N$ time samples $x[n]$, the DFT calculates the exact amplitude and phase of $N$ discrete frequency bins: $X[k] = \\sum_{n=0}^{N-1} x[n] W_N^{k n}$ where $W_N = e^{-j \\frac{2\\pi}{N}}$ is the twiddle factor."
          - "The DFT is how Spotify visualizes graphic equalizers, how Shazam matches audio fingerprints in noisy rooms within 3 seconds, and how 5G cellular towers decode OFDM radio signals."
          - "Because the DFT assumes the $N$-sample block repeats endlessly in time, multiplying two DFTs in frequency creates **Circular (cyclic) Convolution** in time. To compute real-world linear echoes, we must zero-pad the signals to length $N \\ge L + P - 1$."
      - title: "Spectral Leakage & The True Meaning of Resolution"
        points:
          - "If an incoming audio tone does not fit an exact integer number of complete cycles within the observation window, the sudden cutoff at the block edges acts like a harsh step discontinuity."
          - "This creates **Spectral Leakage**: energy from a single pure musical pitch 'leaks' into neighboring frequency bins like smeared ink."
          - "Tapering the block with a window function (Hamming, Blackman) smooths the boundary edges and locks the leakage away, yielding clean, sharp spectral peaks."
          - "**The Resolution Insight**: Padding a signal with extra zeros (Zero-Padding) interpolates the frequency plot with smoother curves, but it does NOT improve physical ability to separate two close frequencies. True physical frequency resolution is governed by how long you record: $\\Delta f = 1 / T_{\\text{total}} = f_s / N$."
      - title: "The FFT Revolution (The Algorithm That Changed History)"
        points:
          - "Calculating the DFT directly requires $N^2$ complex multiplications. For a modest 1024-sample audio block, that means over **1,000,000 operations per frame**—choking early computers."
          - "In 1965, Cooley and Tukey popularized the **Fast Fourier Transform (FFT)**, which uses divide-and-conquer to recursively split the computation into even and odd indices (the iconic 'Butterfly' operation)."
          - "The FFT slashes computational complexity from $O(N^2)$ to $O(N \\log_2 N)$. For $N=1024$, operations plummet from $1,048,576$ to just **$10,240$**—over **100 times faster**!"
          - "This breathtaking speedup made real-time digital audio, Wi-Fi, 5G cellular communication, radar, and MRI medical imaging computationally possible on everyday microchips."
