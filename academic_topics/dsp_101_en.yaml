id: dsp_101_en
type: academic
icon: "📡"
title: "Digital Signal Processing (DSP 101)"
description: >
  An intuitive, story-driven university curriculum exploring how real-world waves become immortal digital numbers, how filters sculpt audio, and how fast algorithms power modern communications.
lang: en
audience: family
categories:
  - id: foundations_discrete_time
    title: "1. Foundations & Discrete-Time Systems"
    description: >
      Why we digitize signals, the cathedral echo model of convolution, system linearity, time-invariance, and the stability boundary.
    cards:
      - title: "Why Go Digital? (From Physical Waves to Immortal Numbers)"
        points:
          - "In the physical world, sound, light, and radio are continuous analog waves. But analog signals are fragile: every wire adds hiss, every amplifier introduces distortion, and cassette tapes wear out over time."
          - "The digital revolution makes waves immortal. Instead of storing the fragile wave itself, we take snapshots of its height at clockwork time intervals $T_s$ and record them as a sequence of numbers $x[n] = x(n T_s)$."
          - "Once sound is converted into pure numbers, it can be copied an infinite number of times without losing a single bit of quality, transmitted across the globe, encrypted, and processed by code."
          - "The discrete unit impulse $\\delta[n]$ is the 'atom' of digital signal processing: a single, crisp spike of height 1 at moment $n=0$ and 0 everywhere else. Every complex digital sound is just a choir of shifted, scaled impulses."
          - "The unit step $u[n]$ represents flicking a switch ON forever ($1$ for $n \\ge 0$, $0$ before). The impulse is simply the sudden jump between consecutive step values: $\\delta[n] = u[n] - u[n-1]$."
      - title: "The Echo Chamber (LTI Systems & The Story of Convolution)"
        points:
          - "Imagine clapping your hands once loudly inside a grand stone cathedral. That single sharp clap is an impulse $\\delta[n]$. The rich, reverberant echo that echoes through the halls over the next few seconds is the room's unique Impulse Response $h[n]$."
          - "Linear Time-Invariant (LTI) systems possess a superpower: if you know how the room echoes a single clap ($h[n]$), you can predict exactly how ANY song or symphony will sound inside that room without ever stepping foot inside."
          - "Why? Because any song $x[n]$ is simply a sequence of millions of individual claps played with varying volume at different moments. Linearity means the total sound is just the sum of all individual echoes."
          - "Convolution $y[n] = (x * h)[n] = \\sum_{k=-\\infty}^{\\infty} x[k] h[n-k]$ is the mathematical recipe for this echo: to find the sound at current moment $n$, we sum the lingering reverberations of all notes $x[k]$ played $n-k$ steps in the past."
          - "Convolution is commutative ($x * h = h * x$): mathematically, listening to your music inside a cathedral produces the exact same acoustic result as playing the cathedral's acoustic signature through your music."
      - title: "Memory, Causality & The Balance of Stability"
        points:
          - "Causality respects the arrow of time: a real-time audio effect on your smartphone cannot react to words you haven't spoken yet. For an LTI system, causality simply means the echo cannot begin before you clap: $h[n] = 0$ for all $n < 0$."
          - "Difference Equations $\\sum a_k y[n-k] = \\sum b_m x[n-m]$ are the step-by-step algorithms running on microchips: they compute the next audio sample from recent incoming samples and previous output reverberations."
          - "BIBO Stability (Bounded-Input Bounded-Output) is the safety guarantee: if you whisper into a microphone, the system must never amplify that whisper into an infinite, speaker-destroying explosion."
          - "An LTI system is guaranteed to be stable if and only if its echoes naturally decay and die out over time, meaning the sum of absolute echo amplitudes is finite: $\\sum_{n=-\\infty}^{\\infty} |h[n]| < \\infty$."
    trivia:
      - type: multiple_choice
        question: "Why does converting continuous analog waves into discrete numbers $x[n]$ prevent signal degradation during copying?"
        options:
          - "Because discrete numbers can be stored, transmitted, and replicated perfectly without analog noise or wear"
