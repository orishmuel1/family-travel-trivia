id: dsp_101_en
type: academic
icon: "📡"
title: "Digital Signal Processing (DSP 101)"
description: >
  A comprehensive, first-principles guide for engineers exploring how physical waves become digital numbers, how filters sculpt audio, and how fast algorithms analyze frequency spectrums.
lang: en
audience: family
categories:
  - id: foundations_discrete_time
    title: "1. Foundations & Discrete-Time Systems"
    description: >
      From physical sound waves to discrete arrays of numbers, understanding system memory, linearity, impulse response probing, and convolution.
    cards:
      - title: "From Physical Waves to Numbers: The Core Idea of Sampling"
        figure:
          title: "Continuous Waveform vs. Discrete Sample Array"
          svg: >
            <svg viewBox="0 0 500 160" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-height:160px;">
              <line x1="30" y1="80" x2="480" y2="80" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
              <line x1="50" y1="10" x2="50" y2="150" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
              <path d="M 50 80 Q 110 -10, 170 80 T 290 80 T 410 80 T 480 80" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.5"/>
              <line x1="50" y1="80" x2="50" y2="80" stroke="#6366f1" stroke-width="2.5"/><circle cx="50" cy="80" r="4" fill="#6366f1"/>
              <line x1="80" y1="80" x2="80" y2="35" stroke="#6366f1" stroke-width="2.5"/><circle cx="80" cy="35" r="4" fill="#6366f1"/>
              <line x1="110" y1="80" x2="110" y2="20" stroke="#6366f1" stroke-width="2.5"/><circle cx="110" cy="20" r="4" fill="#6366f1"/>
              <line x1="140" y1="80" x2="140" y2="35" stroke="#6366f1" stroke-width="2.5"/><circle cx="140" cy="35" r="4" fill="#6366f1"/>
              <line x1="170" y1="80" x2="170" y2="80" stroke="#6366f1" stroke-width="2.5"/><circle cx="170" cy="80" r="4" fill="#6366f1"/>
              <line x1="200" y1="80" x2="200" y2="125" stroke="#6366f1" stroke-width="2.5"/><circle cx="200" cy="125" r="4" fill="#6366f1"/>
              <line x1="230" y1="80" x2="230" y2="140" stroke="#6366f1" stroke-width="2.5"/><circle cx="230" cy="140" r="4" fill="#6366f1"/>
              <line x1="260" y1="80" x2="260" y2="125" stroke="#6366f1" stroke-width="2.5"/><circle cx="260" cy="125" r="4" fill="#6366f1"/>
              <line x1="290" y1="80" x2="290" y2="80" stroke="#6366f1" stroke-width="2.5"/><circle cx="290" cy="80" r="4" fill="#6366f1"/>
              <line x1="320" y1="80" x2="320" y2="35" stroke="#6366f1" stroke-width="2.5"/><circle cx="320" cy="35" r="4" fill="#6366f1"/>
              <line x1="350" y1="80" x2="350" y2="20" stroke="#6366f1" stroke-width="2.5"/><circle cx="350" cy="20" r="4" fill="#6366f1"/>
              <line x1="380" y1="80" x2="380" y2="35" stroke="#6366f1" stroke-width="2.5"/><circle cx="380" cy="35" r="4" fill="#6366f1"/>
              <line x1="410" y1="80" x2="410" y2="80" stroke="#6366f1" stroke-width="2.5"/><circle cx="410" cy="80" r="4" fill="#6366f1"/>
              <text x="440" y="72" font-size="11" fill="currentColor" opacity="0.8">n (sample index)</text>
              <text x="56" y="24" font-size="11" fill="currentColor" opacity="0.8">x[n]</text>
              <text x="140" y="98" font-size="10" fill="#6366f1">Ts (sampling period)</text>
            </svg>
          caption: "A continuous physical wave $x(t)$ (dashed curve) is measured at regular clock intervals $T_s$ to create an indexed array of numbers $x[n] = x(n T_s)$."
        points:
          - "In nature, all signals are continuous: sound is vibrating air pressure, light is an oscillating electromagnetic wave, and a microphone produces a continuous analog voltage $x(t)$. The challenge with analog circuits is that every component, wire, and amplifier introduces thermal noise and physical distortion."
          - "Digital Signal Processing (DSP) solves this by converting continuous physical waves into an ordered array of numbers $x[n]$. A clock triggers an Analog-to-Digital Converter (ADC) every $T_s$ seconds (the sampling period), recording the exact voltage as a digital number: $x[n] = x(n T_s)$."
          - "The index $n$ is simply an integer counter ($n = 0, 1, 2, 3, \\dots$) tracking which sample in memory we are looking at. The sampling rate $f_s = 1/T_s$ is how many numbers we record per second (for example, standard audio uses $f_s = 44,100\\text{ samples/sec}$)."
          - "The fundamental building block of discrete signals is the **Unit Impulse** $\\delta[n]$: an array containing a single value of 1 at index $n=0$ and 0 everywhere else. Any arbitrary signal array $x[n]$ can be viewed as an exact sum of scaled, shifted impulses: $x[n] = \\sum x[k] \\delta[n-k]$."
          - "The **Unit Step** $u[n]$ represents turning a system ON with a constant value of 1 for all $n \\ge 0$ (and 0 before). It relates to the impulse by a simple difference: $\\delta[n] = u[n] - u[n-1]$."
      - title: "LTI Systems & Convolution: How Systems Process Signals"
        figure:
          title: "Impulse Response Characterization & Convolution"
          svg: >
            <svg viewBox="0 0 500 120" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-height:120px;">
              <rect x="180" y="25" width="140" height="70" rx="10" fill="currentColor" fill-opacity="0.06" stroke="#6366f1" stroke-width="2"/>
              <text x="250" y="55" font-size="13" font-weight="bold" fill="currentColor" text-anchor="middle">LTI System</text>
              <text x="250" y="75" font-size="12" fill="#6366f1" text-anchor="middle">h[n] (Memory)</text>
              <line x1="60" y1="60" x2="175" y2="60" stroke="currentColor" stroke-width="2"/>
              <polygon points="175,60 165,55 165,65" fill="currentColor"/>
              <text x="110" y="48" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">x[n] (Input)</text>
              <line x1="325" y1="60" x2="435" y2="60" stroke="currentColor" stroke-width="2"/>
              <polygon points="440,60 430,55 430,65" fill="currentColor"/>
              <text x="385" y="48" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">y[n] = x[n] * h[n]</text>
            </svg>
          caption: "If a system is Linear and Time-Invariant (LTI), its response to a single impulse probe $h[n]$ completely defines how it will process any input signal via convolution."
        points:
          - "An audio filter, room acoustic, or sensor is treated as a 'system' that transforms an input array $x[n]$ into an output array $y[n]$."
          - "Two golden properties make digital systems predictable and solvable: **Linearity** (scaling the input doubles the output, and processing two added sounds equals the sum of their individual outputs) and **Time-Invariance** (the algorithm produces the identical result whether you run it at 9:00 AM or 9:05 AM)."
          - "If a system is **Linear Time-Invariant (LTI)**, we can uncover its entire behavior by probing it with a single unit impulse $\\delta[n]$. The output array produced by that single spike is called the **Impulse Response** $h[n]$."
          - "Why is $h[n]$ so powerful? Because any input song $x[n]$ is just a sequence of individual spikes of different heights. Since the system is linear, the output $y[n]$ is simply the sum of all the individual impulse responses triggered across time."
          - "This mathematical operation is **Convolution**: $y[n] = (x * h)[n] = \\sum_{k=-\\infty}^{\\infty} x[k] h[n-k]$. In code, it is a sliding window where we multiply past input samples by the system's impulse response weights and add them together."
      - title: "Difference Equations, Causality & The Rule of Stability"
        points:
          - "In software code and hardware chips, LTI filters are implemented as **Difference Equations**: $y[n] = \\sum_{m=0}^M b_m x[n-m] - \\sum_{k=1}^N a_k y[n-k]$. This is just a simple for-loop calculating the next sample from recent incoming numbers and previous output values."
          - "**Causality** means the system respects the flow of time: a real-time audio processor cannot react to sound before it happens. In terms of the impulse response, the system output must be 0 before the impulse arrives: $h[n] = 0$ for all $n < 0$."
          - "**BIBO Stability (Bounded-Input, Bounded-Output)** is the safety guarantee that a system will never blow up: if you feed it a bounded signal with maximum amplitude $B_x$, the output will never explode to infinity."
          - "An LTI system is guaranteed to be BIBO stable if and only if the sum of all absolute values in its impulse response is a finite number: $\\sum_{n=-\\infty}^{\\infty} |h[n]| < \\infty$. If the response decays to zero over time, the system is safe."
    trivia:
      - type: multiple_choice
        question: "Why does converting continuous analog waves into discrete digital numbers $x[n]$ prevent signal degradation over multiple processing stages?"
        options:
