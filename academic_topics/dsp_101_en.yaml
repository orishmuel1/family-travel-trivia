      - type: multiple_choice
        question: "If a system's rule is $y[n] = x[n] + 4$, why is it NOT a linear system?"
        options:
          - "Because a zero input $x[n]=0$ yields an output of $4 \\neq 0$, violating the requirement that scaling zero must yield zero ($T\\{0\\}=0$)"
          - "Because it delays the signal by 4 samples"
          - "Because 4 is an even number"
          - "Because it requires infinite memory"
        correct: 0
      - type: multiple_choice
        question: "If a system is defined as $y[n] = n \\cdot x[n]$, which fundamental property is violated?"
        options:
          - "Time-Invariance (the time-dependent factor $n$ causes the system's behavior to change over time)"
          - "Linearity"
          - "Causality"
          - "Memorylessness"
        correct: 0
      - type: multiple_choice
        question: "What is the relationship between the unit step $u[n]$ and the unit impulse $\\delta[n]$?"
        options:
          - "$\\delta[n] = u[n] - u[n-1]$ and $u[n] = \\sum_{k=-\\infty}^n \\delta[k]$"
          - "$\\delta[n] = u[n] \\cdot u[n-1]$"
          - "$\\delta[n] = u[n] + u[n-1]$"
          - "$u[n] = \\delta[n] - \\delta[n-1]$"
        correct: 0

  - id: z_transform_frequency
    title: "2. The Z-Transform & Frequency Analysis"
    description: >
      Transforming time-domain loops into simple algebra, understanding Poles (resonances) and Zeros (nulls), and analyzing frequencies on the unit circle.
    cards:
      - title: "Why the Z-Transform? Converting Loops into Simple Algebra"
        figure:
          title: "The Complex Z-Plane & The Unit Circle"
          svg: >
            <svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-height:220px;">
              <line x1="20" y1="110" x2="380" y2="110" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
              <line x1="200" y1="10" x2="200" y2="210" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
              <circle cx="200" cy="110" r="75" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="5,3"/>
              <circle cx="200" cy="110" r="50" fill="none" stroke="#059669" stroke-width="1.5"/>
              <!-- Pole (x) -->
              <line x1="240" y1="75" x2="250" y2="85" stroke="#e11d48" stroke-width="2.5"/>
              <line x1="250" y1="75" x2="240" y2="85" stroke="#e11d48" stroke-width="2.5"/>
              <line x1="240" y1="135" x2="250" y2="145" stroke="#e11d48" stroke-width="2.5"/>
              <line x1="250" y1="135" x2="240" y2="145" stroke="#e11d48" stroke-width="2.5"/>
              <!-- Zero (o) -->
              <circle cx="200" cy="35" r="5" fill="none" stroke="#0284c7" stroke-width="2.5"/>
              <circle cx="200" cy="185" r="5" fill="none" stroke="#0284c7" stroke-width="2.5"/>
              <text x="375" y="104" font-size="11" fill="currentColor" opacity="0.8">Re(z)</text>
              <text x="206" y="22" font-size="11" fill="currentColor" opacity="0.8">Im(z)</text>
              <text x="280" y="104" font-size="11" fill="#6366f1">|z|=1 (Unit Circle)</text>
              <text x="256" y="78" font-size="11" font-weight="bold" fill="#e11d48">Pole (× Resonance)</text>
              <text x="210" y="40" font-size="11" font-weight="bold" fill="#0284c7">Zero (○ Null)</text>
            </svg>
          caption: "The complex z-plane: walking around the Unit Circle ($|z|=1$) gives the physical frequency response. Poles ($\\times$) near the circle boost frequencies (resonance), while Zeros ($\\circ$) cancel frequencies (nulls)."
        points:
          - "Working with time-domain convolution sums and difference equations can be tedious. If you connect three filters in series, calculating nested convolution sums requires heavy computation."
          - "The **Z-Transform** $X(z) = \\sum_{n=-\\infty}^{\\infty} x[n] z^{-n}$ solves this by converting time delays ($z^{-1}$) into simple polynomial algebra. A 1-sample delay in time is simply multiplication by $z^{-1}$ in the z-domain."
          - "Under the Z-transform, time-domain convolution becomes simple multiplication: $Y(z) = H(z) \\cdot X(z)$. The ratio $H(z) = Y(z) / X(z)$ is the **Transfer Function**, describing the filter as a simple fraction of polynomials: $H(z) = \\frac{B(z)}{A(z)} = \\frac{b_0 + b_1 z^{-1} + \\dots}{1 + a_1 z^{-1} + \\dots}$."
          - "The **Region of Convergence (ROC)** is the set of points in the complex plane where the infinite sum converges to a finite value. For a causal, physical system, the ROC is always the area outside the outermost pole ($|z| > r_{\\max}$)."
      - title: "Poles & Zeros: The Architecture of Resonance and Nulls"
        points:
          - "The transfer function fraction $H(z) = \\frac{B(z)}{A(z)}$ is completely defined by its roots:"
          - "**Zeros** are the roots of the numerator $B(z) = 0$. If an input frequency lands on a zero, the output is multiplied by 0, completely deleting that frequency from the audio (used to build notch filters that remove electrical hum)."
          - "**Poles** are the roots of the denominator $A(z) = 0$ where the fraction divides by zero ($H(z) \\to \\infty$). If an input frequency passes close to a pole, the system exhibits sharp resonance and amplification at that frequency."
          - "**The Golden Rule of Stability**: For any causal digital filter to remain stable and never explode into infinite runaway feedback, **all poles must sit strictly inside the unit circle** ($|z| < 1$). If even one pole sits on or outside the unit circle ($|z| \\ge 1$), its response grows exponentially until the system crashes."
      - title: "The DTFT: Walking Around the Unit Circle"
        points:
          - "What is the physical connection between the z-plane and the musical frequencies we actually hear?"
          - "If you evaluate the Z-transform strictly along the perimeter of the **Unit Circle** (setting $|z| = 1$, or $z = e^{j\\omega}$), you obtain the **Discrete-Time Fourier Transform (DTFT)**: $X(e^{j\\omega}) = \\sum x[n] e^{-j\\omega n}$."
          - "The angle $\\omega$ around the unit circle corresponds to frequency: $\\omega = 0$ (at $z = +1$) is DC (0 Hz / bass), while $\\omega = \\pi$ (at $z = -1$) represents the highest possible discrete frequency (half the sampling rate, $f_s / 2$)."
          - "Why is the DTFT periodic with period $2\\pi$? Because spinning $360^\\circ$ ($2\\pi$ radians) around a circle brings you right back to where you started. Discrete frequencies naturally wrap around every $2\\pi$."
          - "**Linear Phase & Group Delay**: If all frequency components experience the exact same time delay through a filter (constant group delay $\\tau_g = -d\\theta/d\\omega$), the musical wave shape is preserved perfectly without phase smearing."
    trivia:
      - type: multiple_choice
        question: "How is the Discrete-Time Fourier Transform (DTFT) related geometrically to the Z-transform?"
        options:
          - "It is the Z-transform evaluated specifically on the Unit Circle where $z = e^{j\\omega}$"
          - "It is the derivative of the Z-transform with respect to $z$"
          - "It is the Z-transform evaluated only on the real axis"
          - "There is no mathematical connection between them"
        correct: 0
      - type: multiple_choice
        question: "Where must all poles of a causal digital transfer function $H(z)$ lie for the filter to be BIBO stable?"
        options:
          - "Strictly inside the unit circle ($|z| < 1$)"
          - "Strictly outside the unit circle ($|z| > 1$)"
          - "Directly on the unit circle ($|z| = 1$)"
          - "On the negative imaginary axis"
        correct: 0
      - type: multiple_choice
        question: "What effect is created on an audio signal when a Zero is placed directly on the unit circle at $z = e^{j\\omega_0}$?"
        options:
          - "The filter completely cancels out (notches) frequency $\\omega_0$, giving zero gain at that frequency"
          - "The filter amplifies frequency $\\omega_0$ to infinite volume"
          - "The filter doubles the playback speed"
          - "The filter becomes unstable"
        correct: 0
      - type: multiple_choice
        question: "Why is the DTFT frequency spectrum periodic with a period of $2\\pi$ radians?"
        options:
          - "Because traveling $2\\pi$ radians ($360^\\circ$) around the complex unit circle returns to the exact same geometric point"
          - "Because computer memory is organized in bytes of 8 bits"
          - "Because audio sampling rates must be divisible by 2"
          - "Because sound waves only travel in circular paths"
        correct: 0
      - type: multiple_choice
        question: "Why do audio mastering engineers prefer filters with Linear Phase?"
        options:
          - "All frequency components undergo the exact same time delay (constant group delay), preventing phase smearing and waveform distortion"
          - "Linear phase filters use zero electrical power"
          - "Linear phase filters do not require any arithmetic multiplications"
          - "They automatically boost bass frequencies"
        correct: 0
      - type: multiple_choice
        question: "What is the Region of Convergence (ROC) for a causal right-sided filter with a pole at $z = 0.8$?"
        options:
          - "$|z| > 0.8$ (the area strictly outside the circle of radius 0.8)"
          - "$|z| < 0.8$ (the area inside the circle)"
          - "The single point $z = 0$"
          - "The entire complex plane including infinity"
        correct: 0
      - type: multiple_choice
        question: "How does the Z-transform simplify the analysis of connecting multiple filters in series (cascade)?"
        options:
          - "It converts complex time-domain convolution into simple algebraic multiplication: $H_{\\text{total}}(z) = H_1(z) H_2(z)$"
          - "It eliminates all numbers and replaces them with text"
          - "It cuts the required sampling rate in half"
          - "It removes the impulse response"
        correct: 0
      - type: multiple_choice
        question: "What defines a Minimum Phase digital filter?"
        options:
          - "All of its poles AND all of its zeros lie strictly inside the unit circle ($|z| < 1$), giving the shortest possible time delay"
          - "It uses the minimum number of mathematical additions"
          - "It has zero gain across all frequencies"
          - "It is a non-causal filter"
        correct: 0
      - type: multiple_choice
        question: "What is the magnitude response $|H(e^{j\\omega})|$ of an All-Pass filter?"
        options:
          - "Constant unity gain ($|H(e^{j\\omega})| = 1$) across all frequencies, modifying only the phase relationships"
          - "Zero gain everywhere except at DC"
          - "Monotonically increasing gain with frequency"
          - "A sharp brick-wall lowpass cutoff"
        correct: 0
      - type: multiple_choice
        question: "What is the Z-transform of a simple 1-sample delay $\\delta[n - 1]$?"
        options:
          - "$z^{-1}$"
          - "$z^{+1}$"
          - "$\\frac{1}{1 - z}$"
          - "$1$"
        correct: 0
      - type: multiple_choice
        question: "What is the Z-transform of the decaying exponential sequence $a^n u[n]$ (where $|a| < 1$)?"
        options:
          - "$\\frac{1}{1 - a z^{-1}}$ with ROC $|z| > |a|$"
          - "$\\frac{1}{1 - a z^{-1}}$ with ROC $|z| < |a|$"
          - "$\\frac{z}{z + a}$ with ROC $|z| = 1$"
          - "$\\ln(1 - a z^{-1})$"
        correct: 0
      - type: multiple_choice
        question: "What does Parseval's Theorem state regarding the energy of a digital signal?"
        options:
          - "Total energy is strictly conserved: the sum of squared samples in time equals the integrated energy across all frequencies"
          - "Energy in frequency is multiplied by $2\\pi^2$"
          - "High frequencies always carry more energy than low frequencies"
          - "Energy disappears inside digital circuits"
        correct: 0
      - type: multiple_choice
        question: "What does the Group Delay $\\tau_g(\\omega) = -\\frac{d\\theta}{d\\omega}$ measure physically?"
        options:
          - "The actual time delay (in samples or seconds) experienced by a wave packet at frequency $\\omega$ passing through the filter"
          - "The total time required to download an audio file"
          - "The delay between pressing play and hearing sound"
          - "The clock frequency of the processor"
        correct: 0
      - type: multiple_choice
        question: "Where on the unit circle does the highest possible discrete frequency (the Nyquist frequency $\\omega = \\pi$) sit?"
        options:
          - "At $z = -1$ on the negative real axis"
          - "At $z = +1$ on the positive real axis (DC)"
          - "At $z = 0$ (the origin)"
          - "At $z = +j$ on the imaginary axis"
        correct: 0
      - type: multiple_choice
        question: "Why can the Region of Convergence (ROC) never contain any poles?"
        options:
          - "Because poles are points where the transfer function approaches infinity, violating the condition of finite convergence"
          - "Because poles are negative numbers"
          - "Because zeros push poles out of the plane"
          - "Because the ROC is only defined on the real axis"
