      - type: multiple_choice
        question: "What is the group delay $\\tau_g(\\omega)$ of a system with phase response $\\theta(\\omega)$?"
        options:
          - "$\\tau_g(\\omega) = -\\frac{d\\theta(\\omega)}{d\\omega}$"
          - "$\\tau_g(\\omega) = \\frac{\\theta(\\omega)}{\\omega}$"
          - "$\\tau_g(\\omega) = |H(e^{j\\omega})|^2$"
          - "$\\tau_g(\\omega) = \\int \\theta(\\omega) d\\omega$"
        correct: 0
      - type: multiple_choice
        question: "What is a system called if all its poles AND zeros are strictly inside the unit circle?"
        options:
          - "Minimum Phase System"
          - "All-Pass System"
          - "Non-causal System"
          - "Direct Form II Transposed System"
        correct: 0
      - type: multiple_choice
