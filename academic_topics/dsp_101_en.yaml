id: dsp_101_en
type: academic
icon: "📡"
title: "Digital Signal Processing (DSP 101)"
description: >
  An upper-level engineering curriculum in discrete-time signals, linear time-invariant systems, z-transforms, digital filter design, and fast spectral algorithms.
lang: en
audience: family
categories:
  - id: foundations_discrete_time
    title: "1. Foundations & Discrete-Time Systems"
    description: >
      Discrete-time signal representations, linearity, time-invariance, convolution sum, causality, and difference equations.
    cards:
      - title: "Continuous-Time vs. Discrete-Time Signals"
        points:
          - "A continuous-time (CT) signal $x(t)$ is defined on a continuum of time $t \\in \\mathbb{R}$, whereas a discrete-time (DT) signal $x[n]$ is defined strictly for integer indices $n \\in \\mathbb{Z}$."
          - "Periodic sampling at interval $T_s$ converts $x(t)$ into sequence $x[n] = x(n T_s)$, where $f_s = 1/T_s$ is the sampling rate in samples per second (Hz)."
          - "The discrete unit impulse $\\delta[n]$ is defined as $\\delta[n] = 1$ for $n=0$ and $0$ for $n \\neq 0$. Unlike continuous $\\delta(t)$, $\\delta[n]$ has finite amplitude and unit area."
          - "The discrete unit step $u[n]$ is $1$ for $n \\ge 0$ and $0$ for $n < 0$. It relates to the impulse via $u[n] = \\sum_{k=-\\infty}^n \\delta[k]$ and $\\delta[n] = u[n] - u[n-1]$."
          - "Energy of a signal is $E = \\sum_{n=-\\infty}^{\\infty} |x[n]|^2$. If $E < \\infty$, it is an energy signal. If average power $P = \\lim_{N\\to\\infty} \\frac{1}{2N+1} \\sum_{n=-N}^N |x[n]|^2$ is non-zero and finite, it is a power signal."
      - title: "Linear Time-Invariant (LTI) Systems & Convolution"
        points:
          - "A system is Linear if it obeys the principle of superposition: $T\\{a x_1[n] + b x_2[n]\\} = a T\\{x_1[n]\\} + b T\\{x_2[n]\\}$."
          - "A system is Time-Invariant if a delay in the input produces the exact same delay in the output: if $x[n] \\to y[n]$, then $x[n-n_0] \\to y[n-n_0]$."
          - "Any discrete LTI system is uniquely and completely characterized by its impulse response $h[n] = T\\{\\delta[n]\\}$."
          - "The output for arbitrary input $x[n]$ is given by the convolution sum: $y[n] = (x * h)[n] = \\sum_{k=-\\infty}^{\\infty} x[k] h[n-k]$."
          - "Convolution properties: Commutative ($x*h = h*x$), Associative ($x*(h_1*h_2) = (x*h_1)*h_2$), and Distributive ($x*(h_1+h_2) = x*h_1 + x*h_2$)."
      - title: "Difference Equations, Causality & BIBO Stability"
        points:
          - "Linear Constant-Coefficient Difference Equations (LCCDE) model discrete systems: $\\sum_{k=0}^N a_k y[n-k] = \\sum_{m=0}^M b_m x[n-m]$ with $a_0 = 1$."
          - "A system is Causal if the output $y[n]$ at any index $n$ depends only on current and past inputs $x[k]$ ($k \\le n$), which for an LTI system requires $h[n] = 0$ for all $n < 0$."
          - "Bounded-Input Bounded-Output (BIBO) Stability: every bounded input $|x[n]| \\le B_x < \\infty$ yields a bounded output $|y[n]| \\le B_y < \\infty$."
          - "An LTI system is BIBO stable if and only if its impulse response is absolutely summable: $\\sum_{n=-\\infty}^{\\infty} |h[n]| < \\infty$."
    trivia:
      - type: multiple_choice
        question: "What is the mathematical definition of the discrete unit impulse function $\\delta[n]$?"
        options:
          - "$\\delta[n] = 1$ for $n=0$, and $0$ for all $n \\neq 0$"
