  - id: digital_filter_design
    title: "4. Digital Filter Design"
    description: >
      Sculpting audio: the rock-solid safety of FIR moving averages, the recursive power of IIR feedback loops, windowing, and analog prototype transformation.
    cards:
      - title: "FIR vs. IIR: The Two Master Architectures"
        figure:
          title: "FIR Feedforward Delay Line vs. IIR Recursive Feedback"
          svg: >
            <svg viewBox="0 0 500 180" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-height:180px;">
              <!-- FIR Structure -->
              <text x="20" y="20" font-size="11" font-weight="bold" fill="#6366f1">FIR: Feedforward Tapped Delay Line (No Feedback Loop)</text>
              <line x1="40" y1="45" x2="260" y2="45" stroke="currentColor" stroke-width="1.5"/>
              <rect x="80" y="35" width="30" height="20" fill="currentColor" fill-opacity="0.08" stroke="#6366f1"/>
              <text x="95" y="49" font-size="9" fill="currentColor" text-anchor="middle">z⁻¹</text>
              <rect x="150" y="35" width="30" height="20" fill="currentColor" fill-opacity="0.08" stroke="#6366f1"/>
              <text x="165" y="49" font-size="9" fill="currentColor" text-anchor="middle">z⁻¹</text>
              <line x1="60" y1="45" x2="60" y2="75" stroke="#6366f1"/>
              <line x1="130" y1="45" x2="130" y2="75" stroke="#6366f1"/>
              <line x1="200" y1="45" x2="200" y2="75" stroke="#6366f1"/>
              <circle cx="60" cy="75" r="8" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1"/><text x="60" y="78" font-size="8" fill="currentColor" text-anchor="middle">b0</text>
              <circle cx="130" cy="75" r="8" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1"/><text x="130" y="78" font-size="8" fill="currentColor" text-anchor="middle">b1</text>
              <circle cx="200" cy="75" r="8" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1"/><text x="200" y="78" font-size="8" fill="currentColor" text-anchor="middle">b2</text>
              <line x1="60" y1="83" x2="240" y2="83" stroke="currentColor" stroke-width="1.5"/>
              <text x="260" y="86" font-size="10" font-weight="bold" fill="currentColor">y[n]</text>

              <!-- IIR Structure -->
              <text x="20" y="115" font-size="11" font-weight="bold" fill="#0284c7">IIR: Recursive Structure (Feedforward + Feedback Loops)</text>
              <rect x="180" y="125" width="140" height="45" rx="6" fill="currentColor" fill-opacity="0.06" stroke="#0284c7" stroke-width="1.5"/>
              <text x="250" y="145" font-size="10" font-weight="bold" fill="currentColor" text-anchor="middle">Feedforward (b) +</text>
              <text x="250" y="160" font-size="10" font-weight="bold" fill="#e11d48" text-anchor="middle">Feedback Loop (a)</text>
            </svg>
          caption: "FIR filters calculate a moving weighted average of past inputs with zero feedback (unconditionally stable, linear phase). IIR filters recycle past outputs (compact and efficient, but requires stability care)."
        points:
          - "Digital filters are the sculptors of sound: boosting bass, eliminating background fan noise, or extracting wireless carrier channels from radio waves."
          - "**FIR (Finite Impulse Response)**: Think of an FIR filter as an extended moving weighted average: $y[n] = b_0 x[n] + b_1 x[n-1] + \\dots + b_M x[n-M]$. Because there is **no feedback loop**, it is **unconditionally stable**—it is physically impossible for an FIR filter to oscillate out of control or blow up. Furthermore, if the coefficients are symmetric ($b_k = b_{M-k}$), it achieves perfect **Linear Phase** (zero phase distortion). The downside: it requires many delay stages (high order) to achieve sharp cutoff slopes."
          - "**IIR (Infinite Impulse Response)**: Think of an IIR filter as a recursive feedback system: $y[n] = \\sum b_m x[n-m] - \\sum a_k y[n-k]$. Because it recycles previous outputs, it can create razor-sharp frequency cuts with very few equations and minimal CPU overhead. The tradeoff: its phase response is non-linear, and if poles migrate outside the unit circle due to rounding errors, it can squeal into instability."
      - title: "FIR Filter Design via Windowing (Taming the Gibbs Ripple)"
        points:
          - "An ideal brick-wall lowpass filter has an impulse response shaped like a sinc wave that extends infinitely into the past and future: $h_{\\text{ideal}}[n] = \\frac{\\sin(\\omega_c n)}{\\pi n}$."
          - "Because real computers cannot store infinite arrays, we must truncate the sinc wave to a finite length using a **Window Function** $w[n]$."
          - "A blunt rectangular cutoff acts like slamming a door: it creates sharp edge ripples and side-lobe leakage known as the **Gibbs Phenomenon** (first side lobe only $-13\\text{ dB}$ down, creating audible buzzing)."
          - "Tapered window functions (Hamming, Hanning, Blackman, and Kaiser) gently fade the edges to zero, suppressing unwanted side-lobe leakage (Hamming gives $-43\\text{ dB}$, Blackman gives $-58\\text{ dB}$) at the cost of a slightly wider transition boundary."
          - "The industry-standard **Parks-McClellan Algorithm** uses the Remez exchange method to design optimal equiripple linear-phase FIR filters with minimum Chebyshev error."
      - title: "IIR Filter Design via Bilinear Transformation"
        points:
          - "Electrical engineers spent the 20th century perfecting classic analog filter circuits: Butterworth (maximally flat passband with zero ripple), Chebyshev (sharp roll-off with controlled passband ripples), and Elliptic (steepest possible cutoff with ripples in both bands)."
          - "The **Bilinear Transformation** $s = \\frac{2}{T} \\frac{1 - z^{-1}}{1 + z^{-1}}$ maps these continuous analog prototypes directly into digital z-plane filters without creating any aliasing."
          - "Because it compresses an infinite analog frequency axis onto a finite discrete unit circle, it non-linearly warps frequency values. Engineers compensate by **Pre-Warping** target cutoff frequencies before conversion."
          - "To prevent numerical rounding errors and limit cycle buzz in fixed-point DSP hardware, high-order IIR filters are constructed as cascades of simple **Second-Order Sections (Biquads)**."
    trivia:
      - type: multiple_choice
        question: "Why can an FIR (Finite Impulse Response) digital filter NEVER become unstable or blow up into infinite feedback?"
        options:
          - "Because it has no feedback loops; all its poles sit strictly and safely at the origin $z=0$"
