          - "A polynomial spline"
        correct: 0
      - type: multiple_choice
        question: "What happens in the frequency domain when a continuous-time signal is sampled at uniform intervals $T_s$?"
        options:
          - "Its continuous spectrum is periodically replicated at integer multiples of the sampling frequency $f_s$"
