      - type: multiple_choice
        question: "What continuous interpolation kernel enables exact reconstruction of bandlimited signals in the Whittaker-Shannon interpolation formula?"
        options:
          - "The normalized sinc function: $\\text{sinc}\\left(\\frac{t - n T_s}{T_s}\\right) = \\frac{\\sin(\\pi (t - n T_s)/T_s)}{\\pi (t - n T_s)/T_s}$"
          - "The Gaussian pulse"
