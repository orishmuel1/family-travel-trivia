  - id: z_transform_frequency
    title: "2. The Z-Transform & Frequency Analysis"
    description: >
      Complex frequency domain, Region of Convergence (ROC), pole-zero analysis, transfer functions, and the Discrete-Time Fourier Transform (DTFT).
    cards:
      - title: "The Z-Transform & Region of Convergence (ROC)"
        points:
          - "The bilateral Z-transform maps a sequence $x[n]$ to complex variable $z = r e^{j\\omega}$: $X(z) = \\mathcal{Z}\\{x[n]\\} = \\sum_{n=-\\infty}^{\\infty} x[n] z^{-n}$."
          - "The Region of Convergence (ROC) is the set of complex numbers $z$ for which the power series $\\sum |x[n] z^{-n}|$ converges absolutely."
          - "The ROC is always an annular ring in the complex z-plane: $r_R < |z| < r_L$, centered at the origin."
          - "Key ROC properties: (1) ROC never contains any poles; (2) For right-sided signals ($x[n]=0$ for $n < N_1$), ROC extends outward from the outermost pole: $|z| > r_{\\max}$; (3) For left-sided signals, ROC extends inward: $|z| < r_{\\min}$."
          - "An LTI system is BIBO stable if and only if its ROC includes the unit circle $|z| = 1$."
      - title: "Poles, Zeros & Transfer Function H(z)"
        points:
          - "The rational transfer function is $H(z) = \\frac{Y(z)}{X(z)} = \\frac{\\sum_{m=0}^M b_m z^{-m}}{\\sum_{k=0}^N a_k z^{-k}} = b_0 \\frac{\\prod_{m=1}^M (1 - c_m z^{-1})}{\\prod_{k=1}^N (1 - d_k z^{-1})}$."
          - "Zeros ($c_m$) are values of $z$ where $H(z) = 0$; Poles ($d_k$) are values of $z$ where $H(z) \\to \\infty$."
          - "A causal LTI system is BIBO stable if and only if ALL its poles lie strictly INSIDE the unit circle ($|d_k| < 1$ for all $k$)."
          - "Poles close to the unit circle produce resonant peaks in magnitude response; zeros on or near the unit circle create sharp notches / nulls."
      - title: "Discrete-Time Fourier Transform (DTFT)"
        points:
          - "The DTFT represents the frequency content of discrete signals: $X(e^{j\\omega}) = \\sum_{n=-\\infty}^{\\infty} x[n] e^{-j\\omega n}$."
          - "The DTFT is simply the Z-transform evaluated on the unit circle: $X(e^{j\\omega}) = X(z)|_{z = e^{j\\omega}}$."
          - "The DTFT is always periodic in continuous normalized frequency $\\omega$ with period $2\\pi$: $X(e^{j(\\omega + 2\\pi)}) = X(e^{j\\omega})$."
          - "Inverse DTFT synthesizes the sequence: $x[n] = \\frac{1}{2\\pi} \\int_{-\\pi}^{\\pi} X(e^{j\\omega}) e^{j\\omega n} d\\omega$."
          - "Parseval's Theorem states energy conservation between time and frequency: $\\sum_{n=-\\infty}^{\\infty} |x[n]|^2 = \\frac{1}{2\\pi} \\int_{-\\pi}^{\\pi} |X(e^{j\\omega})|^2 d\\omega$."
    trivia:
      - type: multiple_choice
        question: "How is the Discrete-Time Fourier Transform (DTFT) related to the Z-transform $X(z)$?"
        options:
          - "It is the Z-transform evaluated on the unit circle ($z = e^{j\\omega}$)"
          - "It is the Z-transform evaluated along the real axis ($z = r$)"
          - "It is the inverse laplace transform of $X(z)$"
          - "It is the derivative $\\frac{d}{dz} X(z)$"
        correct: 0
      - type: multiple_choice
        question: "For a causal LTI system to be BIBO stable, where must all its poles lie in the z-plane?"
        options:
          - "Strictly inside the unit circle ($|z| < 1$)"
          - "Strictly outside the unit circle ($|z| > 1$)"
          - "Exactly on the imaginary axis"
          - "In the left half of the s-plane"
        correct: 0
      - type: multiple_choice
        question: "What is the fundamental periodicity of the DTFT $X(e^{j\\omega})$ with respect to frequency $\\omega$?"
        options:
          - "$2\\pi$ radians"
          - "$\\pi$ radians"
          - "$4\\pi$ radians"
          - "It is aperiodic"
        correct: 0
      - type: multiple_choice
        question: "What is the Region of Convergence (ROC) for a right-sided causal sequence with pole at $z = a$?"
        options:
          - "$|z| > |a|$"
          - "$|z| < |a|$"
          - "The entire z-plane"
          - "Only the unit circle"
        correct: 0
      - type: multiple_choice
        question: "Can a pole of a transfer function $H(z)$ ever lie inside the Region of Convergence (ROC)?"
        options:
          - "No, the ROC can never contain any poles"
          - "Yes, if the system is stable"
          - "Yes, if the system is FIR"
          - "Only if the pole has multiplicity greater than 2"
        correct: 0
      - type: multiple_choice
        question: "What geometric feature in the z-plane creates a complete frequency null (zero gain) at $\\omega = \\omega_0$?"
        options:
          - "A zero placed directly on the unit circle at $z = e^{j\\omega_0}$"
          - "A pole placed at the origin"
          - "A pole placed on the unit circle"
          - "A zero at $z = \\infty$"
        correct: 0
      - type: multiple_choice
        question: "What is the Z-transform of the time-delayed sequence $x[n - k]$ in terms of $X(z)$?"
        options:
          - "$z^{-k} X(z)$"
          - "$z^{+k} X(z)$"
          - "$k \\cdot z^{-1} X(z)$"
          - "$X(z - k)$"
        correct: 0
      - type: multiple_choice
        question: "What does Parseval's Theorem establish for discrete-time signals?"
        options:
          - "Energy equivalence between the time domain and frequency domain"
          - "Phase linearity across all passbands"
          - "The minimum number of quantization bits needed"
          - "The stability boundary of recursive filters"
        correct: 0
      - type: multiple_choice
        question: "What is the Z-transform of the unit impulse $\\delta[n]$?"
        options:
          - "$1$ for all $z$"
          - "$\\frac{1}{1 - z^{-1}}$"
          - "$z^{-1}$"
          - "$0$"
        correct: 0
      - type: multiple_choice
        question: "What is the Z-transform of the causal exponential sequence $a^n u[n]$?"
        options:
          - "$\\frac{1}{1 - a z^{-1}}$ with ROC $|z| > |a|$"
          - "$\\frac{1}{1 - a z^{-1}}$ with ROC $|z| < |a|$"
          - "$\\frac{z}{z + a}$"
          - "$\\ln(1 - a z^{-1})$"
        correct: 0
      - type: multiple_choice
        question: "If a system's impulse response is symmetric $h[n] = h[N-1-n]$, what desirable property does it guarantee?"
        options:
          - "Strictly linear phase response"
          - "Zero computational delay"
          - "Infinite attenuation in stopband"
          - "Minimum phase zeros only"
