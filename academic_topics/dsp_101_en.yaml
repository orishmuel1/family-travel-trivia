  - id: dft_and_fft_algorithms
    title: "5. The Discrete Fourier Transform & Fast Algorithms"
    description: >
      The discrete Fourier transform (DFT), circular convolution, spectral resolution, windowing & leakage, and the radix-2 Cooley-Tukey FFT algorithm.
    cards:
      - title: "The Discrete Fourier Transform (DFT)"
        points:
          - "The DFT converts a finite-length discrete sequence $x[n]$ of length $N$ into $N$ discrete frequency samples: $X[k] = \\sum_{n=0}^{N-1} x[n] W_N^{k n}$ where $W_N = e^{-j \\frac{2\\pi}{N}}$ is the twiddle factor."
          - "The Inverse DFT reconstructs the sequence: $x[n] = \\frac{1}{N} \\sum_{k=0}^{N-1} X[k] W_N^{-k n}$."
          - "The $N$-point DFT samples the continuous DTFT $X(e^{j\\omega})$ at $N$ uniformly spaced points along the unit circle: $\\omega_k = \\frac{2\\pi k}{N}$ for $k = 0, 1, \\dots, N-1$."
          - "Twiddle factor properties: Periodicity ($W_N^{k+N} = W_N^k$), Symmetry ($W_N^{k + N/2} = -W_N^k$), and Reduction ($W_N^{2k} = W_{N/2}^k$)."
      - title: "Circular Convolution vs. Linear Convolution"
        points:
          - "Multiplying two DFTs in frequency $Y[k] = X_1[k] X_2[k]$ corresponds to Circular (periodic) Convolution in time: $y[n] = (x_1 \\circledast x_2)[n] = \\sum_{m=0}^{N-1} x_1[m] x_2[((n - m))_N]$."
          - "To compute Linear Convolution of length $L$ and $P$ using the DFT without circular wrap-around aliasing, both sequences must be zero-padded to minimum length $N \\ge L + P - 1$."
          - "Block convolution for long or streaming audio data is efficiently computed via Overlap-Add (OLA) or Overlap-Save (OLS) methods."
      - title: "Spectral Resolution, Leakage & The Fast Fourier Transform (FFT)"
        points:
          - "Bin spacing in Hertz is $\\Delta f = \\frac{f_s}{N} = \\frac{1}{T_{\\text{total}}}$, determined strictly by total observation duration $T_{\\text{total}} = N T_s$. Zero-padding interpolates the spectrum but does NOT improve physical resolution."
          - "Spectral Leakage occurs when a signal frequency does not align with an integer bin, smearing energy into adjacent bins; windowing reduces leakage sidelobes at the expense of main lobe broadening."
          - "Direct DFT calculation requires $O(N^2)$ complex multiplications."
          - "The Cooley-Tukey Radix-2 Decimation-in-Time (DIT) FFT algorithm decomposes an $N$-point DFT recursively into two $N/2$-point DFTs, slashing computational complexity to $O(N \\log_2 N)$."
          - "For $N = 1024$, direct DFT requires $\\approx 1,048,576$ operations; FFT requires $\\approx 10,240$ operations — over 100 times faster!"
    trivia:
      - type: multiple_choice
        question: "What is the computational complexity of computing an $N$-point DFT using the Radix-2 Cooley-Tukey FFT algorithm?"
        options:
          - "$O(N \\log_2 N)$"
          - "$O(N^2)$"
          - "$O(N^3)$"
          - "$O(\\log N)$"
        correct: 0
      - type: multiple_choice
        question: "What is the computational complexity of evaluating an $N$-point DFT directly from its algebraic formula?"
        options:
          - "$O(N^2)$ complex multiplications and additions"
          - "$O(N \\log N)$"
          - "$O(N)$"
          - "$O(2^N)$"
        correct: 0
      - type: multiple_choice
        question: "What does multiplying two $N$-point DFT sequences point-by-point in the frequency domain correspond to in time?"
        options:
          - "Circular (cyclic) convolution of length $N$"
          - "Linear aperiodic convolution"
          - "Point-by-point time addition"
          - "Autocorrelation at zero lag"
        correct: 0
      - type: multiple_choice
        question: "To compute the linear convolution of two signals of lengths $L$ and $P$ using the FFT, what is the minimum zero-padded length $N$ required?"
        options:
          - "$N \\ge L + P - 1$"
          - "$N = L + P$"
          - "$N = \\max(L, P)$"
          - "$N = L \\times P$"
        correct: 0
      - type: multiple_choice
        question: "What determines the true physical frequency resolution (minimum resolvable separation between two sine waves) of a DFT analysis?"
        options:
          - "The total duration of the recorded time window ($T_{\\text{total}} = N T_s$)"
          - "The number of zeros padded at the end of the sequence"
          - "The bit depth of the analog-to-digital converter"
          - "The CPU clock speed"
        correct: 0
      - type: multiple_choice
        question: "What is the primary effect of zero-padding a time-domain signal before taking the DFT?"
        options:
          - "It provides ideal bandlimited interpolation of the DTFT spectrum (smoother display) without increasing physical resolution"
          - "It increases true physical frequency resolution between closely spaced peaks"
          - "It eliminates all spectral leakage"
          - "It increases signal-to-noise ratio"
        correct: 0
      - type: multiple_choice
        question: "What causes 'spectral leakage' when analyzing a continuous sinusoid with the DFT?"
        options:
