  - id: digital_filter_design
    title: "4. Digital Filter Design"
    description: >
      FIR vs. IIR architecture trade-offs, linear phase FIR design via windowing, equiripple optimization, and IIR design via the Bilinear Transformation.
    cards:
      - title: "FIR vs. IIR Architecture & Trade-Offs"
        figure:
          title: "FIR vs. IIR Filter Architectures"
          svg: >
            <svg viewBox="0 0 500 180" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-height:180px;">
              <!-- FIR Structure -->
              <text x="20" y="20" font-size="11" font-weight="bold" fill="#6366f1">FIR: Feedforward Tapped Delay Line (All-Zero)</text>
              <line x1="40" y1="45" x2="260" y2="45" stroke="currentColor" stroke-width="1.5"/>
              <rect x="80" y="35" width="30" height="20" fill="currentColor" fill-opacity="0.08" stroke="#6366f1"/>
              <text x="95" y="49" font-size="9" fill="currentColor" text-anchor="middle">z⁻¹</text>
              <rect x="150" y="35" width="30" height="20" fill="currentColor" fill-opacity="0.08" stroke="#6366f1"/>
              <text x="165" y="49" font-size="9" fill="currentColor" text-anchor="middle">z⁻¹</text>
              <!-- Multipliers -->
              <line x1="60" y1="45" x2="60" y2="75" stroke="#6366f1"/>
              <line x1="130" y1="45" x2="130" y2="75" stroke="#6366f1"/>
              <line x1="200" y1="45" x2="200" y2="75" stroke="#6366f1"/>
              <circle cx="60" cy="75" r="8" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1"/><text x="60" y="78" font-size="8" fill="currentColor" text-anchor="middle">b0</text>
              <circle cx="130" cy="75" r="8" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1"/><text x="130" y="78" font-size="8" fill="currentColor" text-anchor="middle">b1</text>
              <circle cx="200" cy="75" r="8" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1"/><text x="200" y="78" font-size="8" fill="currentColor" text-anchor="middle">b2</text>
              <line x1="60" y1="83" x2="240" y2="83" stroke="currentColor" stroke-width="1.5"/>
              <text x="260" y="86" font-size="10" font-weight="bold" fill="currentColor">y[n]</text>

              <!-- IIR Structure -->
              <text x="20" y="115" font-size="11" font-weight="bold" fill="#0284c7">IIR: Recursive Feedback Structure (Poles &amp; Zeros)</text>
              <rect x="180" y="125" width="140" height="45" rx="6" fill="currentColor" fill-opacity="0.06" stroke="#0284c7" stroke-width="1.5"/>
              <text x="250" y="145" font-size="10" font-weight="bold" fill="currentColor" text-anchor="middle">Feedforward (b) +</text>
              <text x="250" y="160" font-size="10" font-weight="bold" fill="#e11d48" text-anchor="middle">Feedback Loop (a)</text>
            </svg>
          caption: "FIR filters use an all-zero feedforward tapped delay line (unconditionally stable, linear phase). IIR filters incorporate recursive feedback loops (compact order, potential instability)."
        points:
          - "Finite Impulse Response (FIR) filters operate without feedback: $y[n] = \\sum_{k=0}^{M} b_k x[n-k]$. All poles reside exclusively at the origin $z=0$, rendering FIR filters unconditionally stable regardless of coefficient quantization."
          - "FIR filters can achieve exact Linear Phase (constant group delay) when coefficients are symmetric or anti-symmetric ($h[n] = \\pm h[M-n]$), preserving waveform shapes without phase dispersion."
          - "Infinite Impulse Response (IIR) filters utilize recursive feedback: $y[n] = \\sum_{m=0}^M b_m x[n-m] - \\sum_{k=1}^N a_k y[n-k]$. They achieve much steeper roll-off with significantly fewer coefficients than FIR filters, but exhibit non-linear phase and can become unstable if poles migrate outside the unit circle."
      - title: "FIR Design via Windowing & Equiripple Optimization"
        points:
          - "Ideal frequency-selective filters have infinite, non-causal impulse responses: $h_{\\text{ideal}}[n] = \\frac{\\sin(\\omega_c (n - M/2))}{\\pi (n - M/2)}$."
          - "The Window Method truncates $h_{\\text{ideal}}[n]$ using a window function: $h[n] = h_{\\text{ideal}}[n] \\cdot w[n]$. Abrupt rectangular truncation causes Gibbs Phenomenon, creating ripples and fixed stopband attenuation of only $-13\\text{ dB}$."
          - "Tapered windows trade main lobe width (transition bandwidth) for side-lobe attenuation: Hamming ($-43\\text{ dB}$ first side lobe, $-53\\text{ dB}$ stopband), Blackman ($-58\\text{ dB}$ side lobe, $-74\\text{ dB}$ stopband), and Kaiser (with tunable parameter $\\beta$)."
          - "The Parks-McClellan algorithm uses the Remez exchange method to design optimal equiripple linear-phase FIR filters that minimize Chebyshev approximation error across passbands and stopbands."
      - title: "IIR Design via Bilinear Transformation"
        points:
          - "IIR filters are typically designed by converting continuous analog prototypes (Butterworth, Chebyshev Type I/II, Elliptic) into the discrete z-plane."
          - "The Bilinear Transformation maps the analog s-plane to the discrete z-plane via $s = \\frac{2}{T} \\frac{1 - z^{-1}}{1 + z^{-1}}$, mapping the entire imaginary axis $j\\Omega$ onto the unit circle $|z|=1$, completely avoiding aliasing."
          - "Because the mapping non-linearly compresses frequencies ($\\omega = 2 \\arctan(\\Omega T / 2)$), target discrete cutoff frequencies must be Pre-Warped: $\\Omega = \\frac{2}{T} \\tan(\\omega / 2)$."
          - "To prevent coefficient quantization errors and limit cycle oscillations in fixed-point processors, high-order IIR filters are implemented as cascades of Second-Order Sections (Biquads)."
    trivia:
      - type: multiple_choice
        question: "Why are FIR (Finite Impulse Response) digital filters unconditionally stable?"
        options:
          - "All of their poles reside strictly at the origin $z=0$ due to the absence of recursive feedback loops"
          - "They use positive arithmetic coefficients only"
          - "They operate with infinite precision registers"
          - "They only process DC voltage"
        correct: 0
      - type: multiple_choice
        question: "What is the primary operational advantage of an IIR filter compared to an FIR filter of equivalent magnitude specification?"
        options:
          - "It requires significantly fewer coefficients and computational operations to achieve steep transition roll-off"
          - "It guarantees exact linear phase across all frequencies"
          - "It has zero rounding errors in fixed-point math"
          - "It eliminates the need for delay registers"
        correct: 0
      - type: multiple_choice
        question: "What unwanted effect occurs when an ideal sinc impulse response is abruptly truncated using a rectangular window?"
        options:
          - "Gibbs Phenomenon, causing prominent overshoot ripples and poor stopband attenuation ($-13\\text{ dB}$)"
          - "The filter becomes completely non-linear"
          - "The filter poles move outside the unit circle"
          - "The sampling frequency is halved"
        correct: 0
      - type: multiple_choice
        question: "Which window function features an adjustable parameter $\\beta$ allowing continuous trade-offs between transition bandwidth and stopband attenuation?"
        options:
          - "The Kaiser Window"
          - "The Rectangular Window"
          - "The Hamming Window"
          - "The Bartlett Window"
        correct: 0
      - type: multiple_choice
        question: "Why must frequencies be pre-warped when designing IIR filters using the Bilinear Transformation?"
        options:
          - "To compensate for the non-linear algebraic frequency compression mapping the continuous $j\\Omega$ axis onto the discrete unit circle"
          - "To prevent thermal drift in physical components"
          - "To convert floating point numbers to integers"
          - "To eliminate power supply hum"
        correct: 0
      - type: multiple_choice
        question: "Which analog filter prototype is characterized by a maximally flat magnitude response in the passband with zero ripple?"
        options:
          - "Butterworth Filter"
          - "Chebyshev Type I Filter"
          - "Chebyshev Type II Filter"
          - "Elliptic (Cauer) Filter"
        correct: 0
      - type: multiple_choice
        question: "Which filter prototype delivers the absolute steepest transition bandwidth for a given order by allowing ripples in both passband and stopband?"
        options:
          - "Elliptic (Cauer) Filter"
          - "Butterworth Filter"
          - "Bessel Filter"
          - "Gaussian Filter"
        correct: 0
      - type: multiple_choice
        question: "What algorithm designs optimal equiripple linear-phase FIR filters using Chebyshev minimax approximation?"
        options:
          - "Parks-McClellan Algorithm (Remez Exchange Method)"
          - "Cooley-Tukey Algorithm"
          - "Viterbi Algorithm"
          - "Goertzel Algorithm"
        correct: 0
      - type: multiple_choice
        question: "Why are high-order digital IIR filters implemented as cascaded Second-Order Sections (Biquads)?"
        options:
          - "To minimize coefficient sensitivity to quantization rounding errors and prevent numerical instability"
          - "To force the filter to have linear phase"
          - "To eliminate all delay memory"
          - "To reduce signal volume"
        correct: 0
      - type: multiple_choice
        question: "What phenomenon in fixed-point IIR filter implementations causes autonomous periodic oscillations with zero input due to rounding?"
        options:
          - "Limit Cycle Oscillations"
          - "Spectral Aliasing"
          - "Spectral Leakage"
          - "Frequency Warping"
        correct: 0
      - type: multiple_choice
        question: "Under the Bilinear Transformation, where do stable continuous poles in the Left-Half s-plane ($Re(s) < 0$) map in the z-plane?"
        options:
          - "Strictly inside the discrete unit circle ($|z| < 1$), guaranteeing stability"
          - "Directly on the unit circle ($|z| = 1$)"
          - "Outside the unit circle ($|z| > 1$)"
