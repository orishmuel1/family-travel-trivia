      caption: 'SVD proves every linear transformation factorizes into three steps: an initial rotation
        ($V^T$), coordinate axis stretching by singular values ($\Sigma$), and a final rotation ($U$).'
    points:
    - Eigenvalue diagonalization only works on square matrices ($n \times n$) that have full sets of eigenvectors.
      What about non-square rectangular matrices ($m \times n$, like a dataset of 10,000 users $\times$
      500 movies)?
    - 'Singular Value Decomposition (SVD) is the universal master theorem of linear algebra: ANY real
      matrix $A$ of size $m \times n$ can be factored into: $A = U \Sigma V^T$.'
    - $U$ is an $m \times m$ orthogonal matrix (Left Singular Vectors, eigenvectors of $A A^T$). $\Sigma$
      is an $m \times n$ diagonal matrix holding non-negative Singular Values $\sigma_1 \ge \sigma_2 \ge
      \dots \ge 0$ in descending order. $V$ is an $n \times n$ orthogonal matrix (Right Singular Vectors,
      eigenvectors of $A^T A$).
    - Geometrically, SVD shows that ANY linear transformation maps a unit sphere in $\mathbb{R}^n$ into
      an ellipsoid in $\mathbb{R}^m$, where the semi-axis lengths of the ellipsoid are exactly the singular
      values $\sigma_i$!
  - title: Low-Rank Matrix Approximation & The Eckart-Young Theorem
    points:
    - 'SVD allows us to express any matrix as a sum of rank-1 outer products weighted by singular values:
      $A = \sum_{i=1}^{r} \sigma_i \mathbf{u}_i \mathbf{v}_i^T$.'
    - The Eckart-Young-Mirsky Theorem proves that the mathematically optimal rank-$k$ approximation of
      matrix $A$ (minimizing Frobenius reconstruction error) is obtained simply by keeping the top $k$
      largest singular values and discarding the rest ($A_k = \sum_{i=1}^{k} \sigma_i \mathbf{u}_i \mathbf{v}_i^T$).
    - 'Image Compression: A $1000 \times 1000$ pixel image requires 1,000,000 numbers. Storing only the
      top $k=20$ singular values requires only $20 \times (1000 + 1000 + 1) = 40,020$ numbers — a 96%
      reduction in storage while retaining nearly crystal-clear visual quality!'
  - title: Recommender Systems (Netflix Prize) & Latent Semantic Analysis (LSA)
    points:
    - 'Collaborative Filtering / Recommender Systems: Consider a massive matrix $A$ where rows are users,
      columns are movies, and entries are ratings (mostly blank).'
    - 'SVD factorizes $A \approx U_k \Sigma_k V_k^T$: The rows of $U_k$ become dense embeddings representing
      user preferences across $k$ ''latent concepts'' (e.g. action intensity, romance, sci-fi tone); the
      rows of $V_k$ represent how strongly each movie embodies those same latent concepts.'
    - Latent Semantic Analysis (LSA) in NLP uses SVD on term-document frequency matrices to discover underlying
      semantic topics, clustering synonyms and related concepts automatically from raw text.
  trivia:
  - type: multiple_choice
    question: What is the mathematical formulation of Singular Value Decomposition (SVD) for any m x n
      matrix A?
    options:
    - A = U Sigma V^T (where U and V are orthogonal matrices and Sigma is a diagonal matrix of non-negative
      singular values)
    - A = P D P^-1
    - A = L U
    - A = Q R Q^T
    correct: 0
    explanation: SVD factorizes any rectangular matrix $A$ into $U \Sigma V^T$, where $U$ contains the
      left singular vectors, $\Sigma$ contains sorted singular values, and $V^T$ contains right singular
      vectors.
  - type: multiple_choice
    question: What does the Eckart-Young-Mirsky Theorem prove regarding Low-Rank Matrix Approximation?
    options:
    - The optimal rank-k approximation of a matrix (minimizing reconstruction error) is obtained by truncating
      the SVD to the top k largest singular values
    - Every square matrix has a determinant equal to its trace
    - Matrices with rank less than 5 cannot be inverted
    - Singular values grow exponentially with matrix dimensions
    correct: 0
    explanation: The Eckart-Young theorem proves that truncating the SVD sum to the top $k$ terms ($A_k
      = \sum_{i=1}^k \sigma_i \mathbf{u}_i \mathbf{v}_i^T$) yields the best possible rank-$k$ approximation
      under both Frobenius and Spectral norms.
  - type: multiple_choice
    question: How are the Singular Values (sigma_i) of matrix A related to the eigenvalues of A^T A?
    options:
    - The singular values are the non-negative square roots of the eigenvalues of A^T A (sigma_i = sqrt(lambda_i))
    - The singular values are equal to the eigenvalues divided by 2
    - The singular values are the inverse of the eigenvalues
    - There is no mathematical relationship between them
    correct: 0
    explanation: 'The right singular vectors are the eigenvectors of symmetric matrix $A^T A$, and the
      singular values are the square roots of its non-negative eigenvalues: $\sigma_i = \sqrt{\lambda_i(A^T
      A)}$.'
  - type: multiple_choice
    question: In recommender systems (like the Netflix Prize), what do the low-rank factor matrices U
      and V represent?
    options:
    - Latent feature embeddings capturing user preferences and item/movie characteristics in a shared
      conceptual space
    - The geographic IP addresses of the streaming servers
    - The exact timestamps when users clicked the play button
    - The cryptographic hash keys of user passwords
    correct: 0
    explanation: 'Matrix factorization decomposes the sparse rating matrix into dense latent factor vectors:
      $U$ embeds user preference profiles, and $V$ embeds item characteristics in the same $k$-dimensional
      latent space.'
  - type: multiple_choice
    question: What is the 'Condition Number' of an invertible matrix (kappa(A) = sigma_max / sigma_min)?
    options:
    - 'A measure of numerical sensitivity: how much small errors or noise in the input can be magnified
      in the output solution'
    - The temperature limit of the physical DRAM chips
    - The count of negative numbers in the matrix
    - The number of floating point operations per second
    correct: 0
    explanation: The condition number $\kappa(A) = \frac{\sigma_{\max}}{\sigma_{\min}}$ measures numerical
      stability; an 'ill-conditioned' matrix with a huge condition number magnifies floating-point rounding
      errors dramatically.
  - type: multiple_choice
    question: How can the Moore-Penrose Pseudoinverse (A+) be expressed using the SVD components A = U
      Sigma V^T?
    options:
    - A+ = V Sigma^+ U^T (where Sigma^+ inverts all non-zero singular values 1/sigma_i)
    - A+ = U^T Sigma V
    - A+ = (U Sigma V^T)^-1
    - A+ = Sigma^-1
    correct: 0
    explanation: Using SVD, the pseudoinverse is computed directly as $A^+ = V \Sigma^+ U^T$, where $\Sigma^+$
      transposes $\Sigma$ and replaces every non-zero singular value $\sigma_i$ with $1/\sigma_i$.
  - type: multiple_choice
    question: How many singular values of matrix A are strictly greater than zero?
    options:
    - Exactly equal to the mathematical Rank of matrix A
    - Always equal to the number of rows m
    - Always equal to the number of columns n
    - Zero singular values are greater than zero
    correct: 0
    explanation: The number of non-zero singular values $\sigma_i > 0$ equals the exact rank of matrix
      $A$ (the dimension of its column space).
  - type: multiple_choice
    question: What is the 'Frobenius Norm' of a matrix ||A||_F?
    options:
    - The square root of the sum of the squared values of all matrix entries (equal to sqrt(sum(sigma_i^2)))
    - The largest single number in the matrix
    - The absolute value of the determinant
    - The number of non-zero rows in reduced row echelon form
    correct: 0
    explanation: The Frobenius norm $\|A\|_F = \sqrt{\sum_{i,j} A_{ij}^2}$ measures overall matrix magnitude,
      and equals the Euclidean norm of its singular value vector $\sqrt{\sum_{i} \sigma_i^2}$.
  - type: multiple_choice
    question: In Latent Semantic Analysis (LSA) for natural language processing, what matrix is decomposed
      using SVD?
    options:
    - A Term-Document Frequency Matrix (where rows are vocabulary words and columns are documents)
    - A network routing table of IP addresses
    - A matrix of binary ASCII character codes
    - A database schema table of user IDs
    correct: 0
    explanation: LSA applies truncated SVD to a term-document frequency matrix (e.g. TF-IDF), mapping
      words and documents into a shared continuous semantic space.
  - type: multiple_choice
    question: Why does SVD work on ANY arbitrary rectangular matrix, unlike standard eigenvalue diagonalization?
    options:
    - Because A A^T and A^T A are always symmetric and positive semi-definite, guaranteeing real, non-negative
      singular values
    - Because rectangular matrices have more rows than columns
    - Because SVD does not use floating point numbers
    - Because SVD converts all matrix numbers to zero
    correct: 0
    explanation: For any real matrix $A$, the products $A^T A$ and $A A^T$ are always real, symmetric,
      and positive semi-definite, ensuring orthogonal bases $U, V$ and real non-negative singular values
      exist unconditionally.
  - type: multiple_choice
    question: What geometric shape does a unit sphere in R^n become after being mapped by a linear transformation
      A with SVD singular values sigma_1, sigma_2, ...?
    options:
    - A Hyper-Ellipsoid in R^m whose principal semi-axes have lengths equal to the singular values sigma_i
    - A perfect cube with side length equal to det(A)
    - A 1-dimensional line segment
    - A flat triangle passing through the origin
    correct: 0
    explanation: SVD shows geometrically that any matrix transformation maps an $n$-dimensional unit sphere
      into an $m$-dimensional hyper-ellipsoid with axis lengths $\sigma_1, \sigma_2, \dots, \sigma_r$.
  - type: multiple_choice
    question: What is 'QR Decomposition' of a matrix A?
    options:
    - Factoring A into an Orthogonal matrix Q (Q^T Q = I) and an Upper Triangular matrix R
    - Dividing matrix A into four equal quadrants
    - Computing the square root of matrix A
    - Multiplying matrix A by a quantum random number
    correct: 0
    explanation: QR factorization decomposes a matrix into an orthogonal matrix $Q$ (obtained via Gram-Schmidt
      or Householder reflections) and an upper-triangular matrix $R$, widely used for stable least squares.
  - type: multiple_choice
    question: What is 'LU Decomposition' of a square matrix A?
    options:
    - Factoring A into a Lower Triangular matrix L and an Upper Triangular matrix U (A = L U)
    - Factoring A into a Left matrix and an Ultra matrix
    - Decomposing A into floating point exponent and mantissa
    - Translating A into a linear equation
    correct: 0
    explanation: 'LU decomposition encodes Gaussian elimination into matrix form: $L$ stores elimination
      multipliers in a lower-triangular matrix, and $U$ is the resulting upper-triangular echelon form.'
  - type: multiple_choice
    question: What is 'Cholesky Decomposition' for a symmetric positive-definite matrix A?
    options:
    - 'Factoring A into the product of a lower triangular matrix and its transpose: A = L L^T'
    - Factoring A into three diagonal matrices
    - Approximating A with random Gaussian noise
    - Inverting A by computing its determinant
    correct: 0
    explanation: For symmetric positive-definite matrices, Cholesky decomposition computes $A = L L^T$
      in roughly half the computational operations of standard LU decomposition, widely used in Kalman
      filters and Gaussian processes.
  - type: multiple_choice
    question: What is the primary trade-off when choosing the truncation rank k in Low-Rank Matrix Compression?
    options:
    - Smaller k gives greater compression and memory savings, but discards more fine details and increases
      reconstruction error
    - Smaller k increases the time needed to invert the matrix
    - Larger k causes the singular values to become negative numbers
    - Larger k changes the physical font size of the text
    correct: 0
    explanation: 'Choosing rank $k$ balances compression vs fidelity: smaller $k$ saves massive memory
      by storing fewer vectors, while larger $k$ captures subtle nuances at the cost of higher storage.'
