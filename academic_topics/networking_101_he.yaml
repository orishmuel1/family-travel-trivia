      caption: סיביות בינאריות מומרות לתנודות מתח חשמלי. קידוד מנצ׳סטר משלב את אות
        השעון בתוך מעבר מתח בכל תא סיבית כדי להבטיח סנכרון מושלם.
    points:
    - 'כל תקשורת מחשבים מבוססת ביסודה על הפרעות פיזיקליות: מתחים חשמליים משתנים בכבלי
      נחושת שזורים (Cat6), פולסים של אור לייזר אינפרא-אדום בסיבים אופטיים מזכוכית,
      או גלים אלקטרומגנטיים ברשתות Wi-Fi וסלולר 5G.'
    - 'הגבול התיאורטי העליון של קצב העברת נתונים בערוץ נקבע על פי משפט שנון-הארטלי:
      $C = B \log_2(1 + \text{SNR})$, שבו רוחב הפס $B$ (בהרץ) ויחס האות לרעש (SNR)
      מכתיבים את הקיבולת המקסימלית הנקייה משגיאות.'
    - סיבים אופטיים מגיעים למהירויות של טרה-ביטים לשנייה על ידי הולכת קרני אור דרך
      ליבת זכוכית סיליקה דקיקה באמצעות תופעת החזרה פנימית מלאה, כמעט ללא שום רגישות
      להפרעות אלקטרומגנטיות חיצוניות.
    - כדי לדחוס יותר סיביות לכל שנייה באותו תחום תדר אנלוגי, משדרים מודרניים משתמשים
      באפנון משרעת בריבוע (QAM), המשנה בו-זמנית הן את משרעת הגל הנושא והן את המופע
      (פאזה) שלו.
  - id: ethernet_mac_switching
    title: מסגרות אתרנט, כתובות MAC ומיתוג חומרתי
    figure:
