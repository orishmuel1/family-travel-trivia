      caption: מסגרת אתרנט עוטפת את חבילת ה-IP בכתובות חומרה בנות 48 סיביות, ומסתיימת
        בבדיקת יתירות מחזורית (CRC-32) לסילוק מסגרות פגומות.
    points:
    - לכל כרטיס רשת (NIC) צרובה בחומרה כתובת פיזית ייחודית גלובלית בת 48 סיביות המכונה
      כתובת MAC (למשל 00:1A:2B:3C:4D:5E), כאשר 24 הסיביות הראשונות מזהות את היצרן
      (OUI).
    - רשתות אתרנט מוקדמות פעלו כערוץ משותף בשיטת CSMA/CD; כאשר שני מחשבים שידרו במקביל,
      האותות התנגשו במתח, והמחשבים עצרו והמתינו זמן אקראי מעריכי (Exponential Backoff)
      לפני שידור חוזר.
    - רשתות מודרניות החליפו את הרכזות (Hubs) במתגים חכמים (Switches). המתג לומד את
      כתובות ה-MAC של השולח ובונה טבלת ניתוב חומרתית בזיכרון CAM, וכך מעביר מסגרות
      ישירות ובלעדית אל שקע היעד.
    - כדי לחלק מתג פיזי יחיד לרשתות מקומיות וירטואליות נפרדות, מהנדסי רשת מגדירים
      רשתות VLAN (תקן IEEE 802.1Q), המוסיפות תגית בת 4 בתים לתוך כותרת האתרנט.
  - id: arp_network_discovery
    title: פרוטוקול ARP וגילוי כתובות ברשת המקומית
    points:
    - 'כאשר מחשב מעוניין לשלוח נתונים לכתובת IP מקומית (למשל 192.168.1.50) אך אינו
      יודע מהי כתובת ה-MAC החומרתית שלה, הוא משדר שאילתת ARP Broadcast לכל הרשת: ''למי
      שייכת כתובת 192.168.1.50? נא להשיב ל-192.168.1.10''.'
    - המחשב בעל אותה כתובת משיב בתשובת Unicast ישירה עם כתובת ה-MAC שלו, ושני המחשבים
      שומרים את המיפוי בטבלת מטמון מקומית (ARP Table) עם זמן תפוגה מוגדר מראש.
    - נפח המידע המקסימלי שניתן להכניס לתוך מסגרת אתרנט יחידה ללא פיצול מכונה MTU,
      ומוגדר כברירת מחדל ל-1500 בתים (או עד 9000 בתים במסגרות ענק מסוג Jumbo Frames
      בחוות שרתים).
    - מכיוון שפרוטוקול ARP המקורי פועל ללא אימות, תוקפים ברשת מקומית יכולים לבצע הרעלת
      ARP (ARP Poisoning), ולשדר תשובות מזויפות כדי להטות את כל התעבורה ברשת דרך המחשב
      שלהם (מתקפת אדם-באמצע).
  trivia:
  - type: multiple_choice
    question: איזה משפט יסודי בתורת האינפורמציה מגדיר את הקיבולת המקסימלית התאורטית
      של ערוץ תקשורת אנלוגי בנוכחות רעש?
    options:
    - משפט שנון-הארטלי
    - משפט הדגימה של נייקוויסט
    - משפט הגבול המרכזי
    - חוק ליטל
    correct: 0
    explanation: הנוסחה של קלוד שנון $C = B \log_2(1 + \text{SNR})$ קובעת את הגבול
      הפיזיקלי העליון של קצב שידור נתונים ללא שגיאות בערוץ רועש.
  - type: multiple_choice
    question: איזה עקרון באופטיקה מאפשר לסיבים אופטיים להוליך פולסי אור לאורך אלפי
      קילומטרים של זכוכית כמעט ללא זליגת אות?
    options:
    - החזרה פנימית מלאה
    - עקיפת גלים
    - מנהור קוונטי
    - פליטה פוטואלקטרית
    correct: 0
    explanation: כאשר קרן אור פוגעת במפגש שבין ליבת הזכוכית לציפוי בזווית הגדולה מהזווית
      הקריטית, מתרחשת החזרה מושלמת של 100% מהאור בחזרה לליבה.
  - type: multiple_choice
    question: כמה סיביות (Bits) מרכיבות כתובת חומרה תקנית של כרטיס רשת מסוג MAC?
    options:
    - 48 סיביות (6 בתים)
    - 32 סיביות (4 בתים)
    - 64 סיביות (8 בתים)
    - 128 סיביות (16 בתים)
    correct: 0
    explanation: כתובת MAC מורכבת מ-48 סיביות (המוצגות כ-6 צמדי תווים הקסדצימליים),
      כאשר 24 הסיביות הראשונות מזהות את היצרן ו-24 הנותרות מהוות מזהה מכשיר ייחודי.
  - type: multiple_choice
    question: איזה מנגנון שיתוף ערוץ שימש רשתות אתרנט מוקדמות הפועלות על ערוץ כבלים
      משותף (Hub)?
    options:
    - CSMA/CD (האזנה לערוץ וזיהוי התנגשויות)
    - רשת טבעת אסימון (Token Ring)
    - פרוטוקול ALOHA מחולק לחריצים
    - חלוקת זמן מרובת גישה (TDMA)
    correct: 0
    explanation: ברשתות שיתופיות, מחשבים האזינו לכבל לפני השידור, ואם זיהו קפיצת מתח
      עקב התנגשות סימולטנית, עצרו והמתינו פרק זמן אקראי.
  - type: multiple_choice
    question: מה תפקידו של שדה ה-FCS (סדרת בדיקת מסגרת) המופיע בסיום כל מסגרת אתרנט?
    options:
    - לזהות שגיאות שידור באמצעות בדיקת יתירות מחזורית (CRC-32)
    - להצפין את תוכן המסגרת בהצפנת חומרה
    - לשמור את כתובת ה-IP של שער ברירת המחדל
    - להגדיר את עדיפות החבילה בתור המיתוג
    correct: 0
    explanation: כרטיס הרשת המקבל מחשב את קוד ה-CRC-32 של המסגרת ומשווה אותו ל-FCS;
      במידה שיש אי-התאמה, המסגרת סבלה משיבוש פיזי ונזרקת מיד.
  - type: multiple_choice
    question: איזו טבלה חומרתית בונה מתג רשת (Switch) באופן דינמי על ידי קריאת כתובות
      ה-MAC של החבילות הנכנסות?
    options:
    - טבלת CAM (זיכרון ממוען תוכן)
    - טבלת ניתוב BGP
    - טבלת אזורי DNS
    - מסד נתוני OSPF
    correct: 0
    explanation: המתג לומד איזו כתובת MAC מחוברת לאיזה שקע פיזי ושומר את המידע בטבלת
      CAM, המאפשרת ניתוב מהיר בחומרה ללא הצפת כל הפורטים.
  - type: multiple_choice
    question: איזה פרוטוקול מתרגם כתובת IP לוגית מוכרת לכתובת MAC חומרתית ברשת המקומית?
    options:
    - ARP (פרוטוקול פענוח כתובות)
    - DNS (מערכת שמות מתחם)
    - DHCP (פרוטוקול הקצאת כתובות דינמי)
    - BGP (פרוטוקול ניתוב בין-אוטונומי)
    correct: 0
    explanation: פרוטוקול ARP משדר שאלת Broadcast ברשת המקומית כדי לקבל בחזרה את כתובת
      ה-MAC הפיזית של המחשב בעל כתובת ה-IP המבוקשת.
  - type: multiple_choice
    question: מהו גודל ה-MTU התקני של נתוני מטען (Payload) הניתנים להעברה במסגרת אתרנט
      סטנדרטית?
    options:
    - 1500 בתים
    - 512 בתים
    - 4096 בתים
    - 64 בתים
    correct: 0
    explanation: ה-MTU התקני של אתרנט מוגדר כ-1500 בתים. חבילות IP הגדולות מגודל זה
      נדרשות לעבור פרגמנטציה (פיצול) על ידי שכבת הרשת.
  - type: multiple_choice
    question: איזה תקן של ארגון IEEE מגדיר תיוג רשתות וירטואליות (VLANs) באמצעות תוספת
      4 בתים לכותרת האתרנט?
    options:
    - IEEE 802.1Q
    - IEEE 802.11ac
    - IEEE 802.3u
    - IEEE 802.15.4
    correct: 0
    explanation: תקן IEEE 802.1Q מוסיף תגית VLAN המכילה מזהה בן 12 סיביות, המאפשר
      להפריד מתג פיזי לעד 4,094 רשתות וירטואליות מבודדות.
  - type: multiple_choice
    question: איזו מתקפת רשת מנצלת את היעדר האימות בפרוטוקול ARP כדי להטות את כל התעבורה
      המקומית דרך מחשב התוקף?
    options:
    - הרעלת ARP (ARP Poisoning / Spoofing)
    - מתקפת הצפת SYN
    - הגברת DNS
    - הזרקת SQL
    correct: 0
    explanation: התוקף משדר תשובות ARP מזויפות הקושרות את כתובת ה-MAC שלו לכתובת ה-IP
      של הנתב, ובכך מבצע מתקפת 'אדם באמצע' (Man-in-the-Middle).
  - type: multiple_choice
    question: מהי מטרת שדה ה-Preamble בן 8 הבתים המשודר בראש כל מסגרת אתרנט?
    options:
    - לסנכרן את תדרי שעון החומרה בין המשדר למקלט
    - לשמור את גרסת מערכת ההפעלה של השולח
    - לאמת את חתימת האבטחה הדיגיטלית של יצרן הכרטיס
    - לנהל את תור עדיפויות הניתוב במתג
    correct: 0
    explanation: ה-Preamble מורכב מסדרה מתחלפת של סיביות 1 ו-0 המאפשרת למעגלים האלקטרוניים
      של המקלט להינעל על מהירות השעון של האות הנכנס.
  - type: multiple_choice
    question: איזו כתובת MAC מיוחדת משמשת לשידור Broadcast המיועד לכלל המחשבים ברשת
      המקומית?
    options:
    - FF:FF:FF:FF:FF:FF
    - 00:00:00:00:00:00
    - 127.0.0.1
    - FE80::1
    correct: 0
    explanation: מסגרת הממוענת ל-FF:FF:FF:FF:FF:FF (שבה כל 48 הסיביות הן 1) מועברת
      על ידי המתג לכל הפורטים הפעילים באותו מתחם שידור.
  - type: multiple_choice
    question: איזה רכיב רשת פועל בשכבה 1 (הפיזית) בלבד ומשכפל אותות חשמליים בעיוורון
      לכל היציאות ללא הבנת מסגרות?
    options:
    - רכזת (Hub)
    - מתג (Switch)
    - נתב (Router)
    - חומת אש (Firewall)
    correct: 0
    explanation: רכזת (Hub) פועלת כמשחזר אות חשמלי טהור ללא הבנת כתובות MAC, ולכן
      כל המחשבים המחוברים אליה חולקים את אותו מתחם התנגשות.
  - type: multiple_choice
    question: איזו שיטת אפנון מקודדת סיביות מרובות בכל מחזור גל על ידי שינוי סימולטני
      של משרעת ומופע הגל הנושא?
    options:
    - QAM (אפנון משרעת בריבוע)
    - FSK (אפנון הזזת תדר)
    - BPSK (אפנון הזזת מופע בינארי)
    - AM (אפנון משרעת פשוט)
    correct: 0
    explanation: טכנולוגיות כגון Wi-Fi 6 משתמשות ב-1024-QAM כדי לקודד 10 סיביות בכל
      סמל שידור בודד באמצעות שילוב מתוחכם של משרעת ופאזה.
  - type: multiple_choice
    question: איזה פרוטוקול רשת מונע לולאות מסוכנות והצפות שידור קטסטרופליות (Broadcast
      Storms) ברשתות מתגים?
    options:
    - פרוטוקול עץ פורש (STP - Spanning Tree Protocol)
    - פרוטוקול BGP
    - פרוטוקול OSPF
    - פרוטוקול RIP
    correct: 0
    explanation: פרוטוקול STP (תקן IEEE 802.1D) מזהה לולאות פיזיות במבנה המתגים וחוסם
      זמנית קווי תקשורת עודפים כדי למנוע לולאות שידור מעגליות.
- id: network_layer_ip_routing
  title: '2. שכבת הרשת: כתובות IP וניתוב חבילות'
  description: כתובות לוגיות היררכיות, חלוקת תתי-רשתות ב-CIDR, מניעת לולאות באמצעות
    TTL ופרוטוקולי ניתוב גלובליים (OSPF ו-BGP).
  cards:
  - id: ipv4_ipv6_subnetting_cidr
    title: 'כתובות IP: חלוקת תתי-רשתות ב-CIDR ומצוקת הכתובות'
    figure:
      title: פירוק כתובת IPv4 לתחילית רשת ומזהה מארח ב-CIDR
      svg: "<svg viewBox=\"0 0 500 130\" xmlns=\"http://www.w3.org/2000/svg\" style=\"\
        width:100%;max-height:130px;\">\n  <rect x=\"20\" y=\"40\" width=\"300\" height=\"\
        50\" rx=\"6\" fill=\"#3b82f6\" fill-opacity=\"0.15\" stroke=\"#3b82f6\" stroke-width=\"\
        2\"/>\n  <text x=\"170\" y=\"65\" font-size=\"12\" font-weight=\"bold\" fill=\"\
        #3b82f6\" text-anchor=\"middle\">תחילית רשת (/24)</text>\n  <text x=\"170\"\
        \ y=\"80\" font-size=\"9\" fill=\"currentColor\" opacity=\"0.8\" text-anchor=\"\
        middle\">24 סיביות (192.168.1.0)</text>\n  <rect x=\"325\" y=\"40\" width=\"\
        155\" height=\"50\" rx=\"6\" fill=\"#10b981\" fill-opacity=\"0.15\" stroke=\"\
        #10b981\" stroke-width=\"2\"/>\n  <text x=\"402\" y=\"65\" font-size=\"12\"\
        \ font-weight=\"bold\" fill=\"#10b981\" text-anchor=\"middle\">מזהה מחשב (Host)</text>\n\
        \  <text x=\"402\" y=\"80\" font-size=\"9\" fill=\"currentColor\" opacity=\"\
        0.8\" text-anchor=\"middle\">8 סיביות (254 מחשבים זמינים)</text>\n  <line\
        \ x1=\"20\" y1=\"105\" x2=\"480\" y2=\"105\" stroke=\"currentColor\" stroke-width=\"\
        1.5\" stroke-dasharray=\"4,4\" opacity=\"0.4\"/>\n  <text x=\"250\" y=\"122\"\
        \ font-size=\"10\" fill=\"currentColor\" opacity=\"0.8\" text-anchor=\"middle\"\
        >מרחב הכתובות הכולל = 32 סיביות (4,294,967,296 כתובות)</text>\n</svg>"
      caption: שיטת CIDR מגדירה תחילית סיביות (Prefix) כדי לחלק כתובת IPv4 בת 32 סיביות
        בין כתובת הרשת הכללית לבין כתובת המחשב המקומי.
    points:
    - פרוטוקול IPv4 מקצה כתובות בנות 32 סיביות ($2^{32} \approx 4.29\text{ מיליארד}$
      כתובות), המוצגות בארבעה מספרים עשרוניים (למשל 172.217.16.206). שיטת ה-CIDR (כגון
      /24) מגדירה כמה סיביות משמשות כמזהה הרשת, וכמה סיביות נותרות להקצאת כתובות מחשבים
      מקומיים.
    - כדי להתמודד עם דלדול מאגר כתובות ה-IPv4 בעולם, פותח מנגנון ה-NAT (תרגום כתובות
      רשת). NAT מאפשר לאלפי מחשבים ברשת פנימית פרטית (תקן RFC 1918, כגון 10.0.0.0/8
      או 192.168.0.0/16) לחלוק כתובת IP ציבורית אחת באינטרנט על ידי מעקב אחרי מספרי
      פורטים בשכבה 4.
    - פרוטוקול IPv6 פותר את בעיית הכתובות לעד באמצעות כתובות ענק בנות 128 סיביות ($2^{128}
      \approx 3.4 \times 10^{38}$ כתובות), המוצגות ב-8 קבוצות הקסדצימליות, ומייתר
      את הצורך ב-NAT תוך תמיכה מובנית בהגדרה עצמית אוטונומית (SLAAC).
    - 'נתבים מקבלים החלטות העברה לפי עקרון ההתאמה הארוכה ביותר (Longest Prefix Match):
      מבין מספר שורות מתאימות בטבלת הניתוב, הנתב בוחר תמיד במסלול בעל מסיכת הרשת הספציפית
      והארוכה ביותר.'
  - id: packet_structure_ttl_fragmentation
    title: מבנה חבילת IP, מנגנון TTL וגילוי גודל חבילה מקסימלי
    points:
    - כותרת חבילת IPv4 אורכת 20 בתים בסיסיים, וכוללת גרסה, אורך כותרת, אורך כולל,
      מזהה חבילה, דגלי פיצול (Flags), מונה זמן חיים (TTL), פרוטוקול שכבה 4, סיכום
      ביקורת (Checksum) וכתובות מקור ויעד.
    - שדה ה-TTL (Time to Live) נועד למנוע מחבילות להסתובב לנצח בלולאות ניתוב שגויות.
      כל נתב שמנתב את החבילה מפחית את ערך ה-TTL ב-1; כאשר ה-TTL מגיע ל-0, הנתב משליך
      את החבילה ושולח הודעת שגיאה מסוג ICMP Time Exceeded בחזרה לשולח.
    - 'כלי האבחון הפופולרי `traceroute` מנצל תכונה זו בדיוק: הוא משדר חבילות עם TTL
      עולה בהדרגה (TTL=1, 2, 3...) כדי לקבל הודעת ICMP מכל נתב בדרך ולמפות את התחנות
      הגיאוגרפיות באינטרנט.'
    - כאשר חבילה גדולה מגודל ה-MTU של קישור מסוים ומוגדר בה דגל 'אל תפצל' (DF), הנתב
      משליך אותה ומחזיר הודעת ICMP. מנגנון PMTUD משתמש בהודעות אלו כדי לחשב דינמית
      את גודל החבילה המקסימלי לכל אורך הדרך ללא פיצולים.
  - id: routing_protocols_bgp_ospf
    title: 'ניתוב פנים-ארגוני מול ניתוב גלובלי: OSPF ו-BGP'
    figure:
      title: מערכות אוטונומיות (AS) וחיבור BGP גלובלי
      svg: "<svg viewBox=\"0 0 500 130\" xmlns=\"http://www.w3.org/2000/svg\" style=\"\
        width:100%;max-height:130px;\">\n  <circle cx=\"100\" cy=\"65\" r=\"45\" fill=\"\
        #3b82f6\" fill-opacity=\"0.15\" stroke=\"#3b82f6\" stroke-width=\"2\"/>\n\
        \  <text x=\"100\" y=\"62\" font-size=\"11\" font-weight=\"bold\" fill=\"\
        #3b82f6\" text-anchor=\"middle\">AS 15169</text>\n  <text x=\"100\" y=\"76\"\
        \ font-size=\"9\" fill=\"currentColor\" text-anchor=\"middle\">(גוגל)</text>\n\
        \  <circle cx=\"400\" cy=\"65\" r=\"45\" fill=\"#10b981\" fill-opacity=\"\
        0.15\" stroke=\"#10b981\" stroke-width=\"2\"/>\n  <text x=\"400\" y=\"62\"\
        \ font-size=\"11\" font-weight=\"bold\" fill=\"#10b981\" text-anchor=\"middle\"\
        >AS 13335</text>\n  <text x=\"400\" y=\"76\" font-size=\"9\" fill=\"currentColor\"\
        \ text-anchor=\"middle\">(קלאודפלייר)</text>\n  <path d=\"M 148 65 L 352 65\"\
        \ stroke=\"#ec4899\" stroke-width=\"2.5\" stroke-dasharray=\"6,4\"/>\n  <text\
        \ x=\"250\" y=\"55\" font-size=\"11\" font-weight=\"bold\" fill=\"#ec4899\"\
        \ text-anchor=\"middle\">חיבור BGP בין רשתות (Peering)</text>\n  <text x=\"\
        250\" y=\"75\" font-size=\"9\" fill=\"currentColor\" opacity=\"0.8\" text-anchor=\"\
        middle\">פורט TCP 179 (וקטור מסלול)</text>\n  <text x=\"100\" y=\"122\" font-size=\"\
        9\" fill=\"currentColor\" opacity=\"0.8\" text-anchor=\"middle\">פרוטוקול\
        \ פנימי: OSPF</text>\n  <text x=\"400\" y=\"122\" font-size=\"9\" fill=\"\
        currentColor\" opacity=\"0.8\" text-anchor=\"middle\">פרוטוקול פנימי: IS-IS</text>\n\
        </svg>"
      caption: רשת האינטרנט מורכבת מאלפי מערכות אוטונומיות (AS) המחליפות נתיבי תעבורה
        ביניהן באמצעות פרוטוקול BGP.
    points:
    - רשת האינטרנט הגלובלית מחולקת לעשרות אלפי רשתות עצמאיות המכונות מערכות אוטונומיות
      (Autonomous Systems - AS), כגון ספקיות אינטרנט, אוניברסיטאות וענקיות טכנולוגיה,
      שלכל אחת מהן מזהה ייחודי (ASN).
    - בתוך ארגון או חוות שרתים, פרוטוקולי ניתוב פנימיים (IGP) כגון OSPF מפיצים נתוני
      מצב-קו (Link-State), ומאפשרים לכל נתב להריץ את אלגוריתם דייקסטרה למציאת המסלול
      הקצר ביותר ברשת המקומית.
    - בין מערכות אוטונומיות שונות ברחבי העולם, פרוטוקול BGP-4 משמש כדבק שמחבר את כדור
      הארץ. BGP הוא פרוטוקול וקטור-מסלול (Path-Vector) הפועל מעל חיבורי TCP יציבים
      (פורט 179) ומחליף רשימות של מערכות אוטונומיות (AS-PATH) למניעת לולאות.
    - החלטות ניתוב ב-BGP אינן נקבעות רק לפי מהירות פיזית, אלא מוכתבות על פי הסכמי
      סחר, הסכמי Peering עסקיים ומדיניות גיאופוליטית בין ספקיות תקשורת.
  trivia:
  - type: multiple_choice
    question: כמה כתובות IP ייחודיות אפשריות מבחינה מתמטית במרחב הכתובות של פרוטוקול
      IPv4 בן 32 הסיביות?
    options:
    - כ-4.29 מיליארד כתובות ($2^{32}$)
    - כ-18.4 קווינטיליון כתובות ($2^{64}$)
    - כ-1 טריליון כתובות
    - כ-340 אנדציליון כתובות ($2^{128}$)
    correct: 0
    explanation: השימוש במספר שלם בן 32 סיביות מאפשר תיאורטית $2^{32} = 4,294,967,296$
      כתובות IPv4 בלבד.
  - type: multiple_choice
    question: מהו תפקידו המרכזי של שדה ה-TTL (זמן חיים) בכותרת חבילת IPv4?
    options:
    - למנוע מחבילות להסתובב לנצח בלולאות ניתוב שגויות בין נתבים
    - לתעד את השעה המדויקת שבה נוצרה החבילה במחשב השולח
    - להגדיר את משך הזמן שבו מוצפן חיבור ה-TLS
    - למדוד את הטמפרטורה הפיזית של מעבדי הנתבים בדרך
    correct: 0
    explanation: כל נתב שמנתב את החבילה מפחית את ערך ה-TTL ב-1; בהגיעו לאפס החבילה
      מושלכת, ובכך נמנעת הצפת לולאות מעגליות.
  - type: multiple_choice
    question: כמה כתובות מחשבים (Hosts) זמינות בפועל להקצאה בתת-רשת בעלת מסיכת CIDR
      מסוג /24 (כגון 192.168.1.0/24)?
    options:
    - 254 כתובות מחשבים
    - 256 כתובות מחשבים
    - 128 כתובות מחשבים
    - 512 כתובות מחשבים
    correct: 0
    explanation: ברשת /24 נותרות 8 סיביות למארחים ($2^8 = 256$). הפחתת כתובת הרשת
      (.0) וכתובת השידור Broadcast (.255) מותירה 254 כתובות שמישות.
  - type: multiple_choice
    question: איזה תקן רשת (RFC) מגדיר את טווחי כתובות ה-IP הפרטיות (כמו 10.0.0.0/8
      ו-192.168.0.0/16) שאינן מנותבות באינטרנט הציבורי?
    options:
    - RFC 1918
    - RFC 791
    - RFC 2616
    - RFC 1035
    correct: 0
    explanation: תקן RFC 1918 הגדיר את בלוקי הכתובות הפנימיים המיועדים לרשתות ביתיות
      וארגוניות המשתמשות ב-NAT כדי לצאת לאינטרנט.
  - type: multiple_choice
    question: איזה כלי אבחון רשת משדר חבילות עם ערכי TTL עולים בהדרגה כדי לחשוף את
      כל הנתבים בתחנות המעבר?
    options:
    - traceroute
    - ping
    - netstat
    - nslookup
    correct: 0
    explanation: הכלי `traceroute` מנצל את הודעות השגיאה של ICMP המוחזרות מכל נתב
      שה-TTL מתאפס בו, כדי למפות את נתיב התעבורה.
  - type: multiple_choice
    question: איזה עקרון הכרעה מנחה נתבי IP בבחירת הנתיב המועדף מתוך מספר שורות מתאימות
      בטבלת הניתוב?
    options:
    - ההתאמה הארוכה ביותר (Longest Prefix Match)
    - חלוקת עומס מעגלית (Round Robin)
    - הראשון שנכנס ראשון שיוצא (FIFO)
    - מספר הרשת הקטן ביותר
    correct: 0
    explanation: הנתב בוחר תמיד בשורת הניתוב הספציפית ביותר, כלומר זו שבה מספר סיביות
      מסיכת הרשת הוא הגדול והמדויק ביותר (כגון /28 מול /24).
  - type: multiple_choice
    question: איזה פרוטוקול ניתוב חיצוני מנהל את החלפת נתיבי התעבורה בין מערכות אוטונומיות
      (AS) שונות באינטרנט העולמי?
    options:
    - BGP (פרוטוקול ניתוב גבול)
    - OSPF (המסלול הקצר ביותר תחילה)
    - RIP (פרוטוקול מידע ניתוב)
    - IS-IS
    correct: 0
    explanation: פרוטוקול BGP-4 מחבר בין אלפי ספקיות אינטרנט וענקיות ענן ברחבי תבל
      ומנהל את הניתוב הבין-רשתי העולמי.
  - type: multiple_choice
    question: איזה אלגוריתם תורת הגרפים מריץ פרוטוקול OSPF כדי לחשב את נתיבי התעבורה
      הקצרים ביותר ללא לולאות בארגון?
    options:
    - אלגוריתם דייקסטרה (Dijkstra)
    - אלגוריתם בלמן-פורד
    - אלגוריתם פלויד-וורשאל
    - אלגוריתם חיפוש *A
    correct: 0
    explanation: כל נתב ב-OSPF מחזיק מפה מלאה של קישורי הרשת ומריץ את אלגוריתם דייקסטרה
      כדי לחשב את עץ המסלולים המהיר ביותר.
  - type: multiple_choice
    question: באיזה פרוטוקול שכבת תעבורה ובאיזה מספר פורט משתמש BGP כדי לקיים שיחות
      תקשורת יציבות בין נתבים?
    options:
    - פרוטוקול TCP בפורט 179
    - פרוטוקול UDP בפורט 53
    - פרוטוקול TCP בפורט 80
    - פרוטוקול ICMP מספר 1
    correct: 0
    explanation: פרוטוקול BGP מתבסס על אמינותו של חיבור TCP בפורט 179 כדי להבטיח שעדכוני
      ניתוב ומדיניות יועברו ללא שיבושים.
  - type: multiple_choice
    question: כמה סיביות בסך הכל מרכיבות כתובת רשת מודרנית לפי תקן IPv6?
    options:
    - 128 סיביות
    - 32 סיביות
    - 64 סיביות
    - 256 סיביות
    correct: 0
    explanation: כתובת IPv6 מכילה 128 סיביות (16 בתים), מה שמספק מרחב של $3.4 \times
      10^{38}$ כתובות ומבטל את בעיית המחסור בכתובות לעד.
  - type: multiple_choice
    question: איזה מנגנון מגלה באופן דינמי את גודל ה-MTU המקסימלי שניתן לשלוח לאורך
      נתיב אינטרנט שלם ללא צורך בפיצול (Fragmentation)?
    options:
    - Path MTU Discovery (PMTUD)
    - Address Resolution Protocol (ARP)
    - Dynamic Host Configuration Protocol (DHCP)
    - Fast Retransmit
    correct: 0
    explanation: מנגנון PMTUD שולח חבילות עם דגל DF; אם נתב בדרך אינו מסוגל להעביר
      את החבילה בשל גודלה, הוא מחזיר הודעת ICMP המציינת את ה-MTU שלו.
  - type: multiple_choice
    question: איזה מאפיין בפרוטוקול BGP מפרט את רשימת כל המערכות האוטונומיות שעברה
      החבילה, ומשמש למניעת לולאות ניתוב עולמיות?
    options:
    - AS-PATH
    - MULTI-EXIT-DISC (MED)
    - LOCAL-PREF
    - COMMUNITY
    correct: 0
    explanation: אם נתב BGP מזהה את מספר ה-AS של עצמו בתוך רשימת ה-AS-PATH של הודעה
      נכנסת, הוא יודע שנוצרה לולאה ודוחה את הנתיב מיד.
  - type: multiple_choice
    question: איזו כתובת IP מיוחדת משמשת כממשק לולאה פנימי (Loopback) המאפשר לתוכנה
      לתקשר עם שירותים על גבי אותו מחשב מקומי?
    options:
    - '127.0.0.1 (או 1:: ב-IPv6)'
    - 192.168.1.1
    - 255.255.255.255
    - 10.0.0.1
    correct: 0
    explanation: כתובת 127.0.0.1 (המכונה localhost) מופנית ישירות למחסנית הרשת הפנימית
      של מערכת ההפעלה ואינה יוצאת החוצה לכבל הרשת.
  - type: multiple_choice
    question: איזה מנגנון מאפשר למחשב ברשת IPv6 להגדיר לעצמו כתובת גלובלית תקינה באופן
      עצמאי ללא צורך בשרת DHCP ייעודי?
    options:
    - SLAAC (הגדרה עצמית נטולת מצב)
    - NAPT (תרגום מספרי פורטים)
    - BGP Anycast
    - ניתוב סטטי
    correct: 0
    explanation: מנגנון SLAAC מאפשר למחשב להאזין להודעות הנתב המקומי (Router Advertisement)
      כדי לקבל את תחילית הרשת ולשלב בה מזהה מקומי.
  - type: multiple_choice
    question: מהו גודל כותרת הבסיס התקנית של חבילת IPv4 ללא תוספות אופציונליות?
    options:
    - 20 בתים
    - 40 בתים
    - 14 בתים
    - 8 בתים
    correct: 0
    explanation: כותרת IPv4 בסיסית תופסת 20 בתים בזיכרון, בעוד שכותרת IPv6 עוצבה מחדש
      בגודל אחיד ויעיל של 40 בתים.
- id: transport_layer_tcp_udp
  title: '3. שכבת התעבורה: אמינות של TCP ומהירות של UDP'
  description: ריבוי פורטים, לחיצת היד המשולשת של TCP, בקרת זרימה בחלון מחליק, מניעת
    עומסים ברשת ופרוטוקול UDP נטול המצב.
  cards:
  - id: tcp_three_way_handshake_state_machine
    title: 'מחזור חיי חיבור TCP: לחיצת היד ומצב TIME_WAIT'
    figure:
      title: לחיצת היד המשולשת ליצירת חיבור TCP (3-Way Handshake)
      svg: "<svg viewBox=\"0 0 500 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"\
        width:100%;max-height:140px;\">\n  <line x1=\"100\" y1=\"20\" x2=\"100\" y2=\"\
        130\" stroke=\"#3b82f6\" stroke-width=\"2\"/>\n  <text x=\"100\" y=\"15\"\
        \ font-size=\"11\" font-weight=\"bold\" fill=\"#3b82f6\" text-anchor=\"middle\"\
        >לקוח (Client)</text>\n  <line x1=\"400\" y1=\"20\" x2=\"400\" y2=\"130\"\
        \ stroke=\"#10b981\" stroke-width=\"2\"/>\n  <text x=\"400\" y=\"15\" font-size=\"\
        11\" font-weight=\"bold\" fill=\"#10b981\" text-anchor=\"middle\">שרת (Server)</text>\n\
        \  <path d=\"M 100 35 L 395 55\" stroke=\"#3b82f6\" stroke-width=\"2\" marker-end=\"\
        url(#arr)\"/>\n  <text x=\"250\" y=\"40\" font-size=\"10\" fill=\"#3b82f6\"\
        \ text-anchor=\"middle\">1. הודעת סנכרון SYN (seq=x)</text>\n  <path d=\"\
        M 400 65 L 105 85\" stroke=\"#10b981\" stroke-width=\"2\"/>\n  <text x=\"\
        250\" y=\"70\" font-size=\"10\" fill=\"#10b981\" text-anchor=\"middle\">2.\
        \ מענה משולב SYN-ACK (seq=y, ack=x+1)</text>\n  <path d=\"M 100 95 L 395 115\"\
        \ stroke=\"#8b5cf6\" stroke-width=\"2\"/>\n  <text x=\"250\" y=\"100\" font-size=\"\
        10\" fill=\"#8b5cf6\" text-anchor=\"middle\">3. אישור קבלה סופי ACK (ack=y+1)</text>\n\
        </svg>"
      caption: פרוטוקול TCP יוצר ערוץ בתים דו-כיווני אמין באמצעות לחיצת יד משולשת
        המסנכרנת מספרי סידרה (ISN) ראשוניים.
    points:
    - פרוטוקול ה-TCP מספק הפשטה של זרם בתים רציף, דו-כיווני, מסודר ואמין מעל גבי שכבת
      IP פיזית שעלולה להשמיט, לעכב או לשבש חבילות.
    - 'יצירת החיבור מתבצעת באמצעות לחיצת היד המשולשת (3-Way Handshake): (1) הלקוח
      שולח בקשת SYN עם מספר סידורי אקראי $x$, (2) השרת משיב ב-SYN-ACK עם מספר סידורי
      משלו $y$ ואישור $x+1$, (3) הלקוח משיב ב-ACK עם אישור $y+1$. כעת שני הצדדים מסונכרנים
      לחלוטין.'
    - 'סגירת החיבור נעשית בלחיצת יד מרובעת באמצעות דגלי FIN ו-ACK: כל קצה סוגר בנפרד
      את כיוון השידור שלו, וממשיך להאזין עד שהצד השני מסיים לשדר.'
    - הצד שיזם את הסגירה נכנס למצב השהיה מיוחד בשם `TIME_WAIT` למשך $2 \times \text{MSL}$
      (בדרך כלל 60 עד 120 שניות), כדי להבטיח שחבילות תועות שהתעכבו ברשת לא ישבשו חיבור
      עתידי חדש שישתמש באותם פורטים.
  - id: flow_control_congestion_control
    title: 'בקרת זרימה מול בקרת עומס: אלגוריתמי AIMD ו-BBR'
    figure:
      title: פרופיל שן-מסור של חלון העומס ב-TCP (cwnd)
      svg: "<svg viewBox=\"0 0 500 130\" xmlns=\"http://www.w3.org/2000/svg\" style=\"\
        width:100%;max-height:130px;\">\n  <line x1=\"40\" y1=\"105\" x2=\"480\" y2=\"\
        105\" stroke=\"currentColor\" stroke-width=\"1.5\" opacity=\"0.4\"/>\n  <line\
        \ x1=\"40\" y1=\"15\" x2=\"40\" y2=\"105\" stroke=\"currentColor\" stroke-width=\"\
        1.5\" opacity=\"0.4\"/>\n  <path d=\"M 40 105 Q 80 100, 110 50 L 170 25 L\
        \ 170 65 L 250 25 L 250 65 L 330 25 L 330 65 L 410 25 L 410 65 L 470 35\"\
        \ fill=\"none\" stroke=\"#6366f1\" stroke-width=\"2.5\"/>\n  <text x=\"75\"\
        \ y=\"80\" font-size=\"9\" fill=\"#6366f1\">התחלה אטית (הכפלה)</text>\n  <text\
        \ x=\"210\" y=\"18\" font-size=\"9\" fill=\"#6366f1\">גידול לינארי (תוספתי)</text>\n\
        \  <text x=\"250\" y=\"80\" font-size=\"9\" fill=\"#ef4444\">חיתוך במחצית\
        \ (איבוד חבילה)</text>\n  <text x=\"470\" y=\"120\" font-size=\"9\" fill=\"\
        currentColor\" text-anchor=\"end\">זמן</text>\n  <text x=\"35\" y=\"20\" font-size=\"\
        9\" fill=\"currentColor\">cwnd</text>\n</svg>"
      caption: בקרת עומס ב-TCP מגדילה את חלון השידור מעריכית בהתחלה, ולאחר מכן לינארית
        עד שאיבוד חבילה חותך את החלון בחצי.
    points:
    - 'בקרת זרימה (Flow Control) מגינה על זיכרון המקלט: המקלט מדווח בכל אישור ACK
      על גודל החוצץ הפנוי שלו באמצעות שדה חלון הקבלה (`rwnd`). השולח לעולם לא ישדר
      נתונים מעבר לקיבולת חלון זה.'
    - 'בקרת עומס (Congestion Control) מגינה על נתבי הרשת המשותפים: השולח מנהל חלון
      עומס (`cwnd`) דינמי, וגודל חלון השידור בפועל נקבע תמיד לפי המגבלה המחמירה ביותר:
      $\text{Window} = \min(\text{rwnd}, \text{cwnd})$.'
    - 'אלגוריתמים קלאסיים (TCP Reno) פועלים לפי מודל AIMD: כאשר חבילות מאושרות כהלכה,
      חלון השידור גדל לינארית בכל סבב; כאשר מזוהה איבוד חבילה ברשת, חלון השידור נחתך
      מיד ב-50%.'
    - אלגוריתם מודרני מבית גוגל בשם BBR אינו מסתמך על השמטת חבילות כאינדיקציה לעומס,
      אלא מודד ישירות את רוחב הפס הממשי של הצינור ואת זמן הלוך-חזור המינימלי (RTT)
      כדי למנוע יצירת תורי ענק בנתבים (Bufferbloat).
  - id: udp_vs_tcp_multiplexing
    title: פרוטוקול UDP, ריבוי פורטים ותופעת חסימת ראש התור
    points:
    - 'פרוטוקול UDP הוא פרוטוקול תעבורה נטול חיבור ורזה במיוחד, בעל כותרת בסיסית בת
      8 בתים בלבד: פורט מקור, פורט יעד, אורך החבילה ובדיקת סיכום (Checksum).'
    - 'UDP אינו מספק שום התחייבות: חבילות עשויות להגיע ללא סדר, להשתכפל או ללכת לאיבוד
      ללא שידור חוזר. עובדה זו הופכת אותו לאידיאלי עבור משימות זמן-אמת שבהן השיהוי
      הנמוך חשוב מכל חבילה בודדת (שיחות קול, וידאו, משחקי רשת ושאילתות DNS).'
    - 'שני הפרוטוקולים מאפשרים ריבוי פורטים (Port Multiplexing): פורטים בני 16 סיביות
      (0 עד 65535) מנתבים מידע לתהליכי תוכנה ספציפיים במערכת ההפעלה, כאשר חיבור מוגדר
      חד-חד-ערכית על ידי 5 מאפיינים: (IP מקור, פורט מקור, IP יעד, פורט יעד, פרוטוקול).'
    - 'החיסרון הארכיטקטוני המובנה ב-TCP הוא חסימת ראש התור (Head-of-Line Blocking):
      מכיוון ש-TCP מתחייב למסור מידע בסדר מדויק, אם חבילה מס׳ 2 אובדת, חבילות 3, 4
      ו-5 נאלצות להמתין בחוצץ הליבה ואינן נמסרות לאפליקציה עד שחבילה 2 תשודר שוב ותאושר.'
  trivia:
  - type: multiple_choice
    question: אילו שלוש הודעות מוחלפות בין לקוח לשרת כדי ליצור חיבור TCP תקין ומסונכרן
      (3-Way Handshake)?
    options:
    - הודעת SYN, הודעת SYN-ACK והודעת ACK
    - הודעת PING, הודעת PONG והודעת ACK
    - הודעת HELO, הודעת EHLO והודעת READY
    - הודעת REQUEST, הודעת CHALLENGE והודעת RESPONSE
    correct: 0
    explanation: הלקוח פותח ב-SYN, השרת משיב ב-SYN-ACK עם מספר סידורי משלו, והלקוח
      מאשר ב-ACK לסיום יצירת החיבור.
  - type: multiple_choice
    question: מדוע נכנס קצה החיבור שיזם ניתוק TCP למצב המתנה מיוחד (TIME_WAIT) למשך
      פעמיים MSL?
    options:
    - כדי להבטיח שחבילות תועות שהתעכבו ברשת יגוועו ולא ישבשו חיבור חדש שישתמש באותם
      הפורטים
    - כדי לאפשר למעבד כרטיס הרשת להתקרר מטמפרטורת עבודה גבוהה
    - כדי להמתין לעדכון רשומות ה-TTL בשרתי ה-DNS
    - כדי לחשב מחדש את סיכום הביקורת CRC-32 של הקבצים שהורדו
    correct: 0
    explanation: מצב ההמתנה מונע מצב שבו חבילות כפולות ששודרו בחיבור הישן יגיעו באיחור
      וייקראו בטעות לתוך חיבור חדש עם אותם פורטים.
  - type: multiple_choice
    question: מהו ההבדל המהותי בין בקרת זרימה (Flow Control) לבקרת עומס (Congestion
      Control) ב-TCP?
    options:
    - בקרת זרימה מגנה על חוצץ הזיכרון של מחשב היעד; בקרת עומס מגנה על נתבי הרשת המשותפים
    - בקרת זרימה מנהלת הצפנת חבילות; בקרת עומס מנהלת ניתוב כתובות IP
    - בקרת זרימה פועלת בסיבים אופטיים בלבד; בקרת עומס פועלת בכבלי נחושת
    - בקרת זרימה פועלת בשכבה 2; בקרת עומס פועלת בשכבה 7
    correct: 0
    explanation: בקרת זרימה מוודאת שהשולח אינו מציף את המקלט המקומי מעבר לחלון `rwnd`,
      ואילו בקרת עומס מונעת קריסת תורים בנתבי האינטרנט.
  - type: multiple_choice
    question: מהו גודל הכותרת המינימלי והרזה של חבילת פרוטוקול UDP?
    options:
    - 8 בתים
    - 20 בתים
    - 40 בתים
    - 14 בתים
    correct: 0
    explanation: כותרת UDP מכילה 4 שדות של 2 בתים בלבד (פורט מקור, פורט יעד, אורך
      ובדיקת סיכום), ובסך הכל 8 בתים.
  - type: multiple_choice
    question: איזה מנגנון ב-TCP יוזם שידור חוזר מיידי של חבילה שאבדה בעקבות קבלת 3
      אישורי ACK כפולים מבלי להמתין לטיימר?
    options:
    - שידור חוזר מהיר (Fast Retransmit)
    - התחלה אטית (Slow Start)
    - אלגוריתם נייגל (Nagle)
    - גילוי גודל חבילה מקסימלי (PMTUD)
    correct: 0
    explanation: קבלת 3 אישורים כפולים (Duplicate ACKs) מעידה בבירור שחבילה ספציפית
      חסרה, והשולח מבצע מיד Fast Retransmit.
  - type: multiple_choice
    question: איזה חוק התנהגות מתמטי מכתיב את גידול וצמצום חלון העומס באלגוריתם TCP
      Reno הקלאסי?
    options:
    - AIMD (גידול תוספתי וצמצום במכפלה)
    - MIMD (גידול מעריכי וצמצום מעריכי)
    - איזון תורים במודל FIFO
    - דעיכה אקספוננציאלית
    correct: 0
    explanation: במודל AIMD, החלון גדל ב-1 MSS בכל זמן סבב (תוספתי), אך נחתך במחצית
      (במכפלה) ברגע שחבילה הולכת לאיבוד.
  - type: multiple_choice
    question: כיצד מכונה התופעה שבה נתבים מנהלים חוצצי זיכרון מנופחים המובילים להשהיות
      ענק ברשת ללא איבוד חבילות?
    options:
    - Bufferbloat (התנפחות חוצצים)
    - קפיצת ריצוד (Jitter)
    - שכפול חבילות
    - הצפת SYN
    correct: 0
    explanation: חוצצי ענק בנתבים מונעים השמטת חבילות אך גורמים לעיכובי תור של שניות
      ארוכות, הפוגעים קשות בביצועי זמן-אמת.
  - type: multiple_choice
    question: איזו בעיה מבנית בפרוטוקול TCP גורמת לכך שחבילה אחת שנפלה מעכבת את מסירת
      כל החבילות הבאות שכבר הגיעו ליישום?
    options:
    - חסימת ראש התור (Head-of-Line Blocking)
    - חור שחור בניתוב
    - סערת שידור מקומית
    - הרעלת מטמון ARP
    correct: 0
    explanation: מכיוון ש-TCP מתחייב למסור זרם בתים מסודר לפי הסדר, חבילה חסרה מונעת
      שחרור של כל החבילות הבאות מהחוצץ.
  - type: multiple_choice
    question: איזה אלגוריתם בקרת עומס מודרני מבית גוגל מודד ישירות את רוחב הפס הממשי
      וזמן ה-RTT במקום להסתמך על איבוד חבילות?
    options:
    - BBR (Bottleneck Bandwidth and RTT)
    - TCP Reno
    - TCP Tahoe
    - Cubic
    correct: 0
    explanation: אלגוריתם BBR מונע Bufferbloat בכך שהוא מודד את צוואר הבקבוק הפיזי
      של הרשת ואינו מציף את תורי הנתבים.
  - type: multiple_choice
    question: כמה סיביות משמשות לייצוג מספר פורט ב-TCP או UDP, מה שקובע את מספר הפורטים
      המקסימלי ל-65,535?
    options:
    - 16 סיביות
    - 8 סיביות
    - 32 סיביות
    - 24 סיביות
    correct: 0
    explanation: מספרי פורטים הם ערכים שלמים חיוביים בני 16 סיביות ($2^{16} = 65,536$),
      ונפרסים מפורט 0 ועד 65535.
  - type: multiple_choice
    question: איזה דגל TCP משודר כדי לנתק חיבור באופן מיידי ובכפייה ללא תהליך סגירה
      מסודר?
    options:
    - דגל RST (איפוס)
    - דגל FIN (סיום)
    - דגל URG (דחוף)
    - דגל PSH (דחיפה)
    correct: 0
    explanation: דגל RST מורה על הפסקת החיבור מיד, למשל כאשר מתקבלת חבילה עבור פורט
      שאין בו שום שרת שמאזין.
  - type: multiple_choice
    question: איזה אלגוריתם מאחד חבילות נתונים קטנות למסגרת TCP גדולה אחת כדי למנוע
      הצפת הרשת בהודעות זעירות?
    options:
    - אלגוריתם נייגל (Nagle)
    - אלגוריתם דייקסטרה
    - אלגוריתם קארן
    - אלגוריתם ג׳ייקובסון
    correct: 0
    explanation: אלגוריתם נייגל מעכב שידור הודעות זעירות עד שמתקבל אישור על נתונים
      קודמים או עד שהצטבר מידע בגודל חבילה מלא (MSS).
  - type: multiple_choice
    question: אילו 5 מאפיינים מרכיבים את ה-5-Tuple המזהה באופן בלעדי כל חיבור רשת
      פעיל במערכת ההפעלה?
    options:
    - IP מקור, פורט מקור, IP יעד, פורט יעד ופרוטוקול
    - כתובת MAC, כתובת IP, מסיכת רשת, שער ברירת מחדל ושרת DNS
    - שם מתחם, נתיב כתובת, מתודת HTTP, מזהה דפדפן ועוגייה
    - מזהה ממשק, מזהה VLAN, שדה TTL, סיכום ביקורת ומספר סידורי
    correct: 0
    explanation: 'מערכת ההפעלה מפרידה בין חיבורי רשת שונים על פי צירוף חמשת המאפיינים:
      כתובות ופורטים של שני הצדדים וסוג הפרוטוקול.'
  - type: multiple_choice
    question: איזה טווח פורטים (0 עד 1023) מוקצה לשירותי מערכת מוכרים וסטנדרטיים כגון
      HTTP (80), HTTPS (443) ו-SSH (22)?
    options:
    - פורטים ידועים (Well-Known / System Ports)
    - פורטים רשומים (1024-49151)
    - פורטים דינמיים זמניים (49152-65535)
    - פורטי שידור Multicast
    correct: 0
    explanation: טווח הפורטים 0 עד 1023 שמור לשירותי תשתית מרכזיים, ובמערכות הפעלה
      דורש לרוב הרשאות מנהל (Root/Admin) כדי להאזין להם.
  - type: multiple_choice
    question: מדוע מועדף פרוטוקול UDP על פני TCP במשחקי רשת תחרותיים ובשיחות קוליות
      חיות?
    options:
    - הוא מבטל את עיכובי ההשהיה הנגרמים משידור חוזר של חבילות שאבדו ואיבדו את הרלוונטיות
      שלהן
    - הוא מצפין אוטומטית את נתוני המיקום באבטחה צבאית
    - הוא מגדיל את רוחב הפס באמצעות דחיסת האפמן מובנית
    - הוא מאפשר לשרת המשחק לפעול ללא כתובות IP
    correct: 0
    explanation: במשחק חי או בשיחת קול, חבילה שהתעכבה בחצי שנייה כבר אינה רלוונטית;
      מוטב להפסידה מאשר לעצור את כל המשחק לצורך שידור חוזר.
- id: dns_and_tls_cryptography
  title: '4. שירותי רשת ואבטחה: מערכת ה-DNS והצפנת TLS'
  description: מערכת שמות המתחם ההיררכית (DNS), תשתית מפתח ציבורי (PKI), לחיצת היד
    המוצפנת של TLS 1.3 וחומות אש בעלות בדיקת מצב.
  cards:
  - id: dns_hierarchy_resolution
    title: מערכת שמות המתחם (DNS) ותהליך הפענוח הרקורסיבי
    figure:
