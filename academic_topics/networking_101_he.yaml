        1.5\"/>\n</svg>"
      caption: 'שרת רקורסיבי מטפס בעץ ה-DNS ההפוך: שואל את שרתי השורש, לאחר מכן שרתי
        סיומת עליונה (TLD), ולבסוף את השרת הסמכותי המחזיק בכתובת ה-IP.'
    points:
    - מערכת שמות המתחם (DNS) היא מסד נתונים היררכי מבוזר עולמי המתרגם שמות אתרים קריאים
      לאדם (כמו example.com) לכתובות IP הניתנות לניתוב.
    - ההיררכיה מתחילה ב-13 צבירי שרתי שורש (Root Servers, מ-a ועד m, המשוכפלים ברחבי
      תבל ב-BGP Anycast). שרתי השורש מפנים לשרתי TLD (כגון com., il., org.), ואלו
      מפנים לשרת השמות הסמכותי של הדומיין.
    - 'רשומות ה-DNS הבסיסיות כוללות: `A` (מיפוי ל-IPv4), `AAAA` (מיפוי ל-IPv6), `CNAME`
      (כינוי המפנה לדומיין אחר), `MX` (ניתוב דואר אלקטרוני), ו-`TXT` (טקסט המשמש לאימות
      בעלות ואבטחת דואר כמו SPF ו-DKIM).'
    - מכיוון ששאילתות DNS היסטוריות עברו בטקסט גלוי ללא הצפנה בפורט UDP 53, מערכות
      מודרניות עוברות ל-DoH (DNS מעל HTTPS) ול-DoT (DNS מעל TLS) כדי לחסום האזנות
      ספקיות תקשורת ומניפולציות של גורמים עוינים.
  - id: tls_handshake_public_key_crypto
    title: הצפנת TLS 1.3 ותשתית מפתח ציבורי (PKI)
    figure:
      title: לחיצת היד המוצפנת המהירה של TLS 1.3 (סבב יחיד 1-RTT)
      svg: "<svg viewBox=\"0 0 500 130\" xmlns=\"http://www.w3.org/2000/svg\" style=\"\
        width:100%;max-height:130px;\">\n  <line x1=\"100\" y1=\"20\" x2=\"100\" y2=\"\
        120\" stroke=\"#3b82f6\" stroke-width=\"2\"/>\n  <text x=\"100\" y=\"15\"\
        \ font-size=\"11\" font-weight=\"bold\" fill=\"#3b82f6\" text-anchor=\"middle\"\
        >לקוח (דפדפן)</text>\n  <line x1=\"400\" y1=\"20\" x2=\"400\" y2=\"120\" stroke=\"\
        #10b981\" stroke-width=\"2\"/>\n  <text x=\"400\" y=\"15\" font-size=\"11\"\
        \ font-weight=\"bold\" fill=\"#10b981\" text-anchor=\"middle\">שרת מאובטח</text>\n\
        \  <path d=\"M 100 40 L 395 60\" stroke=\"#3b82f6\" stroke-width=\"2\"/>\n\
        \  <text x=\"250\" y=\"45\" font-size=\"10\" fill=\"#3b82f6\" text-anchor=\"\
        middle\">ClientHello + נתח מפתח ECDHE</text>\n  <path d=\"M 400 75 L 105 95\"\
        \ stroke=\"#10b981\" stroke-width=\"2\"/>\n  <text x=\"250\" y=\"80\" font-size=\"\
        10\" fill=\"#10b981\" text-anchor=\"middle\">ServerHello + תעודה דיגיטלית\
        \ + סיום</text>\n  <path d=\"M 100 105 L 395 105\" stroke=\"#ec4899\" stroke-width=\"\
        2.5\" stroke-dasharray=\"4,4\"/>\n  <text x=\"250\" y=\"120\" font-size=\"\
        10\" font-weight=\"bold\" fill=\"#ec4899\" text-anchor=\"middle\">תעבורת מידע\
        \ מוצפנת סימטרית (AES-GCM)</text>\n</svg>"
      caption: פרוטוקול TLS 1.3 משלים את לחיצת היד המוצפנת בסבב רשת יחיד (1-RTT),
        ויוצר מפתחות סשן סימטריים באמצעות דיפי-הלמן עקום-אליפטי.
    points:
    - פרוטוקול TLS משלב הצפנה א-סימטרית במפתח ציבורי (מורכבת ואיטית) כדי להסכים בבטחה
      על סוד משותף, והצפנה סימטרית (מהירה ונתמכת בחומרה, כמו AES-GCM או ChaCha20)
      להצפנת כל המידע המועבר.
    - תשתית מפתח ציבורי (PKI) קושרת את זהות השרת למפתח הציבורי שלו באמצעות תעודות
      דיגיטליות בתקן X.509. רשויות אישור מהימנות (CAs) חותמות דיגיטלית על התעודות,
      והדפדפן מאמת את שרשרת האמון עד לתעודת השורש הצרובה במערכת ההפעלה.
    - 'תקן TLS 1.3 ביטל אלגוריתמים ישנים ולא מאובטחים וצמצם את לחיצת היד לזמן סבב
      יחיד (1-RTT): הלקוח שולח מראש את חלקו בהסכם המפתחות כבר בהודעת `ClientHello`
      הראשונה.'
    - 'הפרוטוקול מחייב סודיות מושלמת קדימה (PFS) באמצעות דיפי-הלמן זמני (ECDHE): מפתחות
      הסשן נוצרים מחדש בכל חיבור ונמחקים מיד בסיומו. גם אם תוקף יגנוב בעתיד את המפתח
      הפרטי הראשי של השרת, הוא לעולם לא יוכל לפענח תעבורת עבר שהוקלטה ברשת.'
  - id: firewalls_nat_middleboxes
    title: חומות אש, בדיקת מצב וחציית מחסומי NAT
    points:
    - חומת אש נטולת מצב (Stateless) בודקת כל חבילה במבודד לפי חוקי IP ופורטים יבשים.
      לעומתה, חומת אש בעלת בדיקת מצב (Stateful) מנהלת טבלת חיבורים פעילים (כמו מנגנון
      `conntrack` בלינוקס), ומאשרת אוטומטית כניסת חבילות שמהוות מענה לחיבור יוצא חוקי.
    - מנגנון NAPT ממפה זוג של כתובת IP ופורט פנימיים לכתובת IP ופורט חיצוניים. כאשר
      חוזרת תשובה, הנתב משכתב את הכתובת בחזרה אל המחשב הפנימי המקורי.
    - תקשורת ישירה בין עמיתים (Peer-to-Peer, כמו בשיחות WebRTC) נתקלת במחסומי NAT.
      מחשבים נעזרים בשרתי STUN כדי לגלות מהי כתובת ה-IP הציבורית והפורט שבהם הם נראים
      מבחוץ, ובמידת הצורך נסוגים לשרתי ממסר מסוג TURN כאשר המבנה חוסם חיבור ישיר.
    - 'כדי לבלום מתקפות מניעת שירות מבוזרות (DDoS מסוג הצפת SYN), שרתי אינטרנט משתמשים
      בעוגיות SYN (SYN Cookies): במקום להקצות זיכרון לחיבור חצי-פתוח, השרת מקודד את
      נתוני החיבור בחתימה מוצפנת בתוך המספר הסידורי של ה-SYN-ACK, ומקצה זיכרון רק
      לאחר חזרת אישור ה-ACK המלא.'
  trivia:
  - type: multiple_choice
    question: כמה זהויות לוגיות של צבירי שרתי שורש (Root Servers) קיימות בראש מערכת
      ה-DNS העולמית?
    options:
    - 13 צבירי שרתי שורש (המסומנים באותיות a עד m)
    - 256 צבירי שרתי שורש
    - שרת שורש בודד אחד בלבד
    - 1024 צבירי שרתי שורש
    correct: 0
    explanation: בשל מגבלת גודל הודעת UDP היסטורית של 512 בתים, הוגדרו בדיוק 13 זהויות
      שרתי שורש, המבוזרות כיום במאות שרתים פיזיים ב-Anycast.
  - type: multiple_choice
    question: איזו רשומת DNS ממפה שם מתחם אינטרנטי קריא ישירות לכתובת IPv4 בת 32 סיביות?
    options:
    - רשומת A
    - רשומת AAAA
    - רשומת CNAME
    - רשומת MX
    correct: 0
    explanation: רשומת A ממפה כתובת ל-IPv4, בעוד שרשומת AAAA (המכונה Quad-A) ממפה
      כתובת ל-IPv6.
  - type: multiple_choice
    question: מהו תפקידה של רשומת CNAME (שם קנוני) במערכת ה-DNS?
    options:
    - ליצור כינוי המפנה שם מתחם אחד לשם מתחם אחר
    - לקבוע את עדיפות שרתי הדואר האלקטרוני בארגון
    - להגדיר מפתחות הצפנה לאימות הודעות דוא״ל ב-DKIM
    - לבצע שאילתת חיפוש הפוכה (Reverse DNS)
    correct: 0
    explanation: רשומת CNAME מגדירה שם נרדף (כינוי), ומאפשרת למשל לכתובת www.example.com
      להפנות ישירות אל example.com.
  - type: multiple_choice
    question: איזה עקרון אבטחה ב-TLS מבטיח שפענוח רטרואקטיבי של תעבורת עבר מוקלטת
      יהיה בלתי אפשרי גם אם המפתח הפרטי הראשי של השרת ייגנב בעתיד?
    options:
    - סודיות מושלמת קדימה (PFS - Perfect Forward Secrecy)
    - ביטול תעודות (CRL)
    - אימות DNSSEC
    - אכיפת HTTPS קשיחה (HSTS)
    correct: 0
    explanation: עקרון ה-PFS יוצר מפתחות סשן זמניים חד-פעמיים באמצעות דיפי-הלמן (ECDHE)
      הנמחקים מיד, כך שלמפתח הראשי אין יכולת לפענחם בדיעבד.
  - type: multiple_choice
    question: כמה זמני סבב רשת (RTT) נדרשים להשלמת לחיצת היד המוצפנת בתקן המודרני
      של TLS 1.3 בתנאים רגילים?
    options:
    - סבב יחיד בלבד (1-RTT)
    - שני סבבים (2-RTT)
    - שלושה סבבים (3-RTT)
    - חצי סבב (0.5-RTT)
    correct: 0
    explanation: תקן TLS 1.3 ייעל את התהליך לזמן סבב יחיד (1-RTT) בכך שהלקוח מנחש
      ושולח את נתח המפתח כבר בהודעת ה-ClientHello הראשונה.
  - type: multiple_choice
    question: באיזה סוג הצפנה משתמש פרוטוקול TLS להצפנה השוטפת של נתוני האפליקציה
      לאחר סיום לחיצת היד הראשונית?
    options:
    - הצפנה סימטרית מהירה (כגון AES-GCM או ChaCha20)
    - הצפנה א-סימטרית כבדה (כגון RSA-4096)
    - חתימות דיגיטליות על עקומים אליפטיים (ECDSA)
    - פונקציות גיבוב חד-כיווניות (SHA-256)
    correct: 0
    explanation: הצפנה א-סימטרית כבדה מדי לשידור שוטף; היא משמשת רק להחלפת המפתחות,
      ולאחר מכן צפנים סימטריים מהירים מצפינים את המידע.
  - type: multiple_choice
    question: מהו תפקידה העיקרי של רשות אישורים (Certificate Authority - CA) בתשתית
      המפתח הציבורי באינטרנט?
    options:
    - לחתום דיגיטלית על תעודות המאמתות ששם הדומיין אכן שייך לבעל המפתח הציבורי
    - לנתב חבילות נתונים מוצפנות בסיבים אופטיים עולמיים
    - לשמש כשער ברירת המחדל ברשתות מקומיות
    - לשמור את עוגיות הדפדפן של המשתמשים
    correct: 0
    explanation: רשויות ה-CA מאמתות את בעלות האתר וחותמות על תעודת X.509, מה שמאפשר
      לדפדפנים לוודא שלא מדובר באתר מתחזה.
  - type: multiple_choice
    question: איזה פרוטוקול אבטחה מצפין שאילתות DNS בתוך ערוץ HTTPS בפורט 443 כדי
      למנוע מעקב של ספקיות תקשורת?
    options:
    - DoH (DNS מעל HTTPS)
    - SNMP (פרוטוקול ניהול רשת)
    - BGPsec
    - NTP (פרוטוקול סנכרון זמן)
    correct: 0
    explanation: פרוטוקול DoH עוטף את בקשות ה-DNS בתוך תעבורת HTTPS סטנדרטית, ובכך
      מונע מגורמי ציתות ברשת המקומית לדעת באילו אתרים המשתמש גולש.
  - type: multiple_choice
    question: מהו ההבדל המרכזי בין חומת אש נטולת מצב (Stateless) לחומת אש בעלת בדיקת
      מצב (Stateful)?
    options:
    - חומת אש Stateful מנהלת טבלת חיבורים פעילים ומאשרת אוטומטית חבילות תשובה לחיבורים
      שנפתחו; חומת אש Stateless בודקת כל חבילה בעיוורון
    - חומת אש Stateless דורשת מאיץ חומרה מיוחד; חומת אש Stateful רצה במרחב המשתמש
      בלבד
    - חומת אש Stateful פועלת על כבלים אופטיים בלבד
    - חומת אש Stateless מפענחת אוטומטית תעבורת HTTPS
    correct: 0
    explanation: חומת אש Stateful עוקבת אחרי רצף החיבורים, ומאפשרת לחבילות מענה לחזור
      מבלי להגדיר עבורן חוקים פתוחים מראש.
  - type: multiple_choice
    question: איזה פרוטוקול מאפשר למחשב מאחורי נתב NAT לגלות מהי כתובת ה-IP והפורט
      הציבוריים שלו עבור שיחות ישירות?
    options:
    - STUN (כלי חציית שרתי NAT)
    - RIP (פרוטוקול ניתוב)
    - SNMP
    - IMAP (פרוטוקול דואר אלקטרוני)
    correct: 0
    explanation: פרוטוקול STUN מאפשר לתוכנות תקשורת כמו WebRTC לשאול שרת חיצוני כיצד
      הן נראות מהאינטרנט הציבורי לצורך יצירת חיבור P2P ישיר.
  - type: multiple_choice
    question: איזו שיטת הגנה על שרתים מקודדת את נתוני החיבור לתוך המספר הסידורי הראשוני
      כדי לנטרל מתקפות הצפת SYN מבלי לתפוס זיכרון?
    options:
    - עוגיות SYN (SYN Cookies)
    - גריסת חבילות
    - הגברת DNS
    - פירוק חבילות בחומרה
    correct: 0
    explanation: מנגנון SYN Cookies מחשב חתימה מוצפנת בתוך שדה המספר הסידורי, ומונע
      מהשרת להקצות זיכרון עד לקבלת אישור ה-ACK הסופי מהלקוח.
  - type: multiple_choice
    question: איזו כותרת אבטחה של HTTP מורה לדפדפן להתחבר אל האתר אך ורק באמצעות ערוץ
      HTTPS מוצפן למשך תקופה מוגדרת?
    options:
    - HSTS (אבטחת תעבורה קשיחה ב-HTTP)
    - Content-Security-Policy (מדיניות אבטחת תוכן)
    - X-Frame-Options
    - CORS (שיתוף משאבים בין מקורות)
    correct: 0
    explanation: כותרת HSTS מונעת מתקפות הפשטת הצפנה (SSL Stripping) בכך שהיא כופה
      על הדפדפן לשדרג אוטומטית כל קישור ל-HTTPS.
  - type: multiple_choice
    question: איזו הרחבה בלחיצת היד של TLS מאפשרת ללקוח לציין לאיזה שם דומיין הוא
      פונה, ומאפשרת לארח מספר אתרים מאובטחים על אותה כתובת IP?
    options:
    - SNI (ציון שם שרת - Server Name Indication)
    - ALPN (משא ומתן שכבת אפליקציה)
    - OCSP Stapling
    - PFS
    correct: 0
    explanation: הרחבת SNI שולחת את שם האתר בגלוי בתחילת לחיצת היד, ומאפשרת לשרת להציג
      את התעודה הדיגיטלית המתאימה לפני יצירת ההצפנה.
  - type: multiple_choice
    question: איזו הרחבת אבטחה ל-DNS משתמשת בחתימות קריפטוגרפיות כדי לוודא שמענה לשאילתה
      לא שובש בדרך על ידי צד שלישי?
    options:
    - DNSSEC (הרחבות אבטחה ל-DNS)
    - BGP Anycast
    - DHCP Snooping
    - SPF
    correct: 0
    explanation: פרוטוקול DNSSEC חותם דיגיטלית על רשומות השמות, ומאפשר למחשב לוודא
      שכתובת ה-IP שחזרה אכן מקורה בשרת הסמכותי האמיתי.
  - type: multiple_choice
    question: באיזה פרוטוקול ממסר משתמשת תקשורת WebRTC כאשר חומות אש ארגוניות קשיחות
      חוסמות לחלוטין חיבור UDP ישיר בין עמיתים?
    options:
    - TURN (ממסר עוקף NAT)
    - STUN
    - SIP
    - RTSP
    correct: 0
    explanation: כאשר לא ניתן לבצע חציית NAT ישירה, שרת TURN משמש כמתווך וממסר המעביר
      את כל נתוני הווידאו והאודיו בין הצדדים.
- id: application_layer_web_protocols
  title: '5. שכבת האפליקציה: מהפכת ה-Web מ-HTTP/1.1 ל-HTTP/3 ו-QUIC'
  description: סמנטיקת ה-HTTP נטולת המצב, ריבוי ערוצים בינאריים ב-HTTP/2, דחיסת כותרות
    HPACK ופרוטוקול HTTP/3 המהפכני מעל גבי QUIC ו-UDP.
  cards:
  - id: http11_statelessness_cookies
    title: 'פרוטוקול HTTP/1.1: מתודות, קודי סטטוס וחיבורים מתמידים'
    points:
    - 'פרוטוקול HTTP הוא פרוטוקול בקשה-מענה נטול מצב (Stateless) בשכבת האפליקציה המניע
      את רשת האינטרנט. מתודות הבקשה התקניות מגדירות את הכוונה: `GET` (שליפת משאב בטוחה),
      `POST` (שליחת מידע לעיבוד), `PUT` (החלפת משאב שלם), ו-`DELETE` (מחיקה).'
    - 'תשובות השרת מחזירות קודי סטטוס בני 3 ספרות: `2xx` הצלחה (200 OK), `3xx` הפניה
      (301 הפניה קבועה, 304 ללא שינוי), `4xx` שגיאות לקוח (400 בקשה שגויה, 401 לא
      מורשה, 404 לא נמצא), ו-`5xx` שגיאות שרת (500 שגיאה פנימית, 502 שער פגום).'
    - 'פרוטוקול HTTP/1.1 הגדיר חיבורים מתמידים (`Connection: keep-alive`) כברירת מחדל,
      ואפשר לשלוח סדרת בקשות ותשובות על גבי אותו חיבור TCP קיים במקום לשלם את מחיר
      לחיצת היד עבור כל תמונה וקובץ סקריפט בנפרד.'
    - מכיוון ש-HTTP הוא חסר מצב מיסודו, שרתים מנהלים מפגשי משתמש (Sessions) באמצעות
      כותרת `Set-Cookie`. הדפדפן שומר את עוגיות המפתח-ערך ומצרף אותן אוטומטית לבקשות
      הבאות כדי לשמור על מצב התחברות וסל קניות פעיל.
  - id: http2_multiplexing_binary_framing
    title: 'פרוטוקול HTTP/2: מסגור בינארי וריבוי ערוצים בו-זמני'
    figure:
