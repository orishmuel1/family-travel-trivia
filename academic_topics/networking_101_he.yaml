        2\"/>\n  <text x=\"482\" y=\"65\" font-size=\"11\" font-weight=\"bold\" fill=\"\
        #f59e0b\" text-anchor=\"middle\">FCS (CRC)</text>\n  <text x=\"482\" y=\"\
