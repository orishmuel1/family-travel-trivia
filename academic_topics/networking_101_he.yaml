      caption: פרוטוקול HTTP/2 מפרק בקשות למסגרות בינאריות קטנות בערוצים מקבילים על
        גבי חיבור TCP יחיד.
    points:
    - פרוטוקול HTTP/2 החליף את הטקסט הגלוי והשביר של HTTP/1.1 בשכבת מסגור בינארית
      (Binary Framing Layer) מהירה. כל הודעה מפורקת למסגרות בינאריות (כגון `HEADERS`,
      `DATA` ו-`SETTINGS`).
    - 'הפרוטוקול מאפשר ריבוי ערוצים (Multiplexing) מלא: בקשות ותשובות רבות משודרות
      במקביל בערבוב הדדי על גבי חיבור TCP יחיד. קובץ תמונה כבד אינו חוסם עוד קובץ
      CSS קריטי בשכבה 7.'
    - 'כדי לחסוך בבזבוז רוחב פס הנובע מחזרה על כותרות זהות בכל בקשה, HTTP/2 שילב את
      אלגוריתם HPACK: אלגוריתם דחיסה ייעודי המשתמש בטבלאות מיפוי סטטיות ודינמיות.'
    - 'עם זאת, HTTP/2 חשף בעיה תשתיתית בשכבת התעבורה: חסימת ראש התור ב-TCP. מכיוון
      ש-TCP דורש מסירה מסודרת של בתים, איבוד של חבילה בודדת ברשת עוצר את כל ערוצי
      ה-HTTP/2 הפועלים על אותו חיבור בו-זמנית עד לשחזורה.'
  - id: http3_quic_future_protocols
    title: 'פרוטוקול HTTP/3 ו-QUIC: מהפכת ה-UDP ברשת'
    points:
    - פרוטוקול HTTP/3 מגדיר מחדש את תשתית התעבורה של עולם האינטרנט ומחליף את TCP בפרוטוקול
      QUIC המודרני, הפועל מעל גבי UDP במרחב המשתמש.
    - 'פרוטוקול QUIC פותר לחלוטין את חסימת ראש התור (HoL) בשכבה 4: כל ערוץ בחיבור
      פועל באופן עצמאי לחלוטין. אם חבילה של ערוץ 1 אובדת ברשת, ערוצים 2 ו-3 ממשיכים
      להזרים נתונים ללא שום עצירה.'
    - פרוטוקול QUIC מטמיע את לחיצת היד המוצפנת של TLS 1.3 ישירות בתוך פתיחת החיבור
      שלו, ומאפשר התחברות חוזרת מיידית ללא השהיה (0-RTT), כך שמידע מוצפן נשלח כבר
      בחבילה הראשונה.
    - 'הפרוטוקול כולל נדידת חיבור (Connection Migration): החיבור מזוהה על ידי מזהה
      חיבור בן 64 סיביות ולא על פי כתובת ה-IP והפורט. כאשר משתמש יוצא מהבית והטלפון
      עובר מ-Wi-Fi לגלישה סלולרית ב-5G, שיחת הווידאו או ההורדה ממשיכות ברציפות ללא
      שום ניתוק.'
  trivia:
  - type: multiple_choice
    question: איזו מתודת בקשת HTTP מוגדרת בתקן כבטוחה ואידמפוטנטית (Idempotent), ומיועדת
      לשליפת מידע בלבד מבלי לשנות את מצב השרת?
    options:
    - מתודת GET
    - מתודת POST
    - מתודת PATCH
    - מתודת CONNECT
    correct: 0
    explanation: מתודת `GET` מיועדת לקריאה בלבד, וקריאות חוזרות ונשנות שלה מחזירות
      אותה תוצאה ואינן משנות נתונים בשרת.
  - type: multiple_choice
    question: איזו קבוצת קודי סטטוס ב-HTTP מייצגת שגיאות שמקורן בצד השרת (כגון 500
      Internal Server Error ו-502 Bad Gateway)?
    options:
    - קודי 5xx (שגיאות שרת)
    - קודי 4xx (שגיאות לקוח)
    - קודי 3xx (הפניות)
    - קודי 2xx (הצלחה)
    correct: 0
    explanation: קודי סטטוס המתחילים בספרה 5 מעידים על כשל של השרת במילוי בקשה חוקית
      (כגון קריסת תוכנה או חוסר זמינות שער).
  - type: multiple_choice
    question: איזו כותרת ב-HTTP/1.1 אפשרה שימוש חוזר בחיבור TCP קיים עבור בקשות עוקבות
      כדי למנוע לחיצות יד חוזרות?
    options:
    - 'Connection: keep-alive'
    - 'Cache-Control: no-cache'
    - 'Transfer-Encoding: chunked'
    - 'Upgrade: websocket'
    correct: 0
    explanation: הוראת `keep-alive` שומרת על ערוץ ה-TCP פתוח, וחוסכת את השיהוי הכבד
      של פתיחת חיבור חדש עבור כל משאב באתר.
  - type: multiple_choice
    question: איזה שדרוג מבני מרכזי ב-HTTP/2 מאפשר לשלוח בקשות ותשובות רבות במקביל
      בערוצים משולבים על גבי חיבור TCP בודד?
    options:
    - ריבוי ערוצים (Multiplexing) באמצעות מסגור בינארי
    - פיצול דומיינים (Domain Sharding)
    - איחוד תמונות (CSS Sprites)
    - קידוד Base64 בגוף הדף
    correct: 0
    explanation: פרוטוקול HTTP/2 מפרק מידע למסגרות בינאריות בעלות מזהה ערוץ, ומאפשר
      לדפדפן להזרים מאות משאבים במקביל על חיבור יחיד.
  - type: multiple_choice
    question: איזה אלגוריתם דחיסה ייעודי פותח עבור HTTP/2 לדחיסת כותרות חוזרות באמצעות
      טבלאות מיפוי סטטיות ודינמיות?
    options:
    - אלגוריתם HPACK
    - אלגוריתם Gzip
    - אלגוריתם Brotli
    - אלגוריתם LZMA
    correct: 0
    explanation: אלגוריתם HPACK תוכנן במיוחד עבור HTTP/2 כדי לצמצם תקורת כותרות חוזרות
      ולהגן מפני מתקפות ציתות מבוססות דחיסה.
  - type: multiple_choice
    question: באיזה פרוטוקול תעבורה תשתיתי משתמש פרוטוקול הדור הבא HTTP/3 במקום פרוטוקול
      TCP המסורתי?
    options:
    - פרוטוקול QUIC (הפועל מעל גבי UDP)
    - פרוטוקול SCTP
    - חבילות IP גולמיות ישירות
    - פרוטוקול RSVP
    correct: 0
    explanation: פרוטוקול HTTP/3 פועל מעל פרוטוקול QUIC מבוסס ה-UDP, ובכך פותר את
      חסימת ראש התור ומקצר משמעותית את זמן ההתחברות.
  - type: multiple_choice
    question: מדוע מבטל פרוטוקול HTTP/3 מבוסס QUIC את תופעת חסימת ראש התור (Head-of-Line
      Blocking) בעת איבוד חבילה?
    options:
    - ערוצי המידע ב-QUIC עצמאיים לחלוטין; איבוד חבילה בערוץ אחד אינו מעכב את קריאת
      הנתונים בערוצים האחרים
    - פרוטוקול QUIC מונע איבוד חבילות פיזי באמצעות הגברת עוצמת הלייזר בסיב
    - פרוטוקול QUIC משכפל כל חבילה פעמיים במסלולים שונים באינטרנט
    - פרוטוקול QUIC מבטל לחלוטין את הצורך במספור חבילות
    correct: 0
    explanation: ב-QUIC ניהול הערוצים מתבצע ברמת התעבורה; איבוד חבילה עוצר אך ורק
      את הערוץ הספציפי שאליו היא שייכת.
  - type: multiple_choice
    question: איזו תכונה ב-QUIC מאפשרת לטלפון נייד לעבור מרשת Wi-Fi לגלישה סלולרית
      5G מבלי לנתק שיחת וידאו או הורדה פעילה?
    options:
    - נדידת חיבור (Connection Migration באמצעות מזהה חיבור)
    - ניתוב BGP Anycast
    - גישור תתי-רשתות (Bridging)
    - מינהור ARP דינמי
    correct: 0
    explanation: חיבור QUIC מזוהה באמצעות מזהה Connection ID ייחודי ולא לפי כתובת
      ה-IP, מה שמאפשר לחיבור לשרוד שינוי כתובות רשת במעבר בין רשתות.
  - type: multiple_choice
    question: איזה מנגנון ב-TLS 1.3 וב-QUIC מאפשר ללקוח חוזר לשלוח נתוני אפליקציה
      מוצפנים כבר בחבילת הרשת הראשונה ללא השהיה?
    options:
    - התחברות מחדש באפס זמני סבב (0-RTT Resumption)
    - פתיחה מהירה של TCP (TFO)
    - צינור Keep-Alive
    - דחיפת שרת (HTTP Server Push)
    correct: 0
    explanation: מנגנון 0-RTT מאפשר למשתמש שכבר ביקר באתר לגזור מפתחות הצפנה מנתוני
