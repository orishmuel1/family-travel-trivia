id: networking_101_he
type: academic
icon: 🌐
title: רשתות תקשורת מחשבים וארכיטקטורת האינטרנט (Networking 101)
description: 'מדריך הנדסי מקיף מעקרונות ראשוניים: כיצד פולסים של אור ואותות רדיו מעבירים
  מידע גלובלי, כיצד ניתוב IP ופרוטוקול BGP מנהלים מיליארדי מחשבים, כיצד TCP מבטיח
  אמינות מוחלטת וכיצד HTTP/3 ו-TLS מאבטחים את הרשת המודרנית.'
lang: he
audience: family
categories:
- id: physical_datalink_ethernet
  title: '1. השכבה הפיזית ושכבת הקו: מפוטונים למסגרות אתרנט'
  description: ממעברי מתח חשמליים ופולסים בסיבים אופטיים, ועד מסגרות אתרנט, כתובות
    MAC חומרתיות, מיתוג מתקדם ומניעת לולאות ברשת.
  cards:
  - id: signals_modulation_copper_fiber
    title: 'תווך פיזי: רוחב פס, מודולציה ורעש'
    figure:
      title: 'קידוד אותות בינאריים: NRZ מול קידוד מנצ׳סטר'
