        1.5\"/>\n  <text x=\"70\" y=\"52\" font-size=\"10\" font-weight=\"bold\" fill=\"\
        #3b82f6\" text-anchor=\"middle\">HTML</text>\n  <rect x=\"130\" y=\"30\" width=\"\
        100\" height=\"35\" rx=\"5\" fill=\"#6366f1\" fill-opacity=\"0.15\" stroke=\"\
        #6366f1\" stroke-width=\"1.5\"/>\n  <text x=\"180\" y=\"52\" font-size=\"\
        10\" font-weight=\"bold\" fill=\"#6366f1\" text-anchor=\"middle\">CSS (Blocked)</text>\n\
        \  <rect x=\"240\" y=\"30\" width=\"100\" height=\"35\" rx=\"5\" fill=\"#8b5cf6\"\
        \ fill-opacity=\"0.15\" stroke=\"#8b5cf6\" stroke-width=\"1.5\"/>\n  <text\
        \ x=\"290\" y=\"52\" font-size=\"10\" font-weight=\"bold\" fill=\"#8b5cf6\"\
        \ text-anchor=\"middle\">JS (Blocked)</text>\n  <text x=\"470\" y=\"52\" font-size=\"\
        10\" fill=\"#ef4444\" text-anchor=\"end\">HTTP/1.1 (Sequential)</text>\n \
        \ <rect x=\"20\" y=\"75\" width=\"60\" height=\"35\" rx=\"5\" fill=\"#3b82f6\"\
        \ fill-opacity=\"0.2\" stroke=\"#3b82f6\" stroke-width=\"1.5\"/>\n  <text\
        \ x=\"50\" y=\"96\" font-size=\"9\" font-weight=\"bold\" fill=\"#3b82f6\"\
        \ text-anchor=\"middle\">HTML 1</text>\n  <rect x=\"85\" y=\"75\" width=\"\
        60\" height=\"35\" rx=\"5\" fill=\"#10b981\" fill-opacity=\"0.2\" stroke=\"\
        #10b981\" stroke-width=\"1.5\"/>\n  <text x=\"115\" y=\"96\" font-size=\"\
        9\" font-weight=\"bold\" fill=\"#10b981\" text-anchor=\"middle\">CSS 1</text>\n\
        \  <rect x=\"150\" y=\"75\" width=\"60\" height=\"35\" rx=\"5\" fill=\"#ec4899\"\
        \ fill-opacity=\"0.2\" stroke=\"#ec4899\" stroke-width=\"1.5\"/>\n  <text\
        \ x=\"180\" y=\"96\" font-size=\"9\" font-weight=\"bold\" fill=\"#ec4899\"\
        \ text-anchor=\"middle\">JS 1</text>\n  <rect x=\"215\" y=\"75\" width=\"\
        60\" height=\"35\" rx=\"5\" fill=\"#3b82f6\" fill-opacity=\"0.2\" stroke=\"\
        #3b82f6\" stroke-width=\"1.5\"/>\n  <text x=\"245\" y=\"96\" font-size=\"\
        9\" font-weight=\"bold\" fill=\"#3b82f6\" text-anchor=\"middle\">HTML 2</text>\n\
        \  <rect x=\"280\" y=\"75\" width=\"60\" height=\"35\" rx=\"5\" fill=\"#10b981\"\
        \ fill-opacity=\"0.2\" stroke=\"#10b981\" stroke-width=\"1.5\"/>\n  <text\
        \ x=\"310\" y=\"96\" font-size=\"9\" font-weight=\"bold\" fill=\"#10b981\"\
        \ text-anchor=\"middle\">CSS 2</text>\n  <text x=\"470\" y=\"96\" font-size=\"\
        10\" fill=\"#10b981\" text-anchor=\"end\">HTTP/2 (Multiplexed)</text>\n</svg>"
      caption: HTTP/2 splits requests into binary frames across concurrent logical
        streams, interleaving assets over a single TCP connection.
    points:
    - HTTP/2 replaced human-readable ASCII newline protocols with a high-performance
      Binary Framing Layer. Every message is parsed into small binary frames (such
      as `HEADERS`, `DATA`, `SETTINGS`, and `RST_STREAM`).
    - 'It enables true Stream Multiplexing: multiple bi-directional streams are interleaved
      concurrently over a single TCP connection. A slow or massive image response
      no longer blocks an adjacent lightweight CSS file at Layer 7.'
    - 'To eliminate massive bandwidth waste from repetitive headers (like User-Agent
      and cookies sent with every asset), HTTP/2 introduced HPACK: an algorithm compressing
      headers using static and dynamic look-up tables.'
    - 'However, HTTP/2 exposed an underlying transport flaw: TCP Head-of-Line Blocking.
      Because TCP enforces byte-level ordering, a single dropped packet stalls all
      multiplexed HTTP/2 streams on that connection until retransmitted.'
  - id: http3_quic_future_protocols
    title: 'HTTP/3 & QUIC: The UDP Revolution'
    points:
    - HTTP/3 redesigns the transport foundation of the web by completely replacing
      TCP with QUIC (Quick UDP Internet Connections), a modern protocol implemented
      directly over user-space UDP.
    - 'QUIC eliminates Head-of-Line Blocking at Layer 4: individual streams inside
      a QUIC connection are truly independent. If a packet belonging to Stream #1
      is dropped, Streams #2 and #3 continue streaming without experiencing any pause.'
    - QUIC integrates the TLS 1.3 cryptographic handshake directly into its initial
      connection setup, achieving 0-RTT (Zero Round-Trip Time) connection resumption
      for returning visitors, allowing encrypted data to flow on the very first packet.
    - 'QUIC introduces Connection Migration: sessions are tracked by a 64-bit Connection
      ID rather than the client''s IP:port 4-tuple. When a user steps outside their
      house and their smartphone transitions from home Wi-Fi to cellular 5G, video
      calls and file downloads continue seamlessly without dropping the connection.'
  trivia:
  - type: multiple_choice
    question: Which HTTP request method is specified by RFC standards to be idempotent
      and safe, intended solely for retrieving resources without mutating server state?
    options:
    - GET
    - POST
    - PATCH
    - CONNECT
    correct: 0
    explanation: '`GET` requests are designed to be safe and idempotent, meaning making
      the request multiple times produces identical outcomes without side effects.'
  - type: multiple_choice
    question: What 3-digit HTTP status code category represents server-side failures
      (such as 500 Internal Server Error and 502 Bad Gateway)?
    options:
    - 5xx (Server Error)
    - 4xx (Client Error)
    - 3xx (Redirection)
    - 2xx (Success)
    correct: 0
    explanation: HTTP status codes beginning with 5 indicate that the server encountered
      an unexpected condition preventing it from fulfilling a valid request.
  - type: multiple_choice
    question: What HTTP/1.1 header enables persistent connections, allowing multiple
      requests to reuse an existing TCP connection?
    options:
    - 'Connection: keep-alive'
    - 'Cache-Control: no-cache'
    - 'Transfer-Encoding: chunked'
    - 'Upgrade: websocket'
    correct: 0
    explanation: '`keep-alive` instructs the server to leave the underlying TCP socket
      open after serving a response, avoiding the latency of repeated handshakes.'
  - type: multiple_choice
    question: What architectural enhancement in HTTP/2 allows multiple concurrent
      requests and responses to interleave simultaneously across a single TCP connection?
    options:
    - Stream Multiplexing via Binary Framing
    - Domain Sharding
    - CSS Spriting
    - Chunked Base64 Transfer
    correct: 0
    explanation: HTTP/2 breaks requests into binary frames tagged with a stream ID,
      allowing browsers to send hundreds of requests over a single shared connection.
  - type: multiple_choice
    question: What specialized header compression algorithm does HTTP/2 use to compress
      repetitive header fields using static and dynamic lookup tables?
    options:
    - HPACK
    - Gzip
    - Brotli
    - LZMA
    correct: 0
    explanation: HPACK was specifically engineered for HTTP/2 to eliminate duplicate
      header strings and protect against CRIME-style compression attacks.
  - type: multiple_choice
    question: What underlying transport protocol does the next-generation HTTP/3 protocol
      use instead of TCP?
    options:
    - QUIC (running over UDP)
    - SCTP
    - Raw IP Packets
    - RSVP
    correct: 0
    explanation: HTTP/3 replaces TCP with QUIC, an encrypted transport protocol built
      over UDP to solve Head-of-Line blocking and accelerate connection setup.
  - type: multiple_choice
    question: Why does HTTP/3 over QUIC eliminate transport-layer Head-of-Line (HoL)
      blocking when a packet drops?
    options:
    - QUIC streams are completely independent; loss on one stream does not pause processing
      of other streams
    - QUIC prevents physical packet loss by increasing fiber-optic laser power
    - QUIC duplicates every single packet across multiple internet routes
    - QUIC disables packet sequencing entirely
    correct: 0
    explanation: In QUIC, streams are tracked independently; dropped packets only
      pause the specific stream they belong to, allowing all other streams to continue
      uninterrupted.
  - type: multiple_choice
    question: What QUIC feature allows a mobile phone to switch from Wi-Fi to cellular
      5G without terminating an active video stream or download?
    options:
    - Connection Migration (via Connection IDs)
    - BGP Anycast Routing
    - Subnet Bridging
    - Dynamic ARP Tunneling
    correct: 0
    explanation: QUIC identifies connections with a random 64-bit Connection ID; when
      the client IP changes due to network switching, the session survives.
  - type: multiple_choice
    question: What HTTP feature allows returning clients in TLS 1.3 / QUIC to transmit
      encrypted application requests on the very first round trip?
    options:
    - 0-RTT Connection Resumption
    - TCP Fast Open (TFO)
    - Keep-Alive Pipelining
    - HTTP Push Messaging
    correct: 0
    explanation: 0-RTT allows clients that previously connected to a server to derive
      encryption keys from cached session tickets and send data immediately.
  - type: multiple_choice
    question: What HTTP response header instructs the browser to cache a resource
      locally and specifies its expiration lifetime in seconds?
    options:
    - 'Cache-Control: max-age=3600'
    - 'Content-Encoding: gzip'
    - 'Accept-Ranges: bytes'
    - 'X-Content-Type-Options: nosniff'
    correct: 0
    explanation: The `Cache-Control` header directs browsers and intermediate CDN
      edge caches how long a response can be served fresh without revalidation.
  - type: multiple_choice
    question: What HTTP status code is returned when a client attempts to access a
      protected URL without valid authentication credentials?
    options:
    - 401 Unauthorized
    - 403 Forbidden
    - 404 Not Found
    - 302 Found
    correct: 0
    explanation: '`401 Unauthorized` indicates that authentication is required and
      has failed or not been provided, whereas 403 Forbidden indicates the server
      refuses authorization.'
  - type: multiple_choice
    question: What browser mechanism restricts web pages from making cross-origin
      XMLHttpRequest or fetch calls to a different domain unless permitted by headers?
    options:
    - Same-Origin Policy (SOP) & CORS
    - Content Delivery Network (CDN)
    - Subresource Integrity (SRI)
    - Transport Layer Security (TLS)
    correct: 0
    explanation: The Same-Origin Policy isolates distinct origins (scheme, host, port),
      while Cross-Origin Resource Sharing (CORS) headers allow servers to whitelist
      cross-origin access.
  - type: multiple_choice
    question: What HTTP request method is designed to apply partial modifications
      to an existing resource without replacing the entire entity?
    options:
    - PATCH
    - PUT
    - POST
    - OPTIONS
    correct: 0
    explanation: '`PUT` replaces the entire target resource with the uploaded representation,
      whereas `PATCH` specifies a set of differential instructions to modify fields.'
  - type: multiple_choice
    question: What modern web protocol upgrades an existing HTTP connection into a
      full-duplex, bi-directional persistent TCP stream over a single port?
    options:
    - WebSocket
    - Server-Sent Events (SSE)
    - Long Polling
    - WebRTC DataChannel
    correct: 0
    explanation: 'Via an `Upgrade: websocket` header, client and server switch from
      request-response HTTP to a continuous bi-directional frame stream over port
      80/443.'
  - type: multiple_choice
    question: What HTTP status code is used for Permanent Redirection, instructing
      search engines and browsers to permanently update their bookmark links?
    options:
    - 301 Moved Permanently
    - 302 Found
    - 304 Not Modified
    - 307 Temporary Redirect
    correct: 0
    explanation: '`301 Moved Permanently` informs clients that the requested resource
      has been assigned a new permanent URI, caching the redirection.'
