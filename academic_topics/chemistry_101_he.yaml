          caption: "קשרים יוניים מעבירים אלקטרונים ליצירת סריגים, קשרים קוולנטיים חולקים זוגות מקומיים, וקשרים מתכתיים משתפים ים אלקטרונים חופשי."
        points:
          - "אטומים יוצרים קשרים כימיים כדי למזער את האנרגיה הפוטנציאלית האלקטרוסטטית שלהם ולהגיע ליציבות של גז אציל (כלל האוקטט: 8 אלקטרוני ערכיות הממלאים את קליפות s ו-p)."
          - "קשר קוולנטי נוצר בין אטומים בעלי אלקטרושליליות דומה באמצעות שיתוף אלקטרונים. קשר יחיד משתף 2 אלקטרונים (קשר סיגמא), קשר כפול משתף 4 (אחד סיגמא ואחד פאי), וקשר משולש משתף 6 (אחד סיגמא ושניים פאי), כאשר סדר קשר גבוה מקצר את אורכו ומגדיל את חוזקו."
          - "קשר יוני נוצר כאשר הפרש האלקטרושליליות בין האטומים גדול במיוחד (בדרך כלל מעל 2.0), מה שגורם להעברה מלאה של אלקטרון. הקטיונים והאניונים מסתדרים בסריג גבישי תלת-ממדי המוחזק בכוחות קולון בלתי-כיווניים (אנרגיית סריג)."
          - "קשר מתכתי מערב ליבות יונים חיוביות בסריג גבישי השקועות בתוך ׳ים אלקטרונים׳ לא-מאותרים הנעים בחופשיות. תנועה חופשית זו מקנה למתכות מוליכות חשמלית ותרמית גבוהה במיוחד, כמו גם יכולת ריקוע וגמישות מכנית."
      - title: "תאוריית VSEPR, הכלאת אורביטלים ומבנה מולקולרי"
        points:
          - "תאוריית דחיית זוגות האלקטרונים בקליפת הערכיות (VSEPR) קובעת שמתחמי אלקטרונים (זוגות קושרים וזוגות בודדים) דוחים זה את זה חשמלית, ומסתדרים במרחב כך שהמרחק ביניהם מקסימלי והאנרגיה מינימלית."
          - "זוגות אלקטרונים בודדים (לא קושרים) מפעילים כוח דחייה חזק יותר מזוגות קושרים, מפני שענן האלקטרונים שלהם מרוכז קרוב יותר לגרעין המרכזי. כך למשל, מתאן ($CH_4$), אמוניה ($NH_3$) ומים ($H_2O$) בעלי 4 מתחמי אלקטרונים, אך זוויות הקשר נדחסות מ-$109.5^\\circ$ (טטראהדר) ל-$107^\\circ$ (פירמידה משולשת) ועד $104.5^\\circ$ (מבנה מכופף במים)."
          - "הכלאת אורביטלים (Hybridization) מסבירה כיצד אורביטלים אטומיים מתמזגים ליצירת אורביטלים שווי-אנרגיה: שילוב של אורביטל 2s אחד ושלושה אורביטלי 2p יוצר ארבעה אורביטלי הכלאה מסוג $sp^3$ בזווית $109.5^\\circ$, הכלאת $sp^2$ יוצרת גאומטריה מישורית משולשת ($120^\\circ$), והכלאת $sp$ יוצרת גאומטריה קווית ($180^\\circ$)."
          - "קוטביות מולקולרית נוצרת כאשר המולקולה מכילה קשרים קוטביים ומבנה גאומטרי א-סימטרי. אם וקטורי הדיפול מתבטלים הדדית בשל סימטריה מלאה (כמו ב-$CO_2$ הקווי או ב-$CCl_4$ הטטראהדרלי), מומנט הדיפול הכללי מתאפס. במולקולות א-סימטריות כגון מים, נותר דיפול קבוע חזק."
      - title: "כוחות בין-מולקולריים: קשרי מימן, דיפול-דיפול וכוחות פיזור"
        points:
          - "כוחות בין-מולקולריים פועלים בין מולקולות נפרדות. הם חלשים משמעותית מקשרים תוך-מולקולריים קוולנטיים, אך קובעים ישירות את תכונות החומר: טמפרטורות רתיחה והיתוך, מתח פנים, לחץ אדים וצמיגות."
          - "כוחות פיזור של לונדון (ואן דר ואלס) קיימים בין כלל המולקולות בשל תנודות קוונטיות רגעיות בצפיפות האלקטרונים, היוצרות דיפולים רגעיים המושרים במולקולות שכנות. ככל שהמולקולה גדולה יותר וענן האלקטרונים שלה קוטבי יותר, כוחות הפיזור חזקים יותר."
          - "אינטראקציות דיפול-דיפול מתרחשות בין מולקולות בעלות דיפול קבוע, כאשר הקוטב החיובי במולקולה אחת נמשך לקוטב השלילי במולקולה סמוכה."
          - "קשרי מימן הם מקרה קצה חזק במיוחד של משיכת דיפול-דיפול, הנוצר כאשר מימן קשור קוולנטית לאטום קטן ובעל אלקטרושליליות גבוהה במיוחד (חנקן N, חמצן O או פלואור F). קשרים אלה מקנים למים נקודת רתיחה חריגה, מתח פנים מרשים, צפיפות מרבית ב-$4^\\circ\\text{C}$ ומייצבים את מבנה הסליל הכפול של ה-DNA."
    trivia:
      - type: multiple_choice
        question: "מדוע למולקולת מים (H2O) יש גאומטריה מכופפת עם זווית קשר של 104.5° במקום מבנה קווי ישר של 180°?"
        options:
          - "לאטום החמצן יש שני זוגות אלקטרונים בודדים המפעילים דחייה אלקטרוסטטית חזקה ודוחפים את הקשרים מטה"
          - "אטומי המימן טעונים במטען חיובי הנמשך זה אל זה ומקפל את המולקולה"
          - "אטום החמצן יוצר קשר יוני עם מימן אחד וקשר קוולנטי עם המימן השני"
          - "כוח הכבידה של גרעין החמצן הכבד מכופף את אטומי המימן הקלים"
        correct: 0
        explanation: "לחמצן במים יש 4 מתחמי אלקטרונים (שני קשרים ושני זוגות לא קושרים). זוגות האלקטרונים הבודדים דוחים בעוצמה את הזוגות הקושרים ודוחסים את הזווית ל-104.5°."
      - type: multiple_choice
        question: "איזו הכלאת אורביטלים (Hybridization) מתקיימת באטום הפחמן במולקולת מתאן (CH4), המקנה לה מבנה טטראהדרלי מושלם?"
        options:
          - "הכלאת sp³"
          - "הכלאת sp²"
          - "הכלאת sp"
          - "הכלאת sp³d"
        correct: 0
        explanation: "פחמן ממזג אורביטל 2s יחיד ושלושה אורביטלי 2p ליצירת ארבעה אורביטלי הכלאה שווי-ערך מסוג sp³ הפונים לקודקודי טטראהדר בזווית 109.5°."
      - type: multiple_choice
        question: "מדוע מתכות מתאפיינות במוליכות חשמלית מצוינת ובכושר ריקוע מכני בניגוד למלחי סריג יוני שבירים?"
        options:
          - "אלקטרוני הערכיות אינם מאותרים ויוצרים ׳ים אלקטרונים׳ משותף המאפשר תזוזת יונים ללא שבירת הקשר"
          - "אטומי מתכת אינם מכילים פרוטונים ברמות החיצוניות שלהם"
          - "מתכות מורכבות מסריג קוולנטי קשיח במיוחד של קשרים משולשים"
          - "למתכות יש מומנט דיפול מגנטי קבוע המכוון עם השדה החיצוני"
        correct: 0
        explanation: "במתכות, יונים חיוביים שקועים בים אלקטרונים חופשי. עיוות מכני מזיז את היונים החיוביים בלי ליצור דחיית מטענים פתאומית, מה שמאפשר מוליכות וריקוע."
      - type: multiple_choice
        question: "איזו מהמולקולות הבאות מכילה קשרים קוולנטיים קוטביים אך בעלת מומנט דיפול כולל של אפס בשל סימטריה מרחבית?"
        options:
          - "פחמן דו-חמצני (CO2)"
          - "מים (H2O)"
          - "אמוניה (NH3)"
          - "גופרית דו-חמצנית (SO2)"
        correct: 0
        explanation: "פחמן דו-חמצני הוא קווי (O=C=O). שני וקטורי הדיפול של קשרי ה-C=O שווים בגודלם ומנוגדים בדיוק בכיוונם (180°), ולכן מבטלים זה את זה לדיפול אפס."
      - type: multiple_choice
        question: "איזה כוח בין-מולקולרי ייחודי אחראי לנקודת הרתיחה הגבוהה להפליא של מים ולהחזקת צמדי הבסיסים ב-DNA?"
        options:
          - "קשרי מימן"
          - "כוחות פיזור של לונדון"
          - "קשרים מתכתיים"
          - "כוחות יון-דיפול מושרה"
        correct: 0
        explanation: "קשרי מימן נוצרים כאשר מימן קשור לאטומים בעלי אלקטרושליליות גבוהה (N, O, F), ומייצרים משיכה חזקה במיוחד המעלה את טמפרטורת הרתיחה ומייצבת את מבנה ה-DNA."
      - type: multiple_choice
        question: "איזה סוג של קשר כימי נוצר כתוצאה מחפיפה חזיתית ישירה (ראש בראש) של אורביטלים לאורך ציר החיבור הבין-גרעיני?"
        options:
          - "קשר סיגמא (σ)"
          - "קשר פאי (π)"
          - "קשר סריג יוני"
          - "גשר מימן"
        correct: 0
        explanation: "קשר סיגמא (sigma) נוצר מחפיפה ישירה של אורביטלים לאורך ציר החיבור בין שני הגרעינים, ומהווה את הקשר הראשי בכל קשר קוולנטי יחיד, כפול או משולש."
      - type: multiple_choice
        question: "מה מתרחש כאשר מפעילים מכה מכנית חדה על גביש יוני (כדוגמת נתרן כלורי, מלח בישול)?"
        options:
          - "הגביש מתנפץ ונסדק כיוון שיונים בעלי מטען זהה נדחקים זה מול זה ויוצרים דחייה אלקטרוסטטית עזה"
          - "הגביש מתכופף בצורה חלקה ליריעה דקה הודות לזרימת אלקטרונים"
          - "הגביש מתאדה מיד ליונים גזיים בודדים"
          - "מתרחש היתוך גרעיני ספונטני של אטומי הכלור"
        correct: 0
        explanation: "הזזת שכבה בסריג יוני במרחק של אטום בודד מפגישה יונים בעלי מטען זהה (+ מול +, ו-- מול -). כוחות הדחייה החשמליים העצומים מרסקים את הגביש לאורך מישורי הביקוע."
      - type: multiple_choice
        question: "איזה כוח בין-מולקולרי קיים בכל סוגי המולקולות והאטומים ללא יוצא מן הכלל, כולל גזים אצילים ומולקולות לא-קוטביות?"
        options:
          - "כוחות פיזור של לונדון (ואן דר ואלס)"
          - "קשרי מימן"
          - "משיכות דיפול-דיפול קבועות"
          - "אינטראקציות יוניות"
        correct: 0
        explanation: "כוחות פיזור של לונדון נובעים מתנודות קוונטיות רגעיות בצפיפות ענן האלקטרונים, היוצרות דיפולים מושרים רגעיים בכל חומר קיים."
      - type: multiple_choice
        question: "כיצד משתווים אורך הקשר ואנרגיית הפירוק של קשר משולש (כגון N≡N) לקשר יחיד (N-N) בין אותם היסודות?"
        options:
          - "הקשר המשולש קצר יותר וחזק משמעותית (אנרגיית פירוק גבוהה בהרבה)"
          - "הקשר המשולש ארוך יותר וחלש יותר"
          - "הקשר המשולש זהה לחלוטין באורכו ובחוזקו לקשר יחיד"
          - "הקשר המשולש ארוך יותר אך בעל אנרגיית פירוק גבוהה יותר"
        correct: 0
        explanation: "שיתוף שלושה זוגות אלקטרונים מקרב את הגרעינים זה לזה (קשר קצר יותר) ודורש כמות אנרגיה גבוהה בהרבה כדי לפרקו (קשר חזק יותר)."
      - type: multiple_choice
        question: "מהי זווית הקשר האידיאלית במולקולה בעלת גאומטריה מישורית משולשת (Trigonal Planar), כגון בורון טריפלואוריד (BF3)?"
        options:
          - "120°"
          - "109.5°"
          - "90°"
          - "180°"
        correct: 0
        explanation: "שלושה מתחמי אלקטרונים הפרוסים במישור דו-ממדי ממקסמים את המרחק ביניהם בזווית מדויקת של 360° / 3 = 120°."
      - type: multiple_choice
        question: "איזה תנאי נדרש כדי שקשר בין שני אטומים יוגדר כקשר קוולנטי טהור (לא-קוטבי)?"
        options:
          - "הפרש האלקטרושליליות בין שני האטומים הקשורים שואף לאפס (קטן מ-0.4)"
          - "אטום אחד סופח אליו לחלוטין אלקטרון מהאטום השני"
          - "הקשר חייב להיווצר בין מתכת מעבר לאל-מתכת"
          - "האטומים חולקים ארבעה זוגות אלקטרונים בו-זמנית"
        correct: 0
        explanation: "כאשר האלקטרושליליות של שני האטומים כמעט שווה (כמו בקשר C-H או במולקולת N2), זוגות האלקטרונים מתחלקים באופן שווה וללא קיטוב."
      - type: multiple_choice
        question: "מדוע קרח מוצק צף על פני מים נוזליים, בניגוד לרוב החומרים שבהם המצב המוצק צפוף יותר מהנוזל?"
        options:
          - "קשרי מימן מקבעים את מולקולות המים בסריג גבישי משושה ומרווח התופס נפח גדול יותר מהנוזל"
          - "מים נוזליים מכילים אוויר מומס שדוחס אותם ומגדיל את צפיפותם"
          - "מולקולות קרח מאבדות אלקטרונים ולכן מסתן פוחתת"
          - "התפשטות תרמית גורמת למולקולות הקרח לדחות זו את זו מגנטית"
        correct: 0
        explanation: "מתחת ל-4 מעלות צלזיוס, קשרי המימן מכתיבים מבנה סריג גבישי משושה פתוח עם חללים פנימיים, מה שהופך את הקרח לקל בכ-9% ממים נוזליים."
      - type: multiple_choice
        question: "מהי הגאומטריה האלקטרונית של מולקולה בעלת חמישה מתחמי אלקטרונים סביב האטום המרכזי, כגון PCl5?"
        options:
          - "דו-פירמידה משולשת (Trigonal bipyramidal)"
          - "אוקטהדרון (Octahedral)"
          - "טטראהדרון (Tetrahedral)"
          - "ריבוע מישורי (Square planar)"
        correct: 0
        explanation: "חמישה מתחמי אלקטרונים מסתדרים במבנה דו-פירמידה משולשת: שלושה במישור המשווני בזווית 120° ושניים בציר האנכי בזווית 90°."
      - type: multiple_choice
        question: "מהו המונח המתאר את כמות האנרגיה המשתחררת בעת התחברות יונים גזיים ליצירת מול אחד של מוצק גבישי יוני?"
        options:
          - "אנרגיית סריג (Lattice Energy)"
          - "אלקטרושליליות"
          - "אנרגיית שפעול"
          - "אנרגיה חופשית של גיבס"
        correct: 0
        explanation: "אנרגיית סריג היא מדד לחוזק הקשר היוני, ומייצגת את האנרגיה המשתחררת כתוצאה ממשיכת הקולון כאשר יונים מתמצקים לסריג גבישי."
      - type: multiple_choice
        question: "בכימיה מולקולרית, איזה סוג קשר נוצר מחפיפה צדדית של אורביטלי p מקבילים הממוקמים מעל ומתחת לציר הקשר?"
        options:
          - "קשר פאי (π)"
          - "קשר סיגמא (σ)"
          - "קשר דלתא (δ)"
          - "קשר מימן"
        correct: 0
        explanation: "קשר פאי (pi) נוצר מחפיפה צדדית ומקבילה של אורביטלי p שלא עברו הכלאה, והוא ממוקם מעל ומתחת למישור הבין-גרעיני."

  - id: stoichiometry_states_of_matter
    title: "3. סטוכיומטריה, מושג המול ומצבי צבירה"
    description: >
      גישור בין העולם המיקרוסקופי של אטומים למערכות הנדסיות מאקרוסקופיות באמצעות מסה מולרית, משוואות כימיות, חוקי הגזים ומעברי פאזה תרמודינמיים.
    cards:
      - title: "מושג המול, מסה מולרית ואיזון משוואות כימיות"
        figure:
          title: "דיאגרמת פאזות: לחץ כנגד טמפרטורה"
          svg: >
            <svg viewBox="0 0 520 150" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-height:150px;">
              <line x1="60" y1="125" x2="480" y2="125" stroke="currentColor" stroke-width="1.5"/>
              <line x1="60" y1="125" x2="60" y2="15" stroke="currentColor" stroke-width="1.5"/>
              <text x="470" y="140" font-size="10" fill="currentColor" text-anchor="end">טמפרטורה (T) ←</text>
              <text x="35" y="25" font-size="10" fill="currentColor" transform="rotate(-90 35 25)">לחץ (P) ←</text>

              <path d="M 60 120 Q 140 100 180 80" stroke="#3b82f6" stroke-width="2" fill="none"/>
              <path d="M 180 80 Q 200 40 210 20" stroke="#10b981" stroke-width="2" fill="none"/>
              <path d="M 180 80 Q 280 65 370 45" stroke="#ec4899" stroke-width="2" fill="none"/>

              <circle cx="180" cy="80" r="5" fill="#f59e0b"/>
              <text x="175" y="97" font-size="9" font-weight="bold" fill="#f59e0b">נקודה משולשת</text>

              <circle cx="370" cy="45" r="5" fill="#ef4444"/>
              <text x="375" y="40" font-size="9" font-weight="bold" fill="#ef4444">נקודה קריטית</text>

              <text x="110" y="55" font-size="12" font-weight="bold" fill="#3b82f6">מוצק</text>
              <text x="240" y="45" font-size="12" font-weight="bold" fill="#10b981">נוזל</text>
              <text x="320" y="105" font-size="12" font-weight="bold" fill="#ec4899">גז</text>
              <text x="430" y="30" font-size="10" font-weight="bold" fill="#8b5cf6">סופר-קריטי</text>
            </svg>
          caption: "דיאגרמת פאזות ממפה מצבי צבירה לפי לחץ וטמפרטורה. בנקודה המשולשת, מוצק, נוזל וגז מתקיימים בשיווי משקל בו-זמני."
        points:
          - "כימיה מתרחשת בסדרי גודל עצומים שאינם מאפשרים ספירה של חלקיקים בודדים. המול (1 mol) מוגדר באמצעות מספר אבוגדרו: $N_A \\approx 6.02214076 \\times 10^{23}$ חלקיקים, ומשמש כגורם המעבר האוניברסלי בין יחידות מסה אטומית (amu) לגרמים."
          - "מסה מולרית ($M$, בגרם למול) מקשרת בין ספירת חלקיקים למשקל פיזי במעבדה. לפחמן-12 מסה מולרית מדויקת של 12 גרם למול. מול אחד של מים ($H_2O$) שוקל כ-18.016 גרם ומכיל בדיוק $6.022 \\times 10^{23}$ מולקולות מים."
          - "חוק שימור המסה קובע שאטומים אינם נוצרים ואינם נעלמים בתגובות כימיות רגילות. איזון משוואה כימית מחייב מספר שווה של אטומי כל יסוד בשני צדי המשוואה: $CH_4 + 2O_2 \\to CO_2 + 2H_2O$."
          - "סטוכיומטריה משתמשת ביחסים המולריים במשוואה המאוזנת לחישוב כמויות ותפוקות. המגיב המגביל הוא המגיב שאוזל ראשון ומכתיב את התמורה המרבית התאורטית של התוצרים."
      - title: "התאוריה הקינטית של הגזים וחוק הגזים האידיאלי"
        points:
          - "התאוריה הקינטית של הגזים ממדלת גז כאוסף של נקודות חומריות זעירות הנעות ללא הרף בתנועה אקראית וקווית. החלקיקים אינם תופסים נפח ביחס למכל, אינם מפעילים כוחות משיכה זה על זה, ומתנגשים בהתנגשויות אלסטיות לחלוטין."
          - "הטמפרטורה עומדת ביחס ישר לאנרגיה הקינטית הממוצעת של המולקולות: $\\text{KE}_{\\text{avg}} = \\frac{3}{2} k_B T$. בטמפרטורה גבוהה יותר, החלקיקים נעים במהירות גבוהה יותר ומתנגשים בדפנות המכל בתדירות ובעוצמה רבות יותר."
          - "חוק הגזים האידיאלי מאחד את חוקי בויל, שארל ואבוגדרו למשוואת מצב אלגנטית אחת: $PV = nRT$, כאשר $P$ מייצג לחץ, $V$ נפח, $n$ מולים, $T$ טמפרטורה מוחלטת בקלווין ($K = ^\\circ\\text{C} + 273.15$), ו-$R \\approx 8.314\\text{ J/(mol}\\cdot\\text{K)}$."
          - "גזים ממשיים סוטים מהתנהגות אידיאלית בלחצים גבוהים במיוחד (שבהם נפח החלקיקים עצמם אינו זניח) ובטמפרטורות נמוכות מאוד (שבהן כוחות המשיכה הבין-מולקולריים מושכים את החלקיקים). משוואת ואן דר ואלס מתקנת סטיות אלה."
      - title: "מעברי פאזה, חום כמוס ודיאגרמות מצב"
        points:
          - "מעברי מצב צבירה (מוצק, נוזל, גז, פלזמה) נובעים מהמאבק בין האנרגיה הקינטית התרמית (המרחיקה חלקיקים) לבין הכוחות הבין-מולקולריים (המחברים חלקיקים)."
          - "במהלך מעבר פאזה (כגון היתוך קרח או רתיחת מים), הטמפרטורה נשארת קבועה לחלוטין חרף המשך הזרמת החום. אנרגיה זו — המכונה חום כמוס ($\\Delta H_{\\text{fusion}}$ או $\\Delta H_{\\text{vaporization}}$) — מושקעת בשבירת קשרים בין-מולקולריים ולא בהעלאת המהירות הממוצעת של החלקיקים."
          - "דיאגרמת פאזות ממפה את גבולות שיווי המשקל התרמודינמי בין לחץ לטמפרטורה: המראה (מוצק ישירות לגז), היתוך/קיפאון (מוצק לנוזל), ואידוי/עיבוי (נוזל לגז)."
          - "הנקודה המשולשת היא השילוב הייחודי של טמפרטורה ולחץ שבו מוצק, נוזל וגז מתקיימים יחד בשיווי משקל דינמי. מעבר לנקודה הקריטית ($T_c, P_c$), נעלם הגבול בין נוזל לגז והחומר הופך לנוזל סופר-קריטי — בעל חדירות של גז וכושר המסה של נוזל (בשימוש נרחב במיצוי קפאין מפולי קפה ובתעשייה נקייה)."
    trivia:
      - type: multiple_choice
        question: "מהו ערכו המספרי המדויק של קבוע אבוגדרו, המגדיר את מספר החלקיקים במול אחד של חומר?"
        options:
          - "6.022 × 10²³"
          - "3.00 × 10⁸"
          - "1.602 × 10⁻¹⁹"
          - "6.626 × 10⁻³⁴"
        correct: 0
        explanation: "קבוע אבוגדרו (כ-6.022 כפול 10 בחזקת 23 חלקיקים למול) קובע את כמות החלקיקים המדויקת הקיימת במול חומר בודד."
      - type: multiple_choice
        question: "במשוואת חוק הגזים האידיאלי PV = nRT, באיזה סולם טמפרטורה חובה להשתמש תמיד עבור T?"
        options:
          - "סולם קלווין (טמפרטורה מוחלטת)"
          - "סולם צלזיוס"
          - "סולם פרנהייט"
          - "סולם רנקין"
        correct: 0
        explanation: "משוואות תרמודינמיקה מחייבות שימוש בטמפרטורה מוחלטת בקלווין (K = C + 273.15), מפני שאפס קלווין מייצג את האפס המוחלט שבו האנרגיה הקינטית מינימלית."
      - type: multiple_choice
        question: "איזו נקודה ייחודית בדיאגרמת פאזות מייצגת את הלחץ והטמפרטורה שבהם מוצק, נוזל וגז מתקיימים יחדיו בשיווי משקל בו-זמני?"
        options:
          - "הנקודה המשולשת (Triple Point)"
          - "הנקודה הקריטית (Critical Point)"
          - "הנקודה האוטקטית (Eutectic Point)"
          - "נקודת הרתיחה הנורמלית"
        correct: 0
        explanation: "הנקודה המשולשת היא המצב התרמודינמי הייחודי שבו שלושת מצבי הצבירה של החומר נמצאים בשיווי משקל דינמי סימולטני."
      - type: multiple_choice
        question: "מדוע טמפרטורת מים רותחים נשארת קבועה ב-100 מעלות צלזיוס בלחץ אטמוספרי למרות המשך חימום אגרסיבי על האש?"
        options:
          - "אנרגיית החום הנקלטת מושקעת כחום כמוס של אידוי כדי לנתק את קשרי המימן בין מולקולות הנוזל"
          - "עודף החום הופך מיד לאנרגיית קשר גרעינית בגרעין החמצן"
          - "הקיטור בולע את כל האנרגיה הקינטית של הנוזל הנותר"
          - "המולקולות מתפשטות וגורמות לקירור מיידי בחזרה ל-100 מעלות"
        correct: 0
        explanation: "במעבר פאזה מסדר ראשון, האנרגיה המושקעת (חום כמוס) אינה מעלה את מהירות החלקיקים (טמפרטורה), אלא משמשת לניתוק הקשרים הבין-מולקולריים למעבר לגז."
      - type: multiple_choice
        question: "אם גז הנתון במכל קשיח בעל נפח קבוע מחומם מ-300 קלווין ל-600 קלווין, מה יקרה ללחץ הפנימי שלו לפי חוק גה-ליסק?"
        options:
          - "הלחץ יוכפל פי 2"
          - "הלחץ ירד בחצי"
          - "הלחץ יגדל פי 4"
          - "הלחץ יישאר ללא שינוי"
        correct: 0
        explanation: "בנפח קבוע, הלחץ עומד ביחס ישר לטמפרטורה המוחלטת (P proportional to T). הכפלת הטמפרטורה בקלווין מכפילה את מהירות החלקיקים ועוצמת ההתנגשויות, ולכן מכפילה את הלחץ."
      - type: multiple_choice
        question: "בשריפת מתאן: CH4 + 2 O2 → CO2 + 2 H2O, כמה מולים של חמצן גזי (O2) דרושים לתגובה מלאה עם 3 מולים של מתאן?"
        options:
          - "6 מולים"
          - "3 מולים"
          - "2 מולים"
          - "12 מולים"
        correct: 0
        explanation: "היחס הסטוכיומטרי בין CH4 ל-O2 הוא 1:2. לכן, עבור 3 מולים של מתאן נדרשים בדיוק 3 כפול 2 = 6 מולים של חמצן."
      - type: multiple_choice
        question: "מהו נוזל סופר-קריטי (Supercritical Fluid), הנוצר בטמפרטורות ובלחצים הגבוהים מהנקודה הקריטית?"
        options:
          - "מצב צבירה ייחודי המשלב יכולת פעפוע וחדירה כמו גז עם צפיפות וכושר המסה של נוזל"
          - "פלזמה שבה נתלשו כל האלקטרונים מגרעיני האטומים"
          - "מוצק הזורם דרך צינורות באפס חיכוך מוחלט"
          - "גז שמתעבה מעצמו לנוזל בכל טמפרטורה שהיא"
        correct: 0
        explanation: "מעבר לנקודה הקריטית נעלם קו הגבול בין נוזל לגז, והחומר רוכש תכונות ביניים המאפשרות לו לחדור כמו גז ולהמיס חומרים כמו נוזל יעיל."
      - type: multiple_choice
        question: "איזה חוק גזים אמפירי קובע כי בטמפרטורה קבועה, לחץ הגז ונפחו עומדים ביחס הפוך (P1V1 = P2V2)?"
        options:
          - "חוק בויל (Boyle's Law)"
          - "חוק שארל (Charles's Law)"
          - "חוק אבוגדרו (Avogadro's Law)"
          - "חוק הנרי (Henry's Law)"
        correct: 0
        explanation: "רוברט בויל הוכיח בשנת 1662 כי דחיסת גז למחצית מנפחו מכפילה את לחצו, בתנאי שהטמפרטורה נשמרת קבועה."
      - type: multiple_choice
        question: "מהי המסה המולרית של מולקולת חמצן (O2), בהינתן שהמשקל האטומי של חמצן יסודי הוא כ-16.00 גרם למול?"
        options:
          - "32.00 גרם למול"
          - "16.00 גרם למול"
          - "8.00 גרם למול"
          - "64.00 גרם למול"
        correct: 0
        explanation: "מולקולת חמצן מורכבת משני אטומי חמצן (O2), ולכן מסתה המולרית היא 2 כפול 16.00 = 32.00 גרם למול."
      - type: multiple_choice
        question: "איזה מעבר פאזה מתרחש כאשר קרח יבש (CO2 מוצק) הופך ישירות לגז פחמן דו-חמצני בלחץ אטמוספרי ללא הפיכה לנוזל?"
        options:
          - "המראה (סובלימציה)"
