        correct: 0
        explanation: "המראה היא מעבר ישיר ממוצק לגז ללא מעבר דרך הפאזה הנוזלית, ומתרחשת כאשר הלחץ האטמוספרי נמוך מלחץ הנקודה המשולשת של החומר."
      - type: multiple_choice
        question: "כיצד מכונה המגיב שאוזל ראשון במהלך תגובה כימית ומכתיב בכך את הכמות המרבית של תוצרים שניתן לקבל?"
        options:
          - "מגיב מגביל (Limiting Reagent)"
          - "מגיב עודף"
          - "תוצר ביניים קטליטי"
          - "נוזל אינרטי"
        correct: 0
        explanation: "המגיב המגביל מצוי בכמות הסטוכיומטרית הקטנה ביותר, וכאשר הוא מתכלה לחלוטין התגובה נעצרת ונקבעת התמורה המרבית."
      - type: multiple_choice
        question: "באילו תנאים פיזיקליים סוטים גזים ממשיים באופן המובהק ביותר מהתנהגות של גז אידיאלי?"
        options:
          - "בלחץ גבוה מאוד ובטמפרטורה נמוכה מאוד"
          - "בלחץ נמוך מאוד ובטמפרטורה גבוהה מאוד"
          - "בטמפרטורת החדר ובלחץ אטמוספרי רגיל"
          - "באפס קלווין ובלחץ אפס"
        correct: 0
        explanation: "בלחץ גבוה נפח החלקיקים עצמם הופך למשמעותי ביחס למכל, ובטמפרטורה נמוכה כוחות המשיכה מושכים את החלקיקים זה לזה, בניגוד להנחות גז אידיאלי."
      - type: multiple_choice
        question: "על פי חוק הלחצים החלקיים של דלטון, מהו הלחץ הכולל שמפעילה תערובת של גזים שאינם מגיבים ביניהם?"
        options:
          - "סכום הלחצים החלקיים של כל אחד מהגזים המרכיבים את התערובת"
          - "מכפלת הלחצים החלקיים מחולקת בנפח המכל"
          - "הלחץ של הגז הכבד ביותר בתערובת בלבד"
          - "ההפרש בין הלחץ האטמוספרי ללחץ האדים"
        correct: 0
        explanation: "חוק דלטון קובע כי הלחץ הכולל של תערובת גזים שווה לסכום הלחצים החלקיים שכל גז היה מפעיל אילו עמד לבדו במכל: P_total = P1 + P2 + ..."
      - type: multiple_choice
        question: "איזה נפח תופס בדיוק מול אחד של גז אידיאלי בתנאים סטנדרטיים של טמפרטורה ולחץ (STP: אפס מעלות צלזיוס ו-1 אטמוספירה)?"
        options:
