      - type: multiple_choice
        question: "מה קורה ללחץ האדים של נוזל סגור ככל שמעלים את הטמפרטורה שלו?"
        options:
          - "לחץ האדים עולה באופן מעריכי לפי משוואת קלאוזיוס-קלפרון"
          - "לחץ האדים יורד כיוון שמולקולות גז בורחות מהמערכת"
          - "לחץ האדים נשאר קבוע לחלוטין עד להגעה לרתיחה"
          - "לחץ האדים מתאפס בנקודה הקריטית"
        correct: 0
        explanation: "עם עליית הטמפרטורה, לחלק גדול יותר של מולקולות בנוזל יש אנרגיה קינטית מספקת להתגבר על כוחות המשיכה ולעבור לפאזה הגזית, ולכן לחץ האדים מזנק מעריכית."

  - id: thermodynamics_equilibrium_kinetics
    title: "4. תרמודינמיקה כימית, קינטיקה ושיווי משקל"
    description: >
      שליטה בכוחות המניעים שינויים כימיים: אנתלפיה, אנטרופיה, ספונטניות לפי אנרגיית גיבס החופשית, קצבי תגובה, זרזים ועקרון לה שטלייה בשיווי משקל דינמי.
    cards:
      - title: "אנתלפיה (ΔH), אנטרופיה (ΔS) ואנרגיית גיבס החופשית (ΔG)"
        figure:
          title: "דיאגרמת מהלך תגובה: תגובה מזורזת לעומת לא מזורזת"
          svg: >
            <svg viewBox="0 0 520 150" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-height:150px;">
              <line x1="50" y1="125" x2="480" y2="125" stroke="currentColor" stroke-width="1.5"/>
              <line x1="50" y1="125" x2="50" y2="15" stroke="currentColor" stroke-width="1.5"/>
              <text x="470" y="140" font-size="10" fill="currentColor" text-anchor="end">התקדמות התגובה ←</text>
              <text x="35" y="25" font-size="10" fill="currentColor" transform="rotate(-90 35 25)">אנרגיה פוטנציאלית ←</text>

              <line x1="50" y1="90" x2="120" y2="90" stroke="#3b82f6" stroke-width="3"/>
              <text x="80" y="82" font-size="11" font-weight="bold" fill="#3b82f6">מגיבים</text>

              <path d="M 120 90 Q 220 10 320 115" stroke="#ef4444" stroke-width="2" fill="none"/>
              <text x="220" y="22" font-size="10" font-weight="bold" fill="#ef4444" text-anchor="middle">Ea ללא זרז</text>

              <path d="M 120 90 Q 220 50 320 115" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
              <text x="220" y="62" font-size="10" font-weight="bold" fill="#10b981" text-anchor="middle">Ea עם זרז</text>

              <line x1="320" y1="115" x2="420" y2="115" stroke="#8b5cf6" stroke-width="3"/>
              <text x="370" y="110" font-size="11" font-weight="bold" fill="#8b5cf6">תוצרים</text>

              <line x1="440" y1="90" x2="440" y2="115" stroke="#f59e0b" stroke-width="2"/>
              <text x="450" y="105" font-size="10" font-weight="bold" fill="#f59e0b">ΔH &lt; 0 (אקסותרמי)</text>
            </svg>
          caption: "זרזים מאיצים תגובות על ידי הנמכת מחסום אנרגיית השפעול ($E_a$) מבלי לשנות את המצבים התרמודינמיים ההתחלתיים והסופיים ($\\Delta H$, $\\Delta G$)."
        points:
          - "תגובות כימיות נשלטות על ידי שני עקרונות תרמודינמיים: הנטייה למינימום אנרגיה פוטנציאלית (אנתלפיה, H) והנטייה למקסימום אי-סדר ומיקרו-מצבים זמינים (אנטרופיה, S)."
          - "שינוי באנתלפיה ($\\Delta H = H_{\\text{products}} - H_{\\text{reactants}}$): תגובות אקסותרמיות ($\\Delta H < 0$) פולטות חום לסביבה מכיוון שהקשרים החדשים שנוצרו חזקים ויציבים יותר מהקשרים שהתפרקו. תגובות אנדותרמיות ($\\Delta H > 0$) בולעות חום."
          - "שינוי באנטרופיה ($\\Delta S$): החוק השני של התרמודינמיקה קובע כי האנטרופיה הכוללת של היקום חייבת לגדול בכל תהליך ספונטני ($\\Delta S_{\\text{univ}} > 0$). תגובות המייצרות יותר מולי גז או מפזרות חום לסביבה מגדילות את האנטרופיה."
          - "אנרגיית גיבס החופשית מכריעה ספונטניות בלחץ ובטמפרטורה קבועים: $\\Delta G = \\Delta H - T\\Delta S$. כאשר $\\Delta G < 0$, התגובה ספונטנית ואקסרגונית; כאשר $\\Delta G > 0$, התגובה אינה ספונטנית (אנדרגונית); וכאשר $\\Delta G = 0$, המערכת נמצאת בשיווי משקל תרמודינמי מושלם."
      - title: "קינטיקה כימית, תאוריית ההתנגשויות וקטליזה"
        points:
          - "תרמודינמיקה קובעת האם תגובה יכולה להתרחש; קינטיקה כימית מכתיבה באיזו מהירות היא תתרחש בפועל. תגובה יכולה להיות מועדפת תרמודינמית לחלוטין (ערך $\\Delta G$ שלילי ענק, כמו הפיכת יהלום לגרפיט) אך לכודה קינטית במשך מיליארדי שנים בשל מחסום אנרגיית שפעול ($E_a$) עצום."
          - "תאוריית ההתנגשויות מורה כי כדי שמולקולות יגיבו עליהן להתנגש בשני תנאים מחייבים: (1) אנרגיה קינטית העולה על סף אנרגיית השפעול ($E \\ge E_a$), ו-(2) כיווניות מרחבית מדויקת המאפשרת חפיפת אורביטלים מתאימה."
          - "משוואת ארניוס ממדלת מתמטית את קבוע קצב התגובה: $k = A e^{-E_a / (RT)}$. העלאת הטמפרטורה מגדילה באופן מעריכי את חלק המולקולות שבידיהן אנרגיה מספקת לחציית המחסום ($E \\ge E_a$), ומאיצה תגובות בחדות."
          - "זרזים (קטליזטורים, כולל זרזים תעשייתיים כמו פלטינה ואנזימים ביולוגיים) מספקים מסלול תגובה חלופי בעל אנרגיית שפעול נמוכה משמעותית. הזרז מאיץ את הקצב קדימה ואחורה במידה שווה מבלי להישחק, ואינו משנה את $\\Delta H$, $\\Delta G$ או את קבוע שיווי המשקל $K_{\\text{eq}}$."
      - title: "שיווי משקל כימי דינמי ועקרון לה שטלייה"
        points:
          - "מרבית התגובות הכימיות הן הפיכות. שיווי משקל דינמי מושג כאשר קצב התגובה הישירה שווה בדיוק לקצב התגובה ההפוכה ($r_{\\text{forward}} = r_{\\text{reverse}}$). ברמה המאקרוסקופית ריכוזי המגיבים והתוצרים קבועים לחלוטין, אך ברמה המיקרוסקופית מולקולות ממשיכות להגיב ללא הרף."
          - "קבוע שיווי המשקל ($K_{\\text{eq}}$) עבור התגובה $aA + bB \\rightleftharpoons cC + dD$ נתון לפי חוק פעולת המסות: $K_{\\text{eq}} = \\frac{[C]^c [D]^d}{[A]^a [B]^b}$. אם $K_{\\text{eq}} \\gg 1$, התוצרים דומיננטיים בשיווי משקל; אם $K_{\\text{eq}} \\ll 1$, המגיבים דומיננטיים."
          - "הקשר בין תרמודינמיקה לשיווי משקל מנוסח במשוואה היסודית: $\\Delta G^\\circ = -RT \\ln(K_{\\text{eq}})$. ערך $\\Delta G^\\circ$ שלילי חזק גורם לקבוע שיווי משקל גדול ביותר."
          - "עקרון לה שטלייה קובע כי אם מופעל שינוי חיצוני (בלחץ, בטמפרטורה או בריכוז) על מערכת בשיווי משקל, המערכת תסיט את שיווי המשקל בכיוון המקטין את ההפרעה ומבטל אותה חלקית. בתהליך הבר-בוש לייצור אמוניה ($N_2 + 3H_2 \\rightleftharpoons 2NH_3 + \\text{חום}$), הגדלת לחץ מסיטה את התגובה ימינה (לכיוון פחות מולי גז), בעוד קירור מסיט את התגובה לצד התוצר האקסותרמי."
    trivia:
      - type: multiple_choice
        question: "באילו תנאים תרמודינמיים מובטח שתגובה כימית תהיה ספונטנית בכל טמפרטורה שהיא?"
        options:
          - "שינוי אנתלפיה שלילי (ΔH < 0, אקסותרמי) ושינוי אנטרופיה חיובי (ΔS > 0)"
          - "שינוי אנתלפיה חיובי (ΔH > 0) ושינוי אנטרופיה שלילי (ΔS < 0)"
          - "כאשר האנתלפיה והאנטרופיה שוות לאפס בדיוק"
          - "כאשר התגובה מתרחשת באפס המוחלט בלבד"
        correct: 0
        explanation: "לפי הנוסחה Delta G = Delta H - T Delta S, כאשר Delta H שלילי ו-Delta S חיובי, הביטוי תמיד שלילי בכל T, ולכן התגובה תמיד ספונטנית."
      - type: multiple_choice
        question: "כיצד זרז (קטליזטור או אנזים) מאיץ תגובה כימית מבלי להיאכל או להשתנות במהלך התגובה?"
        options:
          - "הוא מספק מנגנון תגובה חלופי בעל אנרגיית שפעול (Ea) נמוכה יותר"
          - "הוא מגדיל את הפרש האנרגיה החופשית הכוללת (ΔG) בין המגיבים לתוצרים"
          - "הוא מעלה את הטמפרטורה המקומית של המולקולות המתנגשות"
          - "הוא משנה לצמיתות את קבוע שיווי המשקל K_eq לטובת התוצרים"
        correct: 0
        explanation: "זרז מנמיך את מחסום האנרגיה Ea, וכך אחוז גבוה בהרבה מההתנגשויות מסתיים בתגובה מוצלחת בכל שנייה. הוא אינו משנה את ערכי Delta H או Delta G."
      - type: multiple_choice
        question: "מה נכון לגבי קצבי התגובה הישירה וההפוכה כאשר מערכת כימית מגיעה לשיווי משקל דינמי?"
        options:
          - "קצב התגובה הישירה שווה בדיוק לקצב התגובה ההפוכה"
          - "כל התגובות הכימיות פסקו לחלוטין ברמה המולקולרית"
          - "ריכוז המגיבים חייב להיות שווה במדויק לריכוז התוצרים"
          - "קצב התגובה הישירה מתאפס בעוד קצב התגובה ההפוכה מואץ"
        correct: 0
        explanation: "שיווי משקל דינמי מתקיים כאשר התגובה ממשיכה להתרחש בשני הכיוונים באותו קצב בדיוק, ולכן הריכוזים נותרים קבועים בזמן."
      - type: multiple_choice
        question: "על פי עקרון לה שטלייה, כיצד תשפיע הגדלת הלחץ על המערכת הבאה: N2(g) + 3 H2(g) ⇌ 2 NH3(g)?"
        options:
          - "שיווי המשקל ייטה ימינה (לטובת יצירת NH3) כיוון שיש פחות מולי גז בצד התוצרים"
          - "שיווי המשקל ייטה שמאלה כיוון שחנקן כבד יותר מאמוניה"
          - "קצב התגובה יצנח מיד לאפס עקב דחיסת המולקולות"
          - "קבוע שיווי המשקל K_eq יקטן פי 4"
        correct: 0
        explanation: "בצד המגיבים יש 4 מולי גז ובצד התוצרים 2 מולי גז בלבד. הגדלת לחץ גורמת למערכת להסיט את שיווי המשקל לצד עם פחות מולי גז כדי להפחית את הלחץ."
      - type: multiple_choice
        question: "מה מלמדת משוואת ארניוס (k = A e^(-Ea/RT)) על קצב התרחשותן של תגובות כימיות?"
        options:
          - "קבוע קצב התגובה מזנק באופן מעריכי עם עליית הטמפרטורה"
          - "אנרגיית השפעול יורדת לאפס בטמפרטורות גבוהות"
          - "קצב התגובה תלוי אך ורק בנפח המכל שבו היא מתרחשת"
          - "תגובות כימיות מאטות ככל שהאנרגיה הקינטית של החלקיקים עולה"
        correct: 0
        explanation: "כיוון שהטמפרטורה T מצויה במכנה של החזקה השלילית, עלייתה מגדילה מעריכית את שבריר ההתנגשויות בעלות אנרגיה מעל מחסום השפעול Ea."
      - type: multiple_choice
        question: "מה מעיד ערך שלילי של שינוי האנתלפיה (ΔH < 0) על תהליך כימי?"
        options:
          - "התגובה אקסותרמית ופולטת חום ואנרגיה לסביבה"
          - "התגובה אנדותרמית ובולעת חום מהסביבה"
          - "התגובה יוצרת דרגות חופש מולקולריות חדשות"
          - "התגובה מתרחשת באנטרופיה קבועה"
        correct: 0
        explanation: "ערך Delta H שלילי מראה שלאנרגיית הקשרים בתוצרים פוטנציאל נמוך יותר מאשר במגיבים, כך שעודף האנרגיה נפלט כחום (אקסותרמי)."
      - type: multiple_choice
        question: "איזו משוואה יסודית מקשרת בין השינוי באנרגיית גיבס הסטנדרטית (ΔG°) לקבוע שיווי המשקל (K_eq) של תגובה?"
        options:
          - "ΔG° = -RT ln(K_eq)"
          - "ΔG° = K_eq / (RT)"
          - "ΔG° = ΔH° + T ln(K_eq)"
          - "ΔG° = -n F E°_cell / K_eq"
        correct: 0
        explanation: "הקשר התרמודינמי הבסיסי לשיווי משקל כימי מוגדר כ-Delta G deg = -RT ln(K_eq). כאשר Delta G deg שלילי, מתקבל K_eq גדול מ-1 המעדיף תוצרים."
      - type: multiple_choice
        question: "מהי המשמעות הפיזיקלית של ׳מצב המעבר׳ (Transition State) בגרף פרופיל האנרגיה של תגובה?"
        options:
          - "מבנה מולקולרי רגעי בעל האנרגיה הפוטנציאלית המרבית שבו קשרים ישנים נשברים וחדשים נוצרים"
          - "מצב ביניים יציב בעל אנרגיה מינימלית שבו חומרים נחים לאורך זמן"
          - "הנקודה שבה הזרז נקשר לצמיתות לדפנות המכל"
          - "המצב שבו כל האלקטרונים עברו לחלל הממס"
        correct: 0
        explanation: "מצב המעבר מייצג את פסגת מחסום האנרגיה לאורך ציר התגובה — סידור גאומטרי מעורער ולא-יציב של קשרים בתהליך שבירה ובנייה."
      - type: multiple_choice
        question: "מדוע תגובות אקסותרמיות הפיכות מניבות תפוקה נמוכה יותר של תוצרים בטמפרטורות גבוהות לפי עקרון לה שטלייה?"
        options:
          - "חום מתפקד כתוצר בתגובה אקסותרמית, ולכן הוספתו מסיטה את שיווי המשקל בחזרה למגיבים"
          - "טמפרטורה גבוהה מפרקת את המבנה האלקטרוני של המגיבים"
          - "אנרגיית השפעול גדלה ביחס ישר לטמפרטורה"
          - "תגובות אקסותרמיות הופכות תמיד לאנדותרמיות בחימום"
        correct: 0
        explanation: "בתגובה אקסותרמית (מגיבים חום + תוצרים), חום הוא מעין תוצר. חימום המערכת מהווה הפרעה המאלצת אותה להסיט שיווי משקל שמאלה."
      - type: multiple_choice
        question: "מהו הגורם העיקרי המונע מיהלום להפוך באופן ספונטני לגרפיט בטמפרטורת החדר, על אף שלגרפיט אנרגיית גיבס נמוכה יותר (ΔG < 0)?"
        options:
          - "מחסום אנרגיית שפעול (Ea) אדיר, ההופך את קצב התהליך לאפסי מבחינה קינטית"
          - "סריג היהלום ניטרלי לחלוטין מבחינה חשמלית"
          - "אטומי פחמן ביהלום נטולי אלקטרוני ערכיות לשינוי הכלאה"
          - "הלחץ האטמוספרי מייצב את היהלום לעומת גרפיט"
        correct: 0
        explanation: "המעבר מיהלום לגרפיט ספונטני תרמודינמית, אך פירוק רשת הקשרים הקוולנטיים הטטראהדרלית הקשיחה של היהלום דורש אנרגיית שפעול עצומה הנועלת אותו קינטית."
      - type: multiple_choice
        question: "בקינטיקה כימית רב-שלבית, מה קובע את קצב התגובה הכולל של התהליך כולו?"
        options:
          - "השלב האלמנטרי האיטי ביותר, המכונה השלב קובע המהירות (RDS)"
          - "השלב המהיר ביותר במסלול התגובה"
          - "הממוצע החשבוני של מהירויות כל השלבים יחד"
          - "השלב בעל אנרגיית השפעול הנמוכה ביותר"
        correct: 0
        explanation: "המהירות הכוללת של מערכת סדרתית מוגבלת תמיד על ידי צוואר הבקבוק האיטי ביותר שלה — השלב קובע המהירות (Rate-Determining Step)."
      - type: multiple_choice
        question: "מהו הביטוי הנכון לקבוע שיווי המשקל K_c בתגובה: 2 SO2(g) + O2(g) ⇌ 2 SO3(g)?"
        options:
          - "K_c = [SO3]² / ([SO2]² [O2])"
          - "K_c = ([SO2]² [O2]) / [SO3]²"
          - "K_c = [SO3] / ([SO2] [O2])"
          - "K_c = 2 [SO3] / (2 [SO2] + [O2])"
        correct: 0
        explanation: "לפי חוק פעולת המסות, ריכוזי התוצרים מועלים בחזקת המקדמים הסטוכיומטריים שלהם במונה, מחולקים בריכוזי המגיבים בחזקת מקדמיהם במכנה."
      - type: multiple_choice
        question: "מה קובע החוק השני של התרמודינמיקה לגבי מערכות מבודדות ותהליכים ספונטניים?"
        options:
          - "האנטרופיה הכוללת של היקום גדלה בכל תהליך ספונטני"
          - "אנרגיה אינה ניתנת להמרה בין חום לעבודה מכנית"
          - "האנרגיה הפנימית של מערכת מבודדת דועכת לאפס עם הזמן"
          - "האנטרופיה מגיעה לערכה המרבי רק באפס המוחלט"
        correct: 0
        explanation: "החוק השני של התרמודינמיקה קובע כי שינויים ספונטניים מפזרים אנרגיה ומגדילים את סך האנטרופיה ביקום כולו (Delta S_univ > 0)."
      - type: multiple_choice
        question: "כיצד הגדלת שטח הפנים של מגיב מוצק (כגון כתישת טבליה לאבקה דקיקה) מאיצה את קצב התגובה?"
        options:
          - "היא חושפת מספר רב יותר של חלקיקי מגיב להתנגשויות פעילות בכל יחידת זמן"
          - "היא מנמיכה את אנרגיית השפעול של התגובה הכימית"
          - "היא מעלה את הטמפרטורה הממוצעת של תערובת התגובה"
          - "היא משנה את הכלאת האורביטלים של אטומי המשטח"
        correct: 0
        explanation: "בתגובות הטרוגניות המתרחשות בממשק המגע, כתישה חושפת שטח פנים נרחב המגדיל דרמטית את תדירות ההתנגשויות בין מולקולות המגיבים."
      - type: multiple_choice
        question: "מה קורה לערכו המספרי של קבוע שיווי המשקל K_eq כאשר מוסיפים זרז לתגובה הפיכה?"
        options:
          - "K_eq נשאר ללא כל שינוי"
          - "K_eq גדל באופן משמעותי"
          - "K_eq קטן כדי לשמר יציבות מגיבים"
          - "K_eq מתנדנד במחזוריות בין ערכים שונים"
        correct: 0
        explanation: "זרז מאיץ את התגובה הישירה וההפוכה בדיוק באותו יחס על ידי הנמכת Ea, ולכן יחס קבועי הקצב וערכו של K_eq אינם משתנים כלל."

  - id: organic_chemistry_materials_energy
    title: "5. כימיה אורגנית, פולימרים ואנרגיה אלקטרוכימית"
    description: >
      חקר הארכיטקטורה המולקולרית של הפחמן, פולימרים סינתטיים מודרניים, תרמודינמיקה של תגובות חמצון-חיזור, תאים גלווניים וסוללות ליתיום-יון.
    cards:
      - title: "הכימיה הייחודית של הפחמן וקבוצות פונקציונליות"
        figure:
          title: "מבנה תא גלווני אלקטרוכימי"
          svg: >
            <svg viewBox="0 0 520 150" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-height:150px;">
              <rect x="50" y="50" width="130" height="85" rx="4" fill="#3b82f6" fill-opacity="0.1" stroke="#3b82f6" stroke-width="1.5"/>
              <rect x="75" y="35" width="20" height="80" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
              <text x="85" y="28" font-size="10" font-weight="bold" fill="#3b82f6" text-anchor="middle">אנודה Zn (-)</text>
              <text x="115" y="115" font-size="9" fill="currentColor">Zn → Zn²⁺ + 2e⁻</text>

              <rect x="340" y="50" width="130" height="85" rx="4" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.5"/>
              <rect x="425" y="35" width="20" height="80" fill="#f97316" stroke="#c2410c" stroke-width="1.5"/>
              <text x="435" y="28" font-size="10" font-weight="bold" fill="#ef4444" text-anchor="middle">קתודה Cu (+)</text>
              <text x="405" y="115" font-size="9" fill="currentColor">Cu²⁺ + 2e⁻ → Cu</text>

              <path d="M 85 35 L 85 15 L 435 15 L 435 35" fill="none" stroke="#eab308" stroke-width="2"/>
              <circle cx="260" cy="15" r="10" fill="#1e293b" stroke="#eab308" stroke-width="1.5"/>
              <text x="260" y="19" font-size="9" font-weight="bold" fill="#eab308" text-anchor="middle">V</text>
              <text x="260" y="32" font-size="9" fill="#eab308" text-anchor="middle">זרימת e⁻ ←</text>

              <path d="M 140 70 Q 260 40 380 70" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
              <text x="260" y="60" font-size="10" font-weight="bold" fill="#10b981" text-anchor="middle">גשר מלח (מעבר יונים)</text>
            </svg>
          caption: "תא גלווני מייצר זרם חשמלי מתגובת חמצון-חיזור ספונטנית: חמצון באנודה משחרר אלקטרונים הזורמים דרך מעגל חיצוני אל הקתודה."
        points:
          - "הפחמן הוא אבן הראשה של הכימיה האורגנית והביוכימיה הודות ליכולת השרשור (Catenation) הפנומנלית שלו: עם 4 אלקטרוני ערכיות ואלקטרושליליות מתונה (2.55), פחמן יוצר קשרים קוולנטיים יציבים עם עצמו ועם יסודות מגוונים ($H, O, N, P, S$), במבנים ישרים, מסועפים וטבעתיים."
          - "פחמימנים מהווים את השלד האורגני הבסיסי: אלקאנים מכילים קשרי סיגמא יחידים בלבד; אלקנים כוללים קשר כפול פעיל ($C=C$); אלקינים כוללים קשר משולש ($C\\equiv C$); וטבעות ארומטיות (כבנזן, $C_6H_6$) מכילות ענן אלקטרוני פאי מבוזר המעניק יציבות רזוננס חריגה."
          - "קבוצות פונקציונליות משמשות כאתרי ריאקטיביות מודולריים הקובעים את תכונות המולקולה: הידרוקסיל ($-OH$, כוהלים), קרבוניל ($C=O$, אלדהידים וקטונים), קרבוקסיל ($-COOH$, חומצות אורגניות), ואמינו ($-NH_2$, אמינים בסיסיים)."
          - "איזומריה מאפשרת למולקולות בעלות אותה נוסחה כימית להפגין תכונות שונות בתכלית. איזומרים מבניים נבדלים בסדר החיבור של האטומים, בעוד סטריאואיזומרים (כולל אננטיומרים, שהם תמונות ראי בלתי-ניתנות לחפיפה) נבדלים רק בסידור התלת-ממדי — גורם קריטי בהתאמת תרופות לקולטנים ביולוגיים."
      - title: "פולימרים, מקרומולקולות וחומרים מודרניים"
        points:
          - "פולימרים הם מקרומולקולות ענק בעלות משקל מולקולרי גבוה, הנבנות משרשור חוזר של תת-יחידות כימיות קטנות הנקראות מונומרים. פולימרים טבעיים כוללים DNA (הבנוי ממונומרי נוקלאוטידים), חלבונים (מונומרי חומצות אמינו) ותאית (מונומרי גלוקוז)."
          - "פילמור סיפוח (גידול שרשרת) מתרחש כאשר מונומרים בעלי קשר פחמן-פחמן כפול (כגון אתילן, $CH_2=CH_2$) פותחים את קשר הפאי ומתחברים לשרשרת פחמנית רציפה (ליצירת פוליאתילן, פוליפרופילן ופוליסטירן) ללא שחרור תוצרי לוואי."
          - "פילמור דחיסה (גידול בשלבים) מתרחש כאשר מונומרים בעלי שתי קבוצות פונקציונליות מגיבים זה עם זה ליצירת קשרים חדשים (כגון אסטר או אמיד) תוך פליטת מולקולת לוואי קטנה (בדרך כלל מים, $H_2O$), תהליך המייצר חומרים כמו ניילון, קוולאר ופלסטיק PET."
          - "תכונות החומר מהונדסות דרך הארכיטקטורה המולקולרית: פוליאתילן בצפיפות גבוהה (HDPE) מורכב משרשראות ליניאריות הנארזות בצפיפות ליצירת פלסטיק קשיח, בעוד פוליאתילן בצפיפות נמוכה (LDPE) כולל שרשראות מסועפות המונעות אריזה צפופה, ויוצר יריעות גמישות ושקיות."
      - title: "כימיית חמצון-חיזור (רדוקס), תאים גלווניים וסוללות"
        points:
          - "תגובות חמצון-חיזור (רדוקס) מבוססות על מעבר אלקטרונים בין חומרים. חמצון הוא אובדן אלקטרונים (עלייה בדרגת החמצון); חיזור הוא קבלת אלקטרונים (ירידה בדרגת החמצון)."
          - "תא גלווני (וולטאי) רותם תגובת חמצון-חיזור ספונטנית לייצור זרם חשמלי דרך מעגל חיצוני. חמצון מתרחש תמיד באנודה (ההדק השלילי); חיזור מתרחש תמיד בקתודה (ההדק החיובי)."
          - "גשר מלח (או מחיצה נקבובית) שומר על ניטרליות חשמלית על ידי מתן אפשרות ליונים נגדיים לנדוד בין חצאי התא, ומונע הצטברות מטען שהייתה משביתה את זרימת הזרם תוך שברירי שנייה."
          - "מתח התא ($E^\\circ_{\\text{cell}} = E^\\circ_{\\text{cathode}} - E^\\circ_{\\text{anode}}$) מודד את הכוח האלקטרו-מניע התרמודינמי. לפי משוואת נרנסט-פרדיי, $\\Delta G^\\circ = -nFE^\\circ_{\\text{cell}}$, כאשר מתח תא חיובי מייצג תהליך ספונטני ($\\Delta G < 0$)."
          - "סוללות ליתיום-יון פועלות כמנגנון ׳כיסא נדנדה׳: במהלך פריקה (הפקת זרם), יוני $Li^+$ נשלפים מהאנודה (גרפיט) ונודדים דרך אלקטרוליט אורגני כדי להשתלב בקתודה (תחמוצת קובלט), בעוד האלקטרונים זורמים במעגל החיצוני ומפעילים את המכשיר."
    trivia:
      - type: multiple_choice
        question: "באלקטרוכימיה, איזה תהליך מתרחש תמיד באנודה של כל תא אלקטרוכימי?"
        options:
          - "חמצון (מסירת אלקטרונים)"
          - "חיזור (קבלת אלקטרונים)"
          - "סינתזת פרוטונים"
          - "שיקוע מלחים ניטרליים"
        correct: 0
        explanation: "על פי ההגדרה האוניברסלית, חמצון מתרחש תמיד באנודה (Anode Oxidation), ואילו חיזור מתרחש תמיד בקתודה (Cathode Reduction)."
      - type: multiple_choice
        question: "איזו תכונה ייחודית של פחמן מאפשרת לו ליצור מיליוני תרכובות אורגניות מגוונות, מ-DNA ועד פלסטיק סינתטי?"
