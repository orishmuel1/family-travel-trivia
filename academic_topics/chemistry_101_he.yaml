id: chemistry_101_he
type: academic
icon: "⚗️"
title: "כימיה כללית ופיזיקלית למהנדסים (כימיה 101)"
description: >
  מסע מרתק ומעמיק מתוך עקרונות יסוד: מבנה האטום והאורביטלים הקוונטיים, קשרים מולקולריים,
  תרמודינמיקה כימית, קינטיקה ומערכות אנרגיה אלקטרוכימיות, מותאם למהנדסים ואנשי טכנולוגיה.
lang: he
audience: family
categories:
  - id: atomic_structure_periodic_table
    title: "1. מבנה האטום, אורביטלים קוונטיים והטבלה המחזורית"
    description: >
      פענוח הארכיטקטורה התת-אטומית של החומר: כיצד מספרים קוונטיים מעצבים את ענני האלקטרונים, מדוע יסודות מסתדרים במשפחות מחזוריות, וכיצד קליפת הערכיות מכתיבה את כלל התגובות הכימיות.
    cards:
      - title: "חלקיקים תת-אטומיים, רמות אנרגיה והאטום הקוונטי"
        figure:
          title: "קליפות אלקטרוניות וקוונטיזציית אנרגיה"
          svg: >
            <svg viewBox="0 0 520 150" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-height:150px;">
              <circle cx="100" cy="75" r="14" fill="#ef4444" opacity="0.85"/>
              <text x="100" y="79" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">גרעין</text>
              <circle cx="100" cy="75" r="32" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3,3"/>
              <circle cx="100" cy="75" r="52" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="3,3"/>
              <circle cx="100" cy="75" r="70" fill="none" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="3,3"/>
              <circle cx="122" cy="52" r="4" fill="#3b82f6"/>
              <circle cx="145" cy="50" r="4" fill="#8b5cf6"/>
              <circle cx="168" cy="55" r="4" fill="#ec4899"/>
              <text x="210" y="45" font-size="11" font-weight="bold" fill="#3b82f6">n = 1 (קליפה ראשונה, עד 2 אלקטרונים)</text>
              <text x="210" y="75" font-size="11" font-weight="bold" fill="#8b5cf6">n = 2 (קליפה שנייה, עד 8 אלקטרונים: 2s + 2p)</text>
              <text x="210" y="105" font-size="11" font-weight="bold" fill="#ec4899">n = 3 (קליפה שלישית, עד 18 אלקטרונים: 3s + 3p + 3d)</text>
              <text x="210" y="130" font-size="10" fill="currentColor" opacity="0.8">אנרגיה: E_n = -13.6 eV / n²</text>
            </svg>
          caption: "אלקטרונים מאכלסים קליפות אנרגיה בדידות ומקוונטטות ($n=1,2,3$). מעברים ביניהן פולטים או בולעים פוטונים באורכי גל מדויקים."
        points:
          - "במרכז כל אטום ניצב גרעין צפוף ביותר המכיל פרוטונים בעלי מטען חיובי ונייטרונים ניטרליים, המרכזים מעל 99.9% ממסת האטום בנפח הקטן פי 100,000 מנפח האטום כולו."
          - "מסביב לגרעין משתרע ענן אלקטרונים הנשלט על ידי עקרונות מכניקת הקוונטים. במקום לנוע במסלולים מעגליים קבועים ככוכבי לכת, האלקטרונים מאכלסים פונקציות גל תלת-ממדיות המגדירות צפיפות הסתברות הימצאות."
          - "המספר הקוונטי הראשי ($n = 1, 2, 3, \\dots$) קובע את המרחק הממוצע של הקליפה מהגרעין ואת רמת האנרגיה הבסיסית שלה. באטומים דמויי מימן, אנרגיית האלקטרון מקוונטטת לפי הנוסחה $E_n = -\\frac{13.6\\text{ eV}}{n^2}$."
          - "עקרון האיסור של פאולי קובע כי אין שני אלקטרונים באותו אטום שיכולים לחלוק את אותם ארבעה מספרים קוונטיים בדיוק. כיוון שכל אורביטל יכול להכיל לכל היותר שני אלקטרונים בעלי ספין מנוגד ($+\\frac{1}{2}$ ו-$-\\frac{1}{2}$), האלקטרונים נערמים בקליפות גבוהות יותר ומונעים מהחומר לקרוס לצפיפות אינסופית."
      - title: "אורביטלים אטומיים (s, p, d, f) והיערכות אלקטרונית"
        points:
          - "האורביטלים מחולקים לפי מספר קוונטי זוויתי: אורביטלי s כדוריים (1 בכל קליפה, עד 2 אלקטרונים), אורביטלי p בצורת משקולת (3 בכל קליפה, עד 6 אלקטרונים), אורביטלי d מורכבים (5 בכל קליפה, עד 10 אלקטרונים), ואורביטלי f (7 בכל קליפה, עד 14 אלקטרונים)."
          - "עקרון אאופבאו (מגרמנית: ׳בנייה׳) קובע כי אלקטרונים מאכלסים תמיד את תת-הקליפה הפנויה בעלת האנרגיה הנמוכה ביותר: $1s \\to 2s \\to 2p \\to 3s \\to 3p \\to 4s \\to 3d$. אורביטל 4s מתמלא לפני 3d בשל אפקטי חדירה וסיכוך אלקטרוסטטיים."
          - "כלל הונד מורה כי כאשר קיימים אורביטלים מנוונים שווי-אנרגיה (כגון שלושת תת-האורביטלים של 2p), אלקטרונים יאכלסו תחילה אורביטלים נפרדים בעלי ספינים מקבילים לפני שיצטמדו, כדי למזער את כוחות הדחייה החשמלית ביניהם."
          - "אלקטרוני הקליפה החיצונית ביותר — אלקטרוני הערכיות — מהווים את ממשק ה-API הכימי של האטום. בעוד אלקטרוני הליבה מוגנים עמוק בפוטנציאל הגרעין, אלקטרוני הערכיות יוצרים קשרים כימיים ומוליכים זרם חשמלי."
      - title: "מגמות מחזוריות: אלקטרושליליות, אנרגיית יינון ורדיוס אטומי"
        points:
          - "הטבלה המחזורית מסודרת לפי מספר אטומי Z (מספר הפרוטונים). יסודות באותו טור אנכי חולקים מבנה קליפת ערכיות זהה ולכן מפגינים תכונות כימיות דומות (לדוגמה, מתכות אלקליות בטור 1 עם אלקטרון ערכיות בודד, או הלוגנים בטור 17 עם 7 אלקטרונים)."
          - "הרדיוס האטומי קטן משמאל לימין לאורך שורה בטבלה, מכיוון שהמטען החיובי הגדל של הגרעין מושך את ענן האלקטרונים בעוצמה רבה יותר בעוד הסיכוך נשאר דומה. לאורך טור מלמעלה למטה, הרדיוס גדל בחדות עם תוספת קליפות אנרגיה חדשות."
          - "אנרגיית יינון — האנרגיה הנדרשת לסילוק אלקטרון מאטום ניטרלי במצב גזי — עולה משמאל לימין לאורך מחזור ויורדת במורד טור. גזים אצילים מתאפיינים באנרגיית יינון גבוהה במיוחד הודות לקליפת שמינייה יציבה וסגורה."
          - "אלקטרושליליות מודדת את כוח המשיכה היחסי של אטום על זוג אלקטרונים משותף בקשר כימי. פלואור הוא היסוד האלקטרושלילי ביותר (3.98 בסולם פאולינג), בעוד פרנציום וצזיום הם הנמוכים ביותר (כ-0.7), הבדל המכתיב האם הקשר יהיה קוולנטי טהור, קוטבי או יוני."
    trivia:
      - type: multiple_choice
        question: "איזה עקרון קוונטי יסודי קובע כי אין שני אלקטרונים באטום שיכולים להחזיק באותם ארבעה מספרים קוונטיים בדיוק?"
        options:
          - "עקרון האיסור של פאולי"
          - "עקרון אי-הוודאות של הייזנברג"
          - "עקרון הבנייה של אאופבאו"
          - "כלל הריבוי המרבי של הונד"
        correct: 0
        explanation: "עקרון האיסור של פאולי קובע שכל אורביטל יכול להכיל לכל היותר שני אלקטרונים, ועליהם להיות בעלי ספינים מנוגדים (+1/2 ו--1/2)."
      - type: multiple_choice
        question: "מדוע הרדיוס האטומי קטן ככל שנעים משמאל לימין לאורך אותה שורה (מחזור) בטבלה המחזורית?"
        options:
          - "המטען החיובי של הפרוטונים בגרעין גדל ומושך את ענן האלקטרונים פנימה בעוצמה רבה יותר"
          - "אטומים מאבדים קליפות אלקטרוניות ככל שהמספר האטומי עולה"
          - "נייטרונים בגרעין מבטלים את מטענם השלילי של האלקטרונים"
          - "כוח המשיכה הכבידתי בין הנוקליאונים דוחס את מעטפת האטום"
        correct: 0
        explanation: "לאורך מחזור מתווספים פרוטונים לגרעין בעוד האלקטרונים נכנסים לאותה קליפה עיקרית, כך שהמטען הגרעיני האפקטיבי גדל ומכווץ את הרדיוס."
      - type: multiple_choice
        question: "מהו מספר האלקטרונים המרבי שיכול לאכלס את מכלול אורביטלי p ברמת אנרגיה נתונה?"
        options:
          - "6 אלקטרונים"
          - "2 אלקטרונים"
          - "10 אלקטרונים"
          - "14 אלקטרונים"
        correct: 0
        explanation: "קיימים שלושה תת-אורביטלי p בכל קליפה (px, py, pz), וכל אחד מהם יכול להכיל שני אלקטרונים לכל היותר, סך הכל 6 אלקטרונים."
      - type: multiple_choice
        question: "איזה יסוד מחזיק בערך האלקטרושליליות הגבוה ביותר בטבלה המחזורית על פי סולם פאולינג?"
        options:
          - "פלואור (Fluorine)"
          - "חמצן (Oxygen)"
          - "כלור (Chlorine)"
          - "הליום (Helium)"
        correct: 0
        explanation: "פלואור הוא היסוד האלקטרושלילי ביותר עם ערך של כ-3.98 בסולם פאולינג, והוא מושך אליו אלקטרונים בקשר בעוצמה מרבית."
      - type: multiple_choice
        question: "לפי כלל הונד, כיצד מאכלסים אלקטרונים אורביטלים שווי-אנרגיה (מנוונים) כגון תת-קליפת 2p?"
        options:
          - "הם מאכלסים כל אורביטל בנפרד עם ספינים מקבילים לפני שמתרחש צימוד"
          - "הם ממלאים כל אורביטל במלואו בזוגות לפני המעבר לאורביטל הבא"
          - "הם קורסים מיד לרמת האנרגיה הנמוכה ביותר בגרעין"
          - "הם מתפזרים באופן אקראי לחלוטין ללא קשר לספין"
        correct: 0
        explanation: "כלל הונד ממזער את כוחות הדחייה הבין-אלקטרוניים על ידי אכלוס מקדים של כל אורביטל מנוון באלקטרון יחיד בעל ספין זהה."
      - type: multiple_choice
        question: "מדוע תת-הקליפה 4s מתמלאת באלקטרונים לפני תת-הקליפה 3d באטומים ניטרליים?"
        options:
          - "האורביטל 4s חודר קרוב יותר לגרעין ולכן בעל אנרגיה ממוצעת נמוכה יותר מ-3d"
          - "לאורביטל 4s יש מספר קוונטי זוויתי גבוה יותר מאשר ל-3d"
          - "האורביטל 3d יכול להכיל פחות אלקטרונים מאורביטל 4s"
          - "עקרון אאופבאו קובע שקליפות עם n גבוה מתמלאות תמיד תחילה"
        correct: 0
        explanation: "בשל כושר החדירה הגבוה של אורביטל 4s הכדורי לסביבת הגרעין, רמת האנרגיה שלו נמוכה יותר מאורביטלי 3d החשופים לסיכוך."
      - type: multiple_choice
        question: "איזה מונח מגדיר את כמות האנרגיה המינימלית הנדרשת להרחקת אלקטרון הערכיות הקשור ברפיון מאטום גזי מבודד?"
        options:
          - "אנרגיית יינון ראשונה"
          - "זיקה אלקטרונית"
          - "אלקטרושליליות"
          - "אנרגיית סריג"
        correct: 0
        explanation: "אנרגיית יינון ראשונה מודדת את כמות האנרגיה הנדרשת כדי להוציא מול אחד של אלקטרונים ממול אטומי גז ניטרליים לקבלת קטיונים."
      - type: multiple_choice
        question: "כמה אלקטרוני ערכיות מצויים בקליפה החיצונית של אטומי הלוגנים ניטרליים (טור 17, כגון כלור וברום)?"
        options:
          - "7"
          - "1"
          - "5"
          - "8"
        correct: 0
        explanation: "להלוגנים היערכות ערכיות של ns² np⁵, כלומר 7 אלקטרונים חיצוניים, מה שמניע אותם לקלוט אלקטרון נוסף להשלמת שמינייה יציבה."
      - type: multiple_choice
        question: "מה מגדיר שני אטומים כאיזוטופים שונים של אותו היסוד הכימי?"
        options:
          - "מספר זהה של פרוטונים, אך מספר שונה של נייטרונים"
          - "מספר זהה של נייטרונים, אך מספר שונה של פרוטונים"
          - "מספר מסה זהה, אך מספר אטומי שונה"
          - "מספר אלקטרונים זהה, אך מטען גרעיני שונה לחלוטין"
        correct: 0
        explanation: "איזוטופים חולקים את אותו מספר אטומי Z (אותו מספר פרוטונים ותכונות כימיות זהות) אך נבדלים במספר הנייטרונים N ובמסת האטום."
      - type: multiple_choice
        question: "איזה מספר קוונטי קובע את הצורה הגאומטרית התלת-ממדית של האורביטל האטומי?"
        options:
          - "מספר קוונטי זוויתי (אזימוטלי, l)"
          - "מספר קוונטי ראשי (n)"
          - "מספר קוונטי מגנטי (m_l)"
          - "מספר קוונטי של הספין (m_s)"
        correct: 0
        explanation: "המספר הקוונטי הזוויתי l מכתיב את צורת האורביטל: l=0 הוא כדורי (s), l=1 הוא דמוי משקולת (p), l=2 הוא עלעלן (d) ו-l=3 הוא f."
      - type: multiple_choice
        question: "מדוע גזים אצילים (כגון ניאון וארגון) מגלים אדישות כימית מוחלטת כמעט בתנאים סטנדרטיים?"
        options:
          - "קליפת האלקטרונים החיצונית שלהם מלאה לחלוטין בתצורת שמינייה יציבה (s²p⁶)"
          - "גרעיני האטומים שלהם נטולי פרוטונים המושכים אלקטרונים נוספים"
          - "האלקטרושליליות שלהם היא הגבוהה ביותר בטבלה כולה"
          - "לאלקטרוני הערכיות שלהם אין תנע קוונטי זוויתי"
        correct: 0
        explanation: "גזים אצילים נהנים מקליפת ערכיות סגורה ומלאה לחלוטין (ns² np⁶), המייצגת מצב יציב במיוחד מבחינה אנרגטית ותרמודינמית."
      - type: multiple_choice
        question: "איזו תופעה מתארת את הירידה בעוצמת המשיכה של הגרעין על אלקטרוני הערכיות בשל נוכחות אלקטרוני הליבה הפנימיים?"
        options:
          - "סיכוך אלקטרוני (Screening / Shielding)"
          - "האפקט הפוטואלקטרי"
          - "מנהור קוונטי"
          - "פיצול זימן"
        correct: 0
        explanation: "אלקטרוני הליבה הפנימיים דוחים את אלקטרוני הערכיות החיצוניים ומסככים עליהם חלק ממטען הגרעין החיובי (מטען אפקטיבי Z_eff)."
      - type: multiple_choice
        question: "מהו קיבול האלקטרונים המרבי הכולל של רמת האנרגיה השלישית (n = 3) באטום?"
        options:
          - "18 אלקטרונים"
          - "8 אלקטרונים"
          - "32 אלקטרונים"
          - "10 אלקטרונים"
        correct: 0
        explanation: "קיבולת האלקטרונים של קליפה n מחושבת לפי 2n². עבור n=3 מתקבל 2 כפול 9 = 18 אלקטרונים (המורכבים מ-3s², 3p⁶ ו-3d¹⁰)."
      - type: multiple_choice
        question: "לאיזו קבוצת יסודות בטבלה המחזורית יש אלקטרון ערכיות יחיד באורביטל ה-s החיצוני שלהם?"
        options:
          - "מתכות אלקליות (טור 1)"
          - "מתכות אלקליות-עפרוריות (טור 2)"
          - "מתכות מעבר (טורים 3 עד 12)"
          - "הלוגנים (טור 17)"
        correct: 0
        explanation: "המתכות האלקליות (ליתיום, נתרן, אשלגן וכו׳) מחזיקות באלקטרון בודד בקליפת ns¹, ומאבדות אותו בקלות ליצירת קטיונים במטען +1."
      - type: multiple_choice
        question: "מה מתרחש כאשר אלקטרון עובר מרמת אנרגיה גבוהה (כגון n = 3) לרמת אנרגיה נמוכה יותר (כגון n = 2)?"
        options:
          - "נפלט פוטון של אור שהאנרגיה שלו שווה בדיוק להפרש האנרגיות ΔE בין הרמות"
          - "נבלע פוטון חיצוני כדי לספק את האנרגיה החסרה למעבר"
          - "נייטרון נפלט באופן ספונטני מתוך גרעין האטום"
          - "מטענו החשמלי הכולל של האטום הופך מניטרלי לשלילי"
        correct: 0
        explanation: "על פי שימור האנרגיה, כאשר אלקטרון צונח לרמת אנרגיה קוונטית נמוכה יותר, עודף האנרגיה נפלט בצורת פוטון עם תדר nu = Delta E / h."

  - id: chemical_bonds_molecular_geometry
    title: "2. קשרים כימיים, גאומטריה מולקולרית וכוחות בין-מולקולריים"
    description: >
      כיצד אטומים חולקים, מעבירים ומשתפים אלקטרונים ליצירת מולקולות יציבות, כיצד דחייה חשמלית קובעת מבנה תלת-ממדי, וכיצד כוחות בין-מולקולריים מעצבים חומרים נוזליים ומוצקים.
