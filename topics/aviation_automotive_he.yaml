      הנחשקת והיקרה ביותר בתולדות האנושות.
  - type: multiple_choice
    question: איזו מכונית ספורט גרמנית איקונית, שהוצגה ב-1963 עם מנוע 'בוקסר' אחורי בעל 6 צילינדרים, מיוצרת ברציפות עד היום?
