    - דייטונה 500
    - 12 השעות של סברינג
    - באחה 1000
    correct: 0
    explanation: מרוץ האינדי 500 מאתגר 33 נהגים ב-200 הקפות (500 מייל) במהירויות של מעל 370 קמ״ש במסלול האובלי ההיסטורי של
