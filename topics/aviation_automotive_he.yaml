    - התזת חנקן נוזלי על בלמי הדיסק
    - פרישת מצנח אחורי בעת עצירה ברחבת הטיפולים
    - היפוך סדר ההצתה בצילינדרים של המנוע
    correct: 0
    explanation: בלימה רגנרטיבית מנצלת את התנגדות המנוע החשמלי כדי להאט את הרכב, וממירה את התנע הקינטי של הרכב לטעינה חשמלית
      בסוללה.
