  - id: surprising_capitals
    title: "Surprising Capitals & Cities with a Twist"
    description: >
      Uncover the world's most frequently mistaken capitals! Test your knowledge on planned capital cities, 
      compromise locations, and countries with multiple official capitals.
    cards:
      - title: "Canberra: Australia's Compromise Capital"
        points:
          - "Many people mistakenly think Sydney or Melbourne is the capital of Australia."
          - "Canberra was chosen in 1908 as a deliberate compromise between the two rival economic powerhouse cities: Sydney and Melbourne."
          - "The entirely planned city was designed by American architects Walter Burley Griffin and Marion Mahony Griffin, featuring circular geometric rings centered around an artificial lake."
      - title: "Ottawa: Queen Victoria's Strategic Choice"
        points:
          - "Canada's capital is Ottawa, not Toronto (the largest city) or Montreal (the cultural hub)."
          - "In 1857, Queen Victoria selected the small lumber town of Ottawa because it sat right on the border between English-speaking Ontario and French-speaking Quebec."
          - "Ottawa was also located further inland away from the US border, making it much easier to defend militarily."
      - title: "South Africa: The Three-Capital Nation"
        points:
          - "South Africa is the only nation in the world with three official capital cities, dividing government branches equally:"
          - "1. Pretoria: The Executive / Administrative Capital (President and Cabinet)."
          - "2. Cape Town: The Legislative Capital (Seat of Parliament)."
          - "3. Bloemfontein: The Judicial Capital (Seat of the Supreme Court of Appeal)."
          - "Johannesburg is the largest city and economic center, but not an official capital."
      - title: "Brasília: The Airplane-Shaped City"
        points:
          - "In 1960, Brazil moved its capital inland from coastal Rio de Janeiro to the newly constructed planned city of Brasília."
          - "The move aimed to develop Brazil's vast interior region and provide a neutral federal center."
          - "Designed by urban planner Lúcio Costa and architect Oscar Niemeyer, Brasília's master plan is famous for resembling the shape of an airplane (or giant bird)."
      - title: "Bern: Switzerland's De Facto Capital"
        points:
          - "Switzerland technically has no official 'capital city' written into its constitution because all 26 cantons are considered equal."
          - "Instead, Bern serves as the 'Federal City' (Bundesstadt) and de facto capital hosting the Swiss Parliament and federal government."
          - "Geneva hosts the United Nations European headquarters, while Zurich is the largest financial hub."
    trivia:
      - type: multiple_choice
        question: "Why was the planned city of Canberra chosen as the capital of Australia?"
        options: ["As a compromise location to settle the rivalry between Sydney and Melbourne", "Because it was the first British settlement in Australia", "Because it had the largest natural deep-water harbor", "Due to rich gold discoveries in its immediate hills"]
        correct: 0
      - type: multiple_choice
        question: "How many official capital cities does South Africa have?"
        options: ["Three (Pretoria, Cape Town, Bloemfontein)", "One (Johannesburg)", "Two (Durban and Pretoria)", "None (it operates as a direct federation)"]
        correct: 0
      - type: multiple_choice
        question: "What distinct geometric shape does the urban master plan of Brasília resemble from above?"
        options: ["An airplane (or giant bird)", "A perfect five-pointed star", "A circular bullseye target", "A giant crescent moon"]
        correct: 0
      - type: multiple_choice
