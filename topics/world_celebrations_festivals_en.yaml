- id: unusual_regional_traditions
  title: Unusual Regional Traditions
  description: 'Discover the world''s most delightfully strange, hilarious, and daring local traditions!  From
    rolling giant wheels of cheese down steep hills to Viking torch parades and epic fruit fights.

    '
  cards:
  - title: La Tomatina (Buñol, Spain)
    points:
    - Held on the last Wednesday of August in the small town of Buñol, La Tomatina is the world's biggest
      food fight.
    - Over 20,000 participants throw more than 150 metric tons of overripe, squashed tomatoes at each
      other for one hour.
    - The fight begins only after a brave competitor climbs a tall, greased wooden pole ('palo jabón')
      to retrieve a Spanish ham from the top.
    - Fire trucks hose down the streets and participants afterward, with the citric acid in the tomatoes
      leaving the cobblestone streets sparkling clean!
  - title: Cooper's Hill Cheese-Rolling (England)
    points:
    - Held every May near Gloucester, competitors recklessly chase a 9-pound (4 kg) wheel of Double Gloucester
      cheese down a near-vertical, 200-yard hill.
    - The rolling cheese wheel can reach dangerous speeds of up to 110 km/h (70 mph), giving it a commanding
      head start.
    - Contenders tumble, roll, and somersault head-over-heels down the bumpy slope, with volunteer rugby
      players waiting at the bottom to catch them.
    - The first person to cross the finish line at the bottom of the hill wins the coveted wheel of cheese
      and international bragging rights.
  - title: Up Helly Aa Viking Fire Festival (Shetland, Scotland)
    points:
    - Held every January in Lerwick, Up Helly Aa marks the end of the yule season with a dramatic celebration
      of Shetland's Norse heritage.
    - Hundreds of costumed 'guizers' wearing winged Viking helmets, chainmail, and carrying real axes
      march through the streets in a torchlight procession.
    - Led by the 'Guizer Jarl' (Viking Chief), the squad hurls over a thousand flaming torches into a
      full-scale replica Viking longship, burning it to ashes.
    - The night concludes with hours of lively traditional fiddle music, theatrical skits, and Scottish
      ceilidh dancing.
  - title: 'Castells: Human Towers of Catalonia (Spain)'
    points:
    - In Catalonia, teams called 'colles castelleres' build astonishing human towers ('castells') that
      can reach up to 10 stories high!
    - A massive base of hundreds of interlocking people ('pinya') provides structural support and safety
      cushioning for the climbers.
    - The tower is only completed when a nimble child wearing a protective helmet (the 'enxaneta') scales
      to the very top and raises four fingers.
    - UNESCO recognized Castells as Intangible Cultural Heritage for embodying unity, teamwork, balance,
      and absolute trust.
  - title: Boryeong Mud Festival (South Korea)
    points:
    - Originally created in 1998 to promote the cosmetic benefits of local mineral-rich mud, it became
      South Korea's most popular summer festival.
    - Millions of visitors travel to Daecheon Beach to slide down giant mud slides, wrestle in mud pits,
      and paint themselves in colored mud.
    - The nutrient-packed grey sea mud is rich in germanium and bentonite, prized for purifying skin and
      rejuvenating body wellness.
    - The energetic beach festival includes K-pop concerts, obstacle courses, night fireworks, and massive
      beach dance parties.
  - title: Krampuslauf & Alpine Folklore (Austria / Germany)
    points:
    - In Alpine folklore across Austria, Bavaria, and Slovenia, St. Nicholas is accompanied by 'Krampus',
      a horned, beast-like creature.
    - While St. Nicholas rewards well-behaved children with sweets and gifts, Krampus playfully punishes
      naughty children with birch sticks.
    - During the annual 'Krampuslauf' (Krampus Run) in early December, hundreds of men in hand-carved
      wooden masks and shaggy fur suits parade through towns.
    - The loud clanging of heavy cowbells attached to their belts was traditionally believed to scare
      away harsh winter evil spirits.
  - title: Wife-Carrying World Championship (Finland)
    points:
    - Held annually in Sonkajärvi, Finland, male competitors race through a 253-meter obstacle course
      while carrying a female teammate.
    - The course includes dry land obstacles, deep sand pits, and a waist-deep water trench.
    - Most racers use the popular 'Estonian Carry', where the woman hangs upside down along the man's
      back with her legs wrapped over his shoulders.
    - The winning grand prize is the carried teammate's exact weight in craft beer!
  - title: Monkey Buffet Festival (Lopburi, Thailand)
    points:
    - Held every November at the ancient Khmer temple of Phra Prang Sam Yot, locals host an extravagant
      feast for thousands of wild macaques.
    - Chefs prepare over two tons of fresh fruits, vegetables, sticky rice, cakes, and fruit-infused ice
      blocks arranged on lavish banquet tables.
    - The feast is held as an expression of gratitude to the monkeys, believed to bring good luck and
      tourist prosperity to the province.
    - Monkeys freely jump on tables, climb on amused tourists, and devour mountains of watermelon, bananas,
      and pineapples.
  trivia:
  - type: multiple_choice
    question: In what Spanish town is the world-famous tomato-throwing festival 'La Tomatina' held every
      August?
    options:
    - Barcelona
    - Buñol
