id: cinema_greatest_movies_he
title: "קולנוע וסרטי המופת הגדולים"
description: >
  עלו על השטיח האדום למסע קולנועי אולטימטיבי למבוגרים! מאפוסים אגדיים של המאפיה 
  ומותחנים פסיכולוגיים מפותלים ועד יצירות מופת במד״ב ושוברי קופות זוכי אוסקר, 
  בחנו את הידע שלכם על הסרטים הגדולים ביותר שנוצרו אי פעם.
lang: he
audience: adult
categories:
  - id: important_facts
    title: "עובדות חשובות"
    description: >
      אבני דרך קולנועיות מכוננות, במאים חזוניים ותולדות הקולנוע העולמי. 
      קראו את הסיפורים המרתקים מאחורי הקלעים יחד לפני שתצללו לטריוויה!
    cards:
      - title: "תור הזהב של הוליווד"
        points:
          - "עידן האולפנים הקלאסי של הוליווד (1927–שנות ה-60) נשלט בידי 'חמשת הגדולים': MGM, פרמאונט, האחים וורנר, פוקס המאה ה-20 ו-RKO."
          - "הסרט 'זמר הג'אז' (1927) סיים את עידן הראינוע כשהציג לראשונה דיאלוג מוקלט ומסונכרן, ופתח את עידן ה-'מדברים' (Talkies)."
          - "שנת 1939 נחשבת לשנה הגדולה ביותר בתולדות הוליווד, עם יציאת 'חלף עם הרוח', 'הקוסם מארץ עוץ' ו-'מר סמית הולך לוושינגטון'."
          - "כוכבי הקולנוע הוחתמו על חוזים רב-שנתיים כובלים שאפשרו לראשי האולפנים לשלוט באופן מוחלט בתדמיתם ובתפקידיהם."
      - title: "קוד הייז ודירוג הצנזורה"
        points:
          - "בין השנים 1934 ל-1968 אכפה הוליווד את 'קוד הייז' הנוקשה, שאסר על קללות, רמיזות מיניות ואלימות בוטה."
          - "במאים נאלצו להשתמש במטפורות חזותיות וברמיזות מתוחכמות כדי לעקוף את הצנזורה בעת עיסוק בנושאים בוגרים."
          - "קריסת הקוד בסוף שנות ה-60 הובילה למערכת הדירוג המודרנית של ה-MPAA (G, PG, R, ומאוחר יותר PG-13 ב-1984)."
          - "שחרור זה הצית את עידן 'הוליווד החדשה'—גל קולנועי נועז, מחוספס ומונחה במאים (Auteurs)."
      - title: "במאי-על ותיאוריית האוטר"
        points:
          - "'תיאוריית האוטר' (Auteur) גורסת שבמאי דגול הוא בעל חותם אישי, סגנון חזותי ייחודי ותפיסת עולם עקבית בכל סרטיו."
          - "אלפרד היצ'קוק הוכתר כ-'אבי המתח', וחנך טכניקות צילום פורצות דרך כמו ה-'דולי זום' (Dolly Zoom) בסרט 'ורטיגו'."
          - "סטנלי קובריק נודע בפרפקציוניזם בלתי מתפשר, צילום סימטרי עם נקודת מגוז אחת (One-Point Perspective) וריאליזם מהפנט."
          - "במאי הוליווד החדשה כמו מרטין סקורסזה, פרנסיס פורד קופולה וסטיבן ספילברג עיצבו מחדש את השפה הקולנועית."
      - title: "טקס פרסי האוסקר"
        points:
          - "טקס האוסקר הראשון התקיים בשנת 1929 במלון הוליווד רוזוולט, ונמשך 15 דקות בלבד."
          - "רק שלושה סרטים בהיסטוריה גרפו את 'חמשת הגדולים' (סרט, במאי, שחקן, שחקנית, תסריט): 'זה קרה לילה אחד', 'קן הקוקייה' ו-'שתיקת הכבשים'."
          - "שלושה סרטים חולקים את שיא הזכיות בכל הזמנים (11 פסלונים כל אחד): 'בן חור' (1959), 'טיטניק' (1997) ו-'שר הטבעות: שיבת המלך' (2003)."
          - "פסלון האוסקר הרשמי מציג אביר האוחז בחרב צלבנים ועומד על גליל סרט צילום."
      - title: "מהפכות באפקטים מיוחדים"
        points:
          - "'2001: אודיסיאה בחלל' (1968) של קובריק השתמש בהקרנה קדמית, צנטריפוגות ענק וצילום מודלים ללא מחשב כלל."
          - "חברת ILM שהקים ג'ורג' לוקאס ב-1975 חוללה מהפכה במצלמות ממוחשבות ובגרפיקה דיגיטלית עבור מלחמת הכוכבים."
          - "'פארק היורה' (1993) של ספילברג שילב באופן חלק בין בובות דינוזאורים ענקיות מופעלות מכנית לבין CGI ריאליסטי פורץ דרך."
          - "'מטריקס' (1999) הציג לעולם את ה-'בולט טיים' (Bullet Time), באמצעות מערך של 120 מצלמות סטילס המקפיאות זמן סביב השחקנים."
      - title: "פסטיבלי קאן, ונציה וקולנוע בינלאומי"
        points:
          - "פסטיבל הסרטים בוונציה (נוסד ב-1932) הוא הוותיק בעולם, ומעניק את פרס 'אריה הזהב' היוקרתי."
          - "פסטיבל קאן בריביירה הצרפתית הוא הבמה הבינלאומית החשובה ביותר, המעניקה את 'דקל הזהב' (Palme d'Or)."
          - "יצירות מופת בינלאומיות כמו 'פרזיטים' (2019) של בונג ג'ון-הו עשו היסטוריה כשזכו הן בדקל הזהב והן באוסקר לסרט הטוב ביותר."
          - "תנועות כמו הגל החדש הצרפתי, הניאו-ריאליזם האיטלקי והקולנוע היפני (קורוסאווה) השפיעו עמוקות על הוליווד."
      - title: "אגדות ושערוריות מאחורי הקלעים"
        points:
          - "פרנסיס פורד קופולה כמעט התמוטט במהלך הצילומים הכאוטיים ומכות הטייפון של 'אפוקליפסה עכשיו' בפיליפינים."
          - "במהלך צילומי 'מגרש השדים' (1973) אירעו כל כך הרבה תאונות מסתוריות עד שהבמאי הזמין כומר לברך את אתר הצילומים."
          - "מרלון ברנדו סירב לשנן טקסטים בסנדק ובסופרמן, וקרא את שורותיו מכרטיסיות שהודבקו על קירות ועל גבם של שחקנים."
          - "קשיים הפקתיים קיצוניים אלו הולידו לעיתים קרובות את יצירות המופת הגדולות ביותר ששרדו את מבחן הזמן."
      - title: "עידן מיליארד הדולר ושוברי הקופות"
        points:
          - "ג'יימס קמרון הפך לבמאי הראשון שביים שלושה סרטים שחצו כל אחד את רף 2 מיליארד הדולר: 'טיטניק', 'אווטאר' ו-'אווטאר 2'."
          - "סרטו של ספילברג 'מלתעות' (1975) המציא את הקונספט של שובר הקופות הקיצי בהפצה ארצית רחבה בו-זמנית."
          - "הכנסות הקולנוע הפכו לשוק גלובלי רב-יבשתי התלוי במידה רבה בשווקים באירופה ובאסיה."
          - "למרות צמיחת שירותי הסטרימינג, חוויית הצפייה באולם הקולנוע נותרה המדיום האולטימטיבי לאפוסים חזותיים גדולים."
    trivia:
      - type: multiple_choice
        question: "איזה סרט משנת 1927 נחשב לסרט המדבר (Talkie) המלא הראשון בהיסטוריה?"
        options: ["האזרח קיין", "זמר הג'אז", "מטרופוליס", "קזבלנקה"]
        correct: 1
      - type: single_qa
        question: "אילו שלושה סרטים חולקים את שיא כל הזמנים בזכיות באוסקר עם 11 פסלונים כל אחד?"
        answer: "בן חור, טיטניק ושר הטבעות: שיבת המלך"
      - type: multiple_choice
        question: "איזה במאי אגדי מכונה בתולדות הקולנוע 'אבי המתח' (Master of Suspense)?"
        options: ["אלפרד היצ'קוק", "סטנלי קובריק", "מרטין סקורסזה", "פדריקו פליני"]
        correct: 0
      - type: single_qa
        question: "איזה אפקט צילום מפורסם המשלב נסיעת מצלמה לאחור עם זום לפנים פותח בסרט 'ורטיגו'?"
        answer: "דולי זום (Dolly Zoom / אפקט ורטיגו)"
      - type: multiple_choice
        question: "מהו הפרס הגבוה ביותר המוענק בפסטיבל הסרטים היוקרתי בקאן שבצרפת?"
        options: ["דב הזהב", "דקל הזהב (Palme d'Or)", "אריה הזהב", "מסך הכסף"]
        correct: 1
      - type: single_qa
        question: "איזה סרט דרום קוריאני עשה היסטוריה בשנת 2020 כסרט הזר הראשון שזכה באוסקר לסרט הטוב ביותר?"
        answer: "פרזיטים (בבימוי בונג ג'ון-הו)"
      - type: multiple_choice
        question: "איזו חברת אפקטים ויזואליים אגדית הקים ג'ורג' לוקאס ב-1975 עבור מלחמת הכוכבים?"
        options: ["Weta Digital", "Industrial Light & Magic (ILM)", "Digital Domain", "Framestore"]
        correct: 1
      - type: single_qa
        question: "איזו שנה נחשבת בעיני חוקרי קולנוע לשנה הגדולה בתולדות הוליווד שבה יצאו 'חלף עם הרוח' ו-'הקוסם מארץ עוץ'?"
        answer: "1939"
      - type: multiple_choice
        question: "כיצד נקרא קוד הצנזורה הפנימי הנוקשה שאכפה הוליווד בין 1934 ל-1968?"
        options: ["קוד הייז (Hays Code)", "הנחיית מקארתי", "חוק אדיסון", "האמנה ההוליוודית"]
        correct: 0
      - type: single_qa
        question: "באיזו שיטה השתמש מרלון ברנדו על הסט בסרט 'הסנדק' כדי להימנע משינון שורות הדיאלוג שלו?"
        answer: "כרטיסיות טקסט (Cue Cards)"
      - type: multiple_choice
        question: "איזה מותחן של סטיבן ספילברג משנת 1975 יצר את מודל 'שובר הקופות של הקיץ' בהוליווד?"
        options: ["מפגשים מהסוג השלישי", "מלתעות (Jaws)", "שודדי התיבה האבודה", "אי.טי."]
        correct: 1
      - type: single_qa
        question: "איזה אפקט צילום מיוחד של הקפאת זמן סביב שחקנים באמצעות 120 מצלמות הוצג בסרט 'מטריקס'?"
        answer: "בולט טיים (Bullet Time)"
      - type: multiple_choice
        question: "איזה סרט היה השלישי והאחרון עד כה שזכה בכל חמשת פרסי האוסקר המרכזיים בשנת 1991?"
        options: ["פורסט גאמפ", "שתיקת הכבשים", "רשימת שינדלר", "ספרות זולה"]
        correct: 1
      - type: single_qa
        question: "מה מציג פסלון פרס האוסקר המוזהב הרשמי?"
        answer: "אביר האוחז בחרב צלבנים ועומד על גליל פילם"
      - type: multiple_choice
        question: "מי הבמאי היחיד בתולדות הקולנוע שביים שלושה סרטים שונים שהכניסו כל אחד מעל 2 מיליארד דולר?"
        options: ["סטיבן ספילברג", "ג'יימס קמרון", "כריסטופר נולאן", "פיטר ג'קסון"]
        correct: 1
      - type: single_qa
        question: "באיזו שנה נכנס לתוקף דירוג הצנזורה PG-13 בעקבות סרטים כמו 'אינדיאנה ג'ונס ומקדש האבדון'?"
        answer: "1984"

  - id: mob_crime_epics
    title: "אפוסים של מאפיה ופשע"
    description: >
      היכנסו אל עולם הפשע המאורגן, משפחות המאפיה ומעשי השוד הנועזים. 
      גלו את יצירות המופת הקולנועיות של קופולה, סקורסזה, טרנטינו ודה פלמה.
    cards:
      - title: "הסנדק (חלק 1 ו-2)"
        points:
          - "בבימויו של פרנסיס פורד קופולה, 'הסנדק' (1972) ו-'הסנדק 2' (1974) מגוללים את עלייתו הטרגית של מייקל קורליאונה (אל פצ'ינו)."
          - "מרלון ברנדו מילא את לחייו בצמר גפן ודיבר בלחישה צרודה כדי ליצור את דמותו המונומנטלית של דון ויטו קורליאונה."
          - "'הסנדק 2' עשה היסטוריה כסרט ההמשך הראשון שזכה באוסקר לסרט הטוב ביותר, כשהציג במקביל את עליית ויטו הצעיר ונפילתו המוסרית של מייקל."
          - "משפטים כמו 'אני הולך להציע לו הצעה שהוא לא יוכל לסרב לה' קיבעו את הסאגה כאחת מפסגות האמנות הקולנועית."
      - title: "החבר'ה הטובים (Goodfellas - 1990)"
        points:
          - "יצירת המופת הקצבית של מרטין סקורסזה מתארת את סיפור חייו האמיתי של איש המאפיה הנרי היל (ריי ליוטה) לאורך שלושה עשורים."
          - "רוברט דה נירו וג'ו פשי סיפקו הופעות מחשמלות, כשפשי זכה באוסקר על גילום דמותו הנפיצה של טומי דה-ויטו."
          - "שוט הסטדיקאם הרציף בן 3 הדקות שבו הנרי מכניס את קארן למועדון הקופקבנה דרך המטבח נלמד בכל בית ספר לקולנוע."
          - "העימות המתוח והמאולתר של פשי—'מצחיק איך? מה אני ליצן בשבילך? אני מבדר אותך?'—התבסס על מקרה אמיתי מנעוריו."
      - title: "ספרות זולה (Pulp Fiction - 1994)"
        points:
          - "יצירת הניאו-נואר הלא-ליניארית של קוונטין טרנטינו עוקבת אחר צמד המתנקשים וינסנט וגה (ג'ון טרבולטה) וג'ולס וינפילד (סמואל ל' ג'קסון)."
          - "הסרט זכה בפרס דקל הזהב בקאן ובאוסקר לתסריט המקורי, וחולל מהפכה מוחלטת בקולנוע העצמאי של שנות ה-90."
          - "הסרט התפרסם בדיאלוגים השנונים על תרבות פופ, המזוודה הזוהרת המסתורית, תחרות הטוויסט והציטוט מתוך ספר יחזקאל כ״ה."
          - "הסרט החיה מחדש את הקריירה של ג'ון טרבולטה וביסס את סמואל ל' ג'קסון כאחד השחקנים הכריזמטיים בהוליווד."
      - title: "פני צלקת (Scarface - 1983)"
        points:
          - "בבימויו של בריאן דה פלמה ובתסריט של אוליבר סטון, אל פצ'ינו מככב כמהגר הקובני האכזר טוני מונטנה במיאמי של שנות ה-80."
          - "עלייתו הנפיצה של טוני משוטף כלים לברון סמים מיליארדר מגלמת את ההיבריס והאלימות של 'החלום האמריקאי' שהשתבש."
          - "קרב היריות המסיים באחוזתו כולל את הצעקה הבלתי נשכחת: 'Say hello to my little friend!'."
          - "למרות ביקורות ראשוניות קשות על שפה ואלימות, הסרט הפך לאייקון תרבות עולמי ענק ולמודל השראה למוזיקת ההיפ-הופ."
      - title: "השתולים (The Departed - 2006)"
        points:
          - "מותחן הפשע של מרטין סקורסזה בבוסטון העניק לו סוף סוף את פרסי האוסקר הראשונים שלו לבמאי הטוב ביותר ולסרט הטוב ביותר."
          - "עיבוד לסרט ההונג-קונגי 'האינפרנל אפיירס', בכיכוב ליאונרדו דיקפריו כשוטר סמוי ומאט דיימון כחפרפרת של המאפיה במשטרה."
          - "ג'ק ניקולסון סיפק הופעה פראית ובלתי נשכחת כראש המאפיה האירית פרנק קוסטלו."
          - "הסרט טעון במתח עוצר נשימה החוקר בגידה, פרנויה, אובדן זהות ושחיתות ממסדית עמוקה."
      - title: "היט (Heat - 1995)"
        points:
          - "בבימויו של מייקל מאן, 'היט' הציג את הסצנה המשותפת הראשונה אי פעם על המסך של ענקי המשחק אל פצ'ינו ורוברט דה נירו."
          - "דה נירו מגלם את השודד המבריק והמחושב ניל מקולי, בעוד פצ'ינו מגלם את בלש הרצח האובססיבי וינסנט האנה."
          - "העימות השקט והמכובד ביניהם על כוס קפה בדיינר נחשב למופת של כתיבה, בימוי ומשחק מלא מתח."
          - "קרב היריות ברחובות לוס אנג'לס בעת שוד הבנק השתמש בהקלטת קולות ירי חיים ברחובות והפך לרף המוביל בסרטי פעולה."
      - title: "נהג מונית (Taxi Driver - 1976)"
        points:
