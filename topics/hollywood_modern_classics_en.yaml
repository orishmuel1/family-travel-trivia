- id: directors_twists_lore
  title: Master Directors, Legendary Twists & Behind-The-Scenes Lore
  description: The unscripted accidents, signature auteur styles, and shock endings that redefined cinema history.
  cards:
  - title: 'Christopher Nolan & Quentin Tarantino: Auteur Signatures'
    points:
    - 'Christopher Nolan: Passionate defender of celluloid 70mm film stock, practical in-camera effects (crashing real Boeing
      747s, building full-scale rotating sets), and non-linear temporal narrative structures.'
    - 'Quentin Tarantino: Famous for rapid-fire pop-culture dialogue, chapter-based story structures, encyclopedic film homages,
      needle-drop soundtracks, and alternate-history climaxes.'
    - 'David Fincher: Renowned for extreme digital perfectionism, often demanding 50 to 100+ takes per scene to strip actors
      of artificial performance habits.'
    - 'Martin Scorsese: Signature use of kinetic moving camera tracking shots, freeze frames, voiceover narration, and deep
      collaborative partnerships with Robert De Niro and Leonardo DiCaprio.'
  - title: Legendary Unscripted & Improvised Movie Moments
    points:
    - 'Django Unchained (2012): Leonardo DiCaprio accidentally slammed his hand into a glass goblet, cutting his palm open.
      He stayed fully in character, bleeding profusely across the table throughout his monologue.'
    - 'The Dark Knight (2008): Heath Ledger''s Joker sarcastically clapping in his GCPD jail cell when Gordon is promoted
      to Commissioner was entirely improvised on the spot.'
    - 'The Wolf of Wall Street (2013): Matthew McConaughey''s rhythmic chest-thumping and humming was his personal pre-scene
      warm-up ritual; DiCaprio suggested putting it directly into the scene.'
    - 'The Lord of the Rings: The Two Towers (2002): When Aragorn kicks an Uruk-hai helmet in despair, Viggo Mortensen broke
      two toes and let out an agonized scream that Jackson kept in the final cut.'
  - title: The Greatest Modern Plot Twists
    points:
    - 'The Sixth Sense (1999): Child psychologist Malcolm Crowe (Bruce Willis) realizes at the climax that he has been a ghost
      the entire time.'
    - 'The Prestige (2006): Magician Alfred Borden (Christian Bale) reveals he is actually a set of identical twins living
      one shared life, while Robert Angier (Hugh Jackman) cloned and drowned himself nightly using Tesla''s machine.'
    - 'Shutter Island (2010): US Marshal Teddy Daniels (Leonardo DiCaprio) discovers he is actually Andrew Laeddis, a traumatized
      patient at the psychiatric hospital participating in a radical role-playing therapy experiment.'
    - 'Memento (2000): Leonard Shelby (Guy Pearce) discovers he has been intentionally manipulating his own anterograde amnesia
      to create an endless quest for vengeance against people who did not murder his wife.'
  trivia:
  - type: multiple_choice
    question: In 'Django Unchained' (2012), what genuine real-life injury occurred during Calvin Candie's intense dining room
      monologue?
    options:
