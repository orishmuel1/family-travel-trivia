        answer: "הנשיאה האסטונית (Estonian Carry)"
      - type: multiple_choice
        question: "כיצד נקרא הילד הקטלאני המטפס לראש מגדל האדם ומסמן את השלמתו בהנפת ארבע אצבעות?"
        options: ["אנשנטה (Enxaneta)", "קסטלר", "פיניה", "יארל"]
        correct: 0
      - type: single_qa
        question: "מהו תוארו של מנהיג תהלוכת הוויקינגים הנושא לפיד בוער בפסטיבל אפ הלי אה בסקוטלנד?"
        answer: "גיזר יארל (Guizer Jarl)"
      - type: multiple_choice
        question: "לאיזו מהירות מסחררת עשוי להגיע חריץ הגבינה המתגלגל במורד גבעת קופר באנגליה?"
        options: ["עד 20 קמ״ש", "עד 50 קמ״ש", "עד 110 קמ״ש (70 מייל לשעה)", "מעל 200 קמ״ש"]
        correct: 2
      - type: single_qa
        question: "אילו חפצים כבדים ומרעישים עונדים רצי הקרמפוס סביב מותניהם כדי להשמיע רעש מאיים?"
        answer: "פעמוני פרה (Cowbells)"
      - type: multiple_choice
        question: "מדוע עורכים תושבי העיר לופבורי בתאילנד משתה פירות שנתי לקופים המקומיים?"
        options: ["כאות תודה על הבאת מזל טוב ותיירות", "כדי ללכוד אותם למחקר", "כדי שלא יאכלו פרחי מקדש", "בצו מלכותי קדום"]
        correct: 0
      - type: single_qa
        question: "באיזה חוף מפורסם בדרום קוריאה מתקיים פסטיבל הבוץ של בוריאונג מדי קיץ?"
        answer: "חוף דצ'ון (Daecheon Beach)"

  - id: new_year_across_cultures
    title: "חגיגות ראש השנה בתרבויות העולם"
    description: >
      קבלו את פני ההתחלות החדשות ברחבי תבל! גלו את המנהגים העשירים, המאכלים המסורתיים 
      והטקסים העונתיים המציינים את השנה החדשה בלוחות שנה ובתרבויות שונות.
    cards:
      - title: "ראש השנה הירחי וחג האביב (מזרח אסיה)"
        points:
          - "נחוג על ידי מיליארדים בסין, קוריאה, וייטנאם (טט) וקהילות בעולם, ראש השנה הירחי מציין את מולד הירח הראשון של לוח השנה הירחי."
          - "משפחות מנקות את הבית ביסודיות כדי לטאטא החוצה מזל רע, ותולות כרזות נייר אדומות עם ברכות שגשוג ובריאות."
          - "מבוגרים מעניקים לילדים מעטפות אדומות עם 'דמי מזל' ('הונגבאו'), וארוחת החג כוללת דג שלם, כיסונים ואגרולים."
          - "ריקודי דרקון ואריה ססגוניים בליווי זיקוקין ונפצים קולניים מקבלים את פני חיית המזל החדשה (כגון שנת הדרקון, הנחש או הסוס)."
      - title: "ראש השנה: החג היהודי"
        points:
          - "ראש השנה חל בחודש תשרי ומציין את יום בריאת העולם ואת תחילת עשרת ימי תשובה."
          - "מצווה מרכזית היא שמיעת תקיעת השופר (קרן איל חלולה), המשמשת כקריאת התעוררות לחשבון נפש ותיקון מעשים."
          - "סעודת החג כוללת מאכלי סימנים: תפוח בדבש לשנה מתוקה, חלה עגולה כסמל למחזוריות החיים וגרגרי רימון כסמל לריבוי זכויות."
          - "טקס ה'תשליך' נערך ליד מקור מים זורמים, ומסמל את השלכת החטאים והמשקעים של השנה שחלפה."
      - title: "נורוז: ראש השנה הפרסי של האביב"
        points:
          - "נורוז ('יום חדש') נחוג מזה מעל 3,000 שנה ומציין את הרגע האסטרונומי המדויק של יום שוויון האביב בסוף מרץ."
          - "נחוג באיראן, במרכז אסיה ובקווקז, ומסמל את התעוררות הטבע, התחדשות החיים והרמוניה משפחתית."
          - "בבתים עורכים שולחן חג מפואר בשם 'האפת סין' המכיל 7 פריטים סמליים המתחילים באות ס' בפרסית (כמו נבטים לצמיחה ותפוח ליופי)."
          - "החגיגות מסתיימות ביום ה-13 (סיזדה בדר) בפיקניקים משפחתיים ענקיים בחיק הטבע לחגיגת הפריחה האביבית."
      - title: "הוגמני: ראש השנה הסקוטי"
        points:
          - "הוגמני הוא חג השנה החדשה המפורסם של סקוטלנד, הידוע במסיבות רחוב ענקיות, תהלוכות לפידים ומופעי זיקוקין."
          - "מנהג ה-'פירסט-פוטינג' (First-Footing) קובע כי האורח הראשון שחוצה את מפתן דלתך אחרי חצות קובע את מזל הבית לשנה כולה."
          - "לפי המסורת, גבר גבוה בעל שיער כהה המביא עמו מתנות של גושי פחם, עוגיות שורטברד, מלח וויסקי מביא את המזל הטוב ביותר."
          - "בחצות הלילה אוחזים החוגגים ידיים ושרים יחד את השיר הסקוטי המסורתי 'Auld Lang Syne' שכתב המשורר רוברט ברנס."
      - title: "נפילת כדור הבדולח בטיימס סקוור (ארה״ב)"
        points:
          - "מאז 1907 מתאספים מאות אלפים בכיכר טיימס סקוור בניו יורק כדי לחזות בכדור הבדולח המואר יורד בספירה לאחור בחצות."
          - "הכדור המודרני מכוסה ב-2,688 משולשי קריסטל ווטרפורד ומואר בלמעלה מ-32,000 נורות LED צבעוניות."
          - "בשניית חצות מושלך טון של פתיתי קונפטי המכילים משאלות בכתב יד של אנשים מכל העולם מעל ההמון הצוהל."
          - "במסורת הספרדית והלטינית נהוג לאכול 12 ענבים—ענב אחד בכל צלצול פעמון בחצות—למזל טוב בכל אחד מ-12 חודשי השנה."
      - title: "נייפי: יום הדממה של באלי (אינדונזיה)"
        points:
          - "נייפי הוא ראש השנה ההינדי באי באלי, וייחודי בכך שהוא מצוין ביממה שלמה (24 שעות) של שקט מוחלט, צום ומדיטציה."
          - "ביום הנייפי האי כולו מושבת לחלוטין: לא מדליקים אורות או אש, אין תנועת רכבים ואפילו נמל התעופה הבינלאומי נסגר!"
          - "בלילה שלפני החג נערכות תהלוכות רועשות עם פסלי שדים ענקיים ומאיימים מעיסת נייר המכונים 'אוגו-אוגו' (Ogoh-Ogoh)."
          - "השקט המוחלט ביום המחרת נועד להטעות את הרוחות הרעות ולגרום להן לחשוב שהאי נטוש לחלוטין כדי שיעזבו אותו."
      - title: "מטאריקי: ראש השנה המאורי (ניו זילנד)"
        points:
          - "מטאריקי הוא חג ראש השנה של הילידים המאורים בניו זילנד, המציין את זריחת צביר כוכבי הפליאדות (כימה) בשמי החורף."
          - "החג הוכרז כיום חג לאומי רשמי בניו זילנד, ומהווה זמן לזכור את אבות המשפחה, להודות על הקיים ולתכנן את העתיד."
          - "כל כוכב בצביר תשעת הכוכבים של מטאריקי מקושר להיבט אחר בטבע וברווחת האדם (מי ים, מים מתוקים, יבולים, עצים ורוחות)."
          - "משפחות וקהילות מתכנסות לסעודות מסורתיות בבורות אדמה חמים ('האנגי'), מפריחות עפיפונים ומספרות סיפורים עתיקים."
      - title: "טקסי מים וראשי שנה שמשיים בדרום-מזרח אסיה"
        points:
          - "באמצע אפריל חוגגות מדינות דרום-מזרח אסיה ראשי שנה שמשיים: סונגקראן בתאילנד, תינגיאן במיאנמר וצ'ול צ'נאם תמיי בקמבודיה."
          - "החגים חלים בעת מעבר השמש למזל טלה, ומסמלים את סיום עונת היובש ואת בואם הקרב של גשמי המונסון המרווים."
          - "טקסי יציקת מים עדינים על ידיהם של נזירים ומבוגרים מבטאים תודה, כבוד וחיפוש ברכות לבריאות והצלחה."
          - "חגיגות הרחוב משלבות מנחות במקדשים עם השלכת מים הדדית עליזה המסמלת שטיפה וטיהור מטרדות השנה שעברה."
    trivia:
      - type: multiple_choice
        question: "איזה כלי נגינה עשוי מקרן איל נשמע במהלך תפילות ראש השנה היהודי?"
        options: ["נבל", "שופר", "חצוצרה", "עוגב"]
        correct: 1
      - type: single_qa
        question: "איזה שיר סקוטי מפורסם שכתב רוברט ברנס מושר בחצות ליל הסילבסטר ברחבי העולם?"
        answer: "אולד לאנג סיין (Auld Lang Syne)"
      - type: multiple_choice
        question: "איזה אירוע אסטרונומי בחודש מרץ מציין את הרגע המדויק של פתיחת ראש השנה הפרסי נורוז?"
        options: ["היפוך החורף", "שוויון האביב (Vernal Equinox)", "היפוך הקיץ", "שוויון הסתיו"]
        correct: 1
      - type: single_qa
        question: "באיזה צבע מעטפות המכילות דמי מזל ('הונגבאו') נהוג להעניק לילדים בראש השנה הסיני?"
        answer: "מעטפות אדומות"
      - type: multiple_choice
        question: "כמה ענבים נהוג לאכול בחצות הלילה בספרד ובאמריקה הלטינית למזל טוב בשנה החדשה?"
        options: ["7 ענבים", "10 ענבים", "12 ענבים (אחד לכל חודש)", "24 ענבים"]
        correct: 2
      - type: single_qa
        question: "איזה צביר כוכבים שזריחתו מציינת את ראש השנה המאורי (מטאריקי) ידוע בעברית בשם 'כימה'?"
        answer: "הפליאדות (כימה / Matariki / Pleiades)"
      - type: multiple_choice
        question: "כיצד מציינים תושבי האי באלי את יום ראש השנה ההינדי נייפי במשך 24 שעות רצופות?"
        options: ["בזיקוקין לאורך כל היום", "בדממה מוחלטת, חושך והשבתת שדה התעופה", "בריקודים בתוך האוקיינוס", "במשתה רחוב חופשי"]
        correct: 1
      - type: single_qa
        question: "איזה מנהג סקוטי עוסק באורח הראשון שחוצה את סף הדלת אחרי חצות כדי להביא מזל טוב?"
        answer: "פירסט-פוטינג (First-Footing)"
      - type: multiple_choice
        question: "כמה פריטים סמליים המתחילים באות ס' מוצגים על שולחן ה-'האפת סין' בחג הנורוז הפרסי?"
        options: ["3 פריטים", "5 פריטים", "7 פריטים", "12 פריטים"]
        correct: 2
      - type: single_qa
        question: "באיזו כיכר מפורסמת בניו יורק יורד כדור בדולח ענק בספירה לאחור בחצות ראש השנה האזרחית?"
        answer: "טיימס סקוור (Times Square)"
      - type: multiple_choice
        question: "אילו פסלי שדים ענקיים מעיסת נייר נישאים בתהלוכות רועשות בערב חג הנייפי בבאלי?"
        options: ["אוגו-אוגו (Ogoh-Ogoh)", "טיקי", "גנש", "בארונג"]
        correct: 0
      - type: single_qa
        question: "איזה פרי עמוס גרגרים נאכל בראש השנה היהודי כסמל לשנה מלאה במעשים טובים?"
        answer: "רימון"
      - type: multiple_choice
        question: "איזה סגנון בישול מסורתי בבורות אדמה חמים משמש להכנת סעודות בחג המטאריקי בניו זילנד?"
        options: ["ברביקיו", "האנגי (Hāngī)", "טנדור", "סביצ'ה"]
        correct: 1
      - type: single_qa
        question: "כמה חיות שונות מרכיבות את מחזור גלגל המזלות של לוח השנה הירחי הסיני?"
        answer: "12 חיות"
      - type: multiple_choice
        question: "אילו מתנות מביא עמו האורח הראשון בהוגמני הסקוטי כדי להבטיח חום ועושר לבית?"
        options: ["מטבעות זהב ודבש", "גוש פחם, שורטברד, מלח וויסקי", "צמח ירוק, לחם ומים", "נרות, בשר וצמר"]
        correct: 1
      - type: single_qa
        question: "איזה טקס יהודי נערך ליד מקור מים בראש השנה ומסמל את השלכת החטאים?"
        answer: "תשליך (Tashlich)"

  - id: festivals_of_lights_fire_ice
    title: "פסטיבלי אורות, אש וקרח"
    description: >
      התפעלו ממופעים מרהיבים של פנסי שמיים מאירים, מדורות ענק וארמונות קרח זוהרים! 
      גלו כיצד האור, האש והטמפרטורה הופכים חגיגות לפלא חזותי בלתי נשכח.
    cards:
      - title: "דיוואלי: פסטיבל האורות (הודו)"
        points:
          - "דיוואלי הוא הפסטיבל הגדול והחשוב ביותר בהודו הנמשך 5 ימים, ונחוג על ידי הינדים, סיקים וג'יינים בעולם."
          - "החג מציין את ניצחון האור הרוחני על החושך, הטוב על הרע והחוכמה על הבערות."
          - "בתים ומקדשים מוארים במיליוני מנורות חרס קטנות ('דיאס'), מחרוזות אורות מנצנצות וציורי רצפה צבעוניים ('רנגולי')."
          - "משפחות מחליפות ממתקים מסורתיים (מיטהאי), מפוצצות זיקוקין ומתפללות ללקשמי, אלת השגשוג והמזל הטוב."
      - title: "יי פנג ולוי קראתונג (תאילנד)"
        points:
          - "נחוגים בליל הירח המלא של החודש הירחי ה-12 (נובמבר), צמד פסטיבלים אלו יוצר מחזה מכושף של אור במים ובשמיים."
          - "בפסטיבל יי פנג בצ'יאנג מאי, אלפי פנסי נייר אורז מוארים ('חום לוי') משוחררים בו-זמנית ומרחפים אל שמי הלילה."
          - "במהלך לוי קראתונג, אנשים משיטים על פני הנהרות סירות עלי בננה מעוטרות ('קראתונג') הנושאות נרות דולקים ופרחים."
          - "שילוח הסירות ופנסי השמיים מסמל שחרור כעסים, מטענים שליליים ומזל רע, לצד הבעת משאלות לעתיד מזהיר."
      - title: "לאס פאייאס: פסלי האש של ולנסיה (ספרד)"
        points:
          - "נחוג בחודש מרץ בוולנסיה שבספרד, אמני שכונות בונים מאות פסלי ענק סאטיריים מעיסת נייר המכונים 'פאייאס' (Fallas)."
          - "המונומנטים הצבעוניים מתנשאים לגובה של עד חמש קומות ולועגים בהומור חריף לפוליטיקאים, ידוענים ואירועי אקטואליה."
          - "מדי צהריים מרעידים מופעי נפצים קצביים ('מסקלֶטָה') את מרכז העיר בפיצוצים עזים המרטיטים את הקרקע."
          - "בלילה האחרון ('לה קרמה'), כל הפסלים הענקיים בעיר מועלים באש בו-זמנית במדורות ענק מרהיבות ורועמות!"
      - title: "פסטיבל הקרח והשלג הבינלאומי בחרבין (סין)"
        points:
          - "בעיר חרבין שבצפון-מזרח סין מתקיים פסטיבל פסלי הקרח והשלג הגדול בעולם, המושך מיליוני תיירים בחורף הקפוא."
          - "עשרות אלפי אמנים ופועלים חוצבים טירות ענק מוארות, פגודות ומגלשות קרח ענקיות מגושי קרח שנחצבו מנהר סונגהואה הקפוא."
          - "בלילה הופכת עיר הקרח לארץ פלאות זוהרת המוארת בתאורת LED פנימית ממוחשבת שהוטמנה בתוך גושי הקרח השקופים."
          - "הפסטיבל כולל שחיית חורף בבריכות שנחצבו בנהר הקפוא, מרתונים על הקרח ותחרויות פיסול בינלאומיות."
      - title: "חנוכה: חג האורים היהודי"
        points:
          - "חנוכה הוא חג יהודי הנמשך שמונה ימים לזכר חנוכתו מחדש של בית המקדש השני בירושלים במאה ה-2 לפנה״ס."
          - "לפי המסורת, כד שמן זית טהור שהספיק ליום אחד בלבד דלק באורח נס במנורת המקדש במשך שמונה ימים תמימים."
          - "בכל ערב מדליקים נר נוסף בחנוכייה בעלת תשעת הקנים, בעזרת הנר הנוסף המשמש כ-'שמש'."
          - "החגיגות כוללות מאכלים מטוגנים בשמן כמו לביבות תפוחי אדמה (לאטקעס) וסופגניות עם ריבה, ומשחק בסביבון."
      - title: "אובון: פסטיבל פנסי הנשמות (יפן)"
        points:
          - "אובון הוא מנהג בודהיסטי יפני עתיק בחודש אוגוסט המוקדש לכבוד נשמות האבות הקדמונים שחוזרות לבקר את משפחותיהן."
          - "משפחות מדליקות מדורות קבלת פנים ('מוקאיבי') ומנקות את קברי המשפחה."
          - "קהילות מתכנסות בבגדי יוקאטה מסורתיים לרקוד את ריקוד ה-'בון אודורי' סביב במות עץ מקושטות."
          - "החג נחתם בטקס 'טורו נגאשי', שבו משיטים אלפי פנסי נייר עם נרות דולקים בנהרות שקטים כדי ללוות את הנשמות בחזרה לעולמן."
      - title: "אמצע הקיץ ומדורות שמש חצות (סקנדינביה)"
        points:
          - "חג אמצע הקיץ (סביב 21–24 ביוני) הוא מהחגים האהובים ביותר בשוודיה, פינלנד, נורווגיה והמדינות הבלטיות."
          - "מכיוון שהשמש כמעט ואינה שוקעת בקווי הרוחב הצפוניים סביב יום היפוך הקיץ, החגיגות נערכות בטבע תחת 'שמש חצות'."
          - "קהילות מקימות עמודי חג מקושטים בענפי לבנה וזרי פרחים ('מידסומרסטונג') ורוקדות סביבם ריקודי מעגל מסורתיים."
          - "בפינלנד ובנורווגיה מדליקים מדורות ענק ('קוקו') לאורך חופי האגמים והפיורדים לחגיגת האור והחום."
      - title: "פסטיבל פנסי השמיים בפינגשי (טאיוואן)"
        points:
          - "מתקיים מדי שנה בכפר ההררי פינגשי במהלך חג הפנסים המסורתי, ובו משוחררים אלפי פנסי שמיים זוהרים בבת אחת."
          - "החוגגים כותבים בקליגרפיה את משאלותיהם האישיות, חלומותיהם ותפילותיהם על גבי פנסי הנייר לפני הדלקתם."
          - "במקור הומצאו פנסי השמיים על ידי האסטרטג הצבאי ג'וּגֶה ליאנג (קונגמינג) כאמצעי איתות בין כפרים מבודדים בהרים."
          - "מראה אלפי הפנסים המוארים המרחפים לאיטם אל שמי הלילה השחורים נחשב לאחד המראות המרהיבים ביותר בעולם."
    trivia:
      - type: multiple_choice
        question: "איזו אלה הינדית של עושר, שגשוג ומזל טוב נערצת במיוחד במהלך פסטיבל דיוואלי?"
        options: ["סראסווטי", "לקשמי (Lakshmi)", "פארוואטי", "דורגה"]
        correct: 1
      - type: single_qa
        question: "באיזו עיר בספרד נשרפים מאות פסלי ענק סאטיריים במדורות ענק בפסטיבל לאס פאייאס?"
        answer: "ולנסיה (Valencia)"
      - type: multiple_choice
        question: "באיזה פסטיבל בעיר צ'יאנג מאי בתאילנד משוחררים אלפי פנסי נייר מרחפים אל שמי הלילה?"
        options: ["סונגקראן", "יי פנג (Yi Peng)", "פסטיבל הצמחונים", "פסטיבל הרוחות"]
        correct: 1
      - type: single_qa
        question: "איזו עיר בצפון-מזרח סין מארחת את פסטיבל טירות הקרח והשלג המוארות הגדול בעולם?"
        answer: "חרבין (Harbin)"
      - type: multiple_choice
        question: "כמה ימים נמשך חג האורים היהודי, חנוכה?"
        options: ["7 ימים", "8 ימים", "10 ימים", "12 ימים"]
        correct: 1
      - type: single_qa
        question: "איזה צעצוע מסורתי בעל 4 פאות מסובבים ילדים במהלך חג החנוכה?"
        answer: "סביבון (Dreidel)"
      - type: multiple_choice
        question: "איזה ריקוד עם מסורתי נרקד סביב במות עץ במהלך פסטיבל אובון ביפן?"
        options: ["בון אודורי (Bon Odori)", "קבוקי", "סמבה", "פלמנקו"]
        correct: 0
      - type: single_qa
        question: "איזו תופעת טבע מתרחשת בחג אמצע הקיץ בסקנדינביה שבה השמש אינה שוקעת כל הלילה?"
        answer: "שמש חצות (Midnight Sun)"
      - type: multiple_choice
        question: "אילו מאכלים מטוגנים בשמן נהוג לאכול בחנוכה לזכר נס כד השמן?"
        options: ["בייגלה ושטרודל", "לביבות (לאטקעס) וסופגניות", "כיסונים ואגרול", "בקלווה וממתקים"]
        correct: 1
      - type: single_qa
        question: "איזה כפר בטאיוואן מפורסם בעולם בשחרור אלפי פנסי שמיים מוארים שעליהם כתובות משאלות?"
        answer: "פינגשי (Pingxi)"
      - type: multiple_choice
        question: "כיצד נקרא ליל הסיום של פסטיבל לאס פאייאס שבו נשרפים כל הפסלים במדורות ענק?"
        options: ["לה טומטינה", "לה קרמה (La Cremà)", "לה מסקלטה", "לה מרסה"]
        correct: 1
      - type: single_qa
        question: "אילו סירות עלי בננה מעוטרות בנרות ופרחים משיטים בתאילנד על פני המים בחג לוי קראתונג?"
        answer: "קראתונג (Krathongs)"
      - type: multiple_choice
        question: "מאיזה נהר קפוא חוצבים אמני חרבין גושי קרח ענקיים לבניית ארמונות הקרח?"
        options: ["נהר היאנגצה", "נהר סונגהואה (Songhua)", "הנהר הצהוב", "נהר הפנינה"]
        correct: 1
      - type: single_qa
        question: "כיצד נקרא הנר הנוסף בחנוכייה שבאמצעותו מדליקים את שאר שמונת הנרות?"
        answer: "השמש (Shamash)"
      - type: multiple_choice
        question: "איזה טקס יפני כולל השטת אלפי פנסי נייר דולקים בנהרות כדי ללוות את נשמות האבות בסיום אובון?"
        options: ["טורו נגאשי (Tōrō Nagashi)", "הנאמי", "קוינובורי", "הצומוֹדֶה"]
        correct: 0
      - type: single_qa
        question: "איזה עמוד חג מקושט בענפי לבנה וזרי פרחים מוקם בשוודיה לרגל חג אמצע הקיץ?"
        answer: "עמוד אמצע הקיץ (Midsommarstång / Maypole)"
