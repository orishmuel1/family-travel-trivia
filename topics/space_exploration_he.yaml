        answer: "גלקסיה ספירלית (ספירלית בעלת מוט)"
      - type: multiple_choice
        question: "מהי הגלקסיה הספירלית הגדולה הקרובה ביותר לשביל החלב, במרחק 2.5 מיליון שנות אור?"
        options: ["גלקסיית המשולש", "גלקסיית אנדרומדה (Andromeda)", "גלקסיית הסומבררו", "גלקסיית המערבולת"]
