        options: ["קרינת הרקע הקוסמית (CMB)", "רוח השמש", "הבזק קרני גמא", "קרינת הוקינג"]
        correct: 0
      - type: single_qa
        question: "איזה פיזיקאי דגול ניסח את תורת היחסות הכללית וחזה את קיומם של גלי כבידה וחורים שחורים?"
        answer: "אלברט איינשטיין"
      - type: multiple_choice
        question: "כיצד נקרא האזור סביב כוכב שבו טמפרטורת פני השטח מאפשרת קיומם של מים נוזליים?"
        options: ["חגורת קויפר", "האזור הישיב / אזור גולדילוקס (Habitable Zone)", "עטרת השמש", "חגורת האסטרואידים"]
