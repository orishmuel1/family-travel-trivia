        answer: "TRAPPIST-1 (טראפיסט-1)"
      - type: multiple_choice
        question: "מה שמה של הנקודה בעלת הצפיפות האינסופית השוכנת במרכזו של חור שחור?"
        options: ["אופק אירועים", "סינגולריות (Singularity)", "חור תולעת", "ליבת קווארקים"]
        correct: 1
      - type: single_qa
        question: "איזה חומר בלתי נראה מהווה כ-27% מהיקום ומחזיק את הגלקסיות בכוח הכבידה שלו?"
        answer: "חומר אפל (Dark Matter)"
      - type: multiple_choice
        question: "מהו התרחיש המדעי המקובל ביותר כיום לגבי גורלו הסופי של היקום לאורך טריליוני שנים?"
        options: ["הקריסה הגדולה", "הקיפאון הגדול (מות החום / Big Freeze)", "הניתור הגדול", "היקום הסטטי"]
        correct: 1
      - type: single_qa
        question: "איזה טלסקופ חלל גילה אלפי אקסו-פלנטות באמצעות מדידת ירידות זעירות באור כוכבים בעת מעברן?"
        answer: "טלסקופ החלל קפלר (Kepler)"
      - type: multiple_choice
        question: "לפי תורת היחסות של איינשטיין, מה קורה לזרימת הזמן באזור של כבידה עזה במיוחד?"
        options: ["הזמן מאיץ", "הזמן מאט (התרחבות זמן כבידתית)", "הזמן קופא בכל מקום", "הזמן נע לאחור"]
        correct: 1
      - type: single_qa
        question: "איזו קרינה תיאורטית הנפלטת באיטיות מחורים שחורים הוצעה על ידי הפיזיקאי סטיבן הוקינג?"
        answer: "קרינת הוקינג (Hawking Radiation)"
