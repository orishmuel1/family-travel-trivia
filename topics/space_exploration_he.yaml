      - type: multiple_choice
        question: "איזה פיצוץ קוסמי אדיר מתרחש כאשר כוכב מאסיבי מכלה את הדלק הגרעיני שלו וליבתו קורסת?"
        options: ["התפרצות שמש", "סופרנובה (Supernova)", "ערפילית פלנטרית", "הבזק גמא"]
