id: space_exploration_he
title: "חקר החלל ואסטרונומיה"
description: >
  צאו למסע עוצר נשימה במעמקי הקוסמוס! מכוכבים לוהטים וחורים שחורים מסתוריים 
  ועד המכתשים המוזהבים של מאדים ונחיתת האדם על הירח, בחנו את הידע המשפחתי 
  על היקום ועל ההרפתקאות הגדולות ביותר של האנושות בחלל.
lang: he
audience: family
categories:
  - id: important_facts
    title: "עובדות חשובות"
    description: >
      חוקי יקום מרתקים, אבני דרך אנושיות ועובדות מדעיות מפתיעות על הקוסמוס. 
      קראו את הכרטיסיות הללו יחד בקול לפני שתבחנו את הידע בסבב הטריוויה!
    cards:
      - title: "קנה המידה וגיל היקום"
        points:
          - "מדענים מעריכים כי היקום נוצר לפני כ-13.8 מיליארד שנה בהתפשטות עצומה המכונה 'המפץ הגדול'."
          - "היקום הנצפה מכיל לפי ההערכות כ-2 טריליון גלקסיות נפרדות, ובכל אחת מהן מאות מיליארדי כוכבים."
          - "האור נע במהירות בלתי נתפסת של כ-300,000 קילומטרים בשנייה (מהירות האור)."
          - "מכיוון שלאור לוקח זמן להגיע אלינו, כשאנו מביטים בכוכבים רחוקים אנו מביטים ממש אל העבר הרחוק של היקום."
      - title: "כבידה ומכניקת מסלולים"
        points:
          - "כוח הכבידה (גרביטציה) נוסח מתמטית בידי סר אייזק ניוטון ושודרג על ידי תורת היחסות של אלברט איינשטיין."
          - "לוויינים ותחנות חלל נשארים במסלול בכך שהם 'נופלים' ללא הפסקה לעבר כדור הארץ, אך נעים הצידה כה מהר עד שקימור כדור הארץ חומק מתחתם."
          - "כדי להשתחרר ממשיכת הכבידה של כדור הארץ ולצאת לחלל, חללית חייבת להגיע ל-'מהירות מילוט' של כ-40,000 קמ״ש."
          - "כוכבי הלכת נעים סביב השמש במסלולים אליפטיים (מעט מוארכים), ונעים מהר יותר ככל שהם קרובים יותר לשמש."
      - title: "תחנת החלל הבינלאומית (ISS)"
        points:
          - "התחנה היא מעבדת מחקר מאוישת בגודל מגרש פוטבול, המקיפה את כדור הארץ בגובה 400 ק״מ ובמהירות של 28,000 קמ״ש."
          - "האסטרונאוטים בתחנה מקיפים את כדור הארץ כל 90 דקות, וחווים 16 זריחות ו-16 שקיעות בכל יממה."
          - "צוותים בינלאומיים מארה״ב, אירופה, יפן, קנדה ורוסיה מאיישים את התחנה ברציפות מאז נובמבר 2000."
          - "אסטרונאוטים חייבים להתאמן שעתיים בכל יום כדי למנוע הידלדלות חמורה של עצם ושריר עקב חוסר כבידה (מיקרוגרביטציה)."
      - title: "המרוץ לחלל (1957–1969)"
        points:
          - "המרוץ לחלל החל באוקטובר 1957 כשברית המועצות שיגרה את 'ספוטניק 1', הלוויין המלאכותי הראשון בהיסטוריה."
          - "הקוסמונאוט יורי גגארין היה האדם הראשון בחלל באפריל 1961, כשהקיף את כדור הארץ בחללית 'ווסטוק 1'."
          - "נשיא ארה״ב ג'ון פ' קנדי הציב יעד לאומי ב-1961: להנחית אדם על הירח ולהחזירו בשלום עד סוף אותו עשור."
          - "המרוץ הגיע לשיאו ב-20 ביולי 1969, כשהאסטרונאוט האמריקאי ניל ארמסטרונג דרך על אדמת הירח במשימת 'אפולו 11'."
      - title: "טלסקופי החלל: האבל וג'יימס ווב"
        points:
          - "טלסקופ החלל האבל, ששוגר ב-1990, חולל מהפכה באסטרונומיה כשצילם מעל האטמוספירה המטשטשת של כדור הארץ."
          - "האבל אפשר לקבוע את קצב התפשטות היקום וצילם את תמונת 'עמודי הבריאה' המפורסמת שבה נוצרים כוכבים חדשים."
          - "טלסקופ החלל ג'יימס ווב (JWST), ששוגר בסוף 2021, פועל בנקודת לגראנז' L2 במרחק 1.5 מיליון קילומטרים מכדור הארץ."
          - "בעזרת מראה ענקית מצופה זהב, ג'יימס ווב קולט קרינה תת-אדומה ומצלם את הגלקסיות הקדומות ביותר שנוצרו לאחר המפץ הגדול."
      - title: "חוסר כבידה והאדם בחלל"
        points:
          - "במיקרוגרביטציה, נוזלים אינם נשפכים אלא מרחפים ככדורים מושלמים ורוטטים עקב מתח פנים."
          - "אסטרונאוטים בחלל גובהים עד כ-5 סנטימטרים, מכיוון שדיסקיות עמוד השדרה מתרחבות ללא לחץ הכבידה."
          - "מזון האסטרונאוטים כולל מנות מיובשות בהקפאה וטורטיות במקום לחם רגיל, כדי למנוע היווצרות פירורים מרחפים ומסוכנים."
          - "חליפות חלל מיוחדות מספקות חמצן, לחץ אוויר, בידוד תרמי קיצוני והגנה מפני מיקרו-מטאוריטים במהלך 'הליכות חלל'."
      - title: "חגורת קויפר ועננת אורט"
        points:
          - "מעבר לנפטון משתרעת חגורת קויפר, טבעת ענק של גופים קפואים, שביטים וכוכבי לכת ננסיים כמו פלוטו ואריס."
          - "הרחק מעבר לחגורת קויפר נמצאת 'עננת אורט', מעטפת כדורית ענקית של טריליוני שביטי קרח המקיפה את מערכת השמש."
          - "גבול עננת אורט מגיע כמעט לשנת אור מהשמש, ומגדיר את הגבול הכבידתי החיצוני של מערכת השמש שלנו."
          - "שביטים שזמן הקפתם נמשך אלפי או מיליוני שנים, כמו השביט הייל-בופ, מגיעים מאזורים מרוחקים וקפואים אלו."
      - title: "החיפוש אחר חיים מחוץ לכדור הארץ"
        points:
          - "אסטרונומים גילו מעל 5,500 כוכבי לכת מחוץ למערכת השמש (אקסו-פלנטות), רבים מהם ב-'אזור הישיב' (אזור גולדילוקס)."
          - "ירחים במערכת השמש שלנו, כמו אירופה של צדק ואנקלדוס של שבתאי, מסתירים אוקיינוסים נוזליים וחמימים מתחת לקרום קרח עבה."
          - "רכבי החלל של נאס״א במאדים חוקרים סלעים וקרקעית אגמים קדומים בחיפוש אחר מאובנים של חיידקים מיקרוסקופיים קדומים."
          - "פרויקט SETI סורק את גלי הרדיו מהחלל בעזרת טלסקופי ענק כדי לאתר אותות מלאכותיים מתרבויות תבוניות."
    trivia:
      - type: multiple_choice
        question: "לפני כמה זמן מעריכים מדענים שנוצר היקום באירוע המפץ הגדול?"
        options: ["לפני 4.5 מיליארד שנה", "לפני 13.8 מיליארד שנה", "לפני 100 מיליון שנה", "לפני טריליון שנה"]
        correct: 1
      - type: single_qa
        question: "מהי מהירות האור בקירוב בריק (ואקום)?"
        answer: "כ-300,000 קילומטרים בשנייה"
      - type: multiple_choice
        question: "כמה זריחות ושקיעות חווים האסטרונאוטים בתחנת החלל הבינלאומית בכל יממה?"
        options: ["זריחה ושקיעה אחת", "8 זריחות ושקיעות", "16 זריחות ושקיעות", "24 זריחות ושקיעות"]
        correct: 2
      - type: single_qa
        question: "מי היה האדם הראשון בהיסטוריה שטס לחלל באפריל 1961?"
        answer: "יורי גגארין (Yuri Gagarin)"
      - type: multiple_choice
        question: "מה שמו של הלוויין המלאכותי הראשון ששיגרה ברית המועצות לחלל ב-1957?"
        options: ["ווסטוק 1", "ספוטניק 1 (Sputnik 1)", "אקספלורר 1", "לונה 2"]
        correct: 1
      - type: single_qa
        question: "איזה טלסקופ חלל מפורסם ששוגר ב-1990 צילם את תמונת 'עמודי הבריאה' המרהיבה?"
        answer: "טלסקופ החלל האבל (Hubble Space Telescope)"
      - type: multiple_choice
        question: "איזה טלסקופ חלל מתקדם הפועל באור תת-אדום שוגר בסוף 2021 עם מראה מוזהבת ענקית?"
        options: ["שפיצר", "ג'יימס ווב (James Webb / JWST)", "קפלר", "צ'נדרה"]
        correct: 1
      - type: single_qa
        question: "מדוע אסטרונאוטים אוכלים טורטיות במקום לחם רגיל בתחנת החלל?"
        answer: "כדי למנוע פירורים מרחפים (שעלולים לפגוע במכשירים ובעיניים)"
      - type: multiple_choice
        question: "איזה שינוי פיזי גופני זמני מתרחש בגופם של אסטרונאוטים בעת שהות ממושכת בחוסר כבידה?"
        options: ["הם מתכווצים ב-5 ס״מ", "הם גובהים עד כ-5 ס״מ", "גובהם אינו משתנה כלל", "רגליהם מתקצרות"]
        correct: 1
      - type: single_qa
        question: "איזה נשיא אמריקאי הציב ב-1961 את היעד ההיסטורי להנחית אדם על הירח לפני 1970?"
        answer: "ג'ון פ' קנדי (JFK)"
      - type: multiple_choice
        question: "מהי מהירות המילוט המינימלית הדרושה לרקטה כדי להשתחרר מכוח הכבידה של כדור הארץ?"
        options: ["5,000 קמ״ש", "15,000 קמ״ש", "כ-40,000 קמ״ש (11.2 ק״מ לשנייה)", "100,000 קמ״ש"]
        correct: 2
      - type: single_qa
        question: "איזה ירח קפוא של צדק נחשב ליעד מוביל לחיפוש חיים בזכות אוקיינוס מים נוזלי מתחת לקרח?"
        answer: "אירופה (Europa)"
      - type: multiple_choice
        question: "כיצד נקראת מעטפת השביטים הכדורית הענקית המקיפה את גבולה החיצוני ביותר של מערכת השמש?"
        options: ["חגורת האסטרואידים", "עננת אורט (Oort Cloud)", "טבעת קויפר", "חגורת ואן אלן"]
        correct: 1
      - type: single_qa
        question: "מהם ראשי התיבות של הפרויקט הבינלאומי לחיפוש אותות רדיו מחיים תבוניים בחלל?"
        answer: "SETI (סֶטִי)"
      - type: multiple_choice
        question: "כמה גלקסיות נפרדות מעריכים מדענים שקיימות ביקום הנצפה כולו?"
        options: ["100 מיליון", "10 מיליארד", "כ-2 טריליון גלקסיות", "50 טריליון"]
        correct: 2
      - type: single_qa
        question: "כמה שעות ביום חייבים אסטרונאוטים להתאמן על מכשירי כושר בתחנת החלל כדי לשמור על בריאותם?"
        answer: "שעתיים ביום (2 שעות)"

  - id: planets_solar_system
    title: "כוכבי הלכת של מערכת השמש"
    description: >
      צאו למסע מכוכבי הלכת הסלעיים הלוהטים ועד ענקי הגז ואימפריות הקרח הקפואות! 
      גלו את האקלים, הטבעות, הירחים והגאולוגיה המרתקת של שכנינו בחלל.
    cards:
      - title: "חמה (מרקורי): העולם החרוך והקפוא"
        points:
          - "חמה הוא כוכב הלכת הקטן ביותר במערכת השמש והקרוב ביותר לשמש, אותה הוא מקיף ב-88 ימי ארץ בלבד."
          - "בהיעדר אטמוספירה משמעותית לשמירת חום, שוררים בו הפרשי טמפרטורה קיצוניים: 430°C ביום ומינוס 180°C בלילה."
          - "פני השטח האפורים שלו זרועי מכתשי פגיעה עמוקים ומזכירים מאוד את פני הירח של כדור הארץ."
          - "למרות החום הלוהט ביום, במכתשים עמוקים בקטבים שאינם רואים אור שמש לעולם התגלו מרבצי קרח מים קפואים."
      - title: "נוגה (ונוס): תנור החממה הלוהט"
        points:
          - "נוגה דומה בגודלו ובמבנהו לכדור הארץ ('התאום של כדור הארץ'), אך הוא בעל אטמוספירה דחוסה ורעילה של פחמן דו-חמצני."
          - "אפקט חממה בלתי נשלט הופך אותו לכוכב הלכת החם ביותר במערכת השמש, עם טמפרטורה של 465°C—חם מספיק כדי להתיך עופרת!"
          - "ענניו הצהבהבים והסמיכים מכילים חומצה גופרתית מאכלת, ומסתירים לחלוטין את פני השטח הגעשיים מטלסקופים אופטיים."
          - "נוגה מסתובב סביב צירו בכיוון הפוך מרוב כוכבי הלכת, כך שהשמש זורחת בו במערב ושוקעת במזרח."
      - title: "כדור הארץ: נווה המדבר של החיים"
        points:
          - "כדור הארץ הוא הגרם השמימי היחיד המוכר ביקום שבו יש מים נוזליים יציבים על פני השטח וחיים מפותחים."
          - "מיקומו המדויק ב-'אזור הישיב' (אזור גולדילוקס) מאפשר טמפרטורה מתונה שבה מים אינם קופאים כליל ואינם מתאדים."
          - "האטמוספירה שלנו מורכבת מ-78% חנקן ו-21% חמצן, מגנה מקרינה קוסמית ושורפת מטאורים החודרים מן החלל."
          - "השדה המגנטי העוצמתי שנוצר מליבת הברזל המותכת מטה את רוח השמש המסוכנת ויוצר את הזוהר הקוטבי המרהיב."
      - title: "מאדים (מארס): כוכב הלכת האדום"
        points:
          - "מאדים מקבל את צבעו האדמדם האופייני מתחמוצת ברזל (חלודה) המכסה את מישוריו המדבריים והסלעיים."
          - "הוא ביתו של 'אולימפוס מונס', הר הגעש הגדול ביותר במערכת השמש, שגובהו כמעט פי שלושה מגובה האוורסט!"
          - "עמק מארינריס הוא קניון ענקי החוצה את קו המשווה של מאדים—עמוק פי ארבעה וארוך פי עשרה מהגרנד קניון."
          - "למאדים שני ירחים זעירים בעלי צורה בלתי סדירה של אסטרואידים לכודים: פובוס (פחד) ודימוס (אימה)."
      - title: "צדק (יופיטר): מלך כוכבי הלכת"
        points:
          - "צדק הוא ענק גז עצום שמסתו גדולה יותר מפי שניים ממסת כל שאר כוכבי הלכת במערכת השמש גם יחד."
          - "'הכתם האדום הגדול' הוא סופה אנטי-ציקלונית אדירה הגדולה מכדור הארץ ומשתוללת ברציפות כבר מאות שנים."
          - "לצדק 95 ירחים מוכרים, ביניהם גנימד (הירח הגדול ביותר במערכת השמש, הגדול אף מכוכב חמה)."
          - "הירח איו פולט גייזרים של גופרית לגובה מאות קילומטרים, בעוד אירופה הקפוא מכיל אוקיינוס מים נוזלי ענק."
      - title: "שבתאי (סאטורן): שר הטבעות המרהיב"
        points:
          - "שבתאי מפורסם במערכת הטבעות המרהיבה שלו, המורכבת ממיליארדי גושי קרח מים, סלעים ואבק קוסמי."
          - "אף שהטבעות משתרעות לרוחב של מעל 280,000 ק״מ, עובין הממוצע זעום להפליא—כ-10 מטרים בלבד!"
          - "שבתאי הוא בעל הצפיפות הנמוכה ביותר מבין כוכבי הלכת; מורכב ברובו ממימן והליום, הוא היה צף באמבטיית מים ענקית!"
          - "הירח הענק שלו טיטאן הוא בעל אטמוספירת חנקן סמיכה, גשמי מתאן ואגמים של פחמימנים נוזליים על פניו."
      - title: "אורנוס ונפטון: ענקי הקרח"
        points:
          - "אורנוס ונפטון מוגדרים כ-'ענקי קרח', המורכבים מתערובת דחוסה של מים, אמוניה ומתאן מעל ליבה סלעית."
          - "אורנוס סובב על צידו בצורה ייחודית בנטייה קיצונית של 98 מעלות, ומתגלגל לאורך מסלולו כמו כדור באולינג."
          - "גז המתאן בשכבות האטמוספירה העליונות בולע אור אדום ומחזיר אור כחול, ומעניק לשניהם גוון טורקיז וכחול עמוק."
          - "בנפטון נושבות הרוחות העוצמתיות ביותר במערכת השמש, המגיעות למהירויות על-קוליות של מעל 2,100 קמ״ש."
      - title: "כוכבי לכת ננסיים: פלוטו וקרס"
        points:
          - "בשנת 2006 הגדיר איגוד האסטרונומיה הבינלאומי (IAU) את פלוטו מחדש כ-'כוכב לכת ננסי' כי לא פינה את מסלולו."
          - "הגשושית ניו הורייזונס חלפה ליד פלוטו ב-2015 וגילתה קרחוני חנקן ענקיים ומישור עצום בצורת לב (טומבו רג'יו)."
          - "קרס (Ceres) הוא כוכב הלכת הננסי הקרוב ביותר אלינו, השוכן בתוך חגורת האסטרואידים הראשית בין מאדים לצדק."
          - "כוכבי לכת ננסיים נוספים כוללים את אריס (Eris), האומיה בעל צורת הפוטבול (Haumea) ומאקה-מאקה."
    trivia:
      - type: multiple_choice
        question: "איזה כוכב לכת הוא החם ביותר במערכת השמש עקב אפקט חממה קיצוני?"
        options: ["חמה (מרקורי)", "נוגה (ונוס)", "מאדים", "צדק"]
        correct: 1
      - type: single_qa
        question: "מה שמו של הר הגעש הענק במאדים, שהוא הגבוה ביותר במערכת השמש כולה?"
        answer: "אולימפוס מונס (Olympus Mons)"
      - type: multiple_choice
        question: "איזה כוכב לכת הוא בעל הצפיפות הנמוכה ביותר והיה צף באופן תיאורטי על פני מים?"
        options: ["אורנוס", "נפטון", "שבתאי (סאטורן)", "צדק"]
        correct: 2
      - type: single_qa
        question: "איזו סופה ענקית בצדק גדולה מכדור הארץ ומשתוללת ברציפות כבר מאות שנים?"
        answer: "הכתם האדום הגדול (The Great Red Spot)"
      - type: multiple_choice
        question: "איזה כוכב לכת סובב על צידו בנטייה קיצונית של 98 מעלות ומתגלגל על מסלולו?"
        options: ["אורנוס", "נפטון", "שבתאי", "חמה"]
        correct: 0
      - type: single_qa
        question: "מהם שמות שני ירחיו הקטנים של מאדים הדומים לאסטרואידים?"
        answer: "פובוס ודימוס (Phobos and Deimos)"
      - type: multiple_choice
        question: "איזה גז באטמוספירה של אורנוס ונפטון בולע אור אדום ומעניק להם צבע כחלחל מרהיב?"
        options: ["חמצן", "מתאן", "הליום", "פחמן דו-חמצני"]
        correct: 1
      - type: single_qa
        question: "איזה ירח ענק של שבתאי הוא בעל אטמוספירת חנקן סמיכה ואגמים של מתאן נוזלי?"
        answer: "טיטאן (Titan)"
      - type: multiple_choice
        question: "באיזו שנה סווג פלוטו מחדש ככוכב לכת ננסי על ידי איגוד האסטרונומיה הבינלאומי?"
        options: ["1999", "2006", "2012", "2015"]
        correct: 1
      - type: single_qa
        question: "מהו הירח הגדול ביותר במערכת השמש, המקיף את צדק וגדול אף מכוכב חמה?"
        answer: "גנימד (Ganymede)"
      - type: multiple_choice
        question: "ממה מורכבות בעיקר הטבעות המרשימות של שבתאי?"
        options: ["זהב ונחושת", "גושי קרח מים, סלעים ואבק", "חנקן נוזלי", "מטאוריטים של ברזל"]
        correct: 1
      - type: single_qa
        question: "כמה ימי ארץ נמשכת הקפה שלמה אחת של כוכב חמה סביב השמש?"
        answer: "88 ימי ארץ"
      - type: multiple_choice
        question: "באיזה כוכב לכת נמדדו הרוחות המהירות ביותר במערכת השמש, מעל 2,100 קמ״ש?"
        options: ["צדק", "שבתאי", "נפטון", "כדור הארץ"]
        correct: 2
      - type: single_qa
        question: "איזה חומר כימי מקנה למאדים את צבעו האדמדם האופייני?"
        answer: "תחמוצת ברזל (חלודה)"
      - type: multiple_choice
        question: "מה שמו של כוכב הלכת הננסי השוכן בתוך חגורת האסטרואידים הראשית בין מאדים לצדק?"
        options: ["קרס (Ceres)", "פלוטו", "אריס", "סדנה"]
        correct: 0
      - type: single_qa
        question: "איזו גשושית של נאס״א חלפה ליד פלוטו ב-2015 וצילמה את מישור הקרח בצורת לב?"
        answer: "ניו הורייזונס (New Horizons)"

  - id: moon_and_phases
    title: "הירח ומופעיו"
    description: >
      גלו את המדע, המסתורין והיופי של השכן השמימי הקרוב ביותר לכדור הארץ! 
      מגאות ושפל ומופעי הירח ועד מכתשי ענק ואתרי הנחיתה ההיסטוריים.
    cards:
      - title: "השערת ההתנגשות הענקית"
        points:
          - "מדענים סבורים כי הירח נוצר לפני כ-4.5 מיליארד שנה כאשר פרוטופלנטה בגודל מאדים בשם 'תיאה' התנגשה בכדור הארץ הצעיר."
          - "ההתנגשות האדירה העיפה כמויות עצומות של סלעים מותכים למסלול, שהתגבשו עם הזמן ויצרו את הירח."
          - "סלעי ירח שהביאו אסטרונאוטי אפולו אישרו כי כדור הארץ והירח חולקים חותם איזוטופי כמעט זהה של חמצן."
          - "נוכחותו של הירח מייצבת את זווית נטיית הציר של כדור הארץ, ומונעת שינויי אקלים פראיים שאפשרו לחיים לשגשג."
      - title: "שמונת מופעי הירח"
        points:
          - "הירח אינו מייצר אור בעצמו, אלא מחזיר את אור השמש בעת שהוא מקיף את כדור הארץ כל 29.5 ימים (חודש סינודי)."
          - "שמונת המופעים לפי הסדר: מולד הירח, סהר מתמלא, רבע ראשון, ירח קמור מתמלא, ירח מלא, ירח קמור מתמעט, רבע אחרון וסהר מתמעט."
          - "'ירח כחול' (Blue Moon) הוא כינוי פופולרי לתופעה נדירה של ירח מלא שני המתרחש בתוך חודש לועזי אחד."
          - "בחצי הכדור הצפוני, כשהירח גדל (מתמלא) הוא נראה בצורת האות D (או קשת מימין), וכשהוא מתמעט הוא נראה כקשת משמאל."
      - title: "גאות ושפל ומשיכת האוקיינוסים"
        points:
          - "כוח הכבידה של הירח מושך את מי האוקיינוסים של כדור הארץ, ויוצר תופעות גאות ושפל פעמיים בכל יום."
          - "כאשר השמש, כדור הארץ והירח מתיישרים בקו ישר (בירח מלא ובמולד ירח), כוחותיהם מתאחדים לגאות חזקה במיוחד ('גאות אביב')."
          - "כאשר הירח ניצב ב-90 מעלות לשמש (ברבעי הירח), כוחות המשיכה מקזזים זה את זה ויוצרים גאות מתונה ('גאות נמוכה')."
          - "חיכוך הגאות מאט בהדרגה את סיבוב כדור הארץ בכ-1.4 מילי-שניות במאה שנה ומרחיק את הירח בכ-3.8 ס״מ בשנה."
      - title: "הצד הנסתר של הירח"
        points:
          - "הירח נמצא ב-'נעילת גאות' (Tidal Locking) עם כדור הארץ: זמן סיבובו סביב צירו זהה בדיוק לזמן הקפתו את כדור הארץ (27.3 ימים)."
          - "עקב כך, אותו צד של הירח פונה תמיד אל כדור הארץ; האנושות לא ראתה את הצד הנסתר עד שגשושית סובייטית צילמה אותו ב-1959."
          - "הצד הנסתר מכונה לעיתים בטעות 'הצד האפל', אך הוא מקבל בדיוק את אותה כמות אור שמש כמו הצד הפונה אלינו."
          - "שלא כמו הצד המוכר, קרום הצד הנסתר עבה בהרבה ורווי מכתשים, כמעט ללא 'ימות' געשיות כהות."
      - title: "ליקויי חמה וליקויי לבנה"
        points:
          - "ליקוי חמה מתרחש כאשר הירח עובר בדיוק בין השמש לכדור הארץ, ומטיל את צילו (Umbra) על פני כדור הארץ."
          - "בצירוף מקרים קוסמי מדהים, השמש גדולה פי 400 מהירח אך גם רחוקה פי 400, ולכן שניהם נראים בדיוק באותו גודל בשמיים!"
          - "ליקוי לבנה מתרחש כאשר כדור הארץ עובר בדיוק בין השמש לירח, ומטיל את צילו על הירח המלא."
          - "במהלך ליקוי לבנה מלא, קרני שמש הנשברות באטמוספירה של כדור הארץ צובעות את הירח בגוון אדום-נחושת ('ירח דם')."
      - title: "ימות הירח וים השלווה"
        points:
          - "האזורים הכהים הנראים על פני הירח נקראים 'ימות' (Maria), מישורי בזלת ענקיים שנוצרו מלבה געשית עתיקה."
          - "אסטרונומים קדומים האמינו בטעות שמשטחים חלקים וכהים אלו הם אוקיינוסים של מים נוזליים."
          - "'ים השלווה' (Mare Tranquillitatis) הוא האתר ההיסטורי שבו נחת רכב הנחיתה 'איגל' של משימת אפולו 11 ב-1969."
          - "האזורים הבהירים של הירח הם רמות הרריות עתיקות ומצולקות ממכתשים העשויות מסלע אנורתוזיט בהיר."
      - title: "קרח מים במכתשי הקטבים"
        points:
          - "מכיוון שנטיית ציר הירח היא 1.5 מעלות בלבד, קרקעית המכתשים העמוקים בקטבי הירח אינה רואה אור שמש לעולם."
          - "אזורים מוצללים לצמיתות אלו מהווים 'מלכודות קור', ומשמרים מיליארדי טונות של קרח מים בטמפרטורה של מינוס 200°C."
          - "הקרח התגלה בידי לווייני מחקר כמו לונר פרוספקטור וצ'אנדריאן, ומהווה משאב יקר ערך למסעות עתידיים."
          - "אסטרונאוטים בעתיד יוכלו להתיך את הקרח למי שתייה ולפרק אותו למימן וחמצן לייצור דלק רקטות."
      - title: "תוכנית ארטמיס ובסיסי העתיד"
        points:
          - "תוכנית 'ארטמיס' של נאס״א שואפת להנחית את האישה הראשונה והאדם הלא-לבן הראשון על הירח ולבסס נוכחות קבועה."
          - "התוכנית עושה שימוש ברקטת הענק SLS, בחללית 'אוריון' וברכבי נחיתה מסחריים מתקדמים."
          - "במסגרת התוכנית תיבנה תחנת החלל 'לונר גייטוויי' (Gateway) במסלול סביב הירח לתמיכה במשימות מחקר."
          - "ביסוס נוכחות קבועה על הירח מהווה מקפצה טכנולוגית הכרחית לקראת המסע המאויש העתידי של האנושות למאדים."
    trivia:
      - type: multiple_choice
        question: "איזו פרוטופלנטה עתיקה מעריכים מדענים שהתנגשה בכדור הארץ ויצרה את הירח?"
        options: ["קרס", "תיאה (Theia)", "וסטה", "נמסיס"]
        correct: 1
      - type: single_qa
        question: "כיצד נקרא מופע הירח שבו החלק המואר הולך וגדל מדי לילה?"
        answer: "ירח מתמלא (Waxing)"
      - type: multiple_choice
        question: "מדוע מכדור הארץ אנו רואים תמיד רק צד אחד קבוע של הירח?"
        options: ["הירח אינו מסתובב כלל", "הירח בנעילת גאות (זמן הסיבוב שווה לזמן ההקפה)", "השדה המגנטי של כדור הארץ חוסם אותו", "הצד השני שרוי בחושך תמידי"]
        correct: 1
      - type: single_qa
        question: "מהו הכינוי הפופולרי להופעת שני ירחים מלאים באותו חודש לועזי?"
        answer: "ירח כחול (Blue Moon)"
      - type: multiple_choice
        question: "איזה סוג ליקוי מתרחש כאשר הירח עובר בדיוק בין השמש לכדור הארץ?"
        options: ["ליקוי לבנה", "ליקוי חמה (Solar Eclipse)", "ליקוי כוכבי", "מעבר פלנטרי"]
        correct: 1
      - type: single_qa
        question: "באיזה גוון מופיע הירח במהלך ליקוי לבנה מלא ('ירח דם')?"
        answer: "אדום (אדום-נחושת)"
      - type: multiple_choice
        question: "מה שמו של מישור הבזלת הירחי המפורסם שבו נחתה אפולו 11 לראשונה ב-1969?"
        options: ["אוקיינוס הסערות", "ים השלווה (Sea of Tranquility)", "ים הרוגע", "מכתש קופרניקוס"]
        correct: 1
      - type: single_qa
        question: "בכמה סנטימטרים מתרחק הירח מכדור הארץ מדי שנה עקב חיכוך הגאות?"
        answer: "כ-3.8 סנטימטרים בשנה"
      - type: multiple_choice
        question: "כיצד נקראים המישורים החלקים והכהים על פני הירח שנוצרו מלבה קדומה?"
        options: ["ימות (Maria)", "רמות (Terrae)", "קלדרות", "רגוליט"]
        correct: 0
      - type: single_qa
        question: "איזה משאב טבע חיוני למסעות חלל התגלה קפוא בקרקעית המכתשים בקטבי הירח?"
        answer: "קרח מים"
      - type: multiple_choice
        question: "מה שמה של תוכנית החלל המודרנית של נאס״א להחזרת אסטרונאוטים לירח במאה ה-21?"
        options: ["אפולו", "ארטמיס (Artemis)", "ג'מיני", "מרקורי"]
        correct: 1
      - type: single_qa
        question: "כמה ימים נמשך מחזור שלם של שמונת מופעי הירח (חודש סינודי)?"
        answer: "29.5 ימים"
      - type: multiple_choice
        question: "איזו גאות חזקה במיוחד נוצרת כשהשמש, כדור הארץ והירח מתיישרים בקו ישר?"
        options: ["גאות נמוכה", "גאות אביב (Spring Tide)", "גאות נסוגה", "גאות חצי-יומית"]
        correct: 1
      - type: single_qa
        question: "מה שמה של תחנת החלל הבינלאומית המתוכננת להקיף את הירח במסגרת תוכנית ארטמיס?"
        answer: "לונר גייטוויי (Lunar Gateway)"
      - type: multiple_choice
        question: "בכמה פעמים גדולה השמש בקוטרה מהירח, יחס הזהה ליחס המרחקים שלהם מכדור הארץ?"
        options: ["פי 10", "פי 50", "פי 400", "פי 1,000"]
        correct: 2
      - type: single_qa
        question: "איזו מדינה שיגרה את הגשושית 'לונה 3' שצילמה לראשונה את הצד הנסתר של הירח ב-1959?"
        answer: "ברית המועצות (ברה״מ)"

  - id: famous_space_missions
    title: "משימות חלל ורכבי מחקר מפורסמים"
    description: >
      חוו מחדש את ההרפתקאות הגדולות של המין האנושי אל הלא-נודע! 
      מהצעדים הראשונים על הירח ועד רכבי מחקר רובוטיים החורצים את ערוצי מאדים.
    cards:
      - title: "אפולו 11 והנחיתה על הירח"
        points:
          - "שוגרה ב-16 ביולי 1969 על גבי רקטת הענק סטורן 5, ונשאה את ניל ארמסטרונג, באז אולדרין ומייקל קולינס."
          - "ב-20 ביולי 1969 דרך ארמסטרונג על אדמת הירח והכריז: 'זהו צעד קטן לאדם, זינוק ענק לאנושות'."
          - "ארמסטרונג ואולדרין שהו 21.5 שעות על פני הירח, אספו 21.5 ק״ג של דגימות סלעים והציבו את דגל ארה״ב."
          - "בין 1969 ל-1972 צעדו בסך הכל 12 בני אדם על הירח בשש משימות אפולו מוצלחות."
      - title: "וויאג'ר 1 ו-2: הנוסעים הבינכוכביים"
        points:
          - "שוגרו ב-1977 וניצלו היערכות נדירה של כוכבי הלכת למסע 'הסיור הגדול' בצדק, שבתאי, אורנוס ונפטון."
          - "כל גשושית נושאת 'תקליט זהב' מנחושת מצופה זהב עם ברכות ב-55 שפות, מוזיקה (באך, מוצרט, צ'אק ברי) וקולות מכדור הארץ."
          - "בשנת 2012 עשתה וויאג'ר 1 היסטוריה כשהפכה לעצם הראשון מעשה ידי אדם שיצא אל המרחב הבינכוכבי."
          - "וויאג'ר 1 צילמה ב-1990 את תמונת 'נקודה כחולה חיוורת' המפורסמת, שבה נראה כדור הארץ כגרגר אבק זעיר בקרן שמש."
      - title: "רכבי המאדים: ספיריט, אופורטיוניטי, קיוריוסיטי ופרסווירנס"
        points:
          - "ספיריט ואופורטיוניטי נחתו במאדים ב-2004; אופורטיוניטי תוכננה לפעול 90 יום בלבד אך פעלה 14 שנים שלמות!"
          - "הרובר קיוריוסיטי, הפועל על כוח גרעיני, נחת במכתש גייל ב-2012 וגילה שבעבר היו במאדים אגמי מים מתוקים ראויים לחיים."
          - "הרובר פרסווירנס נחת במכתש ג'זרו ב-2021 כדי לקדוח ולאסוף דגימות קרקע להחזרה עתידית לכדור הארץ."
          - "פרסווירנס נשא עמו את 'אינג'ניואיטי', מסוק רובוטי שביצע את הטיסה הממונעת הראשונה בהיסטוריה באטמוספירה של כוכב אחר."
      - title: "משימת קאסיני-הויגנס לשבתאי"
        points:
          - "קאסיני הקיפה את שבתאי בין 2004 ל-2017 ותרמה תגליות מהפכניות על כוכב הלכת, טבעותיו וירחיו."
          - "גשושית המחקר האירופית הויגנס נפרדה מקאסיני ב-2005 ונחתה בהצלחה היסטורית על פני הירח טיטאן."
          - "קאסיני גילתה גייזרים פעילים של מים חמימים ותרכובות אורגניות הפורצים מהקוטב הדרומי של הירח הקפוא אנקלדוס."
          - "בסיום משימתה צללה קאסיני בהתרסקות מבוקרת ומתוכננת לתוך אטמוספירת שבתאי כדי למנוע זיהום ירחים בעלי פוטנציאל חיים."
      - title: "ניו הורייזונס: המסע לפלוטו"
        points:
          - "שוגרה ב-2006 והייתה הגשושית המהירה ביותר ששוגרה אי פעם מכדור הארץ, במהירות של מעל 58,000 קמ״ש."
          - "ביולי 2015 ביצעה את היעף הקרוב הראשון אי פעם סביב פלוטו ושידרה תצלומים מרהיבים ברזולוציה גבוהה."
          - "התברר שפלוטו פעיל גאולוגית, עם הרי קרח מים בגובה 3,000 מטרים וקרחוני חנקן נעים."
          - "ב-2019 עשתה הגשושית היסטוריה נוספת כשהגיעה לארוקות' (Arrokoth), גוף קדמון וקפוא בחגורת קויפר המרוחקת."
      - title: "משימות השירות לטלסקופ החלל האבל"
        points:
          - "כאשר האבל הוצב בחלל ב-1990 התגלה פגם מיקרוסקופי בליטוש המראה הראשית שגרם לתמונות מטושטשות."
          - "ב-1993 ביצעו אסטרונאוטי מעבורת החלל אנדוור משימת תיקון נועזת והתקינו מערכת אופטית מתקנת (COSTAR)—כמו 'משקפיים' לטלסקופ."
          - "נאס״א ביצעה 5 משימות שירות ותיקון בעזרת מעבורות חלל, בהן שודרגו המכשירים, הסוללות והגירוסקופים בחלל."
          - "האבל פועל כבר למעלה מ-30 שנה וביצע מעל 1.5 מיליון תצפיות מדעיות ששינו את תפיסת היקום."
      - title: "פריסת טלסקופ החלל ג'יימס ווב"
        points:
          - "שלא כמו האבל, את ג'יימס ווב לא ניתן לתקן בחלל כי הוא פועל במרחק עצום של 1.5 מיליון ק״מ מכדור הארץ."
          - "הטלסקופ נדרש לבצע מעל 300 שלבי פריסה מכניים מורכבים בזה אחר זה בחלל העמוק."
          - "הפריסה כללה מגן שמש ענק בגודל מגרש טניס בעל 5 שכבות ויישור מדויק של 18 מקטעי מראה משושים מצופים זהב."
          - "הפריסה הושלמה בהצלחה מושלמת, ומאפשרת לחקור את הכוכבים והגלקסיות הראשונים שנוצרו ביקום."
      - title: "פיוניר 10 ו-11 ורשת החלל העמוק"
        points:
          - "פיוניר 10 (1972) הייתה החללית הראשונה שחצתה בהצלחה את חגורת האסטרואידים וביצעה יעף קרוב סביב צדק."
          - "גשושיות פיוניר נשאו לוחיות אלומיניום מוזהבות עם איורים של דמויות אנושיות ומיקום כדור הארץ ביחס לפולסרים."
          - "רשת החלל העמוק של נאס״א (DSN) מפעילה אנטנות רדיו ענקיות בקליפורניה, ספרד ואוסטרליה לתקשורת עם גשושיות החלל."
          - "משימות חלוציות אלו הניחו את התשתית לניווט בחלל עמוק, רובוטיקה אוטונומית ומסעות בינכוכביים."
    trivia:
      - type: multiple_choice
        question: "אילו מילים היסטוריות אמר ניל ארמסטרונג כשדרך על הירח ביולי 1969?"
        options: ["הנשר נחת", "זהו צעד קטן לאדם, זינוק ענק לאנושות", "באנו לשלום בשם כל האנושות", "כאן בני כדור הארץ דרכו לראשונה"]
        correct: 1
      - type: single_qa
        question: "כמה בני אדם בסך הכל צעדו על פני אדמת הירח לאורך כל משימות תוכנית אפולו?"
        answer: "12 בני אדם (אסטרונאוטים אמריקאים)"
      - type: multiple_choice
        question: "איזה חפץ ייחודי הנושא הקלטות קול ומוזיקה מרחבי כדור הארץ הוצמד לגשושיות וויאג'ר?"
        options: ["תקליטור הכסף", "תקליט הזהב (Golden Record)", "קוביית הבדולח", "שבב הסיליקון"]
        correct: 1
      - type: single_qa
        question: "איזה מסוק רובוטי זעיר עשה היסטוריה ב-2021 כשביצע את הטיסה הממונעת הראשונה במאדים?"
        answer: "אינג'ניואיטי (Ingenuity)"
      - type: multiple_choice
        question: "איזה רובר מחקר נחת במאדים ב-2004 ופעל במשך 14 שנים במקום 90 יום כמתוכנן?"
        options: ["סוג'ורנר", "ספיריט", "אופורטיוניטי (Opportunity)", "קיוריוסיטי"]
        correct: 2
      - type: single_qa
        question: "איזה תצלום מפורסם של כדור הארץ צילמה וויאג'ר 1 ב-1990 ממרחק 6 מיליארד קילומטרים?"
        answer: "נקודה כחולה חיוורת (Pale Blue Dot)"
      - type: multiple_choice
        question: "איזו גשושית מחקר ביצעה את היעף הקרוב ההיסטורי הראשון סביב פלוטו ביולי 2015?"
        options: ["וויאג'ר 2", "ניו הורייזונס (New Horizons)", "קאסיני", "פיוניר 11"]
        correct: 1
      - type: single_qa
        question: "איזו חללית חקרה את שבתאי במשך 13 שנה והנחיתה את הגשושית הויגנס על טיטאן?"
        answer: "קאסיני (Cassini / קאסיני-הויגנס)"
      - type: multiple_choice
        question: "איזה פגם גרם לטלסקופ החלל האבל לצלם תמונות מטושטשות מיד לאחר שיגורו ב-1990?"
        options: ["אנטנה שבורה", "פגם בליטוש המראה הראשית (אברציה כדורית)", "עדשה עכורה", "חיישן שרוף"]
        correct: 1
      - type: single_qa
        question: "איזו רקטת ענק שיגרה את חללית אפולו 11 וצוותה לעבר הירח ב-1969?"
        answer: "סטורן 5 (Saturn V)"
      - type: multiple_choice
        question: "באיזו שנה עשתה וויאג'ר 1 היסטוריה כשהפכה לעצם הראשון מעשה ידי אדם שיצא לחלל הבינכוכבי?"
        options: ["1999", "2005", "2012", "2020"]
        correct: 2
      - type: single_qa
        question: "באיזה ירח של שבתאי גילתה קאסיני גייזרים פעילים של אדי מים ותרכובות אורגניות?"
        answer: "אנקלדוס (Enceladus)"
      - type: multiple_choice
        question: "מה שמה של רשת אנטנות הרדיו העולמית של נאס״א המשמשת לתקשורת עם גשושיות בחלל העמוק?"
        options: ["רשת החלל העמוק (DSN)", "מערך הלוויינים הגלובלי", "רשת הממסר המסלולית", "הקשר הרדיופוני הקוסמי"]
        correct: 0
      - type: single_qa
        question: "איזה אסטרונאוט מאפולו 11 נשאר במסלול סביב הירח בחללית הפיקוד בעוד חבריו צועדים על הקרקע?"
        answer: "מייקל קולינס (Michael Collins)"
      - type: multiple_choice
        question: "איזה רכב מחקר בגודל מכונית מונע בכוח גרעיני נחת במכתש גייל במאדים ב-2012 בעזרת 'עגורן שמיים'?"
        options: ["פת'פיינדר", "קיוריוסיטי (Curiosity)", "ויקינג 1", "פרסווירנס"]
        correct: 1
      - type: single_qa
        question: "כמה מקטעי מראה משושים מצופים זהב מרכיבים את המראה הראשית של טלסקופ ג'יימס ווב?"
        answer: "18 מקטעים"

  - id: stars_and_constellations
    title: "כוכבים, קבוצות כוכבים וגלקסיות"
    description: >
      הביטו למעלה אל שמי הלילה הנוצצים! למדו כיצד נולדים כוכבים בערפיליות, 
      נווטו בעזרת קבוצות כוכבים עתיקות וגלו את זרועותיהן הלולייניות של גלקסיות ענק.
    cards:
      - title: "בתי יולדות לכוכבים: כיצד נולד כוכב"
        points:
          - "כוכבים נולדים בתוך ענני ענק קרים של גז ואבק בין-כוכבי המכונים 'ערפיליות' (כמו ערפילית אוריון)."
          - "כוח הכבידה דוחס גושי גז עד שהליבה מגיעה ללחץ עצום ולטמפרטורה של מעל 10 מיליון מעלות צלזיוס."
          - "בטמפרטורה זו נצת היתוך גרעיני, הממזג אטומי מימן להליום ופולט כמויות אדירות של אור וחום."
          - "כוכב מבלה את רוב חייו במצב יציב המכונה 'הסדרה הראשית', שבו לחץ ההיתוך מאזן במדויק את משיכת הכבידה."
      - title: "השמש: הננס הצהוב שלנו"
        points:
          - "השמש שלנו היא כוכב מסוג ננס צהוב המכיל 99.86% מכלל המסה של מערכת השמש כולה."
          - "בכל שנייה מתיכה ליבת השמש 600 מיליון טונות של מימן להליום, ומייצרת את האור והחום המקיימים חיים."
          - "התפרצויות שמש ופליטות מסה עטרתית שולחות סערות מגנטיות לחלל, היוצרות את הזוהר הצפוני בכדור הארץ."
          - "גיל השמש הוא כ-4.6 מיליארד שנה—באמצע תוחלת חייה המוערכת בכ-10 מיליארד שנה לפני שתתנפח ל-'ענק אדום'."
      - title: "העגלה הגדולה וכוכב הצפון (פולאריס)"
        points:
          - "'העגלה הגדולה' היא תבנית כוכבים מוכרת (אסטריזם) המהווה חלק מקבוצת הכוכבים הגדולה 'הדובה הגדולה' (Ursa Major)."
          - "שני הכוכבים החיצוניים בדופן העגלה (מראק ודובהה) נקראים 'המכוונים' כי קו ישר דרכם מצביע ישירות אל כוכב הצפון."
          - "כוכב הצפון (פולאריס) ניצב כמעט במדויק מעל הקוטב הצפוני הגאוגרפי, ונראה נייח בעוד כל שאר הכוכבים סובבים סביבו."
          - "במשך אלפי שנים שימש פולאריס כמצפן שמיימי חיוני לספנים, חוקרים ושיירות מדבר לניווט לילי."
      - title: "אוריון הצייד וביטלג'וז"
        points:
          - "אוריון היא אחת מקבוצות הכוכבים הבולטות והמוכרות ביותר בשמי החורף, ומפורסמת בשלושת כוכבי 'חגורת אוריון'."
          - "בכתפו השמאלית העליונה זורח ביטלג'וז (Betelgeuse), על-ענק אדום כה עצום שאם היה במקום השמש, היה בולע את מאדים וצדק!"
          - "ברגלו הימנית התחתונה זוהר ריג'ל (Rigel), על-ענק כחול-לבן בוהק המאיר בעוצמה של פי עשרות אלפים מהשמש שלנו."
          - "מתחת לחגורה תלויה 'חרב אוריון', המכילה את ערפילית אוריון המפורסמת שבה נוצרים כוכבים חדשים ברגעים אלו."
      - title: "סופרנובות וכוכבי נייטרונים"
        points:
          - "כאשר כוכב מאסיבי מכלה את הדלק הגרעיני שלו, ליבתו קורסת והוא מתפוצץ בהבזק קולוסלי המכונה 'סופרנובה'."
          - "סופרנובה בודדת יכולה להאיר בעוצמה הגבוהה מכל הגלקסיה כולה, ויוצרת יסודות כבדים כמו זהב, כסף ופלטינה."
          - "שריד הליבה הקורסת עשוי להפוך ל-'כוכב נייטרונים'—עצם כה דחוס שחומר בגודל קוביית סוכר ממנו שוקל כמיליארד טון!"
          - "כוכבי נייטרונים המסתחררים במהירות עצומה ופולטים אלומות קרינה סדירות כמו מגדלור קוסמי נקראים 'פולסרים'."
      - title: "גלקסיית שביל החלב"
        points:
          - "מערכת השמש שלנו שוכנת בתוך שביל החלב, גלקסיה ספירלית בעלת מוט המכילה בין 100 ל-400 מיליארד כוכבים."
          - "קוטר שביל החלב הוא כ-100,000 שנות אור, והשמש שלנו ממוקמת באחת מזרועותיה המכונה 'זרוע אוריון'."
          - "לוקח למערכת השמש שלנו כ-230 מיליון שנה להשלים הקפה אחת סביב מרכז הגלקסיה ('שנה גלקטית')."
          - "במרכז שביל החלב רובץ חור שחור סופר-מאסיבי בשם Sagittarius A* (סגיטריוס A*), שמסתו פי 4.3 מיליון ממסת השמש."
      - title: "אנדרומדה והקבוצה המקומית"
        points:
          - "גלקסיית אנדרומדה (M31) היא הגלקסיה הספירלית הגדולה הקרובה ביותר אלינו, במרחק של כ-2.5 מיליון שנות אור."
          - "אנדרומדה נראית בעין בלתי מזוינת בלילות חשוכים, והיא העצם השמיימי הרחוק ביותר שניתן לראות ללא טלסקופ."
          - "שביל החלב ואנדרומדה נעות זו לעבר זו במהירות 110 ק״מ לשנייה, וצפויות להתנגש ולהתמזג בעוד כ-4.5 מיליארד שנה."
          - "יחד עם גלקסיית המשולש ועשרות גלקסיות ננסיות, הן מרכיבות את השכונה הקוסמית שלנו המכונה 'הקבוצה המקומית'."
      - title: "12 קבוצות גלגל המזלות"
        points:
          - "גלגל המזלות (הזודיאק) הוא רצועה בשמיים שבה נראים השמש, הירח וכוכבי הלכת נעים לאורך מישור המילקה במהלך השנה."
          - "אסטרונומים בבליים ויוונים קדומים הגדירו 12 קבוצות מזלות מסורתיות, בהן טלה, שור, תאומים, אריה ועקרב."
          - "עקב 'נקיפת ציר כדור הארץ' (תנועת סביבון איטית של הציר במחזור של 26,000 שנה), מיקומי הקבוצות זזו מאז העת העתיקה."
          - "עבור תרבויות קדומות, קבוצות הכוכבים שימשו לוח שנה חקלאי חיוני לתזמון מועדי זריעה, קציר וחגים."
    trivia:
      - type: multiple_choice
        question: "איזה תהליך גרעיני מניע את השמש ואת שאר הכוכבים באמצעות מיזוג אטומי מימן להליום?"
        options: ["ביקוע גרעיני", "היתוך גרעיני (Nuclear Fusion)", "בעירה כימית", "דעיכה רדיואקטיבית"]
        correct: 1
