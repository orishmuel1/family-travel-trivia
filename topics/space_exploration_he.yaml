        answer: "ביטלג'וז (Betelgeuse)"
      - type: multiple_choice
        question: "כיצד נקרא כוכב נייטרונים המסתחרר במהירות עצומה ופולט אלומות קרינה קבועות כפולסים?"
        options: ["קוואזר", "פולסר (Pulsar)", "מגנטר", "ננס אדום"]
