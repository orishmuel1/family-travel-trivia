        options: ["אירוניה טרגית", "הגזמה פרועה והיפרבולה", "משקל חרוזי נוקשה", "ריאליזם היסטורי מדויק"]
        correct: 1
      - type: single_qa
        question: "באיזה כלי עירבבו הטבחים של פול באניין את בלילת הפנקייקים לחיילי המחנה?"
        answer: "מערבל בטון"
