  - id: anansi_the_spider
    title: "מעשיות אנאנסי העכביש"
    description: >
      היכנסו לעולם השנון והצבעוני של הפולקלור המערב-אפריקאי והקריבי! 
      הכירו את אנאנסי העכביש, אל התכסיסים האולטימטיבי שמערים על ענקים וקונה את כל סיפורי העולם.
    cards:
      - title: "אנאנסי אל התכסיסים"
        points:
          - "אנאנסי (הידוע גם בשם קוואקו אנאנסי) נולד במסורת שבעל פה העשירה של בני האשנטי בגאנה שבמערב אפריקה."
          - "הוא תכסיסן משנה צורה היכול להופיע כעכביש, כאדם בעל שמונה גפיים או כשילוב של שניהם."
          - "למרות גופו הקטן ופגיעותו הפיזית, אנאנסי מנצח חיות גדולות וחזקות ממנו בהרבה אך ורק בעזרת שכל חריף."
          - "הוא נערץ כ'אדון הסיפורים', ומסמל תושייה אנושית, הישרדות וניצחון השכל על פני הכוח הגס."
      - title: "קניית סיפורי העולם מניאמה"
        points:
          - "בראשית הימים, כל סיפורי העולם היו נעולים בתוך תיבת זהב אצל ניאמה, אל השמיים של בני האשנטי."
          - "אנאנסי ביקש לקנות את הסיפורים, אך ניאמה דרש מחיר שנחשב לבלתי אפשרי: לכידת ארבעת היצורים המסוכנים ביותר בעולם."
          - "ניאמה דרש את: אוסבו הנמר בעל שיני החנית, אוניני פיתון הענק, צרעות המובורו העוקצות ומוטיאה פיית היער הבלתי נראית."
          - "בעוד שלוחמים עזי נפש נכשלו, אנאנסי קיבל על עצמו את המשימה כשהוא חמוש באסטרטגיה מבריקה בלבד."
      - title: "כיצד לכד אנאנסי את ארבעת היצורים"
        points:
          - "כדי ללכוד את הצרעות, שפך מים מעלה על ראשן וטען שיורד גשם עז, ושיכנע אותן להסתתר בתוך דלעת יבשה שפקק."
          - "כדי לתפוס את הפיתון, טען שהנחש אינו ארוך כמו מקל חזרן, ופיתה אותו להישכב לצד המקל וקשר אותו."
          - "כדי ללכוד את הנמר, חפר בור עמוק וכשהנמר נפל פנימה, הציע למשוך אותו עם חבלים שקשרו את רגליו."
          - "אל השמיים עמד במילתו, פתח את תיבת הזהב ופיזר את הסיפורים בכל רחבי העולם לטובת כל בני האדם."
      - title: "מדוע יש לעכבישים מותניים צרות"
        points:
          - "במעשייה משעשעת, הריח אנאנסי תבשילי חג טעימים שהתבשלו בשני כפרים שכנים באותו אחר הצהריים."
          - "מכיוון שלא ידע לאיזה כפר ללכת, קשר קור עכביש סביב מותניו ונתן קצה לכל כפר, באומרו שימשכו כשהאוכל מוכן."
          - "שני הכפרים סיימו לבשל בדיוק באותו הרגע ומשכו את הקורים בבת אחת בכל כוחם לכיוונים מנוגדים!"
          - "משיכת החבל המתחרה סחטה את מותניו של אנאנסי בכוח, ומאז ועד היום יש לכל העכבישים מותניים צרות ודקיקות."
      - title: "אנאנסי וכד החוכמה"
        points:
          - "אנאנסי אסף את כל חוכמת העולם לתוך כד חרס גדול, מתוך כוונה לשמור את כולה לעצמו בלבד."
          - "הוא ניסה לטפס על עץ דקל גבוה כדי להחביא את הכד בצמרת כשהוא קשור לחזהו, אך הכד הפריע לו לטפס."
          - "בנו הצעיר נטיקומה צפה בו וצחק: 'אבא, למה שלא תקשור את הכד לגב כדי שידייך יהיו חופשיות לטפס?'"
          - "כשהבין שבנו הקטן כבר מחזיק בחוכמה שלא הייתה לו, השליך אנאנסי את הכד בכעס, והוא התנפץ והפיץ את החוכמה לכולם."
      - title: "אנאנסי וחמש הבטטות"
        points:
          - "מכשפה הטילה קללה שכל מי שיבטא בקול את המילה 'חמש' ישקע מיד בשינה עמוקה."
          - "אנאנסי סידר חמש ערימות של בטטות לצד הדרך ופיתה חיות רעבות לספור אותן כדי שיירדמו ויוכל לגנוב את מזונן."
          - "כשהגיעה הגברת פנינית (עוף חכם), היא ספרה בזהירות: 'אחת, שתיים, שלוש, ארבע, והערימה שעליה אנאנסי יושב!'"
          - "אנאנסי התעצבן וצעק: 'לא ככה סופרים! סופרים אחת, שתיים, שלוש, ארבע, חמש!' ומיד נרדם בעצמו."
      - title: "המסע אל הקריביים (דודה ננסי)"
        points:
          - "במהלך סחר העבדים הטרנס-אטלנטי, אנשי האשנטי המשועבדים נשאו את סיפורי אנאנסי בזיכרונם מעבר לאוקיינוס."
          - "בג'מייקה, באיים הקריביים ובדרום ארצות הברית, דמותו הפכה ל-'דודה ננסי' (Aunt Nancy) או 'ברר ראביט'."
          - "הסיפורים שימשו כסמל עמוק להתנגדות, ולימדו שאדם משועבד וחלש פיזית יכול להערים על אדונים חזקים."
          - "סיפורי אנאנסי נותרו אבן יסוד בפולקלור של ג'מייקה, סורינאם, טרינידד ותרבות הגולה בארצות הברית."
      - title: "מורשתו הנצחית של אנאנסי"
        points:
          - "אנאנסי מככב בספרות הפנטזיה הבינלאומית המודרנית, כגון ספריו של ניל גיימן ('בני אנאנסי' ו-'אלים אמריקאים')."
          - "במערב אפריקה, סיפורי עם מכונים עד היום בשם 'אנאנססם' (Anansesem - סיפורי עכביש) ללא קשר לגיבור הסיפור."
          - "סיפוריו ממשיכים ללמד שחשיבה מבריקה, גמישות והומור יכולים לגבור על כל מכשול, קטן ככל שתהיה."
          - "אנאנסי נותר שגריר תרבותי על-זמני של השנינות, ההישרדות ועוצמת הדמיון האפריקאי."
    trivia:
      - type: multiple_choice
        question: "בפולקלור המסורתי של איזה עם אפריקאי נולדה דמותו של אנאנסי העכביש?"
        options: ["בני האשנטי בגאנה", "בני הזולו בדרום אפריקה", "בני המסאי בקניה", "בני הברבר במרוקו"]
        correct: 0
      - type: single_qa
        question: "מה שמו של אל השמיים המערב-אפריקאי שהחזיק את כל סיפורי העולם בתיבת זהב?"
        answer: "ניאמה (Nyame)"
      - type: multiple_choice
        question: "כיצד הערים אנאנסי על פיתון הענק אוניני כדי ללכוד אותו עבור אל השמיים?"
        options: ["אתגר אותו למדוד את אורכו מול מקל חזרן", "הציע לו קערת מרק מורעל", "לכד אותו בכלוב מתכת", "התחפש לנשר"]
        correct: 0
      - type: single_qa
        question: "מה העניק אל השמיים לאנאנסי לאחר שהשלים את משימת לכידת ארבעת היצורים?"
        answer: "את תיבת הזהב של סיפורי העולם"
      - type: multiple_choice
        question: "מדוע יש לעכבישים מותניים צרות ודקיקות לפי המעשייה המשעשעת על אנאנסי?"
        options: ["שני כפרים משכו בבת אחת קורים שנקשרו למותניו במהלך חג", "הוא נתקע בכוורת דבורים", "הוא נולד תחת עלה צר", "אל השמיים דרך עליו"]
        correct: 0
      - type: single_qa
        question: "מה אסף אנאנסי בתוך כד חרס לפני שבנו לימד אותו שהדבר שייך לכולם?"
        answer: "את כל החוכמה שבעולם"
      - type: multiple_choice
        question: "באיזה שם מותאם כונתה דמותו של אנאנסי בחלק מסיפורי הפולקלור הקריביים והאמריקאיים?"
        options: ["דודה ננסי (Aunt Nancy)", "המלך ארתור", "קפטן הוק", "ברון סמדי"]
        correct: 0
      - type: single_qa
        question: "איזה מונח בגאנה משמש כשם כללי לכל סיפורי העם ופירושו 'סיפורי עכביש'?"
        answer: "אנאנססם (Anansesem)"
      - type: multiple_choice
        question: "כיצד לכד אנאנסי את צרעות המובורו העוקצות עבור אל השמיים?"
        options: ["פיתה אותן להיכנס לדלעת יבשה בטענה שיורד גשם", "הקפיא אותן בשלג", "הכה בהן בענף דקל", "פיתה אותן לכוורת"]
        correct: 0
      - type: single_qa
        question: "איזו ציפור חכמה הערימה על אנאנסי כשסירבה לבטא את המספר המקולל 'חמש'?"
        answer: "הפנינית (Mrs. Guinea Fowl)"
      - type: multiple_choice
        question: "כיצד מתואר מראהו הייחודי של אנאנסי כמשנה צורה בפולקלור?"
        options: ["עכביש בעל פני אדם או אדם בעל שמונה גפיים", "דרקון מעופף ענק", "נחש זהב", "אריה בעל שני ראשים"]
        correct: 0
      - type: single_qa
        question: "מי היה בנו החכם של אנאנסי שיעץ לו לקשור את כד החוכמה לגבו במקום לחזהו?"
        answer: "נטיקומה (Ntikuma)"
      - type: multiple_choice
        question: "איזו דמות פולקלור אמריקאית התפתחה ישירות מתוך מסורת אנאנסי האפריקאית?"
        options: ["ברר ראביט (הארנב)", "פול באניין", "פקוס ביל", "דייווי קרוקט"]
        correct: 0
      - type: single_qa
        question: "מה חפר אנאנסי כדי ללכוד את אוסבו הנמר בעל שיני החנית?"
        answer: "בור עמוק (מלכודת בור)"
      - type: multiple_choice
        question: "מדוע שימרו העבדים האפריקאים את סיפורי אנאנסי בהערצה במהלך סחר העבדים?"
        options: ["כסמל לעוצמת השכל והיכולת להערים על אדונים חזקים", "כדי ללמוד חקלאות", "כי זה נדרש בספינות", "כדי לחזות את מזג האוויר"]
        correct: 0
      - type: single_qa
        question: "איזה סופר פנטזיה מודרני שילב את אנאנסי כדמות מרכזית בספריו 'בני אנאנסי' ו-'אלים אמריקאים'?"
        answer: "ניל גיימן"

  - id: arabian_nights_monkey_king
    title: "סיפורי אלף לילה ולילה וקוף המלך"
    description: >
      צאו להרפתקאות קסומות ברחבי ערב העתיקה וסין הקיסרית! 
      משדים קסומים ושטיחים מעופפים ועד 72 שינויי הצורה והסלטות על עננים של סון ווקונג.
    cards:
      - title: "שחרזאדה וסיפורי אלף לילה ולילה"
        points:
          - "אלף לילה ולילה (לילות ערב) הוא אוסף אגדות מזרח-תיכוני אגדי מתור הזהב של האסלאם."
          - "המלכה החכמה שחרזאדה נישאה למלך שאהריאר, שנהג להוציא להורג כל אישה חדשה לאחר יום אחד בלבד."
          - "כדי לשרוד, סיפרה שחרזאדה סיפור מרתק בכל לילה ועצרה בכוונה ברגע של מתח שיא לפני עלות השחר."
          - "המלך המוקסם חס על חייה לילה אחר לילה במשך 1,001 לילות, ולבסוף התאהב בחוכמתה וביטל את הגזרה."
      - title: "אלאדין ומנורת הקסמים"
        points:
          - "אלאדין הוא נער עני שגויס על ידי מכשף ערמומי כדי להוציא מנורת שמן קסומה מתוך מערה מכושפת."
          - "כשהוא נלכד במערה, אלאדין משפשף את המנורה ומשחרר ג'יני (שד) רב-עוצמה המחויב למלא את משאלותיו."
          - "בעזרת הג'יני זוכה אלאדין בלבה של הנסיכה בדרו אל-בדור (יסמין) ומביס את המכשף הרשע."
          - "מעניין לציין שבכתבי היד המוקדמים נקבע מקום התרחשות סיפורו של אלאדין בעיר בסין."
      - title: "עלי באבא וארבעים השודדים"
        points:
          - "עלי באבא הוא חוטב עצים עני הצופה בסתר בחבורת ארבעים שודדים הפותחת מערת אוצר במילות הקסם: 'סומסום, היפתח!'."
          - "לאחר שהשודדים עוזבים, נכנס עלי באבא למערה ולוקח שקי מטבעות זהב כדי לכלכל את משפחתו הענייה."
          - "השודדים מאתרים את עלי באבא ומתחבאים בתוך כדי שמן ענקיים כדי לבצע מתקפת פתע לילית בביתו."
          - "מורג'יאנה, שפחתו החכמה והערמומית של עלי באבא, חושפת את המזימה ומנטרלת את השודדים באומץ."
      - title: "סינבד המלח"
        points:
          - "סינבד מבגדאד הוא יורד ים אגדי היוצא לשבעה מסעות ימיים מסוכנים ומופלאים בימי אפריקה ואסיה."
          - "במהלך מסעותיו הוא נתקל בעוף הרוק המיתולוגי הענק, בענקים קיקלופיים, באיים מגנטיים ובמפלצות ים."
          - "בזכות תושייה, כושר הישרדות ומזל בלתי רגיל, סינבד שורד כל טביעת ספינה וחוזר לביתו עשיר מופלג."
      - title: "סון ווקונג: מלך הקופים"
        points:
          - "סון ווקונג (קוף המלך) נולד מתוך אבן קסומה בצמרת הר הפרחים והפירות."
          - "הוא למד אמנויות לחימה דאואיסטיות, שלט ב-72 שינויי צורה ארציים והשיג צורות מרובות של חיי נצח."
          - "הוא פרץ אל ממלכת השמיים והביס את צבאות גן העדן במרדנות שובבה וחסרת פחד."
          - "הוא הגיבור המרכזי באפוס הסיני הקלאסי של וו צ'נג-אן מהמאה ה-16, 'המסע למערב'."
      - title: "מוט הברזל הקסום והסלטה על הענן"
        points:
          - "נשקו העיקרי של סון ווקונג הוא מוט הברזל הקסום (ז'ו-יי ג'ינגו בנג) שלקח ממלך הדרקון של הים המזרחי."
          - "המוט שוקל כ-8 טונות, אך יכול להתכווץ לגודל של מחט תפירה כדי להיכנס בנוחות מאחורי אוזנו!"
          - "הוא שלט גם ב-'סלטה על ענן', שאפשרה לו לזנק מרחק מדהים של 108,000 לי (כ-54,000 ק״מ) בזינוק אחד."
          - "הוא יכול היה לתלוש משערות גופו ולנשוף עליהן כדי להפוך אותן לאלפי קופים כפילים או לכלי נשק בקרב."
      - title: "המסע למערב"
        points:
          - "לאחר שזרע הרס בשמיים, כלא הבודהה את סון ווקונג תחת הר חמשת היסודות למשך 500 שנה."
          - "הוא שוחרר על ידי הנזיר הבודהיסטי טאנג סאנדזאנג בתנאי שיגן עליו במסע עלייה לרגל להודו להבאת כתבי קודש."
          - "אל סון ווקונג הצטרפו החברים ג'ו באג'יה (איש החזיר) וסא וו-ג'ינג, שנלחמו במאות שדים לאורך דרך המשי."
          - "כדי לרסן את קוף המלך השובב, השתמש הנזיר בחישוק זהב מכושף שהתהדק על ראשו של ווקונג בעת דקלום מנטרה."
      - title: "השפעה עולמית ותרבות פופ"
        points:
          - "סון ווקונג היווה השראה לדמויות אנימה ומשחקים מפורסמות, ובראשן סון גוקו בסדרה דרגון בול של אקירה טוריאמה."
          - "סיפורי אלף לילה ולילה הנחילו מושגים איקוניים בתרבות העולמית כמו שטיחים מעופפים, מנורות קסמים, שדים והביטוי 'סומסום היפתח'."
          - "שתי המסורות חוגגות את העובדה ששכל חריף, רוח חופשית ונאמנות יכולים לגבור על כוחות על-טבעיים ועריצות."
          - "הן נמנות עם עולמות הסיפור המעובדים ביותר בקולנוע, בתיאטרון ובמשחקי וידאו ברחבי העולם."
