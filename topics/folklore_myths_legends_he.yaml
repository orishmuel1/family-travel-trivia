id: folklore_myths_legends_he
title: "פולקלור, מיתוסים ואגדות"
description: >
  היכנסו לממלכה קסומה של אבירים אצילי לב, תכסיסנים מבריקים, גיבורי ענק
  ולוחמים אגדיים! גלו סיפורים על-זמניים מכל רחבי הגלובוס שעיצבו תרבויות,
  הציתו את הדמיון וחיברו דורות שלמים.
lang: he
audience: family
categories:
  - id: important_facts
    title: "עובדות חשובות"
    description: >
      מסורות מספרי הסיפורים העשירות שמחברות את התרבות האנושית לאורך הדורות.
      למדו על שורשי הפולקלור, יצורים מיתיים ומבני עלילה עולמיים לפני שתתחילו בטריוויה.
    cards:
      - title: "מסורת הסיפור שבעל פה"
        points:
          - "לפני שספרים וכתיבה הפכו לנפוצים, היסטוריה וערכי מוסר הועברו בעל פה מדור לדור מתוך הזיכרון."
          - "טרובדורים, פייטנים וזקני השבט שיננו אלפי שורות שיר כדי לדקלם עלילות גבורה סביב מדורת הערב."
          - "סיפורים שבעל פה עברו התאמות קלות לאורך הזמן, מה שהוביל לעשרות גרסאות מקומיות שונות של אותה אגדה."
          - "מעשיות עם שימשו כלי חיוני לחינוך ילדים לערכי מוסר, אומץ לב וכבוד לכוחות הטבע."
      - title: "מסע הגיבור"
        points:
          - "חוקר המיתולוגיה ג'וזף קמפבל זיהה את 'מסע הגיבור' (מונומיתוס), דפוס עלילתי משותף במיתוסים בכל העולם."
          - "במבנה זה, הגיבור עוזב את עולמו המוכר, מתגבר על מבחנים קשים בעזרת מורים ומדריכים, וחוזר כשהוא מותמר ומחוזק."
          - "מבנה סיפורי על-זמני זה מופיע בעלילות עתיקות כמו עלילות גילגמש ועד יצירות מודרניות כמו מלחמת הכוכבים."
          - "הוא משקף חוויות אנושיות אוניברסליות של התבגרות, התמודדות עם אתגרים וגילוי אומץ פנימי."
      - title: "דרקונים ברחבי היבשות"
        points:
          - "דרקונים אירופיים מתוארים לרוב כמפלצות זוחלות בעלות כנפיים, יורקות אש ואוגרות אוצרות זהב במערות."
          - "בפולקלור של מזרח אסיה, דרקונים הם יצורי מים מיטיבים ומקודשים המביאים גשמי ברכה ומזל טוב."
          - "תרבויות מרכז אמריקה סגדו לנחש בעל הנוצות (קצלקואטל) כאל הרוח, החוכמה והלמידה."
          - "הדרקון הוא מהיצורים המיתיים הבודדים שהומצאו באופן עצמאי כמעט בכל תרבות גדולה בעולם."
      - title: "עוף החול (פניקס)"
        points:
          - "הפניקס הוא ציפור אגדית המתחדשת ונולדת מחדש באופן מחזורי מתוך האפר של עצמה."
          - "במיתולוגיה המצרית העתיקה הופיעה ציפור הבנו, אנפת שמש המזוהה עם בריאה ותחייה מחדש."
          - "בפולקלור היווני, הפניקס חי במשך 500 שנה לפני שבנה קן מענפי בושם ועלה בלהבות כדי להיוולד מחדש."
          - "הוא הפך לסמל העולמי האולטימטיבי לחוסן, התחדשות ויכולת לקום מחדש מתוך משבר ואסון."
      - title: "דמויות תכסיסנים (טריקסטרים)"
        points:
          - "תכסיסנים הם דמויות שובבות בפולקלור המשתמשות בערמומיות ובשכל חריף במקום בכוח פיזי גס."
          - "בין התכסיסנים המפורסמים בעולם נמנים אנאנסי העכביש, האל הנורדי לוקי, הקויוטי במיתולוגיה האינדיאנית והארנב ברר."
          - "למרות שהתכסיסנים גורמים לעיתים לכאוס משעשע, סיפוריהם מלמדים לקח חשוב על גאוותנות, חמדנות וגמישות מחשבתית."
          - "הם מרבים לאתגר שליטים חזקים ובריונים, ופועלים כנציגיו המתוחכמים של החלש."
      - title: "יערות מכושפים ומסתוריים"
        points:
          - "פולקלור אירופי קדום תיאר יערות עמוקים כמרחבים קסומים שבהם חוקי המציאות הרגילים מושהים."
          - "יער שרווד, יער ברוסליאנד באגדות המלך ארתור והיער השחור בגרמניה הפכו לזירות של הרפתקאות אגדיות."
          - "מעשיות עם הזהירו עוברי אורח לבל יסטו מהשביל המסומן כדי לא להיתקל ברוחות יער, פיות ותרמיות."
          - "היערות ייצגו את העוצמה המסתורית והפראית של הטבע לפני עלייתה של הציוויליזציה המודרנית."
      - title: "אגדת אטלנטיס"
        points:
          - "הפילוסוף אפלטון כתב לראשונה על אטלנטיס בסביבות שנת 360 לפני הספירה כאלגוריה על גאווה ועושר מופרז."
          - "לפי הסיפור, אטלנטיס הייתה אי-אימפריה מתקדמת ששקעה למצולות האוקיינוס האטלנטי בתוך יום ולילה אחד."
          - "למרות שאפלטון התכוון למשל מוסרי, הסיפור הצית מאות שנות מסעות חיפוש ומחקרים בעולם האמיתי."
          - "היא נותרה אחת מאגדות התרבות האבודה המפורסמות והאהובות ביותר בספרות, בקולנוע ובדמיון האנושי."
      - title: "פיות ויצורי פלא קטנים"
        points:
          - "במיתולוגיה האירית והקלטית מופיעים בני האוס שי (Aos Sí), גזע על-טבעי של פיות החיות בתלי קבורה עתיקים."
          - "לפרקונים תוארו במקור כסנדלרים מתבודדים שהחביאו כדי זהב בקצה הקשת בענן."
          - "בפולקלור הסקנדינבי מופיעים הטומטה (Nisse), שומרי בית וחווה המגינים על המשק אם מתייחסים אליהם בכבוד."
          - "סיפורים על אנשי הפלא לימדו קהילות כפריות לכבד את כוחות הטבע ולשמור על הרמוניה ביתית."
    trivia:
      - type: multiple_choice
        question: "איזו ציפור מיתית מפורסמת בפולקלור העולמי בכך שהיא נולדת מחדש מתוך האפר של עצמה?"
        options: ["הגריפון", "עוף החול (פניקס)", "ציפור הרעם", "הפגסוס"]
        correct: 1
      - type: single_qa
        question: "איזה פילוסוף יווני כתב לראשונה על האי האגדי השוקע אטלנטיס סביב 360 לפני הספירה?"
        answer: "אפלטון"
      - type: multiple_choice
        question: "בפולקלור של מזרח אסיה, עם איזה יסוד טבעי מזוהים הדרקונים באופן מסורתי?"
        options: ["אש והרי געש", "מים, גשם ונהרות", "חול ומדבריות", "קרח וסופות שלגים"]
        correct: 1
      - type: single_qa
        question: "איזה חוקר מיתולוגיה טבע את המושג 'מסע הגיבור' (מונומיתוס) לתיאור מבנה עלילה אוניברסלי?"
        answer: "ג'וזף קמפבל"
      - type: multiple_choice
        question: "מי מהבאים הוא דמות תכסיסן (טריקסטר) קלאסית בפולקלור האינדיאני בצפון אמריקה?"
        options: ["הזאב הערבתי (קויוטי)", "פגסוס", "תור", "המלך ארתור"]
        correct: 0
      - type: single_qa
        question: "איזה גזע פיות מיתולוגי אירי מסורתי האמינו שחי בתוך תלי עשב עתיקים?"
        answer: "אוס שי (Aos Sí)"
      - type: multiple_choice
        question: "באירופה של ימי הביניים, מה היה תפקידם המרכזי של מספרי הסיפורים והטרובדורים הנודדים?"
        options: ["העברת היסטוריה, חוקים וערכי מוסר בעל פה", "כתיבת קודי צבא סודיים", "תכנון טירות אבן", "מסחר במשי"]
        correct: 0
      - type: single_qa
        question: "איזה אל מפורסם בתרבויות מרכז אמריקה נערץ כ-'נחש בעל הנוצות'?"
        answer: "קצלקואטל"
      - type: multiple_choice
        question: "בפולקלור הסקנדינבי, איזה יצור פלא ביתי שומר על החווה אם מתייחסים אליו בכבוד?"
        options: ["טומטה (Nisse)", "באנשי", "כימרה", "מינוטאור"]
        correct: 0
      - type: single_qa
        question: "באיזה מקצוע עסק באופן מסורתי הלפרקון המתבודד בפולקלור האירי?"
        answer: "סנדלר (מתקן נעליים)"
      - type: multiple_choice
        question: "כמה שנים נהג לחיות עוף החול (הפניקס) היווני לפני שנשרף ונולד מחדש?"
        options: ["50 שנה", "100 שנה", "500 שנה", "1,000 שנה"]
        correct: 2
      - type: single_qa
        question: "מה מסמל עוף החול (פניקס) באופן אוניברסלי בתרבות ובספרות המודרנית?"
        answer: "התחדשות ותקומה מחדש"
      - type: multiple_choice
        question: "איזה יער אגדי בברטאן שבצרפת קשור קשר הדוק לקוסם מרלין ולאגדות המלך ארתור?"
        options: ["יער שרווד", "יער ברוסליאנד", "היער השחור", "יער פנגורן"]
        correct: 1
      - type: single_qa
        question: "איזה סוג של דמות פולקלור מסתמכת על שכל חריף ותרמיות במקום על כוח פיזי?"
        answer: "תכסיסן (טריקסטר)"
      - type: multiple_choice
        question: "לפי המיתולוגיה המצרית העתיקה, איזו ציפור קדושה ייצגה בריאה שמשית ותחייה מחדש?"
        options: ["בנו (Bennu)", "מגלן (איביס)", "בז", "נשר"]
        correct: 0
      - type: single_qa
        question: "בתוך כמה זמן שקע האי אטלנטיס אל מצולות הים לפי משל אפלטון?"
        answer: "ביום ולילה אחד"

  - id: king_arthur
    title: "אגדת המלך ארתור"
    description: >
      צאו למסע אל ממלכת קמלוט הקסומה! גלו את סיפורי האבירות המופלאים, 
      החרבות המכושפות, אבירי השולחן העגול והחיפוש אחר הגביע הקדוש.
    cards:
      - title: "המלך ארתור"
        points:
          - "ארתור היה מלך בריטי אגדי שהגן על בריטניה מפני פולשים סקסונים בסוף המאה ה-5 ובתחילת המאה ה-6."
          - "הוא הוכיח את זכותו המלכותית כנער צעיר כששלף בדרך נס את החרב המכושפת מתוך הסדן והאבן."
          - "ארתור כונן תור זהב של שלום, צדק ואבירות ברחבי בריטניה מתוך טירתו המלכותית בקמלוט."
          - "לפי האגדה, הוא לא מת אלא נלקח לנוח באי המסתורי אבלון, וממתין לשעת המבחן של בריטניה."
      - title: "אקסקליבר והחרב באבן"
        points:
          - "באגדות מוקדמות, ארתור שלף חרב מתוך סדן ואבן שעליה נחרת: 'כל השולף חרב זו הוא המלך החוקי'."
          - "בסיפורים מאוחרים יותר, קיבל ארתור את חרב הפלא 'אקסקליבר' מידיה של גבירת האגם המסתורית."
          - "לאקסקליבר נלווה נדן מכושף שהגן על הנושא אותו מפני איבוד דם ופציעה בקרב."
          - "כאשר שכב ארתור פצוע אנושות לאחר קרב קמלן, הוא ציווה על סר בדוויר להחזיר את אקסקליבר לאגם."
      - title: "הקוסם מרלין"
        points:
          - "מרלין היה מכשף, נביא ויועצו הראשי של ארתור, אשר תכנן את לידתו ועלייתו לשלטון."
          - "האגדה ייחסה למרלין את בניית אתר סטונהנג', כשהשתמש בקסמיו כדי לשנע אבני ענק מאירלנד."
          - "מרלין החזיק ביכולות שינוי צורה, ראיית העתיד ושליטה עמוקה בכוחות הטבע."
          - "בסופו של דבר נלכד במגדל זכוכית מכושף או בתוך עץ עוזרר עתיק על ידי גבירת האגם (נימווה)."
      - title: "טירת קמלוט"
        points:
          - "קמלוט הייתה הטירה המלכותית ועיר הבירה שבה ריכז המלך ארתור את טובי האבירים בממלכה."
          - "היא סימלה את שיא תור הזהב של אהבת חצר, צדק, כבוד הדדי והרמוניה אזרחית."
          - "בין המועמדות ההיסטוריות לקמלוט האמיתית נמנות טירת קדבורי בסומרסט וטירת טינטאג'ל בקורנוול."
          - "השם 'קמלוט' הפך מאז למטפורה עולמית לתקופת זוהר מעוררת השראה, אידיאליסטית ומלאת תקווה."
      - title: "אבירי השולחן העגול"
        points:
          - "המלך ארתור קיבץ את טובי לוחמיו סביב שולחן עגול ענק שהוענק לו במתנה על ידי המלך לאודגראנס."
          - "המבנה העגול היה מהפכני מכיוון שלא היה בו ראש או תחתית שולחן, מה שהדגיש שכל האבירים שווים."
          - "סביב השולחן ישבו אבירים אגדיים כולל סר לנסלוט, סר גאווין, סר גאלאהד, סר פרסיבל וסר טריסטן."
          - "המושב המסוכן (Siege Perilous) היה כיסא ריק ומכושף שרק האביר הטהור ביותר יכול היה לשבת בו מבלי להיפגע."
      - title: "סר לנסלוט וסר גאלאהד"
        points:
          - "סר לנסלוט איש האגם היה גדול לוחמיו וחברו הקרוב ביותר של ארתור, שנודע בלחימת חרב שאין לה מתחרים."
          - "לנסלוט גדל במצולות קסומות אצל גבירת האגם והפך לאביר המצטיין ביותר בטורנירים של קמלוט."
          - "בנו, סר גאלאהד, התפרסם בטוהר לב שאין שני לו והיה האביר היחיד שהורשה לשבת במושב המסוכן."
          - "גאלאהד השלים בהצלחה את החיפוש אחר הגביע הקדוש וזכה לחיזיון של הארה רוחנית עליונה."
      - title: "החיפוש אחר הגביע הקדוש"
        points:
          - "הגביע הקדוש תואר כגביע ששימש את ישו בסעודה האחרונה, והחזיק בכוחות ריפוי וברכה מופלאים."
          - "חיזיון קסום של הגביע הופיע מעל השולחן העגול, והניע את אבירי ארתור לצאת למסע חיפוש רוחני."
          - "רק האבירים בעלי המידות הטובות ביותר—סר גאלאהד, סר פרסיבל וסר בורס—נמצאו ראויים למצוא אותו."
          - "מסע הגביע סימן בספרות ימי הביניים את המעבר מתהילת קרבות חומרית להארה ורוחניות."
      - title: "מורגן לה פיי ומורדרד"
        points:
          - "מורגן לה פיי הייתה אחותו למחצה של ארתור, מכשפת רבת-עוצמה שלמדה את תורת הקסם באי אבלון."
          - "בעוד שאגדות מוקדמות תיארו אותה כמרפאת מיטיבה, רומנסות מאוחרות הפכו אותה ליריבתו הערמומית של ארתור."
          - "מורדרד, אחיינו של ארתור (או בנו בגרסאות מאוחרות), מרד ותבע את כתר המלוכה בזמן שארתור שהה בקרב."
          - "ארתור ומורדרד התנגשו בקרב קמלן הגורלי, שבו מורדרד חוסל וארתור נפצע פצעי מוות."
    trivia:
      - type: multiple_choice
        question: "מדוע היה שולחנו של המלך ארתור עגול ולא מלבני?"
        options: ["כדי להתאים למגדל עגול", "כדי להראות שכל האבירים יושבים כשווים ללא מעמדות", "כי שולחנות עגולים היו זולים יותר", "כדי להסתובב במהלך סעודות"]
        correct: 1
      - type: single_qa
        question: "מה שמה של חרב הפלא המכושפת של המלך ארתור?"
        answer: "אקסקליבר"
      - type: multiple_choice
        question: "מי העניקה לארתור את החרב המכושפת אקסקליבר באגדות המאוחרות?"
        options: ["מורגן לה פיי", "המלכה גווינביר", "גבירת האגם", "מרלין"]
        correct: 2
      - type: single_qa
        question: "מה שמו של האי המסתורי שאליו נלקח המלך ארתור לאחר שנפצע בקרב קמלן?"
        answer: "אבלון"
      - type: multiple_choice
        question: "איך נקרא המושב הריק בשולחן העגול שרק האביר הטהור ביותר יכול היה לשבת בו בבטחה?"
        options: ["כס הזהב", "המושב המסוכן (Siege Perilous)", "ספסל המלך", "שולחן הכבוד"]
        correct: 1
      - type: single_qa
        question: "איזה אביר, בנו של סר לנסלוט, הצליח להשלים את מסע החיפוש אחר הגביע הקדוש?"
        answer: "סר גאלאהד"
      - type: multiple_choice
        question: "איזה אתר פרהיסטורי אמיתי בבריטניה יוחס באגדות ימי הביניים לקסמיו של מרלין?"
        options: ["סטונהנג'", "חומת אדריאנוס", "מצודת לונדון", "הקולוסיאום"]
        correct: 0
      - type: single_qa
        question: "מה שמה של עיר הבירה והטירה האגדית של המלך ארתור?"
        answer: "קמלוט"
      - type: multiple_choice
        question: "איזה אביר נדרש להשליך את אקסקליבר בחזרה לאגם בעוד ארתור שוכב פצוע?"
        options: ["סר גאווין", "סר בדוויר", "סר קיי", "סר פרסיבל"]
        correct: 1
      - type: single_qa
        question: "מי הייתה אחותו למחצה של ארתור שהפכה למכשפת ויריבה מפורסמת?"
        answer: "מורגן לה פיי"
      - type: multiple_choice
        question: "אחרי איזה חפץ קדוש בעל סגולות ריפוי חיפשו אבירי השולחן העגול במסעם הגדול?"
        options: ["הגביע הקדוש", "גיזת הזהב", "אבן החכמים", "ארון הברית"]
        correct: 0
      - type: single_qa
        question: "מה הייתה הסגולה המיוחדת של הנדן של החרב אקסקליבר?"
        answer: "מנע איבוד דם ופציעות קשות"
      - type: multiple_choice
        question: "איזה אביר בוגדני מרד במלך ארתור והוביל לקרב קמלן הגורלי?"
        options: ["סר בורס", "מורדרד", "סר טריסטן", "סר גארת'"]
        correct: 1
      - type: single_qa
        question: "מה נכתב בכתובת שמתחת לחרב התקועה באבן לגבי מי שישלוף אותה?"
        answer: "הוא המלך החוקי של בריטניה"
      - type: multiple_choice
        question: "מי גידלה את סר לנסלוט במים מכושפים בטרם הפך לאביר הבכיר של ארתור?"
        options: ["גבירת האגם", "המלכה גווינביר", "מורגן לה פיי", "מרלין"]
        correct: 0
      - type: single_qa
        question: "מפני אילו פולשים הגן ארתור על בריטניה לפי המסורת במאות ה-5 וה-6?"
        answer: "פולשים סקסונים"

  - id: robin_hood
    title: "הרפתקאות רובין הוד"
    description: >
      היכנסו למעמקי יער שרווד עם נסיך הגנבים! גלו את מעללי הגבורה, 
      קליעת הקשת המופלאה והקרבות הצודקים של רובין הוד וחבורת היער העליזה שלו.
    cards:
      - title: "רובין מלוקסלי"
        points:
          - "רובין הוד הוא פורע החוק האגדי המפורסם ביותר של אנגליה, שנודע בכך שגזל מעשירים כדי לתת לעניים."
          - "הוא מתואר כקַשָּׁת אומן לבוש בגדי ירוק לינקולן, החי מציד צבאים ביער המלכותי שרווד."
          - "הבלדות הכתובות המוקדמות ביותר מהמאה ה-14 חגגו את התנגדות פשוטי העם לשלטון המושחת."
          - "בסיפורים מאוחרים יותר הוא תואר כאציל שנושל מנכסיו, הרוזן מהנטינגדון או רובין מלוקסלי."
      - title: "יער שרווד ועץ האלון הענק"
        points:
          - "יער שרווד בנוטינגהאמשייר היה יער ציד מלכותי ששימש כמחבוא המושלם עבור רובין ואנשיו."
          - "מוקד האגדה הוא 'עץ האלון הענק' (Major Oak), עץ אלון עתיק שגילו מוערך ביותר מ-800 עד 1,000 שנה."
          - "לפי המסורת המקומית, חלל הגזע הענק של האלון שימש כמפקדת הסתרים ומקום המפגש של אנשי היער."
          - "היער העבות סיפק מזון, מחסה ותנאי שטח מושלמים להצבת מארבים לעוברי אורח עשירים."
      - title: "החבורה העליזה (Merry Men)"
        points:
          - "החבורה העליזה הייתה קבוצת פורעי חוק, איכרים ונמלטים נאמנים שחיו יחד במסתור ביער שרווד."
          - "הם נשבעו להגן על עניים, נשים ומדוכאים, ולעולם לא לפגוע באנשים עובדים וישרי דרך."
          - "כל חברי החבורה לבשו בגדים תואמים בירוק לינקולן כדי להיטמע לחלוטין בצמחיית היער."
          - "הם השתמשו בקריאות שופר מיוחדות כדי לאותת זה לזה ולהזעיק תגבורת בין עצי היער."
      - title: "ג'ון הקטן (Little John)"
        points:
          - "ג'ון הקטן היה סגנו הראשי וחברו הנאמן ביותר של רובין הוד, שהתנשא לגובה של מעל שני מטרים."
          - "שמו ניתן לו בהומור אירוני מכיוון שהיה בפועל האיש הגדול והחזק ביותר בכל היער."
          - "הוא פגש את רובין לראשונה על גשר צר מעל נחל, שם נלחמו השניים בדו-קרב מקלות עץ ארוכים."
          - "לאחר שהפיל את רובין למים, זכה ג'ון להערכתו של רובין והצטרף מיד לחבורת היער."
      - title: "העלמה מריאן"
        points:
          - "העלמה מריאן היא בת אצולה, שותפה אמיצה ואהבת חייו של רובין הוד."
          - "בניגוד לעלמות חסרות אונים, בבלדות ובמחזות עממיים היא תוארה כקשתית מיומנת וסייפת נועזת."
          - "היא שימשה לעיתים קרובות כמרגלת סודית בתוך טירת נוטינגהאם, והזהירה את אנשי היער מפשיטות."
          - "דמותה הדגישה ערכים של נאמנות, רומנטיקה ומאבק בלתי מתפשר לצדק חברתי."
      - title: "הנזיר טאק וויל סקרלט"
        points:
          - "הנזיר טאק היה נזיר חביב, עגלגל ושמח שסיפק הדרכה רוחנית, הומור ומיומנות מפתיעה בחרב."
          - "רובין פגש את טאק כשחייב אותו לשאת אותו על גבו מעבר לנהר, אך טאק דרש שרובין יישא אותו בחזרה!"
          - "ויל סקרלט היה סייף נועז וקרוב משפחתו של רובין, שנודע בלבישת בגדי משי בצבע שני (סקרלט)."
          - "יחד עם אלן-א-דייל הפייטן הנודד, הם הוסיפו שירה, צחוק ונשמה לחבורת פורעי החוק."
      - title: "השריף מנוטינגהאם והנסיך ג'ון"
        points:
          - "השריף מנוטינגהאם היה יריבו המושבע של רובין הוד, וייצג עריצות, חמדנות וגביית מיסים אכזרית."
          - "הסיפורים מתרחשים לרוב בתקופת מסעי הצלב של המלך ריצ'רד לב הארי, כשאחיו הנסיך ג'ון שלט בהיעדרו."
          - "השריף רקם ללא הרף מלכודות ללכידת רובין, אך אנשי היער הערמומיים תמיד הערימו עליו והשפילו אותו."
          - "כאשר שב לבסוף המלך ריצ'רד במחופש מארץ הקודש, הוא חנן את רובין והשיב לו את אדמותיו."
      - title: "תחרות חץ הזהב"
        points:
          - "השריף מנוטינגהאם ארגן תחרות קשתות מפוארת והציע חץ מזהב טהור כפיתיון ללכידת רובין הוד."
          - "למרות הסכנה הברורה, רובין הגיע לתחרות כשהוא מחופש לקבצן עיוור בעין אחת עם גלימה בלויה."
          - "ביריית הסיום הדרמטית, רובין ביקע לשניים את החץ של יריבו בדיוק במרכז המטרה וזכה בחץ הזהב."
          - "רובין נמלט בחזרה ליער שרווד ושלח חץ שנשא מכתב תודה היישר אל תוך אולם המשתה של השריף."
    trivia:
      - type: multiple_choice
        question: "באיזה צבע בגדים מפורסם לבשו רובין הוד ואנשיו כדי להיטמע ביער שרווד?"
        options: ["סגול מלכותי", "ירוק לינקולן", "כחול כהה", "אדום שני"]
        correct: 1
      - type: single_qa
        question: "מי היה יריבו המושבע של רובין הוד שגבה מיסים כבדים ועשק את העניים?"
        answer: "השריף מנוטינגהאם"
      - type: multiple_choice
        question: "מדוע כונה סגנו של רובין בשם 'ג'ון הקטן' (Little John)?"
        options: ["הוא היה ילד קטן", "בבדיחה אירונית כי היה ענק בגובה שני מטרים", "הוא היה צעיר מאחיו", "היו לו כפות רגליים קטנות"]
        correct: 1
      - type: single_qa
        question: "מה שמו של עץ האלון העתיק בן 800 השנים ביער שרווד ששימש כמפקדת החבורה?"
        answer: "עץ האלון הענק (Major Oak)"
      - type: multiple_choice
        question: "באיזה נשק השתמשו רובין וג'ון הקטן במהלך הדו-קרב המפורסם על הגשר הצר מעל הנחל?"
        options: ["חרבות רחבות", "מקלות עץ ארוכים (Quarterstaffs)", "קשתות ארוכות", "פגיונות"]
        correct: 1
      - type: single_qa
        question: "איזה פרס יקר הציע השריף בתחרות הקשתות כדי לפתות את רובין לצאת ממחבואו?"
        answer: "חץ מזהב (חץ הזהב)"
      - type: multiple_choice
        question: "איזה מלך אנגלי שהה במסע הצלב בתקופת עלילות רובין הוד המסורתיות?"
        options: ["המלך הנרי השמיני", "המלך ריצ'רד לב הארי", "המלך ג'ורג' השלישי", "ויליאם הכובש"]
        correct: 1
      - type: single_qa
        question: "מה עשה רובין הוד לחץ של יריבו ביריית הניצחון האחרונה בתחרות הקשתות?"
        answer: "ביקע אותו לשניים (פיצל אותו)"
      - type: multiple_choice
        question: "איזה נזיר עליז וחובב לחימה הצטרף לחבורת אנשי היער של רובין הוד?"
        options: ["הנזיר טאק", "הנזיר לורנס", "הנזיר פרנסיס", "הנזיר ג'ון"]
        correct: 0
      - type: single_qa
        question: "באיזה מחוז באנגליה שוכן יער שרווד ההיסטורי?"
        answer: "נוטינגהאמשייר"
      - type: multiple_choice
        question: "מה היה תפקידה החשאי של העלמה מריאן בחלק מאגדות רובין הוד המסורתיות?"
        options: ["מרגלת בתוך טירת נוטינגהאם", "בתו של השריף", "קפטנית שודדי ים", "ליצנית החצר"]
        correct: 0
      - type: single_qa
        question: "באיזה כלי נגינה ניגן הפייטן אלן-א-דייל עבור אנשי החבורה העליזה ביער?"
        answer: "לאוטה (עוד אירופי) או נבל"
      - type: multiple_choice
        question: "איזו סיסמה מפורסמת הגדירה את פעילותו של רובין הוד ביער שרווד?"
        options: ["הכוח שייך לחזקים", "לגנוב מעשירים ולתת לעניים", "זהב מעל הכל", "השתיקה יפה לחכמים"]
        correct: 1
      - type: single_qa
        question: "במה השתמשו אנשי היער כדי לאותת ולהזעיק תגבורת ממרחקים בין עצי היער?"
        answer: "קריאות שופר (קרן יער)"
      - type: multiple_choice
        question: "באיזה צבע בגדים התפרסם ויל סקרלט, קרוב משפחתו הנועז של רובין?"
        options: ["אדום שני (סקרלט)", "ירוק יער", "צהוב זהב", "שחור פחם"]
        correct: 0
      - type: single_qa
        question: "כיצד התחפש המלך ריצ'רד לב הארי כשחזר ופגש לראשונה את רובין ביער שרווד?"
        answer: "כנזיר (או עוברי אורח פשוט)"

  - id: story_of_mulan
    title: "סיפורה של מולאן"
    description: >
      גלו את אומץ הלב האגדי של חואה מולאן! הכירו את הבלדה הסינית העתיקה 
      על כיבוד הורים, תושייה, גבורה בשדה הקרב ושבירת מוסכמות חברתיות.
    cards:
      - title: "הבלדה על מולאן (שירת מולאן)"
        points:
          - "סיפורה של מולאן נולד כשיר עם עממי בסין בתקופת שושלת ווי הצפונית (386–534 לספירה)."
          - "השיר מתאר אישה צעירה הקונה סוס ויוצאת למלחמה כשהיא מחופשת לגבר כדי לחסוך מאביה הקשיש גיוס קטלני."
          - "הבלדה המקורית מכילה 392 סימניות סיניות בלבד, אך הפכה לאחת היצירות הספרותיות המפורסמות בסין."
          - "במשך יותר מאלף שנה היא מדוקלמת כמופת עליון של מסירות להורים ואומץ לב חסר פניות."
      - title: "כיבוד הורים (שְׂיָאו)"
        points:
          - "כיבוד הורים (שְׂיָאו) הוא ערך מרכזי בתפיסה הקונפוציאנית, המדגיש אהבה, כבוד ומחויבות עמוקה להורים."
          - "כאשר הקיסר מוציא צו גיוס המחייב גבר אחד מכל בית לצאת לחזית, אביה הזקן של מולאן נקרא לשירות."
          - "ביודעה שאביה חלש מכדי לשרוד ואחיה הצעיר עדיין ילד, מולאן מקריבה את עתידה ומקבלת החלטה גורלית."
          - "הבחירה לצאת למלחמה במקום אביה נחשבה לביטוי הנעלה ביותר של אהבה ומסירות משפחתית."
      - title: "ארבעת השווקים"
        points:
          - "בבית המפורסם הפותח את הבלדה, מולאן מתכוננת למלחמה ומבקרת בארבעה שווקים בעיר ביום אחד."
          - "בשוק המזרחי היא קונה סוס נאה; בשוק המערבי היא רוכשת אוכף ושטיח רכיבה."
          - "בשוק הדרומי היא קונה רתמה; ובשוק הצפוני היא מצטיידת בשוט ארוך."
          - "רצף פיוטי זה ממחיש את נחישותה העצמאית ואת המעבר החד שלה מחיי בית לחיי צבא."
      - title: "שתים עשרה שנים בשדה הקרב"
        points:
          - "מולאן לחמה בגבולות הצפוניים הקשים במשך 12 שנים תמימות, ועמדה בחורפים קפואים ובקרבות מדבר עזים."
          - "היא הוכיחה את עצמה כטקטיקנית מבריקה, קשתית אומנית ומפקדת פרשים נועזת שעלתה בדרגות הצבא."
          - "למרות שחיה לצד חיילים אחרים במשך יותר מעשור, איש מחבריה לא גילה מעולם את זהותה האמיתית."
          - "הבלדה מציינת בפיוט: 'לוחמים נספים במאה קרבות, הגיבור האמיץ שב לביתו לאחר עשר שנים'."
      - title: "הסירוב לגמול הקיסרי"
        points:
          - "עם שובה בניצחון אל עיר הבירה, הקיסר (בן השמיים) מציע למולאן משרה ממשלתית רמה ושפע של זהב."
          - "בניגוד למפקדים שאפתנים, מולאן מסרבת בנימוס לכל תואר פוליטי, מעמד או עושר כספי."
          - "היא מבקשת רק גמל מהיר (או סוס מובחר) כדי לרכוב מיד הביתה ולטפל בהוריה הקשישים."
          - "ענוותה הוכיחה שהיא יצאה לקרב מתוך אהבה טהורה למשפחתה ולא מתוך רדיפת כבוד ותהילה."
      - title: "המפגש המשפחתי וחשיפת הסוד"
        points:
          - "כשמולאן מגיעה לביתה, הוריה המאושרים תומכים זה בזה מחוץ לשער, ואחותה לובשת בגדי חג."
          - "אחיה הצעיר משחיז סכין כדי להכין סעודת חג של חזיר וכבש לכבוד שובה."
          - "מולאן נכנסת לחדרה, פושטת את השריון, לובשת את שמלותיה הישנות, מסרקת שערה ומתאפרת באבקה צהובה."
          - "כאשר היא יוצאת לברך את חבריה מהצבא שבאו לבקרה, הם נותרים המומים לגלות שמפקדם המהולל הייתה אישה!"
      - title: "משל שני הארנבים"
        points:
          - "הבלדה על מולאן מסתיימת באחד המשלים הפיוטיים המפורסמים ביותר בספרות על שוויון בין המינים."
          - "השיר מציין: 'הארנב הזכר מדלג בחוסר מנוחה, בעוד הארנבת הנקבה פוזלת בעיניה'."
          - "'אך כאשר שני ארנבים רצים זה לצד זה על פני השדה, מי יוכל להבדיל מי מהם זכר ומי נקבה?'"
          - "שורת סיום זו חוגגת את העובדה שאומץ לב, כישרון ויכולת אינם תלויים במגדר."
      - title: "מורשת תרבותית ועיבודים"
        points:
          - "בתקופת שושלות מינג וצ'ינג הוסיפו לה מחזאים את שם המשפחה 'חואה' (שפירושו פרח) והרחיבו את עלילותיה."
          - "מכתש אמיתי על כוכב הלכת נוגה (ונוס) נקרא בשם 'מולאן' על ידי איגוד האסטרונומיה הבינלאומי לכבודה."
          - "סרט האנימציה של דיסני משנת 1998 הביא את סיפורה לקהל בינלאומי מודרני והציג דמויות אהובות כמו מושו."
          - "פסלים ואנדרטאות לזכרה של חואה מולאן ניצבים ברחבי סין, ומנציחים אותה כגיבורה לאומית נצחית."
    trivia:
