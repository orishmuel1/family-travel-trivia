id: us_states_he
title: מדינות ארצות הברית
description: >
  עובדות וטריוויה על ארצות הברית, מסודרות מהמדינה הגדולה ביותר בשטח יבשתי ועד לקטנה ביותר.
lang: he
audience: family
categories:
  - id: important_facts
    title: עובדות חשובות
    description: >
      עובדות מעניינות על כל אחת ממדינות ארצות הברית, מסודרות לפי גודל השטח.
    cards:
      - title: אלסקה
        points:
          - "אלסקה היא המדינה הגדולה ביותר בארצות הברית, המשתרעת על יותר מ-663,000 מייל רבוע."
          - "היא נרכשה מרוסיה בשנת 1867 והפכה למדינה בשנת 1959."
          - "דנאלי, ההר הגבוה ביותר בצפון אמריקה, ממוקם באלסקה."
          - "לאלסקה קו חוף ארוך יותר מכל שאר מדינות ארצות הברית יחד."
          - "ג'ונו היא בירת המדינה היחידה בארה״ב שאי אפשר להגיע אליה בכביש."
      - title: טקסס
