        answer: "Ben-Hur, Titanic, and The Lord of the Rings: The Return of the King"
      - type: multiple_choice
        question: "Which iconic director is world-famous as the 'Master of Suspense'?"
        options: ["Alfred Hitchcock", "Stanley Kubrick", "Martin Scorsese", "Federico Fellini"]
        correct: 0
      - type: single_qa
        question: "What famous camera visual effect combining a zoom and a dolly track was pioneered in Hitchcock's 'Vertigo'?"
        answer: "The Dolly Zoom (or Vertigo effect / Zolly)"
      - type: multiple_choice
        question: "What is the highest prize awarded at the prestigious Cannes Film Festival in France?"
