id: us_presidents_he
icon: 🦅
title: נשיאי ארצות הברית
description: 'מסע היסטורי בעקבות מנהיגי ארצות הברית, מהקמת האומה ועד ימינו. גלו את
  חייהם הייחודיים, הרגעים המכריעים וההשפעה המתמשכת של האישים שהחזיקו בתפקיד הרם ביותר
  במדינה. פעילות מושלמת לכל המשפחה כדי ללמוד יחד על מנהיגות, היסטוריה והתפתחות הדמוקרטיה
  האמריקאית.

  '
lang: he
audience: family
categories:
- id: important_facts
  title: עובדות חשובות
  description: 'מבט כרונולוגי מלא על כל אדם שכיהן כנשיא ארצות הברית. קראו יחד את קטעי
    המידע האישיים וההיסטוריים המרתקים הללו כדי לגלות את הסיפורים שמאחורי כל אחד מהמנהיגים,
    לפני שתבחנו את הידע שלכם בסבב הטריוויה.

    '
  cards:
  - title: ג'ורג' וושינגטון
    points:
    - ג'ורג' וושינגטון היה הנשיא היחיד שנבחר פה אחד על ידי חבר האלקטורים.
    - הוא הנשיא היחיד שלא התגורר בוושינגטון הבירה, מכיוון שהעיר עדיין נבנתה בתקופת
      כהונתו.
    - בניגוד למיתוס הרווח, שיניו התותבות המפורסמות היו עשויות משנהב של היפופוטם ומעצם,
      ולא מעץ.
    - הוא ביסס את מסורת שתי הכהונות כאשר ויתר מרצונו על השלטון בשנת 1797.
  - title: ג'ון אדמס
    points:
    - ג'ון אדמס היה הנשיא הראשון שהתגורר ב'בית הנשיא', שלימים נודע כבית הלבן.
    - הוא היה המחבר הראשי של חוקת מסצ'וסטס, החוקה הכתובה הוותיקה בעולם שעדיין בתוקף.
    - הוא נפטר ב-4 ביולי 1826, בדיוק באותו יום שבו נפטר ידידו הקרוב ויריבו הפוליטי
      תומאס ג'פרסון.
    - אדמס הגן בבית המשפט על החיילים הבריטיים שהיו מעורבים ב'טבח בוסטון' כדי להבטיח
      משפט הוגן.
  - title: תומאס ג'פרסון
    points:
    - תומאס ג'פרסון היה איש אשכולות מחונן ששלט בשש שפות והמציא גלגל צופן לכתיבת מסרים
      סודיים.
    - הוא הכפיל את שטחה של ארצות הברית בשנת 1803 בעסקת רכישת לואיזיאנה מצרפת.
    - הוא החזיק שני גורי דוב גריזלי בכלוב על מדשאת הבית הלבן, מתנה שקיבל מחוקר ארצות.
    - ג'פרסון עיצב בעצמו את ביתו המפורסם מונטיצ'לו שבווירג'יניה, וייסד את אוניברסיטת
      ווירג'יניה.
  - title: ג'יימס מדיסון
    points:
    - ג'יימס מדיסון היה הנשיא הנמוך בהיסטוריה, בגובה 163 ס״מ ובמשקל של כ-45 ק״ג.
    - הוא מכונה 'אבי החוקה' בזכות תפקידו המכריע בניסוח המסמך ומגילת הזכויות.
    - הוא היה אחד משלושת המחברים המרכזיים של 'הניירות הפדרליסטיים', שקראו לאשרר את
      החוקה.
    - במלחמת 1812 הוא היה הנשיא המכהן היחיד שניצב תחת אש אויב פעילה בשדה קרב אמריקאי.
  - title: ג'יימס מונרו
    points:
    - כהונתו של ג'יימס מונרו כונתה 'עידן הרגשות הטובים' בזכות תחושת אחדות ומטרה לאומית
      חזקה.
    - הוא הציג את 'דוקטרינת מונרו', שהזהירה מדינות אירופה כי המשך קולוניזציה ביבשות
      אמריקה לא ייסבל.
    - הוא היה הנשיא האחרון מדור מלחמת העצמאות והאחרון מ'שושלת ווירג'יניה' המפורסמת.
    - בירת ליבריה, מונרוביה, נקראה על שמו בזכות תמיכתו באגודת ההתיישבות.
  - title: ג'ון קווינסי אדמס
    points:
    - ג'ון קווינסי אדמס היה בנו של הנשיא השני, ג'ון אדמס, וכך הפכו לצמד הנשיאים הראשון
      של אב ובנו.
    - הוא נהג להתעמל בשחייה בעירום בנהר הפוטומק בשעות הבוקר המוקדמות במהלך כהונתו.
    - לאחר נשיאותו כיהן 17 שנים בבית הנבחרים, שם נאבק בעוז נגד העבדות.
    - הוא הגן בהצלחה בבית המשפט העליון על השבויים האפריקאים שנתפסו בספינת האמיסטד.
  - title: אנדרו ג'קסון
    points:
    - אנדרו ג'קסון היה הנשיא הראשון שנולד בבקתת עץ והראשון ששרד ניסיון התנקשות.
    - הוא לימד את התוכי המחמד שלו לקלל, ולפי הדיווחים היה צורך להוציא את הציפור מהלווייתו
      בשל הגידופים.
    - הוא היה דו-קרבן ידוע לשמצה שהשתתף ביותר מ-100 דו-קרבות במהלך חייו כדי להגן על
      כבודו.
    - הוא סילק כליל את החוב הלאומי בשנת 1835, הפעם היחידה בהיסטוריה של ארה״ב שבה קרה
      הדבר.
  - title: מרטין ואן ביורן
    points:
    - מרטין ואן ביורן היה הנשיא הראשון שנולד כאזרח אמריקאי, שכן כל קודמיו היו במקור
      נתינים בריטים.
    - שפת אמו הייתה הולנדית, מה שהופך אותו לנשיא היחיד שדיבר אנגלית כשפה שנייה.
    - כינוי עיר הולדתו 'אולד קינדרהוק' הוליד את הביטוי הפופולרי 'O.K.' ואת השימוש
      הנרחב בו.
    - הוא סירב לספח את טקסס בכהונתו כדי להימנע מהרחבת העבדות ומהצתת מלחמה עם מקסיקו.
  - title: ויליאם הנרי הריסון
    points:
    - ויליאם הנרי הריסון כיהן את הכהונה הקצרה ביותר של נשיא, ונפטר 32 ימים בלבד לאחר
      כניסתו לתפקיד.
    - הוא נשא את נאום ההשבעה הארוך בהיסטוריה, שעה ו-45 דקות, בסופה קפואה וללא מעיל.
    - הוא היה הנשיא הראשון שנפטר בעת כהונתו, מה שעורר משבר חוקתי קצר בנוגע לירושת
      התפקיד.
    - לפני הקריירה הפוליטית שלו הוא זכה לתהילה כגנרל צבאי בקרב טיפקנו.
  - title: ג'ון טיילר
    points:
    - ג'ון טיילר היה סגן הנשיא הראשון שעלה לנשיאות בעקבות מותו של קודמו בתפקיד.
    - הוא סולק כליל ממפלגתו שלו, מפלגת הוויגים, בעודו מכהן כנשיא, בשל הטלת וטו על
      מדיניותה.
    - הוא הביא לעולם 15 ילדים, יותר מכל נשיא אחר בהיסטוריה של ארצות הברית.
    - הוא עקף את הקונגרס וסיפח רשמית את רפובליקת טקסס לארצות הברית באמצעות החלטה משותפת.
  - title: ג'יימס ק. פולק
    points:
    - ג'יימס ק. פולק היה מנהיג חרוץ במיוחד שהשיג כל אחת ממטרות הבחירות המרכזיות שהציב
      לכהונתו היחידה.
    - הוא הרחיב מאוד את גבולות המדינה עד לאוקיינוס השקט, בהשגת מחוז אורגון ובניצחון
      במלחמת מקסיקו.
    - הוא פיקח על פתיחת האקדמיה הימית של ארה״ב ועל הקמתו הרשמית של מוסד סמית'סוניאן.
    - נאמן להבטחתו לכהן ארבע שנים בלבד, הוא לא רץ לבחירה חוזרת ונפטר שלושה חודשים
      לאחר סיום כהונתו.
  - title: זכרי טיילור
    points:
    - זכרי טיילור בילה 40 שנה כקצין צבא מקצועי ועלה לתהילה כגיבור מלחמת מקסיקו.
    - הוא מעולם לא הצביע בבחירות לנשיאות לפני שרץ בעצמו לתפקיד מטעם מפלגת הוויגים.
    - סוס המלחמה האהוב עליו, 'אולד וייטי', חי על מדשאת הבית הלבן וקיבל את פני התיירים
      לעיתים קרובות.
    - הוא נפטר בפתאומיות בכהונתו בשנת 1850 לאחר שאכל כמות גדולה של דובדבנים וחלב בחגיגות
      ה-4 ביולי.
  - title: מילרד פילמור
    points:
    - מילרד פילמור היה החבר האחרון של מפלגת הוויגים שאי פעם התגורר בבית הלבן.
    - הוא חתם על 'פשרת 1850' השנויה במחלוקת, שדחתה זמנית את מלחמת האזרחים אך העמיקה
      את הפילוג האזורי.
    - הוא ואשתו אביגיל הקימו את הספרייה הקבועה הראשונה בתוך הבית הלבן.
    - הוא שלח את הקומודור מתיו פרי ליפן, ובכך פתח בהצלחה את מדינת האי המבודדת לסחר
      עם המערב.
  - title: פרנקלין פירס
    points:
    - פרנקלין פירס היה פוליטיקאי מקסים ופופולרי שכונה 'פרנק היפה' על ידי תומכיו.
    - הוא שינן את כל נאום ההשבעה שלו בן 3,300 המילים ונשא אותו ללא הערות או כתב.
    - הוא השלים את 'רכישת גאדסדן' בשנת 1853, בקניית חלקים מאריזונה וניו מקסיקו של
      ימינו ממקסיקו.
    - כהונתו ירדה מהפסים בשל תמיכתו ב'חוק קנזס-נברסקה', שהצית עימותים אלימים על רקע
      העבדות.
  - title: ג'יימס ביוקנן
    points:
    - ג'יימס ביוקנן נותר הנשיא היחיד בהיסטוריה שמעולם לא נישא, וכיהן כרווק כל חייו.
    - אחייניתו, הרייט ליין, שימשה כמארחת הרשמית של הבית הלבן, וטבעה את המונח 'הגברת
      הראשונה'.
    - הוא היה דיפלומט מנוסה מאוד שכיהן בעבר כמזכיר המדינה וכשגריר בבריטניה.
    - חוסר יכולתו להתמודד עם משבר הפרישה אפשר לאומה להתפצל למלחמת האזרחים עם סיום
      כהונתו.
  - title: אברהם לינקולן
    points:
    - אברהם לינקולן היה הנשיא הגבוה ביותר בהיסטוריה, בגובה 193 ס״מ ללא מגבעת הארובה
      המפורסמת שלו.
    - לפני כניסתו לפוליטיקה הוא היה מתאבק תחרותי מעולה, והוא מונצח בהיכל התהילה הלאומי
      להיאבקות.
    - הוא היה הנשיא הראשון שנולד מחוץ לשלוש-עשרה המושבות המקוריות, וגדל בבקתת עץ בקנטקי.
    - לינקולן היה חובב חיות מושבע שהתיר לחתוליו לאכול ישירות משולחן האוכל של הבית
      הלבן.
  - title: אנדרו ג'ונסון
    points:
    - אנדרו ג'ונסון היה חייט מקצועי לפני שנכנס לפוליטיקה, ותפר לעצמו חליפות מותאמות
      אישית גם כנשיא.
    - הוא היה הנשיא הראשון שהודח על ידי בית הנבחרים, וניצל מהדחה מתפקידו בקול אחד
      בלבד בסנאט.
    - ממשלו השלים את רכישת אלסקה מרוסיה בשנת 1867, מהלך שהמבקרים לעגו לו כ'שגעונו
      של סיוארד'.
    - הוא לא נכח בהשבעת יורשו, יוליסס ס. גרנט, בשל מרירות אישית ופוליטית עזה.
  - title: יוליסס ס. גרנט
    points:
    - שמו בלידה של יוליסס ס. גרנט היה היירם יוליסס גרנט, אך טעות פקידותית בווסט פוינט
      שינתה אותו לצמיתות.
    - הוא נעצר על ידי שוטר בוושינגטון במהלך כהונתו בגין נהיגה מהירה מדי בכרכרתו הרתומה
      לסוסים.
    - הוא ייסד את הפארק הלאומי ילוסטון בשנת 1872, ובכך יצר את הפארק הלאומי הראשון
      בעולם.
    - הוא כתב ספר זיכרונות אישי משובח בעודו גוסס מסרטן, כדי להבטיח יציבות כלכלית למשפחתו.
  - title: רת'רפורד ב. הייס
    points:
    - רת'רפורד ב. הייס ניצח בבחירות השנויות ביותר במחלוקת בהיסטוריה של ארה״ב, שהוכרעו
      בוועדה מיוחדת של הקונגרס.
    - הוא היה הנשיא הראשון שהשתמש בטלפון בבית הלבן, ומספר הטלפון האישי שלו היה פשוט
      המספר 1.
    - הוא אסר רשמית על אלכוהול והימורים בבית הלבן, מה שהקנה לאשתו את הכינוי 'לוסי
      לימונדה'.
    - הוא קיים מרצונו את הבטחת הבחירות שלו לכהן קדנציה אחת בלבד, ופרש מהתפקיד בשנת
      1881.
  - title: ג'יימס גארפילד
    points:
    - ג'יימס גארפילד היה מתמטיקאי מבריק שפיתח הוכחה גיאומטרית מקורית למשפט פיתגורס.
    - הוא היה שולט בשתי ידיו ויכול היה לכתוב לטינית ביד אחת ויוונית ביד השנייה בו-זמנית.
    - הוא נורה בידי מתנקש רק ארבעה חודשים לתוך כהונתו ונפטר 11 שבועות לאחר מכן בשל
      טיפול רפואי לא היגייני.
    - הוא היה החבר המכהן הראשון בבית הנבחרים שנבחר ישירות לנשיאות.
  - title: צ'סטר א. ארתור
    points:
    - צ'סטר א. ארתור היה גנדרן ידוע שהחזיק ביותר מ-80 זוגות מכנסיים והחליף תלבושות
      כמה פעמים ביום.
    - הוא סירב לעבור לבית הלבן עד ששיפץ אותו, ומכר במכירה פומבית 24 עגלות עמוסות ברהיטים
      היסטוריים ישנים.
    - בהפתיעו את מבקריו, הוא העביר את 'חוק פנדלטון' כדי לחסל שחיתות פוליטית וליצור
      את שירות המדינה המודרני.
    - הוא סבל בסתר ממחלת כליות קטלנית לאורך כל כהונתו והסתיר זאת מהציבור.
  - title: גרובר קליבלנד
    points:
    - גרובר קליבלנד הוא הנשיא היחיד שכיהן שתי כהונות לא רצופות, ונחשב גם לנשיא ה-22
      וגם ה-24.
    - הוא הנשיא היחיד שנישא בתוך הבית הלבן, כשנשא את פרנסס פולסום בחדר הכחול.
    - לפני כניסתו לפוליטיקה הוא עבד כשריף מחוז ואף ביצע בעצמו את תפקיד התליין הציבורי.
    - הוא עבר בסתר ניתוח מוצלח על גבי יאכטה כדי להסיר גידול סרטני מלסתו.
  - title: בנג'מין הריסון
    points:
    - בנג'מין הריסון היה נכדו של הנשיא התשיעי, ויליאם הנרי הריסון, ובכך יצר מורשת
      משפחתית ייחודית.
    - הוא היה הנשיא הראשון שבביתו הותקן חשמל, אך הוא פחד כל כך מהתחשמלות שלא נגע במתגים.
    - הוא הגדיל משמעותית את חיל הים האמריקאי וחתם על 'חוק שרמן נגד המונופולים' ההיסטורי.
    - בתקופת ממשלו צורפו לאיחוד שש מדינות חדשות, יותר מאשר תחת כל נשיא בודד אחר.
  - title: ויליאם מקינלי
    points:
    - ויליאם מקינלי היה הנשיא הראשון שהשתמש בטלפון לקמפיין פוליטי והראשון שהופיע בסרט
      קולנוע נע.
    - הוא ענד תמיד ציפורן אדומה בדש בגדו כקמע למזל, ומסר אותה לילדה צעירה רגעים לפני
      שנורה.
    - הוא הוביל את האומה לניצחון מהיר במלחמת ספרד-אמריקה, וביסס את ארה״ב כמעצמה עולמית.
    - דיוקנו הונח על שטר ה-500 דולר הנדיר, שהוצא רשמית משימוש על ידי הבנק הפדרלי בשנת
      1969.
  - title: תיאודור רוזוולט
    points:
    - תיאודור רוזוולט היה האדם הצעיר ביותר שהפך לנשיא, בגיל 42, לאחר רצח מקינלי.
    - הוא היה האמריקאי הראשון שזכה בפרס נובל לשלום, על תיווכו לסיום מלחמת רוסיה-יפן.
    - בובת 'דובי הטדי' המפורסמת הומצאה ונקראה על שמו לאחר שסירב לירות בגור דוב שבוי.
    - הוא שרד ניסיון התנקשות בשנת 1912 וסיים את נאומו בן 90 הדקות כשקליע נעוץ בחזהו.
  - title: ויליאם הווארד טאפט
    points:
    - ויליאם הווארד טאפט הוא האדם היחיד בהיסטוריה שכיהן גם כנשיא וגם כנשיא בית המשפט
      העליון.
    - הוא הנהיג את מסורת הספורט האמריקאית שבה הנשיא זורק את הכדור הטקסי הראשון במשחק
      בייסבול.
    - הוא היה הנשיא הכבד ביותר, במשקל של יותר מ-150 ק״ג, והתקין אמבטיה גדולה במיוחד
      בבית הלבן.
    - לו הייתה הפרה הנשיאותית האחרונה, פאולין ויין, שרעתה בחופשיות על מדשאת הבית הלבן.
  - title: וודרו וילסון
    points:
    - וודרו וילסון היה אקדמאי מוערך ונותר הנשיא היחיד שהחזיק בתואר דוקטור (PhD).
    - הוא הוביל את האומה במלחמת העולם הראשונה וקידם את הקמת 'חבר הלאומים' לשמירת השלום
      העולמי.
    - הוא לקה בשבץ מוחי מתיש בשנת 1919, ולאחריו ניהלה אשתו אדית בסתר חלק ניכר מתפקידי
      הנשיאות.
    - הוא קבע רשמית את 'יום האם' כחג לאומי בשנת 1914, שיצוין ביום ראשון השני של חודש
      מאי.
  - title: וורן ג. הרדינג
    points:
    - וורן ג. הרדינג היה הנשיא הראשון שנשא נאום ברדיו והראשון שהגיע להשבעתו במכונית.
    - הוא היה שחקן פוקר נלהב שהימר פעם והפסיד מערכת שלמה של חרסינה היסטורית של הבית
      הלבן ביד אחת.
    - הוא שכר את כותב הנאומים הנשיאותי הראשון במשרה מלאה כדי לסייע לו בנאומיו הפומביים.
    - הוא נפטר בפתאומיות מהתקף לב בסן פרנסיסקו במהלך סבב נאומים ארצי בשנת 1923.
  - title: קלווין קולידג'
    points:
    - קלווין קולידג' כונה 'קאל השקט' בזכות אישיותו השקטה והמאופקת וסגנון דיבורו התמציתי.
    - הוא החזיק גן חיות אקזוטי בבית הלבן, שכלל היפופוטם ננסי בשם 'בילי' ורקון בשם
      'רבקה'.
    - הוא חתם על 'חוק אזרחות האינדיאנים' משנת 1924, שהעניק אזרחות מלאה לכל הילידים
      שנולדו בארה״ב.
    - הוא הנשיא היחיד שנולד ב-4 ביולי, כשהגיע לעולם בוורמונט בשנת 1872.
  - title: הרברט הובר
    points:
    - הרברט הובר היה מהנדס ומיליונר שעשה את הונו בעצמו, ובילה עשורים בארגון מבצעי
      סיוע מזון הומניטריים ענקיים.
    - הוא ואשתו לו הנרי דיברו מנדרינית שוטפת בבית הלבן כדי למנוע מהצוות לצותת לשיחותיהם
      הפרטיות.
    - הוא חתם על חוק הקונגרס שהפך רשמית את 'הדגל זרוע הכוכבים' להמנון הלאומי של ארצות
      הברית.
    - סכר הובר המונומנטלי על נהר קולורדו נקרא על שמו בזכות מאמציו ההנדסיים והפוליטיים
      הנרחבים.
  - title: פרנקלין ד. רוזוולט
    points:
    - פרנקלין ד. רוזוולט היה הנשיא היחיד שנבחר לארבע כהונות, וכיהן בתקופת השפל הגדול
      ומלחמת העולם השנייה.
    - הוא השתמש ברדיו, אמצעי חדש יחסית, כדי להתחבר לציבור באמצעות 30 'שיחות ליד האח'.
    - משותק מהמותניים ומטה בעקבות פוליו בשנת 1921, הוא עשה מאמצים רבים להסתיר את השימוש
      בכיסא גלגלים מהציבור.
    - הוא הורה על בניית בונקר תת-קרקעי סודי בבית הלבן, שהתפתח לימים ל'חדר המצב'.
  - title: הארי ס. טרומן
    points:
    - להארי ס. טרומן לא היה שם אמצעי; הוריו נתנו לו את האות 'S' לבדה כדי לכבד את שני
      סביו.
    - הוא קיבל את ההחלטה המונומנטלית להטיל פצצות אטום על יפן, ובכך סיים את מלחמת העולם
      השנייה באוגוסט 1945.
    - הוא החזיק על שולחנו שלט שקבע 'האחריות נעצרת כאן' כדי להראות שהוא נוטל אחריות
      מלאה על כל החלטה.
    - 'ניצחונו המפתיע בבחירות 1948 הוליד את הכותרת השגויה המפורסמת בעיתון: ''דיואי
      מביס את טרומן''.'
  - title: דווייט ד. אייזנהאואר
    points:
    - דווייט ד. אייזנהאואר היה גנרל בעל חמישה כוכבים ששימש כמפקד העליון של כוחות בעלות
      הברית באירופה במלחה״ע השנייה.
    - הוא אישר את יצירת מערכת הכבישים הבין-מדינתיים, ששינתה כליל את התחבורה והמסחר
      באמריקה.
    - הוא חתם על החקיקה שהקימה את נאס״א והוסיף רשמית את המילים 'תחת אלוהים' לשבועת
      האמונים.
    - הוא היה הנשיא הראשון שטס במסוק והראשון שנמנע ממנו בחוק לרוץ לכהונה שלישית.
  - title: ג'ון פ. קנדי
    points:
    - ג'ון פ. קנדי היה האדם הצעיר ביותר שנבחר לנשיאות, כשזכה בבחירות 1960 בגיל 43.
    - הוא היה הצופה הראשון שהפך לנשיא וזכה בפרס פוליצר על ספרו הביוגרפי 'פרופילים
      של אומץ'.
    - במלחה״ע השנייה, ספינת הטורפדו שלו PT-109 טובעה, והוא הציל את צוותו בשחייה במשך
      שעות אל אי.
    - הוא השיק את תוכנית 'אפולו' בהכריזו כי ארה״ב תנחית אדם על הירח לפני תום שנות
      ה-60.
  - title: לינדון ב. ג'ונסון
    points:
    - לינדון ב. ג'ונסון הושבע לנשיאות על סיפון 'אייר פורס 1' בעקבות רצח ג'ון פ. קנדי.
    - הוא העביר את 'חוק זכויות האזרח' ההיסטורי מ-1964 ואת 'חוק זכות ההצבעה' מ-1965
      כדי לבטל את ההפרדה החוקית.
    - הוא השתמש בנוכחות פיזית מאיימת ובשכנוע אינטנסיבי המכונים 'הטיפול של LBJ' כדי
      להעביר חוקים.
    - הוא יצר את תוכניות 'מדיקר' ו'מדיקייד' הענקיות כדי לספק שירותי בריאות לקשישים
      ולבעלי הכנסה נמוכה.
  - title: ריצ'רד ניקסון
    points:
    - ריצ'רד ניקסון נותר הנשיא היחיד בהיסטוריה של ארה״ב שהתפטר מתפקידו, בעקבות שערוריית
      'ווטרגייט'.
    - הוא ערך ביקור היסטורי בסין הקומוניסטית בשנת 1972, ובכך סיים עשורים של בידוד
      דיפלומטי בין שתי המדינות.
    - הוא הקים את 'הסוכנות להגנת הסביבה' (EPA) וחתם על 'חוק האוויר הנקי'.
    - הוא שוחח ישירות בטלפון עם האסטרונאוטים ניל ארמסטרונג ובאז אולדרין בעודם הולכים
      על הירח.
  - title: ג'רלד פורד
    points:
    - ג'רלד פורד הוא האדם היחיד שכיהן גם כסגן נשיא וגם כנשיא מבלי שנבחר לאף אחד מהתפקידים
      על ידי הבוחרים.
    - הוא היה שחקן פוטבול מצטיין באוניברסיטת מישיגן ודחה הצעות מקצועניות מליגת ה-NFL.
    - הוא עורר מחלוקת ציבורית עזה כשהעניק חנינה נשיאותית מלאה לריצ'רד ניקסון על שערוריית
      ווטרגייט.
    - הוא שרד שני ניסיונות התנקשות שונים בתוך שלושה שבועות בלבד בקליפורניה בשנת 1975.
  - title: ג'ימי קרטר
    points:
    - ג'ימי קרטר עבד כחקלאי בוטנים מצליח וכמהנדס גרעין בחיל הים לפני שנכנס לפוליטיקה.
    - הוא תיווך בהצלחה ל'הסכמי קמפ דייוויד' ההיסטוריים מ-1978, שכוננו הסכם שלום בין
      מצרים לישראל.
    - הוא חי את החיים הארוכים ביותר מבין כל נשיאי ארה״ב, והקדיש את עשורי חייו שלאחר
      הכהונה לבניית בתים לצדקה.
    - הוא היה הנשיא לשעבר הראשון שזכה בפרס נובל לשלום לאחר עזיבת הבית הלבן, על פועלו
      הדיפלומטי.
  - title: רונלד רייגן
    points:
    - רונלד רייגן עבד כשחקן הוליוודי מצליח והופיע ביותר מ-50 סרטים לפני שעבר לפוליטיקה.
    - 'הוא שרד ניסיון התנקשות בשנת 1981, ואמר בבדיחות הדעת למנתחיו: ''אני מקווה שכולכם
      רפובליקנים''.'
    - כדי לגמול מהתמכרותו למקטרות, רייגן צרך יותר מ-300,000 סוכריות 'ג'לי בלי' במהלך
      כהונתו.
    - בגיל 73 הוא הפך לאדם המבוגר ביותר באותה עת שהושבע לכהונה נשיאותית שנייה.
  - title: ג'ורג' ה. וו. בוש
    points:
    - ג'ורג' ה. וו. בוש היה טייס חיל ים מעוטר במלחה״ע השנייה ששרד לאחר שמטוסו הופל
      מעל האוקיינוס השקט.
    - הוא כיהן כמנהל ה-CIA וכשגריר באו״ם לפני נשיאותו.
    - הוא הוביל בהצלחה קואליציה צבאית עולמית לניצחון במלחמת המפרץ ב-1991, ושחרר את
      מדינת כווית.
    - הוא חתם על 'חוק האמריקאים עם מוגבלויות' מ-1990, שהגן על מיליונים מפני אפליה.
  - title: ביל קלינטון
    points:
    - ביל קלינטון היה נשיא 'דור הבייבי-בום' הראשון ונבחר בגיל הצעיר 46.
    - הוא ניגן בסקסופון בטלוויזיה הארצית במהלך הקמפיין שלו, מהלך שחולל מהפכה במדיה
      הפוליטית המודרנית.
    - ממשלו השיג את העודף התקציבי הפדרלי הראשון מזה עשורים, ואיזן את התקציב הלאומי
      כמה שנים ברציפות.
    - הוא היה הנשיא השני שהודח על ידי בית הנבחרים, אך בסופו של דבר זוכה על ידי הסנאט.
  - title: ג'ורג' וו. בוש
    points:
    - ג'ורג' וו. בוש היה בנו של הנשיא ה-41, ובכך היו לצמד האב-ובן השני שכיהן בתפקיד.
    - הוא הוביל את ארצות הברית בתגובתה לפיגועי ה-11 בספטמבר, והקים את 'המשרד לביטחון
      המולדת'.
    - לפני כניסתו לפוליטיקה הוא היה הבעלים של קבוצת הבייסבול 'טקסס ריינג'רס' וניהל
      חברת קידוחי נפט.
    - הוא נשא נאום מפורסם עם מגפון ב'גראונד זירו', ואיחד את המדינה בימים שלאחר פיגועי
      ה-11 בספטמבר.
  - title: ברק אובמה
    points:
    - ברק אובמה היה הנשיא האפרו-אמריקאי הראשון של ארצות הברית והראשון שנולד בהוואי.
    - הוא זכה בפרס גראמי לאלבום המדובר הטוב ביותר על גרסאות האודיו של ספריו, עוד לפני
      כניסתו לבית הלבן.
    - כאספן קומיקס נלהב, הדמויות האהובות עליו בילדותו היו 'ספיידרמן' ו'קונאן הברברי'.
    - הוא זכה בפרס נובל לשלום בשנת 2009 על מאמציו יוצאי הדופן לחיזוק הדיפלומטיה הבינלאומית.
  - title: דונלד טראמפ
    points:
    - דונלד טראמפ היה האדם הראשון שנבחר לנשיאות ללא כל ניסיון פוליטי או שירות צבאי
      קודם.
    - הוא בנה אימפריית נדל״ן עולמית והנחה את תוכנית הריאליטי המצליחה 'המתמחה' (The
      Apprentice).
    - הוא הקים את 'כוח החלל' של ארה״ב, הזרוע החדשה הראשונה בכוחות המזוינים האמריקאיים
      מאז 1947.
    - הוא מינה שלושה שופטים שמרנים לבית המשפט העליון במהלך כהונתו היחידה, ועיצב מחדש
      את מערכת המשפט הפדרלית.
  - title: ג'ו ביידן
    points:
    - ג'ו ביידן כיהן כסנאטור מטעם דלוור במשך 36 שנה וכסגן נשיא במשך 8 שנים לפני שזכה
      בנשיאות.
    - הוא התגבר על גמגום קשה בילדותו באמצעות תרגול של דקלום שירה לבדו מול המראה במשך
      שעות.
    - הוא היה האדם המבוגר ביותר שהושבע לנשיאות, כשנשא את שבועת האמונים בגיל 78.
    - הוא חתם על 'חוק ההשקעה בתשתיות ובמקומות עבודה' המונומנטלי כדי לשדרג כבישים,
      גשרים ותחבורה ציבורית.
  trivia:
  - type: multiple_choice
    question: איזה נשיא דיבר אנגלית כשפה שנייה, לאחר שגדל כדובר הולנדית במדינת ניו
      יורק?
    options:
    - מרטין ואן ביורן
    - תיאודור רוזוולט
    - פרנקלין ד. רוזוולט
    - ג'יימס מונרו
    correct: 0
    explanation: מרטין ואן ביורן נולד וגדל בקהילה הולנדית בעיירה קינדרהוק שבניו יורק,
      והוא הנשיא היחיד ששפת אמו לא הייתה אנגלית.
  - type: multiple_choice
    question: מי היה הנשיא הנמוך ביותר בתולדות ארצות הברית, שגובהו עמד על כ-1.63 מטרים
      בלבד?
    options:
    - ג'ון קווינסי אדמס
    - ג'יימס מדיסון
