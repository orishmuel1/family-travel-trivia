        question: "מי הייתה השופטת הראשונה בבית המשפט העליון, שמונתה על ידי רונלד רייגן?"
        options: ["רות ביידר גינסבורג", "סנדרה דיי או'קונור", "סוניה סוטומאיור", "אלנה קייגן"]
