    - הארי ס. טרומן
    correct: 1
    explanation: ג'יימס מדיסון התנשא לגובה של כ-1.63 מטרים (5 רגל ו-4 אינץ') ושקל
      כ-45 קילוגרמים בלבד.
  - type: multiple_choice
    question: איזה נשיא היה מתאבק מצטיין בצעירותו והשתתף במאות קרבות היאבקות לפני
      שנכנס לחיים הפוליטיים?
    options:
    - אברהם לינקולן
    - אנדרו ג'קסון
    - יוליסס ס. גרנט
    - זאכרי טיילור
    correct: 0
    explanation: אברהם לינקולן היה מתאבק דגול באילינוי, ונרשם לו רק הפסד מתועד יחיד
      מתוך כ-300 קרבות שבהם נטל חלק.
  - type: multiple_choice
    question: מי הוא האדם היחיד בתולדות ארצות הברית שכיהן הן כנשיא המדינה והן כנשיא
