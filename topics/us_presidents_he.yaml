    - בנג'מין הריסון
    - גרובר קליבלנד
    - ויליאם מקינלי
    correct: 1
    explanation: בנג'מין הריסון חנך את תאורת החשמל בבית הלבן ב-1891, אך הוא ובני משפחתו
      חששו מהמתגים והותירו את הדלקתם לאנשי הצוות.
  - type: multiple_choice
    question: איזה נשיא לימד את התוכי האישי שלו לקלל, עד שהיה צורך להרחיק את הציפור
      מלווייתו בשל קללותיה?
    options:
    - אנדרו ג'קסון
    - זאכרי טיילור
    - ג'יימס ק. פולק
    - מילרד פילמור
    correct: 0
    explanation: תוכי הז'אקו של אנדרו ג'קסון, שכונה 'פול', הדהים את הנוכחים בלווייתו
      ב-1845 כשהחל לקלל בקול רם כפי שהנשיא לימד אותו.
  - type: multiple_choice
    question: איזה נשיא היה היחיד בתולדות ארצות הברית שנבחר פה אחד על ידי כל חברי
      חבר האלקטורים?
    options:
    - ג'ורג' וושינגטון
    - תומאס ג'פרסון
    - ג'יימס מונרו
    - ג'ון אדמס
    correct: 0
    explanation: ג'ורג' וושינגטון זכה ב-100% מקולות האלקטורים הן בבחירות של 1789 והן
      בבחירות של 1792.
  - type: multiple_choice
    question: איזה נשיא לשעבר שרד ניסיון התנקשות ב-1912 והמשיך לנאום במשך 90 דקות
      עם קליע בחזהו?
    options:
    - אנדרו ג'קסון
    - תיאודור רוזוולט
    - רונלד רייגן
    - ג'רלד פורד
    correct: 1
    explanation: תיאודור רוזוולט נורה במילווקי במהלך מסע בחירות ב-1912; קופסת המשקפיים
      ודפי הנאום בלמו את הקליע, והוא התעקש לשאת את הנאום במלואו לפני שפונה לבית החולים.
  - type: multiple_choice
    question: מי היה הנשיא היחיד בתולדות ארצות הברית שהתפטר מתפקידו?
    options:
    - ריצ'רד ניקסון
    - אנדרו ג'ונסון
    - ביל קלינטון
    - ג'רלד פורד
    correct: 0
    explanation: ריצ'רד ניקסון התפטר ב-9 באוגוסט 1974 בעקבות פרשת ווטרגייט וההליך
      המתקרב להדחתו בקונגרס.
  - type: multiple_choice
    question: מי הוא האדם היחיד שכיהן הן כסגן נשיא והן כנשיא ארצות הברית מבלי שנבחר
      לאף אחד מהתפקידים בקלפי?
    options:
    - ג'רלד פורד
    - נלסון רוקפלר
    - ספירו אגניו
    - צ'סטר א. ארתור
    correct: 0
    explanation: ג'רלד פורד מונה לסגן הנשיא לאחר התפטרות ספירו אגניו, והושבע לנשיא
      בעקבות התפטרותו של ריצ'רד ניקסון לפי התיקון ה-25 לחוקה.
  - type: multiple_choice
    question: איזה נשיא שירת כמפקד העליון של כוחות בעלות הברית באירופה במלחמת העולם
      השנייה לפני שנבחר לנשיאות?
    options:
    - דווייט ד. אייזנהאואר
    - דאגלס מקארתור
    - ג'ורג' מרשל
    - יוליסס ס. גרנט
    correct: 0
    explanation: גנרל דווייט ד. אייזנהאואר פיקד על כוחות בעלות הברית באירופה ותכנן
      את הפלישה לנורמנדי (מבצע אוברלורד) בטרם נבחר לנשיא ב-1952.
  - type: multiple_choice
    question: מי היה האדם הצעיר ביותר אי פעם שנבחר בקלפי לתפקיד נשיא ארצות הברית?
    options:
    - ג'ון פ. קנדי
    - תיאודור רוזוולט
    - ביל קלינטון
    - ברק אובמה
    correct: 0
    explanation: ג'ון פ. קנדי נבחר בגיל 43 בשנת 1960. תיאודור רוזוולט היה צעיר ממנו
      בכמה חודשים כשהושבע לנשיא לאחר רצח מקינלי, אך הוא ירש את התפקיד ולא נבחר אליו
      תחילה.
  - type: multiple_choice
    question: איזה נשיא היה שחקן קולנוע הוליוודי מצליח ומנהיג איגוד מקצועי לפני כניסתו
      לפוליטיקה הארצית?
    options:
    - רונלד רייגן
    - דונלד טראמפ
    - וורן הרדינג
    - ג'ימי קרטר
    correct: 0
    explanation: רונלד רייגן שיחק ביותר מ-50 סרטים והנהיג את גילדת שחקני המסך (SAG)
      בטרם כיהן כמושל קליפורניה ונשיא ארה״ב.
  - type: multiple_choice
    question: איזה נשיא הקים את המחלקה לביטחון המולדת בעקבות מתקפות הטרור של ה-11
      בספטמבר?
    options:
    - ג'ורג' ווקר בוש
    - ביל קלינטון
    - ברק אובמה
    - ג'ורג' הרברט ווקר בוש
    correct: 0
    explanation: ג'ורג' ווקר בוש ייסד את המחלקה לביטחון המולדת (DHS) בשנת 2002 כדי
      לאחד עשרות סוכנויות פדרליות למאבק בטרור.
  - type: multiple_choice
    question: מי היה האפרו-אמריקאי הראשון שנבחר לתפקיד נשיא ארצות הברית?
    options:
    - ברק אובמה
    - קולין פאוול
    - ג'סי ג'קסון
    - קורי בוקר
    correct: 0
    explanation: ברק אובמה רשם ציון דרך היסטורי בבחירות של שנת 2008 כאשר נבחר לנשיא
      ה-44 של ארצות הברית.
- id: wars_and_conflict
  title: מלחמות ועימותים
  description: 'צלילה מעמיקה לאופן שבו מנהיגים היסטוריים אלו ניהלו משברים צבאיים עצומים,
    קרבות בין-לאומיים ורגעים מכריעים של אסטרטגיה בעת מלחמה. למדו כיצד החלטותיהם בשדה
    הקרב ובחדרי המלחמה שינו לנצח את מהלך ההיסטוריה.

    '
  cards:
  - title: ג'ורג' וושינגטון
    points:
    - לפני נשיאותו שימש וושינגטון כמפקד העליון של הצבא הקונטיננטלי במהלך מלחמת העצמאות
      האמריקאית.
    - חצייתו המפתיעה של נהר הדלאוור הקפוא בליל חג המולד 1776 הובילה לניצחון מכריע
      בטרנטון.
    - הוא ניהל התפרצות אבעבועות שחורות קטלנית בקרב חייליו בהוראה על חיסון המוני מוקדם
      וסודי.
    - הוא ויתר על תפקידו הצבאי בתום המלחמה, ובכך הבטיח שליטה אזרחית על הממשל החדש.
  - title: תומאס ג'פרסון
    points:
    - ג'פרסון אישר את 'מלחמת ברבריה הראשונה' ב-1801, הפעם הראשונה שכוחות אמריקאים
      נלחמו בימים ובחופים זרים.
    - הוא סירב לשלם דמי סחיטה לשודדי הים מצפון אפריקה, שחטפו באופן פעיל ספינות סוחר
      אמריקאיות.
    - הוא הפעיל את חיל הים והמארינס האמריקאיים החדשים כדי לחסום בהצלחה נמלי אויב בים
      התיכון.
    - המילים המפורסמות 'אל חופי טריפולי' בהמנון חיל המארינס מציינות את הניצחון שהושג
      בכהונתו.
  - title: אברהם לינקולן
    points:
    - לינקולן הוביל בהצלחה את ארצות הברית דרך מלחמת האזרחים, המשבר הפנימי העקוב מדם
      והגדול ביותר של האומה.
    - הוא הוציא את 'הכרזת השחרור' ב-1863 כצעד צבאי חיוני, ששחרר את המשועבדים במדינות
      הקונפדרציה.
    - הוא החליף גנרלים רבים עד שמינה את יוליסס ס. גרנט לפיקוד על כל צבאות האיחוד.
    - '''נאום גטיסברג'' הקצר והעוצמתי שלו הגדיר מחדש את מטרת המלחמה כהגנה על השוויון
      והחירות.'
  - title: תיאודור רוזוולט
    points:
    - רוזוולט זכה לתהילה במלחמת ספרד-אמריקה כשהוביל את גדוד הפרשים המתנדבים הידוע
      כ'רוף ריידרס'.
    - הוא הוביל מתקפה אגדית וניצחת במעלה גבעת סן חואן בקובה בשנת 1898.
    - הוא הנשיא היחיד שקיבל את 'מדליית הכבוד', שהוענקה לו לאחר מותו בשנת 2001 על גבורתו
      בקרב.
    - כנשיא, הוא מודרן את חיל הים ושלח את 'הצי הלבן הגדול' שלו להפלגה שלווה סביב העולם
      כהפגנת עוצמה.
  - title: פרנקלין ד. רוזוולט
    points:
    - רוזוולט הוביל את ארה״ב למלחה״ע השנייה בעקבות מתקפת הפתע היפנית על פרל הארבור
      ב-7 בדצמבר 1941.
    - הוא כינה את הפצצת פרל הארבור 'יום שיישאר בקלון' בנאומו ההיסטורי בפני הקונגרס.
    - הוא פעל בשיתוף הדוק עם מנהיגי בעלות הברית וינסטון צ'רצ'יל ויוסף סטלין לגיבוש
      אסטרטגיה נגד מעצמות הציר.
    - הוא אישר בסתר את 'פרויקט מנהטן', התוכנית המדעית הסודית שפיתחה בהצלחה את נשקי
      האטום הראשונים.
  - title: ג'ון פ. קנדי
    points:
    - קנדי ניווט את 'משבר הטילים בקובה' ב-1962, הנחשב לרגע הקרוב ביותר שבו העולם הגיע
      למלחמה גרעינית כוללת.
    - במקום מתקפה אווירית מיידית, הוא הורה על 'הסגר' ימי סביב האי קובה.
    - הוא הקים 'קו חם' טלפוני ישיר בין וושינגטון למוסקבה כדי למנוע הסלמות צבאיות מקריות
      בעתיד.
    - הוא אישר את 'פלישת מפרץ החזירים' הכושלת ב-1961, ניסיון סודי לא מוצלח להפיל את
      ממשלת קובה.
  - title: רונלד רייגן
    points:
    - רייגן יישם אסטרטגיה רחבה להסלמת המלחמה הקרה, בהגדלה אגרסיבית של ההוצאות הצבאיות
      ללחץ על ברית המועצות.
    - הוא כינה את ברית המועצות 'אימפריית הרשע' בנאום פומבי בולט בשנת 1983.
    - הוא קידם את 'יוזמת ההגנה האסטרטגית', פרויקט מגן טילים חללי שכונה בתקשורת 'מלחמת
      הכוכבים'.
    - בשנת 1987 הוא נשא נאום ליד חומת ברלין, וקרא ישירות למנהיג הסובייטי גורבצ'וב
      'הרוס את החומה הזו!'
  - title: ברק אובמה
    points:
    - אובמה אישר את הפשיטה הסודית של קומנדו חיל הים ב-2011 בפקיסטן, שהביאה למותו של
      מנהיג הטרור אוסאמה בן-לאדן.
    - הוא הרחיב משמעותית את השימוש האסטרטגי במתקפות מל״טים (רחפנים) נגד מטרות מיליטנטיות
      במזרח התיכון.
    - הוא קיים הבטחת בחירות כשצמצם וסיים את פעולות הלחימה האמריקאיות העיקריות במלחמת
      עיראק.
    - הוא הורה על תגבור מסיבי של 30,000 חיילים נוספים לאפגניסטן כדי להילחם במרד הטליבאן
      ההולך וגובר.
  trivia:
  - type: multiple_choice
    question: איזה נשיא פיקד על גדוד הפרשים המתנדבים שנודע בכינוי 'הפרשים הקשוחים'
