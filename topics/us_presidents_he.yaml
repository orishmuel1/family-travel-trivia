    options:
    - ויליאם הווארד טאפט
    - ג'ון קווינסי אדמס
    - ויליאם מקינלי
    - וודרו וילסון
    correct: 0
    explanation: ויליאם הווארד טאפט כיהן כנשיא ה-27 (1909–1913) ומאוחר יותר מונה לנשיא
      בית המשפט העליון (1921–1930).
  - type: multiple_choice
    question: איזה נשיא חשש כל כך מהתחשמלות עד שנמנע מלגעת במתגי החשמל החדשים שהותקנו
      בבית הלבן?
    options:
