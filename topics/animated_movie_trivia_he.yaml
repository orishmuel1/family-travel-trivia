id: animated_movie_trivia_he
title: "טריוויה מסרטי אנימציה"
description: >
  התכוננו למסע קסום בעולם הקולנוע המצויר! ממעשיות הפיות הקלאסיות של דיסני 
  והרפתקאות המופת של פיקסאר ועד הקומדיות הפרועות של דרימוורקס והשירים הבלתי נשכחים, 
  בחנו את הידע המשפחתי על סרטי האנימציה הגדולים בכל הזמנים.
lang: he
audience: family
categories:
  - id: important_facts
    title: "עובדות חשובות"
    description: >
      אבני דרך מרתקות מאחורי הקלעים ופריצות דרך מהפכניות בתולדות האנימציה. 
      קראו את העובדות המפתיעות הללו יחד לפני שתצללו לשאלות הטריוויה!
    cards:
      - title: "שלגיה והולדת האנימציה באורך מלא"
        points:
          - "סרטו של וולט דיסני 'שלגיה ושבעת הגמדים' (1937) היה סרט האנימציה המצויר הראשון בהיסטוריה באורך מלא."
          - "ספקנים בהוליווד כינו את הפרויקט היקר בשם 'השיגעון של דיסני', וניבאו שהוא יפשוט את הרגל."
          - "הסרט הפך ללהיט קופתי עולמי ענק, והעניק לדיסני פרס אוסקר של כבוד מיוחד: פסלון אחד רגיל ושבעה פסלונים זעירים."
          - "האנימטורים ציירו וצבעו ביד יותר מ-200,000 דפי צלולואיד שקופים (Cels) בזה אחר זה."
      - title: "צעצוע של סיפור ומהפכת התלת-ממד"
        points:
          - "שיצא לאקרנים בשנת 1995 מבית פיקסאר ודיסני, 'צעצוע של סיפור' היה הסרט הראשון בהיסטוריה שנוצר כולו במחשב (CGI)."
          - "נדרשו 110 מחשבי תחנת עבודה מיוחדים שפעלו 24 שעות ביממה כדי לרנדר את 114,000 הפריימים של הסרט."
          - "הבמאי ג'ון לאסיטר זכה באוסקר להישג מיוחד על פריצת הדרך הקולנועית באנימציה ממוחשבת."
          - "הצלחת הסרט שינתה את התעשייה לתמיד, והפכה את האנימציה הדיגיטלית לסגנון המוביל בסרטי משפחה בעולם."
      - title: "הרמז הסודי A113"
        points:
          - "הקוד 'A113' הוא רמז סודי (Easter Egg) המופיע כמעט בכל סרט של פיקסאר, וכן בסרטי דיסני ובפרקי משפחת סימפסון."
          - "זהו מספר כיתת הלימוד במכון לאמנויות של קליפורניה (CalArts) שבה למדו גדולי האנימטורים עיצוב גרפי."
          - "בין בוגרי כיתה A113 נמנים ג'ון לאסיטר, בראד בירד, פיט דוקטר וטים ברטון."
          - "הוא מופיע על לוחית הרישוי של אמו של אנדי בצעצוע של סיפור, על מצלמת הצוללן במוצאים את נמו ועל רכבת במכוניות."
      - title: "אגדות הדיבוב"
        points:
          - "רובין ויליאמס חולל מהפכה בתחום הדיבוב בשנת 1992 כשאילתר מעל 16 שעות של דיאלוגים כג'יני באלאדין."
          - "האנימטורים התאימו את שינויי הצורה של הג'יני על המסך לחיקויים הקוליים המהירים של רובין ויליאמס."
          - "ההופעה שלו שכנעה כוכבי הוליווד מובילים שדיבוב דמויות אנימציה הוא תפקיד אמנותי יוקרתי ונחשק."
          - "כיום, גדולי השחקנים בעולם תורמים בשמחה את קולם כדי להפיח חיים בגיבורים ובנבלים מצוירים."
      - title: "סטודיו ג'יבלי והקסם המצויר ביד"
        points:
          - "הוקם ביפן על ידי הבמאי האגדי הייאו מיאזאקי ב-1985, סטודיו ג'יבלי מפורסם ברחבי העולם באנימציה מרהיבה שצוירה ביד."
          - "'המסע המופלא' (2001) זכה בפרס האוסקר לסרט האנימציה הטוב ביותר, והוא הסרט היחיד שצויר ביד ושאינו באנגלית שזכה בכך."
          - "סרטי ג'יבלי מפורסמים ברקעי צבעי מים פיוטיים, מסרים של שמירה על הטבע ויצורי פלא מכושפים."
          - "הבמאי מיאזאקי מקפיד לצייר בידו פריימים מרכזיים רבים כדי לשמור על חום ותנועה אורגנית ייחודית."
      - title: "קסם האנימציה בסטופ-מושן"
        points:
          - "אנימציית סטופ-מושן כוללת הזזה פיזית מדויקת של בובות אמיתיות פריים אחר פריים, תוך צילום 24 תמונות לכל שניית סרט."
          - "אולפנים כמו ארדמן (וולאס וגרומיט) ולייקה (קורליין) משקיעים שבועות של עבודה סיזיפית לצילום שניות בודדות של סרט."
          - "בסרט 'הסיוט שלפני חג המולד' (1993), לג'ק סקלינגטון היו מעל 400 ראשי בובה מפוסלים להחלפה להבעות פנים שונות."
          - "הסטופ-מושן משלב את המרקם הממשי של חומרים אמיתיים (פלסטלינה, בד ועץ) עם הדמיון חסר הגבולות של הפנטזיה."
      - title: "ענקי שוברי הקופות המצוירים"
        points:
          - "'הקול בראש 2' (2024) ו-'מלך האריות' (2019) שברו שיאים והפכו לסרטי האנימציה המכניסים ביותר בתולדות הקולנוע העולמי."
          - "סדרות סרטים כמו גנב נבזה/המיניונים, שרק וצעצוע של סיפור גרפו כל אחת מיליארדי דולרים לאורך סרטי ההמשך."
          - "סרטי אנימציה מובילים באופן עקבי ברשימות הסרטים הנצפים והנשנים ביותר בשירותי הסטרימינג."
          - "המשיכה שלהם לילדים ולהורים נוסטלגיים כאחד מייצרת הצלחה על-דורית חסרת תקדים."
      - title: "הופעות אורח סודיות ורכב פיצה פלאנט"
        points:
          - "טנדר המשלוחים הצהוב-לבן של 'פיצה פלאנט' הופיע לראשונה בסרט 'צעצוע של סיפור' המקורי בשנת 1995."
          - "מאז, אנימטורים של פיקסאר שותלים את הרכב בהחבא כמעט בכל סרט שלהם, מבאג לייף ועד קוקו."
          - "אפילו בסקוטלנד העתיקה בסרט 'אמיצה' (2012), המכשפה מגלפת פסלון עץ של רכב הפיצה פלאנט!"
          - "איתור הרמזים והופעות האורח הסודיות הפך למסורת משפחתית אהובה עבור צופים חדי עין בכל העולם."
    trivia:
      - type: multiple_choice
        question: "איזה סרט היה סרט האנימציה המצויר הראשון באורך מלא בתולדות הקולנוע בשנת 1937?"
        options: ["פינוקיו", "שלגיה ושבעת הגמדים", "במבי", "פנטסיה"]
        correct: 1
      - type: single_qa
        question: "איזה סרט מופת של פיקסאר משנת 1995 היה הסרט הראשון בהיסטוריה שנוצר כולו באנימציה ממוחשבת?"
        answer: "צעצוע של סיפור (Toy Story)"
      - type: multiple_choice
        question: "איזה מספר כיתת לימוד מפורסם ב-CalArts מוחבא כרמז סודי בעשרות סרטי פיקסאר ודיסני?"
        options: ["B12", "חדר 404", "A113", "C77"]
        correct: 2
      - type: single_qa
        question: "איזה גאון קומי חולל מהפכה בדיבוב כשאילתר 16 שעות של דיאלוגים כג'יני באלאדין?"
        answer: "רובין ויליאמס"
      - type: multiple_choice
        question: "איזה סרט של סטודיו ג'יבלי זכה בפרס האוסקר לסרט האנימציה הטוב ביותר בשנת 2003?"
        options: ["השכן שלי טוטורו", "המסע המופלא (Spirited Away)", "הטירה הנעה", "פוניו"]
        correct: 1
      - type: single_qa
        question: "איזה רכב משלוחים צהוב-לבן מופיע כהופעת אורח סודית כמעט בכל סרט של פיקסאר?"
        answer: "טנדר פיצה פלאנט (Pizza Planet Truck)"
      - type: multiple_choice
        question: "כמה תמונות בודדות (פריימים) צריכים אנימטורים של סטופ-מושן לצלם עבור שנייה אחת בלבד של סרט?"
        options: ["5 פריימים", "12 פריימים", "24 פריימים", "60 פריימים"]
        correct: 2
      - type: single_qa
        question: "כמה פסלוני אוסקר זעירים ומיוחדים קיבל וולט דיסני לצד האוסקר הרגיל על הסרט שלגיה?"
        answer: "שבעה (7) פסלונים"
      - type: multiple_choice
        question: "באיזו סביבה הופיע טנדר הפיצה פלאנט כפסלון עץ מגולף בסרט 'אמיצה' של פיקסאר?"
        options: ["ספינת פיראטים", "בקתת גילוף העץ של המכשפה", "צינוק הטירה", "ספינת ויקינגים"]
        correct: 1
      - type: single_qa
        question: "איזה אולפן אנימציה בריטי מפורסם בעולם בסרטי פלסטלינה כמו 'וולאס וגרומיט' ו-'מרד התרנגולים'?"
        answer: "אולפני ארדמן (Aardman Animations)"
      - type: multiple_choice
        question: "איזה כינוי מלגלג הדביקו ספקנים בהוליווד לפרויקט שלגיה של וולט דיסני במהלך הפקתו?"
        options: ["השיגעון של דיסני (Disney's Folly)", "בור הכסף", "מלכודת המצוירים", "טעות הציור"]
        correct: 0
      - type: single_qa
        question: "מי היה הבמאי החזוני שהקים יחד עם שותפיו את סטודיו ג'יבלי המהולל ביפן?"
        answer: "הייאו מיאזאקי"
      - type: multiple_choice
        question: "כמה ראשי בובה מפוסלים שונים נוצרו עבור ג'ק סקלינגטון בסרט 'הסיוט שלפני חג המולד'?"
        options: ["מעל 400", "50", "12", "1,000"]
        correct: 0
      - type: single_qa
        question: "איזה סרט המשך של פיקסאר משנת 2024 שבר שיאי קופות עולמיים כשחקר רגשות של גיל ההתבגרות?"
        answer: "הקול בראש 2 (Inside Out 2)"
      - type: multiple_choice
        question: "על איזה פריט מופיע הקוד 'A113' בסרט המקורי צעצוע של סיפור?"
        options: ["קופסת החללית של באז", "לוחית הרישוי של רכב אמו של אנדי", "מכונית השלט RC", "משאית הזבל"]
        correct: 1
      - type: single_qa
        question: "על גבי איזה חומר שקוף נהגו אנימטורים מסורתיים לצייר ביד לפני המצאת תוכנות המחשב?"
        answer: "דפי צלולואיד (Cels)"

  - id: disney_classics
    title: "קלאסיקות דיסני: אהובי כל הזמנים"
    description: >
      מהסוואנה המוזהבת של אפריקה ועד ארמונות הקרח המכושפים ומסעות האוקיינוס השקט! 
      חוו מחדש את הגיבורים, עוזריהם הנאמנים והנבלים של סיפורי דיסני האיקוניים.
    cards:
      - title: "מלך האריות (1994)"
        points:
          - "עלילת הסרט מתרחשת בצוק התקווה באפריקה, ומספרת את סיפורו האפי של גור האריות סימבה שיוצא להשיב את ממלכתו."
          - "היריבות המלכותית בין מופאסה, סקאר וסימבה קיבלה השראה עמוקה מהמחזה 'המלט' של שייקספיר."
          - "חבריו הנאמנים של סימבה, טימון הסוריקטה ופומבה חזיר היבלות, הפכו את הביטוי בסוואהילי 'האקונה מטטה' ('אין דאגות') ללהיט."
          - "הסרט הפך לסרט האנימציה המצויר ביד המכניס ביותר בהיסטוריה והיווה השראה למחזמר מצליח בברודוויי."
      - title: "היפה והחיה (1991)"
        points:
          - "עיבוד זה למעשייה הצרפתית עוקב אחר בל שוחרת הספרים, שלומדת להביט מעבר למראה החיצוני ולהתאהב בחיה המכושפת."
          - "צוות הטירה המכושפת כולל חפצי בית אהובים: לומייר הפמוט, שקשוק השעון (קוגסוורת') וגברת תיון."
          - "הסרט עשה היסטוריה כשהיה סרט האנימציה הראשון אי פעם שהיה מועמד לפרס האוסקר לסרט הטוב ביותר."
          - "סצנת הריקוד באולם הנשפים הייתה חלוצה בשילוב דמויות מצוירות ביד עם תנועות מצלמה ממוחשבות בתלת-ממד."
      - title: "אלאדין (1992)"
        points:
          - "מתרחש בעיר המסתורית אגרבה, 'אלאדין' עוקב אחר נער רחוב פיקח המוצא מנורת קסמים ושד ג'יני שנון."
          - "אלאדין מבקש להפוך לנסיך עלי כדי לחזר אחר הנסיכה יסמין, בעזרת קוף המחמד השובב שלו, אבו."
          - "הווזיר המלכותי המרושע ג'פאר והתוכי העוקצני שלו יאגו מנסים לגנוב את המנורה כדי להשתלט על הממלכה."
          - "השיר 'A Whole New World' (עולם חדש) זכה בפרס גראמי לשיר השנה, והוא שיר הדיסני היחיד שזכה בתואר זה."
      - title: "בת הים הקטנה (1989)"
        points:
          - "'בת הים הקטנה' פתח את תקופת 'הרנסאנס של דיסני', עשור של להיטים מוזיקליים ענקיים שזכו לשבחי הביקורת."
          - "אריאל, נסיכת בת ים סקרנית הנמשכת לעולם בני האדם, חולמת ללכת על היבשה כדי להיות עם הנסיך אריק."
          - "היא כורתת עסקה מסוכנת עם מכשפת הים אורסולה, ומוותרת על קולה היפהפה בתמורה לרגליים אנושיות למשך שלושה ימים."
          - "עוזריה המוזיקליים כוללים את סבסטיאן הסרטן הקליפסו, פלאונדר הדג הטרופי וסקאטל השחף."
      - title: "לשבור את הקרח (Frozen - 2013)"
        points:
          - "בהשראת 'מלכת השלג' של הנס כריסטיאן אנדרסן, הסרט מספר את סיפורן של האחיות המלכותיות אלזה ואנה מארנדל."
          - "אלזה נמלטת אל ההרים המושלגים לאחר שקסם הקרח הבלתי נשלט שלה מקפיא בטעות את הממלכה בחורף נצחי."
          - "הסרט הפך את מוסכמות האגדות הקלאסיות כשהתברר ש'מעשה האהבה האמיתית' היה הקשר העמוק בין שתי האחיות."
          - "איש השלג החביב אולף, חובב הקיץ והחיבוקים החמים, סיפק הומור ושמחה שכבשו ילדים ומבוגרים כאחד."
      - title: "מואנה (2016)"
        points:
          - "מתרחש בפולינזיה העתיקה, 'מואנה' עוקב אחר בתו האמיצה של ראש השבט שנבחרה על ידי האוקיינוס להשיב את האיזון לטבע."
          - "היא מפליגה על פני האוקיינוס השקט כדי לאתר את חצי-האל משנה הצורה מאווי ולהחזיר את לבה הזוהר של טה פיטי."
          - "לין-מנואל מירנדה השתתף בכתיבת הפסקול המוזיקלי עטור הפרסים, כולל ההמנון 'How Far I'll Go'."
          - "האנימטורים פיתחו תוכנה מיוחדת כדי לרנדר את מי האוקיינוס כדמות תומכת חיה ובעלת הבעות."
      - title: "זוטרופוליס (Zootopia - 2016)"
        points:
          - "'זוטרופוליס' מתרחש במטרופולין יונקים ענק שבו טורפים ונטרפים חיים יחד ברובעי אקלים מגוונים."
          - "ג'ודי הופס עושה היסטוריה כארנבת הראשונה שמשרתת כשוטרת בעיר, וחוברת לשועל התחבולן הציני ניק ויילד."
          - "השניים חושפים מזימה מסתורית של פרחי 'יללות לילה' הגורמים לחיות טורפות לחזור לטבען הפראי."
          - "הסצנה המצחיקה ביותר מציגה את פלאש ועמיתיו העצלנים המנהלים את משרד הרישוי במהירות איטית להפליא."
      - title: "אנקאנטו (2021)"
        points:
