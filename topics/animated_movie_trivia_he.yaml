        question: "איזה מוזיקאי מפורסם הלחין ושר את שיר הנושא 'You've Got a Friend in Me' בצעצוע של סיפור?"
        options: ["אלטון ג'ון", "פיל קולינס", "רנדי ניומן (Randy Newman)", "אלן מנקן"]
        correct: 2
