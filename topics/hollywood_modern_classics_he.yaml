      סופר-איטי או קפוא.
  - type: multiple_choice
    question: בסרטו של דייוויד פינצ'ר 'מועדון קרב', איזה פריט מסחרי יומיומי החביא הבמאי כמעט בכל סצנה בסרט?
    options:
    - כוס קפה של סטארבקס
    - בקבוק זכוכית של קוקה-קולה
    - נעל ספורט של נייקי
    - פתקית ממו צהובה (Post-it)
    correct: 0
    explanation: דייוויד פינצ'ר שתל כוס קפה של סטארבקס כמעט בכל סצנה כדי להדגיש את הסאטירה על השתלטות תרבות הצריכה על החברה.
  - type: multiple_choice
    question: לאיזה מועדון לילה מפורסם נכנסים הנרי וקארן בשוט הרציף המפורסם בן ה-3 דקות בסרט 'החבר'ה הטובים'?
    options:
