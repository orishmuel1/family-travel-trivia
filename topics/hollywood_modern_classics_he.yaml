id: hollywood_modern_classics_he
title: יצירות המופת של הוליווד המודרנית (משנות ה-90 ועד היום)
description: מסע קולנועי מחשמל בשוברי הקופות וביצירות המופת הגדולות של הוליווד משנות ה-90 ועד היום! בחנו את הידע שלכם בסרטי
  פולחן למבוגרים, מותחנים של טרנטינו ופינצ'ר, חידות פילוסופיות של כריסטופר נולאן, אפוסים של מדע בדיוני, במאים אגדיים וסודות
  ממאחורי הקלעים.
lang: he
audience: adult
categories:
- id: groundbreakers_90s
  title: מהפכת שנות ה-90 וסרטי פולחן (1990–1999)
  description: העשור ששינה לעד את הקולנוע העצמאי, שוברי הקופות והאפקטים החזותיים.
  cards:
  - title: חומות של תקווה (The Shawshank Redemption, 1994)
    points:
    - 'ציון IMDb: 9.3/10 (מדורג במקום הראשון בכל הזמנים ב-IMDb) | בימוי: פרנק דרבונט.'
    - 'שחקנים ודמויות: טים רובינס בתור אנדי דופריין (בנקאי שהורשע לשווא) ומורגן פרימן בתור אליס בויד ''רד'' רדינג (ספק ההברחות
      של הכלא).'
    - 'עלילה ותמות: במשך שני עשורים בכלא שושנק במיין, אנדי שומר על כבוד עצמי, מעורר תקווה באסירים ומוציא לפועל תוכנית בריחה
      גיאולוגית גאונית.'
    - 'אתר צילום: צולם בעיקר בבית הסוהר ההיסטורי של מדינת אוהיו במנספילד.'
    - 'טריוויה ומורשת: למרות אכזבה בקופות בעת יציאתו עקב תחרות מול ''פורסט גאמפ'' ו''ספרות זולה'', הפך ללהיט ענק בהשכרות וידאו
      וליצירת מופת תרבותית.'
  - title: ספרות זולה (Pulp Fiction, 1994)
    points:
    - 'ציון IMDb: 8.9/10 | בימוי ותסריט: קוונטין טרנטינו | זכה בפרס ''דקל הזהב'' בקאן ובאוסקר לתסריט המקורי הטוב ביותר.'
    - 'שחקנים ודמויות: ג''ון טרבולטה (וינסנט וגה), סמואל ל. ג''קסון (ג''ולס וינפילד), אומה תורמן (מיה וואלאס) וברוס ויליס
      (בוץ'' קולידג'').'
    - 'עלילה ותמות: סיפורי פשע לא-ליניאריים שזורים בלוס אנג''לס, העוסקים בגאולה, נאמנות ומקריות, בליווי דיאלוגים מושחזים ופסקול
      סרף-רוק ופאנק מלהיב.'
    - 'אתר צילום: צולם כולו ברחבי לוס אנג''לס וקליפורניה (כולל מסעדת Hawthorne Grill המפורסמת).'
    - 'טריוויה: תכולתה הזוהרת של המזוודה המסתורית של מרסלוס וואלאס (צירוף המנעול: 666) מעולם לא נחשפה בסרט, ועוררה אינספור
      תיאוריות מעריצים.'
  - title: המטריקס (The Matrix, 1999)
    points:
    - 'ציון IMDb: 8.7/10 | תסריט ובימוי: האחיות וצ''אוסקי (לאנה ולילי וצ''אוסקי).'
    - 'שחקנים ודמויות: קיאנו ריבס (ניאו / תומאס אנדרסון), לורנס פישבורן (מורפיוס), קארי-אן מוס (טריניטי) והוגו וויבינג (הסוכן
      סמית'').'
    - 'עלילה ותמות: מותחן סייבר-פאנק דיסטופי שבו האנושות כלואה במציאות מדומה שנוצרה על ידי מכונות תבוניות כדי לשאוב את האנרגיה
      הביו-חשמלית של בני האדם.'
    - 'אתר צילום: צולם באולפנים וברחובות סידני, אוסטרליה, לצורך ניצול מרבי של תקציב ההפקה.'
    - 'טכנולוגיה מהפכנית: פיתח והנחיל את אפקט ה-''Bullet Time'' באמצעות מערך מעגלי של מעל 120 מצלמות סטילס שצילמו במרווחי
      מיקרו-שניות.'
  - title: מועדון קרב (Fight Club, 1999)
    points:
    - 'ציון IMDb: 8.8/10 | בימוי: דייוויד פינצ''ר | עיבוד לספרו של צ''אק פלאניוק.'
    - 'שחקנים ודמויות: אדוארד נורטון בתור המספר המדוכא, בראד פיט בתור יצרן הסבון הכריזמטי טיילר דרדן, והלנה בונהם קרטר בתור
      מרלה סינגר.'
    - 'עלילה ותמות: ביקורת חריפה על תרבות הצריכה, הניכור התאגידי וגבריות רעילה, המתדרדרת לתנועת מחתרת אנרכיסטית להשמדת מערכת
      האשראי.'
    - 'אתר צילום: צולם בעשרות סמטאות ואתרים תעשייתיים בלוס אנג''לס.'
    - 'פרט ויזואלי מבריק: פינצ''ר החביא כוס קפה של סטארבקס כמעט בכל סצנה בודדת בסרט כסמל להשתלטות התאגידית על חיי היומיום.'
  - title: החבר'ה הטובים (Goodfellas, 1990)
    points:
    - 'ציון IMDb: 8.7/10 | בימוי: מרטין סקורסזה | מבוסס על הספר ''Wiseguy'' מאת ניקולס פילאג''י.'
    - 'שחקנים ודמויות: ריי ליוטה (הנרי היל), רוברט דה נירו (ג''ימי קונוויי) וג''ו פשי (טומי דה-ויטו חם המזג, שזכה באוסקר לשחקן
      משנה).'
    - 'עלילה ותמות: עלייתו ונפילתו לאורך שלושה עשורים של שותף משפחת המאפיה לוקזה, הנרי היל, תוך הצגת הפיתוי הנוצץ והפרנויה
      האכזרית של עולם הפשע.'
    - 'שוט קולנועי מיתולוגי: שוט רציף מפורסם בן 3 דקות במצלמת סטדיקאם (Steadicam) העוקב אחר כניסתם של הנרי וקארן למועדון הלילה
      קופקבנה דרך המטבח האחורי.'
    - 'טריוויה: סצנת החקירה המאיימת ''Funny how? Like I''m a clown?'' של ג''ו פשי הייתה אלתור המבוסס על מקרה אמיתי שפשי חווה
      כמלצר צעיר.'
  - title: שתיקת הכבשים (The Silence of the Lambs, 1991)
    points:
    - 'ציון IMDb: 8.6/10 | בימוי: ג''ונתן דמי | מבוסס על ספרו של תומאס האריס.'
    - 'שחקנים ודמויות: ג''ודי פוסטר בתור חניכת ה-FBI קלריס סטרלינג, ואנתוני הופקינס בתור הפסיכיאטר הקניבל המבריק ד״ר חניבעל
      לקטר.'
    - 'עלילה ותמות: קלריס נאלצת לחקור את מוחו המצמרר של לקטר הכלוא מאחורי זכוכית כדי לפענח את זהותו של הרוצח הסדרתי הפעיל
      ''באפלו ביל''.'
    - 'אתר צילום: צולם בעיקר בפיטסבורג, פנסילבניה ובבית הסוהר המערבי של המדינה.'
    - 'הישג היסטורי: אחד משלושה סרטים בלבד בתולדות האוסקר שגרפו את ''חמשת הגדולים'' (סרט, במאי, שחקן, שחקנית ותסריט מעובד),
      כאשר הופקינס מופיע על המסך כ-16 דקות בלבד.'
  trivia:
  - type: multiple_choice
