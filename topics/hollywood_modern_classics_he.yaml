    question: איזה שחקן גילם את לואיס שטראוס, יושב ראש הוועדה לאנרגיה אטומית, בסרט 'אופנהיימר' וזכה באוסקר לשחקן המשנה?
    options:
    - רוברט דאוני ג'וניור
    - מאט דיימון
    - קנת בראנה
    - ג'וש הארטנט
    correct: 0
    explanation: רוברט דאוני ג'וניור זכה בפרס האוסקר הראשון בקריירה שלו על הופעתו המבריקה והמאופקת כיו״ר הוועדה לואיס שטראוס.
  - type: multiple_choice
    question: איזה עמק מדברי מפורסם בירדן שימש כאתר הצילומים המרכזי של כוכב הלכת אראקיס בסרטי 'חולית'?
    options:
    - ואדי רם
    - עמק המוות
    - מדבר אטקמה
    - דיונות סהרה במרזוגה
    correct: 0
    explanation: דני וילנב צילם את הנופים המדבריים ומצוקי אבן החול של אראקיס בואדי רם בירדן ('בקעת הירח').
  - type: multiple_choice
    question: איזו נקודת מבט חזותית בהשראת משחקי וידאו שימשה בסצנת הירי הרציפה בדירה הפריזאית ב'ג'ון וויק 4'?
    options:
    - מבט-על מלמעלה (Top-down bird's-eye view)
    - מבט מגוף ראשון (First-person shooter)
    - מבט צדדי של משחק פלטפורמה (Side-scroller)
    - מבט מגוף שלישי מעבר לכתף
    correct: 0
    explanation: הבמאי צ'אד סטהלסקי השתמש במצלמת מנוף שצילמה מעל תקרות החדרים בשוט רציף מלמעלה, בהשראת משחקי ירי כמו 'The
      Hong Kong Massacre'.
  - type: multiple_choice
    question: כמה פרסי אוסקר גרף הסרט 'הכול בכל מקום בבת אחת' בטקס האוסקר ה-95, כולל הסרט הטוב ביותר ו-3 פרסי משחק?
    options:
    - 7 פרסי אוסקר
    - 4 פרסי אוסקר
    - 10 פרסי אוסקר
    - 12 פרסי אוסקר
    correct: 0
    explanation: 'הסרט גרף 7 פרסי אוסקר מרכזיים: הסרט הטוב ביותר, בימוי, שחקנית ראשית (מישל יאו), שחקן משנה (קי הוי קוואן),
      שחקנית משנה (ג''יימי לי קרטיס), תסריט מקורי ועריכה.'
  - type: multiple_choice
    question: איזה במאי ביים הן את 'בלייד ראנר 2049' והן את שני חלקי 'חולית' (Dune Part 1 & 2)?
    options:
    - דני וילנב
    - כריסטופר נולאן
    - רידלי סקוט
    - ג'ורג' מילר
    correct: 0
    explanation: הבמאי הקנדי דני וילנב חתום על שתיים מיצירות המדע הבדיוני הוויזואליות והמוערכות ביותר של המאה ה-21.
- id: directors_twists_lore
  title: במאים אגדיים, טוויסטים מטורפים וסודות מאחורי הקלעים
  description: האלתורים המפורסמים, סגנונות הבימוי הייחודיים והסופים המפתיעים ששינו את תולדות הקולנוע.
  cards:
  - title: 'כריסטופר נולאן וקוונטין טרנטינו: חותמת הבמאים הגדולים'
    points:
    - 'כריסטופר נולאן: תומך נלהב בפילם 70 מ״מ, שימוש באפקטים מעשיים בלבד ללא מחשב (התרסקות מטוס בואינג אמיתי, בניית סטים מסתובבים
      ענקיים) ומבנים נרטיביים מורכבים ולא ליניאריים.'
    - 'קוונטין טרנטינו: ידוע בדיאלוגים מושחזים ומהירים מתרבות הפופ, חלוקה לפרקים, מחוות אנציקלופדיות לקלאסיקות, פסקולים אקלקטיים
      וסופי היסטוריה אלטרנטיבית נועזים.'
    - 'דייוויד פינצ''ר: פרפקציוניזם דיגיטלי קיצוני, הדורש לעיתים קרובות 50 עד מעל 100 טייקים לכל שוט בודד כדי לפרק את מניירות
      המשחק המלאכותיות של השחקנים.'
    - 'מרטין סקורסזה: תנועות מצלמה קינטיות מהירות, הקפאות פריים (Freeze Frames), קריינות קולית ושותפויות עבודה ארוכות שנים
      עם רוברט דה נירו ולאונרדו דיקפריו.'
  - title: אלתורים ופציעות אמיתיות שנכנסו לקולנוע
    points:
    - 'ג''אנגו ללא מעצורים (Django Unchained, 2012): לאונרדו דיקפריו הטיח בטעות את ידו בכוס זכוכית שרוסקה וחתכה את כף ידו.
      הוא נשאר בדמות והמשיך במונולוג המאיים כשידו שותתת דם על השולחן.'
    - 'האביר האפל (The Dark Knight, 2008): מחיאות הכפיים הסרקסטיות והאיטיות של הית'' לדג''ר (הג''וקר) בתא המעצר בעת קידומו
      של ג''ים גורדון היו אלתור מוחלט על הסט.'
    - 'הזאב מוול סטריט (The Wolf of Wall Street, 2013): התיפוף הקצבי על החזה והזמזום של מת''יו מקונוהיי היה טקס החימום האישי
      שלו לפני צילום; דיקפריו הציע לסקורסזה להכניס זאת ישירות לסצנה.'
    - 'שר הטבעות: שני הצריחים (2002): כאשר אראגורן בועט בקסדת אורוק-האי מזעם, ויגו מורטנסן שבר שתי בהונות ברגלו; זעקת הכאב
      האמיתית שלו נשמרה בגרסה הסופית של הסרט.'
  - title: הטוויסטים העלילתיים הגדולים של הקולנוע המודרני
    points:
    - 'החוש השישי (The Sixth Sense, 1999): פסיכולוג הילדים מלקולם קרואו (ברוס ויליס) מגלה בסיום הסרט שהוא עצמו היה רוח רפאים
      לאורך כל העלילה.'
    - 'יוקרה (The Prestige, 2006): הקוסם אלפרד בורדן (כריסטיאן בייל) חושף כי הוא למעשה זוג תאומים זהים החיים זהות אחת משותפת,
      בעוד שרוברט אנג''ייר (יו ג''קמן) שכפל והטביע את עצמו בכל לילה.'
    - 'שאטר איילנד (Shutter Island, 2010): המרשל טדי דניאלס (לאונרדו דיקפריו) מגלה כי הוא בעצם אנדרו לאדיס – מטופל פסיכיאטרי
      מסוכן הלוקח חלק בטיפול מורכב של משחק תפקידים.'
    - 'ממנטו (Memento, 2000): לאונרד שלבי (גאי פירס) מגלה שהוא מנצל במודע את איבוד הזיכרון לטווח קצר שלו כדי לייצר מסע נקמה
      נצחי כנגד אנשים שלא רצחו את אשתו.'
  trivia:
  - type: multiple_choice
    question: בסרט 'ג'אנגו ללא מעצורים' (2012), איזו פציעה אמיתית התרחשה במהלך המונולוג הזועם של לאונרדו דיקפריו?
    options:
    - דיקפריו חתך את כף ידו בכוס זכוכית שבורה והמשיך לשחק כשידו מדממת
    - ג'יימי פוקס פרק את כתפו במהלך שליפת אקדח מהירה
    - כריסטוף ואלץ סדק את קרסולו בנפילה מסוס
    - סמואל ל. ג'קסון נכווה בידו ממוט ברזל לוהט
    correct: 0
    explanation: דיקפריו ניפץ כוס קריסטל על השולחן בלהט הרגע וחתך את כף ידו, אך המשיך את המונולוג המהפנט בלי לעצור את הטייק.
  - type: multiple_choice
    question: איזה טקס חימום אישי של מת'יו מקונוהיי שולב בסצנת המסעדה המפורסמת ב'הזאב מוול סטריט'?
    options:
    - תיפוף קצבי באגרוף על החזה וזמזום מונוטוני
    - ביצוע שכיבות סמיכה מהירות תוך ציטוט מניות
    - הקשת אצבעות במקצב ג'אז מהיר
    - שתיית אספרסו כפול תוך בהייה בלתי-ממצמצת במראה
    correct: 0
    explanation: מקונוהיי נוהג לתופף על חזהו כדי להרפות את מיתרי הקול לפני צילומים; דיקפריו הבחין בכך ושכנע את סקורסזה לכלול
      זאת בסצנה.
  - type: multiple_choice
    question: בסרט 'יוקרה' (The Prestige, 2006), כיצד מבצע הקוסם אלפרד בורדן (כריסטיאן בייל) את קסם הטלפורטציה המושלם שלו?
    options:
    - הוא למעשה זוג אחים תאומים זהים החולקים חיים שלמים בזהות אחת
    - הוא משתמש במכונת שכפול קוונטית שנבנתה על ידי ניקולה טסלה
    - הוא מעסיק כפיל אלכוהוליסט זהה בשם ג'ראלד רוט
    - הוא נעזר בדלתות מלכודת תת-קרקעיות ומערך מראות מסונכרן
    correct: 0
    explanation: אלפרד ופאלון הם אחים תאומים זהים שהקריבו את חייהם האישיים וחלקו זהות אחת כדי להוציא לפועל את האשליה המושלמת.
  - type: multiple_choice
    question: מהו הגילוי הדרמטי המרעיש בסיום הסרט 'שאטר איילנד' לגבי המרשל טדי דניאלס (לאונרדו דיקפריו)?
    options:
    - הוא בעצמו מטופל בבית החולים הפסיכיאטרי (אנדרו לאדיס) השרוי בהזיה
    - הוא נשכר בסתר על ידי ה-FBI להתנקש במנהל המוסד
    - הוא סוכן ריגול זר המנסה לגנוב נוסחאות לשליטה מוחית
    - הוא חלם את כל האי בעת שהיה לכוד בסופת שלגים בבוסטון
    correct: 0
    explanation: טדי דניאלס מתגלה כאנדרו לאדיס, המטופל המסוכן ביותר באי, והחקירה כולה הייתה תרפיית משחק תפקידים מבוקרת שיזמו
      רופאיו.
  - type: multiple_choice
    question: 'איזו פציעה ספג ויגו מורטנסן כאשר בעט בקסדת הפלדה בסרט ''שר הטבעות: שני הצריחים''?'
    options:
    - הוא שבר שתי בהונות ברגלו
    - הוא נקע את קרסולו
    - הוא סדק את פיקת הברך
    - הוא קרע את גיד אכילס
    correct: 0
    explanation: מורטנסן בעט בקסדת הפלדה הכבדה בטייק החמישי ושבר שתי בהונות ברגלו; זעקת הכאב האותנטית שלו נותרה בסרט.
  - type: multiple_choice
    question: איזה במאי הוליוודי מפורסם בפרפקציוניזם קיצוני ודרישה לעשרות רבות של טייקים (לעיתים מעל 80) לכל סצנה?
    options:
    - דייוויד פינצ'ר
    - קוונטין טרנטינו
    - סטיבן ספילברג
    - קלינט איסטווד
    correct: 0
    explanation: דייוויד פינצ'ר ידוע בדרישתו ל-50 עד 100 טייקים לסצנות כדי להביא שחקנים לביצועים טבעיים ונטולי גינונים.
  - type: multiple_choice
    question: בסרטו המהפכני של כריסטופר נולאן 'ממנטו' (2000), מאיזו תופעה רפואית סובל הגיבור לאונרד שלבי?
    options:
    - אמנזיה אנטרוגרדית (חוסר יכולת לייצר זיכרונות חדשים לטווח קצר)
    - הפרעת זהות דיסוציאטיבית
    - אמנזיה רטרוגרדית (מחיקת כל זיכרונות הילדות)
    - פרוסופגנוזיה (עיוורון לזיהוי פרצופים)
    correct: 0
    explanation: לאונרד סובל מאמנזיה אנטרוגרדית עקב פגיעת ראש, ונאלץ להיעזר בתמונות פולארויד, פתקים וקעקועים כדי לחקור את
      רצח אשתו.
  - type: multiple_choice
    question: איזו תגובה מצמררת ומפורסמת אלתר הית' לדג'ר (הג'וקר) בעת שישב כלוא בתא המעצר ב'האביר האפל'?
    options:
    - מחיאות כפיים איטיות וסרקסטיות בעת קידומו של גורדון למפקח
    - ליקוק איטי של שפתיו תוך לחישת שיר ילדים
    - חבטת ראשו בסורגי הברזל במקצב קבוע
    - איזון קלף ג'וקר על קצה נעלו
    correct: 0
    explanation: כאשר השוטרים החלו למחוא כפיים לרגל קידומו של ג'ים גורדון, לדג'ר החל באלתור מבריק למחוא כפיים באיטיות ובלעג
      מהפנט.
  - type: multiple_choice
    question: איזה טוויסט מפורסם היכה את הצופים בהלם בסרטו של מ. נייט שאמלאן 'החוש השישי' (1999)?
    options:
    - ד״ר מלקולם קרואו (ברוס ויליס) היה מת לאורך כל הסרט
    - הילד קול למעשה דמיין את כל רוחות הרפאים
    - אמו של קול הייתה זו שהרעילה את ילדי העיירה
    - רוחות הרפאים היו יצורים פיזיים מממד מקביל
    correct: 0
    explanation: פסיכולוג הילדים מלקולם קרואו מגלה ברגע השיא כי הוא נרצח כבר בתחילת הסרט והוא למעשה רוח רפאים שרק קול מסוגל
      לראות.
  - type: multiple_choice
    question: איזה שחקן כיכב בתפקידים ראשיים איקוניים הן בסרטיו של מרטין סקורסזה ('הזאב מוול סטריט', 'השתולים') והן בסרטיו
      של קוונטין טרנטינו ('ג'אנגו ללא מעצורים', 'היו זמנים בהוליווד')?
    options:
    - לאונרדו דיקפריו
    - בראד פיט
    - רוברט דה נירו
    - כריסטיאן בייל
    correct: 0
    explanation: לאונרדו דיקפריו כיכב בשורה של יצירות מופת מובילות הן אצל מרטין סקורסזה והן אצל קוונטין טרנטינו.
