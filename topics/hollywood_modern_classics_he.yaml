  - type: multiple_choice
    question: איזו טכניקת צילום חזותית מהפכנית הומצאה והתפרסמה בעולם בזכות הסרט 'המטריקס' (1999)?
    options:
    - זמן קליע (Bullet Time)
    - לכידת תנועה דיגיטלית (Deepfake Mocap)
