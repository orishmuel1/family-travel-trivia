    - מועדון הכותנה (The Cotton Club)
    - טרופיקנה (The Tropicana)
    correct: 0
    explanation: השוט המפורסם והבלתי-חתוך במצלמת סטדיקאם מציג את כניסתם דרך המטבח האחורי ישירות למועדון הקופקבנה היוקרתי.
  - type: multiple_choice
    question: אנתוני הופקינס זכה באוסקר לשחקן הטוב ביותר על תפקידו ב'שתיקת הכבשים' למרות שהופיע על המסך במשך כמה זמן בסך הכל?
    options:
    - כ-16 דקות בלבד
    - כ-42 דקות
    - כ-65 דקות
    - כ-85 דקות
    correct: 0
    explanation: הופקינס מופיע בסרט כ-16 דקות בלבד (פחות מ-15% מזמן הריצה הכולל), בהופעה מהפנטת שנחרטה בהיסטוריה הקולנועית.
  - type: multiple_choice
    question: איזה שחקן גילם את הגנגסטר חם המזג טומי דה-ויטו ב'החבר'ה הטובים' וזכה באוסקר לשחקן המשנה?
    options:
