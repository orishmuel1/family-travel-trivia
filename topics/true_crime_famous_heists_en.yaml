id: true_crime_famous_heists_en
title: True Crime & Famous Heists
description: >
  Step into the shadows of criminal history! From masterminded diamond vault break-ins 
  and audacious art heists to cryptic unsolved serial cases, notorious Prohibition mobsters, 
  and legendary con artists, explore the most compelling true crime cases ever recorded.
lang: en
audience: adult
categories:
  - id: important_facts
    title: Important Facts
    description: >
      Pioneering forensic breakthroughs, investigative psychology, and landmark criminological history. 
      Read these cards together aloud before testing your knowledge in the trivia round!
    cards:
      - title: The Birth of Forensic Science
        points:
          - "In 1892, Argentinian police official Juan Vucetich made history by using bloody fingerprints to solve a murder, creating the first forensic fingerprint bureau."
          - "Sir Arthur Conan Doyle's fictional detective Sherlock Holmes popularized forensic ballistics, handwriting analysis, and footprint casting before police forces adopted them."
          - "Dr. Edmond Locard established the fundamental forensic tenet known as 'Locard's Exchange Principle': 'Every contact leaves a trace'."
          - "Early investigators relied on the Bertillon system, a complex set of 11 physical body measurements, before fingerprinting proved far more reliable."
      - title: DNA Profiling & Genetic Genealogy
        points:
          - "British geneticist Sir Alec Jeffreys invented DNA fingerprinting in 1984, first used to solve the Colin Pitchfork murders in 1986."
          - "In 2018, police captured the infamous 'Golden State Killer' (Joseph James DeAngelo) after decades using investigative genetic genealogy via public database GEDmatch."
          - "Modern touch-DNA techniques can extract complete genetic profiles from just a few skin cells left on a door handle or glass."
          - "The FBI's national DNA database (CODIS) contains over 20 million offender and crime scene profiles, solving hundreds of thousands of cold cases."
      - title: The Origins of Scotland Yard & The FBI
        points:
          - "London's Metropolitan Police Service was founded in 1829 by Sir Robert Peel, with officers nicknamed 'Bobbies' and headquarters at 'Scotland Yard'."
          - "The US Federal Bureau of Investigation (FBI) was established in 1908 and dramatically expanded under J. Edgar Hoover during the Prohibition gangster era."
          - "The FBI's 'Ten Most Wanted Fugitives' list was launched in 1950 after a reporter asked for names of the 'toughest guys' the bureau was hunting."
          - "Over 90% of criminals featured on the Top Ten Most Wanted list have been successfully captured or located."
      - title: Criminal Profiling & The BAU
        points:
          - "The FBI's Behavioral Analysis Unit (BAU) was pioneered in the late 1970s by agents John Douglas and Robert Ressler in Quantico, Virginia."
          - "Agents conducted extensive in-depth prison interviews with convicted serial killers, including Ted Bundy, Charles Manson, and Ed Kemper."
          - "Profiling analyzes crime scene evidence, victimology, and behavior to deduce an offender's psychological traits, habits, and likely demographics."
          - "Ressler coined the term 'serial killer' to describe murderers who kill across multiple events with cooling-off periods."
      - title: The Science of Bloodstain Pattern Analysis
        points:
          - "Bloodstain pattern analysis (BPA) uses physics and fluid dynamics to reconstruct the position, movement, and weapon used during violent crimes."
          - "Luminol, a chemical discovered in 1928, produces a glowing blue chemiluminescence when reacting with iron in hemoglobin, even on bleached surfaces."
          - "High-velocity spatter patterns (fine mists) typically indicate gunshot trauma, while cast-off patterns reveal swings from blunt weapons."
          - "Modern forensic laboratories use laser trajectory rods and 3D digital photogrammetry to map entire crime scenes with millimeter precision."
      - title: Interpol & The Red Notice System
        points:
          - "Founded in 1923 and headquartered in Lyon, France, Interpol (International Criminal Police Organization) connects police forces across 196 member countries."
          - "An Interpol 'Red Notice' is not an international arrest warrant, but a global alert requesting law enforcement worldwide to locate and arrest a fugitive pending extradition."
          - "Interpol manages global databases tracking stolen art, stolen passports, fingerprint records, and transnational organized crime networks."
          - "The organization operates 24/7 communications channels to coordinate cross-border counter-terrorism and anti-human trafficking operations."
      - title: The Criminal Code of Silence (Omertà)
        points:
          - "Originating in southern Italy, 'Omertà' is the strict code of silence that forbids members of organized crime from cooperating with authorities."
          - "Breaking Omertà was historically punished by the Mafia with swift execution of the informant and their family members."
          - "The code held strong in America until Joe Valachi publicly testified before the US Senate in 1963, exposing the existence of 'La Cosa Nostra'."
          - "The US RICO Act (Racketeer Influenced and Corrupt Organizations Act) of 1970 revolutionized prosecuting mob bosses for crimes committed by subordinates."
      - title: Flawed Forensics & The Innocence Project
        points:
          - "Founded in 1992 by Barry Scheck and Peter Neufeld, The Innocence Project has exonerated over 375 wrongfully convicted people in the US using post-conviction DNA."
          - "Studies revealed that eyewitness misidentification is the single greatest contributing factor in over 70% of wrongful convictions overturned by DNA."
          - "Previously trusted forensic methods like bite-mark analysis, microscopic hair comparison, and arson burn pattern analysis have faced severe scientific scrutiny."
          - "Modern criminal justice reforms emphasize double-blind photo lineups, recorded interrogations, and strict scientific validation standards."
    trivia:
      - type: multiple_choice
        question: "Who invented DNA profiling in 1984, forever revolutionizing forensic criminal investigations?"
        options: ["Francis Crick", "Sir Alec Jeffreys", "Alexander Fleming", "Robert Koch"]
        correct: 1
      - type: single_qa
        question: "What fundamental forensic rule states that 'every contact leaves a trace'?"
        answer: "Locard's Exchange Principle"
      - type: multiple_choice
        question: "What chemical produces a glowing blue chemiluminescence when reacting with iron in bloodstains?"
        options: ["Hydrogen peroxide", "Luminol", "Formaldehyde", "Ethanol"]
        correct: 1
      - type: single_qa
        question: "What infamous serial killer was captured in 2018 after decades through investigative genetic genealogy?"
        answer: "The Golden State Killer (Joseph James DeAngelo)"
      - type: multiple_choice
        question: "What British politician established London's Metropolitan Police in 1829, giving officers the nickname 'Bobbies'?"
        options: ["Winston Churchill", "Sir Robert Peel", "Benjamin Disraeli", "William Gladstone"]
        correct: 1
      - type: single_qa
        question: "What is the name of the FBI's specialized profiling division based in Quantico, Virginia?"
        answer: "Behavioral Analysis Unit (BAU)"
      - type: multiple_choice
        question: "What color notice does Interpol issue to alert global police to locate and arrest a fugitive pending extradition?"
        options: ["Blue Notice", "Red Notice", "Yellow Notice", "Black Notice"]
        correct: 1
      - type: single_qa
        question: "What traditional Italian Mafia code of silence forbids members from cooperating with police under penalty of death?"
        answer: "Omertà"
      - type: multiple_choice
