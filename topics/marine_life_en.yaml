- id: dolphins_seals_mammals
  title: Dolphins, Seals & Marine Mammals
  description: 'Discover the remarkable intelligence and charm of marine mammals! From clever bottlenose
    dolphins  and apex orcas to tool-using sea otters and gentle manatees.

    '
  cards:
  - title: 'Killer Whales (Orcas): The Ocean''s Apex Pack'
    points:
    - Despite their common name 'Killer Whale', Orcas are actually the largest members of the oceanic
      dolphin family (Delphinidae).
    - Orcas have no natural predators in the ocean, making them true apex predators.
    - Different orca pods have distinct dialects, hunting techniques, and cultures passed down across
      matriarchal generations.
    - Some pods hunt great white sharks by targeting their nutrient-rich livers, while others beach themselves
      intentionally to catch seals.
  - title: Bottlenose Dolphins & High Intelligence
    points:
    - Bottlenose dolphins use 'signature whistles'—unique acoustic names used to identify and call specific
      individuals.
    - 'They practice unihemispheric slow-wave sleep: sleeping with only one half of their brain at a time
      while keeping the opposite eye open to breathe and watch for predators.'
    - Dolphins pass the mirror self-recognition test, demonstrating advanced self-awareness alongside
      great apes and elephants.
    - They have been observed using sea sponges as protective tools over their snouts when foraging on
      rocky seafloors.
  - title: 'Sea Otters: Tool Users of the Kelp Forest'
    points:
    - Sea otters have the densest fur of any animal on Earth, with up to one million hairs per square
      inch and no blubber layer.
    - They keep a favorite rock tucked in a loose pouch of skin under their forearm to crack open hard
      clams, crabs, and sea urchins.
    - Sea otters wrap themselves in giant kelp while sleeping and hold paws with their mates so they do
      not drift away with ocean currents.
    - As a keystone species, they protect kelp forests from being overgrazed by sea urchins.
  - title: 'Manatees & Dugongs: Gentle Sea Cows'
    points:
    - Manatees are peaceful, slow-moving aquatic herbivores related more closely to modern elephants and
      hyraxes than to whales.
    - They graze on seagrass for up to 8 hours a day, consuming up to 10-15% of their body weight daily.
    - Manatees replace their molar teeth continuously throughout life, marching new teeth forward as old
      ones wear down from sandy seagrass.
  - title: Seals vs. Sea Lions & Walruses
    points:
    - True seals (Phocidae) lack external ear flaps and crawl on land using their bellies, while Sea Lions
      (Otariidae) have visible ear flaps and can walk on all fours using rotating rear flippers.
    - Walruses have enormous tusks (canines) used for hauling their heavy bodies onto ice floes, defending
      territory, and breaking breathing holes.
    - 'Walrus skin can change color depending on temperature: turning pale pink when warm (blood circulating
      near surface) and grayish-white when in freezing water.'
  trivia:
  - type: multiple_choice
    question: To which taxonomic family do Killer Whales (Orcas) actually belong?
    options:
    - Oceanic dolphins (Delphinidae)
    - Baleen whales (Balaenopteridae)
    - Sperm whales (Physeteridae)
    - Porpoises (Phocoenidae)
    correct: 0
    explanation: Despite their common name 'Killer Whale', Orcas are actually the largest members of the
      oceanic dolphin family (Delphinidae).
  - type: multiple_choice
    question: How do dolphins sleep safely without drowning or being ambushed by predators?
    options:
    - Unihemispheric sleep (one brain hemisphere sleeps while the other stays awake)
    - They enter a complete 10-hour coma at the ocean bottom
    - They only sleep during high noon when the sun is brightest
    - They never sleep at any point during their lifetime
    correct: 0
    explanation: 'They practice unihemispheric slow-wave sleep: sleeping with only one half of their brain
      at a time while keeping the opposite eye open to breathe and watch for predators.'
  - type: multiple_choice
    question: What unique natural insulation keeps sea otters warm without having a thick layer of blubber?
    options:
    - The densest fur of any animal (up to a million hairs per square inch)
    - A layer of volcanic heat-absorbing scales
    - A waterproof internal oil furnace organ
    - Constantly shivering at 200 vibrations per minute
    correct: 0
    explanation: Sea otters have the densest fur of any animal on Earth, with up to one million hairs
      per square inch and no blubber layer.
  - type: multiple_choice
    question: What terrestrial mammal is the closest living land relative of the manatee?
