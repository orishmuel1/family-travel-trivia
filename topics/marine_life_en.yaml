  - type: multiple_choice
    question: What material makes up the entire skeletal structure of sharks and rays?
    options:
    - Cartilage (lightweight and flexible)
    - Dense calcium bone
    - Chitinous exoskeleton
    - Spongy mineralized keratin
    correct: 0
    explanation: Sharks' skeleton is made entirely of lightweight, flexible cartilage rather than rigid
      bone.
  - type: multiple_choice
    question: Which species holds the title of the largest living fish in the world?
    options:
    - Whale Shark
    - Great White Shark
    - Basking Shark
    - Giant Oarfish
    correct: 0
    explanation: The Whale Shark is the largest living fish species in the world, growing up to 18 meters
      (60 feet) in length.
  - type: multiple_choice
    question: How do scientists uniquely identify individual whale sharks in the wild?
    options:
    - By their unique pattern of white spots using star-mapping algorithms
    - By the number of serrations on their tail fin
