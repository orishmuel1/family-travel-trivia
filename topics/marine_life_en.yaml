id: marine_life_en
title: Marine Life & Ocean Wonders
description: 'Dive deep into the mesmerizing world beneath the waves! Explore majestic whales, playful
  dolphins,  cunning apex predators, vibrant coral reefs, and the alien wonders of the dark abyss.

  '
lang: en
audience: family
categories:
- id: whales_giants_deep
  title: Whales & Giants of the Deep
  description: 'Encounter the gentle titans of the ocean! Discover the immense Blue Whale, complex humpback
    songs,  deep-diving sperm whales, and legendary creatures of the open sea.

    '
  cards:
  - title: 'The Blue Whale: Largest Animal on Earth'
    points:
    - The Blue Whale is the largest animal ever known to have lived on Earth, even bigger than the largest
      dinosaur.
    - They can reach lengths of up to 30 meters (100 feet) and weigh up to 200 metric tons.
    - A blue whale's heart alone is roughly the size of a small car (such as a Volkswagen Beetle) and
      weighs around 180 kg (400 lbs).
    - Despite their immense bulk, their diet consists almost exclusively of tiny shrimp-like crustaceans
      called krill, consuming up to 4 tons per day.
    - A newborn blue whale calf weighs around 3 tons and gains about 90 kg (200 lbs) every single day
      just by nursing.
  - title: Humpback Whales & Their Complex Songs
    points:
    - Male humpback whales compose complex, haunting 'songs' that can last up to 30 minutes and repeat
      for hours across ocean basins.
    - All males in the same oceanic population sing the same evolving song, which gradually changes and
      updates from year to year.
    - Humpbacks are famous for acrobatic breaching, leaping entirely out of the water to communicate,
      dislodge parasites, or play.
    - They employ a cooperative feeding strategy called 'bubble-net feeding', blowing rings of bubbles
      to corral schools of fish.
  - title: 'Sperm Whales: Champions of the Abyss'
    points:
    - The Sperm Whale has the largest brain of any creature known in history, weighing up to 9 kilograms
      (20 lbs).
    - They can dive to extreme depths exceeding 2,000 meters (6,500 feet) and hold their breath for up
      to 90 minutes.
    - They use powerful echolocation clicks—the loudest sound produced by any animal on Earth (over 230
      decibels underwater).
    - Their massive head contains a reservoir of spermaceti oil, which aids in buoyancy control and sound
      focusing.
    - Their primary prey in the ink-black depths are giant squids and colossal squids.
  - title: 'Narwhals: The Unicorns of the Sea'
    points:
    - The narwhal is an Arctic whale famous for the long, spiral tusk protruding from the upper lip of
      males.
    - This iconic 'horn' is actually an elongated canine tooth that can grow up to 3 meters (10 feet)
      long.
    - The tusk contains millions of sensory nerve endings, allowing the whale to detect changes in water
      temperature, salinity, and pressure.
    - Medieval traders often sold narwhal tusks to European royalty as genuine horns of mythical unicorns.
  - title: Baleen vs. Toothed Whales
    points:
    - 'Cetaceans are divided into two main suborders: Mysticeti (baleen whales) and Odontoceti (toothed
      whales).'
    - Baleen plates are made of keratin (the same protein as human fingernails and hair) and act as giant
      strainers.
    - Baleen whales (like Blue, Humpback, and Right whales) have two blowholes, whereas toothed whales
      (like Orcas and Sperm whales) have only one.
  trivia:
