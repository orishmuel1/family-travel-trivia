- id: apex_sharks_rays
  title: 'Apex Predators: Sharks & Rays'
  description: 'Explore the fascinating biology and sensory superpowers of elasmobranchs! From Great White
    precision  and Hammerhead 360-degree vision to gentle Whale Sharks and graceful Manta Rays.

    '
  cards:
  - title: 'Shark Senses: The Ampullae of Lorenzini'
    points:
    - Sharks have a sixth sense powered by special electroreceptor pores called the 'Ampullae of Lorenzini'.
    - These gel-filled pores around their snout can detect tiny electrical fields generated by the muscle
      contractions and heartbeats of buried prey.
    - They can also sense Earth's geomagnetic field, serving as an internal compass for long-distance
      migrations.
    - Sharks' skeleton is made entirely of lightweight, flexible cartilage rather than rigid bone.
  - title: The Great White Shark & Ocean Hunters
    points:
    - Great Whites are warm-bodied (endothermic) fish; they can keep their stomach and muscles warmer
      than surrounding cold water.
    - They can lose and replace thousands of teeth throughout their lifetime, with rows of backup teeth
      rotating into position like a conveyor belt.
    - Great whites can accelerate up to 40 km/h (25 mph) and launch completely into the air ('breaching')
      when ambushing seals from below.
  - title: 'Hammerhead Sharks: 360-Degree Vision'
    points:
    - The wide, flattened head of a hammerhead is called a 'cephalofoil'.
    - Having eyes mounted on opposite ends of the cephalofoil gives hammerheads exceptional 360-degree
      vertical vision and binocular depth perception.
    - The wide surface area also houses a massive number of electroreceptors, turning their head into
      a metal detector scanning the sandy seafloor for buried stingrays.
  - title: 'Whale Sharks: The Gentle Giants'
    points:
    - The Whale Shark is the largest living fish species in the world, growing up to 18 meters (60 feet)
      in length.
    - Despite having over 3,000 tiny teeth, they are completely harmless filter feeders that gulp plankton,
      fish eggs, and small fish.
    - Each whale shark has a completely unique pattern of white spots and stripes on its dark skin, like
      a human fingerprint.
    - Scientists use NASA star-mapping algorithms to identify individual whale sharks from photographs
      of their spot patterns.
  - title: Manta Rays & Electric Rays
    points:
    - Manta rays have the largest brain-to-body weight ratio of all fish and exhibit high curiosity and
      social intelligence.
    - Unlike stingrays, oceanic manta rays have no venomous tail barb and are harmless plankton feeders
      with wingspans up to 7 meters (23 feet).
    - Electric rays (torpedo rays) can generate stunning electric discharges of up to 220 volts from specialized
      kidney-shaped electric organs to stun prey or defend against predators.
  trivia:
  - type: multiple_choice
    question: What is the primary function of the 'Ampullae of Lorenzini' pores found on a shark's head?
    options:
    - Detecting electrical fields produced by prey and magnetic fields
    - Filtering salt out of drinking seawater
