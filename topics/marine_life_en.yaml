- id: coral_reefs_camouflage
  title: Coral Reefs & Master Camouflage
  description: 'Step into the bustling rainforests of the sea! Unravel the symbiotic secrets of corals,  the
    shapeshifting genius of octopuses and cuttlefish, and the strange biology of seahorses.

    '
  cards:
  - title: 'Corals: Animals, Not Plants or Rocks'
    points:
    - Corals are colonial marine invertebrates made of thousands of tiny soft-bodied animals called polyps.
    - They secrete hard calcium carbonate exoskeletons that accumulate over millennia to build coral reefs.
    - Corals share a vital mutualistic symbiosis with microscopic algae called zooxanthellae that live
      inside their tissues, supplying up to 90% of their energy via photosynthesis.
    - Coral bleaching occurs when rising water temperatures stress corals, causing them to expel their
      colorful zooxanthellae and turn bone white.
  - title: 'Octopuses: The Shapeshifting Invertebrates'
    points:
    - Octopuses have three hearts and blue blood powered by copper-based hemocyanin rather than iron-based
      hemoglobin.
    - Two-thirds of an octopus's neurons are located in its eight arms, allowing each arm to explore,
      taste, and make decisions semi-autonomously.
    - They can change color and skin texture in less than 200 milliseconds using specialized skin cells
      called chromatophores, iridophores, and papillae.
    - The Mimic Octopus (Thaumoctopus mimicus) can actively impersonate up to 15 different venomous sea
      creatures, including lionfish, sea snakes, and flatfish.
  - title: 'Cuttlefish: Kings of Dynamic Color'
    points:
    - Cuttlefish possess a unique internal porous shell called a 'cuttlebone' filled with gas and liquid
      to regulate buoyancy.
    - They have W-shaped pupils that give them an expansive field of view and the ability to detect polarized
      light.
    - They produce mesmerizing 'passing clouds' of rhythmic color pulses across their skin to mesmerize
      crabs before striking with tentacle speed.
  - title: 'Clownfish & Sea Anemones: Classic Symbiosis'
    points:
    - Clownfish are immune to the stinging nematocysts of sea anemones thanks to a specialized mucus coating
      on their skin.
    - The anemone provides the clownfish with a safe home protected from predators, while the clownfish
      cleans parasites and defends the anemone.
    - All clownfish are born male (protandrous hermaphrodites); if the dominant breeding female in a group
      dies, the largest male transforms into the new breeding female.
  - title: Seahorses & Male Pregnancy
    points:
    - Seahorses are true fish with gills, a swim bladder, and fins, but they swim upright and lack a caudal
      tail fin.
    - They are one of the only animal species on Earth where the male experiences pregnancy, carrying
      fertilized eggs in a specialized brood pouch until birth.
    - Their prehensile tails can anchor them firmly to seagrass or coral during violent ocean storms.
  trivia:
  - type: multiple_choice
    question: What biological kingdom do living corals belong to?
    options:
    - Animals (Invertebrates)
    - Plants (Aquatic flora)
    - Fungi
    - Minerals
    correct: 0
    explanation: Corals are colonial marine invertebrates made of thousands of tiny soft-bodied animals
      called polyps.
  - type: multiple_choice
    question: What symbiotic microscopic organism lives inside coral tissues and provides most of their
      food through photosynthesis?
    options:
    - Zooxanthellae (microscopic algae)
    - Cyanobacteria
    - Sea lice parasites
    - Planktonic copepods
    correct: 0
    explanation: Corals share a vital mutualistic symbiosis with microscopic algae called zooxanthellae
      that live inside their tissues, supplying up to 90% of their energy via photosynthesis.
  - type: multiple_choice
    question: Why is octopus blood naturally blue instead of red?
    options:
    - It contains copper-based hemocyanin to carry oxygen in cold water
    - It contains high levels of blue iodine dye
    - It has blue fluorescent proteins to light up in dark caves
    - It lacks blood cells and consists only of deep-sea saline water
    correct: 0
