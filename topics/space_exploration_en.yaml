        answer: "New Horizons"

  - id: moon_and_phases
    title: The Moon & Its Phases
    description: >
      Discover the science, mysteries, and beauty of Earth's closest celestial companion! 
      From ocean tides and lunar phases to giant impact craters and historic landing sites.
    cards:
      - title: The Giant Impact Hypothesis
        points:
          - "Scientists believe the Moon formed about 4.5 billion years ago when a Mars-sized protoplanet named Theia collided with early Earth."
          - "The colossal collision blasted massive amounts of molten rock into orbit, which coalesced over time into the Moon."
          - "Moon rocks brought back by Apollo astronauts confirmed that Earth and Moon share nearly identical oxygen isotopic signatures."
          - "The Moon's gravitational presence stabilized Earth's axial tilt, preventing wild climate swings and enabling stable life to evolve."
      - title: The Eight Lunar Phases
        points:
          - "The Moon does not produce its own light; it reflects light from the Sun as it orbits Earth every 29.5 days (synodic month)."
          - "The 8 phases in order are: New Moon, Waxing Crescent, First Quarter, Waxing Gibbous, Full Moon, Waning Gibbous, Third Quarter, and Waning Crescent."
          - "'Waxing' means the illuminated portion is growing larger, while 'Waning' means the illuminated portion is shrinking."
          - "A 'Blue Moon' is a popular name for the rare occurrence of a second Full Moon within a single calendar month."
      - title: Gravitational Tides & Ocean Pull
        points:
          - "The Moon's gravitational attraction pulls on Earth's oceans, creating high and low ocean tides twice every day."
          - "When the Sun, Earth, and Moon align in a straight line during Full and New Moons, their gravity combines to produce higher 'Spring Tides'."
          - "When the Moon is at a 90-degree angle to the Sun during Quarter Moons, the tidal pull is weaker, producing 'Neap Tides'."
          - "Tidal friction is gradually slowing Earth's rotation by about 1.4 milliseconds per century and pushing the Moon 3.8 cm farther away each year."
      - title: The Far Side of the Moon
        points:
          - "The Moon is 'tidally locked' to Earth, meaning it takes the exact same time to rotate on its axis as it does to orbit Earth (27.3 days)."
          - "Because of tidal locking, the exact same face of the Moon always points toward Earth; humans never saw the Far Side until a Soviet probe in 1959."
          - "The Far Side is often incorrectly called the 'dark side', but it actually receives just as much sunlight as the near side."
          - "Unlike the smooth near side, the Far Side's crust is much thicker and heavily cratered, with almost no dark volcanic maria."
      - title: Solar & Lunar Eclipses
        points:
          - "A Solar Eclipse occurs when the Moon passes directly between the Sun and Earth, casting its shadow (umbra) onto Earth's surface."
          - "By a stunning cosmic coincidence, the Sun is 400 times larger than the Moon, but also 400 times farther away, making them appear identical in size in the sky!"
          - "A Lunar Eclipse occurs when Earth passes directly between the Sun and Moon, casting Earth's shadow over the Full Moon."
          - "During a total lunar eclipse, refracted sunlight through Earth's atmosphere turns the Moon a glowing copper red ('Blood Moon')."
      - title: "Lunar Maria & The Sea of Tranquility"
        points:
          - "The dark patches visible on the Moon are called 'Maria' (Latin for 'seas'), ancient basaltic plains formed by ancient volcanic lava flows."
          - "Early astronomers mistakenly believed these dark flat areas were vast oceans of liquid water."
          - "The 'Sea of Tranquility' (Mare Tranquillitatis) is the historic landing site where Apollo 11's Eagle lunar module touched down in 1969."
          - "The lighter, bright regions of the Moon are heavily cratered mountainous highlands composed of anorthosite rock."
      - title: Water Ice in Polar Craters
        points:
          - "Because the Moon has an axial tilt of only 1.5 degrees, deep craters at the lunar poles never receive any direct sunlight."
          - "These permanently shadowed regions act as 'cold traps', preserving billions of tons of ancient water ice at temperatures below -200°C (-330°F)."
          - "Discovered by orbital probes like Chandrayaan-1 and LRO, this water ice is a vital resource for future human space exploration."
          - "Future lunar astronauts can melt the ice for drinking water and split it into hydrogen and oxygen to produce rocket propellant."
      - title: The Artemis Program & Future Bases
        points:
          - "NASA's Artemis program aims to land the first woman and first person of color on the Moon and establish sustainable human exploration."
          - "The program uses the giant Space Launch System (SLS) rocket, the Orion crew capsule, and commercial lunar landers."
          - "Artemis plans to build the 'Lunar Gateway', an international space station in lunar orbit to support surface missions."
          - "Establishing a permanent presence on the Moon serves as a critical technological stepping stone for humanity's eventual journey to Mars."
    trivia:
      - type: multiple_choice
        question: "What ancient protoplanet do scientists believe collided with Earth to form the Moon?"
        options: ["Ceres", "Theia", "Vesta", "Nemesis"]
        correct: 1
      - type: single_qa
        question: "What term describes the Moon phase when the illuminated portion is growing larger?"
        answer: "Waxing"
      - type: multiple_choice
        question: "Why does humanity on Earth only ever see one side of the Moon?"
        options: ["The Moon does not rotate at all", "The Moon is tidally locked (rotation period equals orbit period)", "Earth's magnetic field blocks the other side", "The far side is permanently in shadow"]
        correct: 1
      - type: single_qa
        question: "What is the popular name for the rare occurrence of two Full Moons in a single calendar month?"
        answer: "A Blue Moon"
      - type: multiple_choice
        question: "What type of eclipse occurs when the Moon passes directly between the Sun and Earth?"
        options: ["Lunar Eclipse", "Solar Eclipse", "Stellar Eclipse", "Planetary Transit"]
        correct: 1
      - type: single_qa
        question: "What color does the Moon appear during a total lunar eclipse ('Blood Moon')?"
        answer: "Red (or copper red)"
      - type: multiple_choice
        question: "What is the historic name of the lunar basalt plain where Apollo 11 first landed on the Moon in 1969?"
        options: ["Ocean of Storms", "Sea of Tranquility", "Sea of Serenity", "Crater of Copernicus"]
        correct: 1
      - type: single_qa
        question: "Approximately how far is the Moon drifting away from Earth each year due to tidal friction?"
        answer: "3.8 centimeters (about 1.5 inches)"
      - type: multiple_choice
        question: "What are the dark, smooth flat plains on the Moon called, formed by ancient volcanic lava?"
        options: ["Maria (Seas)", "Terrae (Highlands)", "Calderas", "Regoliths"]
        correct: 0
      - type: single_qa
        question: "What valuable resource was discovered frozen in permanently shadowed craters at the Moon's poles?"
        answer: "Water ice"
      - type: multiple_choice
        question: "What is the name of NASA's modern 21st-century space program to return astronauts to the Moon?"
        options: ["Apollo", "Artemis", "Gemini", "Mercury"]
        correct: 1
      - type: single_qa
        question: "How many days does it take the Moon to complete a full cycle of 8 lunar phases (synodic month)?"
        answer: "29.5 days"
      - type: multiple_choice
        question: "What type of extra-high ocean tides occur when the Sun, Earth, and Moon align in a straight line?"
        options: ["Neap Tides", "Spring Tides", "Rip Tides", "Ebb Tides"]
        correct: 1
      - type: single_qa
        question: "What is the name of the planned international space station that will orbit the Moon under the Artemis program?"
        answer: "Lunar Gateway (or Gateway)"
      - type: multiple_choice
        question: "How much larger is the Sun compared to the Moon in diameter, matching their distance ratio to Earth?"
        options: ["10 times", "50 times", "400 times", "1,000 times"]
        correct: 2
      - type: single_qa
        question: "What country's robotic probe (Luna 3) took the first photograph of the far side of the Moon in 1959?"
        answer: "The Soviet Union (USSR)"

  - id: famous_space_missions
    title: Famous Space Missions & Rovers
    description: >
      Relive humanity's greatest adventures into the great unknown! 
      From the first footprints on the lunar surface to robotic rovers roaming the dusty canyons of Mars.
    cards:
      - title: Apollo 11 & The Lunar Landings
        points:
          - "Launched on July 16, 1969, aboard the mighty 363-foot Saturn V rocket, Apollo 11 carried astronauts Neil Armstrong, Buzz Aldrin, and Michael Collins."
          - "On July 20, 1969, Neil Armstrong stepped onto the lunar soil, proclaiming: 'That's one small step for [a] man, one giant leap for mankind.'"
          - "Armstrong and Aldrin spent 21.5 hours on the lunar surface, collecting 21.5 kilograms (47.5 lbs) of rock samples and planting the American flag."
          - "Between 1969 and 1972, a total of 12 humans walked on the Moon across six successful Apollo missions (Apollo 11, 12, 14, 15, 16, and 17)."
      - title: "Voyager 1 & 2: The Interstellar Voyagers"
        points:
          - "Launched in 1977, the twin Voyager probes utilized a rare planetary alignment to conduct a 'Grand Tour' of Jupiter, Saturn, Uranus, and Neptune."
          - "Each spacecraft carries a gold-plated copper 'Golden Record' containing greetings in 55 human languages, music (Bach, Chuck Berry), and Earth sounds."
          - "In 2012, Voyager 1 became the first human-made object to cross the heliopause and officially enter interstellar space."
          - "Voyager 1 captured the famous 'Pale Blue Dot' photograph in 1990, showing Earth as a tiny, vulnerable speck of dust in a beam of sunlight."
      - title: "Mars Rovers: Spirit, Opportunity, Curiosity & Perseverance"
        points:
          - "Spirit and Opportunity landed on Mars in 2004; Opportunity was designed to last 90 days but operated for an astonishing 14 years!"
          - "Curiosity, a car-sized nuclear-powered rover, landed in Gale Crater in 2012, discovering that ancient Mars had liquid freshwater lakes suitable for life."
          - "Perseverance landed in Jezero Crater in 2021, equipped with drill tools to collect rock core samples for future return to Earth."
          - "Perseverance carried 'Ingenuity', a robotic coaxial helicopter that achieved the first powered, controlled flight on another planet."
      - title: The Cassini-Huygens Mission
        points:
          - "Cassini orbited Saturn from 2004 to 2017, dramatically expanding our understanding of the ringed planet and its dynamic moons."
          - "The European Space Agency's Huygens probe detached from Cassini in 2005 and made a historic landing on the surface of Titan."
          - "Cassini discovered active geysers of warm liquid water and organic molecules erupting from the south pole of icy moon Enceladus."
          - "To protect potential pristine microbial life on the moons, Cassini concluded its mission with a dramatic controlled dive into Saturn's atmosphere."
      - title: "New Horizons: Journey to Pluto"
        points:
          - "Launched in 2006, New Horizons was the fastest spacecraft ever launched from Earth, traveling over 58,000 km/h (36,000 mph)."
          - "In July 2015, it conducted the first-ever close flyby of Pluto, capturing breathtaking high-resolution color images."
          - "The probe revealed that Pluto is geologically active, with 3,000-meter-tall water ice mountains and active nitrogen glaciers."
          - "In 2019, New Horizons made history again by flying past Arrokoth, a pristine contact-binary planetesimal in the distant Kuiper Belt."
      - title: The Hubble Space Telescope Servicing Missions
        points:
          - "When Hubble was deployed in 1990, a microscopic flaw in its primary mirror (spherical aberration) resulted in blurry, distorted photos."
          - "In 1993, space shuttle Endeavour astronauts performed a daring spacewalk repair, installing corrective optics (COSTAR) like 'glasses' for the telescope."
          - "NASA astronauts conducted five risky Space Shuttle servicing missions, upgrading Hubble's instruments, batteries, and gyroscopes in orbit."
          - "Hubble has operated for over 30 years, capturing iconic images and making over 1.5 million scientific observations."
      - title: The James Webb Space Telescope Deployment
        points:
          - "Unlike Hubble, the James Webb Space Telescope could not be repaired in orbit because it operates 1.5 million kilometers from Earth."
          - "The telescope had to perform over 300 complex, single-point failure mechanical deployments over 30 days in deep space."
          - "Deployments included unfolding a five-layer tennis-court-sized sunshield and aligning 18 hexagonal gold-plated beryllium mirror segments."
          - "The deployment was completely flawless, allowing astronomers to see the earliest stars that ignited after the Big Bang."
      - title: Pioneer 10 & 11 & The Deep Space Network
        points:
          - "Pioneer 10 (1972) was the first spacecraft to navigate safely through the Asteroid Belt and conduct a close flyby of Jupiter."
          - "Pioneer 10 and 11 carried gold-anodized aluminum plaques with pictograms of human figures and the location of Earth relative to pulsars."
          - "NASA's Deep Space Network (DSN) uses giant radio antennas in California, Spain, and Australia to communicate with probes across the solar system."
          - "These historic missions laid the technological foundations for deep-space navigation, autonomous robotics, and interstellar exploration."
    trivia:
      - type: multiple_choice
        question: "What historic words did Neil Armstrong speak upon stepping onto the lunar surface in 1969?"
        options: ["The Eagle has landed", "That's one small step for man, one giant leap for mankind", "We came in peace for all mankind", "Here men from the planet Earth first set foot upon the Moon"]
        correct: 1
      - type: single_qa
        question: "How many total humans have walked on the surface of the Moon across the Apollo program?"
        answer: "12 humans (all American astronauts)"
      - type: multiple_choice
        question: "What special object carrying recordings of world music and languages is attached to the Voyager probes?"
        options: ["The Silver Disc", "The Golden Record", "The Crystal Cube", "The Silicon Chip"]
        correct: 1
