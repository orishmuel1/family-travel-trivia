id: space_exploration_en
title: Space Exploration & Astronomy
description: >
  Embark on an awe-inspiring journey through the cosmos! From blazing stars and mysterious 
  black holes to the rocky surfaces of Mars and the historic Apollo Moon landing, test your family's 
  knowledge of the universe and humanity's greatest adventures in space.
lang: en
audience: family
categories:
  - id: important_facts
    title: Important Facts
    description: >
      Fascinating cosmic laws, human milestones, and eye-opening scientific facts about the universe. 
      Read these cards together aloud before testing your knowledge in the trivia round!
    cards:
      - title: The Scale and Age of the Universe
        points:
          - "Scientists estimate the universe was born approximately 13.8 billion years ago in an explosive expansion called the Big Bang."
          - "The observable universe contains an estimated 2 trillion individual galaxies, each holding hundreds of billions of stars."
          - "Light travels at an astonishing speed of approximately 300,000 kilometers per second (186,000 miles per second)."
          - "Because light takes time to travel, when we look at distant stars, we are literally looking back in time into the deep past."
      - title: Gravity and Orbital Mechanics
        points:
          - "Gravity is the fundamental attractive force discovered mathematically by Sir Isaac Newton and refined by Albert Einstein."
          - "Satellites and space stations stay in orbit by constantly falling toward Earth while moving sideways so fast that the planet curves away beneath them."
          - "To escape Earth's gravitational pull and reach open space, a rocket must reach 'escape velocity' of about 40,000 km/h (25,000 mph)."
          - "Planets orbit the Sun in elliptical (slightly oval-shaped) orbits, moving faster when closest to the Sun."
      - title: The International Space Station (ISS)
        points:
          - "The ISS is a football-field-sized habitable laboratory orbiting 400 kilometers (250 miles) above Earth at 28,000 km/h (17,500 mph)."
          - "Astronauts aboard the ISS circle the globe every 90 minutes, experiencing 16 sunrises and 16 sunsets every single day."
          - "Human crews from the US, Europe, Japan, Canada, and Russia have lived continuously on the ISS since November 2000."
          - "Astronauts must exercise for two hours every day to prevent severe bone and muscle loss caused by microgravity (weightlessness)."
      - title: The Space Race (1957–1969)
        points:
          - "The Space Race began in October 1957 when the Soviet Union launched Sputnik 1, the world's first artificial satellite."
          - "Soviet cosmonaut Yuri Gagarin became the first human in space in April 1961, orbiting Earth in his Vostok 1 spacecraft."
          - "US President John F. Kennedy challenged America in 1961 to land a man on the Moon and return him safely before the decade ended."
          - "The race culminated on July 20, 1969, when American astronaut Neil Armstrong stepped onto the lunar surface during Apollo 11."
      - title: "Space Telescopes: Hubble & James Webb"
        points:
          - "The Hubble Space Telescope, launched in 1990, revolutionized astronomy by capturing crystal-clear images above Earth's blurring atmosphere."
          - "Hubble determined the precise rate of cosmic expansion and photographed the famous 'Pillars of Creation' star-forming region."
          - "The James Webb Space Telescope (JWST), launched on Christmas Day 2021, orbits 1.5 million kilometers away at the L2 Lagrange Point."
          - "Equipped with a giant gold-coated beryllium mirror, JWST uses infrared light to photograph the very first galaxies formed after the Big Bang."
      - title: Zero Gravity & Human Spaceflight
        points:
          - "In microgravity, liquids form floating, shimmering spheres due to surface tension rather than falling into containers."
          - "Astronauts actually grow up to 5 centimeters (2 inches) taller in space because spinal discs expand without gravitational compression."
          - "Food in space includes freeze-dried meals, vacuum-sealed pouches, and tortillas instead of bread to avoid dangerous floating crumbs."
          - "Space suits (EMUs) provide oxygen, pressurization, temperature regulation, and micrometeoroid protection during spacewalks."
      - title: The Kuiper Belt & Oort Cloud
        points:
          - "Beyond Neptune lies the Kuiper Belt, a vast ring of icy bodies, frozen comets, and dwarf planets including Pluto and Eris."
          - "Far beyond the Kuiper Belt is the theoretical Oort Cloud, a giant spherical shell of trillions of icy comets surrounding the solar system."
          - "The edge of the Oort Cloud extends nearly a light-year from the Sun, defining the gravitational boundary of our solar neighborhood."
          - "Comets that take thousands or millions of years to orbit the Sun, like Comet Hale-Bopp, originate in these distant icy realms."
      - title: The Search for Extraterrestrial Life
        points:
          - "Astronomers have discovered over 5,500 exoplanets (planets orbiting other stars), many located in their star's 'Goldilocks' habitable zone."
          - "Moons in our own solar system, like Jupiter's Europa and Saturn's Enceladus, harbor warm, salty liquid oceans beneath thick ice crusts."
          - "NASA's Mars rovers analyze ancient clay rocks and riverbeds searching for biosignatures of ancient microscopic microbial life."
          - "The SETI Institute (Search for Extraterrestrial Intelligence) scans the cosmos using giant radio telescopes for artificial alien signals."
    trivia:
      - type: multiple_choice
        question: "How long ago do scientists estimate the universe was born during the Big Bang?"
        options: ["4.5 billion years ago", "13.8 billion years ago", "100 million years ago", "1 trillion years ago"]
        correct: 1
      - type: single_qa
        question: "What is the approximate speed of light in a vacuum?"
        answer: "300,000 kilometers per second (or 186,000 miles per second)"
      - type: multiple_choice
        question: "How many sunrises and sunsets do astronauts on the International Space Station experience each day?"
        options: ["1 sunrise and sunset", "8 sunrises and sunsets", "16 sunrises and sunsets", "24 sunrises and sunsets"]
        correct: 2
      - type: single_qa
        question: "Who was the first human being to travel into outer space in April 1961?"
        answer: "Yuri Gagarin"
      - type: multiple_choice
        question: "What was the name of the first artificial satellite launched into space by the Soviet Union in 1957?"
        options: ["Vostok 1", "Sputnik 1", "Explorer 1", "Luna 2"]
        correct: 1
      - type: single_qa
        question: "What famous space telescope launched in 1990 provided breathtaking images of the 'Pillars of Creation'?"
        answer: "The Hubble Space Telescope"
      - type: multiple_choice
        question: "What infrared space telescope launched in December 2021 with a giant gold-coated mirror to view the earliest galaxies?"
        options: ["Spitzer Space Telescope", "James Webb Space Telescope (JWST)", "Kepler Observatory", "Chandra Observatory"]
        correct: 1
      - type: single_qa
        question: "Why do astronauts eat tortillas instead of sliced bread aboard space stations?"
        answer: "To prevent floating crumbs (which can damage equipment or eyes)"
      - type: multiple_choice
        question: "What physical change temporarily happens to an astronaut's height in microgravity?"
        options: ["They shrink by 2 inches", "They grow up to 2 inches (5 cm) taller", "Their height remains identical", "Their legs get shorter"]
        correct: 1
      - type: single_qa
        question: "What American president famously delivered the 1961 challenge to land humans on the Moon before 1970?"
        answer: "John F. Kennedy (JFK)"
      - type: multiple_choice
        question: "What minimum speed must a rocket reach to escape Earth's gravity (escape velocity)?"
        options: ["5,000 km/h", "11,000 km/h", "40,000 km/h (25,000 mph)", "100,000 km/h"]
        correct: 2
      - type: single_qa
        question: "What icy moon of Jupiter is considered a prime candidate for extraterrestrial life due to its vast subsurface ocean?"
        answer: "Europa"
      - type: multiple_choice
        question: "What is the vast spherical cloud of billions of icy comets surrounding the outer edge of our solar system called?"
        options: ["The Asteroid Belt", "The Oort Cloud", "The Kuiper Ring", "The Van Allen Belt"]
        correct: 1
      - type: single_qa
        question: "What scientific acronym stands for the search for signals from intelligent alien civilizations?"
        answer: "SETI (Search for Extraterrestrial Intelligence)"
      - type: multiple_choice
        question: "Approximately how many individual galaxies are estimated to exist in the observable universe?"
        options: ["100 million", "10 billion", "2 trillion", "50 trillion"]
        correct: 2
      - type: single_qa
        question: "How many hours per day must astronauts exercise on the ISS to prevent bone and muscle deterioration?"
        answer: "2 hours per day"

  - id: planets_solar_system
    title: Planets of Our Solar System
    description: >
      Journey from the sun-scorched rocky inner worlds to the massive gas giants and frozen ice worlds! 
      Explore the unique climates, rings, moons, and geology of our solar neighborhood.
    cards:
      - title: "Mercury: The Scorched & Frozen World"
        points:
          - "Mercury is the smallest planet in our solar system and the closest to the Sun, orbiting it in just 88 Earth days."
          - "Lacking a significant atmosphere to trap heat, Mercury experiences extreme temperature swings: 430°C (800°F) by day and -180°C (-290°F) at night."
          - "Its gray, cratered surface closely resembles Earth's Moon, scarred by billions of years of meteorite impacts."
          - "Despite intense daytime heat, deep craters at Mercury's poles permanently shielded from sunlight contain frozen water ice."
      - title: "Venus: The Greenhouse Inferno"
        points:
          - "Venus is similar in size and mass to Earth ('Earth's twin'), but has a toxic, crushing carbon dioxide atmosphere."
          - "A runaway greenhouse effect makes Venus the hottest planet in the solar system, with surface temperatures reaching 465°C (870°F)—hot enough to melt lead!"
          - "Its thick yellowish clouds are made of corrosive sulfuric acid, completely hiding its volcanic surface from optical telescopes."
          - "Venus rotates backward (retrograde rotation) compared to most planets, so the Sun rises in the west and sets in the east."
      - title: "Earth: The Goldilocks Oasis"
        points:
          - "Earth is the only known celestial body in the universe confirmed to harbor liquid surface water and living organisms."
          - "Positioned in the habitable 'Goldilocks Zone', Earth's distance from the Sun allows temperatures where water remains liquid."
          - "Our protective atmosphere of nitrogen (78%) and oxygen (21%) shields life from solar radiation and burns up incoming meteors."
          - "A strong geomagnetic field generated by Earth's molten iron core deflects harmful solar wind particles, creating beautiful auroras."
      - title: "Mars: The Red Planet"
        points:
          - "Mars gets its reddish-orange color from iron oxide (rust) covering its vast desert plains and rocky canyons."
          - "It hosts Olympus Mons, the largest volcano in the solar system, which stands nearly three times taller than Mount Everest."
          - "Valles Marineris is an immense canyon system running along Mars' equator, four times deeper and ten times longer than the Grand Canyon."
          - "Mars has two small, irregularly shaped captured asteroid moons named Phobos (Fear) and Deimos (Panic)."
      - title: "Jupiter: The King of Planets"
        points:
          - "Jupiter is a massive gas giant more than twice as massive as all other planets in the solar system combined."
          - "Its Great Red Spot is an enormous anticyclonic storm larger than Earth that has raged continuously for hundreds of years."
          - "Jupiter has 95 officially recognized moons, including Ganymede (the largest moon in the solar system, bigger than Mercury)."
          - "Volcanic Io spews sulfur plumes hundreds of miles high, while icy Europa hides a warm subsurface ocean with more water than Earth."
      - title: "Saturn: The Lord of the Rings"
        points:
          - "Saturn is famous for its dazzling, extensive ring system made of billions of chunks of water ice, rock, and cosmic dust."
          - "Despite spanning over 280,000 kilometers across, Saturn's main rings are extraordinarily thin—averaging only about 10 meters thick!"
          - "Saturn has the lowest density of any planet; composed mostly of hydrogen and helium, it would literally float in a giant bathtub of water!"
          - "Its giant moon Titan has a thick nitrogen atmosphere, methane rain, and liquid hydrocarbon lakes on its frozen surface."
      - title: "Uranus & Neptune: The Ice Giants"
        points:
          - "Uranus and Neptune are classified as 'Ice Giants', composed of dense fluids of water, ammonia, and methane over a rocky core."
          - "Uranus uniquely rotates on its side with an extreme axial tilt of 98 degrees, rolling along its orbit like a cosmic bowling ball."
          - "Methane gas in their upper atmospheres absorbs red light and reflects blue, giving both planets their stunning cyan and azure colors."
          - "Neptune is the windiest world in the solar system, with supersonic atmospheric winds reaching speeds over 2,100 km/h (1,300 mph)."
      - title: "Dwarf Planets: Pluto & Ceres"
        points:
          - "In 2006, the International Astronomical Union (IAU) reclassified Pluto as a 'dwarf planet' because it has not cleared its orbital neighborhood."
          - "NASA's New Horizons spacecraft flew past Pluto in 2015, revealing vast nitrogen glaciers and a giant heart-shaped plain (Tombaugh Regio)."
          - "Ceres is the largest object in the main Asteroid Belt between Mars and Jupiter, containing bright sodium carbonate deposits."
          - "Other recognized dwarf planets include Eris (located in the scattered disc), Haumea (football-shaped), and Makemake."
    trivia:
      - type: multiple_choice
        question: "Which planet is the hottest in our solar system due to a runaway greenhouse effect?"
        options: ["Mercury", "Venus", "Mars", "Jupiter"]
        correct: 1
      - type: single_qa
        question: "What is the name of the largest volcano in the solar system, located on Mars?"
        answer: "Olympus Mons"
      - type: multiple_choice
        question: "Which planet has the lowest density in the solar system and would theoretically float in water?"
        options: ["Uranus", "Neptune", "Saturn", "Jupiter"]
        correct: 2
      - type: single_qa
        question: "What giant storm on Jupiter has been raging for hundreds of years and is larger than Earth?"
        answer: "The Great Red Spot"
      - type: multiple_choice
        question: "Which planet uniquely rotates on its side with an axial tilt of 98 degrees?"
        options: ["Uranus", "Neptune", "Saturn", "Mercury"]
        correct: 0
      - type: single_qa
        question: "What are the names of Mars' two small, asteroid-like moons?"
        answer: "Phobos and Deimos"
      - type: multiple_choice
        question: "What gas in the atmospheres of Uranus and Neptune gives them their distinctive blue color?"
        options: ["Oxygen", "Methane", "Helium", "Carbon dioxide"]
        correct: 1
      - type: single_qa
        question: "What giant moon of Saturn has a thick nitrogen atmosphere and lakes of liquid methane?"
        answer: "Titan"
