id: famous_inventions_discoveries_he
title: "המצאות ותגליות מפורסמות"
description: >
  צאו למסע מרתק בעקבות התושייה והיצירתיות האנושית! גלו את הפיתוחים פורצי הדרך
  והנקודות המרכזיות במדע ששינו לחלוטין את הדרך שבה אנו חיים, מתקשרים ומבינים את היקום.
  מתאים בול לסקרנים בכל הגילאים.
lang: he
audience: family
categories:
  - id: important_facts
    title: "עובדות חשובות"
    description: >
      אבני דרך מרתקות ובסיסיות בהיסטוריה האנושית. למדו כיצד פריצות דרך מוקדמות
      הניחו את היסודות לעולם המודרני לפני שתתחילו בשאלות הטריוויה.
    cards:
      - title: "הגלגל"
        points:
          - "הגלגל הומצא בסביבות שנת 3500 לפני הספירה במסופוטמיה, ושימש במקור לקדרות ועיצוב כלי חרס ולא לתחבורה."
          - "לקחו מאות שנים עד שבני אדם חשבו לחבר גלגלים לצירים כדי לבנות כרכרות ועגלות משא."
          - "ההמצאה חוללה מהפכה בחקלאות, במסחר ובלוגיסטיקה בכל רחבי התרבויות העתיקות."
          - "הוא נחשב בעיני רבים לאחת ההמצאות המכניות החשובות ביותר בהיסטוריה האנושית."
      - title: "המצפן"
        points:
          - "המצפן המגנטי הומצא לראשונה בסין בתקופת שושלת חאן, ושימש במקור ככלי לניבוי עתידות."
          - "במאה ה-11, הצבא הסיני התאים את המצפן לצורכי ניווט ימי ומסעות ארוכים."
          - "הוא איפשר למגלי ארצות לנווט בבטחה בלב ים, ושינה לחלוטין את המסחר והמחקר העולמיים."
          - "המצפנים הראשונים השתמשו באבן מגנטית, שהיא פיסה ממגנטת טבעית של המינרל מגנטיט."
      - title: "אבק השריפה"
        points:
          - "אבק השריפה התגלה על ידי אלכימאים סינים במאה ה-9 בזמן שחיפשו את סם החיים לחיי נצח."
          - "הוא נחשב לאחת מ-'ארבע ההמצאות הגדולות' של סין העתיקה, יחד עם המצפן, ייצור הנייר והדפוס."
          - "הנוסחה שלו התפשטה למזרח התיכון ולאירופה, ושינתה לחלוטין את שיטות הלחימה וההנדסה בעולם."
          - "מעבר לכלי נשק, הוא חולל מהפכה בתעשיית המכרות והבנייה באמצעות פיצוצים מבוקרים."
      - title: "עדשות אופטיות"
        points:
          - "השימוש המתועד המוקדם ביותר בעדשות מגיע ממצרים העתיקה וממסופוטמיה לצורך הגדלת טקסטים."
          - "במאה ה-13, אומנים איטלקים יצרו את משקפי הראייה הראשונים שניתן להרכיב כדי לתקן את הראייה."
          - "העדשות סללו בהמשך את הדרך להמצאת המיקרוסקופ והטלסקופ בתחילת המאה ה-17."
          - "הן איפשרו לאנושות לראות לראשונה הן את העולם הזעיר (המיקרוסקופי) והן כוכבים רחוקים."
      - title: "לוח השנה"
        points:
          - "המצרים העתיקים יצרו את אחד מלוחות השנה השמשיים הראשונים, שהתבסס על ההצפה השנתית של נהר הנילוס."
          - "לוח השנה היוליאני, שהציג יוליוס קיסר, הוסיף שנה מעוברת כל ארבע שנים כדי לפתור את נדידת העונות."
          - "לוח השנה הגרגוריאני, שהוכנס לשימוש ב-1582, תיקן טעויות מתמטיות קלות והוא הלוח הסטנדרטי המשמש כיום."
          - "מעקב אחר הזמן איפשר לחברות עתיקות לארגן בהצלחה את החקלאות, הדת והשלטון."
    trivia:
      - type: multiple_choice
        question: "היכן הומצא המצפן המגנטי במקור?"
        options: ["מצרים העתיקה", "רומא העתיקה", "סין", "יוון"]
        correct: 2
      - type: single_qa
        question: "לשם מה שימש הגלגל במקור לפני שהשתמשו בו לתחבורה?"
        answer: "קדרות"
      - type: multiple_choice
        question: "איזה לוח שנה הוא המערכת הסטנדרטית והנפוצה ביותר בעולם כיום?"
        options: ["לוח השנה היוליאני", "לוח השנה הגרגוריאני", "לוח השנה הירחי", "לוח השנה של המאיה"]
        correct: 1
      - type: single_qa
        question: "אלכימאים סינים גילו בטעות את אבק השריפה כשניסו למצוא נוסחה למה?"
        answer: "חיי נצח"
      - type: multiple_choice
        question: "המיקרוסקופ והטלסקופ הפכו לאפשריים הודות לפיתוח של איזו טכנולוגיה?"
        options: ["עדשות אופטיות", "כוח הקיטור", "חשמל", "פלדה מגנטית"]
        correct: 0
      - type: single_qa
        question: "בסביבות איזו שנה לפני הספירה הומצא הגלגל במסופוטמיה?"
        answer: "3500 לפני הספירה"
      - type: multiple_choice
        question: "באיזה מינרל השתמשו כדי ליצור את המצפנים המגנטיים המוקדמים ביותר?"
        options: ["קוורץ", "אבן מגנטית", "צור", "אובסידיאן"]
        correct: 1
      - type: single_qa
        question: "מי הציג את מערכת לוח השנה שהוסיפה לראשונה שנה מעוברת כל ארבע שנים?"
        answer: "יוליוס קיסר"
      - type: multiple_choice
        question: "איזו מהאפשרויות הבאות אינה אחת מ-'ארבע ההמצאות הגדולות' של סין העתיקה?"
        options: ["המצפן", "אבק השריפה", "ייצור נייר", "מנוע הקיטור"]
        correct: 3
      - type: single_qa
        question: "באיזו מדינה יוצרו משקפי הראייה הראשונים במהלך המאה ה-13?"
        answer: "איטליה"

  - id: world_changing_inventions
    title: "המצאות ששינו את העולם"
    description: >
      קפיצות טכנולוגיות אדירות ששינו מהיסוד את מבנה החברה האנושית.
      גלו כיצד הרעיונות המהפכניים הללו עיצבו מחדש את התקשורת העולמית, התעשייה וחיי היום-יום.
    cards:
      - title: "מכבש הדפוס"
        points:
          - "יוהאן גוטנברג המציא את מכבש הדפוס בעל האותיות המיטלטלות בסביבות שנת 1440 בגרמניה."
          - "הוא איפשר לייצר ספרים בהמוניהם ובמהירות, מה שהוזיל עלויות והעלה את שיעורי האוריינות בעולם."
          - "הספר המרכזי הראשון שהודפס היה תנ\"ך גוטנברג, שהפך מיד למפורסם."
          - "הוא הניע את המהפכה המדעית בכך שאיפשר לחוקרים לשתף תגליות בצורה נרחבת."
      - title: "מנוע הקיטור"
        points:
          - "ג'יימס ואט שיפר משמעותית את העיצובים המוקדמים של מנוע הקיטור בסוף המאה ה-18 והפך אותו לשימושי."
          - "הוא סיפק מקור אמין של כוח מכני שלא היה תלוי ברוח, במים או בסוסים."
          - "מנוע הקיטור הפעיל מפעלים, רכבות וספינות, והוביל את המהפכה התעשייתית."
          - "הוא איפשר לערים ולתעשיות להתרחב במהירות הרחק ממקורות מים טבעיים."
      - title: "רתימת החשמל"
        points:
          - "בנימין פרנקלין הוכיח שברק הוא תופעה חשמלית בשנת 1752 באמצעות ניסוי העפיפון המפורסם שלו."
          - "מייקל פאראדיי גילה את ההשראה האלקטרומגנטית, מה שהוביל להמצאת הגנרטורים."
          - "תומאס אדיסון פיתח את נורת הלהט העמידה, שהאירה את חשכת הלילה."
          - "החשמל שינה לחלוטין את הייצור התעשייתי, הבתים, הבטיחות והפעילות בשעות החשיכה."
      - title: "המכונית"
        points:
          - "קרל בנץ נחשב לממציא המכונית המודרנית הראשונה המונעת בבנזין בשנת 1886."
          - "הנרי פורד חולל מהפכה בייצור על ידי שימוש בפס ייצור כדי לבנות מכוניות במחיר נגיש."
          - "דגם ה-'מודל T' איפשר למיליוני משפחות ממוצעות לרכוש מכונית פרטית משלהן."
          - "המכוניות הובילו לסלילת מערכות כבישים מהירים עצומות ועיצבו מחדש את תכנון הערים."
      - title: "הצילום"
        points:
          - "לואי דאגר הציג את הדאגרוטיפ בשנת 1839, תהליך הצילום המסחרי הראשון שהיה זמין לציבור."
          - "צילומים מוקדמים דרשו זמני חשיפה ארוכים, מה שאילץ אנשים לשבת ללא תנועה במשך דקות ארוכות."
          - "ג'ורג' איסטמן המציא את סרט הצילום הנגלל ואת מצלמת קודאק, והביא את הצילום לקהל הרחב."
          - "הוא איפשר לתעד באופן חזותי את ההיסטוריה, רגעים משפחתיים ומקומות רחוקים לראשונה."
    trivia:
      - type: multiple_choice
        question: "מי נחשב לממציא מכבש הדפוס בעל האותיות המיטלטלות באירופה?"
        options: ["לאונרדו דה וינצ'י", "יוהאן גוטנברג", "איזק ניוטון", "גלילאו גליליי"]
        correct: 1
      - type: single_qa
        question: "איזו תקופה היסטורית מרכזית הונעה והואצה על ידי מנוע הקיטור השימושי?"
        answer: "המהפכה התעשייתית"
      - type: multiple_choice
        question: "מי השתמש בפס הייצור כדי להפוך את המכונית לנגישה וזולה עבור הציבור הרחב?"
        options: ["קרל בנץ", "הנרי פורד", "ניקולה טסלה", "אלכסנדר גרהם בל"]
        correct: 1
      - type: single_qa
        question: "מה היה שמו של תהליך הצילום הנפוץ הראשון שהומצא בשנת 1839?"
        answer: "דאגרוטיפ"
      - type: multiple_choice
        question: "איזה מדען גילה את ההשראה האלקטרומגנטית וסלל את הדרך לגנרטורים החשמליים?"
        options: ["מייקל פאראדיי", "תומאס אדיסון", "בנימין פרנקלין", "אלברט איינשטיין"]
        correct: 0
      - type: single_qa
        question: "באיזו שנה רשם קרל בנץ פטנט על המכונית המודרנית הראשונה המונעת בבנזין?"
        answer: "1886"
      - type: multiple_choice
        question: "איזה ספר מפורסם היה היצירה המרכזית הראשונה שיוצרה בהמוניה במכבש הדפוס של גוטנברג?"
        options: ["האודיסאה", "התנ\"ך", "המדינה", "סיפורי קנטרברי"]
        correct: 1
      - type: single_qa
        question: "איזה מדינאי אמריקאי העיף עפיפון בסופת רעמים כדי להוכיח שברק הוא חשמל?"
        answer: "בנימין פרנקלין"
      - type: multiple_choice
        question: "מי הקים את חברת קודאק והציג לציבור את סרט הצילום הנגלל והנוח?"
        options: ["לואי דאגר", "ג'ורג' איסטמן", "תומאס אדיסון", "אלכסנדר גרהם בל"]
        correct: 1
      - type: single_qa
        question: "מה נאלצו אנשים לעשות בצילומים מוקדמים בגלל זמני החשיפה הארוכים?"
        answer: "לשבת ללא תנועה"

  - id: medical_breakthroughs
    title: "פריצות דרך רפואיות"
    description: >
      תגליות מצילות חיים שהכפילו את תוחלת החיים האנושית וניצחו מחלות קטלניות.
      גלו את אבני הדרך ברפואה שמגנות על הבריאות שלנו מדי יום.
    cards:
      - title: "חיסונים"
        points:
          - "אדוארד ג'נר יצר את החיסון המוצלח הראשון בעולם בשנת 1796 כדי להילחם באבעבועות שחורות."
          - "הוא שם לב שחולבות היו מחוסנות לאבעבועות שחורות מכיוון שהן נדבקו קודם לכן באבעבועות הבקר הקלות יותר."
          - "לואי פסטר הרחיב את הרעיון הזה על ידי פיתוח חיסונים לכלבת ולאנתרקס."
          - "חיסונים מאמנים את מערכת החיסון להילחם בווירוסים ובחיידקים מסוכנים בצורה בטוחה."
      - title: "פניצילין"
        points:
          - "אלכסנדר פלמינג גילה את הפניצילין בטעות בשנת 1928 כשעובש צמח בצלחות החיידקים שלו."
          - "הוא הבחין שעובש הפניציליום השמיד לחלוטין את החיידקים המזיקים שסביבו."
          - "הוא הפך לאנטיביוטיקה היעילה הראשונה בעולם, והציל מיליוני בני אדם מזיהומים."
          - "הפניצילין חולל מהפכה בשדה הקרב ובחיי האזרחים על ידי הפיכת פצעים קטלניים למצבים ברי טיפול."
      - title: "הרדמה"
        points:
          - "לפני המצאת ההרדמה, ניתוחים היו כואבים להפליא ונאלצו להתבצע במהירות המקסימלית האפשרית."
          - "בשנת 1846, ויליאם מורטון הדגים שימוש יעיל באתר (Ether) כחומר הרדמה כירורגי."
          - "היא מאפשרת למטופלים לשקוע בשינה עמוקה ללא כאבים במהלך ניתוחים רפואיים מורכבים."
          - "ההרדמה הפכה את הניתוח ממוצא אחרון נואש ומפחיד למדע מדויק ובטוח."
      - title: "קרני רנטגן"
        points:
          - "וילהלם רנטגן גילה בטעות את קרני הבלתי נראות (רנטגן) ב-1895 בזמן שניסה זרמים חשמליים."
          - "תמונת הרנטגן הראשונה אי פעם הראתה את העצמות בתוך כף ידה של אשתו."
          - "קרני הרנטגן עוברות בקלות דרך עור ושרירים אך נחסמות על ידי עצמות דחוסות, מה שיוצר תמונת צל."
          - "פריצת הדרך הרפואית הזו איפשרה לרופאים להביט לתוך גוף האדם ללא ניתוח."
      - title: "אינסולין"
        points:
          - "פרדריק באנטינג וצ'רלס בסט בודדו בהצלחה את הורמון האינסולין בשנת 1921."
          - "לפני פריצת הדרך הזו, אבחנה של סוכרת מסוג 1 הייתה מצב קטלני ללא כל טיפול."
          - "האינסולין מווסת את רמות הגלוקוז בדם, ומאפשר לגוף להשתמש בסוכר לאנרגיה בצורה תקינה."
          - "התגלית שלהם הפכה את מחלת הסוכרת מגזר דין מוות למצב כרוני הניתן לניהול בקלות."
    trivia:
      - type: multiple_choice
        question: "מי גילה את הפניצילין, האנטיביוטיקה היעילה הראשונה בעולם, בשנת 1928?"
        options: ["לואי פסטר", "אדוארד ג'נר", "אלכסנדר פלמינג", "ג'ונאס סאלק"]
        correct: 2
      - type: single_qa
        question: "באיזו מחלה ניסה אדוארד ג'נר להילחם כדי ליצור את החיסון הראשון בעולם?"
        answer: "אבעבועות שחורות"
      - type: multiple_choice
        question: "ידה של מי הופיעה בתמונת הרנטגן הרפואית הראשונה שצולמה אי פעם?"
        options: ["אשתו של וילהלם רנטגן", "תומאס אדיסון", "המלכה ויקטוריה", "אלכסנדר פלמינג"]
        correct: 0
      - type: single_qa
        question: "איזה הורמון בודדו פרדריק באנטינג וצ'רלס בסט כדי לטפל בסוכרת?"
        answer: "אינסולין"
      - type: multiple_choice
