    options:
    - Ford GT40 Mk II
    - Chevrolet Corvette Stingray
    - Shelby Cobra Daytona Coupe
    - Dodge Viper GTS-R
    correct: 0
    explanation: Engineered by Carroll Shelby and Ken Miles, the 7.0-liter Ford GT40 Mk II won Le Mans
      in 1966 with a legendary 1-2-3 finish, repeating victories through 1969.
  - type: multiple_choice
    question: What is the remarkable 60-year safety record of Japan's high-speed Shinkansen bullet train
      network?
    options:
    - Zero passenger fatalities from derailments or collisions across over 10 billion passenger journeys
    - It has suffered only one derailment per decade
    - It operates at reduced speeds during rainfall
    - It requires passengers to wear racing helmets
    correct: 0
    explanation: Since opening in 1964, the Shinkansen has carried over 10 billion passengers with zero
      fatal derailments or collisions, maintaining an average delay of less than 1 minute.
  - type: multiple_choice
    question: What is the 'Triple Crown of Motorsport'?
    options:
    - Winning the Monaco Grand Prix (Formula 1), the 24 Hours of Le Mans, and the Indianapolis 500
    - Winning the Daytona 500, the Dakar Rally, and the Isle of Man TT
    - Winning three Formula 1 World Championships in a row
    - Setting three land speed records in the same year
    correct: 0
    explanation: 'Graham Hill is the only driver in racing history to achieve the Triple Crown of Motorsport:
      winning the Monaco GP (or F1 World Championship), the 24 Hours of Le Mans, and the Indy 500.'
  - type: multiple_choice
    question: What downforce-generating aerodynamic phenomenon, pioneered by Colin Chapman's Lotus 78/79
      in Formula 1, is known as 'Ground Effect'?
    options:
    - Using shaped underbody venturi tunnels and side skirts to create low pressure that literally sucks
      the car to the asphalt
    - Adding heavy lead weights to the front bumper
    - Ejecting exhaust air backwards to push the rear tires down
    - Inflating tires with heavy xenon gas
    correct: 0
    explanation: Ground effect channels air through shaped underfloor venturi tunnels (Bernoulli's principle),
      creating massive suction downforce with minimal drag penalty.
  - type: multiple_choice
    question: What dangerous motorcycle road race, held on public roads around a 37.73-mile mountain course
      since 1907, is considered the most perilous in the world?
    options:
    - Isle of Man TT (Tourist Trophy)
    - Monaco Grand Prix
    - Bathurst 1000
    - Pikes Peak International Hill Climb
    correct: 0
    explanation: The Isle of Man TT features superbike riders racing between stone walls and lampposts
      at speeds exceeding 200 mph (320 km/h) over a 37.73-mile closed public road course.
  - type: multiple_choice
    question: What safety innovation, introduced to Formula 1 in 2018, consists of a titanium cockpit
      hoop that has saved numerous drivers from flying debris and rollovers?
    options:
    - The Halo
    - The HANS Device
    - The Roll Bar
    - The Skid Plate
    correct: 0
    explanation: The Halo is a curved titanium bar mounted above the driver's helmet capable of supporting
      12 tonnes of impact weight (the weight of two London double-decker buses).
  - type: multiple_choice
    question: What is the prestigious annual endurance race held in Indiana since 1911 known as 'The Greatest
