    options:
    - The Indianapolis 500 (Indy 500)
    - The Daytona 500
    - The 12 Hours of Sebring
    - The Baja 1000
    correct: 0
    explanation: The Indy 500 challenges 33 open-wheel race cars across 200 laps (500 miles) at speeds
      topping 230+ mph at the iconic Indianapolis Motor Speedway 'Brickyard'.
  - type: multiple_choice
    question: What tradition is famously performed by the winner of the Indianapolis 500 in Victory Lane?
    options:
    - Drinking and pouring a bottle of cold milk over their head
    - Drinking expensive French champagne
    - Kissing a live racing pigeon
    - Smashing a watermelon with a sledgehammer
    correct: 0
    explanation: Started by Louis Meyer in 1936 who drank buttermilk to refresh himself after the hot
      race, winning drivers traditionally drink from a glass bottle of dairy milk in Victory Lane.
  - type: multiple_choice
    question: What is 'Regenerative Braking' in modern hybrid and electric racing and road vehicles (like
      F1 MGU-K systems)?
    options:
    - Using electric motors as generators during deceleration to convert kinetic energy back into stored
      battery electricity
    - Spraying liquid nitrogen on ceramic disc brakes
    - Deploying a rear parachute to slow down at pit stops
    - Reversing the combustion firing order of the engine cylinders
    correct: 0
    explanation: Regenerative braking reverses electric motor torque to slow the wheels, converting the
      vehicle's kinetic momentum into electrical power and storing it in the battery.
