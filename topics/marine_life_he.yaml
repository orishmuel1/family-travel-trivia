id: marine_life_he
title: עולם המצולות ונפלאות האוקיינוס
description: 'צללו אל מעמקי הממלכה התת-ימית המרתקת! גלו את הלווייתנים המלכותיים, דולפינים תבוניים,  טורפי-על
  אימתניים, שוניות אלמוגים צבעוניות ונפלאות זוהרות בתהומות החשוכים.

  '
lang: he
audience: family
categories:
- id: whales_giants_deep
  title: לווייתנים וענקי המצולות
  description: 'פגשו את ענקי האוקיינוס העדינים! מלווייתן הענק הכחול ושירת הלווייתן הגדול-סנפיר,  ועד ללווייתן
    הראשתן הצולל למעמקים והחדשן בעל קרן החד-קרן.

    '
  cards:
  - title: 'הלווייתן הכחול: בעל החיים הגדול בהיסטוריה'
    points:
    - הלווייתן הכחול הוא בעל החיים הגדול ביותר שחי אי פעם על פני כדור הארץ, אפילו גדול יותר מהדינוזאור
      הענק ביותר.
    - אורכו עשוי להגיע לעד 30 מטרים ומשקלו עולה על 200 טונות.
    - לבו של הלווייתן הכחול לבדו הוא בגודל של מכונית קטנה (כמו פולקסווגן חיפושית) ושוקל כ-180 ק״ג.
    - למרות גודלו העצום, תזונתו מורכבת כמעט אך ורק מסרטנונים זעירים הנקראים קריל, מהם הוא בולע עד 4 טונות
      ביום.
    - גור לווייתן כחול שנולד שוקל כ-3 טונות ועולה במשקל כ-90 ק״ג בכל יום ויום רק מיניקת חלב אמו.
  - title: לווייתן גדול-סנפיר ושירתו המורכבת
    points:
    - זכרי לווייתן גדול-סנפיר (Humpback) מחברים 'שירים' מורכבים ומהפנטים הנמשכים עד 30 דקות וחוזרים על
      עצמם במשך שעות.
    - כל הזכרים באותה אוכלוסייה שרים יחד את אותו השיר, והוא מתפתח, משתנה ומתעדכן משנה לשנה כמו להיט מוזיקלי.
    - הם מפורסמים בזינוקים אקרובטיים מלאים מחוץ למים (Breaching) כדי לתקשר, להסיר טפילים מעורם או לשחק.
    - הם צדים בשיטה קבוצתית מבריקה הנקראת 'ציד ברשת בועות', שבה הם נושפים טבעות בועות כדי ללכוד להקות
      דגים.
  - title: 'הראשתן: אלוף הצלילה החופשית של המצולות'
    points:
    - ללווייתן הראשתן (Sperm Whale) יש את המוח הגדול והכבד ביותר מכל בעל חיים בהיסטוריה, במשקל של כ-9
      ק״ג.
    - הם מסוגלים לצלול לעומקים מדהימים של מעל 2,000 מטרים ולעצור את נשימתם למשך עד 90 דקות ברציפות.
    - הם משתמשים בנקישות איכון הד (סונאר) החזקות ביותר בטבע, המגיעות לעוצמה של מעל 230 דציבלים מתחת למים.
    - בראשם הענק שמור שמן ספראמצטי ייחודי המסייע בוויסות הציפה ובמיקוד גלי הקול.
    - הטרף המועדף עליהם במעמקים החשוכים הוא דיונוני ענק ודיונונים קולוסאליים.
  - title: 'חדשן (נארוואל): חד-קרן של הים הארקטי'
    points:
    - החדשן (Narwhal) הוא לווייתן החי במימי הקוטב הצפוני, המפורסם ב'קרן' הספירלית הארוכה הבולטת מלסת הזכרים.
    - הקרן הזו היא למעשה שן ניב מוארכת במיוחד שיכולה להגיע לאורך של עד 3 מטרים.
    - השן מלאה במיליוני קצוות עצבים תחושתיים, המאפשרים ללווייתן למדוד טמפרטורה, מליחות ושינויי לחץ במים.
    - בימי הביניים, סוחרים נהגו למכור את שיני החדשן למלכי אירופה כקרניים אמיתיות של יצור החד-קרן המיתולוגי.
  - title: לווייתני מזיפות לעומת לווייתני שיניים
    points:
    - 'סדרת הלווייתנאים מתחלקת לשתי קבוצות עיקריות: לווייתני מזיפות (Mysticeti) ולווייתני שיניים (Odontoceti).'
    - המזיפות עשויות מקרטין (החלבון שממנו בנויות ציפורניים ושערות אדם) ומשמשות כמסננת ענקית לסינון מזון
      מהמים.
    - ללווייתני מזיפות (כמו הלווייתן הכחול וגדול-הסנפיר) יש שני פתחי נשימה (נחיריים), בעוד שללווייתני
      שיניים (כמו ראשתן וקטלן) יש רק פתח נשימה יחיד.
