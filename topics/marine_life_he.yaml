- id: abyss_bioluminescence
  title: תהומות הים ויצורים זוהרים בחושך
  description: 'מסע אל ממלכת החושך הנצחי של מעמקי האוקיינוס! גלו את דגי החכה המאירים,  דיונון הקולוסוס
    הענק, נביעות הידרותרמיות רותחות והתאמות מדהימות ללחץ מוחץ.

    '
  cards:
  - title: 'אזורי העומק באוקיינוס: מהשמש ועד לתהום הראדלית'
    points:
    - אזור אור השמש (אפיפלגי) מגיע עד לעומק 200 מטרים; מתחת ל-1,000 מטרים משתרע אזור חצות (בתיפלגי) בחשכה
      מוחלטת.
    - האזור הראדלי (Hadal zone) כולל את השקעים העמוקים ביותר, המגיעים לעומק של כמעט 11,000 מטרים בשקע
      מריאנה.
    - בעומק שקע מריאנה, הלחץ עולה על 1,000 אטמוספרות—שווה ערך למשקל של פיל העומד על בול דואר יחיד.
    - טמפרטורת המים במעמקים יציבה ונעה סביב 0 עד 4 מעלות צלזיוס בלבד.
  - title: 'ביולומינצנציה: אור קר במחשכי התהום'
    points:
    - מעל 75% מבעלי החיים במעמקי הים מייצרים אור עצמי (ביולומינצנציה)—אור קר הנוצר מתגובה כימית בין הפיגמנט
      לוציפרין והאנזים לוציפראז.
    - האור משמש למשיכת טרף (חכת האנגלרפיש), הטעיית טורפים (ענני דיו זוהרים), איתותי חיזור והסוואת הצללה
      נגדית.
    - 'הצללה נגדית (Counterillumination): דגים רבים מצוידים באיברי אור בגחונם התואמים בדיוק את האור הקלוש
      המגיע מלמעלה, וכך מוחקים את צלליתם מטורפים הנמצאים מתחתם.'
  - title: 'דג החכה (אנגלרפיש): מלכודת האור של המעמקים'
    points:
    - לנקבת האנגלרפיש יש חכה ייחודית (איליסיום) הבולטת ממצחה ובקצה נורה זוהרת (אסקה) המלאה בחיידקים זוהרים.
    - הנורה הזוהרת מתנדנדת מעל פיה המלא שיניים חדות כמו פיתיון דיג מושלם למשיכת סקרנים בחשכה.
    - 'במינים רבים קיים פרזיטיזם מיני קיצוני: הזכר הזעיר נושך את גוף הנקבה הענקית, מתמזג למערכת הדם שלה
      לצמיתות והופך למקור אספקת זרע.'
  - title: דיונוני ענק ודיונון קולוסאלי
    points:
    - לדיונון הקולוסאלי (Mesonychoteuthis hamiltoni) יש את העיניים הגדולות ביותר בכל עולם החי—קוטרן מגיע
      לעד 27 ס״מ (בגודל של כדורגל!).
    - עיני הענק שלו קולטות את הפוטונים הקלושים ביותר, ומסוגלות לזהות את האור הביולומינצנטי של לווייתן
      ראשתן מתקרב ממרחק של מעל 120 מטרים.
    - בניגוד לדיונוני ענק רגילים עם כפתורי הצצה משוננים, על זרועות הדיונון הקולוסאלי ישנם קרסים חדים ומסתובבים
      לקריעת טרף.
  - title: נביעות הידרותרמיות וכמוסינתזה
    points:
    - נביעות הידרותרמיות ('מעשנות שחורות') פולטות מים עשירים במינרלים שחוממו על ידי מאגמה לחום של עד 400
      מעלות צלזיוס, מבלי לרתוח עקב הלחץ האדיר.
    - מערכות אקולוגיות אלו אינן תלויות באור השמש לפוטוסינתזה; במקום זאת, חיידקים ייחודיים מייצרים אנרגיה
