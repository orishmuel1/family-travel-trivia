- id: apex_sharks_rays
  title: 'טורפי-על: כרישים וחתולי ים'
  description: 'חקרו את הביולוגיה המרתקת וחושי-העל של מחלקת דגי הסחוס! מהדיוק של הכריש הלבן  וראיית ה-360
    מעלות של הפטישן ועד לענקיות של כריש הלווייתן ומנטות ענק.

    '
  cards:
  - title: 'חוש שביעי: אמפולות לורנציני'
    points:
    - לכרישים יש חוש חשמלי מיוחד הפועל באמצעות נקבוביות הנקראות 'אמפולות לורנציני' (Ampullae of Lorenzini).
    - הנקבוביות המלאות בג'ל מוליך סביב החרטום מאפשרות להם לזהות שדות חשמליים זעירים הנוצרים מפעימות לב
      וכיווצי שרירים של טרף הקבור בחול.
    - הם מסוגלים גם לחוש בשדה המגנטי של כדור הארץ, המשמש אותם כמצפן פנימי בניווט נדידה למרחקים עצומים.
    - שלד הכרישים עשוי כולו מסחוס קל וגמיש, ללא שום עצם גרמית אחת.
  - title: 'העמלץ הלבן: צייד האוקיינוס'
    points:
    - העמלץ הלבן הוא דג בעל חום גוף מוגבה (אנדותרמי אזורי), המסוגל לשמור על חום שרירי השחייה וקיבתו מעל
      לטמפרטורת המים הקרים.
    - כרישים מחליפים אלפי שיניים במהלך חייהם; שורות של שיניים חלופיות נעות קדימה כמו סרט נע להחלפת שן
      שנשברה.
    - עמלצים לבנים יכולים להאיץ למהירות של כ-40 קמ״ש ולזנק לחלוטין מחוץ למים בעת תקיפת כלבי ים מלמטה.
  - title: 'כרישי פטישן: ראיית 360 מעלות וסריקת קרקעית'
    points:
    - הראש השטוח והרחב של הפטישן נקרא צפאלופויל (Cephalofoil).
    - מיקום העיניים בקצוות המנוגדים מעניק לפטישנים ראיית עומק תלת-ממדית מצוינת וטווח ראייה של 360 מעלות
      בציר האנכי.
    - שטח הפנים הרחב מאכלס כמות אדירה של קולטני חשמל, והופך את ראשם למעין 'גלאי מתכות' הסורק את החול לאיתור
      חתולי ים קבורים.
  - title: 'כריש לווייתני: הענק הצמחוני'
    points:
    - כריש הלווייתן הוא מין הדג החי הגדול ביותר בעולם, ומגיע לאורך של עד 18 מטרים.
    - למרות שיש לו מעל 3,000 שיניים זעירות, הוא אינו נושך אלא מסנן פלנקטון, ביצי דגים ודגיגים קטנים ללא
      כל פגיעה באדם.
    - לכל כריש לווייתן יש דפוס נקודות ופסים לבנים ייחודי על גבו, המשמש מעין 'טביעת אצבע' אישית.
    - חוקרים משתמשים באלגוריתמים של נאס״א למיפוי כוכבים כדי לזהות פרטים מתמונות של דפוס הנקודות שלהם.
  - title: מנטות רמאות וכנפי הרעם החשמליות
    points:
    - למנטה (חתול ים ענק) יש את יחס המוח לגוף הגדול ביותר מכל הדגים, והיא מפגינה סקרנות רבה ואינטליגנציה
      חברתית.
    - בניגוד לטריגונים (חתולי ים רגילים), למנטה אין עוקץ ארסי בזנבה והיא ניזונה מסינון פלנקטון עם מוטת
      כנפיים של עד 7 מטרים.
    - חשמלנים (Torpedo rays) מסוגלים לייצר פריקה חשמלית בעוצמה של עד 220 וולט מאיברים מיוחדים כדי להמם
      טרף ולהתגונן.
