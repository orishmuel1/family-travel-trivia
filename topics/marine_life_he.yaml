- id: dolphins_seals_mammals
  title: דולפינים, כלבי ים ויונקים ימיים
  description: 'גלו את התבונה המדהימה והקסם של היונקים הימיים! מדולפיני אנקול תבוניים וקטלנים  ועד ללוטרות
    ים המשתמשות בכלים ופרות ים שליוות.

    '
  cards:
  - title: 'הקטלן (אורקה): טורף-העל של האוקיינוס'
    points:
    - למרות הכינוי 'לווייתן קטלן', האורקה היא למעשה המין הגדול ביותר במשפחת הדולפיניים (Delphinidae).
    - לאורקות אין שום טורף טבעי באוקיינוס, מה שהופך אותן לטורפות-על מוחלטות.
    - להקות אורקה שונות מחזיקות בדיאלקטים קוליים ייחודיים, שיטות ציד מגוונות ותרבות המועברת מאם לצאצאיה
      במשך דורות.
    - להקות מסוימות מתמחות בציד כרישים עמלצים לבנים ומאכל הכבד שלהם, ואחרות גולשות אל החוף כדי לחטוף כלבי
      ים.
  - title: דולפיני אנקול (בקבוקי) ואינטליגנציה גבוהה
    points:
    - דולפינים משתמשים ב'שריקות חתימה' (Signature Whistles)—שמות קוליים ייחודיים המזהים כל פרט ופרט בלהקה.
    - 'הם ישנים בשיטה ייחודית של חצי-מוח ער (Unihemispheric sleep): חצי מוח ישן בעוד החצי השני נשאר ער
      כדי לנשום ולהישמר מסכנות.'
    - דולפינים עוברים בהצלחה את מבחן המראה, המעיד על מודעות עצמית גבוהה לצד קופי אדם ופילים.
    - הם נצפו משתמשים בספוגי ים ככלי מגן על חרטומם בעת חיטוט בקרקעית סלעית.
  - title: 'לוטרות ים: המהנדסות והמשתמשות בכלים'
    points:
    - ללוטרת הים יש את הפרווה הצפופה ביותר מכל בעל חיים בעולם—עד מיליון שערות לאינץ' רבוע, ללא שכבת שומן.
    - הן שומרות אבן מועדפת בכיס עור מיוחד מתחת לבית השחי כדי לפצח צדפות, קיפודי ים וסרטנים.
    - לוטרות ים אוחזות כפות ידיים בעת שינה על פני המים כדי לא להיסחף בזרמי האוקיינוס, ומתעטפות באצות קלפ.
    - כמין מפתח אקולוגי, הן מגנות על יערות האצות מפני השמדה על ידי קיפודי ים.
  - title: 'פרות ים (תחש): ענקיות צמחוניות ושלוות'
    points:
    - פרות הים (Manatees ו-Dugongs) הן יונקים ימיים צמחוניים שלווים, שקרובי המשפחה היבשתיים הקרובים ביותר
      שלהם הם הפילים ושפני הסלע.
    - הן רועות עשב ים עד 8 שעות ביום, וצורכות כ-10-15% ממשקל גופן מדי יום.
    - שיניהן הטוחנות מתחלפות ללא הרף לאורך כל חייהן, כשהן צועדות קדימה כמו במסוע ככל שהישנות נשחקות מחול
      ועשב.
  - title: כלבי ים, אריות ים וניבתנים
    points:
    - לכלבי ים אמיתיים (Phocidae) אין אפרכסות אוזניים חיצוניות והם זוחלים על גחונם, בעוד שלאריות ים (Otariidae)
      יש אוזניים גלויות והם הולכים על ארבע סנפיריהם.
    - הניבתנים (Walruses) מצוידים בחטי שן ענקיים שבהם הם משתמשים לטיפוס על גושי קרח, להגנה ולפתיחת פתחי
      נשימה בקרח.
    - 'עור הניבתן משנה את צבעו בהתאם לטמפרטורה: ורוד בהיר כשהוא מתחמם בשמש, ואפרפר-לבן במי קרח קפואים.'
  trivia:
  - type: multiple_choice
    question: לאיזו משפחה ביולוגית שייך למעשה הקטלן (אורקה)?
    options:
    - דולפיניים (Delphinidae)
    - לווייתני מזיפות
    - לווייתני ראשתן
    - פוקניים (פוקנות)
    correct: 0
    explanation: למרות הכינוי 'לווייתן קטלן', האורקה היא למעשה המין הגדול ביותר במשפחת הדולפיניים (Delphinidae).
  - type: multiple_choice
    question: כיצד דולפינים ישנים בבטחה מבלי לטבוע או להיתפס על ידי טורפים?
