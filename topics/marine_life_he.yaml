- id: coral_reefs_camouflage
  title: שוניות אלמוגים ואמני ההסוואה
  description: 'היכנסו אל יערות הגשם הססגוניים של הים! גלו את סודות הסימביוזה של האלמוגים,  הגאונות משנת
    הצורה של התמנונים והדיונונים, והביולוגיה המוזרה של סוסוני הים.

    '
  cards:
  - title: 'האלמוגים: בעלי חיים, לא צמחים ולא סלעים'
    points:
    - אלמוגים הם חסרי חוליות ימיים המורכבים ממושבות של אלפי יצורים זעירים הנקראים פוליפים.
    - הם מפרישים שלד חיצוני קשיח מסידן פחמתי המצטבר במשך אלפי שנים ויוצר את שוניות האלמוגים.
    - בתוך רקמותיהם חיות אצות מיקרוסקופיות שיתופיות הנקראות זואוקסנטלות (Zooxanthellae), המספקות לאלמוג
      עד 90% מהאנרגיה שלו באמצעות פוטוסינתזה.
    - הלבנת אלמוגים מתרחשת כאשר טמפרטורת המים עולה, מה שגורם לאלמוג לפלוט בלחץ את האצות הצבעוניות ולהפוך
      ללבן כעצם.
  - title: 'התמנון: גאון שינוי הצבע והצורה'
    points:
    - לתמנונים יש שלושה לבבות ודם כחול המבוסס על נחושת (המוציאנין) במקום ברזל (המוגלובין).
    - כשני שלישים מתאי העצב של התמנון ממוקמים בשמונה זרועותיו, מה שמאפשר לכל זרוע לטעום, לחקור ולקבל החלטות
      באופן חצי-עצמאי.
    - הם משנים צבע ומרקם עור תוך פחות מ-200 מילי-שניות בעזרת תאי צבע מיוחדים הנקראים כרומטופורים ושרירי
      עור.
    - התמנון החקיין (Mimic Octopus) מסוגל לחקות את צורתם ותנועתם של עד 15 יצורים ימיים ארסיים שונים, כמו
      זהרונים ונחשי ים.
  - title: הדיונון ומופעי האור הדינמיים
    points:
    - לדיונון הרוקחים (Cuttlefish) יש שלד פנימי נקבובי ייחודי הנקרא 'מורית' (Cuttlebone) המלא בגז ונוזל
      לוויסות ציפה.
    - יש להם אישונים בצורת W המעניקים להם שדה ראייה רחב במיוחד ויכולת קליטה של אור מקוטב.
    - הם יוצרים פולסים קצביים של צבעים וגלים על עורם המהפנטים סרטנים לפני שהם שולפים את זרועות הציד במהירות
      הבזק.
  - title: 'שושנון ושושנת ים: סימביוזה מנצחת'
    points:
    - דגי השושנון (כמו נמו) חסינים לצריבת הזרועות של שושנת הים בזכות שכבת ריר מגנה ייחודית על עורם.
    - השושנה מעניקה לשושנון בית מוגן מפני טורפים, והשושנון מנקה טפילים ומגן על השושנה מפני דגים אוכלי
      אלמוגים.
    - כל דגי השושנון נולדים כזכרים; אם הנקבה השלטת בלהקה מתה, הזכר הדומיננטי הגדול ביותר משנה את מינו
      והופך לנקבה המטילה החדשה.
  - title: 'סוסוני ים: הריון אצל הזכרים'
    points:
    - סוסוני ים הם דגים אמיתיים בעלי זימים, שלפוחית שחייה וסנפירים, אך הם שוחים בצורה אנכית וחסרי סנפיר
      זנב רגיל.
    - הם מבעלי החיים היחידים בטבע שבהם הזכר נכנס להיריון, נושא את הביציות המופרות בכיס דגירה מיוחד עד
      להשרצת הצאצאים.
    - זנבם הלופת מאפשר להם להיאחז בחוזקה בעשב ים ובאלמוגים כדי לא להיסחף בסערות ים חזקות.
