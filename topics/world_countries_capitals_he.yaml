id: world_countries_capitals_he
title: "מדינות העולם וערי בירה"
description: >
  צאו למסע חובק עולם מרתק! בחנו את הידע הגאוגרפי שלכם על ערי בירה מפורסמות, 
  אנומליות גבולות משונות, מדינות זעירות, דגלים ושיאים עולמיים מדהימים.
lang: he
audience: family
categories:
  - id: iconic_capitals
    title: "ערי בירה אייקוניות ומוקדי כוח היסטוריים"
    description: >
      מסע בין ערי הבירה המפורסמות והמשפיעות ביותר בעולם, האתרים המונומנטליים שלהן 
      והשורשים ההיסטוריים העמוקים שעיצבו את האנושות.
    cards:
      - title: "טוקיו: המטרופולין הגדול בעולם"
        points:
          - "טוקיו (שנקראה בעבר אדו) הפכה לבירת יפן בשנת 1868 כאשר הקיסר מייג'י העביר אליה את מושבו מקיוטו העתיקה."
          - "אזור המטרופולין של טוקיו רבתי הוא המאוכלס ביותר בעולם, עם מעל 37 מיליון תושבים."
          - "למרות גודלה העצום, טוקיו מדורגת באופן קבוע כאחת הערים הבטוחות, הנקיות והדייקניות ביותר בעולם."
          - "מעבר החצייה המפורסם בשיבויה נחשב לעמוס ביותר בעולם, עם עד 3,000 הולכי רגל החוצים בכל מופע אור ירוק בודד."
      - title: "לונדון: בירה על גדות התמזה"
        points:
          - "לונדון נוסדה על ידי הרומאים לפני כמעט 2,000 שנה תחת השם לונדיניום (Londinium)."
          - "מגדל השעון המפורסם בארמון וסטמינסטר מכונה בטעות 'ביג בן', אך ביג בן הוא למעשה שמו של פעמון הענק (13 טון) שבפנים, בעוד המגדל עצמו נקרא רשמית 'מגדל אליזבת'."
          - "לונדון משמשת כבירת אנגליה מאז המאה ה-11, לאחר שהחליפה את וינצ'סטר ההיסטורית."
          - "היא ביתה של רשת הרכבות התחתית הוותיקה בעולם (The Tube), שנפתחה בשנת 1863."
      - title: "פריז: עיר האורות"
        points:
          - "פריז זכתה לכינוי 'עיר האורות' (La Ville Lumière) הן בשל תפקידה המרכזי בעידן הנאורות והן משום שהייתה מהערים הראשונות באירופה שהתקינו תאורת רחוב בגז."
          - "מגדל אייפל הוקם בשנת 1889 כשער הכניסה לתערוכה העולמית, ותוכנן במקור להריסה לאחר 20 שנה בלבד."
          - "מוזיאון הלובר בפריז הוא מוזיאון האמנות המתויר ביותר בעולם, ונבנה במקור כמבצר מלכותי בימי הביניים."
      - title: "רומא: עיר הנצח"
        points:
          - "על פי האגדה, רומא נוסדה בשנת 753 לפני הספירה על ידי האחים התאומים רומולוס ורמוס, שיונקו על ידי זאבה."
          - "רומא מקיפה באופן מלא מדינה ריבונית עצמאית אחרת: קריית הוותיקן, מה שהופך אותה לעיר יחידה המכילה בתוכה מדינה שלמה."
          - "בכל יום נזרקים למזרקת טרווי קרוב ל-3,000 יורו על ידי תיירים המקווים לחזור לעיר; הכסף נאסף ונתרם לצדקה."
      - title: "וושינגטון די.סי: המחוז הפדרלי"
        points:
          - "וושינגטון די.סי הוקמה בחוקת ארצות הברית בשנת 1790 כמחוז פדרלי ולא כמדינה, כדי שאף מדינה לא תחזיק בכוח עודף על הבירה."
          - "העיר תוכננה על ידי המהנדס הצרפתי-אמריקאי פייר שארל ל'אנפן עם שדרות רחבות וכיכרות ציבוריות מרשימות."
          - "על פי חוק גובה הבניינים המקומי מ-1910, אסור לבנות גורדי שחקים שגובהם עולה על רוחב הרחוב בתוספת 20 רגל, כדי לשמור על קו הרקיע הפתוח."
    trivia:
      - type: multiple_choice
        question: "מהו שמו הרשמי של מגדל השעון המפורסם בלונדון המכונה בטעות 'ביג בן'?"
        options: ["מגדל אליזבת", "מגדל ויקטוריה", "צריח המלך ג'ורג'", "מגדל הפעמונים של סנט סטיבן"]
        correct: 0
      - type: multiple_choice
        question: "איזו עיר היסטורית שימשה כבירתה הקיסרית של יפן לפני טוקיו (אדו) עד שנת 1868?"
        options: ["קיוטו", "אוסקה", "הירושימה", "סאפורו"]
        correct: 0
      - type: multiple_choice
        question: "איזו מדינה ריבונית עצמאית שוכנת ומוקפת במלואה בתוך שטחה של העיר רומא?"
        options: ["קריית הוותיקן", "סן מרינו", "מונקו", "ליכטנשטיין"]
        correct: 0
      - type: multiple_choice
        question: "מדוע הוקם במקור מגדל אייפל בפריז בשנת 1889?"
        options: ["כשער כניסה זמני לתערוכה העולמית של פריז", "כאנטנת שידור רדיו קבועה", "כמגדל תצפית צבאי מפני פלישות", "כארמון מגורים פרטי לגוסטב אייפל"]
        correct: 0
      - type: multiple_choice
        question: "מה הפירוש של ראשי התיבות D.C בשם בירת ארצות הברית, וושינגטון די.סי?"
        options: ["District of Columbia (מחוז קולומביה)", "Democratic Capital (בירה דמוקרטית)", "Department of Congress (מחלקת הקונגרס)", "Division of Colonies (חלוקת המושבות)"]
        correct: 0
      - type: multiple_choice
        question: "איזו עיר שימשה כבירת אנגליה ההיסטורית לפני שלונדון הפכה לבירה במאה ה-11?"
        options: ["וינצ'סטר", "יורק", "באת'", "קנטרברי"]
        correct: 0
      - type: multiple_choice
        question: "איזה מעבר חצייה בטוקיו נחשב לעמוס ביותר בעולם עם אלפי הולכי רגל בכל מופע ירוק?"
        options: ["מעבר שיבויה", "כיכר גינזה", "רחבת שינג'וקו", "שדרת אקיהברה"]
        correct: 0
      - type: multiple_choice
        question: "מדוע זכתה פריז לכינוי המפורסם 'עיר האורות'?"
        options: ["בזכות תפקידה בעידן הנאורות והתקנת תאורת רחוב מוקדמת בגז", "היא הייתה העיר הראשונה שפעלה על אנרגיה סולארית", "יש בה 24 שעות של שמש רצופה בכל קיץ", "אבני הבניינים שלה זוהרות באור הירח"]
        correct: 0
      - type: multiple_choice
        question: "מה נעשה באלפי מטבעות היורו הנזרקים מדי יום למזרקת טרווי ברומא?"
        options: ["הם נאספים מדי יום ונתרמים לארגוני צדקה מקומיים", "הם מותכים ליצירת מדליות זיכרון מיוחדות", "הם משמשים לתחזוקת המזרקה בלבד", "הם נשארים בקרקעית המזרקה לצמיתות"]
        correct: 0
      - type: multiple_choice
        question: "מי תכנן את המבנה המקורי והשדרות הרחבות של העיר וושינגטון די.סי?"
        options: ["פייר שארל ל'אנפן", "תומאס ג'פרסון", "בנג'מין פרנקלין", "פרדריק לאו אולמסד"]
