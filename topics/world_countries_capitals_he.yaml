  - id: surprising_capitals
    title: "בירות מפתיעות וערים עם טוויסט"
    description: >
      גלו את ערי הבירה שמבלבלות את כולם! בחנו את הידע שלכם על בירות מתוכננות, 
      ערי פשרה פוליטיות ומדינות עם מספר ערי בירה רשמיות.
    cards:
      - title: "קנברה: בירת הפשרה של אוסטרליה"
        points:
          - "רבים טועים לחשוב שסידני או מלבורן היא בירת אוסטרליה."
          - "קנברה נבחרה ב-1908 כפשרה מכוונת שנועדה ליישב את היריבות העזה בין שתי ערי הענק: סידני ומלבורן."
          - "העיר כולה תוכננה מראש על ידי האדריכלים האמריקאים וולטר ברלי גריפין ומריון מהוני גריפין, עם רשת רחובות מעגלית סביב אגם מלאכותי."
      - title: "אוטווה: הבחירה האסטרטגית של המלכה ויקטוריה"
        points:
          - "בירת קנדה היא אוטווה, ולא טורונטו (העיר הגדולה) או מונטריאול (המרכז התרבותי)."
          - "בשנת 1857, המלכה ויקטוריה בחרה בעיירת חוטבי העצים הקטנה אוטווה משום ששכנה בדיוק על הגבול שבין אונטריו דוברת האנגלית לקוויבק דוברת הצרפתית."
          - "בנוסף, מיקומה בעומק היבשה הרחק מגבול ארה״ב הפך אותה לקלה יותר להגנה צבאית מפני פלישה אפשרית."
      - title: "דרום אפריקה: מדינת שלוש ערי הבירה"
        points:
          - "דרום אפריקה היא המדינה היחידה בעולם המחזיקה בשלוש ערי בירה רשמיות, המחלקות ביניהן את רשויות השלטון:"
          - "1. פרטוריה: הבירה המנהלית והמבצעת (מושב הנשיא והממשלה)."
          - "2. קייפטאון: הבירה המחוקקת (מושב הפרלמנט)."
          - "3. בלומפונטיין: הבירה המשפטית (מושב בית המשפט העליון לערעורים)."
          - "יוהנסבורג היא העיר הגדולה והמרכז הכלכלי, אך אינה עיר בירה רשמית."
      - title: "ברזיליה: העיר בצורת המטוס"
        points:
          - "בשנת 1960 העבירה ברזיל את בירתה מריו דה ז'ניירו החופית אל העיר המתוכננת החדשה ברזיליה בעומק היבשה."
          - "המטרה הייתה לפתח את פנים הארץ הריק של ברזיל וליצור מרכז שלטוני ניטרלי ומודרני."
          - "העיר תוכננה על ידי מתכנן הערים לוסיו קוסטה והאדריכל הנודע אוסקר נימאייר, וממבט על היא מעוצבת בצורת מטוס ענק (או ציפור פורשת כנפיים)."
      - title: "ברן: הבירה דה-פקטו של שווייץ"
        points:
          - "לשווייץ אין מבחינה חוקית 'עיר בירה' רשמית בחוקה, שכן כל 26 הקנטונים נחשבים שווים לחלוטין."
          - "במקום זאת, העיר ברן משמשת כ'עיר פדרלית' (Bundesstadt) ובירה בפועל, המארחת את הפרלמנט והממשלה השוויצרית."
          - "ז'נבה מארחת את מטה האו״ם באירופה, בעוד ציריך היא המרכז הפיננסי הגדול."
    trivia:
      - type: multiple_choice
        question: "מדוע נבחרה העיר המתוכננת קנברה לשמש כבירת אוסטרליה?"
        options: ["כפשרה מכוונת לסיום היריבות בין סידני ומלבורן", "משום שהייתה המושבה הבריטית הראשונה שהוקמה ביבשת", "בגלל הנמל הטבעי העמוק והגדול ביותר שהיה בה", "בעקבות גילוי מכרות זהב עשירים בגבעות סביבה"]
        correct: 0
      - type: multiple_choice
        question: "כמה ערי בירה רשמיות יש למדינת דרום אפריקה?"
        options: ["שלוש (פרטוריה, קייפטאון ובלומפונטיין)", "אחת (יוהנסבורג)", "שתיים (דרבן ופרטוריה)", "אף אחת (היא פועלת ללא בירה רשמית)"]
        correct: 0
      - type: multiple_choice
        question: "לאיזו צורה גאומטרית מפורסמת דומה תוכנית המתאר העירונית של ברזיליה ממבט על?"
        options: ["מטוס (או ציפור ענקית)", "כוכב מושלם בעל חמישה קודקודים", "מעגלי מטרה קונצנטריים", "סהר ירח ענקי"]
        correct: 0
      - type: multiple_choice
        question: "מדוע בחרה המלכה ויקטוריה באוטווה כבירת קנדה בשנת 1857 במקום בטורונטו או מונטריאול?"
        options: ["היא שכנה על הגבול בין דוברי האנגלית והצרפתית והייתה בטוחה יותר מפלישה", "היא הייתה מקום הולדתו של ראש ממשלת קנדה הראשון", "הייתה בה האוכלוסייה הגדולה ביותר בצפון אמריקה", "הייתה בה תחנת הרכבת היחידה באותה תקופה"]
        correct: 0
      - type: multiple_choice
        question: "איזו עיר משמשת כבירה המחוקקת של דרום אפריקה ומארחת את הפרלמנט?"
        options: ["קייפטאון", "פרטוריה", "בלומפונטיין", "יוהנסבורג"]
        correct: 0
      - type: multiple_choice
        question: "מהי עיר הבירה של טורקיה?"
        options: ["אנקרה", "איסטנבול", "איזמיר", "אנטליה"]
        correct: 0
      - type: multiple_choice
        question: "מהי עיר הבירה של ניו זילנד?"
        options: ["וולינגטון", "אוקלנד", "קרייסטצ'רץ'", "קווינסטאון"]
        correct: 0
      - type: multiple_choice
        question: "מהי עיר הבירה של מרוקו?"
        options: ["רבאט", "קזבלנקה", "מרקש", "פאס"]
        correct: 0
      - type: multiple_choice
        question: "מהי הבירה הפדרלית הרשמית של ברזיל, שנחנכה בשנת 1960?"
        options: ["ברזיליה", "ריו דה ז'ניירו", "סאו פאולו", "סלבדור"]
        correct: 0
      - type: multiple_choice
        question: "איזו עיר מתפקדת כמושב הממשלה הפדרלית והבירה בפועל (דה-פקטו) של שווייץ?"
        options: ["ברן", "ציריך", "ז'נבה", "בזל"]
        correct: 0
      - type: multiple_choice
        question: "מהי עיר הבירה של איחוד האמירויות הערביות?"
        options: ["אבו דאבי", "דובאי", "שארג'ה", "דוחה"]
        correct: 0
      - type: multiple_choice
        question: "מהי עיר הבירה של סקוטלנד?"
        options: ["אדינבורו", "גלזגו", "אברדין", "דנדי"]
        correct: 0

  - id: microstates_extremes
    title: "מדינות זעירות ושיאים גאוגרפיים"
    description: >
      גלו את המדינות הקטנות בעולם, ערי הבירה הגבוהות ביותר ברכסי ההרים, 
      יישובי הקוטב הצפוניים ושיאים גאוגרפיים מדהימים.
    cards:
      - title: "קריית הוותיקן: המדינה הקטנה בתבל"
        points:
          - "הוותיקן היא המדינה הריבונית הקטנה ביותר בעולם, ומשתרעת על שטח של 0.49 קמ״ר בלבד (כ-120 דונם)."
          - "אוכלוסייתה מונה כ-800 תושבים, ואף אחד מהם אינו מקבל אזרחות מלידה; האזרחות מוענקת לפי מינוי ותפקיד בכנסייה הקתולית."
          - "יש לה תחנת רדיו, דואר, עיתון, בית מרקחת ומערכת בנקאית משלה, ושיעור הפשיעה לנפש בה הוא הגבוה בעולם עקב כייסות תיירים ברחבה."
      - title: "מונקו: מגרש המשחקים הצפוף והעשיר"
        points:
          - "מונקו היא המדינה העצמאית השנייה בקוטנה בעולם (כ-2 קמ״ר בלבד)—קטנה יותר מסנטרל פארק בניו יורק!"
          - "היא המדינה הצפופה ביותר בעולם, עם מעל 19,000 תושבים לכל קילומטר רבוע."
          - "כ-30% מתושבי מונקו הם מיליונרים, הנמשכים למדיניות של אפס מס הכנסה אישי ולאקלים הים-תיכוני."
      - title: "לה פאס וקיטו: בירות בגבהים"
