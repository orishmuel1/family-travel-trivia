  - id: symbols_traditions
    title: "סמלים לאומיים מוזרים ומסורות עולמיות"
    description: >
      גלו חיות לאומיות מיתולוגיות, המנונים מיוחדים במינם, מוטו לאומי 
      ומסורות תרבותיות מרתקות מרחבי תבל.
    cards:
      - title: "חיות לאומיות בלתי צפויות"
        points:
          - "החיה הלאומית הרשמית של סקוטלנד היא החד-קרן (Unicorn) המיתולוגי, שנבחר במיתולוגיה הקלטית בשל טוהרו, אצילותו ועצמאותו הבלתי מתפשרת (וכאויבו הטבעי של האריה האנגלי)."
          - "לוויילס יש את הדרקון האדום (Y Ddraig Goch) כסמלה המפורסם, המתנוסס בגאווה על דגלה הלאומי."
          - "מאוריציוס מכבדת בסמלה הלאומי את עוף הדודו (Dodo) שנכחד מן העולם."
          - "אוסטרליה מציגה את הקנגורו האדום ואת האמו על סמלה הלאומי משום שאף אחת משתי החיות אינה יכולה לנוע לאחור בקלות—סמל לאומה הצועדת תמיד קדימה."
      - title: "המנונים לאומיים עם טוויסט"
        points:
          - "ההמנון הלאומי של ספרד ('Marcha Real') הוא מהבודדים בעולם שאין להם מילים רשמיות כלל—הוא אינסטרומנטלי בלבד."
          - "מנגינת ההמנון הוותיקה ביותר היא 'הווילהלמוס' ההולנדית (נכתבה ב-1574)."
          - "ההמנון הלאומי של יוון ('המנון לחירות') הוא הארוך בעולם, ומורכב מ-158 בתים מדהימים!"
          - "ההמנון של יפן ('קימיגאיו') כולל את המילים העתיקות ביותר (מעל 1,000 שנה מתקופת הייאן) והוא גם מהקצרים בעולם."
      - title: "שיאי אזורי זמן"
        points:
          - "צרפת מחזיקה בשיא העולמי במספר אזורי הזמן—12 אזורי זמן שונים (מהאיים הקריביים, דרך האוקיינוס ההודי ועד לפולינזיה) הודות לטריטוריות שמעבר לים."
          - "רוסיה משתרעת על פני 11 אזורי זמן רצופים על פני גוש יבשתי יחיד מהים הבלטי ועד מצר ברינג."
          - "סין משתרעת גאוגרפית על פני 5 אזורי זמן, אך משתמשת רשמית באזור זמן יחיד לכל המדינה (שעון בייג'ינג, UTC+8)."
      - title: "עצים ופרחים לאומיים"
        points:
          - "הסמל הלאומי של קנדה הוא עלה עץ האדר (מייפל), המופיע בגאון על דגלה האדום-לבן מאז 1965."
          - "לבנון מציגה במרכז דגלה את עץ ארז הלבנון המלכותי, הנזכר עוד בספרי התנ״ך."
          - "יפן חוגגת את פריחת הדובדבן (סאקורה) כסמלה התרבותי הנערץ, המייצג את יופיים החולף של החיים."
      - title: "שיאים ומוזרויות של מדינות"
        points:
          - "באיסלנד אין צבא קבע, אין יתושים כלל, ושם נוסד הפרלמנט הוותיק בעולם שעדיין פעיל—האלת'ינגי (Althing) בשנת 930 לספירה."
          - "בהוטן היא המדינה היחידה בעולם המודדת את התקדמותה הלאומית לפי 'אושר לאומי גולמי' (GNH) במקום תוצר מקומי גולמי (GDP)."
          - "פפואה גינאה החדשה היא המדינה המגוונת ביותר מבחינה לשונית בעולם, עם מעל 840 שפות מקומיות מדוברות."
    trivia:
      - type: multiple_choice
        question: "איזה יצור מיתולוגי הוא בעל החיים הלאומי הרשמי של סקוטלנד?"
        options: ["החד-קרן (Unicorn)", "הגריפון", "המפלצת מלוך נס", "הדרקון היורק אש"]
        correct: 0
