- id: world_changing_inventions
  title: Inventions that Changed the World
  description: 'Massive technological leaps that fundamentally altered the fabric of human society.  Discover
    how these revolutionary ideas reshaped global communication, industry, transport, and daily life.

    '
  cards:
  - title: The Printing Press
    points:
    - Johannes Gutenberg invented the movable-type printing press around 1440 in Germany.
    - It allowed books to be mass-produced quickly, lowering costs and boosting literacy rates worldwide.
    - The first major book printed was the Gutenberg Bible, which became instantly famous.
    - It fueled the Scientific Revolution by allowing researchers to share discoveries widely.
  - title: The Steam Engine
    points:
    - James Watt vastly improved earlier steam engine designs in the late 18th century, making them practical.
    - It provided a reliable source of mechanical power that did not rely on wind, water, or horses.
    - The steam engine powered factories, trains, and ships, driving the Industrial Revolution.
    - It allowed cities and industries to expand rapidly away from natural waterways.
  - title: Harnessing Electricity
    points:
    - Benjamin Franklin proved lightning was electrical in 1752 using his famous kite experiment.
    - Michael Faraday discovered electromagnetic induction, leading to the creation of generators.
    - Thomas Edison developed the long-lasting incandescent light bulb, lighting up the night.
    - Electricity fundamentally transformed manufacturing, homes, safety, and nighttime activities.
  - title: The Automobile
    points:
    - Karl Benz is credited with inventing the first modern gas-powered automobile in 1886.
    - Henry Ford revolutionized manufacturing by using the assembly line to build affordable cars.
    - The Model T made personal car ownership possible for millions of average families.
    - Cars led to the construction of massive highway systems and redefined urban design.
  - title: Photography
    points:
    - Louis Daguerre introduced the daguerreotype in 1839, the first widely available photographic process.
    - Early photographs required long exposure times, meaning people had to sit perfectly still for minutes.
    - George Eastman invented roll film and the Kodak camera, bringing photography to the public.
    - It allowed history, family moments, and faraway places to be captured visually for the first time.
  - title: The Airplane
    points:
    - Orville and Wilbur Wright achieved the first powered, controlled, sustained heavier-than-air flight
      in 1903 at Kitty Hawk.
    - Their breakthrough was the three-axis control system, which allowed pilots to steer the aircraft
      in all directions.
    - Commercial aviation expanded rapidly after World War II, connecting distant continents in mere hours.
    - Air travel transformed tourism, international business, diplomacy, and global disaster relief.
  - title: The Transistor and Microchip
    points:
    - John Bardeen, Walter Brattain, and William Shockley invented the transistor at Bell Labs in 1947.
    - Transistors replaced bulky, fragile vacuum tubes, enabling compact electronics and computers.
    - Robert Noyce and Jack Kilby independently invented the integrated circuit (microchip) in the late
      1950s.
    - Microchips pack billions of tiny transistors onto a fingernail-sized piece of silicon, powering
      modern smart tech.
  - title: Radio and Wireless Communication
    points:
    - Heinrich Hertz proved the existence of electromagnetic radio waves in the late 1880s.
    - Guglielmo Marconi developed the first practical radio telegraph system, sending a transatlantic
      signal in 1901.
    - Radio became the primary medium for live news, entertainment, and maritime safety in the early 20th
      century.
    - It laid the physical foundation for television, radar, Wi-Fi, cell phone networks, and satellite
      communications.
  - title: Refrigeration
    points:
    - Before mechanical cooling, people relied on ice harvesting, cellars, and salt curing to prevent
      food spoilage.
    - Carl von Linde developed the first practical compressed ammonia refrigeration system in the 1870s.
    - Household electric refrigerators became common in the 1920s, drastically reducing foodborne illnesses.
    - Refrigerated transport ships and trucks created a global food supply chain, allowing fresh produce
      to travel worldwide.
  - title: The Moving Assembly Line
    points:
    - Henry Ford implemented the moving assembly line in 1913 at his Highland Park car plant.
    - It reduced the assembly time of a Model T car from over 12 hours down to just 93 minutes.
    - This massive leap in efficiency allowed Ford to drastically drop prices while doubling worker wages
      to $5 a day.
    - Assembly-line mass production became the blueprint for 20th-century consumer manufacturing worldwide.
