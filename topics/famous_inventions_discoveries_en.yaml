- id: everyday_objects
  title: Everyday Objects
  description: 'The incredible stories behind items we use every single day. From instant communication  to
    office stationery and zippers, find out how these modern conveniences came to be.

    '
  cards:
  - title: The Telephone
    points:
    - Alexander Graham Bell was granted the first official patent for the telephone in 1876.
    - His first famous spoken words through the machine were, 'Mr. Watson, come here, I want to see you.'
    - The invention converted spoken sound waves into electrical signals to travel along wires.
    - It allowed people to speak across cities and continents instantly, shrinking the world.
  - title: The Light Bulb
    points:
    - While many tried, Thomas Edison created the first commercially practical incandescent light bulb
      in 1879.
    - The key was finding a carbonized bamboo filament that could burn for over 1,200 hours without melting.
    - Edison also built an entire electrical grid system so homes could actually power their bulbs.
    - It freed human activity from the limits of daylight and replaced smelly gas lamps.
  - title: The Internet
    points:
    - The Internet began as ARPANET in the late 1960s, a military network funded by the US government.
    - Tim Berners-Lee invented the World Wide Web in 1989, making the internet easy for the public to
      use.
    - It allows computers across the globe to share data instantly through interconnected networks.
    - The internet fundamentally changed education, commerce, entertainment, and social interaction.
  - title: Canned Food
    points:
    - Nicolas Appert invented food canning in 1810 after a French military contest sought ways to preserve
      army rations.
    - He discovered that sealing food inside airtight glass jars and boiling them kept it from spoiling.
    - Amusingly, the tin can was invented shortly after, but the mechanical can opener wasn't invented
      until 50 years later!
    - It made long-distance travel, military campaigns, and modern grocery stores possible.
  - title: The Microwave Oven
    points:
    - Percy Spencer accidentally invented the microwave oven in 1945 while working on military radar equipment.
    - He noticed that radar waves had completely melted a chocolate bar inside his pocket.
    - The first food intentionally cooked with a microwave for testing was popcorn, followed immediately
      by an egg (which famously exploded in a colleague's face!).
    - It revolutionized home cooking by heating food molecules rapidly without warming the air around
      them.
  - title: The Zipper
    points:
    - Early clothing relied on tedious buttons, laces, and hooks that were slow to fasten.
    - Whitcomb Judson patented the 'clasp locker' in 1893, and Gideon Sundback perfected the modern interlocking
      teeth in 1913.
    - The B.F. Goodrich Company coined the catchy name 'zipper' in 1923 when they used it on rubber boots.
    - Today, billions of zippers are produced each year for clothing, luggage, camping gear, and spacesuits.
  - title: Hook and Loop Fasteners (Velcro)
    points:
    - Swiss engineer George de Mestral invented hook-and-loop fasteners in 1941 after a hunting walk with
      his dog.
    - He inspected the burdock burrs clinging stubbornly to his socks and his dog's fur under a microscope.
    - He observed hundreds of microscopic hooks that effortlessly gripped tiny loops in animal fur and
      fabric.
    - NASA popularized the fastener during the Apollo space missions to secure equipment in zero gravity.
  - title: Post-it Notes
    points:
    - In 1968, 3M chemist Spencer Silver accidentally created a unique, low-tack adhesive that peeled
      off cleanly.
    - Years later, his colleague Art Fry used the weak glue to keep bookmarks from falling out of his
      church hymnbook.
    - 3M launched Post-it Notes in 1980, and the canary-yellow squares became a worldwide office staple.
    - The iconic yellow color was a pure coincidence because the lab next door only had scrap yellow paper.
  - title: The Ballpoint Pen
    points:
    - Fountain pens often leaked, smudged easily, and needed frequent refilling from messy inkwells.
    - Hungarian journalist László Bíró noticed quick-drying newspaper ink and designed a tiny rotating
      metal ball socket in 1938.
    - British Royal Air Force pilots adopted Bíró pens during World War II because they did not leak at
      high altitudes.
    - Marcel Bich later streamlined manufacturing to create the ultra-affordable, ubiquitous BIC Cristal
      pen.
  - title: The Barcode
    points:
    - Norman Joseph Woodland and Bernard Silver invented the barcode in 1949, inspired by Morse code dots
      and dashes.
    - Woodland extended Morse code into thin and thick lines drawn in the sand on a Miami beach.
    - The first commercial item scanned by a laser barcode reader in 1974 was a pack of Wrigley's Juicy
      Fruit gum.
    - Barcodes and modern QR codes automated inventory, retail checkout, package shipping, and ticketing.
