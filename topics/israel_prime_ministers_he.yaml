id: israeli_prime_ministers_he
title: ראשי ממשלת ישראל
description: >
  מסע היסטורי בעקבות מנהיגי מדינת ישראל, מהקמת המדינה ועד לימינו. גלו את חייהם הייחודיים,
  הרגעים המכריעים וההשפעה המתמשכת של האישים שהחזיקו בתפקיד הרם ביותר בהנהגת המדינה. הפעילות מושלמת לכל
  המשפחה כדי ללמוד יחד על מנהיגות, היסטוריה ואתגרים לאומיים.
lang: he
audience: family
categories:
  - id: important_facts
    title: עובדות חשובות
    description: >
      מבט כרונולוגי מלא על כל אדם שכיהן בתפקיד ראש ממשלת ישראל. קראו יחד את נקודות המבט האישיות
      וההיסטוריות המרתקות הללו כדי לגלות את הסיפורים הייחודיים מאחורי כל אחד מהמנהיגים, לפני שתבחנו את
      הידע שלכם בסבב הטריוויה.
    cards:
      - title: דוד בן-גוריון
        points:
          - "דוד בן-גוריון היה ראש הממשלה הראשון של מדינת ישראל והאיש שהכריז על הקמתה בה' באייר תש״ח."
          - "הוא האמין בכל ליבו בחזון הפרחת השממה ועבר להתגורר בקיבוץ שדה בוקר שבנגב."
          - "בן-גוריון נולד בפולין בשם דוד גרין, ושינה את שמו על שמו של יוסף בן-גוריון, ממנהיגי המרד הגדול ברומאים."
          - "הוא עמד בראש המדינה במהלך מלחמת העצמאות והוביל את גלי העלייה ההמוניים בשנותיה הראשונות."
      - title: משה שרת
        points:
          - "משה שרת היה ראש הממשלה השני של ישראל, וכיהן בתפקיד במשך כשנתיים בין כהונותיו של בן-גוריון."
          - "הוא היה שר החוץ הראשון של המדינה ונחשב לאדריכל הדיפלומטיה הישראלית ולקו המדיני המתון."
          - "שרת היה בלשן מושבע ששלט באופן שוטף בשש שפות, וחידש מילים רבות בעברית המודרנית."
          - "חתימתו מופיעה על מגילת העצמאות, ודיוקנו עיטר בעבר את שטר 20 השקלים של בנק ישראל."
      - title: לוי אשכול
        points:
          - "לוי אשכול כיהן כראש הממשלה השלישי והוביל את המדינה לניצחון הצבאי המכריע במלחמת ששת הימים."
          - "הוא הוביל את הקמת מוביל המים הארצי, שחיבר את מי הכנרת לחבלי הדרום הצחיחים."
          - "אשכול נודע בחוש הומור ייחודי ובסגנון הנהגה שקול ומפשר שדגל בהידברות וגישור."
          - "הוא היה ראש הממשלה הישראלי הראשון שנפטר בעת כהונתו, מהתקף לב בשנת 1969."
      - title: גולדה מאיר
        points:
          - "גולדה מאיר הייתה האישה הראשונה והיחידה עד כה שכיהנה כראש ממשלת ישראל."
          - "היא נולדה באוקראינה והיגרה בנעוריה לארצות הברית, ולכן דיברה עברית במבטא אמריקאי מובהק."
          - "הנהגתה עמדה למבחן הגדול ביותר במהלך מלחמת יום הכיפורים בשנת 1973, משבר שטלטל את המדינה."
          - "המונח 'המטבחון של גולדה' נולד מהמפגשים הבלתי רשמיים שקיימה עם שרים במטבח ביתה."
      - title: יצחק רבין
        points:
          - "יצחק רבין היה ראש הממשלה הראשון שנולד בארץ ישראל (יליד ירושלים) והראשון שצמח בשדרת הפיקוד של צה״ל."
          - "הוא כיהן בשתי כהונות נפרדות, ובמהלך כהונתו השנייה חתם על הסכמי אוסלו ועל הסכם השלום עם ירדן."
          - "רבין זכה בפרס נובל לשלום בשנת 1994 יחד עם שמעון פרס ויאסר ערפאת על קידום השלום."
          - "חייו נקטעו ב-4 בנובמבר 1995 כאשר נרצח בתום עצרת שלום בכיכר מלכי ישראל בתל אביב."
      - title: מנחם בגין
        points:
          - "מנחם בגין היה ראש הממשלה הראשון מטעם מפלגת הליכוד, וסיים 29 שנות שלטון רצופות של תנועת העבודה."
          - "הוא חתם על הסכם השלום ההיסטורי הראשון של ישראל עם מדינה ערבית — הסכם השלום עם מצרים ב-1979."
          - "בגין היה נואם מחונן וכריזמטי שזכה לאהדה עצומה, בייחוד בקרב תושבי עיירות הפיתוח והפריפריה."
          - "הוא חלק את פרס נובל לשלום עם אנואר סאדאת, והתפטר ב-1983 במילים המפורסמות 'איני יכול עוד'."
      - title: יצחק שמיר
        points:
          - "יצחק שמיר כיהן כראש הממשלה השביעי, והיה מפקד מחתרת לח״י ואיש מוסד בכיר בעברו."
          - "הוא נודע בעקשנותו הרבה, באידאולוגיה בלתי מתפשרת של ארץ ישראל השלמה ובסגנון חיים צנוע וספרטני."
          - "במהלך מלחמת המפרץ ב-1991 שמר על מדיניות הבלגה למרות ירי טילי סקאד, כדי לא לפגוע בקואליציה הבינלאומית."
          - "הוא הוביל את המשלחת הישראלית לוועידת מדריד ההיסטורית, שפתחה שיחות שלום ישירות עם מדינות ערב."
      - title: שמעון פרס
        points:
          - "שמעון פרס כיהן כראש ממשלה בשתי תקופות נפרדות, אך מעולם לא ניצח במערכת בחירות ישירות לתפקיד."
          - "הוא נחשב לאחד מאבות תעשיית הביטחון בישראל וכיהן כמעט בכל תפקיד ציבורי בכיר, כולל נשיא המדינה."
          - "הוא הוביל את תוכנית הייצוב הכלכלית של 1985 שהצילה את כלכלת ישראל מהיפר-אינפלציה דוהרת."
          - "כחתן פרס נובל לשלום, הקדיש את שנותיו המאוחרות לקידום חדשנות טכנולוגית ומיזמי שלום אזוריים."
      - title: בנימין נתניהו
        points:
          - "בנימין נתניהו הוא ראש הממשלה בעל תקופת הכהונה הארוכה ביותר בתולדות ישראל, ועקף את דוד בן-גוריון."
          - "הוא היה ראש הממשלה הצעיר ביותר שנבחר לתפקיד (בן 46) והראשון שנבחר בבחירות ישירות בשנת 1996."
          - "לפני כניסתו לפוליטיקה שירת כקצין בסיירת מטכ״ל והשלים לימודים אקדמיים ב-MIT שבארצות הברית."
          - "בתקופת כהונתו נחתמו 'הסכמי אברהם' לנורמליזציה עם איחוד האמירויות, בחריין, מרוקו וסודאן."
      - title: אהוד ברק
        points:
          - "אהוד ברק נכנס לפוליטיקה לאחר קריירה צבאית מפוארת, והוא החייל המעוטר ביותר בתולדות צה״ל."
          - "במהלך כהונתו בשנת 2000 הוביל את הנסיגה המלאה של צה״ל מרצועת הביטחון בדרום לבנון."
          - "הוא הוביל את משלחת ישראל לוועידת קמפ דייוויד עם יאסר ערפאת והנשיא ביל קלינטון במטרה להגיע להסדר קבע."
          - "ברק מחזיק בתארים מתקדמים בפיזיקה ובניתוח מערכות מאוניברסיטת סטנפורד בארצות הברית."
      - title: אריאל שרון
        points:
          - "אריאל שרון, שכונה 'הבולדוזר', היה אלוף מהולל שהוביל את צליחת תעלת סואץ במלחמת יום הכיפורים."
          - "כראש ממשלה קיבל את ההחלטה הדרמטית על תוכנית ההתנתקות בשנת 2005 ופינוי יישובי רצועת עזה."
          - "הוא ייסד את מפלגת המרכז 'קדימה' לאחר שפרש מהליכוד על רקע התנגדות חבריו לתוכנית ההתנתקות."
          - "כהונתו נקטעה בפתאומיות בינואר 2006 לאחר שלקה בשבץ מוחי חמור ושקע בתרדמת שנמשכה שמונה שנים."
      - title: אהוד אולמרט
        points:
          - "אהוד אולמרט מונה לראש ממשלה בפועל לאחר מחלתו של שרון, ובהמשך ניצח בבחירות בראשות מפלגת קדימה."
          - "הוא ניהל את מלחמת לבנון השנייה בשנת 2006 בעקבות חטיפת שני חיילי צה״ל בגבול הצפון."
          - "בהוראתו החשאית השמיד חיל האוויר הישראלי את הכור הגרעיני הסורי בדיר א-זור בשנת 2007."
          - "הוא היה ראש הממשלה הישראלי הראשון שנאלץ לרצות עונש מאסר בפועל בעקבות הרשעות בפלילים."
      - title: נפתלי בנט
        points:
          - "נפתלי בנט כיהן כראש הממשלה ה-13 ועמד בראש 'ממשלת החילופים' הראשונה שגישרה על פערים פוליטיים רחבים."
          - "לפני כניסתו לחיים הציבוריים היה יזם הייטק מצליח שהקים ומכר חברת אבטחת מידע במיליוני דולרים."
          - "הוא שירת כמפקד צוות בסיירת מטכ״ל וביחידת מגלן, והיה ראש הממשלה הראשון שחבש כיפה באופן קבוע."
          - "במהלך כהונתו הוביל מדיניות של 'חיים לצד הקורונה' תוך הימנעות מהטלת סגרים ארציים."
      - title: יאיר לפיד
        points:
          - "יאיר לפיד כיהן כראש הממשלה ה-14 במסגרת הסכם הרוטציה, והוביל את המדינה בתקופת מעבר לבחירות."
          - "לפני פנייתו לפוליטיקה היה עיתונאי, סופר, ומגיש מהדורת החדשות המרכזית בטלוויזיה."
          - "במהלך כהונתו ניהל את מבצע 'עלות השחר' ברצועת עזה וחתם על הסכם הגבול הימי עם לבנון."
          - "הוא המייסד והיו״ר של מפלגת 'יש עתיד', אותה הקים בשנת 2012 והפך לכוח פוליטי מוביל."
