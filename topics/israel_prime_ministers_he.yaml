  - id: wars_and_conflict
    title: מלחמות ועימותים
    description: >
      מבט מעמיק על האופן שבו מנהיגי המדינה ניהלו משברים צבאיים עצומים, מלחמות קיומיות
      והחלטות אסטרטגיות גורליות. למדו כיצד הכרעותיהם בשדה הקרב ובחדרי המצב שינו את פני המזרח התיכון.
    cards:
      - title: דוד בן-גוריון
        points:
          - "הוביל את המדינה הצעירה במהלך מלחמת העצמאות ב-1948 מול פלישת צבאות ערב."
          - "קיבל את ההחלטה ההיסטורית על פירוק המחתרות והקמת צה״ל כצבא עם ממלכתי ומאוחד."
          - "יזם וניהל את מלחמת סיני (מבצע קדש) בשנת 1956 בתיאום חשאי עם בריטניה וצרפת."
          - "התווה את תפיסת הביטחון של ישראל המבוססת על הרתעה, התרעה והכרעה מהירה בשטח האויב."
      - title: לוי אשכול
        points:
          - "כיהן כראש הממשלה ושר הביטחון בתקופת ההמתנה המתוחה שלפני מלחמת ששת הימים בשנת 1967."
          - "למרות לחצים כבדים, המתין עם היציאה למלחמה עד להבטחת גיבוי מדיני והשלמת מוכנות חיל האוויר."
          - "אישר את מכת המנע המוחצת במבצע 'מוקד' שהשמידה את חילות האוויר של האויב על הקרקע תוך שעות."
          - "תחת הנהגתו איחדה ישראל את ירושלים וקיבלה שליטה ביהודה ושומרון, רצועת עזה ורמת הגולן."
      - title: גולדה מאיר
        points:
          - "הנהיגה את המדינה במהלך מלחמת יום הכיפורים באוקטובר 1973, שנפתחה במתקפת פתע של מצרים וסוריה."
          - "קיבלה את ההחלטה הקשה שלא לצאת למכת מנע מקדימה, כדי להבטיח את הרכבת האווירית והסיוע של ארצות הברית."
          - "הובילה את המדינה ברגעי המשבר הקשים של תחילת הלחימה ועד למהפך הצבאי וכיתור הארמייה השלישית."
          - "הורתה על הקמת ועדת אגרנט לחקירת הכשל המודיעיני והמבצעי שהוביל להפתעת המלחמה."
      - title: מנחם בגין
        points:
          - "אישר בשנת 1981 את 'מבצע אופרה' — תקיפת חיל האוויר שהשמידה את הכור הגרעיני העיראקי 'אוזירק'."
          - "הוביל את היציאה למלחמת לבנון הראשונה (מבצע שלום הגליל) ב-1982 למיגור קיני הטרור מעבר לגבול."
          - "המלחמה בלבנון הלכה והסתבכה, וגבתה מחיר דמים כבד שחולל מחאה ציבורית וטלטלה עמוקה."
          - "ניסח את 'דוקטרינת בגין' הקובעת כי ישראל לא תאפשר לשום משטר עוין באזור להשיג נשק להשמדה המונית."
      - title: יצחק רבין
