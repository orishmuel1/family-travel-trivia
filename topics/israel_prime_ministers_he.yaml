  - id: lasting_legacy
    title: מורשת מתמשכת
    audience: adult
    description: >
      סיור בעקבות המוסדות, חוקי היסוד, ההסכמים הבינלאומיים והתשתיות הלאומיות שקיימים עד היום
      בזכות פועלם של מנהיגים אלו. ראו כיצד החלטותיהם עיצבו את דמותה של החברה הישראלית המודרנית.
    cards:
      - title: דוד בן-גוריון
        points:
          - "הניח את היסודות למערכת החינוך הממלכתית וביטל את זרמי החינוך המפלגתיים שהיו נהוגים קודם לכן."
          - "נמל התעופה הבינלאומי הראשי של ישראל (נתב״ג) ואוניברסיטת בן-גוריון בנגב קרויים על שמו."
          - "גיבש את הסדר ה'סטטוס קוו' בנושאי דת ומדינה, המגדיר את יחסי הדת והמדינה בישראל עד היום."
          - "חזונו לפיתוח המדע והמחקר סייע בבניית מוסדות שהפכו את ישראל למעצמת מחקר ופיתוח."
      - title: מנחם בגין
