  - type: multiple_choice
    question: What ancient base-60 numerical system invented by the Sumerians still
      influences how we measure time and angles today?
    options:
    - The sexagesimal system
    - The binary system
    - The decimal system
    - The duodecimal system
    correct: 0
    explanation: Sumerians developed the sexagesimal (base-60) system, which directly
      led to our modern convention of 60 seconds in a minute, 60 minutes in an hour,
      and 360 degrees in a circle.
  - type: multiple_choice
    question: What writing system developed in Sumer around 3400 BCE utilized wedge-shaped
