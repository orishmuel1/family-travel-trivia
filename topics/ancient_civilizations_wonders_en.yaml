    correct: 0
    explanation: Historians and surveyors calculate that the Great Pyramid consists
      of approximately 2.3 million limestone and granite blocks, weighing around 6
      million tons total.
  - type: multiple_choice
    question: What naturally occurring mineral salt was used to desiccate corpses
      during the 70-day Egyptian mummification process?
    options:
    - Natron
    - Alum
    - Potash
    - Gypsum
    correct: 0
    explanation: Natron, a natural compound of sodium carbonate and sodium bicarbonate
      harvested from dry lake beds, acted as a powerful drying and disinfecting agent.
  - type: multiple_choice
    question: Which organ did ancient Egyptian embalmers leave inside the mummified
      body for judgment in the afterlife?
    options:
    - The Heart
    - The Brain
    - The Liver
    - The Stomach
    correct: 0
    explanation: The heart was considered the seat of intelligence, conscience, and
      memory, and was required during the Weighing of the Heart ritual in the Underworld.
  - type: multiple_choice
    question: What mythical guardian on the Giza plateau combines the body of a lion
