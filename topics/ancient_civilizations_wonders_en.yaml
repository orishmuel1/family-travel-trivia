    options:
    - Hatshepsut
    - Nefertiti
    - Cleopatra VII
    - Twosret
    correct: 0
    explanation: Hatshepsut ruled Egypt with immense success during the 18th Dynasty,
      immortalizing her reign with her three-tiered mortuary colonnade at Deir el-Bahari.
  - type: multiple_choice
    question: Which exotic African trade kingdom did Hatshepsut's celebrated maritime
      expedition visit to acquire living myrrh trees?
    options:
    - The Land of Punt
    - The Kingdom of Kush
    - Carthage
    - Numidia
    correct: 0
    explanation: Temple reliefs vividly document the fleet returning from Punt (believed
      to be modern Somalia or Eritrea) bearing frankincense trees, ebony, gold, and
      baboons.
  - type: multiple_choice
    question: Which long-reigning pharaoh commissioned the colossal rock-cut temples
      of Abu Simbel in southern Nubia?
    options:
    - Ramses II
    - Thutmose III
    - Amenhotep III
    - Seti I
    correct: 0
    explanation: Ramses II (Ramses the Great) reigned for 66 years and ordered the
      carving of Abu Simbel directly into the cliff faces along the southern Nubian
      frontier.
  - type: multiple_choice
    question: What ancient battle between Ramses II and the Hittites resulted in history's
      first known written peace treaty?
    options:
    - The Battle of Kadesh
    - The Battle of Megiddo
    - The Battle of Actium
    - The Battle of Pelusium
    correct: 0
    explanation: Fought around 1274 BCE, the Battle of Kadesh ended in a tactical
      stalemate, leading to the landmark Egyptian-Hittite peace treaty inscribed in
      hieroglyphs and cuneiform.
  - type: multiple_choice
    question: In what year and month did Howard Carter discover the entrance steps
      to King Tutankhamun's tomb (KV62)?
    options:
    - November 1922
    - July 1911
    - December 1898
    - March 1935
    correct: 0
    explanation: On November 4, 1922, Carter's water boy stumbled upon a stone step
      hidden beneath ancient worker huts in the Valley of the Kings.
  - type: multiple_choice
    question: Which three scripts were carved onto the Rosetta Stone, allowing linguists
      to finally decipher hieroglyphics?
    options:
    - Hieroglyphic, Demotic, and Ancient Greek
    - Hieroglyphic, Cuneiform, and Latin
    - Hieratic, Hebrew, and Phoenician
    - Hieroglyphic, Aramaic, and Coptic
    correct: 0
    explanation: The decree was engraved in sacred Hieroglyphic, administrative Demotic,
      and royal Ancient Greek, providing the essential bilingual key.
  - type: multiple_choice
    question: Which brilliant French linguist cracked the code of the Rosetta Stone
      and unlocked hieroglyphs in 1822?
    options:
    - Jean-Francois Champollion
    - Thomas Young
    - Gaston Maspero
    - Auguste Mariette
    correct: 0
    explanation: Jean-Francois Champollion recognized that oval cartouches spelled
      phonetic royal names like Ptolemy and Cleopatra, deciphering the grammatical
      script in 1822.
  - type: multiple_choice
    question: What royal family dynasty ruled Egypt from Alexander the Great's death
      until the suicide of Cleopatra VII in 30 BCE?
    options:
    - The Ptolemaic Dynasty
    - The Seleucid Dynasty
    - The Achaemenid Dynasty
    - The Julio-Claudian Dynasty
    correct: 0
    explanation: Founded by Ptolemy I Soter, one of Alexander the Great's top Macedonian
      generals, the Ptolemaic dynasty governed Egypt for nearly three centuries.
  - type: multiple_choice
    question: At which decisive naval battle in 31 BCE were the combined fleets of
      Cleopatra and Mark Antony defeated by Octavian?
    options:
    - The Battle of Actium
    - The Battle of Salamis
    - The Battle of Lepanto
    - The Battle of Pharsalus
    correct: 0
    explanation: The Battle of Actium off western Greece marked the end of the Roman
      civil war and led directly to the annexation of Egypt into the Roman Empire.
- id: greco_roman_classical_masterpieces
  title: 3. Greco-Roman Masterpieces & Engineering
  description: 'Architectural harmony and monumental Roman civil engineering: the
    Parthenon, Colosseum combat arena, Pantheon concrete dome, gravity aqueducts,
    and Delphi.'
  cards:
  - id: parthenon_acropolis_athens
    title: The Parthenon & The Golden Age of Athens
    points:
    - Crowning the Acropolis of Athens, the Parthenon was completed in 438 BCE under
      the statesman Pericles as a temple dedicated to Athena Parthenos.
    - Engineered by architects Ictinus and Callicrates under the artistic supervision
      of master sculptor Phidias, it represents the pinnacle of Doric order harmony.
    - 'The building incorporates deliberate optical corrections (entasis): the stylobate
      floor curves upward and exterior columns tilt slightly inward to appear straight
      to the eye.'
    - The sanctuary housed Phidias's colossal 38-foot chryselephantine (gold and ivory)
      statue of Athena, who held a six-foot figure of winged Nike (Victory) in her
      palm.
  - id: colosseum_flavian_amphitheatre
    title: 'The Colosseum: Arena of the Gladiators'
    points:
    - Commissioned by Emperor Vespasian in 72 CE and inaugurated by his son Titus
      in 80 CE, the amphitheatre was officially designated the Flavian Amphitheatre.
    - It seated over 50,000 spectators across four tiered seating arcades, with 76
      numbered ground-level vomitoria exits allowing total evacuation in under 15
      minutes.
    - It was deliberately constructed over the drained artificial lake of Nero's reviled
      Golden House (Domus Aurea), returning confiscated land to Roman public recreation.
    - 'Beneath the sand-covered wooden arena floor lay the Hypogeum: a subterranean
      complex of cages, corridors, and 28 counterweight elevators used to hoist gladiators
      and wild animals.'
  - id: pantheon_dome_roman_concrete
    title: The Pantheon & The Unreinforced Concrete Dome
    points:
    - Originally commissioned by Marcus Agrippa and rebuilt in its present circular
      rotunda form by Emperor Hadrian around 125 CE, the Pantheon honors all gods.
    - To this day, it remains the world's largest unreinforced solid concrete dome,
      spanning 43.3 meters (142 feet) with diameter exactly matching interior height.
    - Roman engineers reduced the dome's colossal weight by mixing dense basalt in
      the foundation, lighter volcanic tuff in the middle, and porous pumice at the
      summit.
    - The oculus—an open 9-meter circular aperture at the apex—serves as the sole
      natural light source; rainwater falling onto the floor drains through 22 concealed
      holes.
  - id: roman_aqueducts_pont_du_gard
    title: 'Roman Aqueducts: Taming Gravity & Water'
    points:
    - Roman civil engineers transported millions of gallons of fresh alpine spring
      water daily into imperial cities relying entirely on continuous downward gravity
      gradients.
    - The Pont du Gard in southern France is a 3-tier arched limestone bridge standing
      49 meters high, descending merely 17 meters over its entire 50-kilometer path
      (a 1:3000 gradient).
    - Constructed without mortar, its massive shelly limestone blocks were cut with
      microscopic precision and hoisted by human treadmill cranes to withstand flash
      river floods.
    - Aqueduct networks supplied public baths, heated thermal spas, public fountains,
      private villas, and flushed municipal sewage through underground cloacae.
  - id: pompeii_herculaneum_vesuvius_time_capsule
    title: 'Pompeii & Herculaneum: Frozen in Ash'
    points:
    - In 79 CE, Mount Vesuvius erupted catastrophically, burying the Roman resort
      towns of Pompeii and Herculaneum under meters of scorching pumice and volcanic
      ash.
    - The sudden pyroclastic burial created an unparalleled archaeological time capsule,
      preserving street taverns, frescoed villas, bakeries with carbonized bread,
      and political graffiti.
    - In the 1860s, Italian archaeologist Giuseppe Fiorelli pioneered the technique
      of pumping liquid plaster into voids left by decomposed organic matter, creating
      realistic victim casts.
    - Neighboring Herculaneum was sealed by boiling volcanic mud, miraculously preserving
      delicate organic wood furniture, staircases, and over 1,800 intact papyrus scrolls.
  - id: appian_way_roman_roads
    title: 'The Appian Way: Queen of Long-Distance Roads'
    points:
    - Initiated in 312 BCE by censor Appius Claudius Caecus, the Via Appia was Rome's
      first major paved military highway, extending from the Forum south to the port
      of Brindisi.
    - Roads were built in deep trenches filled with layered gravel, sand, and mortar,
      surfaced with tightly interlocking polygonal flagstones of volcanic basalt.
    - The roadbed was deliberately cambered (crowned) in the center so rain drained
      into parallel ditches, ensuring Roman legions could march rapidly in all seasons.
    - Roman roads spanned over 50,000 miles across the empire, facilitating military
      mobilization, commercial freight, and imperial couriers (cursus publicus).
  - id: oracle_of_delphi_apollo_sanctuary
    title: 'The Oracle of Delphi: Navel of the Greek World'
    points:
    - Nestled on the rugged slopes of Mount Parnassus, Delphi was revered as the spiritual
      center of the classical world, marked by the sacred omphalos stone ('navel of
      the earth').
    - The Pythia (high priestess of Apollo) delivered prophecies while seated over
      a chasm in the temple's inner sanctum, intoxicated by hydrocarbon vapors rising
      from geological fault lines.
    - Kings, military commanders, and philosophers traveled from across the Mediterranean
      to consult the Oracle before launching wars or drafting constitutions.
    - Delphi was also the home of the quadrennial Pythian Games, celebrating poetic,
      musical, and athletic competitions in honor of Apollo's victory over the serpent
      Python.
  - id: library_of_alexandria_lighthouse_pharos
    title: 'Alexandria: The Great Library & Pharos Lighthouse'
    points:
    - Established around 300 BCE by Ptolemy I, the Great Library of Alexandria aimed
      to collect every manuscript in the world, holding up to 400,000 papyrus scrolls.
    - Customs officials confiscated books on arriving commercial ships; royal scribes
      copied the texts, returning the copies to owners and keeping originals for the
      library.
    - The nearby Lighthouse of Pharos stood over 100 meters tall at the harbor entrance,
      guiding ships across the Mediterranean using an open fire amplified by curved
      bronze mirrors.
    - 'Both Hellenistic wonders succumbed to historical disasters: the library suffered
      fire damage and neglect, while Pharos was toppled by medieval earthquakes.'
  - id: statue_of_zeus_olympia
    title: 'The Statue of Zeus at Olympia: Lord of the Games'
    points:
    - Crafted around 435 BCE by Athenian master sculptor Phidias inside the Temple
      of Zeus at Olympia, this wonder honored the birthplace of the ancient Olympic
      Games.
    - Standing 12 meters (40 feet) tall, it depicted the king of the gods seated majestically
      on an elaborate cedar throne inlaid with ebony, ivory, and precious jewels.
    - 'The statue was sculpted using the chryselephantine technique: Zeus''s skin
      was formed from carved polished elephant ivory, while his drapery and sandals
      were hammered gold sheet.'
    - In his right hand Zeus cradled a life-sized statue of winged victory (Nike),
      and in his left an eagle-crested royal scepter; the masterpiece was lost to
      fire in the 5th century CE.
  - id: colossus_of_rhodes
    title: 'The Colossus of Rhodes: Titan of the Harbor'
    points:
    - Erected on the Aegean island of Rhodes around 280 BCE, this colossal bronze
      statue celebrated the island's heroic defense against a massive Macedonian siege.
    - Sculpted by Chares of Lindos, it portrayed the sun god Helios standing approximately
      33 meters (108 feet) high—matching the height of the modern Statue of Liberty.
    - It was engineered with cast bronze plates riveted over an interior iron framework
      and weighted with stone blocks, funded by selling captured siege engines.
    - Contrary to medieval artistic myths of straddling the harbor entrance, it stood
      on land; it fell after only 54 years when a violent earthquake snapped its knees
      in 226 BCE.
  trivia:
  - type: multiple_choice
    question: Which Athenian statesman commissioned the reconstruction of the Parthenon
      on the Acropolis during the 5th century BCE?
    options:
    - Pericles
    - Themistocles
    - Solon
    - Alcibiades
    correct: 0
    explanation: Pericles led the Golden Age of Athens and directed state funds to
      rebuild the Acropolis temples destroyed by the Persian Empire.
  - type: multiple_choice
    question: What is the architectural term for the subtle convex curving of columns
      used on the Parthenon to counteract optical illusions?
    options:
    - Entasis
    - Triglyph
    - Caryatid
    - Pediment
    correct: 0
    explanation: Entasis is the deliberate slight swelling of column shafts that prevents
      them from appearing concave or pinched to human eyes from a distance.
  - type: multiple_choice
    question: What was the official imperial name of the Colosseum in Rome when it
      was inaugurated under Emperor Titus in 80 CE?
    options:
    - The Flavian Amphitheatre
    - The Circus Maximus
    - The Theatre of Marcellus
    - The Curia Julia
    correct: 0
    explanation: Constructed under Emperors Vespasian and Titus of the Flavian dynasty,
      the amphitheatre was officially known as the Amphitheatrum Flavium.
  - type: multiple_choice
    question: What was the subterranean network of cages, trap doors, and elevators
      beneath the Colosseum arena floor called?
    options:
    - The Hypogeum
    - The Velarium
    - The Vomitorium
    - The Spina
    correct: 0
    explanation: The Hypogeum ('under the earth') was a two-level underground staging
      area where gladiators, stage scenery, and wild animals were prepped and hoisted.
  - type: multiple_choice
    question: Which Roman emperor rebuilt the Pantheon in Rome in its celebrated circular
      rotunda form around 125 CE?
    options:
    - Hadrian
    - Nero
    - Augustus
    - Trajan
    correct: 0
    explanation: Emperor Hadrian rebuilt the Pantheon around 125 CE with its revolutionary
      unreinforced concrete dome, retaining Agrippa's original inscription on the
      portico.
  - type: multiple_choice
    question: What is the open 9-meter circular skylight at the apex of the Pantheon's
      dome called?
    options:
    - The Oculus
    - The Coffering
    - The Rotunda
    - The Tympanum
    correct: 0
    explanation: The Oculus (Latin for 'eye') is a circular 9-meter opening at the
      dome's peak that admits natural sunlight and rain into the sanctuary.
  - type: multiple_choice
    question: Which breathtaking three-tier Roman aqueduct bridge in southern France
      crosses the Gardon river without using mortar?
    options:
    - Pont du Gard
    - Aqueduct of Segovia
    - Aqua Claudia
    - Valens Aqueduct
    correct: 0
    explanation: The Pont du Gard is a masterwork of Roman hydraulic engineering,
      built from massive dry-stone limestone blocks held solely by precision friction
      and gravity.
  - type: multiple_choice
    question: Which volcanic eruption in 79 CE engulfed the Roman cities of Pompeii
      and Herculaneum in ash and mud?
    options:
    - Mount Vesuvius
    - Mount Etna
    - Mount Stromboli
    - Santorini (Thera)
    correct: 0
    explanation: Mount Vesuvius on the Gulf of Naples erupted catastrophically in
      79 CE, flash-freezing Roman daily life beneath volcanic deposits.
  - type: multiple_choice
    question: Which 19th-century Italian archaeologist invented the technique of creating
      plaster casts of victims preserved in Pompeii's ash?
    options:
    - Giuseppe Fiorelli
    - Amedeo Maiuri
    - Giacomo Boni
    - Rodolfo Lanciani
    correct: 0
    explanation: In 1863, Giuseppe Fiorelli realized that hollow pockets in the ash
      held decomposed human and animal remains, filling them with plaster to capture
      final moments.
  - type: multiple_choice
    question: What was the celebrated first paved Roman military highway, nicknamed
      the 'Queen of Long-Distance Roads'?
    options:
    - The Appian Way (Via Appia)
    - The Flaminian Way (Via Flaminia)
    - The Aurelian Way (Via Aurelia)
    - The Salarian Way (Via Salaria)
    correct: 0
    explanation: Commissioned by censor Appius Claudius Caecus in 312 BCE, the Via
      Appia was celebrated as 'Regina Viarum' (Queen of Roads), linking Rome to southern
      ports.
  - type: multiple_choice
    question: Which Greek god was worshipped at the sanctuary of Delphi, where the
      Pythia delivered oracular prophecies?
    options:
    - Apollo
    - Dionysus
    - Poseidon
    - Hermes
    correct: 0
    explanation: Delphi was sacred to Apollo, god of music, truth, and prophecy, who
      was said to have slain the serpent Python on Mount Parnassus.
  - type: multiple_choice
    question: What natural geological phenomenon is believed to have induced the trance-like
      prophetic states of the Pythia at Delphi?
    options:
    - Hydrocarbon gas vapors (such as ethylene) rising from tectonic fault fissures
    - Volcanic sulfur fumes from underground magma chambers
    - Drinking thermal radioactive mineral water
    - Inhaling burning poppy seeds and frankincense
    correct: 0
    explanation: Geological surveys confirmed two intersecting tectonic fault lines
      beneath the temple releasing sweet-smelling ethylene gas, known to produce euphoric
      trances.
  - type: multiple_choice
    question: Where was the colossal chryselephantine Statue of Zeus sculpted by Phidias
      housed?
    options:
    - Olympia
    - Athens
    - Sparta
    - Corinth
    correct: 0
    explanation: Phidias built his workshop at Olympia to construct the 12-meter-tall
      statue of seated Zeus inside the sanctuary that hosted the ancient Olympic Games.
  - type: multiple_choice
    question: What Greek deity was depicted by the 33-meter-tall bronze Colossus of
      Rhodes?
    options:
    - Helios (the Sun god)
    - Ares (the God of War)
    - Zeus (King of the Gods)
    - Hephaestus (God of Blacksmiths)
    correct: 0
    explanation: The Colossus honored Helios, the patron solar god of Rhodes, commissioned
      after the island successfully repelled a massive siege by Demetrius Poliorcetes.
  - type: multiple_choice
    question: How long did the Colossus of Rhodes stand before being toppled by a
      devastating earthquake in 226 BCE?
    options:
    - 54 years
    - 500 years
    - 1,000 years
    - 12 years
    correct: 0
    explanation: Erected around 280 BCE, the Colossus snapped at its knees during
      an earthquake in 226 BCE, remaining fallen in the sand for over eight centuries.
  - type: multiple_choice
    question: Which ancient marvel stood on an island in Alexandria's harbor, guiding
      ships with fire and bronze mirrors?
    options:
    - The Lighthouse of Pharos
    - The Mausoleum at Halicarnassus
    - The Temple of Artemis at Ephesus
    - The Roman Arch of Titus
    correct: 0
    explanation: Built under Ptolemy II around 280 BCE on Pharos island, the lighthouse
      rose over 100 meters high and became the prototype for all future lighthouses.
- id: wonders_of_asia_americas
  title: 4. Wonders of Asia, Americas & Levant
  description: 'Monumental marvels across oceans and deserts: Incan Machu Picchu in
    the clouds, Mayan Chichen Itza, the Great Wall of China, Petra, and Angkor Wat.'
  cards:
  - id: machu_picchu_incan_cloud_citadel
    title: 'Machu Picchu: The Lost Incan Citadel in the Clouds'
    points:
    - Constructed around 1450 CE under Inca Emperor Pachacuti, Machu Picchu sits perched
      2,430 meters (nearly 8,000 feet) high in the Peruvian Andes above the Urubamba
      River.
    - Incan master masons utilized ashlar masonry—fitting massive polygonal granite
      blocks without mortar with such seismic precision that stones oscillate and
      reset during earthquakes.
    - The sacred Intihuatana stone ('hitching post of the sun') is an astronomical
      calendar monolith carved into bedrock that precisely predicts the winter and
      summer solstices.
    - The city was fed by over 700 stone agricultural terraces that prevented slope
      erosion, distributed rainwater drainage, and created microclimates for cultivating
      maize and potatoes.
  - id: chichen_itza_mayan_astronomy_el_castillo
    title: Chichen Itza & The Mayan Astronomical Calendar
    points:
    - Thriving in Mexico's Yucatan peninsula between 750 and 1200 CE, Chichen Itza
      was a major political and ceremonial capital of the Maya-Toltec civilization.
    - 'The central pyramid of Kukulkan (El Castillo) is a stone calendar: 4 staircases
      of 91 steps each plus the top platform equals exactly 365 days of the solar
      year.'
    - Its Great Ball Court is the largest in the Americas (166 meters long), where
      athletes competed in the Mesoamerican ballgame to propel a heavy rubber ball
      through high stone rings.
    - The Sacred Cenote—a sheer natural limestone sinkhole—served as a holy portal
      to the underworld, where pilgrims offered jade, gold, pottery, and sacrifices
      to the rain god Chaac.
  - id: great_wall_of_china
    title: 'The Great Wall of China: Dragon on the Ridges'
    points:
    - Spanning over 13,000 miles (21,000 km) across northern frontiers, the Great
      Wall was constructed and linked over two millennia by successive imperial dynasties.
    - The iconic brick and stone battlements with watchtowers and fortresses seen
      by tourists today were primarily built during the Ming Dynasty (1368–1644) against
      Mongol armies.
    - Beyond physical border defense, the wall functioned as an elevated military
      superhighway and early warning telegraph system using smoke signals by day and
      beacon fires by night.
    - Contrary to popular modern folklore, the Great Wall is not visible to the naked
      human eye from low Earth orbit without high-powered optical zoom.
  - id: terracotta_army_qin_shi_huang
    title: 'The Terracotta Army: Guardians of China''s First Emperor'
    points:
    - Discovered by local farmers digging a well near Xi'an in 1974, the Terracotta
      Army guards the underground mausoleum of Qin Shi Huang, the unifier of China
      (died 210 BCE).
    - The subterranean necropolis holds over 8,000 clay warriors, 130 war chariots,
      and 520 cavalry horses arranged in tactical battle formations.
    - Every single clay soldier was handcrafted with unique facial features, hairstyles,
      armor detailing, and ranks, originally coated in brilliant purple, red, and
      blue mineral lacquer.
    - The central tomb mound remains unexcavated to protect artifacts, fueled by historical
      accounts of booby-trapped crossbows and simulated rivers of toxic liquid mercury.
  - id: petra_nabataean_rose_city_treasury
    title: 'Petra: The Rose-Red City Carved in Stone'
    points:
    - Carved into southern Jordan's vibrant sandstone canyons, Petra was the capital
      of the Arab Nabataean kingdom, controlling lucrative Incense Route camel caravans.
    - Access to the city is via the Siq, a 1.2-kilometer winding desert canyon that
      dramatically opens to reveal the 40-meter-tall Hellenistic facade of Al-Khazneh
      (The Treasury).
    - Al-Khazneh was not an imperial bank, but an elaborate rock-cut royal tomb for
      Nabataean King Aretas IV, carved entirely from the top downward into the cliff
      face.
    - The Nabataeans were genius hydraulic engineers, carving terracotta channels,
      dams, and concealed cisterns that harvested flash floods to supply 30,000 citizens
      in the desert.
  - id: angkor_wat_khmer_stone_empire
    title: 'Angkor Wat: The Stone Mountain of the Khmer'
    points:
    - Constructed in early 12th-century Cambodia under King Suryavarman II, Angkor
      Wat is the largest religious temple complex on Earth, covering over 400 acres.
    - Originally dedicated as a Hindu sanctuary honoring Lord Vishnu before gradually
      transitioning into a Theravada Buddhist monastery by the century's end.
    - 'Its layout represents a miniature physical model of the Hindu cosmos: five
      central towers symbolize the peaks of Mount Meru, surrounded by a 5-kilometer
      protective moat.'
    - The temple's outer gallery features over 1,200 square meters of continuous stone
      relief carvings, including the famous 'Churning of the Ocean of Milk' (Samudra
      Manthan).
  - id: hanging_gardens_of_babylon
    title: 'The Hanging Gardens of Babylon: The Vanished Wonder'
    points:
    - Legend recounts that King Nebuchadnezzar II constructed the tiered botanical
      gardens around 600 BCE to soothe his Median wife, Queen Amytis, who longed for
      her green homeland.
    - Classical historians described multi-level stone terraces planted with mature
      trees, fragrant flowers, and climbing vines that mimicked an artificial forested
      mountain.
    - Water from the Euphrates River was allegedly raised to elevated irrigation cisterns
      using mechanical Archimedes-style screws or bucket chain pumps.
    - It is the only one of the Seven Ancient Wonders whose archaeological site has
      never been verified, leading some scholars to theorize it was actually built
      in Assyrian Nineveh.
  - id: nazca_lines_peruvian_geoglyphs
    title: 'The Nazca Lines: Desert Enigmas of Peru'
    points:
    - Etched across 500 square kilometers of hyper-arid desert in southern Peru between
      500 BCE and 500 CE, the Nazca geoglyphs include over 10,000 geometric lines
      and figures.
    - Prominent biological motifs include a 135-meter condor, a 93-meter monkey with
      a coiled spiral tail, a spider, a hummingbird, and a human-like figure dubbed
      'the astronaut'.
    - The lines were made by removing sun-darkened iron-oxide desert pebbles to reveal
      the light-colored chalky subsoil beneath, preserved for millennia by the windless,
      rainless climate.
    - Because they are best viewed from the air, modern archaeologists interpret the
      lines as sacred ceremonial walking tracks and pilgrimage routes associated with
      water and fertility deities.
  - id: teotihuacan_pyramid_of_the_sun
    title: 'Teotihuacan: City of the Gods'
    points:
    - Flourishing in central Mexico around 450 CE with over 100,000 inhabitants, Teotihuacan
      was the sixth-largest city in the ancient world before its mysterious collapse.
    - Its central axis, the Avenue of the Dead, is anchored by the massive Pyramid
      of the Sun—the third largest pyramid in the world by volume—and the Pyramid
      of the Moon.
    - The Temple of the Feathered Serpent (Quetzalcoatl) features ornate polychrome
      stone carvings of serpent heads emerging from elaborate feathered seashell collars.
    - When the Aztecs discovered the majestic abandoned ruins centuries later, they
      named it Teotihuacan ('Place Where the Gods Were Born'), believing it was the
      birthplace of the sun.
  - id: persepolis_persian_ceremonial_capital
    title: 'Persepolis: Imperial Splendor of Persia'
    points:
    - Founded by Darius the Great around 518 BCE in modern Iran, Persepolis served
      as the ceremonial capital of the sprawling Achaemenid Persian Empire.
    - Built atop an immense 125,000-square-meter elevated stone terrace, it was accessed
      by the dual-ramp Grand Staircase designed for foreign diplomatic processions.
    - The Apadana (Audience Hall) featured 72 thirty-meter stone columns and reliefs
      depicting delegations from 23 subject nations bearing tribute to the Persian
      King of Kings.
    - In 330 BCE, Alexander the Great captured and burned the cedar-roofed palaces
      of Persepolis, an act historically viewed as revenge for the Persian burning
      of Athens.
  trivia:
  - type: multiple_choice
    question: Which Inca emperor commissioned the construction of the mountain citadel
      of Machu Picchu around 1450 CE?
    options:
    - Pachacuti
    - Atahualpa
    - Huayna Capac
    - Manco Capac
    correct: 0
    explanation: Pachacuti Inca Yupanqui, the visionary builder who transformed the
      Kingdom of Cusco into the Inca Empire, ordered the construction of Machu Picchu
      as a royal estate.
  - type: multiple_choice
    question: What is the famous carved astronomical stone at Machu Picchu that was
      used by Incan priests to predict the solstices?
    options:
    - The Intihuatana Stone
    - The Sun Calendar Stone
    - The Temple of the Moon
    - The Roca Sagrada
    correct: 0
    explanation: The Intihuatana ('hitching post of the sun') is an intricately carved
      bedrock outcrop whose shadow angles precisely mark the winter and summer solstices.
  - type: multiple_choice
    question: How many total steps are formed by the 4 staircases and summit platform
      of the El Castillo pyramid at Chichen Itza?
    options:
    - 365 steps (matching the days in a solar year)
    - 360 steps
    - 260 steps (matching the sacred Tzolk'in calendar)
    - 500 steps
    correct: 0
    explanation: Each of the four staircases has 91 steps; adding the shared top sanctuary
      platform brings the total to exactly 365, mirroring the solar calendar.
  - type: multiple_choice
    question: During which Chinese imperial dynasty were the famous stone and brick
      battlements of the Great Wall seen today largely constructed?
    options:
    - The Ming Dynasty
    - The Han Dynasty
    - The Tang Dynasty
    - The Song Dynasty
    correct: 0
    explanation: While older walls date to the Qin and Han eras, the iconic stone
      walls, watchtowers, and battlements near Beijing were engineered during the
      Ming Dynasty (1368–1644).
  - type: multiple_choice
    question: What ancient Chinese city near the mausoleum of Qin Shi Huang was the
      site where the Terracotta Army was unearthed in 1974?
    options:
    - Xi'an
    - Beijing
    - Nanjing
    - Luoyang
    correct: 0
    explanation: Local farmers digging a water well near the historic imperial capital
      of Xi'an stumbled into the subterranean vaults of the Terracotta Army in March
      1974.
  - type: multiple_choice
    question: What famous canyon entrance must travelers walk through to reach the
      rock-carved Treasury of Petra in Jordan?
    options:
    - The Siq
    - The Wadi Rum
    - The Ghor
    - The Yarmouk Gorge
    correct: 0
    explanation: The Siq is a dramatic 1.2-kilometer geological fault canyon flanked
      by sheer 80-meter sandstone cliffs that leads directly to Al-Khazneh (The Treasury).
  - type: multiple_choice
    question: What Arabian merchant civilization carved the rose-red rock facades
      and advanced water systems of Petra?
    options:
    - The Nabataeans
    - The Sabaeans
    - The Ammonites
    - The Palmyrenes
    correct: 0
    explanation: The Nabataeans were an ingenious Arab kingdom who amassed immense
      wealth controlling frankincense and spice caravan trade routes across the desert.
  - type: multiple_choice
    question: To which Hindu god was the monumental temple complex of Angkor Wat in
      Cambodia originally dedicated?
    options:
    - Vishnu
    - Shiva
    - Brahma
    - Ganesha
    correct: 0
    explanation: King Suryavarman II broke with tradition by dedicating Angkor Wat
      to Vishnu (the Preserver), before the shrine later transitioned into a Buddhist
      sanctuary.
  - type: multiple_choice
    question: Which Babylonian king allegedly built the legendary Hanging Gardens
      of Babylon for his homesick queen?
    options:
    - Nebuchadnezzar II
    - Hammurabi
    - Nabonidus
    - Ashurbanipal
    correct: 0
    explanation: According to Berossus and other classical historians, King Nebuchadnezzar
      II constructed the tiered botanical mountain for Queen Amytis of Media.
  - type: multiple_choice
    question: What dry, hyper-arid South American coastal country is home to the mysterious
      Nazca geoglyphs?
    options:
    - Peru
    - Chile
    - Bolivia
    - Ecuador
    correct: 0
    explanation: The Nazca Lines are etched across the arid desert plateau of southern
      Peru, preserved for over 2,000 years by the complete absence of rain and wind.
  - type: multiple_choice
    question: Which ancient Mexican metropolis is anchored by the Avenue of the Dead
      and the colossal Pyramid of the Sun?
    options:
    - Teotihuacan
    - Tenochtitlan
    - Palenque
    - Tikal
    correct: 0
    explanation: Located in the Valley of Mexico, Teotihuacan was a thriving pre-Columbian
      urban giant centuries before the Aztecs settled the valley.
  - type: multiple_choice
    question: Which Persian King of Kings founded the ceremonial capital of Persepolis
      around 518 BCE?
    options:
    - Darius the Great (Darius I)
    - Cyrus the Great
    - Xerxes I
    - Artaxerxes I
    correct: 0
    explanation: Darius I founded Persepolis as the ceremonial showcase of the Achaemenid
      Empire, which was expanded by his son Xerxes and grandson Artaxerxes.
  - type: multiple_choice
    question: Which Macedonian conqueror famously burned the cedar palaces of Persepolis
      to the ground in 330 BCE?
    options:
    - Alexander the Great
    - Philip II of Macedon
    - Pyrrhus of Epirus
    - Antigonus I
    correct: 0
    explanation: After conquering the Persian Empire, Alexander the Great set fire
      to the grand royal palaces of Persepolis, avenging the Persian sack of Athens
      150 years earlier.
  - type: multiple_choice
    question: What Mesoamerican ball game played at Chichen Itza required players
      to strike a rubber ball using only their hips and elbows?
    options:
    - Pitz (Ulama)
    - Pok-a-tok
    - Tlachtli
    - Pelota Maya
    correct: 0
    explanation: The ritual ballgame, known as Pitz to the Maya, held deep cosmological
      significance symbolizing the movement of heavenly bodies across the sky.
  - type: multiple_choice
    question: What mythical Hindu creation scene covering over 50 meters of stone
      is famously carved into the walls of Angkor Wat?
    options:
    - The Churning of the Ocean of Milk (Samudra Manthan)
    - The Fall of Lanka from the Ramayana
    - The Descent of the Sacred Ganges
    - The Dance of Shiva Nataraja
    correct: 0
    explanation: The relief depicts 88 gods (devas) and 92 demons (asuras) tugging
      the serpent king Vasuki around Mount Mandara to churn the cosmic ocean and produce
      the nectar of immortality.
  - type: multiple_choice
    question: What is the primary scientific reason why the Nazca Lines have remained
      visible for over 1,500 years without eroding away?
    options:
    - The desert is completely dry, sheltered from wind, and experiences virtually
      zero annual rainfall
    - The lines are coated in a fossilized resin preservative
    - Local indigenous tribes recarve the lines every decade
    - The trenches were lined with volcanic glass obsidian
    correct: 0
    explanation: The Nazca plateau is one of the driest places on Earth, sheltered
      from wind and receiving less than an inch of rain per year, preventing erosion.
