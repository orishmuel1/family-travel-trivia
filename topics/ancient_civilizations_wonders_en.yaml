    options:
    - The Avenue of Sphinxes
    - The Royal Appian Way
    - The Street of Pillars
    - The Sacred Sacred Boulevard
    correct: 0
    explanation: The Avenue of Sphinxes (Dromos) linked Karnak and Luxor, lined with
