    options:
    - The Great Sphinx
    - The Colossi of Memnon
    - The Griffin of Luxor
    - The Serapis of Saqqara
    correct: 0
    explanation: Carved from a single limestone bedrock knoll, the Great Sphinx stands
      guard over the Giza plateau with the recumbent body of a lion and royal pharaonic
