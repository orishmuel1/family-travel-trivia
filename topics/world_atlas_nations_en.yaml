        explanation: "The Rub' al Khali covers 650,000 square kilometers across Saudi Arabia, Oman, UAE, and Yemen as the world's largest contiguous sand desert."
      - type: multiple_choice
        question: "Which country contains the world's first and largest operational space launch facility, the Baikonur Cosmodrome?"
        options:
          - "Kazakhstan"
          - "Russia"
