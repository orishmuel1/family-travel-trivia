        explanation: "The DRC dominates global cobalt mining, extracting over 70% of the world's supply from its rich Katanga copperbelt."
      - type: multiple_choice
        question: "What is the capital city of Mexico, located in a high valley at 2,240 meters above sea level?"
        options:
          - "Mexico City"
          - "Guadalajara"
