  - id: anansi_the_spider
    title: Clever Tales of Anansi the Spider
    description: >
      Enter the witty, colorful world of West African and Caribbean folklore! 
      Meet Anansi the Spider, the ultimate trickster god who uses sharp intellect to outsmart giants and buy the world's stories.
    cards:
      - title: Anansi the Trickster God
        points:
          - "Anansi (also known as Kwaku Anansi) originated in the rich oral traditions of the Ashanti people of modern-day Ghana."
          - "He is a shapeshifting trickster who can appear as a spider, a man with eight limbs, or a combination of both."
          - "Physically small and physically vulnerable, Anansi triumphs over much larger and stronger animals solely through sharp wit."
          - "He is celebrated as the Master of Stories, representing human resourcefulness, survival, and brain over brawn."
      - title: Buying the World's Stories from Nyame
        points:
          - "In the beginning, all the stories of the world were kept locked away in a golden box by Nyame, the Sky God."
          - "Anansi asked to buy the stories, but Nyame demanded an impossible price: capture four of the most dangerous creatures on Earth."
          - "Nyame required: Osebo the leopard-with-teeth-like-spears, Onini the python, the Mmoboro hornets, and Mmoatia the invisible fairy."
          - "While powerful warriors failed, Anansi accepted the impossible challenge using only cunning strategy."
      - title: How Anansi Captured the Four Creatures
        points:
          - "To catch the Mmoboro hornets, Anansi poured water over a leaf like rain and convinced them to fly into his dry calabash gourd."
          - "To capture Onini the python, he argued that the snake wasn't as long as a bamboo pole, tricking the python into lying down and tying him up."
          - "To catch Osebo the leopard, Anansi dug a deep pit trap, then offered to pull the trapped leopard out with spider silk vines that tied him fast."
          - "Nyame honored the bargain, opening the golden box and scattering the stories across the earth, creating all human folklore."
      - title: Why Spiders Have Thin Waists
        points:
          - "In a humorous tale, Anansi smelled delicious food cooking in two neighboring villages on the same afternoon."
          - "Unable to decide which feast to attend, he tied a web string around his waist and gave an end to each village, telling them to pull when ready."
          - "Both villages finished cooking at the exact same moment and pulled their strings simultaneously with all their might!"
          - "The competing tug-of-war squeezed Anansi's waist tight, which is why spiders have tiny, narrow waists to this day."
      - title: Anansi and the Pot of Wisdom
        points:
          - "Anansi collected all the wisdom in the world into a clay pot, intending to hoard it all for himself."
          - "He tried to climb a tall palm tree to hide the pot in the branches, tying it to his chest, but it kept bumping against the trunk."
          - "His young son Ntikuma watched and laughed, asking: 'Father, why don't you tie the pot to your back so your arms are free?'"
          - "Realizing his young son already had wisdom he didn't, Anansi hurled the pot down in frustration, shattering it and spreading wisdom to everyone."
      - title: Anansi and the Five Yams
        points:
          - "A witch made a curse that anyone who spoke the word 'Five' would immediately fall fast asleep."
          - "Anansi made five piles of yams by the road and tricked hungry passing animals into counting them so he could steal their lunches."
          - "When clever Mrs. Guinea Fowl came by, she counted: 'One, two, three, four, and the pile Anansi is sitting on!'"
          - "Infuriated, Anansi shouted: 'No, that's not how you count! One, two, three, four, FIVE!' and promptly fell asleep himself."
      - title: The Journey to the Caribbean (Aunt Nancy)
        points:
          - "During the transatlantic slave trade, enslaved Ashanti people carried the beloved stories of Anansi in their memories across the ocean."
          - "In Jamaica, the Caribbean, and the American South, Anansi transformed into 'Aunt Nancy', 'Compair Anansi', or 'Br'er Rabbit'."
          - "The stories served as powerful symbols of resistance, teaching that an enslaved, oppressed person could outwit powerful oppressors."
          - "Anansi stories remain a cornerstone of folklore across Jamaica, Suriname, Trinidad, and the American Gullah culture."
      - title: Anansi's Enduring Legacy
        points:
          - "Anansi is celebrated in international literature, appearing in modern fantasy works by authors like Neil Gaiman (American Gods / Anansi Boys)."
          - "In West African storytelling, folktales are still commonly called 'Anansesem' ('spider stories') regardless of who the story is about."
          - "His tales continue to teach listeners that clever thinking and humor can overcome any obstacle, no matter how small you are."
          - "Anansi remains an immortal cultural ambassador of African wit, survival, and imaginative power."
    trivia:
      - type: multiple_choice
        question: "From the traditional folklore of which African culture did Anansi the Spider originate?"
        options: ["Ashanti people of Ghana", "Zulu people of South Africa", "Masai people of Kenya", "Berber people of Morocco"]
        correct: 0
      - type: single_qa
        question: "What is the name of the supreme West African Sky God who kept all the world's stories in a golden box?"
        answer: "Nyame"
      - type: multiple_choice
        question: "How did Anansi trick Onini the giant python to capture him for the Sky God?"
        options: ["Challenged him to measure his length against a bamboo pole", "Offered him a bowl of poisoned soup", "Trapped him in a metal cage", "Disguised himself as an eagle"]
        correct: 0
      - type: single_qa
        question: "What did Nyame give Anansi after he successfully captured the four dangerous creatures?"
        answer: "The golden box of stories (All the world's stories)"
      - type: multiple_choice
        question: "Why do spiders have tiny, narrow waists according to the humorous Anansi legend?"
        options: ["Two villages pulled webs tied to his waist simultaneously during a feast", "He got stuck squeezing into a beehive", "He was born under a narrow leaf", "The Sky God stepped on him"]
        correct: 0
      - type: single_qa
        question: "What did Anansi collect inside a clay pot before his son taught him that wisdom belongs to everyone?"
        answer: "All the wisdom in the world"
      - type: multiple_choice
        question: "In Caribbean and Jamaican folklore, what adapted name is sometimes given to Anansi the trickster?"
        options: ["Aunt Nancy (or Compair Anansi)", "King Arthur", "Captain Hook", "Baron Samedi"]
        correct: 0
      - type: single_qa
        question: "What general term in Ghana is used for all folktales, literally translating to 'spider stories'?"
        answer: "Anansesem"
      - type: multiple_choice
        question: "How did Anansi capture the stinging Mmoboro hornets for the Sky God?"
        options: ["Tricked them into a dry gourd by pretending it was raining", "Froze them with snow", "Swatted them with a palm leaf", "Lured them into a beehive"]
        correct: 0
      - type: single_qa
        question: "What clever bird outsmarted Anansi's yam counting trap by refusing to say the cursed number 'Five'?"
        answer: "Mrs. Guinea Fowl"
      - type: multiple_choice
        question: "What physical characteristic describes Anansi's unique shapeshifting appearance?"
        options: ["A spider with a human face, or a man with eight limbs", "A giant flying dragon", "A golden serpent", "A two-headed lion"]
        correct: 0
      - type: single_qa
        question: "Who was Anansi's wise young son who gave him advice about carrying the pot of wisdom on his back?"
        answer: "Ntikuma"
      - type: multiple_choice
        question: "Which American and Caribbean folklore character is directly derived from the West African Anansi tradition?"
        options: ["Br'er Rabbit", "Paul Bunyan", "Pecos Bill", "Davy Crockett"]
        correct: 0
      - type: single_qa
        question: "What did Anansi dig to capture Osebo the leopard-with-teeth-like-spears?"
        answer: "A deep pit trap"
      - type: multiple_choice
        question: "Why did enslaved Africans preserve and celebrate Anansi stories during the transatlantic slave trade?"
        options: ["As a symbol of surviving and outsmarting powerful oppressors", "To learn agriculture", "Because it was required by ships", "To predict the weather"]
        correct: 0
      - type: single_qa
        question: "What author featured Anansi as a central character in modern novels like 'Anansi Boys' and 'American Gods'?"
        answer: "Neil Gaiman"

  - id: arabian_nights_monkey_king
    title: Tales of 1,001 Nights & The Monkey King
    description: >
      Embark on enchanted adventures across ancient Arabia and imperial China! 
      From magical genies and flying carpets to Sun Wukong's 72 transformations and cloud somersaults.
    cards:
      - title: Scheherazade & 1,001 Nights
        points:
          - "One Thousand and One Nights (The Arabian Nights) is a legendary Middle Eastern frame story collection from the Islamic Golden Age."
          - "The clever Queen Scheherazade married the bitter King Shahryar, who executed each new wife after one day."
          - "To survive, Scheherazade told an enthralling tale every night, deliberately pausing on a cliffhanger before dawn."
          - "Fascinated, the king spared her life day after day for 1,001 nights, eventually falling in love with her wisdom and canceling the decree."
      - title: Aladdin and the Wonderful Lamp
        points:
          - "Aladdin is a poor young street urchin recruited by an evil sorcerer to retrieve a magical oil lamp from an enchanted cave."
          - "Trapped inside, Aladdin rubs the lamp, releasing a mighty Genie bound to grant the wishes of whoever rubs it."
          - "With the Genie's help, Aladdin wins the heart of Princess Badroulbadour (Jasmine) and defeats the deceitful sorcerer."
          - "Interestingly, original written versions set Aladdin's story in a Chinese city with Arabic cultural customs."
      - title: Ali Baba and the Forty Thieves
        points:
          - "Ali Baba is a poor woodcutter who secretly witnesses a band of forty thieves opening a treasure cave with magic words: 'Open Sesame!'."
          - "After the thieves leave, Ali Baba enters the cave and takes bags of gold coins to support his impoverished family."
          - "The cunning thieves track Ali Baba down, hiding inside large oil jars to stage a surprise night attack."
          - "Ali Baba's sharp-witted enslaved servant, Morgiana, discovers the plot and saves the household by neutralizing the thieves."
      - title: Sinbad the Sailor
        points:
          - "Sinbad of Baghdad is a legendary sailor who embarks on seven dangerous voyages across the seas of Africa and Asia."
          - "During his epic voyages, he encounters giant mythical Roc birds, cyclopean giants, magnetic islands, and sea monsters."
          - "Through resourcefulness, resilience, and sheer luck, Sinbad survives every shipwreck and returns home unimaginably wealthy."
          - "His adventures reflect the daring real-world maritime trade routes pioneered by Arab and Persian merchants across the Indian Ocean."
      - title: "Sun Wukong: The Monkey King"
        points:
          - "Sun Wukong (The Monkey King) was born from a magical stone atop the Mountain of Flowers and Fruit."
          - "He learned Taoist martial arts, mastered the 72 Earthly Transformations, and achieved multiple forms of immortality."
          - "He broke into the Heavenly Kingdom, defeating the armies of heaven with mischievous, fearless defiance."
          - "He is the central hero of Wu Cheng'en's 16th-century classical Chinese epic novel, 'Journey to the West'."
      - title: The Ruyi Jingu Bang & Cloud Somersault
        points:
          - "Sun Wukong's primary weapon is the Ruyi Jingu Bang, a magical iron pillar obtained from the Dragon King of the Eastern Sea."
          - "The staff weighs over 17,500 pounds, but can magically shrink to the size of a sewing needle to fit comfortably behind his ear!"
          - "He also mastered the 'Jindouyun' (Cloud Somersault), allowing him to leap an astonishing 108,000 li (33,500 miles) in a single flip."
          - "His hairs could be plucked and blown to transform into thousands of clone monkeys or various weapons in combat."
      - title: The Journey to the West
        points:
          - "After causing havoc in Heaven, the Buddha trapped Sun Wukong under the Five Elements Mountain for 500 years."
          - "He was released by the Buddhist monk Tang Sanzang on the condition that he protect the monk on a pilgrimage to India for sacred scriptures."
          - "Sun Wukong was joined by fellow disciples Zhu Bajie (Pigsy) and Sha Wujing (Sandy), battling hundreds of demons along the Silk Road."
          - "To keep the mischievous Monkey King under control, Tang Sanzang used a magical golden headband that tightened when a chant was recited."
      - title: Global Influence & Modern Pop Culture
        points:
          - "Sun Wukong inspired legendary modern characters across global anime and gaming, most famously Son Goku in Akira Toriyama's Dragon Ball."
          - "The Arabian Nights introduced iconic tropes into global culture, including flying carpets, magical lamps, genies, and the phrase 'Open Sesame'."
          - "Both mythologies celebrate that clever wit, indomitable spirit, and loyalty can conquer supernatural odds and authoritarian power."
          - "They remain two of the most widely adapted storytelling traditions in world cinema, theater, and video games."
    trivia:
      - type: multiple_choice
        question: "How did Queen Scheherazade avoid being executed by King Shahryar in 'One Thousand and One Nights'?"
