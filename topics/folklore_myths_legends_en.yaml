  - id: paul_bunyan_tall_tales
    title: The Tale of Paul Bunyan & Tall Tales
    description: >
      Experience the exaggerated charm of American Tall Tales! Discover the roaring laughter, 
      giant lumberjacks, blue oxen, and larger-than-life heroes of the American frontier.
    cards:
      - title: Paul Bunyan the Giant Lumberjack
        points:
          - "Paul Bunyan is a colossal mythical giant lumberjack in American folklore who cleared vast forests across North America."
          - "Legend says it took five giant storks working together to deliver baby Paul to his parents in Maine."
          - "As an infant, when Paul rolled over in his sleep, he caused earthquakes that knocked down entire pine forests."
          - "He wielded an axe with a handle made from a full hickory tree and could fell seven trees with a single swing."
      - title: Babe the Blue Ox
        points:
          - "During the legendary 'Winter of the Blue Snow', Paul discovered a tiny orphaned calf frozen blue in a snowdrift."
          - "Paul took the calf into his cabin and nursed it back to health, naming him 'Babe the Blue Ox'."
          - "Babe grew so gargantuan that the distance between his horns measured forty-two ax handles and a plug of tobacco!"
          - "Babe was strong enough to haul entire logging camps and could pull crooked logging roads straight with a single tug."
      - title: The Giant Logging Camp & Flapjack Kitchen
        points:
          - "Paul's logging camp was so massive that cooks had to strap sides of bacon to their boots and roller-skate across the griddle to grease it!"
          - "The camp's pancake flippers used giant snow shovels to flip flapjacks, which were mixed in a converted concrete mixer."
          - "The dinner horn was so long that only Paul had enough lung power to blow it, and the sound blew down ten acres of trees."
          - "Hot coffee was pumped into giant wooden tank cars and delivered to hungry lumberjacks via miniature locomotives."
      - title: Carving American Geography
        points:
          - "Tall tales credit Paul and Babe with shaping many of America's most famous natural geographic landmarks."
          - "The 10,000 Lakes of Minnesota were created by Babe the Blue Ox's giant footprints filling with rainwater."
          - "The Grand Canyon was supposedly formed when Paul carelessly dragged his heavy pickaxe behind him while walking."
          - "Paul piled up extra dirt while clearing a logging driveway, which created the Cascade and Rocky Mountain ranges."
      - title: Pecos Bill & the Wild West
        points:
          - "Pecos Bill was an exaggerated cowboy hero of the American Southwest who was raised by a pack of wild coyotes."
          - "He rode a fierce mountain lion, used a live 10-foot rattlesnake as a lasso, and invented the lasso and branding iron."
          - "During a severe drought, Pecos Bill roped a cyclone (tornado) and rode it like a bucking bronco across Texas and Oklahoma."
          - "When the tornado finally crashed in California, the impact carved out the Grand Canyon and Death Valley."
      - title: John Henry the Steel-Driving Man
        points:
          - "John Henry was a legendary African American folk hero renowned as the strongest railway steel-driver in the country."
          - "Working on the Big Bend Tunnel in West Virginia in the 1870s, he hammered steel drills into rock to set explosives."
          - "When the railroad company introduced a steam-powered drill, John Henry challenged the machine to a legendary contest."
          - "With a hammer in each hand, John Henry beat the steam drill, but collapsed and died with his hammer in his hand, symbolizing the triumph of the human spirit."
      - title: Johnny Appleseed
        points:
          - "Based on the real historical figure John Chapman (1774–1845), Johnny Appleseed was an eccentric, gentle pioneer."
          - "He walked thousands of miles barefoot across Ohio, Indiana, and Illinois, planting apple orchards ahead of frontier settlers."
          - "Folklore famously depicts him wearing a tin cooking pot on his head as a hat and carrying a sack of apple seeds."
          - "He was a devout pacifist and animal lover who refused to harm a fly, living in complete harmony with nature and Native tribes."
      - title: The Spirit of American Tall Tales
        points:
          - "Tall tales flourished in 19th-century frontier work camps among loggers, miners, sailors, and railroad builders."
          - "They relied on wild hyperbole, tongue-in-cheek deadpan humor, and impossible feats of strength and engineering."
          - "These stories celebrated pioneer resilience, teamwork, and humor when confronting the intimidating, untamed wilderness."
          - "They helped forge a distinctly American folklore tradition blending historical grit with boundless imagination."
    trivia:
      - type: multiple_choice
        question: "What color was Paul Bunyan's giant faithful companion, Babe the Ox?"
        options: ["Fiery Red", "Bright Blue", "Golden Yellow", "Snow White"]
        correct: 1
      - type: single_qa
        question: "What geographic feature in Minnesota was supposedly created by Babe the Blue Ox's giant footprints?"
        answer: "The 10,000 Lakes"
      - type: multiple_choice
        question: "How did the cooks in Paul Bunyan's camp grease the colossal pancake griddle?"
        options: ["Poured butter from airplanes", "Strapped sides of bacon to their shoes and roller-skated", "Sprayed it with fire hoses", "Used steam-powered mops"]
        correct: 1
      - type: single_qa
        question: "According to tall tales, how was the Grand Canyon formed by Paul Bunyan?"
        answer: "Dragging his pickaxe (or axe) behind him"
      - type: multiple_choice
        question: "What extreme weather phenomenon did cowboy folk hero Pecos Bill rope and ride like a horse?"
        options: ["A blizzard", "A tornado (cyclone)", "A tsunami", "A heatwave"]
        correct: 1
      - type: single_qa
        question: "What machine did steel-driving folk hero John Henry race against and defeat with his sledgehammers?"
        answer: "A steam-powered drill (steam drill)"
      - type: multiple_choice
        question: "What unusual item did pioneer folk legend Johnny Appleseed famously wear as a hat?"
        options: ["A tin cooking pot", "A hollowed-out pumpkin", "A raccoon cap", "A wooden bucket"]
        correct: 0
      - type: single_qa
        question: "What real-world historical figure was the basis for the gentle legend of Johnny Appleseed?"
        answer: "John Chapman"
      - type: multiple_choice
