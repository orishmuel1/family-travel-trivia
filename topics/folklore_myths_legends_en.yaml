        question: "What dangerous animal did Pecos Bill use as a lasso rope in the Wild West?"
        options: ["A rattlesnake", "An electric eel", "A mountain lion's tail", "A grizzly bear"]
        correct: 0
      - type: single_qa
        question: "What tunnel project in West Virginia was the setting for John Henry's epic race against the machine?"
        answer: "The Big Bend Tunnel"
      - type: multiple_choice
        question: "What literary device is the defining hallmark of American frontier tall tales?"
        options: ["Tragic irony", "Wild hyperbole and exaggeration", "Rhyming iambic pentameter", "Strict historical realism"]
