      Quill if Chris Pratt had declined.'
  - title: The Post-Credits Scene Tradition
    points:
    - 'Origins: Starting with Nick Fury in 2008, post-credits scenes became mandatory viewing for cinema audiences worldwide.'
    - 'Dual Formula: Marvel perfected a standard two-scene structure: the mid-credits scene sets up major future plot arcs,
      while the end-credits stinger delivers a comedic gag or character easter egg (e.g., Captain America''s PSA on patience
      in ''Spider-Man: Homecoming'').'
