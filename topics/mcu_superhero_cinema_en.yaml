  cards:
  - title: 'Stan Lee: The Father of Marvel''s Cinematic Cameos'
    points:
    - 'Legendary Legacy: Marvel comics co-creator Stan Lee (1922–2018) appeared in 22 MCU films from ''Iron Man'' (2008) through
      his final posthumous cameo in ''Avengers: Endgame'' (1970s flower child driver).'
    - 'Watchers Theory: In ''Guardians of the Galaxy Vol. 2'', Stan Lee is shown on an asteroid reporting his human adventures
      to The Watchers, confirming the fan theory that he plays the same cosmic informant across all Marvel films.'
