    correct: 0
    explanation: Cate Blanchett played Hela, Odin's firstborn child who drew immense supernatural power directly from Asgard.
  - type: multiple_choice
    question: 'What famous martial arts / fight sequence inside a glass elevator takes place in ''Captain America: The Winter
      Soldier''?'
    options:
    - Steve Rogers fighting 10 STRIKE agents in a descending elevator
    - Black Widow fighting Winter Soldier on an escalator
    - Falcon dodging drone missiles in an elevator shaft
    - Bucky fighting Tony Stark in a bank elevator
    correct: 0
    explanation: Cap calmly delivers the line 'Before we get started, does anyone want to get out?' before fighting Rumlow
      and the STRIKE strike team in the elevator.
- id: climax_infinity_endgame
  title: 'The Climax: Infinity War & Endgame (2018–2019)'
  description: The epic 2-part conclusion of the 22-film Infinity Saga that shattered global box office records.
  cards:
  - title: 'Avengers: Infinity War (2018)'
    points:
    - 'IMDb Rating: 8.4/10 | Directed by Anthony & Joe Russo | Written by Christopher Markus and Stephen McFeely.'
    - 'Storyline & Themes: Thanos embarks on a merciless quest across the cosmos to collect all six Infinity Stones and wipe
      out 50% of all living beings to achieve universal resource balance.'
    - 'Filming Landmark: The first Hollywood studio blockbuster shot entirely using ARRI Alexa IMAX digital cameras.'
    - 'The Snap (''The Blip''): Concludes with Thanos snapping his fingers in Wakanda, turning half of the universe (including
      Spider-Man, Black Panther, and Doctor Strange) into dust.'
  - title: 'Avengers: Endgame (2019)'
    points:
    - 'IMDb Rating: 8.4/10 | Directed by the Russo Brothers | Runtime: 181 minutes.'
    - 'Storyline & Themes: Five years after the devastating snap, the surviving Avengers execute a complex ''Time Heist''
      through the Quantum Realm to retrieve the Infinity Stones from past MCU timelines.'
    - 'Iconic Payoffs: Captain America proves worthy to lift Mjolnir; the ''Portals'' assembly scene uniting every MCU hero;
      Tony Stark''s ultimate sacrifice (''And I... am... Iron Man'').'
    - 'Box Office King: Briefly surpassed ''Avatar'' as the highest-grossing film of all time, generating $2.798 billion worldwide.'
  - title: The Six Infinity Stones Explained
    points:
    - 'Space Stone (Blue): Teleportation across space (originally housed in the Tesseract).'
    - 'Mind Stone (Yellow): Consciousness and psychic power (in Loki''s Scepter, then Vision''s forehead).'
    - 'Reality Stone (Red): Alters matter and physical reality (originally manifested as the liquid Aether).'
    - 'Power Stone (Purple): Pure destructive planetary energy (contained inside the Morag Orb).'
    - 'Time Stone (Green): Temporal manipulation and forward/backward time travel (the Eye of Agamotto).'
    - 'Soul Stone (Orange): Control over life and death; requires the ultimate sacrifice of a loved one on the cliff of Vormir.'
  trivia:
  - type: multiple_choice
    question: 'How many possible future outcomes did Doctor Strange view using the Time Stone on Titan in ''Avengers: Infinity
      War'' to find the 1 winning scenario?'
    options:
    - 14,000,605 futures
    - 1,000,000 futures
    - 500,000 futures
    - 140,000,000 futures
    correct: 0
    explanation: Doctor Strange looked forward in time to view 14,000,605 alternate futures, stating there was only one scenario
      where the Avengers won.
  - type: multiple_choice
    question: 'Which Avenger makes the ultimate sacrifice on the planet Vormir to allow Hawkeye to claim the Soul Stone in
      ''Avengers: Endgame''?'
    options:
    - Natasha Romanoff (Black Widow)
    - Nebula
    - Gamora
    - Wanda Maximoff
    correct: 0
    explanation: Natasha Romanoff sacrifices herself by jumping off the cliff on Vormir so Clint Barton (Hawkeye) can retrieve
      the Soul Stone.
  - type: multiple_choice
    question: 'Which iconic weapon does Captain America summon and wield against Thanos during the climax of ''Avengers: Endgame''?'
    options:
    - Mjolnir (Thor's hammer)
    - Stormbreaker
    - The Infinity Gauntlet
    - The Dragonfang Sword
    correct: 0
    explanation: Steve Rogers proves his worthiness by summoning Mjolnir, prompting Thor to joyfully exclaim 'I knew it!'.
  - type: multiple_choice
    question: 'What final six words does Tony Stark say right before snapping his fingers to disintegrate Thanos and his army
      in ''Avengers: Endgame''?'
    options:
    - '''And I... am... Iron Man.'''
    - '''I am inevitable.'''
    - '''Avengers... assemble!'''
    - '''We are the Avengers.'''
    correct: 0
    explanation: After Thanos proclaims 'I am inevitable', Tony reveals the Infinity Stones on his nano-gauntlet and replies,
      'And I... am... Iron Man.'
  - type: multiple_choice
    question: 'Where does Thanos retreat to live peacefully as a farmer after wiping out half the universe in ''Avengers:
      Infinity War''?'
    options:
    - The Garden (Planet 0259-S)
    - Knowhere
    - Titan
    - Nidavellir
    correct: 0
    explanation: Thanos retires to a lush, peaceful planet known simply as 'The Garden' to hang up his armor as a scarecrow.
  - type: multiple_choice
    question: 'What mechanism allows the Avengers to travel back in time to 2012, 2013, and 2014 in ''Avengers: Endgame''?'
    options:
    - The Quantum Realm navigated with Pym Particles
    - Doctor Strange's sling rings
    - The Bifrost Bridge
    - A modified Tesseract engine
    correct: 0
    explanation: Using Scott Lang's knowledge and Pym Particles, Tony Stark engineers a 'Time Space GPS' to navigate the Quantum
      Realm.
  - type: multiple_choice
    question: What sweet phrase does Tony Stark's young daughter Morgan say to him, which became the emotional motto of 'Endgame'?
    options:
    - '''I love you 3,000.'''
    - '''You are my hero.'''
    - '''Love you to the moon and back.'''
    - '''Cheeseburgers first.'''
    correct: 0
    explanation: '''I love you 3,000'' came directly from Robert Downey Jr.''s real-life children saying it to him, which
      the directors added to the script.'
  - type: multiple_choice
    question: Who forges Thor's giant axe Stormbreaker in the heart of the dying neutron star on Nidavellir in 'Infinity War'?
    options:
    - Eitri the Dwarf King (Peter Dinklage)
    - The Grandmaster
    - The Collector
    - Heimdall
    correct: 0
    explanation: Giant dwarf king Eitri (played by Peter Dinklage) operates the cosmic forge on Nidavellir to cast Stormbreaker.
  - type: multiple_choice
    question: 'Which character utters the long-awaited rallying cry ''Avengers... assemble'' into his radio earpiece in ''Avengers:
      Endgame''?'
    options:
    - Captain America (Steve Rogers)
    - Iron Man (Tony Stark)
    - Thor Odinson
    - Nick Fury
    correct: 0
    explanation: Steve Rogers quietly says 'Avengers... assemble' as the armies charge at Thanos's forces at the ruined Avengers
      Compound.
  - type: multiple_choice
    question: What is the five-year time period between Thanos's snap in 2018 and the heroes' return in 2023 officially called
      in the MCU?
    options:
    - The Blip (The Decimation)
    - The Great Silence
    - The Void Period
    - The Dark Half
    correct: 0
    explanation: 'In MCU canon (established in ''Spider-Man: Far From Home''), the 5-year disappearance and subsequent sudden
      return is known as ''The Blip''.'
- id: multiverse_saga_modern
  title: The Multiverse Saga, Spider-Man & Deadpool (2021–Present)
  description: Crossing cinematic dimensions, the Time Variance Authority, and blockbuster multiverse team-ups.
  cards:
  - title: 'Spider-Man: No Way Home (2021)'
    points:
    - 'IMDb Rating: 8.2/10 | Directed by Jon Watts | Starring Tom Holland, Zendaya, and Benedict Cumberbatch.'
    - 'Multiverse Reunion: Brought together three generations of cinematic Spider-Men: Tobey Maguire (Sam Raimi era), Andrew
      Garfield (Marc Webb era), and Tom Holland (MCU).'
    - 'Villains Return: Willem Dafoe (Green Goblin), Alfred Molina (Doc Ock), and Jamie Foxx (Electro) reprised their iconic
      roles via multiverse rifts.'
    - 'Emotional Climax: To heal the fractured multiverse, Peter Parker sacrifices his personal identity, having Doctor Strange
      cast a spell that makes the entire world forget Peter Parker ever existed.'
  - title: Deadpool & Wolverine (2024)
    points:
    - 'IMDb Rating: 7.8/10 | Directed by Shawn Levy | Starring Ryan Reynolds (Wade Wilson / Deadpool) and Hugh Jackman (Logan
      / Wolverine).'
    - 'Historic R-Rated Milestone: The first R-rated film in the Marvel Cinematic Universe, earning over $1.3 billion worldwide.'
    - 'Plot & Themes: Pulled from his timeline by the Time Variance Authority (TVA), Deadpool recruits a grief-stricken alternate
      Wolverine to save his universe from annihilation in ''The Void''.'
    - 'Cameo Extravaganza: Featured beloved retro Marvel heroes including Wesley Snipes as Blade, Channing Tatum as Gambit,
      Chris Evans as Johnny Storm, and Jennifer Garner as Elektra.'
  - title: Guardians of the Galaxy Vol. 3 (2023)
    points:
    - 'IMDb Rating: 7.9/10 | Written and directed by James Gunn.'
    - 'Storyline & Heart: The emotional swan song of the original Guardians lineup, delving into Rocket Raccoon''s tragic
      backstory and genetic creation by the cruel High Evolutionary (Chukwudi Iwuji).'
    - 'Visual Feat: Set the Guinness World Record for the most makeup appliances created for a single production (over 22,500
      prosthetics across 1,000+ actors).'
