icon: "🗺️"
title: "אטלס עולמי: מעצמות תבל וערי בירה"
description: >
  מסע גאוגרפי מרהיב בין המדינות הגדולות ביותר על פני כדור הארץ,
  מסודרות לפי שטחן היבשתי, תוך חקר ערי הבירה ההיסטוריות, תוואי השטח הקיצוניים ושיאי תבל.
lang: he
audience: family
categories:
  - id: important_facts
    title: "עובדות חשובות: גאוגרפיה עולמית ושיאי בירות"
    description: >
      אבני דרך גאוגרפיות, שיאי גובה ואקלים של ערי בירה, גבולות יבשתיים וימיים והאופן שבו האנושות חילקה את פני הגלובוס.
    cards:
      - title: "שטח היבשה של כדור הארץ וגבולות ריבוניים"
        points:
          - "שטח הפנים הכולל של כדור הארץ עומד על כ-510 מיליון קמ״ר, אך רק כ-29% ממנו (כ-149 מיליון קמ״ר) הם יבשה, המחולקת בין 195 מדינות ריבוניות המוכרות על ידי האו״ם."
          - "עשר המדינות הגדולות בעולם חולשות יחדיו על כמעט מחצית (49%) מכלל שטח היבשה של כדור הארץ, ומקיפות מדבריות ענק, יערות גשם, טונדרה ושרשראות הרים אדירות."
          - "רוסיה היא המדינה הגדולה בעולם בפער עצום; היא משתרעת על פני יותר מ-17 מיליון קמ״ר ב-11 אזורי זמן, ומכסה כשמינית מכלל היבשה המיושבת של כדור הארץ."
          - "קיימות 44 מדינות ללא מוצא לים (יבשתיות לחלוטין) בעולם, כאשר קזחסטן היא המדינה היבשתית הגדולה ביותר בעולם לפי שטח."
          - "רק שתי מדינות בעולם מוגדרות כ-׳מובלעות יבשתיות כפולות׳ (מוקפות כולן במדינות שבעצמן נטולות מוצא לים): ליכטנשטיין באירופה ואוזבקיסטן במרכז אסיה."
      - title: "שיאי גובה ואקלים בערי בירה עולמיות"
        points:
          - "לה פאס, מושב הממשלה של בוליביה, היא עיר הבירה המנהלית הגבוהה בעולם, השוכנת על רמת האלטיפלנו באנדים בגובה של כ-3,640 מטרים מעל פני הים."
          - "אולן בטור, בירת מונגוליה, מחזיקה בתואר הרשמי של עיר הבירה הקרה ביותר על פני כדור הארץ, עם טמפרטורה שנתית ממוצעת של מינוס 1.3 מעלות צלזיוס וחורף הצונח מתחת למינוס 40 מעלות."
          - "באקו, בירת אזרבייג׳ן, היא עיר הבירה הנמוכה ביותר בעולם, השוכנת 28 מטרים מתחת לגובה פני הים הכללי על חופי הים הכספי."
          - "רייקיאוויק, בירת איסלנד, היא עיר הבירה הצפונית ביותר של מדינה ריבונית (קו רוחב 64° צפון), בעוד ולינגטון, בירת ניו זילנד, היא הבירה הריבונית הדרומית ביותר בעולם (קו רוחב 41° דרום)."
          - "כווית סיטי וריאד (בירת ערב הסעודית) מתחרות דרך קבע על תואר ערי הבירה החמות ביותר בעולם, שבהן טמפרטורות הקיץ בצהריים חוצות תדיר את רף 50 מעלות הצלזיוס."
      - title: "מדינות מרובות בירות וערים מתוכננות"
        points:
          - "דרום אפריקה היא המדינה הריבונית היחידה בעולם שלה שלוש ערי בירה רשמיות: פרטוריה (בירה מנהלתית ורשות מבצעת), קייפטאון (בירה חקיקתית ופרלמנט) ובלומפונטיין (בירה שיפוטית ובית משפט עליון)."
          - "מדינות רבות העבירו במכוון את מושב הממשלה לערי בירה חדשות ומתוכננות: ברזיל (מריו דה ז׳ניירו לברזיליה ב-1960), ניגריה (מלאגוס לאבוג׳ה ב-1991), ומיאנמר (מיאנגון לנייפידאו ב-2005)."
          - "קנברה נבחרה כבירת אוסטרליה ב-1908 כפשרה מכוונת במטרה ליישב יריבות גאופוליטית עזה בין שתי הערים הגדולות במדינה, סידני ומלבורן."
          - "לשווייץ אין עיר בירה רשמית המוגדרת בחוקתה; העיר ברן מתפקדת כ-׳עיר הפדרלית׳ בפועל כדי לשמר איזון בין הקנטונים השונים."
          - "לנאורו, מדינת איים זעירה באוקיינוס השקט, אין עיר בירה רשמית כלל; משרדי הממשלה מרוכזים במחוז יארן."
      - title: "גבולות קיצוניים ותופעות גאוגרפיות חריגות"
        points:
          - "הגבול בין קנדה לארצות הברית הוא הגבול היבשתי הבינלאומי הארוך ביותר בעולם, ונמתח לאורך 8,891 קילומטרים ללא ביצורים צבאיים."
          - "הגבול היבשתי הקצר ביותר בעולם בין שתי מדינות ריבוניות נמתח בין בוטסואנה לזמביה על מפגש נהר הזמבזי, ואורכו 150 מטרים בלבד."
          - "פסגת הר האוורסט (8,848 מטרים) יושבת בדיוק על הגבול הבינלאומי המפריד בין נפאל לסין, מה שהופך אותה לגבול הבינלאומי הגבוה ביותר בעולם."
          - "רק שלוש מדינות ריבוניות בעולם הן מובלעות לחלוטין בתוך שטחה של מדינה אחת בלבד: סן מרינו וקריית הוותיקן (שתיהן מוקפות באיטליה), ולסוטו (המוקפת לחלוטין בדרום אפריקה)."
          - "צרפת חולקת את גבולה היבשתי הארוך ביותר לא עם שכנה אירופית, אלא עם ברזיל, הודות לגבול של גיאנה הצרפתית בדרום אמריקה שאורכו 730 קילומטרים."
      - title: "מדינות חוצות יבשות ושיאי יבשות"
        points:
          - "מדינות חוצות יבשות משתרעות על פני יותר מיבשת גאוגרפית אחת: דוגמאות בולטות כוללות את רוסיה, טורקיה, קזחסטן, אזרבייג׳ן וגאורגיה (המשתרעות באירופה ובאסיה), וכן מצרים (החוצה בין אפריקה לאסיה דרך חצי האי סיני)."
          - "איסטנבול שבטורקיה היא המטרופולין ההיסטורית היחידה בעולם השוכנת על פני שתי יבשות, ומחולקת במרכזה על ידי מצר הבוספורוס המחבר בין הים השחור לים מרמרה."
          - "אינדונזיה חוצה בין דרום-מזרח אסיה לאוקיאניה, כאשר חלקה המערבי של גינאה החדשה (פפואה) יושב גאולוגית על הלוח האוסטרלי."
          - "גרינלנד היא האי הגדול ביותר בעולם שאינו יבשת (שטחו 2.16 מיליון קמ״ר); גאוגרפית היא שייכת לצפון אמריקה, אך פוליטית מהווה טריטוריה אוטונומית של דנמרק."
          - "אנטארקטיקה היא היבשת היחידה שאין בה מדינות ריבוניות, אין בה אוכלוסייה ילידית קבועה ואין בה עיר בירה, והיא מנוהלת תחת אמנת אנטארקטיקה הבינלאומית."
      - title: "שיאי חופים וגבולות ימיים"
        points:
          - "לקנדה יש את קו החוף הארוך ביותר בעולם בפער ניכר, המשתרע על פני 243,042 קילומטרים — מרחק המספיק כדי להקיף את כדור הארץ בקו המשווה שש פעמים ברציפות."
          - "למונקו יש את קו החוף הקצר ביותר בעולם מבין המדינות בעלות מוצא לאוקיינוס, באורך של 4.1 קילומטרים בלבד לחופי הים התיכון."
          - "האזור הכלכלי הבלעדי (EEZ) מעניק למדינות חוף זכויות כלכליות ימיות עד למרחק של 200 מיילים ימיים (370 ק״מ), מה שמעניק למדינות איים שטח ימי ענקי."
          - "הים הכספי הוא מקווה המים הפנימי הגדול ביותר בעולם הן בשטחו (371,000 קמ״ר) והן בנפחו, והוא גובל ברוסיה, קזחסטן, טורקמניסטן, איראן ואזרבייג׳ן."
          - "ים המלח, הגובל בישראל ובירדן, הוא היבשה החשופה הנמוכה ביותר על פני כדור הארץ, כ-430 מטרים מתחת לפני הים."
      - title: "אזורי זמן חריגים ותופעות שמש"
        points:
          - "צרפת מחזיקה בשיא העולמי של מספר אזורי הזמן הגדול ביותר למדינה ריבונית יחידה (12 אזורי זמן שונים), הודות לטריטוריות שמעבר לים הפרוסות באוקיינוס השקט, האטלנטי וההודי."
          - "רוסיה משתרעת על פני 11 אזורי זמן רציפים, כך שכאשר תושבי קלינינגרד אוכלים ארוחת בוקר, תושבי קמצ׳טקה שבמזרח הרחוק כבר הולכים לישון."
          - "סין משתרעת גאוגרפית על פני חמישה אזורי זמן ממערב למזרח, אך מנהיגה אזור זמן אחיד יחיד לכל המדינה (שעון בייג׳ינג, UTC+8), מה שיוצר זריחות מאוחרות במיוחד במערב שינג׳יאנג."
          - "הודו נוהגת אף היא לפי אזור זמן אחיד יחיד (שעון הודו, UTC+5:30), הכולל חצי שעה קיזוז מזמן אוניברסלי מתואם."
          - "קו התאריך הבינלאומי מזגזג באוקיינוס השקט סביב קיריבטי, כדי שאיי ליין שבמזרח המדינה יהיו המקום המיושב הראשון בעולם שמקבל את השנה האזרחית החדשה (UTC+14)."
      - title: "ריכוזי אוכלוסין מול מרחבי פרא עצומים"
        points:
          - "מונקו היא המדינה הצפופה ביותר בעולם, ודוחסת מעל 38,000 תושבים בכל קילומטר רבוע, בשטח הקטן יותר מסנטרל פארק בניו יורק."
          - "מונגוליה היא המדינה הריבונית בעלת צפיפות האוכלוסין הנמוכה ביותר בעולם, עם כ-2.1 תושבים בלבד לקמ״ר הפרוסים על פני ערבות ומדבר גובי."
          - "באוסטרליה, כ-90% מהתושבים מרוכזים בערים לאורך רצועת החוף הממוזגת, בעוד פנים היבשת הענק (האאוטבק) כמעט שומם מאדם."
          - "יותר ממחצית מאוכלוסיית כדור הארץ מתגוררת בתוך מעגל גאוגרפי דמיוני קטן בדרום-מזרח אסיה, המקיף את הודו, סין, אינדונזיה ומדינות שכנות."
          - "סיביר מהווה 77% מכלל שטחה היבשתי של רוסיה, אך מתגוררים בה רק כ-27% מתושבי המדינה בשל תנאי אקלים קפואים ואדמת קפאת-עד."
