        explanation: "קנברה הוקמה בשנת 1913 כעיר בירה מתוכננת כדי לפשר בין שתי הערים היריבות הגדולות סידני ומלבורן."
      - type: multiple_choice
        question: "איזה הר באנדים הארגנטינאיים הוא הפסגה הגבוהה ביותר בחצי הכדור המערבי והדרומי (6,961 מטרים)?"
        options:
          - "הר אקונקגווה"
          - "הר דנאלי"
          - "הר קילימנג׳רו"
          - "הר אלברוס"
        correct: 0
        explanation: "הר אקונקגווה שוכן בפרובינציית מנדוסה בארגנטינה, ומתנשא לגובה של כמעט 7,000 מטרים מעל פני הים."
      - type: multiple_choice
        question: "מהו מתחם הארמון הקיסרי המפורסם בלב בייג׳ינג, ששימש את קיסרי סין במשך מאות שנים וכולל 980 מבנים?"
        options:
          - "העיר האסורה"
          - "ארמון הקיץ"
          - "ארמון פוטאלה"
          - "ארמון טופקאפי"
        correct: 0
        explanation: "העיר האסורה שימשה כמרכז השלטון הקיסרי של שושלות מינג וצ׳ינג, ונחשבת למתחם הארמונות הגדול בעולם."
      - type: multiple_choice
        question: "איזו עיר ארגנטינאית בארץ האש מוכרת ברחבי העולם כעיר הדרומית ביותר על פני כדור הארץ (׳סוף העולם׳)?"
        options:
          - "אושואיה"
          - "פונטה ארנס"
          - "פוארטו ויליאמס"
          - "קומודורו ריבדביה"
        correct: 0
        explanation: "אושואיה שוכנת על גדות תעלת ביגל בארץ האש בארגנטינה, וממותגת כ-׳סוף העולם׳ (Fin del Mundo)."
      - type: multiple_choice
        question: "איזה פארק לאומי בארצות הברית, שנוסד ב-1872, הוא הפארק הלאומי הראשון בהיסטוריה ושוכן מעל קלדרה געשית?"
        options:
          - "הפארק הלאומי ילוסטון"
          - "הפארק הלאומי יוסמיטי"
          - "הפארק הלאומי גרנד קניון"
          - "הפארק הלאומי גליישר"
        correct: 0
        explanation: "פארק ילוסטון הוקם בחקיקה שעליה חתם הנשיא יוליסס גרנט בשנת 1872, ופתח את רעיון שימור הטבע הלאומי בעולם."
      - type: multiple_choice
        question: "מהי עיר הבירה של הודו, הידועה בשדרותיה הרחבות ובאנדרטת שער הודו שתכנן אדווין לוטיינס?"
        options:
          - "ניו דלהי"
          - "מומבאי"
          - "קולקטה"
          - "בנגלור"
        correct: 0
        explanation: "ניו דלהי נחנכה רשמית ב-1931 כבירת הודו, והחליפה את קולקטה כמרכז השלטון של המדינה."
      - type: multiple_choice
        question: "כיצד מכונים מישורי העשב הפוריים הנרחבים של מרכז ארגנטינה המהווים את הלב החקלאי ותרבות הבוקרים במדינה?"
        options:
          - "הפמפס (Las Pampas)"
          - "הייאנוס"
          - "הסראדו"
          - "הערבות האסייתיות"
        correct: 0
        explanation: "ערבות הפמפס משתרעות על פני מאות אלפי קמ״ר בארגנטינה, ומפורסמות בחוות הבקר ובתרבות הגאוצ׳ו המסורתית."
      - type: multiple_choice
        question: "מהו קו הרכבת הארוך בעולם, הנמתח לאורך 9,289 קילומטרים ממוסקבה ועד לנמל ולדיווסטוק?"
        options:
          - "הרכבת הטרנס-סיבירית"
          - "אוריינט אקספרס"
          - "רכבת אינדיאן-פסיפיק"
          - "הרכבת הקנדית-פסיפית"
        correct: 0
        explanation: "הרכבת הטרנס-סיבירית חוצה את רוסיה לכל רוחבה, ומחברת את אירופה לאוקיינוס השקט דרך שמונה אזורי זמן."
      - type: multiple_choice
        question: "איזו שונית אלמוגים מול חופי אוסטרליה היא מבנה החיים הגדול ביותר על פני כדור הארץ?"
        options:
          - "שונית המחסום הגדולה"
          - "שונית המחסום של בליז"
          - "שונית ים סוף"
          - "שונית מסו-אמריקה"
        correct: 0
        explanation: "שונית המחסום הגדולה באוסטרליה מורכבת ממעל 2,900 שוניות בודדות ונמתחת על פני כ-2,300 קילומטרים."
      - type: multiple_choice
        question: "איזה אגן נהר בברזיל מחזיק בספיקת המים המתוקים הגדולה ביותר בעולם כולו?"
        options:
          - "אגן נהר האמזונס"
          - "אגן נהר הקונגו"
          - "אגן נהר הפרנה"
          - "אגן נהר האורינוקו"
        correct: 0
        explanation: "נהר האמזונס מזרים כחמישית מכלל המים המתוקים הנשפכים לאוקיינוסים בעולם, ומנקז את יערות הגשם של ברזיל."
      - type: multiple_choice
        question: "איזה שיעור מתושבי קנדה מתגורר ברצועה צרה של עד 160 קילומטרים מהגבול עם ארצות הברית?"
        options:
          - "כ-90% מהאוכלוסייה"
          - "כ-50% מהאוכלוסייה"
          - "כ-30% מהאוכלוסייה"
          - "כ-70% מהאוכלוסייה"
        correct: 0
        explanation: "בשל תנאי הקור והקרח בחלקים הצפוניים, כ-90% מאזרחי קנדה מרוכזים בסמוך לגבול הדרומי."
      - type: multiple_choice
        question: "אילו שתי מדינות חולקות יחדיו את השיא העולמי של מספר הגבולות היבשתיים הבינלאומיים (14 מדינות שכנות כל אחת)?"
        options:
          - "רוסיה וסין"
          - "ברזיל וגרמניה"
          - "הודו וצרפת"
          - "הרפובליקה הדמוקרטית של קונגו וסודאן"
        correct: 0
        explanation: "הן רוסיה והן סין גובלות ב-14 מדינות ריבוניות שונות לאורך גבולותיהן היבשתיים הארוכים."
      - type: multiple_choice
        question: "מהי בירתה הפדרלית של ארצות הברית, שנוסדה כמחוז עצמאי בשנת 1790?"
        options:
          - "וושינגטון די.סי."
          - "ניו יורק"
          - "פילדלפיה"
          - "בוסטון"
        correct: 0
        explanation: "וושינגטון די.סי. הוקמה כמחוז פדרלי על פי חוקת ארה״ב כדי למנוע שליטה של מדינה בודדת על הבירה הלאומית."

  - id: major_continental_powers
    title: "מעצמות יבשתיות: מקומות 9–16 לפי שטח"
    description: >
      מסע גאוגרפי בענקיות המרחב של מרכז אסיה, אפריקה, המזרח התיכון וצפון אמריקה,
      מקזחסטן ואלג׳יריה ועד אינדונזיה ומדבריות ערב.
    cards:
      - title: "מקום 9: קזחסטן (2,724,900 קמ״ר | בירה: אסטנה)"
        points:
          - "קזחסטן היא המדינה התשיעית בגודלה בעולם והמדינה הגדולה ביותר ללא מוצא לים, ונמתחת מהים הכספי במערב ועד הרי אלטאי במזרח."
          - "בירתה העתידנית, אסטנה (שנקראה לזמן קצר נור-סולטן), ידועה במבנים אוונגרדיים שתכנן נורמן פוסטר, בהם פירמידת השלום ואוהל חאן שאטיר."
          - "בקזחסטן שוכן קוסמודרום בייקונור — נמל החלל הראשון והגדול בעולם, שממנו שוגרו הלוויין ספוטניק 1 והאסטרונאוט הראשון יורי גגארין."
          - "הערבה האירו-אסייתית העצומה מכסה שני שלישים משטח המדינה, והייתה ביתם ההיסטורי של שבטים נוודים מגדלי סוסים."
          - "קזחסטן היא יצרנית האורניום המובילה בעולם, ואחראית לכ-40% מכלל כריית האורניום על פני כדור הארץ."
      - title: "מקום 10: אלג׳יריה (2,381,741 קמ״ר | בירה: אלג׳יר)"
        points:
          - "אלג׳יריה היא המדינה הגדולה ביותר באפריקה, בעולם הערבי ובאגן הים התיכון, לאחר שתפסה את המקום הראשון בעקבות פיצול סודאן ב-2011."
          - "בירתה ההיסטורית, אלג׳יר (׳אלג׳יר הלבנה׳), מפורסמת במבנים קולוניאליים לבנים מול הים וברובע הקסבה העתיק במעלה הגבעה."
          - "למעלה מ-80% משטח אלג׳יריה מכוסה במדבר סהרה, הכולל דיונות ענק, את הרי ההוגאר הגעשיים ואת ציורי הסלע העתיקים בתסילי נאג׳ר."
          - "אלג׳יריה מחזיקה במאגרי נפט וגז טבעי אדירים, ומשמשת כספקית אנרגיה מרכזית בדרום אירופה דרך צינורות תת-ימיים."
          - "המדינה ניהלה מלחמת עצמאות מרה ועיקשת נגד השלטון הקולוניאלי הצרפתי בין 1954 ל-1962, שהפכה לסמל מאבק אנטי-קולוניאלי."
      - title: "מקום 11: הרפובליקה הדמוקרטית של קונגו (2,344,858 קמ״ר | בירה: קינשאסה)"
        points:
          - "הרפובליקה הדמוקרטית של קונגו (DRC) היא המדינה השנייה בגודלה באפריקה, ומשתרעת סביב אגן נהר הקונגו — הנהר העמוק בעולם (מעל 220 מטרים)."
          - "בירתה הענקית, קינשאסה, שוכנת ישירות מעבר לנהר הקונגו מול ברזוויל (בירת הרפובליקה של קונגו), בצמד ערי הבירה הקרובות בעולם לאחר רומא והוותיקן."
          - "יערות הגשם של אגן הקונגו מהווים את יער הגשם הטרופי השני בגודלו בעולם אחרי האמזונס, ומוכרים כ-׳הריאה הירוקה השנייה של כדור הארץ׳."
          - "המדינה מחזיקה בעושר מינרלי עצום, ומכילה מעל 70% ממאגרי הקובלט הידועים בעולם, החיוניים לייצור סוללות רכב חשמלי וטלפונים."
          - "הפארק הלאומי וירונגה במזרח המדינה הוא הפארק הלאומי הוותיק ביותר באפריקה, ומשמש כמקלט קריטי עבור גורילות ההרים הנדירות."
      - title: "מקום 12: ערב הסעודית (2,149,690 קמ״ר | בירה: ריאד)"
        points:
          - "ערב הסעודית תופסת כ-80% משטחו של חצי האי ערב, וגובלת בים סוף במערב ובמפרץ הפרסי במזרח."
          - "בירתה, ריאד, צמחה מנווה מדבר מבוצר למטרופולין מודרנית עם מעל 7 מיליון תושבים, הנשלטת על ידי גורד השחקים קינגדום סנטר."
          - "המדינה היא ערש לידתה של דת האסלאם, ובה שוכנות שתי הערים הקדושות ביותר באסלאם: מכה (מקום הכעבה ועליית החג׳) ומדינה."
          - "מדבר רוב אל-ח׳אלי (׳הרבע הריק׳) בדרום המדינה הוא מדבר החול הרציף הגדול בעולם, ומשתרע על פני 650,000 קמ״ר."
          - "ערב הסעודית היא יצואנית הנפט הגולמי המובילה בעולם, ומחזיקה במאגר אל-ע׳וואר — שדה הנפט היבשתי הגדול בעולם."
      - title: "מקום 13: מקסיקו (1,964,375 קמ״ר | בירה: מקסיקו סיטי)"
        points:
          - "מקסיקו היא המדינה החמישית בגודלה ביבשת אמריקה והמדינה דוברת הספרדית המאוכלסת ביותר בעולם, עם מעל 130 מיליון תושבים."
          - "בירתה התוססת, מקסיקו סיטי, נבנתה על חורבות טנוצ׳טיטלאן, בירת האימפריה האצטקית, בעמק הררי גבוה בגובה 2,240 מטרים."
          - "מקסיקו העניקה לעולם את הקקאו (שוקולד), התירס, האבוקדו, הווניל והצ׳ילי, שבויתו לפני אלפי שנים על ידי תרבויות מסו-אמריקאיות."
          - "המדינה עשירה באתרים ארכאולוגיים פרה-קולומביאניים, בהם פירמידת השמש בטאוטיווקאן ופירמידת אל קסטיליו של המאיה בצ׳יצ׳ן איצה."
          - "רכסי סיירה מדרה סוגרים על המדינה ממזרח וממערב ומקיפים את הרמה המרכזית ופסגות געשיות כגון פופוקטפטל."
      - title: "מקום 14: אינדונזיה (1,904,569 קמ״ר | בירה: ג׳קרטה / נוסנטארה)"
        points:
          - "אינדונזיה היא מדינת האיים הגדולה בעולם, ומורכבת ממעל 17,500 איים הנמתחים לאורך 5,100 קילומטרים על קו המשווה."
          - "בירתה ההיסטורית, ג׳קרטה שבאי ג׳אווה, שוקעת בקצב מהיר בשל שאיבת מי תהום, מה שהוביל להקמת בירה חדשה ומתוכננת בשם נוסנטארה באי בורנאו."
          - "אינדונזיה היא המדינה הרביעית המאוכלסת ביותר בעולם (275 מיליון נפש) והמדינה המוסלמית המאוכלסת ביותר בתבל."
          - "כיוון שהיא יושבת על ׳טבעת האש׳, באינדונזיה יש מעל 130 הרי געש פעילים, בהם קרקטואה וטמבורה (שהתפרצותו ב-1815 חוללה את ׳השנה ללא קיץ׳)."
          - "הפארק הלאומי קומודו הוא המקום היחיד בטבע שבו שורדים דרקוני קומודו — הלטאות הגדולות בעולם, המגיעות לאורך של עד 3 מטרים."
      - title: "מקום 15: סודאן (1,861,484 קמ״ר | בירה: חרטום)"
        points:
          - "סודאן שוכנת בצפון-מזרח אפריקה בצומת דרכים היסטורי בין אפריקה שמדרום לסהרה לבין העולם הערבי."
          - "בירתה, חרטום, שוכנת במפגש המפורסם של הנילוס הלבן (הזורם מאגם ויקטוריה) והנילוס הכחול (הזורם מאתיופיה), המתאחדים לנהר הנילוס הגדול."
          - "בסודאן יש למעשה יותר פירמידות עתיקות מאשר במצרים: מעל 250 פירמידות נוביות תלולות נבנו על ידי ממלכת כוש באתרים כמו מרואה."
          - "טרם היפרדותה של דרום סודאן בשנת 2011, הייתה סודאן המדינה הגדולה ביותר בשטחה בכל יבשת אפריקה."
          - "נוף המדינה כולל את הרי ים סוף, עמק הנילוס הפורה וסוואנות הנבלעות במדבר הנובי."
      - title: "מקום 16: לוב (1,759,540 קמ״ר | בירה: טריפולי)"
        points:
          - "לוב משתרעת על פני שטח ענק בצפון אפריקה עם קו חוף ים-תיכוני ארוך של 1,770 קילומטרים, אך מעל 90% משטחה הוא מדבר סהרה צחיח."
          - "בירתה ההיסטורית, טריפולי (׳כלת הים התיכון׳), נוסדה על ידי הפיניקים במאה ה-7 לפנה״ס כתחנת מסחר בשם אויה."
          - "לוב מחזיקה במאגרי הנפט המוכחים הגדולים ביותר ביבשת אפריקה, ומפיקה נפט גולמי באיכות מעולה ודל גופרית."
          - "העתיקות הרומיות המרשימות בלפטיס מגנה ובקירנה לחופי לוב נמנות עם המונומנטים הקלאסיים השמורים ביותר באגן הים התיכון."
          - "בשנת 1922 נמדדה בעיירה הלובית אל-עזיזיה טמפרטורת שיא עולמית של 58 מעלות צלזיוס, אף שהמדידה בוטלה מאוחר יותר על ידי השירות המטאורולוגי."
    trivia:
      - type: multiple_choice
        question: "מהי עיר הבירה של קזחסטן, המפורסמת במבניה העתידניים שתכנן נורמן פוסטר?"
        options:
          - "אסטנה"
          - "אלמטי"
          - "טשקנט"
          - "בישקק"
        correct: 0
        explanation: "אסטנה (שנקראה בעבר אקמולה ונור-סולטן) הוכרזה כבירת קזחסטן בשנת 1997 במקום אלמטי."
      - type: multiple_choice
        question: "בעקבות עצמאות דרום סודאן ב-2011, איזו מדינה הפכה לגדולה ביותר בשטחה ביבשת אפריקה ובעולם הערבי?"
        options:
          - "אלג׳יריה"
          - "הרפובליקה הדמוקרטית של קונגו"
          - "סודאן"
          - "לוב"
        correct: 0
        explanation: "אלג׳יריה משתרעת על פני 2.38 מיליון קמ״ר, והיא המדינה הגדולה באפריקה ובעולם הערבי כולו."
      - type: multiple_choice
        question: "אילו שתי ערי בירה באפריקה שוכנות זו מול זו משני עברי נהר הקונגו בצמד הבירות הקרובות בעולם?"
        options:
          - "קינשאסה וברזוויל"
          - "חרטום ואומדורמאן"
          - "קהיר וגיזה"
          - "פרטוריה ויוהנסבורג"
        correct: 0
        explanation: "קינשאסה (בירת הרפובליקה הדמוקרטית של קונגו) וברזוויל (בירת הרפובליקה של קונגו) שוכנות משני צדי נהר הקונגו."
      - type: multiple_choice
        question: "מהי עיר הבירה של ערב הסעודית, עיר ענק של מעל 7 מיליון תושבים בלב המדבר?"
        options:
          - "ריאד"
          - "ג׳דה"
          - "מכה"
          - "מדינה"
        correct: 0
        explanation: "ריאד היא המרכז המנהלי והפוליטי של ערב הסעודית, השוכנת ברמת נג׳ד המדברית."
      - type: multiple_choice
        question: "איזו מדינת איים בונה כיום עיר בירה ירוקה ומתוכננת חדשה בשם נוסנטארה באי בורנאו?"
        options:
          - "אינדונזיה"
          - "הפיליפינים"
          - "מלזיה"
          - "פפואה גינאה החדשה"
        correct: 0
        explanation: "אינדונזיה בונה את נוסנטארה במזרח קלימנטן כדי להחליף את ג׳קרטה השוקעת והצפופה."
      - type: multiple_choice
        question: "איזה מפגש נהרות מפורסם מתרחש בעיר חרטום, בירת סודאן?"
        options:
          - "מפגש הנילוס הלבן והנילוס הכחול"
          - "מפגש נהרות הפרת והחידקל"
          - "מפגש הניז׳ר והבנואה"
          - "מפגש הזמבזי והלימפופו"
        correct: 0
        explanation: "בחרטום מתחברים הנילוס הלבן מאפריקה המשוונית והנילוס הכחול מאתיופיה ליצירת נהר הנילוס הגדול."
      - type: multiple_choice
        question: "איזו אימפריה מסו-אמריקאית בנתה את עיר הבירה טנוצ׳טיטלאן, שעליה הוקמה מקסיקו סיטי המודרנית?"
        options:
          - "האימפריה האצטקית"
          - "תרבות המאיה"
          - "אימפריית האינקה"
          - "האימפריה הטולטקית"
        correct: 0
        explanation: "הספרדים כבשו את טנוצ׳טיטלאן ב-1521, ייבשו את האגם ובנו עליו את מקסיקו סיטי."
      - type: multiple_choice
        question: "באיזו מדינה יש יותר פירמידות אבן עתיקות מאשר במצרים (מעל 250 פירמידות נוביות במרואה)?"
        options:
          - "סודאן"
          - "אלג׳יריה"
          - "לוב"
          - "אתיופיה"
        correct: 0
        explanation: "ממלכת כוש בנוביה העתיקה (בשטחי סודאן של ימינו) בנתה מאות פירמידות מלכותיות תלולות כקברי מלכים."
      - type: multiple_choice
        question: "כיצד נקרא מדבר החול הרציף הענק בדרום ערב הסעודית המכונה ׳הרבע הריק׳?"
        options:
          - "רוב אל-ח׳אלי"
          - "אנ-נפוד"
          - "קלהארי"
          - "אטקמה"
        correct: 0
        explanation: "מדבר רוב אל-ח׳אלי מכסה 650,000 קמ״ר בחצי האי ערב ומהווה את שטח החול הרציף הגדול בתבל."
      - type: multiple_choice
        question: "באיזו מדינה שוכן קוסמודרום בייקונור — נמל החלל הפעיל הוותיק והגדול ביותר בעולם?"
        options:
          - "קזחסטן"
          - "רוסיה"
          - "אוזבקיסטן"
          - "סין"
        correct: 0
        explanation: "קוסמודרום בייקונור שוכן בערבות קזחסטן ומוחכר להפעלת סוכנות החלל הרוסית רוסקוסמוס."
      - type: multiple_choice
        question: "איזה מחצב קריטי לסוללות רכב חשמלי מסופק בלמעלה מ-70% מכלל התוצרת העולמית על ידי הרפובליקה הדמוקרטית של קונגו?"
        options:
          - "קובלט"
          - "ליתיום"
          - "פלטינה"
          - "אורניום"
        correct: 0
        explanation: "קונגו חולשת על מעל 70% מפקת הקובלט העולמית מכרייה בחבל קטנגה העשיר במינרלים."
      - type: multiple_choice
        question: "מהי עיר הבירה של מקסיקו, השוכנת בעמק הררי בגובה של מעל 2,200 מטרים?"
        options:
          - "מקסיקו סיטי"
          - "גוודלחרה"
          - "מונטריי"
          - "קנקון"
        correct: 0
        explanation: "מקסיקו סיטי היא המרכז הפוליטי, הכלכלי והתרבותי של מקסיקו, ואחת המטרופולינים הגדולות ביבשת אמריקה."
      - type: multiple_choice
        question: "איזה פארק לאומי באינדונזיה הוא המקלט היחיד בטבע לדרקוני קומודו — הלטאות הגדולות בעולם?"
        options:
          - "הפארק הלאומי קומודו"
          - "הפארק הלאומי אוז׳ונג קולון"
          - "הפארק הלאומי גונונג לאוסר"
          - "הפארק הלאומי טנג׳ונג פוטינג"
        correct: 0
        explanation: "דרקוני קומודו חיים בטבע אך ורק באיי קומודו, רינצ׳ה וסביבתם באינדונזיה."
      - type: multiple_choice
        question: "מהי עיר הבירה של אלג׳יריה, המכונה ׳אלג׳יר הלבנה׳ בזכות מבניה הבוהקים הצופים למפרץ?"
        options:
          - "אלג׳יר"
          - "אוראן"
          - "קונסטנטין"
          - "ענאבה"
        correct: 0
        explanation: "אלג׳יר היא בירתה והעיר הגדולה ביותר של אלג׳יריה, הידועה במורדות הגבעות הלבנים שלה."
      - type: multiple_choice
        question: "איזו מדינה צפון-אפריקאית מחזיקה במאגרי הנפט המוכחים הגדולים ביותר ביבשת אפריקה?"
        options:
          - "לוב"
          - "ניגריה"
          - "אנגולה"
          - "אלג׳יריה"
        correct: 0
        explanation: "לוב מחזיקה בכ-48 מיליארד חביות נפט מוכחות, המאגר הגדול ביותר ביבשת אפריקה."
      - type: multiple_choice
        question: "מהי עיר הבירה של לוב, שנוסדה על ידי הפיניקים במאה ה-7 לפנה״ס כנמל מסחר?"
        options:
          - "טריפולי"
          - "בנגאזי"
          - "מיסראתה"
          - "טוברוק"
        correct: 0
        explanation: "טריפולי שוכנת בצפון-מערב לוב על שפת הים התיכון, ומהווה את בירת המדינה."

  - id: regional_leaders_middle_tier
    title: "ענקיות אזוריות ומרכזי תרבות: מקומות 17–24 לפי שטח"
    description: >
      מסע במעצמות אזוריות מרתקות: רמות פרס, ערבות מונגוליה,
      פסגות האנדים באמריקה הדרומית וממלכות המסחר של מערב אפריקה.
    cards:
      - title: "מקום 17: איראן (1,648,195 קמ״ר | בירה: טהראן)"
        points:
          - "איראן (פרס ההיסטורית) היא צומת דרכים הררי המחבר בין המזרח התיכון, מרכז אסיה והקווקז, וגובלת בים הכספי ובמפרץ הפרסי."
          - "בירתה השוקקת, טהראן, יושבת למרגלות רכס הרי אלבורז המושלגים, ובה שוכנים הבזאר הגדול, ארמון גולסתאן ומעל 9 מיליון תושבים."
          - "הר דמאוונד, הר געש פעיל המתנשא לגובה 5,610 מטרים, הוא הפסגה הגבוהה ביותר באיראן והר הגעש הגבוה ביותר בכל יבשת אסיה."
          - "התרבות הפרסית היא אחת העתיקות בעולם, ומפורסמת באתרים מרהיבים כגון פרספוליס — בירתה הטקסית של האימפריה האחמנית של דריווש הגדול."
          - "איראן היא יצרנית הזעפרן (׳הזהב האדום׳) המובילה בעולם, ואחראית ליותר מ-90% מכלל היבול העולמי של התבלין היקר."
      - title: "מקום 18: מונגוליה (1,564,116 קמ״ר | בירה: אולן בטור)"
        points:
          - "מונגוליה היא מדינה ללא מוצא לים במזרח אסיה הכלואה בין רוסיה לסין, ומפורסמת כארצו של ג׳ינגיס חאן והאימפריה המונגולית מהמאה ה-13."
          - "בירתה, אולן בטור (׳הגיבור האדום׳), מאכלסת כמעט מחצית מתושבי המדינה, מוקפת בהרים מקודשים וידועה בחורפים קפואים במיוחד."
          - "מדבר גובי בדרום מונגוליה התפרסם בגילוי מאובני דינוזאורים עשירים, כולל ביצי הדינוזאור הראשונות בעולם שהתגלו על ידי רוי צ׳פמן אנדרוס ב-1923."
          - "חלק משמעותי מתושבי מונגוליה מקיימים גם כיום אורח חיים נוודי למחצה, מתגוררים באוהלי לֶבֶד עגולים המכונים גֶר (יורט) ורועים סוסים, כבשים וגמלים."
          - "פסטיבל הנאדאם הלאומי של מונגוליה חוגג את ׳שלושת המשחקים הגבריים׳: חץ וקשת, מרוצי סוסים למרחקים ארוכים והיאבקות מונגולית מסורתית."
      - title: "מקום 19: פרו (1,285,216 קמ״ר | בירה: לימה)"
        points:
          - "פרו היא מדינה דרום-אמריקאית מגוונת ביולוגית להפליא, הכוללת שלושה אזורים גאוגרפיים מובהקים: החוף הצחיח, רכס הרי האנדים ויערות האמזונס."
          - "בירתה שלחוף האוקיינוס השקט, לימה, נוסדה בשנת 1535 על ידי הכובש הספרדי פרנסיסקו פיסארו כ-׳עיר המלכים׳, ומוכרת כיום כבירת הגסטרונומיה של אמריקה."
          - "מאצ׳ו פיצ׳ו, מצודת אינקה מהמאה ה-15 התלויה על רכס הררי בגובה 2,430 מטרים מעל נהר האורובמבה, נבחרה לאחד משבעת פלאי תבל החדשים."
          - "אגם טיטיקקה, המשותף לפרו ולבוליביה בגובה 3,812 מטרים, הוא אגם המים המתוקים הגבוה בעולם שבו מתקיים שיט מסחרי."
          - "פרו היא מולדת תפוח האדמה, שבו בויתו לראשונה מעל 4,000 זנים שונים על ידי החקלאים הילידים באנדים."
      - title: "מקום 20: צ׳אד (1,284,000 קמ״ר | בירה: נג׳מנה)"
        points:
          - "צ׳אד היא מדינה ענקית ללא מוצא לים במרכז אפריקה, ומכונה לעיתים ׳הלב המת של אפריקה׳ בשל ריחוקה העצום מכל חוף אוקיינוס."
          - "בירתה, נג׳מנה, שוכנת על גדות נהר השארי מול גבול קמרון, ומשמשת כמרכז המסחרי והמנהלי של המדינה."
          - "ימת צ׳אד, שהייתה בעבר ממקווי המים המתוקים הגדולים באפריקה, הצטמקה ביותר מ-90% מאז שנות ה-60 של המאה ה-20 בשל שינויי אקלים והשקיה."
          - "צפון המדינה נשלט על ידי הרי טיבסטי הגעשיים בלב הסהרה, ובהם פסגת אמי קוסי (3,415 מטרים) — ההר הגבוה ביותר במדבר סהרה כולו."
          - "הפארק הלאומי זאקומה בדרום צ׳אד הוא סיפור הצלחה עולמי בשימור טבע, שבו שוקמו אוכלוסיות פילים וג׳ירפות לאחר עשורים של ציד."
      - title: "מקום 21: ניז׳ר (1,267,000 קמ״ר | בירה: ניאמיי)"
        points:
          - "ניז׳ר היא מדינה יבשתית במערב אפריקה הקרויה על שם נהר הניז׳ר, ויותר מ-80% משטחה מכוסה במדבר סהרה הלוהט."
          - "בירתה, ניאמיי, שוכנת בדרום-מערב המדינה הפורה לאורך נהר הניז׳ר, ובה נמצאים המסגד הגדול והמוזיאון הלאומי."
          - "העיר המדברית ההיסטורית אגאדז שימשה כצומת סחר מרכזי בשיירות הסהרה, ומפורסמת במינרט הבוץ הייחודי שלה המתנשא לגובה 27 מטרים."
          - "בניז׳ר מתגוררים נוודי הטוארג (׳האנשים הכחולים של המדבר׳), המפורסמים בלבוש אינדיגו, בתכשיטי כסף ובכושר ניווט מדברי פנומנלי."
          - "במדינה מצויים מרבצי אורניום עשירים בהרי האייר, שסיפקו היסטורית דלק גרעיני לכורי חשמל בצרפת ובאירופה."
      - title: "מקום 22: אנגולה (1,246,700 קמ״ר | בירה: לואנדה)"
        points:
          - "אנגולה היא מדינה גדולה בדרום-מערב אפריקה לחוף האוקיינוס האטלנטי, עשירה ביערות גשם בצפון, רמות ממוזגות ומדבריות בדרום."
          - "בירתה ועיר הנמל המרכזית, לואנדה, נוסדה בידי הפורטוגלים ב-1575, והיא מהיישובים האירופיים הוותיקים ביותר באפריקה שמדרום לסהרה."
          - "מובלעת קבינדה, המופרדת משאר שטחה של אנגולה ברצועת חוף של קונגו, היא מוקד עשיר להפקת נפט מול החופים."
          - "מפלי קלנדולה שעל נהר הלוקאלה נמנים עם המפלים הגדולים והמרשימים באפריקה, וצונחים מגובה 105 מטרים בקשת סלעית רחבה."
          - "לאחר מלחמת אזרחים שנמשכה 27 שנים והסתיימה ב-2002, הפכה אנגולה לאחת מיצרניות הנפט והיהלומים המובילות ביבשת."
      - title: "מקום 23: מאלי (1,240,192 קמ״ר | בירה: במקו)"
        points:
          - "מאלי היא מדינה מערב-אפריקאית בעלת מורשת היסטורית מפוארת, המשתרעת ממדבר סהרה בצפון ועד לאגן נהר הניז׳ר בדרום."
