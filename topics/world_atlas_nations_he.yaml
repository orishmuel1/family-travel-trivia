  - id: fascinating_geopolitical_territories
    title: "גאוגרפיה מרתקת: מובלעות, חצאי איים ומדינות איים"
    description: >
      מדינות בעלות מבנה גאוגרפי יוצא דופן: רצועות חוף צרות וארוכות, גשרים בין-יבשתיים,
      ארכיפלגים געשיים וממלכות חצי-איים.
    cards:
      - title: "צ׳ילה: סרט החוף הארוך של האוקיינוס השקט (בירה: סנטיאגו)"
        points:
          - "צ׳ילה היא המדינה הצרה והארוכה ביותר בעולם, ונמתחת לאורך יותר מ-4,300 קילומטרים מצפון לדרום, בעוד רוחבה הממוצע 177 קילומטרים בלבד."
          - "בירתה, סנטיאגו, שוכנת בעמק ים-תיכוני מרכזי מוקף בפסגות האנדים המושלגות וברכס החוף הצ׳יליאני."
          - "מדבר אטקמה בצפון צ׳ילה הוא המדבר הלא-קוטבי הצחיח ביותר על פני כדור הארץ, שבו בחלק מהתחנות מעולם לא נמדד גשם, ומשמש מרכז עולמי למצפי כוכבים."
          - "צ׳ילה כוללת בשטחה את אי הפסחא (ראפה נוי) שבדרום-מזרח האוקיינוס השקט, המפורסם בכמעט 1,000 פסלי האבן המונומנטליים (מואי)."
          - "בדרום, פטגוניה הצ׳יליאנית מתאפיינת בצריחי הגרניט של הפארק הלאומי טורס דל פיינה, פיורדים דרמטיים ומצר מגלן."
      - title: "מצרים: ערש התרבות על הנילוס (בירה: קהיר)"
        points:
          - "מצרים היא מדינה חוצת יבשות המחברת בין צפון אפריקה לדרום-מערב אסיה דרך חצי האי סיני, ומקשרת בין הים התיכון לים סוף דרך תעלת סואץ."
          - "בירתה העצומה, קהיר, היא המטרופולין הגדולה בעולם הערבי, שסמוך לה ניצבות הפירמידות הגדולות של גיזה והמוזיאון המצרי הגדול."
          - "יותר מ-95% מתושבי מצרים (מעל 105 מיליון איש) מצטופפים ברצועה ירוקה צרה לאורך נהר הנילוס והדלתא, המהווה כ-4% בלבד משטח המדינה."
          - "תעלת סואץ, שנחנכה בשנת 1869, מרכזת כ-12% מכלל הסחר הימי העולמי, וחוסכת לספינות הקפת 7,000 קילומטרים סביב אפריקה."
          - "הציוויליזציה של מצרים העתיקה שגשגה לאורך יותר מ-3,000 שנה, והורישה כתב חרטומים, מערכות השקיה ומבני אבן ענקיים."
      - title: "טורקיה: הגשר בין מזרח למערב (בירה: אנקרה)"
        points:
          - "טורקיה היא מדינה חוצת יבשות המשתרעת על פני חצי האי אנטוליה במערב אסיה ומזרח תראקיה בדרום-מזרח אירופה."
          - "בעוד איסטנבול היא המרכז הכלכלי והתרבותי הגדול במדינה, אנקרה הוכרזה כעיר הבירה הרשמית ב-1923 בידי מוסטפא כמאל אטאטורק עם ייסוד הרפובליקה."
          - "מצרי הבוספורוס והדרדנלים שולטים על המעבר הימי החיוני בין הים השחור לים התיכון, ומנוהלים לפי אמנת מונטרה הבינלאומית."
          - "קפדוקיה במרכז טורקיה מפורסמת בפטריות סלע געשיות המכונות ׳ארובות פיות׳, בערים תת-קרקעיות חצובות ובכנסיות מערה."
          - "הר אררט במזרח המדינה מתנשא כחרוט געשי רדום לגובה 5,137 מטרים, ומזוהה במסורת עם מקום מנוחתה של תיבת נח."
      - title: "יפן: הארכיפלג הגעשי (בירה: טוקיו)"
        points:
          - "יפן היא מדינת איים במזרח אסיה המורכבת מארכיפלג של מעל 14,000 איים, ובראשם ארבעת האיים המרכזיים: הונשו, הוקאידו, קיושו ושיקוקו."
          - "בירתה, טוקיו, עומדת במרכז המטרופולין המאוכלסת ביותר בעולם, המונה מעל 37 מיליון תושבים בטוקיו רבתי."
          - "הר פוג׳י, הר געש פעיל בעל חרוט סימטרי מושלם המתנשא לגובה 3,776 מטרים, הוא הפסגה הגבוהה ביפן וסמל תרבותי לאומי."
          - "יותר מ-70% משטחה של יפן הוא שטח הררי ומיוער שאינו מתאים ליישוב, מה שמאלץ את האוכלוסייה להצטופף במישורי החוף הצרים."
          - "יפן היא חלוצה עולמית ברכבות קליע מהירות (שינקנסן), הפועלות במהירות של עד 320 קמ״ש בדיוק זמנים הנמדד בשניות."
      - title: "הממלכה המאוחדת: ממלכת האיים הבריטית (בירה: לונדון)"
        points:
          - "הממלכה המאוחדת של בריטניה הגדולה וצפון אירלנד כוללת את האי בריטניה הגדולה, צפון-מזרח האי אירלנד ואיים קטנים רבים."
          - "בירתה, לונדון, נוסדה על ידי הרומאים כ-לונדיניום לפני כאלפיים שנה לגדות נהר התמזה, ומהווה מוקד דיפלומטי ופיננסי עולמי מוביל."
          - "הממלכה מורכבת מארבע אומות שונות: אנגליה, סקוטלנד, ויילס וצפון אירלנד, שלכל אחת מהן היסטוריה ייחודית ופרלמנט עצמאי."
          - "רובע גריניץ׳ בלונדון מגדיר את קו האורך אפס (מרידיאן גריניץ׳), המשמש כעוגן הייחוס הבינלאומי לזמן אוניברסלי מתואם (UTC)."
          - "המהפכה התעשייתית החלה בבריטניה במאה ה-18, וחוללה מהפכה בייצור, ברכבות קיטור ובתעשייה העולמית כולה."
      - title: "איטליה: המגף הים-תיכוני (בירה: רומא)"
        points:
          - "איטליה היא חצי אי בצורת מגף הפורץ לתוך מרכז הים התיכון, עטור בהרי האלפים בצפון וכולל את האיים הגדולים סיציליה וסרדיניה."
