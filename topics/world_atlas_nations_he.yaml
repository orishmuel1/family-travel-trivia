        question: "איזו מדינה נמנעה מהגדרת עיר בירה רשמית בחוקתה, כאשר העיר ברן מתפקדת כבירה בפועל?"
        options:
          - "שווייץ"
          - "מונקו"
          - "סן מרינו"
          - "איסלנד"
        correct: 0
        explanation: "שווייץ נמנעה במכוון מהכרזה על בירה רשמית בחוקה כדי לא להעדיף קנטון מסוים, וברן משמשת כעיר הממשל הפדרלית."
      - type: multiple_choice
        question: "אילו שתי מדינות בעולם מוגדרות כ-׳מובלעות יבשתיות כפולות׳ (מוקפות כולן במדינות שבעצמן ללא מוצא לים)?"
        options:
          - "ליכטנשטיין ואוזבקיסטן"
          - "בוליביה ופרגוואי"
          - "מונגוליה ונפאל"
          - "שווייץ ואוסטריה"
        correct: 0
        explanation: "ליכטנשטיין (מוקפת בשווייץ ואוסטריה) ואוזבקיסטן (מוקפת בחמש מדינות ללא מוצא לים) הן המובלעות הכפולות היחידות."
      - type: multiple_choice
        question: "צרפת חולקת את גבולה היבשתי הארוך ביותר עם איזו מדינה דרום-אמריקאית?"
        options:
          - "ברזיל"
          - "סורינאם"
          - "קולומביה"
          - "ונצואלה"
        correct: 0
        explanation: "גיאנה הצרפתית היא מחוז צרפתי שמעבר לים החולק גבול יבשתי של 730 קילומטרים עם ברזיל."
      - type: multiple_choice
        question: "איזו מדינה ריבונית מתאפיינת בצפיפות האוכלוסין הנמוכה ביותר בעולם (כ-2 תושבים לקמ״ר בלבד)?"
        options:
          - "מונגוליה"
          - "נמיביה"
          - "אוסטרליה"
          - "איסלנד"
        correct: 0
        explanation: "אוכלוסיית מונגוליה מונה כ-3.4 מיליון נפש הפזורים על שטח ענק של 1.56 מיליון קמ״ר, מה שיוצר צפיפות מינימלית."
      - type: multiple_choice
        question: "מהי עיר הבירה הריבונית הדרומית ביותר בעולם כולו?"
        options:
          - "ולינגטון, ניו זילנד"
          - "קנברה, אוסטרליה"
          - "בואנוס איירס, ארגנטינה"
          - "קייפטאון, דרום אפריקה"
        correct: 0
        explanation: "ולינגטון שוכנת בקו רוחב 41 מעלות דרום באי הצפוני של ניו זילנד, והיא הבירה הדרומית בתבל."
      - type: multiple_choice
        question: "איזו עיר היסטורית היא המטרופולין היחידה בעולם המחולקת גאוגרפית על פני שתי יבשות שונות במצר הבוספורוס?"
        options:
          - "איסטנבול, טורקיה"
          - "קהיר, מצרים"
          - "באקו, אזרבייג׳ן"
          - "טביליסי, גאורגיה"
        correct: 0
        explanation: "איסטנבול שוכנת משני צדי מצר הבוספורוס: מרכזה ההיסטורי באירופה ושכונותיה המזרחיות ביבשת אסיה."
      - type: multiple_choice
        question: "איזו מדיניות שעות ייחודית מנהיגה סין על פני כל שטחה העצום המשתרע על חמישה אזורי זמן גאוגרפיים?"
        options:
          - "אזור זמן אחיד יחיד לכל המדינה (שעון בייג׳ינג, UTC+8)"
          - "חלוקה לחמישה אזורי זמן התואמים את מהלך השמש"
          - "מעבר שעון חודשי בהתאם לעונות השנה"
          - "שני אזורי זמן המחולקים בדיוק בין צפון לדרום"
        correct: 0
        explanation: "בשנת 1949 איחדה סין את כל שטחה תחת שעון בייג׳ינג האחיד, כך שבקצה המערבי השמש זורחת לעיתים רק סביב 10:00 בבוקר."

  - id: giant_nations_top_tier
    title: "מעצמות הענק: המדינות הגדולות בעולם לפי שטח (מקומות 1–8)"
    description: >
      פרופילים גאוגרפיים ותרבותיים מפורטים של שמונה המדינות הגדולות ביותר על פני כדור הארץ,
      מהטייגה הרוסית והטונדרה הקנדית ועד המדבר האוסטרלי והפמפס הארגנטינאי.
    cards:
      - title: "מקום 1: רוסיה (17,098,242 קמ״ר | בירה: מוסקבה)"
        points:
          - "רוסיה היא ענקית הגאוגרפיה הבלתי מעורערת של כדור הארץ, המשתרעת על פני יותר מ-17 מיליון קמ״ר במזרח אירופה ובצפון אסיה, וגובלת ב-14 מדינות יבשתיות."
          - "בירתה ההיסטורית, מוסקבה, היא העיר המאוכלסת ביותר באירופה, שבלבה שוכנים הכיכר האדומה, כנסיית וסילי הקדוש ומתחם הקרמלין המבוצר."
          - "ברוסיה נמצא ימת באיקל שבסיביר — האגם העמוק בעולם (1,642 מטרים) והעתיק ביותר, המכיל יותר מ-20% מכלל המים המתוקים הזמינים על פני כדור הארץ."
          - "הרכבת הטרנס-סיבירית מחברת את מוסקבה לנמל ולדיווסטוק שבאוקיינוס השקט לאורך 9,289 קילומטרים, וחוצה שמונה אזורי זמן כקו הרכבת הארוך בעולם."
          - "הרי האורל מהווים את הגבול הגאוגרפי הטבעי המסורתי המפריד בין יבשת אירופה ליבשת אסיה."
      - title: "מקום 2: קנדה (9,984,670 קמ״ר | בירה: אוטווה)"
        points:
          - "קנדה היא המדינה השנייה בגודלה בעולם והגדולה ביותר בחצי הכדור המערבי, משתרעת על פני שישה אזורי זמן ומכילה יותר אגמי מים מתוקים מכל שאר מדינות העולם יחד."
          - "בירתה הפדרלית, אוטווה, נבחרה על ידי המלכה ויקטוריה ב-1857 כפשרה אסטרטגית בין האוכלוסייה דוברת האנגלית באונטריו לדוברי הצרפתית בקוויבק."
          - "למרות גודלה העצום, כ-90% מתושבי קנדה מתגוררים ברצועה צרה של עד 160 קילומטרים מגבולה הדרומי עם ארצות הברית."
          - "קנדה כוללת בשטחה את הקוטב המגנטי הצפוני, את הרי הרוקי המרשימים ויערות בוראליים רחבי ידיים."
          - "דגל עלה האדר המפורסם אומץ רשמית ב-1965, ומסמל את טבע הפרא של קנדה ואת מורשתה ההיסטורית."
      - title: "מקום 3: סין (9,596,960 קמ״ר | בירה: בייג׳ינג)"
        points:
          - "סין היא המדינה הגדולה ביותר השוכנת כולה ביבשת אסיה, וחולקת גבול יבשתי עם 14 מדינות שכנות — שיא עולמי משותף יחד עם רוסיה."
          - "בירתה, בייג׳ינג, היא מעוז תרבותי עתיק שבלבו שוכנת ׳העיר האסורה׳ — מתחם הארמון הקיסרי הגדול בעולם המכיל 980 מבנים וכמעט 9,000 חדרים."
          - "סין כוללת ניגודים גאוגרפיים דרמטיים, מרמת טיבט הקפואה (׳גג העולם׳) דרך מדבר גובי הצחיח ועד לעמקי נהרות היאנגצה והצהוב הפוריים."
          - "החומה הסינית הגדולה נבנתה לאורך יותר משני אלפי שנים להגנה מפני פלישות מצפון, ואורכם המצטבר של כלל מקטעיה ההיסטוריים עולה על 21,000 קילומטרים."
          - "עם למעלה מ-1.4 מיליארד תושבים, סין מרושתת ברשת הרכבות המהירות הגדולה בתבל, המפעילה מעל שני שלישים מכלל מסילות הרכבת המהירה בעולם."
      - title: "מקום 4: ארצות הברית (9,525,067 קמ״ר | בירה: וושינגטון די.סי.)"
        points:
          - "ארצות הברית משתרעת על פני 50 מדינות מהאוקיינוס האטלנטי ועד לאוקיינוס השקט, כולל אלסקה הארקטית (המדינה הגדולה ביותר בשטחה בארה״ב) והוואי הגעשית."
          - "בירתה הפדרלית, וושינגטון די.סי., נוסדה לצד נהר הפוטומק ב-1790 כמחוז פדרלי עצמאי, ועוצבה בשדרות רחבות ואנדרטאות נאו-קלאסיות על ידי פייר ל׳אנפן."
          - "ארה״ב הקימה את הפארק הלאומי הראשון בעולם, ילוסטון (1872), היושב מעל קלדרה געשית עצומה וכולל מעל 500 גייזרים פעילים."
          - "נופיה מגוונים להפליא, וכוללים את המישורים הגדולים, אגן נהר המיסיסיפי, הגרנד קניון, הרי הרוקי ועמק המוות (המקום החם ביותר שנמדד בכדור הארץ ב-56.7 מעלות)."
          - "הדולר האמריקאי הוא מטבע היתרות העולמי המוביל, והכלכלה האמריקאית מייצרת את התמ״ג הנומינלי הגדול בעולם."
      - title: "מקום 5: ברזיל (8,515,767 קמ״ר | בירה: ברזיליה)"
        points:
          - "ברזיל היא המדינה הגדולה ביותר בדרום אמריקה ובחצי הכדור הדרומי, ותופסת כמעט מחצית משטחה של יבשת דרום אמריקה כולה."
          - "בירתה הפדרלית, ברזיליה, הוקמה יש מאין בתוך 41 חודשים בלבד בלב הסוואנה הברזילאית, ועוצבה על ידי לוסיו קוסטה בצורת מטוס ענק."
          - "ברזיל כוללת למעלה מ-60% מיער האמזונס — מאגר המגוון הביולוגי הגדול בעולם — ואת נהר האמזונס, שספיקת מימיו עולה על שבעת הנהרות הבאים אחריו יחד."
          - "ברזיל היא המדינה היחידה ביבשת אמריקה ששפתה הרשמית פורטוגזית, ותרבותה מפורסמת במוזיקת הסמבה ובקרנבל הססגוני של ריו דה ז׳ניירו."
          - "נבחרת ברזיל בכדורגל זכתה בחמישה גביעי עולם (מונדיאל), והצמיחה אגדות כמו פלה שהגדירו את תרבות הכדורגל העולמית."
      - title: "מקום 6: אוסטרליה (7,692,024 קמ״ר | בירה: קנברה)"
        points:
          - "אוסטרליה היא המדינה הריבונית היחידה בעולם החולשת על יבשת שלמה, ומוקפת לחלוטין באוקיינוס ההודי ובאוקיינוס השקט."
          - "בירתה המתוכננת, קנברה, עוצבה על ידי האדריכלים האמריקאים וולטר ברלי גריפין ומריון מהוני גריפין סביב אגם מלאכותי בשנת 1913."
          - "שונית המחסום הגדולה, הנמתחת לאורך 2,300 קילומטרים מול חופי קווינסלנד, היא מבנה החיים הגדול ביותר על פני כדור הארץ וניתן לראותה מהחלל."
          - "מעל 70% משטחה של אוסטרליה הוא מדבר צחיח או צחיח למחצה (האאוטבק), ביתם של חיות כיס ייחודיות כגון קנגורו, קואלה, וומבט וברווזן."
          - "אולורו (סלע איירס), מונולית אבן חול אדום ענקי המתנשא לגובה 348 מטרים בלב המדבר, מהווה אתר מקודש עבור ילידי האנאנגו האבוריג׳ינים."
      - title: "מקום 7: הודו (3,287,263 קמ״ר | בירה: ניו דלהי)"
        points:
          - "הודו היא המדינה השביעית בגודלה בעולם והמאוכלסת ביותר על פני כדור הארץ, עם למעלה מ-1.4 מיליארד תושבים הדוברים מאות שפות וניבים שונים."
          - "בירתה, ניו דלהי, תוכננה על ידי האדריכל הבריטי אדווין לוטיינס ומתאפיינת בשדרות רחבות, ארמון הנשיאות רשטרפטי בהוואן ואנדרטת שער הודו."
          - "גבולה הצפוני של הודו מעוטר ברכס הרי ההימלאיה האדיר, בעוד מישורי הגנגס הפוריים ניזונים ממימי הנהרות הקדושים גנגס ויאמונה."
          - "הטאג׳ מהאל שבעיר אגרה, מאוזוליאום מרהיב משיש לבן שבנה הקיסר שאה ג׳האן לזכר אשתו מומתאז מהאל, נחשב לפסגת האדריכלות המוגולית."
          - "הודו היא ערש לידתן של ארבע מדתות העולם הגדולות: הינדואיזם, בודהיזם, ג׳ייניזם וסיקיזם, ותרמה לעולם את הרעיון המתמטי של הספרה אפס."
      - title: "מקום 8: ארגנטינה (2,780,400 קמ״ר | בירה: בואנוס איירס)"
        points:
          - "ארגנטינה היא המדינה השנייה בגודלה בדרום אמריקה, ונמתחת ממפלי איגואסו הטרופיים בצפון ועד לקרחוני פטגוניה בדרום הקפוא."
          - "בירתה הקוסמופוליטית, בואנוס איירס, מכונה ׳פריז של דרום אמריקה׳ הודות לאדריכלות אירופית מפוארת, תרבות בתי קפה עשירה וריקוד הטנגו שנולד בה."
          - "הר אקונקגווה שבהרי האנדים הארגנטינאיים מתנשא לגובה 6,961 מטרים, ומהווה את הפסגה הגבוהה ביותר בחצי הכדור המערבי והדרומי."
          - "ערבות הפמפס הפוריות של מרכז המדינה מהוות את הלב החקלאי של ארגנטינה, מפורסמות בגידול בקר ובתרבות בוקרי הגאוצ׳ו."
          - "בקצה הדרומי, העיר אושואיה שבארץ האש שוכנת על שפת תעלת ביגל ומוכרת כעיר הדרומית ביותר בעולם (׳סוף העולם׳)."
