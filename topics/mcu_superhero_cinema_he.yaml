id: mcu_superhero_cinema_he
title: היקום הקולנועי של מארוול וסרטי גיבורי-על (The MCU)
description: היכנסו אל היקום הקולנועי המצליח והמורכב ביותר בתולדות הקולנוע! החל מלידתו של איירון מן ומלחמת אבני האינסוף ועד
  לסאגת המולטיוורס, ספיידרמן ודדפול – בחנו את הידע שלכם בסרטי מארוול, תיאוריות, דמויות וסודות ממאחורי הקלעים.
lang: he
audience: adult
categories:
- id: phase1_origins
  title: 'שלב 1: מקורות הגיבורים והנוקמים מתאחדים (2008–2012)'
  description: כיצד קווין פייגי, רוברט דאוני ג'וניור וג'וס ווידון יצרו את הבסיס ליקום הקולנועי המשותף.
  cards:
  - title: איירון מן (Iron Man, 2008)
    points:
    - 'ציון IMDb: 7.9/10 | בימוי: ג''ון פאברו | בכיכובם של רוברט דאוני ג''וניור, גווינת'' פאלטרו (פפר פוטס) וג''ף ברידג''ס
      (עובדיה סטיין / איירון מונגר).'
    - 'עלילה ותמות: התעשיין המיליארדר טוני סטארק נחטף באפגניסטן, בונה חליפת שריון מאולתרת המונעת על ידי כור קשת (Arc Reactor),
      ומחליט להקדיש את חייו להגנה על האנושות.'
    - 'הפקה ואלתורים: צולם בעיקר בקליפורניה. הבמאי ג''ון פאברו איפשר חופש אלתור נרחב לדיאלוגים מכיוון שהתסריט שוכתב בזמן אמת
      לאורך הצילומים.'
    - 'רגע מכונן: סצנת אחרי-הכתוביות הראשונה בהשתתפות סמואל ל. ג''קסון כניק פיורי (''אתה חלק מיקום גדול יותר, אתה פשוט עוד
      לא יודע את זה'') ילדה את רעיון היקום המשותף.'
  - title: 'קפטן אמריקה: הנוקם הראשון (The First Avenger, 2011)'
    points:
    - 'ציון IMDb: 6.9/10 | בימוי: ג''ו ג''ונסטון | בכיכובם של כריס אוונס (סטיב רוג''רס) והוגו וויבינג (יוהאן שמידט / הגולגולת
      האדומה).'
    - 'עלילה ותמות: במלחמת העולם השנייה, המתנדב הצנום סטיב רוג''רס מקבל את נסיוב ''חייל-העל'' של ד״ר ארסקין, ויוצא להילחם
      בזרוע המדע הנאצית הסוררת ''הידרה'' כשהוא חמוש במגן ויברניום.'
    - 'חשיפת אבן אינסוף: הציג לראשונה את קוביית הטסרקט הכחולה והזוהרת, שלימים התגלתה כמכילה את אבן המרחב.'
    - 'אפקטים חזותיים: חברת Lola VFX השתמשה בהקטנה דיגיטלית מתקדמת של גופו של כריס אוונס ליצירת דמותו של ''סטיב הרזה'' לפני
      קבלת הנסיוב.'
  - title: תור (Thor, 2011)
    points:
    - 'ציון IMDb: 7.0/10 | בימוי: הבמאי והשחקן השייקספירי קנת בראנה.'
    - 'שחקנים ודמויות: כריס המסוורת'' בתור אל הרעם היהיר, טום הידלסטון בתפקיד הפריצה הגדול שלו כלוקי אל התככים, ואנתוני הופקינס
      בתור המלך אודין.'
    - 'עלילה ותמות: תור מנושל מכוחותיו ומפטישו מיולניר ומוגלה לכדור הארץ (ניו מקסיקו) כדי ללמוד ענווה, בגרות וראויות אמיתית.'
    - 'טריוויה על ליהוק: טום הידלסטון נבחן במקור לתפקידו של תור והעלה כ-10 ק״ג מסת שריר, לפני שבראנה הבין שהוא מושלם לתפקיד
      לוקי.'
  - title: הנוקמים (The Avengers, 2012)
    points:
    - 'ציון IMDb: 8.0/10 | תסריט ובימוי: ג''וס ווידון | הסרט הראשון בהיסטוריה שהכניס מעל 200 מיליון דולר בסוף שבוע הפתיחה
      בצפון אמריקה.'
    - 'עלילה ותמות: גיבורי-העל החזקים ביותר בכדור הארץ (איירון מן, קפטן אמריקה, תור, הענק הירוק, האלמנה השחורה והוקאיי) מתאחדים
      לעצור את לוקי וצבא הצ''יטאורי בקרב על ניו יורק.'
    - 'סצנה מיתולוגית: השוט המעגלי המפורסם ב-360 מעלות של כל חברי הצוות העומדים גב אל גב במרכז מנהטן.'
    - 'אחרי הכתוביות: סצנת השווארמה הדוממת והמפורסמת, שצולמה ימים ספורים בלבד לאחר הקרנת הבכורה החגיגית בהוליווד.'
  trivia:
  - type: multiple_choice
    question: איזה משפט מפורסם מכריז טוני סטארק במסיבת העיתונאים בסיום הסרט 'איירון מן' (2008), כשהוא שובר את מוסכמת הזהות
      הסודית?
    options:
    - '''אני איירון מן'''
    - '''האמת היא שאני עובד עם איירון מן'''
    - '''שלום בימינו'''
    - '''הנוקמים, התאחדו'''
    correct: 0
    explanation: המשפט 'I am Iron Man' נאמר בחלקו באלתור של רוברט דאוני ג'וניור, והפך לחותמת המובהקת של טוני סטארק ביקום מארוול.
  - type: multiple_choice
    question: מאיזו מתכת בדיונית ונדירה בנה הווארד סטארק את המגן העגול של קפטן אמריקה?
    options:
    - ויברניום (Vibranium)
    - אדמנטיום (Adamantium)
    - אורו (Uru)
    - פרומתיום
    correct: 0
    explanation: הווארד סטארק השתמש במתכת הבולמת רעידות וויברציות, ויברניום, שמקורה בממלכת ווקאנדה המבודדת.
  - type: multiple_choice
    question: איזה שחקן נבחן והעלה משקל במקור עבור תפקידו של תור, לפני שלוהק בסופו של דבר לתפקיד לוקי?
    options:
    - טום הידלסטון
    - בנדיקט קמברבאץ'
    - סבסטיאן סטן
    - פול בטאני
    correct: 0
    explanation: טום הידלסטון התאמן והעלה מסת שריר לקראת מבחן הבד לדמותו של תור, אך הבמאי קנת בראנה זיהה בו את לוקי המושלם.
  - type: multiple_choice
    question: איזה מאכל מהיר אוכלים הנוקמים בדממה מוחלטת בסצנת אחרי-הכתוביות המפורסמת בסרט 'הנוקמים' (2012)?
    options:
    - שווארמה
    - צ'יזבורגרים
    - משולשי פיצה ניו יורקית
    - נודלס סיני מוקפץ
    correct: 0
    explanation: בהמשך להצעתו של טוני סטארק בסיום הקרב לבדוק מקום שווארמה סמוך, חברי הצוות יושבים מותשים ואוכלים שווארמה בדממה.
  - type: multiple_choice
    question: איזו ישות קוסמית מאיימת מופיעה לראשונה בהצצה חטופה בסצנת אמצע-הכתוביות של 'הנוקמים' (2012)?
    options:
    - תאנוס
    - גלקטוס
    - קאנג הכובש
    - האספן
    correct: 0
    explanation: תאנוס מסתובב אל המצלמה בחיוך מאיים כאשר עוזרו מזהיר אותו כי עימות מול גיבורי כדור הארץ הוא 'חיזור אחר המוות'.
  - type: multiple_choice
    question: מהו שמה של מערכת הבינה המלאכותית של טוני סטארק המלווה אותו בקסדתו ובמעבדתו (בקולו של פול בטאני)?
    options:
    - ג'ארוויס (J.A.R.V.I.S.)
    - פריידיי (F.R.I.D.A.Y.)
    - אדית' (E.D.I.T.H.)
    - קארן (K.A.R.E.N.)
    correct: 0
    explanation: ג'ארוויס (J.A.R.V.I.S.) שירת כבינה המלאכותית של טוני סטארק לפני שהוטמע בגופו של ויז'ן.
  - type: multiple_choice
    question: 'בסרט ''קפטן אמריקה: הנוקם הראשון'', באיזה חפץ מיסטי מוטמנת אבן המרחב שבאמצעותה מפתח הגולגולת האדומה נשקי-על?'
    options:
    - הטסרקט (The Tesseract)
    - האת'ר (The Aether)
    - האורב (The Orb)
    - עין אגאמוטו
    correct: 0
    explanation: יוהאן שמידט גונב את קוביית הטסרקט הזוהרת מכנסייה בנורווגיה כדי להניע את נשקי הידרה.
  - type: multiple_choice
    question: מי ביים את הסרט השייקספירי והמלכותי 'תור' שיצא לאקרנים בשנת 2011?
    options:
    - קנת בראנה
    - ג'וס ווידון
    - ג'ון פאברו
    - טאיקה וואיטיטי
    correct: 0
    explanation: הבמאי והשחקן השייקספירי הבריטי קנת בראנה ביים את הסרט והעניק לממלכת אסגרד נופך תיאטרלי רם-מעלה.
  - type: multiple_choice
    question: 'על איזה כלי נשק לחש המלך אודין את הכישוף: ''כל האוחז בפטיש זה, אם ראוי הוא, יזכה בכוחו של תור''?'
    options:
    - מיולניר
    - סטורמברייקר
    - גונגניר
    - חרב ההופונד של היימדל
    correct: 0
    explanation: אודין כישף את פטיש הקרב של תור, מיולניר, שחושל בלבו של כוכב גוסס, לפני שהשליך אותו לכדור הארץ.
  - type: multiple_choice
    question: איזה מנהל סוכנות S.H.I.E.L.D. מופיע בסצנת אחרי-הכתוביות ב'איירון מן' (2008) כדי לדבר עם טוני על 'יוזמת הנוקמים'?
    options:
    - ניק פיורי
    - פיל קולסון
    - אלכסנדר פירס
    - מריה היל
    correct: 0
    explanation: סמואל ל. ג'קסון בהופעת אורח מפתיעה כניק פיורי הצית את הרעיון של יקום קולנועי משותף.
- id: phase2_3_infinity
  title: 'שלב 2 ו-3: סאגת האינסוף והרחבת הקוסמוס (2014–2018)'
  description: התרחבות היקום עם מותחני ריגול, הרפתקאות בחלל ומלחמת אזרחים פנימית בין הגיבורים.
  cards:
  - title: 'קפטן אמריקה: חייל החורף (The Winter Soldier, 2014)'
    points:
    - 'ציון IMDb: 7.8/10 | בימוי: האחים אנתוני וג''ו רוסו.'
    - 'שחקנים ודמויות: כריס אוונס, סקרלט ג''והנסון (האלמנה השחורה), אנתוני מאקי (סאם וילסון / פלקון) וסבסטיאן סטן כבאקי ברנז
      / חייל החורף.'
    - 'עלילה ותמות: מותחן קונספירציה וריגול בסגנון שנות ה-70 החושף כי ארגון הידרה הסתנן ושלט בחשאי בסוכנות S.H.I.E.L.D. מאז
      מלחמת העולם השנייה.'
    - 'אקשן בלתי-נשכח: קרב המעלית המפורסם שבו קפטן אמריקה נלחם לבדו מול 10 סוכני יחידת STRIKE במעלית זכוכית יורדת.'
    - 'השפעה: ההצלחה הביקורתית סללה לאחים רוסו את הדרך לבימוי ''מלחמת האזרחים'', ''מלחמת האינסוף'' ו''סוף המשחק''.'
  - title: שומרי הגלקסיה (Guardians of the Galaxy, 2014)
    points:
    - 'ציון IMDb: 8.0/10 | תסריט ובימוי: ג''יימס גאן.'
    - 'שחקנים ודמויות: כריס פראט (פיטר קוויל / סטאר לורד), זואי סלדנה (גאמורה), דייב בטיסטה (דראקס), בראדלי קופר (רוקט) ווין
      דיזל (גרוט).'
    - 'עלילה ותמות: חבורת פושעים גלקטיים מפוקפקים מתאחדים כדי למנוע מרונאן המאשים להשתמש באבן הכוח הסגולה להשמדת כוכב קסאנדר.'
    - 'תופעה מוזיקלית: קלטת הלהיטים הנוסטלגית משנות ה-70 (''Awesome Mix Vol. 1'') כבשה את המקום הראשון במצעד בילבורד 200 ללא
      אף שיר מקורי חדש.'
  - title: 'קפטן אמריקה: מלחמת האזרחים (Civil War, 2016)'
    points:
    - 'ציון IMDb: 7.8/10 | בימוי: האחים רוסו | עיבוד לקשת הקומיקס המפורסמת של מארק מילר.'
    - 'עלילה ותמות: הנוקמים מתפצלים לשני מחנות עקב ''הסכמי סוקוביה'' לפיקוח האו״ם על גיבורי-על: צוות איירון מן מול צוות קפטן
      אמריקה המגן על חברו באקי.'
    - 'בכורות ענק ב-MCU: הציג לראשונה את טום הולנד כספיידרמן ואת צ''דוויק בוזמן כפנתר השחור.'
    - 'שוט אקשן מרכזי: קרב נמל התעופה בלייפציג בן 17 הדקות שצולם במצלמות IMAX דיגיטליות.'
  - title: 'תור: ראגנארוק (Thor: Ragnarok, 2017)'
    points:
    - 'ציון IMDb: 7.9/10 | בימוי: הבמאי הניו זילנדי טאיקה וואיטיטי.'
    - 'שחקנים ודמויות: כריס המסוורת'', מארק ראפלו (הענק הירוק), קייט בלאנשט (הלה אלת המוות), ג''ף גולדבלום (הגראנדמאסטר) וטסה
      תומפסון (ואלקירי).'
    - 'המצאה מחדש: הפך את מותג תור לקומדיית אקשן צבעונית ומלהיבה בהשראת האייטיז, שבה תור נלחם בענק הירוק בזירה בסאקאר ונאבק
      בהלה כדי להציל את אנשי אסגרד.'
    - 'מסר מרכזי: אסגרד איננה מקום גיאוגרפי – היא האנשים עצמם.'
  - title: הפנתר השחור (Black Panther, 2018)
    points:
    - 'ציון IMDb: 7.3/10 | בימוי: ראיין קוגלר | בכיכובם של צ''דוויק בוזמן, מייקל בי. ג''ורדן (אריק קילמונגר), לופיטה ניונגו
      ולטישה רייט.'
    - 'תופעה תרבותית: סרט גיבורי-העל הראשון בהיסטוריה שהיה מועמד לפרס אוסקר לסרט הטוב ביותר; זכה ב-3 פרסי אוסקר (עיצוב תלבושות,
      עיצוב אמנותי ופסקול מקורי).'
    - 'עלילה ותמות: ט''צ''אלה יורש את כס המלכות בממלכת ווקאנדה המתקדמת טכנולוגית, ומתמודד עם חזונו המהפכני והכואב של קילמונגר.'
