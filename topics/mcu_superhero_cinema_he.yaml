- id: lore_cameos_secrets
  title: סודות מארוול, הופעות סטן לי וטריוויה מאחורי הקלעים
  description: איסטר אגס, מחוות ליוצרי הקומיקס וליהוקים כמעט-אחרים ששינו את תולדות הקולנוע.
  cards:
  - title: 'סטן לי: אבי הופעות האורח הקולנועיות של מארוול'
    points:
    - 'מורשת אגדית: יוצר הקומיקס המיתולוגי סטן לי (1922–2018) הופיע ב-22 סרטי MCU החל מ''איירון מן'' (2008) ועד להופעתו האחרונה
      לאחר מותו ב''סוף המשחק'' (כנהג היפי משנות ה-70).'
    - 'תיאוריית ''הצופים'' (The Watchers): ב''שומרי הגלקסיה: חלק 2'', סטן לי מוצג בחליפת חלל כשהוא מדווח על הרפתקאותיו בכדור
      הארץ לגזע ''הצופים'' הקוסמי, מה שאימת את תיאוריית המעריצים שהוא מגלם את אותו סוכן מידע קוסמי בכל הסרטים.'
  - title: ליהוקים שכמעט קרו ב-MCU
    points:
    - 'איירון מן: הנהלת מארוול התנגדה בתחילה לרוברט דאוני ג''וניור ורצתה את טום קרוז או ניקולס קייג'', אך ג''ון פאברו נלחם
      בעקשנות עבור דאוני.'
    - 'האלמנה השחורה: אמילי בלאנט לוהקה במקור לתפקיד נטשה רומנוף ב''איירון מן 2'', אך נאלצה לפרוש עקב מחויבות חוזית לסרט ''מסעות
      גוליבר'', מה שפתח את הדלת לסקרלט ג''והנסון.'
    - 'סטאר לורד: גלן האוורטון (דניס ב''פילדלפיה זורחת'') היה הבחירה השנייה של ג''יימס גאן אם כריס פראט היה מסרב.'
  - title: מסורת סצנות אחרי-הכתוביות
    points:
