id: ancient_civilizations_wonders_he
icon: 🏛️
title: תרבויות עתיקות ופלאי תבל
description: 'מסע מרתק אלפי שנים אחורה בזמן אל לב תרבויות העבר המפוארות: מהפירמידות
  של גיזה והקולוסיאום ברומא, ועד מאצ׳ו פיצ׳ו בעננים, מקדשי המאיה, זיגוראתים בבבל ונתיבי
  דרך המשי.'
lang: he
audience: family
categories:
- id: important_facts
  title: '1. עובדות חשובות: עמודי התווך של העת העתיקה'
  description: 'אבני הראשה של הציוויליזציה האנושית: לידת הערים בין הפרת לחידקל, שבעת
    פלאי תבל, הופעת הכתב, חוקי המשפט והנדסת האבן המונומנטלית.'
  cards:
  - id: cradle_of_civilization_mesopotamia
    title: 'מסופוטמיה: ערש הערים והציוויליזציה'
    points:
    - השם 'מסופוטמיה' מקורו ביוונית ופירושו 'הארץ שבין הנהרות', בהתייחס לעמקים הפוריים
      שבין נהרות הפרת והחידקל בשטחי עיראק של ימינו.
    - סביב שנת 4000 לפני הספירה הקימו השומרים את המרכזים העירוניים האמיתיים הראשונים
      בהיסטוריה, בהם אורוק ואור, שכללו תעלות השקיה וחלוקת עבודה מקצועית.
    - השומרים המציאו את אובניים של הקדר, את גלגל המרכבה, וחלוקת זמן מתמטית המבוססת
      על בסיס 60 (סקסגסימלי), ממנה קיבלנו את 60 הדקות בשעה ו-360 המעלות במעגל.
    - מגדלי מקדש מדורגים ענקיים מלבני טיט, שכונו זיגוראתים, שימשו כמרכזים פולחניים
      ובו-בזמן כמוקדי ניהול כלכלי וחלוקת תבואה ואריגים.
  - id: seven_wonders_ancient_world
    title: שבעת פלאי תבל של העולם העתיק
    points:
    - הרשימה הקנונית גובשה במאה השנייה לפני הספירה על ידי סופרים ונוסעים הלניסטיים,
      ובראשם אנטיפטרוס מצידון ופילון מביזנטיון.
    - כל שבעת הפלאים המקוריים רוכזו סביב אגן הים התיכון והמזרח התיכון, כפי ששיקף את
      גבולות העולם הידוע לתרבות ההלניסטית.
    - הפירמידה הגדולה של גיזה במצרים היא גם המבנה העתיק ביותר ברשימה (נבנתה סביב 2560
      לפנה״ס) וגם הפלא היחיד ששרד ועומד על תילו עד היום.
    - ששת הפלאים האחרים—הקולוסוס מרודוס, המגדלור באלכסנדריה, המאוזוליאום בהליקרנסוס,
      מקדש ארטמיס, פסל זאוס באולימפיה והגנים התלויים בבבל—נחרבו כולם ברעידות אדמה,
      שריפות ומלחמות.
  - id: invention_of_writing_cuneiform_hieroglyphs
    title: 'שחר הכתב: מלוחות חרס ועד פפירוס'
    points:
    - השפה הכתובה הופיעה לראשונה באופן עצמאי בשומר (כתב היתדות) סביב 3400 לפנה״ס,
      וזמן קצר לאחר מכן במצרים העתיקה (כתב החרטומים) סביב 3200 לפנה״ס.
    - 'כתב היתדות נולד לא מתוך צורך ספרותי או שירה, אלא למטרות חשבונאיות: קני סוף
      מחודדים שנטבעו בלוחות טיט לחים כדי לתעד שקי שעורה, ראשי בקר וכדי שיכר.'
    - 'סופרי מצרים השתמשו בשלושה סוגי כתב: הירוגליפים מונומנטליים לחריטה באבן המקדשים,
      כתב היראטי מהיר על גבי פפירוס, ומאוחר יותר כתב דמוטי לניהול חיי היומיום.'
    - האלפבית הפוניקי-כנעני שהומצא סביב 1050 לפנה״ס צמצם אלפי סמלים ציוריים מסובכים
      ל-22 אותיות עיצוריות בלבד, והפך לאבי האלפבית היווני, הלטיני והעברי.
  - id: code_of_hammurabi_ancient_law
    title: חוקי חמורבי והמשפט הכתוב
    points:
    - אסטלת הבזלת השחורה של המלך חמורבי מבבל, שנחקקה סביב שנת 1750 לפנה״ס ומתנשאת
      לגובה של מעל שני מטרים, מהווה את אחד מקובצי החוקים השלמים הקדומים בתבל.
    - בראש המצבה נראה חמורבי כשהוא מקבל את שרביט הסמכות המלכותית ישירות מידי שמש,
      אל השמש והצדק המסופוטמי.
    - הקובץ כולל 282 סעיפי חוק המקיפים דיני מסחר, חוזים, שכר עבודה, נישואין ורכוש,
      ועיגן את עקרון הענישה המידתית המפורסם ('עין תחת עין').
    - חקיקת החוקים באבן במרחב הציבורי מנעה משופטים לפסוק באופן שרירותי, וביססה לראשונה
      את עקרון חזקת החפות ודרישת עדויות בבית המשפט.
  - id: agricultural_revolution_nile_fertile_crescent
    title: 'נהרות החיים: הנילוס והסהר הפורה'
    points:
    - ההיסטוריון היווני הרודוטוס הגדיר את מצרים כ'מתנת הנילוס', שכן הצפות הקיץ השנתיות
      הותירו על אדמת המדבר שכבת סחף שחורה ועשירה במינרלים.
    - 'המצרים הקדמונים חילקו את לוח השנה לשלוש עונות חקלאיות שהוכתבו כולן על ידי מחזור
      הנהר: אחת (עונת ההצפה), פרת (עונת הזריעה) ושמו (עונת הקציר).'
    - במסופוטמיה, ההצפות הפתאומיות והבלתי צפויות חייבו הקמת רשת מורכבת של תעלות מלאכותיות,
      סכרים ומאגרים שתוחזקו באחריות קהילתית משותפת.
    - עודפי התבואה שיוצרו אפשרו לחברות להזין אוכלוסייה שלא עסקה בחקלאות, וכך צמחו
      לראשונה מהנדסים, סופרים, רופאים ואדריכלי ענק במשרה מלאה.
  - id: monumental_stone_engineering
    title: 'פלאי הנדסה: שינוע גושי אבן של עשרות טונות'
    points:
    - בנאים בעת העתיקה חצבו ושינעו גושי אבן גיר וגרניט במשקל של עשרות ומאות טונות
      ללא מנועים מכניים, ללא סוסי משא וללא כלי ברזל.
    - פועלים מצרים גררו את אבני הענק על גבי מזחלות עץ מעל חול מדברי שנרטב במים במינון
      מדויק, מה שהפחית את החיכוך בכמעט 50 אחוזים.
    - כדי לחצוב אובליסקים מגרניט, הבנאים חבטו בכדורי דולריט קשים והחדירו יתדות עץ
      יבשות לחריצים בסלע; הרטבת העץ גרמה להתנפחותו שביקעה את האבן בקו ישר ונקי.
    - בהרי האנדים, בנאי האינקה סיתתו גושי סלע פוליגונליים עצומים שהותאמו בדיוק מיקרוסקופי
      כה מושלם עד שלא ניתן להחדיר להב סכין בין האבנים.
  - id: birth_of_democracy_athens
    title: 'אתונה: לידת הדמוקרטיה הישירה'
    points:
    - בשנת 508 לפנה״ס הוביל המדינאי האתונאי קלייסתנס רפורמות פוליטיות חסרות תקדים
      שהולידו את הדמוקרטיה הישירה הראשונה בהיסטוריה ('דמוקרטיה' = שלטון העם).
    - אזרחים גברים התכנסו בגבעת הפניקס באספת העם (אקלסיה) כדי לדון ולהצביע ישירות
      על חוקים, מסעות מלחמה והסכמי שלום בינלאומיים.
    - כדי למנוע שחיתות ויצירת מעמד פוליטיקאים מקצועי, רוב שופטי ופקידי השלטון נבחרו
      בהגרלה אקראית באמצעות מתקני שיש ייעודיים שכונו קלרוטריון.
    - האזרחים יכלו להגן על הדמוקרטיה מפני עריצים פוטנציאליים באמצעות הצבעה שנתית לגירוש
      פוליטיקאי מסוכן ל-10 שנים, על ידי חריטת שמו על שברי חרס שכונו אוסטרקה.
  - id: ancient_trade_routes_silk_incense
    title: 'עורקי המסחר העתיקים: דרך המשי ודרך הבשמים'
    points:
    - דרך המשי נפתחה באופן רשמי בימי שושלת חאן בסין סביב שנת 130 לפנה״ס, והשתרעה על
      פני רשת נתיבים באורך של מעל 6,000 קילומטרים מסין ועד רומא.
    - מלבד משי, תבלינים, אבני ירקן וזכוכית, שימשה דרך המשי נתיב מרכזי להפצת רעיונות
      פילוסופיים, דתות (בודהיזם ונצרות) וטכנולוגיות ייצור נייר ואבק שריפה.
    - דרך הבשמים חצתה את חצי האי ערב והובילה שרפי לבונה ומור יקרי ערך בשיירות גמלים
      מתימן, דרך מבצר הסלע הנבטי של פטרה, ועד לנמל עזה לחופי הים התיכון.
    - חאנים ושיירות-דרכים (קרוואנסראי) נבנו במרחק של יום רכיבה זה מזה, והציעו בארות
      מים, אורוות מוגנות ולינה בטוחה לסוחרים בלב המדבריות.
  - id: rediscovery_of_lost_worlds
    title: 'נסים ארכאולוגיים: חשיפת עולמות אבודים'
    points:
    - רבים מפלאי העולם נותרו נסתרים במשך מאות שנים מתחת לג'ונגלים טרופיים עבותים,
      חולות מדבר נודדים או אפר געשי לפני שהתגלו במחקר המודרני.
    - בשנת 1911 הובילו חקלאים מקומיים מבני הקצ'ואה את החוקר חירם בינגהאם אל חורבותיה
      העטופות יער של מאצ׳ו פיצ׳ו, והביאו את מצודת האינקה לתהילת עולם.
    - חיפושו העיקש בן עשר השנים של הווארד קרטר בעמק המלכים במצרים הוכתר בנובמבר 1922
      בגילוי קברו של המלך תות ענח׳ אמון, עמוס באלפי אוצרות זהב.
    - מסעו של החוקר הצרפתי אנרי מוהו בשנת 1860 חשף בפני המערב את מקדשי הענק המרהיבים
      של אנגקור ואט בקמבודיה, שנבלעו בלב יערות הגשם.
  - id: astronomical_alignments_solstices
    title: 'צפייה בכוכבים: יישור מקדשים לשמש ולגרמי השמיים'
    points:
    - אדריכלי העת העתיקה יישרו מבני ענק לתופעות אסטרונומיות בדיוק מתמטי מעורר השתאות
      המשתווה למדידות לוויינים מודרניות.
    - ארבע פאותיה המשולשות של הפירמידה הגדולה בגיזה פונות בדיוק מופתי לארבע רוחות
      השמיים, עם סטייה מזערית של פחות מ-4 דקות קשת מצפון גיאוגרפי אמיתי.
    - בפירמידת אל קסטיליו בצ'יצ'ן איצה, קרני השמש השוקעת בימי השוויון של האביב והסתיו
      יוצרות אשליית צל של נחש ענק הזוחל מטה במורד המדרגות.
    - במקדש אבו סימבל בדרום מצרים, תכנן רעמסס השני את החלל הפנימי כך שקרני השמש יחדרו
      ויאירו את פסלו פעמיים בלבד בשנה—ביום הולדתו וביום הכתרתו.
  trivia:
  - type: multiple_choice
    question: איזה מפלאי תבל של העולם העתיק הוא היחיד ששרד ועומד שלם על תילו עד היום?
    options:
    - הפירמידה הגדולה של גיזה
    - הקולוסוס מרודוס
    - המגדלור באלכסנדריה
    - הגנים התלויים בבבל
    correct: 0
    explanation: הפירמידה הגדולה של גיזה, שנבנתה עבור הפרעה ח׳ופו סביב שנת 2560 לפנה״ס,
      היא הפלא העתיק ביותר ברשימה והיחיד ששרד כמעט בשלמותו.
  - type: multiple_choice
    question: בין אילו שני נהרות מפורסמים צמחה הציוויליזציה העתיקה של מסופוטמיה?
    options:
    - הפרת והחידקל
    - הנילוס והירדן
    - האינדוס והגנגס
    - היאנגצה והנהר הצהוב
    correct: 0
    explanation: השם מסופוטמיה פירושו ביוונית 'בין הנהרות', והוא מתייחס לעמק הפורה
      שבין נהרות הפרת והחידקל בשטחי עיראק המודרנית.
  - type: multiple_choice
    question: איזו שיטת ספירה שהמציאו השומרים משפיעה עד היום על חלוקת הזמן והמעגלים
      בחיינו?
    options:
    - השיטה הסקסגסימלית (בסיס 60)
    - השיטה הבינארית (בסיס 2)
    - השיטה הדצימלית (בסיס 10)
    - השיטה הדואודצימלית (בסיס 12)
    correct: 0
    explanation: השומרים השתמשו בשיטת ספירה על בסיס 60, ממנה ירשנו את 60 השניות בדקה,
      60 הדקות בשעה ו-360 המעלות במעגל השלם.
  - type: multiple_choice
    question: כיצד נקרא כתב הטיט הקדום שהתפתח בשומר סביב 3400 לפנה״ס באמצעות הטבעת
      קני סוף מחודדים?
    options:
    - כתב יתדות
    - כתב לינארי ב׳
    - כתב דמוטי
    - כתב חרטומים
    correct: 0
    explanation: כתב היתדות נכתב באמצעות לחיצת קנה סוף מחודד בעל קצה משולש אל תוך
      לוחות חומר רכים שיובשו בשמש.
  - type: multiple_choice
    question: איזה אל מסופוטמי מתואר בראש אסטלת חוקי חמורבי כמי שמעניק את החוקים למלך
      בבל?
    options:
    - שמש (אל השמש והצדק)
    - מרדוך
    - אנליל
    - גלגמש
    correct: 0
    explanation: בראש המצבה השחורה נראה חמורבי מקבל את שרביט החוק מידי האל שמש, פטרון
      הצדק, היושר והמשפט במסופוטמיה.
  - type: multiple_choice
    question: איזה היסטוריון יווני קלאסי טבע את האמרה המפורסמת ש'מצרים היא מתנת הנילוס'?
    options:
    - הרודוטוס
    - תוקידידס
    - סטראבון
    - קסנופון
    correct: 0
    explanation: הרודוטוס ציין כי ללא שיטפונות הקיץ השנתיים של הנילוס שהעשירו את האדמה
      בסחף שחור, מצרים לא הייתה אלא מדבר צחיח ושומם.
  - type: multiple_choice
    question: כיצד הפחיתו בנאי מצרים העתיקה את החיכוך בעת גרירת מזחלות עמוסות גושי
      אבן כבדים על החול?
    options:
    - שפיכת כמות מדודה של מים על החול לפני המזחלת
    - פיזור אבקת עצמות טחונה לאורך הנתיב
    - הנחת מסילות ברונזה משומנות
    - כיסוי הקרקע בעלי דקל לחים
    correct: 0
    explanation: ציורי קיר מצריים מוכיחים כי הרטבת החול בכמות מדודה של מים יוצרת גשרי
      מים זעירים בין הגרגרים ומפחיתה את כוח הגרירה בכ-50%.
  - type: multiple_choice
    question: באיזה אופן אקראי נבחרו רוב השופטים ופקידי השלטון בדמוקרטיה האתונאית
      הקלאסית?
    options:
    - הגרלה פומבית (סורטיציה)
    - ירושה משפחתית מדור לדור
    - מכירה פומבית לכל המרבה במחיר
    - בחירות פתוחות למצביאים בלבד
    correct: 0
    explanation: כדי למנוע מאוליגרכים עשירים לקנות את השלטון, רוב התפקידים הציבוריים
      באתונה הוגרלו בין האזרחים באמצעות מתקני שיש ייעודיים.
  - type: multiple_choice
    question: כיצד נקראו שברי החרס ששימשו את אזרחי אתונה להצבעה על גירוש והגליה של
      פוליטיקאים מסוכנים?
    options:
    - אוסטרקה
    - פפירוסים
    - אסטלות
    - אמפורות
    correct: 0
    explanation: אזרחי אתונה חרטו את שמות המועמדים לגירוש על שברי חרס שכונו אוסטרקה,
      ומכאן נגזר המושג המודרני 'אוסטרקיזם' (נידוי חברתי).
  - type: multiple_choice
    question: איזה עורק מסחר יבשתי וימי שחיבר את סין לאימפריה הרומית נוסד בימי שושלת
      חאן סביב 130 לפנה״ס?
    options:
    - דרך המשי
    - דרך המלך הפרסית
    - דרך הענבר
    - דרך הים הרומית
    correct: 0
    explanation: דרך המשי הייתה רשת נתיבים מסחריים שהשתרעה לאורך אלפי קילומטרים ושימשה
      להובלת משי, תבלינים, רעיונות וטכנולוגיות בין המזרח למערב.
  - type: multiple_choice
    question: כיצד נקראו פונדקי הדרכים המבוצרים שהציעו מים, שווקים ומחסה לשיירות גמלים
      במדבר?
    options:
    - קרוואנסראי (חאן)
    - אגורה
    - זיגוראת
    - קטקומבות
    correct: 0
    explanation: מבני הקרוואנסראי הוקמו במרחק יום הליכה זה מזה לאורך נתיבי המסחר,
      וסיפקו בארות מים, אורוות מאובטחות וחדרי לינה לסוחרים.
  - type: multiple_choice
    question: באיזו שנה נחשפו חורבותיה הנסתרות של מצודת האינקה מאצ׳ו פיצ׳ו בידי החוקר
      חירם בינגהאם?
    options:
    - '1911'
    - '1888'
    - '1939'
    - '1850'
    correct: 0
    explanation: חירם בינגהאם הובל אל מצודת מאצ׳ו פיצ׳ו בעננים ביולי 1911 על ידי איכרים
      מקומיים מבני הקצ׳ואה, ופרסם את התגלית בעולם כולו.
  - type: multiple_choice
    question: מי עמד בראש המשלחת הארכאולוגית שחשפה את קברו המוזהב של תות ענח׳ אמון
      בנובמבר 1922?
    options:
    - הווארד קרטר
    - ז׳אן-פרנסואה שמפוליון
    - ארתור אוונס
    - היינריך שלימן
    correct: 0
    explanation: הארכאולוג הבריטי הווארד קרטר גילה את פתח הקבר החתום KV62 בעמק המלכים
      לאחר עשר שנות חיפוש עיקש במימון הלורד קרנארבון.
  - type: multiple_choice
    question: באילו מועדים אסטרונומיים מופיעה אשליית הצל של הנחש הזוחל על פירמידת
      אל קסטיליו בצ׳יצ׳ן איצה?
    options:
    - בימי השוויון של האביב והסתיו
    - ביום נקודת היפוך הקיץ בלבד
    - ביום נקודת היפוך החורף בלבד
    - בזמן ליקוי ירח מלא
    correct: 0
    explanation: בימי שוויון האביב והסתיו, זווית קרני השמש השוקעת יוצרת שבעה משולשי
      צל המשתלבים עם ראש הנחש המפוסל בתחתית גרם המדרגות.
  - type: multiple_choice
    question: איזה עם סוחרים יורדי-ים פיתח את האלפבית הפונטי בן 22 האותיות שהפך לבסיס
      הכתב העברי, היווני והלטיני?
    options:
    - הפיניקים
    - החיתים
    - הבבלים
    - הפלישתים
    correct: 0
    explanation: הפיניקים, שסחרו לאורך חופי הים התיכון, פישטו את הכתב ל-22 אותיות
      עיצוריות קלות ללימוד שהחליפו מאות סמלים ציוריים מורכבים.
  - type: multiple_choice
    question: באיזה דיוק מכוונות ארבע פאותיה של הפירמידה הגדולה בגיזה לארבע רוחות
      השמיים הגיאוגרפיות?
    options:
    - בסטייה של פחות מ-4 דקות קשת (פחות מ-1/15 המעלה)
    - בסטייה של 10 מעלות שלמות עקב סטייה מגנטית
    - הן מכוונות לצפון המגנטי בלבד ולא לצפון האמיתי
    - בסטייה של 45 מעלות לכיוון הנילוס
    correct: 0
    explanation: פאות הפירמידה הגדולה מכוונות לצפון, דרום, מזרח ומערב בדיוק כמעט מוחלט,
      עם סטייה ממוצעת של 3.4 דקות קשת בלבד.
- id: pyramids_tombs_pharaohs
  title: '2. מצרים העתיקה: פירמידות, קברים ופרעונים'
  description: 'פלאי המונומנטים לאורך הנילוס: הפירמידה הגדולה של גיזה, קברי הפרעונים
    הנסתרים במדבר, מומיות מוזהבות ופענוח כתב החרטומים המקודש.'
  cards:
  - id: great_pyramid_of_giza_khufu
    title: הפירמידה הגדולה של גיזה והפרעה ח׳ופו
    points:
    - נבנתה סביב שנת 2560 לפנה״ס בתקופת הממלכה הקדומה (השושלת הרביעית) כמשכנו הנצחי
      של הפרעה ח׳ופו (שכונה ביוונית חאופס).
    - המבנה המונומנטלי הורכב מכ-2.3 מיליון גושי אבן גיר וגרניט שנחצבו וסותתו בדיוק
      רב, במשקל ממוצע של 2.5 טונות לכל גוש אבן.
    - בגובהה המקורי של 146.6 מטרים, הפירמידה החזיקה בתואר המבנה המלאכותי הגבוה בעולם
      במשך מעל 3,800 שנים, עד לבניית קתדרלת לינקולן באנגליה ב-1311.
    - חפירות ארכאולוגיות בכפרי הפועלים הסמוכים הוכיחו כי הבונים לא היו עבדים מוכים,
      אלא בעלי מלאכה מצרים חופשיים ומאוגדים שזכו לתזונה עשירה ולטיפול רפואי.
  - id: step_pyramid_of_djoser_imhotep
    title: פירמידת המדרגות של ג׳וסר והאדריכל אמחותפ
    points:
    - הוקמה בסקארה סביב 2670 לפנה״ס עבור הפרעה ג׳וסר, ונחשבת על ידי חוקרים למבנה האבן
      המונומנטלי הראשון בהיסטוריה האנושית.
    - הפירמידה תוכננה בידי הווזיר המלכותי אמחותפ, הדמות ההיסטורית הראשונה המתועדת
      בשמה כאדריכל, רופא, מהנדס ואיש אשכולות.
    - אמחותפ הגה את הרעיון לערום שש מצבות מסטבה מלבניות זו על גבי זו במידות הולכות
      וקטנות, ויצר גרם מדרגות אבן בגובה 60 מטרים שנועד להעלות את נשמת המלך לשמיים.
    - מתחת לפירמידה משתרע מבוך תת-קרקעי באורך כולל של כ-5.7 קילומטרים של מנהרות, פירי
      קבורה וחדרים המעוטרים באריחי פיאנס בגוון טורקיז מרהיב.
  - id: valley_of_the_kings_tutankhamun
    title: עמק המלכים וקבר תות ענח׳ אמון
    points:
    - בימי הממלכה החדשה נטשו הפרעונים את הפירמידות הבולטות מחשש לשודדי קברים, ועברו
      לחצוב קברים נסתרים בסלעי הגיר המבודדים של לוקסור.
    - יותר מ-60 קברי מלכים נחצבו בוואדי המדברי השוכן למרגלות הר אל-קורן, שפסגתו הטבעית
      מעוצבת בצורת פירמידה ענקית.
    - קבר KV62 של המלך הצעיר תות ענח׳ אמון נתגלה כמעט ללא פגע ב-1922, והכיל מעל 5,000
      אוצרות נדירים ובהם מסכת מוות מזהב טהור במשקל 11 קילוגרם.
    - קירות הקברים טויחו ונצבעו בלחשים מאגיים מתוך 'ספר השאול' (אמדואת) כדי להגן על
      הפרעה ולהנחותו במעבר דרך 12 שעות הלילה בעולם הבא.
  - id: great_sphinx_of_giza
    title: 'הספינקס הגדול: שומר מישור גיזה'
    points:
    - פסל אבן גיר מונומנטלי המשלב גוף של אריה רובץ עם קלסתר פניו של הפרעה חעפרע, בונה
      הפירמידה השנייה בגיזה.
    - הספינקס נחצב ישירות מתוך גבעת סלע טבעית אחת של אבן גיר מקומית, ואורכו מגיע ל-73
      מטרים וגובהו ל-20 מטרים מעל פני הקרקע.
    - אסטלת החלום הניצבת בין כפות רגליו הקדמיות מספרת כיצד הנסיך תחותמס הרביעי נרדם
      בצילו והובטח לו הכתר אם רק ינקה את חולות המדבר שכיסו את הפסל.
    - מסמכים היסטוריים ערביים מהמאה ה-15 מעידים שאפו של הספינקס נשבר בידי קנאי דתי
      מאות שנים לפני הגעתו של נפוליאון למצרים.
  - id: mummification_afterlife_rituals
    title: פולחן המומיות והמסע אל העולם הבא
    points:
    - החניטה המצרית נועדה לשמר את הגוף הפיזי כמשכן נצחי, כדי שחלקי הנשמה—הקא (אנרגיית
      החיים) והבא (האישיות)—יוכלו להתאחד בעולם הנצח.
    - התהליך המורכב נמשך 70 יום וכלל הוצאת המוח דרך הנחיריים, סילוק איברים פנימיים
      וייבוש הגופה במלח נטרון טבעי במשך 40 יום.
    - הריאות, הכבד, הקיבה והמעיים שומרו בנפרד בתוך ארבעה כדי חופה מקודשים, שכל אחד
      מהם הופקד בידי אחד מארבעת בניו של האל הורוס.
    - הלב היה האיבר היחיד שהושאר בתוך בית החזה, כדי שיישקל בהיכל המשפט של מאעת אל
      מול נוצת האמת בידי האל תן-הראש אנוביס.
  - id: karnak_luxor_monumental_temples
    title: 'כרנכ ולוקסור: מקדשי הפאר של אמון-רע'
    points:
    - מתחם כרנכ הוא המרכז הפולחני העתיק הגדול ביותר שנבנה אי-פעם, והוא פותח והורחב
      לאורך 1,500 שנה בידי יותר מ-30 פרעונים שונים.
    - אולם העמודים הגדול (היפוסטיל) כולל יער אדריכלי עוצר נשימה של 134 עמודי אבן חול
      אדירים המתנשאים לגובה של עד 21 מטרים ומעוצבים כקני פפירוס בראשיתיים.
    - שדרת הספינקסים המלכותית, שחיברה את מקדש כרנכ למקדש לוקסור לאורך 2.7 קילומטרים,
      רוצפה באבן ועוטרה במעל 1,000 פסלי ספינקס משני עבריה.
    - במהלך פסטיבל אופט השנתי נישאו פסליהם של האל אמון-רע, רעייתו מות ובנם חונסו בסירות
      נהר מוזהבות מקודשות במעלה הנילוס כדי לחגוג את התחדשות הטבע.
  - id: hatshepsut_female_pharaoh_deir_el_bahari
    title: 'חאתשפסות: המלכה שהפכה לפרעה'
    points:
    - חאתשפסות שלטה במצרים ביד רמה במשך למעלה משני עשורים סביב 1479–1458 לפנה״ס (השושלת
      ה-18), ונחשבת לאחת השליטות המצליחות בתולדות הממלכה.
    - כדי לבסס את מעמדה כמלך לגיטימי, היא הופיעה בפסליה עם תוארי פרעה המלאים, לבוש
      מלכותי וזקן טקסי מלכותי מלאכותי כמקובל אצל שליטים גברים.
    - מקדש המוות המרהיב שלה בדיר אל-בחרי נבנה בשלושה מפלסי מרפסות עמודים הנטמעים בהרמוניה
      טבעית בקירות מצוקי הגיר הזקופים.
    - תבליטי המקדש מנציחים את משלחת הסחר הימית המפורסמת שלה לארץ פונט האגדית, ממנה
      שבו ספינותיה עמוסות עצי מור חיים, הובנה, שנהב וזהב.
  - id: ramses_ii_abu_simbel
    title: רעמסס השני וענקי האבן של אבו סימבל
    points:
    - רעמסס השני (רעמסס הגדול) מלך במשך 66 שנים תמימות (1279–1213 לפנה״ס), הוליד מעל
      100 ילדים ועיטר את מצרים ונוביה באנדרטאות ענק.
    - בחזית מקדש אבו סימבל, שנחצב במצוק אבן חול מול הנילוס בנוביה, מתנשאים ארבעה פסלי
      ענק בגובה 20 מטרים של רעמסס היושב על כס המלכות.
    - קירות המקדש מהללים את קרב קדש נגד החיתים, שהוביל בשנת 1259 לפנה״ס לחתימת הסכם
      השלום הבינלאומי הכתוב הראשון המתועד בהיסטוריה.
    - בשנות ה-60 של המאה ה-20 ניהל אונסק״ו מבצע הנדסי חסר תקדים שבו נוסרו המקדשים
      לגושי ענק של אלף טונות והועתקו 65 מטרים במעלה המצוק כדי להצילם ממי אגם נאצר.
  - id: rosetta_stone_deciphering_hieroglyphs
    title: 'אבן רוזטה: פיצוח קוד החרטומים המסתורי'
    points:
    - הלוח נתגלה ב-1799 בידי חיילים צרפתים ליד נמל רשיד (רוזטה) בזמן מסע נפוליאון,
      והכיל צו מלכותי משנת 196 לפנה״ס שנחקק בשלושה כתבים שונים.
    - הטקסט נחרת בכתב חרטומים מקודש, בכתב דמוטי עממי מהיר וביוונית עתיקה ששימשה שפת
      המנהל והשלטון באותה עת.
    - העובדה שחוקרים ידעו לקרוא יוונית אפשרה לבלשן הצרפתי ז׳אן-פרנסואה שמפוליון לפענח
      את הכתב ב-1822 באמצעות בידוד שמות מלכים בתוך כרטושים סגלגלים.
    - שמפוליון הוכיח שכתב החרטומים אינו ציור סמלי גרידא, אלא מערכת כתיבה מתוחכמת המשלבת
      אותיות פונטיות, הברות וסימני הוראה סמנטיים.
  - id: cleopatra_fall_of_ptolemaic_egypt
    title: קלאופטרה ושקיעת ממלכת מצרים
    points:
    - קלאופטרה השביעית הייתה השליטה הפעילה האחרונה של בית תלמי—שושלת ממוצא מקדוני-יווני
      שהוקמה בעקבות כיבושיו של אלכסנדר מוקדון ב-332 לפנה״ס.
    - היא ניחנה בהשכלה מבריקה ובכישרון דיפלומטי נדיר, והייתה השליטה התלמיית היחידה
      שלמדה על בוריה את השפה המצרית הילידית לצד יוונית, לטינית ועברית.
    - היא כרתה בריתות פוליטיות ורומנטיות גורליות עם יוליוס קיסר ומרקוס אנטוניוס כדי
      לשמור על עצמאותה של מצרים מול התפשטות האימפריה הרומית.
    - לאחר התבוסה בקרב אקטיום ב-31 לפנה״ס שמה קלאופטרה קץ לחייה, והמצביא אוקטביוס
      (הקיסר אוגוסטוס) סיפח את מצרים כפרובינקיה רומית פרטית.
  trivia:
  - type: multiple_choice
    question: עבור איזה פרעה מהשושלת הרביעית נבנתה הפירמידה הגדולה של גיזה סביב שנת
      2560 לפנה״ס?
    options:
    - ח׳ופו (חאופס)
    - תות ענח׳ אמון
