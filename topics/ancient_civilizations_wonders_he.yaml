- id: greco_roman_classical_masterpieces
  title: '3. יוון ורומא: פאר אדריכלי והנדסה קלאסית'
  description: 'הרמוניה אדריכלית והנדסה אזרחית מונומנטלית: הפרתנון באתונה, זירת הקולוסיאום
    ברומא, כיפת הבטון של הפנתאון, אקוודוקטים ומקדש דלפי.'
  cards:
  - id: parthenon_acropolis_athens
    title: הפרתנון ותור הזהב של אתונה
    points:
    - מקדש הפרתנון, הניצב בראש גבעת האקרופוליס באתונה, הושלם בשנת 438 לפנה״ס בהובלת
      המדינאי פריקלס והוקדש לאלה אתנה פרתנוס (אתנה הבתולה).
    - המקדש תוכנן בידי האדריכלים איקטינוס וקליקרטס תחת ניהולו האמנותי של הפסל הנודע
      פידיאס, ומייצג את שיא ההרמוניה של הסגנון הדורי.
    - 'המבנה כולל תיקונים אופטיים מתוחכמים (אנטזיס): רצפת המקדש קמורה מעט כלפי מעלה
      והעמודים נוטים קלות פנימה כדי להיראות ישרים לחלוטין לעין האנושית.'
    - היכל המקדש הכיל את פסל הענק של אתנה מאת פידיאס, שהתנשא לגובה 12 מטרים, צופה
      בזהב ושנהב (כריסאלפנטין), והחזיק בכף ידה את אלת הניצחון ניקה.
  - id: colosseum_flavian_amphitheatre
    title: 'הקולוסיאום: זירת הקרבות של הגלדיאטורים'
    points:
    - האמפיתיאטרון הוקם בהוראת הקיסר אספסיאנוס בשנת 72 לספירה ונחנך בידי בנו טיטוס
      בשנת 80 לספירה, ושמו הרשמי היה 'האמפיתיאטרון הפלבי'.
    - המבנה אכלס מעל 50,000 צופים בארבעה מפלסי ישיבה שהפרידו בין המעמדות החברתיים,
      וכלל 76 שערי יציאה ממוספרים (וומיטוריה) שאפשרו פינוי מלא תוך 15 דקות.
    - הוא הוקם במכוון על שטחו של האגם המלאכותי המיובש בארמון 'בית הזהב' השנוא של נירון
      קיסר, במטרה להחזיר קרקע מופקעת להנאת תושבי רומא.
    - 'מתחת לרצפת הזירה שהייתה מכוסה עץ וחול השתרע ההיפוגאום: מבוך תת-קרקעי בן שתי
      קומות שכלל כלובי חיות, תאי גלדיאטורים ו-28 מעליות משקולת מכניות.'
  - id: pantheon_dome_roman_concrete
    title: 'הפנתאון ברומא: כיפת הבטון הבלתי מזוין'
    points:
    - המבנה נוסד במקור בידי מרקוס אגריפס ונבנה מחדש במתכונתו העגולה הנוכחית בידי הקיסר
      אדריאנוס סביב שנת 125 לספירה כמקדש לכל האלים.
    - 'עד היום זהו מבנה הבטון הבלתי מזוין הגדול בעולם: קוטר הכיפה מגיע ל-43.3 מטרים
      ומשתווה במדויק לגובהו הפנימי של המבנה מהרצפה עד לקודקוד.'
    - המהנדסים הרומיים הפחיתו את משקל הכיפה בהדרגה באמצעות שימוש בבזלת כבדה ביסודות,
      אבן טוף געשית באמצע, ואבן פומיס (טוף ספוגי קל) בראש הכיפה.
    - האוקולוס—פתח עגול פתוח בקוטר 9 מטרים בקודקוד הכיפה—מהווה מקור האור הטבעי היחיד;
      מי גשמים החודרים דרכו מתנקזים דרך 22 חורים נסתרים ברצפת השיש.
  - id: roman_aqueducts_pont_du_gard
    title: 'אקוודוקטים רומיים: רתימת המים וכוח הכבידה'
    points:
    - מהנדסי רומא הובילו מיליוני ליטרים של מי מעיינות הרריים זכים אל ערי האימפריה
      באמצעות שימוש בלעדי בכוח הכבידה ובשיפועים מתונים להפליא.
    - גשר פונט דו גאר בדרום צרפת הוא גשר אקוודוקט בן שלוש קומות קשתות בגובה 49 מטרים,
      שירד בשיפוע של 17 מטרים בלבד לאורך מסלול של 50 קילומטרים.
    - הגשר הוקם ללא שימוש במלט, מגלילי אבן גיר מקומיים ענקיים שסותתו בדיוק מופתי והורמו
      במנופי גלגל אנושיים כדי לעמוד בשיטפונות נהר הגארדון.
    - מערכות האקוודוקט הזינו בתי מרחץ ציבוריים, מזרקות לרווחת התושבים, שירותים ציבוריים
      שוטפים ווילות פרטיות, וחוללו מהפכה בהיגיינה העירונית.
  - id: pompeii_herculaneum_vesuvius_time_capsule
    title: 'פומפיי והרקולנאום: קפסולת הזמן של הווזוב'
    points:
    - בשנת 79 לספירה התפרץ הר הגעש וזוב במפרץ נאפולי, וקבר את ערי הנופש הרומיות פומפיי
      והרקולנאום תחת שכבות עמוקות של אפר געשי ואבני פומיס לוהטות.
    - האסון הפתאומי יצר קפסולת זמן ארכאולוגית יוצאת דופן ששימרה פונדקים, וילות מעוטרות
      בפרסקאות, כיכרות לחם מפוחמות במאפיות וגרפיטי פוליטי ברחובות.
    - בשנות ה-60 של המאה ה-19 פיתח הארכאולוג האיטלקי ג׳וזפה פיורלי שיטה ליציקת גבס
      נוזלי לתוך החללים הריקים שהותירו הגופות שהתכלו, שיצרה יציקות מצמררות.
    - העיר השכנה הרקולנאום, שנקברה תחת נחשול בוץ געשי לוהט, שימרה חומרים אורגניים
      עדינים כגון רהיטי עץ, מדרגות ויותר מ-1,800 מגילות פפירוס מפוחמות.
  - id: appian_way_roman_roads
    title: 'ויה אפיה: מלכת הדרכים הרומיות'
    points:
    - הדרך נסללה החל משנת 312 לפנה״ס ביוזמת הצנזור אפיוס קלאודיוס קאיקוס, והייתה הכביש
      הצבאי המרוצף הראשי שחיבר את רומא לדרום ועד לנמל ברינדיזי.
    - הדרכים נחפרו עמוק באדמה ומולאו בשכבות חצץ, חול וטיט, ולבסוף רוצפו בגושי סלע
      בזלת פוליגונליים ענקיים שהשתלבו זה בזה בחוזקה.
    - פני הכביש נבנו בשיפוע קל (קמור במרכז) כדי שמי הגשמים יזרמו לתעלות ניקוז בצדדים,
      מה שאפשר ללגיונות הרומיים לצעוד במהירות בכל תנאי מזג אוויר.
    - רשת הדרכים הרומית השתרעה על פני מעל 80,000 קילומטרים ושימשה תשתית חיונית לניוד
      צבאי מהיר, העברת דואר קיסרי (קורסוס פובליקוס) ומסחר שוקק.
  - id: oracle_of_delphi_apollo_sanctuary
    title: 'האורקל מדלפי: טבור העולם היווני'
    points:
    - המקדש בדלפי שעל מורדות הר פרנסוס נחשב למרכזו הרוחני של העולם היווני, וסומן באבן
      האומפלוס המקודשת שסימלה את 'טבור כדור הארץ'.
    - הכוהנת פיתיה ניבאה נבואות כשהיא יושבת על חצובה בחלל הפנימי של מקדש אפולו, כשהיא
      שואפת גזים פחמימניים (כגון אתילן) שבקעו מסדקים טקטוניים בסלע.
    - מלכים, מצביאים ופילוסופים מכל רחבי אגן הים התיכון עלו לרגל לדלפי כדי להיוועץ
      באורקל לפני יציאה למלחמות, חקיקת חוקים או הקמת מושבות חדשות.
    - באתר נערכו אחת לארבע שנים המשחקים הפיתיים—מהחשובים במשחקי יוון העתיקה—ששילבו
      תחרויות ספורט עם תחרויות שירה, מוזיקה ודרמה לכבוד אפולו.
  - id: library_of_alexandria_lighthouse_pharos
    title: 'אלכסנדריה: הספרייה הגדולה ומגדלור פארוס'
    points:
    - הספרייה הגדולה באלכסנדריה נוסדה סביב שנת 300 לפנה״ס בימי תלמי הראשון במטרה לאסוף
      את כל הידע האנושי, והכילה על פי הערכות עד 400,000 מגילות פפירוס.
    - חוקרי המכס החרימו כל ספר שהגיע בספינות לנמל; סופרי המלך העתיקו את המגילות, מסרו
      את ההעתק לבעלים ושמרו את המקור בספרייה המלכותית.
    - המגדלור המלכותי על האי פארוס בפתח נמל אלכסנדריה התנשא לגובה של מעל 100 מטרים,
      וכיוון ספינות באמצעות מדורת ענק שהשתקפה במראות ברונזה מלוטשות.
    - 'שני הפלאים ההלניסטיים נחרבו במהלך ההיסטוריה: הספרייה נפגעה משריפות והזנחה לאורך
      מאות שנים, והמגדלור קרס בסדרת רעידות אדמה בימי הביניים.'
  - id: statue_of_zeus_olympia
    title: 'פסל זאוס באולימפיה: אדון המשחקים'
    points:
    - הפסל נוצר סביב שנת 435 לפנה״ס בידי הפסל האתונאי הדגול פידיאס בתוך מקדש זאוס
      באולימפיה, ערש הולדתם של המשחקים האולימפיים בעת העתיקה.
    - הפסל התנשא לגובה של 12 מטרים ותיאר את מלך האלים יושב על כס ארזים מלכותי ששובץ
      בעצי הובנה, שנהב, זהב ואבני חן יקרות.
    - 'הפסל נבנה בטכניקת כריסאלפנטין: גופו של זאוס עוצב מלוחות שנהב פיל ממורקות, ואילו
      גלימתו וסנדליו רוקעו מלוחות זהב טהור.'
    - בידו הימנית החזיק זאוס פסל בגודל אדם של אלת הניצחון ניקה, ובידו השמאלית שרביט
      מלכות שבראשו עיט; יצירת המופת אבדה בשריפה במאה החמישית לספירה.
  - id: colossus_of_rhodes
    title: 'הקולוסוס מרודוס: ענק הברונזה על הים'
    points:
    - פסל ברונזה מונומנטלי שהוקם באי רודוס סביב שנת 280 לפנה״ס כדי לחגוג את עמידתם
      המזהירה של תושבי האי במצור מוקדוני ממושך.
    - הפסל עוצב בידי האמן כארס מלינדוס ותיאר את אל השמש הליוס כשהוא מתנשא לגובה של
      כ-33 מטרים—גובה המשתווה לפסל החירות הניו-יורקי.
    - הוא נבנה מלוחות ברונזה שחוברו למסגרת ברזל פנימית וכובדו באבני ענק, ומומן באמצעות
      מכירת כלי המצור העצומים שנטש האויב הנסוג.
    - בניגוד לציורים רומנטיים המציגים אותו מפסק רגליים מעל פי הנמל, הוא ניצב על היבשה;
      הפסל עמד 54 שנים בלבד עד שברכיו נשברו ברעידת אדמה בשנת 226 לפנה״ס.
