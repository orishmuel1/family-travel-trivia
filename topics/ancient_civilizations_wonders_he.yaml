- id: wonders_of_asia_americas
  title: 4. פלאי אסיה, אמריקה הקדומה והמזרח
  description: 'מונומנטים אדירים מעבר לאוקיינוסים ובמדבריות: מאצ׳ו פיצ׳ו בעננים, צ׳יצ׳ן
    איצה של המאיה, החומה הגדולה של סין, פטרה ואנגקור ואט.'
  cards:
  - id: machu_picchu_incan_cloud_citadel
    title: 'מאצ׳ו פיצ׳ו: מצודת האינקה האבודה בעננים'
    points:
    - הוקמה סביב שנת 1450 לספירה בהוראת קיסר האינקה פצ׳אקוטי, כשהיא תלויה בגובה 2,430
      מטרים מעל פני הים ברכס האנדים הפרואני מעל נהר האורובמבה.
    - בנאי האינקה השתמשו בסיתות אבנים פוליגונליות יבשות ללא מלט, שהותאמו בדיוק כה
      מושלם עד שבזמן רעידות אדמה האבנים מתנדנדות וחוזרות בדיוק למקומן.
    - אבן האינטיהואטנה המקודשת ('עמוד קשירת השמש') היא סלע גרניט אסטרונומי שנחצב בראש
      המצודה ומאפשר חישוב מדויק של ימי נקודות היפוך הקיץ והחורף.
    - העיר הוזנה על ידי למעלה מ-700 טרסות חקלאיות מאבן שמנעו סחף אדמה במדרונות התלולים,
      ניקזו מי גשמים ויצרו מיקרו-אקלים לגידול תירס ותפוחי אדמה.
  - id: chichen_itza_mayan_astronomy_el_castillo
    title: צ׳יצ׳ן איצה ולוח השנה האסטרונומי של המאיה
    points:
    - עיר מרכזית של תרבות המאיה-טולטק בחצי האי יוקטן במקסיקו, ששגשגה בין השנים 750
      ל-1200 לספירה כמרכז שלטוני ודתי רב-עוצמה.
    - 'הפירמידה המרכזית קוקולקן (אל קסטיליו) היא לוח שנה גיאומטרי באבן: 4 גרמי מדרגות
      בעלי 91 מדרגות כל אחד בתוספת הפלטפורמה העליונה מסתכמים בדיוק ב-365 ימי השנה.'
    - מגרש משחק הכדור הצמוד הוא הגדול ביותר שהתגלה באמריקה (166 מטרים אורכו); השחקנים
      נדרשו להבקיע כדור גומי כבד לטבעות אבן גבוהות ללא שימוש בידיים או ברגליים.
    - הסנוטה המקודשת—בולען גיר טבעי תלול ורחב ידיים—שימשה שער אל העולם התחתון, שבו
      השליכו עולי רגל מנחות של אבני ירקן, זהב, חרס וקורבנות אדם לאל הגשם צ׳אק.
  - id: great_wall_of_china
    title: 'החומה הגדולה של סין: הדרקון על הרכסים'
    points:
    - משתרעת על פני למעלה מ-21,000 קילומטרים לרוחב צפון סין, ונבנתה ושופצה לאורך מעל
      אלפיים שנה בידי שושלות קיסריות שונות.
    - חומות האבן והלבנים המפורסמות והמגדלים המבוצרים הנצפים כיום בידי תיירים הוקמו
      בעיקרם בימי שושלת מינג (1368–1644) להגנה מפני פלישות צבאות המונגולים.
    - מלבד מחסום פיזי, החומה שימשה כביש תחבורה מהיר על רכסי ההרים ומערכת טלגרף מוקדמת
      שהעבירה אותות אזהרה באיתותי עשן ביום ואש בלילה.
    - בניגוד לאגדה העירונית הפופולרית, החומה הגדולה אינה נראית לעין האנושית הבלתי-מזוינת
      ממסלול נמוך סביב כדור הארץ ללא הגדלה אופטית.
  - id: terracotta_army_qin_shi_huang
    title: 'צבא הטרקוטה: שומרי הקיסר הראשון של סין'
    points:
    - נתגלה במקרה ב-1974 בידי איכרים שחפרו באר ליד העיר שי-אן, כשהוא מגן על מתחם הקבר
      התת-קרקעי של צ׳ין שה-חואנג, מאחד סין הראשון (מת ב-210 לפנה״ס).
    - המתחם כולל למעלה מ-8,000 לוחמי חרס בגודל אדם מלא, 130 מרכבות קרב ו-520 סוסי
      חיל פרשים המוצבים במבנה קרב צבאי מדויק.
    - כל חייל פוסל בעבודת יד בעיצוב פנים אינדיבידואלי ייחודי, תסרוקת ייחודית ודרגות
      פיקוד, ונצבע במקור בלכה מרהיבה של פיגמנטים אדומים, כחולים וסגולים.
    - תל הקבר המרכזי של הקיסר טרם נפתח מחשש לפגיעה בממצאים, ועל רקע עדויות היסטוריות
      עתיקות על קשתות דרוכות כמלכודות ונהרות מדומים של כספית רעילה.
  - id: petra_nabataean_rose_city_treasury
    title: 'פטרה: עיר הסלע האדום של הנבטים'
    points:
    - בירת הממלכה הנבטית בדרום ירדן שנחצבה במצוקי אבן חול אדומה-ורדרדה, ושלטה על שיירות
      הגמלים של דרך הבשמים והתבלינים.
    - הכניסה אל העיר עוברת דרך הסיק—נקיק קניוני מפותל באורך 1.2 קילומטרים הנפתח בהפתעה
      אל חזיתו המפוארת של מבנה האוצר (אל-חזנה) בגובה 40 מטרים.
    - אל-חזנה לא שימש כבנק אוצרות, אלא כקבר מלכותי הלניסטי מפואר עבור המלך הנבטי חרתת
      הרביעי, שנחצב מלמעלה כלפי מטה ישירות מתוך המצוק.
    - הנבטים היו גאוני הנדסת מים מדברית, שחצבו תעלות חרס, סכרים ובורות מים נסתרים
      שאגרו מי שיטפונות פתאומיים ואפשרו חיים ל-30,000 תושבים בלב המדבר.
  - id: angkor_wat_khmer_stone_empire
    title: 'אנגקור ואט: הר האבן של אימפריית החמר'
    points:
    - נבנה בראשית המאה ה-12 בקמבודיה בימי המלך סורייוורמן השני, ומהווה את המונומנט
      הדתי הגדול ביותר על פני כדור הארץ (משתרע על מעל 1,600 דונם).
    - הוקדש במקור כמקדש הינדי לאל וישנו, לפני שהפך בהדרגה למרכז נזירים בודהיסטי לקראת
      סוף אותה מאה.
    - 'המבנה מהווה דגם ארצי מוקטן של היקום ההינדי: חמשת המגדלים המרכזיים מסמלים את
      פסגות הר מרו המקודש, המוקף בתעלת מים רחבה באורך 5 קילומטרים המסמלת את האוקיינוס
      הקוסמי.'
    - גלריית התבליטים החיצונית משתרעת לאורך למעלה מ-1,200 מטרים רבועים של תבליטי אבן
      מרהיבים, ובהם התיאור המפורסם של 'חיבוץ אוקיינוס החלב' המיתולוגי.
  - id: hanging_gardens_of_babylon
    title: 'הגנים התלויים בבבל: הפלא האבוד'
    points:
    - על פי המסורת הקלאסית, המלך הבבלי נבוכדנצר השני הקים את הגנים המדורגים סביב שנת
      600 לפנה״ס עבור רעייתו אמיטיס, שערגה לנופי מולדתה ההרריים והירוקים.
    - ההיסטוריונים הקדומים תיארו מרפסות אבן מדורגות הנישאות לגובה רב ועמוסות בעצי
      פרי, פרחים מטפסים וצמחים נדירים שיצרו מראה של הר מיוער ומלבלב.
    - מי נהר הפרת הועלו אל בריכות ההשקיה העליונות באמצעות מתקני שאיבה מוקדמים של בורגי
      ארכימדס או שרשראות דליי מים שהונעו בידי עבדים.
    - זהו הפלא היחיד משבעת פלאי תבל שלא נמצא לו מעולם אישור ארכאולוגי מובהק בבבל,
      וחלק מהחוקרים סבורים שנבנה בכלל בנינוה האשורית.
  - id: nazca_lines_peruvian_geoglyphs
    title: 'קווי נסקה: תעלומת המדבר בפרו'
    points:
    - ציורי ענק גיאוגליפיים שנחרתו ברמת המדבר הצחיחה של דרום פרו בין שנת 500 לפנה״ס
      ל-500 לספירה, וכוללים מעל 10,000 קווים ישרים וצורות.
    - האיורים הזואולוגיים הבולטים כוללים קונדור באורך 135 מטרים, קוף באורך 93 מטרים
      עם זנב ספירלי, עכביש ענק, יונק דבש ודמות המכונה 'האסטרונאוט'.
    - הקווים נוצרו פשוט באמצעות פינוי חלוקי נחל עליונים שהושחרו בתחמוצת ברזל וחשיפת
      שכבת קרקע בהירה מתחתם, ונשמרו במשך אלפי שנים הודות לאקלים נטול הגשם והרוח.
    - מכיוון שאת רוב הציורים ניתן לראות בשלמותם רק מהאוויר, ארכאולוגים מייחסים להם
      משמעות של מסלולי תהלוכות פולחניות שנקשרו בבקשות מים וגשם מהאלים.
  - id: teotihuacan_pyramid_of_the_sun
    title: 'טאוטיווקאן: עיר האלים במקסיקו'
    points:
    - מטרופולין ענק במרכז מקסיקו ששגשג סביב שנת 450 לספירה ומנה מעל 100,000 תושבים,
      לפני שנשרף וננטש באופן מסתורי.
    - השדרה המרכזית, 'שדרת המתים', מעוגנת על ידי פירמידת השמש הענקית—השלישית בגודלה
      בעולם לפי נפח—ופירמידת הירח הניצבת מולה.
    - מקדש הנחש המנוצה (קצלקואטל) מעוטר בתבליטי אבן צבעוניים מרהיבים של ראשי נחש הנחלצים
      מתוך צווארוני קונכיות ים מקודשות.
    - כאשר האצטקים גילו את הריסות האבן המפוארות מאות שנים מאוחר יותר, הם כינו את המקום
      טאוטיווקאן ('המקום שבו נולדו האלים'), מתוך אמונה שבו נברא היקום.
  - id: persepolis_persian_ceremonial_capital
    title: 'פרספוליס: הפאר הקיסרי של פרס'
    points:
    - נוסדה בידי דריווש הגדול סביב שנת 518 לפנה״ס בדרום איראן, ושימשה כבירת הטקסים
      המלכותית של האימפריה הפרסית האחמנית.
    - נבנתה על גבי במת אבן מוגבהת בשטח של 125,000 מטרים רבועים, שהגישה אליה נעשתה
      דרך גרם מדרגות כפול וענק שתוכנן לתהלוכות שגרירים בלבוש חגיגי.
    - אולם האפאדאנה המונומנטלי כלל 72 עמודי אבן בגובה של קרוב ל-30 מטרים, ותבליטי
      מדרגות שתיעדו משלחות מ-23 עמים כבושים המגישים מנחות למלך המלכים.
    - בשנת 330 לפנה״ס כבש אלכסנדר מוקדון את פרספוליס והעלה באש את ארמונות הארזים המפוארים
      שלה, כנקמה היסטורית על שריפת האקרופוליס של אתונה.
  trivia:
  - type: multiple_choice
    question: איזה קיסר אינקה יזם את הקמת מצודת ההר מאצ׳ו פיצ׳ו באנדים הפרואניים סביב
      שנת 1450 לספירה?
    options:
    - פצ׳אקוטי
    - אטוואלפה
    - וואינה קפאק
    - מאנקו קפאק
    correct: 0
    explanation: פצ׳אקוטי אינקה יופאנקי, שהפך את ממלכת קוסקו לאימפריית האינקה האדירה,
      יזם את הקמת מאצ׳ו פיצ׳ו כאחוזת נופש וקודש מלכותית.
  - type: multiple_choice
    question: כיצד נקרא סלע הגרניט המקודש במאצ׳ו פיצ׳ו ששימש את כוהני האינקה למעקב
      אסטרונומי וחיזוי נקודות ההיפוך?
    options:
    - אבן האינטיהואטנה
    - אבן לוח השמש
    - מקדש הירח
    - רוקה סגרדה
    correct: 0
    explanation: האינטיהואטנה ('המקום לקשירת השמש') הוא עמוד גרניט חצוב ששימש כעין
      שעון שמש ומצפה אסטרונומי שחישב את מסלול השמש לאורך עונות השנה.
  - type: multiple_choice
    question: כמה מדרגות בסך הכל מרכיבים ארבעת גרמי המדרגות והבמה העליונה של פירמידת
      אל קסטיליו בצ׳יצ׳ן איצה?
    options:
    - 365 מדרגות (כמספר ימות השנה הסולארית)
    - 360 מדרגות
    - 260 מדרגות (כמספר ימי לוח הצולקין)
    - 500 מדרגות
    correct: 0
    explanation: כל אחד מארבעת גרמי המדרגות מונה 91 מדרגות (364 בסך הכל), ובתוספת
      הבמה העליונה מתקבל המספר 365, התואם את מחזור שנת השמש.
  - type: multiple_choice
    question: בימי איזו שושלת קיסרית סינית נבנו עיקר קטעי האבן והלבנים המבוצרים של
      החומה הגדולה הנראים כיום?
    options:
    - שושלת מינג
    - שושלת חאן
    - שושלת טאנג
    - שושלת סונג
    correct: 0
    explanation: בעוד יסודות החומה החלו בימי שושלת צ׳ין, קטעי האבן והמגדלים המבוצרים
      המרשימים ליד בייג׳ינג נבנו בימי שושלת מינג (1368–1644).
  - type: multiple_choice
    question: ליד איזו עיר קיסרית היסטורית בסין נחשפו במקרה לוחמי צבא הטרקוטה בשנת
      1974?
    options:
    - שי-אן
    - בייג׳ינג
    - נאנג׳ינג
    - לואויאנג
    correct: 0
    explanation: איכרים שחפרו באר מים בקרבת העיר שי-אן במרץ 1974 חשפו את האולמות התת-קרקעיים
      המאכלסים אלפי פסלי לוחמי טרקוטה של הקיסר הראשון.
  - type: multiple_choice
    question: איזה נקיק קניוני מפותל ודרמטי מוביל את המבקרים אל חזית מקדש האוצר החצוב
      של פטרה בירדן?
    options:
    - הסיק
    - ואדי רם
    - עמק הירמוך
    - בקעת גור
    correct: 0
    explanation: הסיק הוא מעבר קניוני צר ומרהיב באורך 1.2 קילומטרים התחום במצוקי אבן
      חול זקופים ומסתיים בחשיפת חזית אל-חזנה.
  - type: multiple_choice
    question: איזה עם סוחרים ערבי קדום הקים את עיר הסלע האדומה פטרה ושלט על נתיבי
      דרך הבשמים?
    options:
    - הנבטים
    - השבאים
    - העמונים
    - התדמורים
    correct: 0
    explanation: הנבטים בנו את פטרה כמרכז מסחרי עשיר, והצטיינו בחציבת מבני פאר בסלע
      ובבניית מערכות הידראוליות מתוחכמות לאגירת מים במדבר.
  - type: multiple_choice
    question: לאיזה אל הינדי הוקדש במקור מתחם המקדשים המונומנטלי של אנגקור ואט בקמבודיה?
    options:
    - וישנו
    - שיווה
    - ברהמה
    - גנש
    correct: 0
    explanation: המלך סורייוורמן השני הקדיש את אנגקור ואט לאל וישנו המגן, לפני שהמתחם
      עבר בהדרגה לשמש כמנזר ומקדש בודהיסטי.
  - type: multiple_choice
    question: איזה מלך בבלי נודע בנה על פי המסורת הקלאסית את הגנים התלויים בבבל למען
      רעייתו המדית?
    options:
    - נבוכדנצר השני
    - חמורבי
    - נבונאיד
    - אשורבניפל
    correct: 0
    explanation: על פי היסטוריונים הלניסטיים, המלך נבוכדנצר השני הקים את הגנים המדורגים
      כדי לפייס את געגועיה של רעייתו אמיטיס להרי מולדתה הירוקים.
  - type: multiple_choice
    question: באיזו מדינה דרום-אמריקאית שוכנים הגיאוגליפים המסתוריים ועצומי הממדים
      של קווי נסקה?
    options:
    - פרו
    - צ׳ילה
    - בוליביה
    - אקוודור
    correct: 0
    explanation: קווי נסקה נחרתו ברמת המדבר הצחיחה של דרום פרו, ונשתמרו במשך אלפי
      שנים בשל תנאי היובש והיעדר רוחות באזור.
  - type: multiple_choice
    question: איזה מטרופולין עתיק במרכז מקסיקו מפורסם ב'שדרת המתים' ובפירמידת השמש
      האדירה שבלבו?
    options:
    - טאוטיווקאן
    - טנוצ׳טיטלאן
    - פלנקה
    - טיקאל
    correct: 0
    explanation: טאוטיווקאן הייתה עיר מפותחת בעמק מקסיקו ששגשגה מאות שנים לפני הגעת
      האצטקים, והותירה פירמידות ענק ושדרות רחבות.
  - type: multiple_choice
    question: איזה מלך פרסי דגול יזם את בנייתה של בירת הטקסים המלכותית פרספוליס סביב
      518 לפנה״ס?
    options:
    - דריווש הגדול (דריווש הראשון)
    - כורש הגדול
    - חשיארש הראשון (אחשוורוש)
    - ארתחששתא הראשון
    correct: 0
    explanation: דריווש הראשון הקים את פרספוליס על גבי במת אבן ענקית כעיר מושב מפוארת
      שבה נערכו טקסי קבלת הפנים למשלחות האימפריה.
  - type: multiple_choice
    question: איזה מצביא וכובש מוקדוני העלה באש את ארמונות פרספוליס המפוארים בשנת
      330 לפנה״ס?
    options:
    - אלכסנדר מוקדון
    - פיליפוס השני
    - פירוס מאפירוס
    - אנטיגונוס
    correct: 0
    explanation: לאחר כיבוש פרס החריב אלכסנדר מוקדון את ארמונות פרספוליס בשריפה גדולה,
      כנקמה על שריפת אתונה בידי הפרסים בעבר.
  - type: multiple_choice
    question: איזה משחק כדור פולחני ששוחק במגרש הענק בצ׳יצ׳ן איצה אסר על שחקניו לגעת
      בכדור בידיים וברגליים?
    options:
    - פיץ (אולמה)
    - פוק-א-טוק
    - טלאצ׳טלי
    - פלוטה מאיה
    correct: 0
    explanation: המשחק המסורתי כונה פיץ בלשון המאיה, והשחקנים השתמשו במותניים ובמרפקים
      לחבטת כדור הגומי דרך טבעות אבן אנכיות.
  - type: multiple_choice
    question: איזו סצנה מיתולוגית מפורסמת מתוך המיתולוגיה ההינדית מגולפת בתבליט אבן
      ענק באורך עשרות מטרים באנגקור ואט?
    options:
    - חיבוץ אוקיינוס החלב (סמודרה מנתאן)
    - נפילת לנקה מתוך הראמאיאנה
    - ירידת הגנגס המקודש לארץ
    - ריקוד שיווה נטראג׳ה
    correct: 0
    explanation: התבליט המפורסם מתאר אלים ושדים מושכים בנחש הענק וסוקי כדי לחבוץ את
