      - type: single_qa
        question: "איזה תאגיד אנרגיה ענק קרס ב-2001 לאחר שהסתיר חובות של מיליארדים בתרמיות חשבונאיות?"
        answer: "אנרון (Enron / Enron Corporation)"
      - type: multiple_choice
        question: "מה היה עונש המאסר שנגזר על הנוכל הפיננסי ברני מיידוף בשנת 2009?"
        options: ["25 שנה", "50 שנה", "100 שנה", "150 שנות מאסר"]
        correct: 3
      - type: single_qa
        question: "איזו פירמת רואי חשבון עולמית מ'חמש הגדולות' התפרקה בעקבות חלקה בביקורת החשבונות המזויפים של אנרון?"
        answer: "ארתור אנדרסן (Arthur Andersen)"
      - type: multiple_choice
        question: "כמה פעמים ניסה הנוכל ויקטור לוסטיג 'למכור' את מגדל אייפל לסוחרי גרוטאות?"
        options: ["פעם אחת", "פעמיים (2 פעמים)", "שלוש פעמים", "חמש פעמים"]
        correct: 1
      - type: single_qa
