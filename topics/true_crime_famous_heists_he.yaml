        question: "לאיזה מקצוע רפואי התחזה בהצלחה פרדיננד דמארה ('המתחזה הגדול') בצי הקנדי בזמן מלחמת קוריאה?"
        answer: "רופא מנתח (Surgeon)"
      - type: multiple_choice
        question: "איזה יהלום מושלם במשקל 203 קראט עמד במרכז ניסיון השוד במחפר בכיפת המילניום בלונדון ב-2000?"
        options: ["יהלום התקווה", "כוכב המילניום (Millennium Star)", "הקו-אי-נור", "יהלום קולינן"]
