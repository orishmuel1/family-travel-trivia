        options: ["חוק דוד-פרנק", "חוק סרבנס-אוקסלי (Sarbanes-Oxley / SOX)", "חוק גלאס-סטיגל", "חוק גרם-ליץ'"]
        correct: 1
      - type: single_qa
        question: "באיזה כלי רכב כבד השתמשה הכנופיה בניסיון השוד בכיפת המילניום כדי לפרוץ את קיר המבנה?"
        answer: "מחפר עפר (JCB / בולדוזר)"
      - type: multiple_choice
        question: "לאיזו חברת תעופה התחזה פרנק אבגנייל הבן כטייס משנה במהלך מסע פדיון ההמחאות שלו?"
        options: ["TWA", "פאן אם (Pan Am)", "איסטרן איירליינס", "BOAC"]
        correct: 1
