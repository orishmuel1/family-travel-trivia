  - id: historical_outlaws_gangsters
    title: "פורעי חוק וגנגסטרים מפורסמים"
    description: >
      היכנסו אל עידן מכונות הירייה 'טומי גאן', שודדי הבנקים ואימפריות הפשע הענקיות! 
      מאקדוחני המערב הפרוע ושודדי תקופת השפל ועד ראשי המאפיה האיטלקית.
    cards:
      - title: "אל קפונה וארגון הפשע של שיקגו"
        points:
          - "בתקופת חוק היובש (1920–1933), אלפונס 'צלקת' (Scarface) קפונה בנה אימפריית הברחת אלכוהול והימורים במיליוני דולרים בשיקגו."
          - "ב-14 בפברואר 1929 הוציאו אנשיו של קפונה המחופשים לשוטרים להורג 7 יריבים מכנופייתו של 'באגס' מוראן בטבח יום ולנטיין."
          - "למרות אינספור מעשי רצח, קפונה הורשע ונכלא לבסוף ב-1931 בידי הסוכן אליוט נס ('הבלתי משוחדים') על עבירות העלמת מס בלבד."
          - "הוא נידון ל-11 שנות מאסר, ריצה חלק ממאסרו בכלא אלקטרז וסבל מבריאות פיזית ונפשית מעורערת עד מותו."
      - title: "בוני וקלייד ומסע הפשע בדרום"
        points:
          - "בוני פארקר וקלייד בארו הובילו את 'כנופיית בארו' במסע שודים ידוע לשמצה בן שנתיים בדרום ארה״ב בימי השפל הגדול."
          - "הם שדדו תחנות דלק, חנויות מכולת כפריות ובנקים קטנים, והרגו לפחות תשעה שוטרים ומספר אזרחים."
          - "העיתונות הפכה את סיפור אהבתם לסנסציה רומנטית, שהוזנה מתצלומים שנמצאו במחבואם ובהם נראית בוני עם סיגר ואקדח."
          - "ב-23 במאי 1934 ארבו להם אנשי חוק בלואיזיאנה בראשות פרנק היימר וירו מעל 130 כדורים אל תוך רכב הפורד V8 שלהם."
      - title: "ג'ון דילינג'ר: אויב הציבור מס' 1"
        points:
          - "ג'ון דילינג'ר היה שודד בנקים כריזמטי שכנופייתו שדדה מעל עשרים בנקים ברחבי המערב התיכון ונמלט פעמיים מבתי כלא שמורים."
          - "הוא התפרסם כשנמלט מכלא קראון פוינט ה'בלתי חדיר' באינדיאנה באמצעות אקדח צעצוע שגילף מעץ וצבע במשחת נעליים שחורה!"
          - "ה-FBI החדש תחת ג'יי אדגר הובר הכריז על דילינג'ר כ'אויב הציבור מס' 1' הרשמי הראשון של אמריקה."
          - "ביולי 1934 ירו סוכני ה-FBI בדילינג'ר למוות ביציאה מקולנוע ביוגרף בשיקגו, לאחר שהוסגר על ידי 'האישה באדום'."
      - title: "בוץ' קסידי וסאנדנס קיד"
        points:
          - "רוברט לירוי פארקר ('בוץ' קסידי') והארי לונגבאו ('סאנדנס קיד') הנהיגו את כנופיית 'חבורת הפראים' במערב הפרוע בשנות ה-90 של המאה ה-19."
          - "הם התמחו בשוד רכבות קיטור ובנקים בוויומינג, יוטה וקולורדו, תוך שימוש במחבואים נידחים כמו 'חור בקיר'."
          - "לאחר מרדף בלתי פוסק של סוכנות הבילוש הפרטית פינקרטון, נמלט הצמד מארה״ב לדרום אמריקה בשנת 1901."
          - "בנובמבר 1908 כותר הצמד וחוסל על ידי יחידת פרשים של צבא בוליביה בעיירה סן ויסנטה בעקבות שוד משכורות."
      - title: "בילי הנער ומלחמת מחוז לינקולן"
        points:
          - "נולד בשם הנרי מקארתי (נודע גם כוויליאם בוני), בילי הנער היה אקדוחן אגדי במערב הפרוע של ניו מקסיקו במאה ה-19."
          - "הוא לחם כ'רגולטור' במלחמת מחוז לינקולן העקובה מדם ב-1878, סכסוך אלים בין סוחרים וחוואים יריבים."
          - "האגדה העממית טענה כי בילי הרג 21 אנשים—אחד על כל שנת חייו—אם כי היסטוריונים מעריכים שהמספר האמיתי היה בין 4 ל-9."
          - "ביולי 1881 איתר שריף מחוז לינקולן, פט גארט, את האקדוחן בן ה-21 במבצר פורט סאמנר וירה בו למוות בחשיכה."
      - title: "פבלו אסקובר וקרטל מדיין"
        points:
          - "פבלו אסקובר צמח מהברחות קטנות לשליטה במונופול סחר הקוקאין העולמי ממדיין שבקולומביה בשנות ה-70 וה-80."
          - "בשיא כוחו סיפק קרטל מדיין 80% מהקוקאין שהוברח לארה״ב, מה שהניב לאסקובר הון אישי עתק של כ-30 מיליארד דולר."
          - "אסקובר ניהל מלחמת טרור אכזרית נגד ממשלת קולומביה במדיניות 'כסף או עופרת' (Plata o Plomo: שוחד או כדור בראש)."
          - "הוא אותר וחוסל על גג בית במדיין בדצמבר 1993 על ידי יחידת עילית של משטרת קולומביה בסיוע מודיעין אמריקאי."
      - title: "לאקי לוצ'יאנו ומועצת המאפיה"
        points:
          - "צ'ארלס 'לאקי' לוצ'יאנו נחשב לאבי הפשע המאורגן המודרני בארה״ב, לאחר שארגן מחדש את העולם התחתון בניו יורק ב-1931."
          - "לוצ'יאנו חיסל את ראשי המאפיה הישנים והקים את 'הקומישן' (The Commission)—מועצת חמש המשפחות ליישוב סכסוכים."
          - "חמש המשפחות שהוקמו היו ג'נובזה, גמבינו, לוקזה, בונאנו וקולומבו, ששלטו בסחר, באיגודי עובדים, בנמלים ובקזינו."
          - "במהלך מלחמת העולם השנייה שיתף צבא ארה״ב פעולה עם לוצ'יאנו הכלוא ('מבצע עולם תחתון') כדי לאבטח את נמלי ניו יורק מחבלות נאציות."
      - title: "ווייטי בולג'ר וכנופיית ווינטר היל"
        points:
          - "ג'יימס 'ווייטי' בולג'ר היה הבוס האכזר של כנופיית 'ווינטר היל', ששלטה בעולם הפשע של דרום בוסטון במשך עשרות שנים."
          - "ללא ידיעת יריביו, בולג'ר שימש כמודיע סודי של ה-FBI וזכה להגנה סמויה של סוכן ה-FBI המושחת ג'ון קונולי."
          - "כאשר קונולי הדליף לו על כתבי אישום קרבים ב-1994, נמלט בולג'ר ושהה 16 שנים ברשימת עשרת המבוקשים ביותר."
          - "הוא נעצר לבסוף בסנטה מוניקה שבקליפורניה בשנת 2011 בגיל 81, כשהוא מתגורר בדירה צנועה עם מיליוני דולרים במזומן ו-30 כלי נשק."
    trivia:
      - type: multiple_choice
        question: "בגין איזו עבירה פדרלית הורשע ונכלא לבסוף ראש המאפיה של שיקגו, אל קפונה, ב-1931?"
        options: ["רצח", "העלמת מס הכנסה (Tax Evasion)", "הברחת אלכוהול", "שוד בנקים"]
        correct: 1
      - type: single_qa
        question: "איזה צמד פורעי חוק מפורסם נהרג במארב יריות בלואיזיאנה בתוך רכב פורד במאי 1934?"
        answer: "בוני וקלייד (Bonnie and Clyde)"
      - type: multiple_choice
        question: "כיצד נמלט שודד הבנקים ג'ון דילינג'ר מכלא קראון פוינט השמור בשנת 1934?"
        options: ["שיחד את מנהל הכלא", "גילף אקדח דמה מעץ וצבע במשחת נעליים", "חפר מנהרה", "התחבא במשאית כביסה"]
        correct: 1
      - type: single_qa
        question: "מי היה שריף מחוז לינקולן שירה למוות בבילי הנער במבצר פורט סאמנר ב-1881?"
        answer: "פט גארט (Pat Garrett)"
      - type: multiple_choice
        question: "לאיזו יבשת נמלטו בוץ' קסידי וסאנדנס קיד ב-1901 כדי לחמוק מסוכנות הבילוש פינקרטון?"
        options: ["אירופה", "דרום אמריקה (ארגנטינה ובוליביה)", "אסיה", "אפריקה"]
        correct: 1
      - type: single_qa
        question: "איזה ברון סמים קולומביאני עמד בראש קרטל מדיין עד שחוסל על גג בית ב-1993?"
        answer: "פבלו אסקובר (Pablo Escobar)"
      - type: multiple_choice
        question: "איזה גנגסטר הקים ב-1931 את מועצת 'הקומישן' שניהלה את חמש משפחות המאפיה בארה״ב?"
        options: ["אל קפונה", "צ'ארלס 'לאקי' לוצ'יאנו", "ויטו ג'נובזה", "קרלו גמבינו"]
        correct: 1
      - type: single_qa
        question: "איזה בוס פשע מבוסטון פעל כמודיע של ה-FBI בעודו מנהל את כנופיית ווינטר היל?"
        answer: "ווייטי בולג'ר (Whitey Bulger)"
      - type: multiple_choice
        question: "מחוץ לאיזה בית קולנוע בשיקגו נורה למוות ג'ון דילינג'ר על ידי סוכני ה-FBI ב-1934?"
        options: ["ריאלטו", "קולנוע ביוגרף (Biograph Theater)", "מג'סטיק", "פראמונט"]
        correct: 1
      - type: single_qa
        question: "באיזה תאריך ב-1929 התרחש טבח יום ולנטיין המפורסם בשיקגו שבו חוסלו 7 אנשי כנופיה?"
        answer: "14 בפברואר 1929"
      - type: multiple_choice
        question: "איזה ביטוי אכזרי טבע פבלו אסקובר שפירושו 'קבל שוחד או חטוף כדור בראש'?"
        options: ["וני וידי ויצ'י", "פלאטה או פלומו (כסף או עופרת)", "קרפה דיאם", "עין תחת עין"]
        correct: 1
      - type: single_qa
        question: "איזו סוכנות בילוש פרטית נשכרה על ידי חברות הרכבות כדי לצוד את כנופייתו של בוץ' קסידי?"
        answer: "סוכנות פינקרטון (Pinkertons)"
      - type: multiple_choice
        question: "באיזו עיר חוף בקליפורניה נלכד הנמלט ווייטי בולג'ר בן ה-81 ב-2011 לאחר 16 שנות מנוסה?"
        options: ["מליבו", "סנטה מוניקה (Santa Monica)", "לגונה ביץ'", "סנטה ברברה"]
        correct: 1
      - type: single_qa
        question: "מה היה שמו האמיתי של האקדוחן בילי הנער בעת לידתו?"
        answer: "הנרי מקארתי (או ויליאם בוני)"
      - type: multiple_choice
        question: "כיצד כונתה בעיתונות האישה שהסגירה את מקומו של ג'ון דילינג'ר לסוכני ה-FBI?"
        options: ["בוני פארקר", "האישה באדום (Woman in Red)", "אוולין פרשט", "מא בארקר"]
        correct: 1
      - type: single_qa
        question: "איזה סוכן פדרלי עמד בראש צוות 'הבלתי משוחדים' (The Untouchables) שחקר את אל קפונה?"
        answer: "אליוט נס (Eliot Ness)"

  - id: legendary_con_artists_frauds
    title: "נוכלי-על ותרמיות פיננסיות"
    description: >
      חשפו את ההונאות המתוחכמות, הזהויות המזויפות ותרמיות הענק בהיסטוריה! 
      ממכירת מגדל אייפל לסוחרי גרוטאות ועד תרמיות פונזי של עשרות מיליארדי דולרים בוול סטריט.
    cards:
      - title: "צ'ארלס פונזי והתרמית המקורית (1920)"
        points:
          - "בשנת 1920 הבטיח המהגר האיטלקי צ'ארלס פונזי למשקיעים בבוסטון תשואה דמיונית של 50% ב-45 יום דרך קופוני דואר בינלאומיים."
          - "במקום להשקיע את הכסף, פונזי שילם למשקיעים הוותיקים באמצעות הכספים שזרמו ממשקיעים חדשים, ושלשל לכיסו מיליונים."
          - "התרמית קרסה לחלוטין בעקבות תחקיר עיתונאי חושף של הבוסטון פוסט שגילה שאין שום מסחר אמיתי מאחורי העסק."
          - "ההונאה הולידה את המונח הבינלאומי 'הונאת פונזי' (Ponzi Scheme), המשמש עד היום לתיאור פירמידות השקעה מזויפות."
      - title: "הונאת 65 מיליארד הדולר של ברני מיידוף"
        points:
          - "ברנרד מיידוף, לשעבר יו״ר בורסת הנאסד״ק, ניהל את הונאת הפונזי הגדולה ביותר בתולדות הכלכלה העולמית."
          - "במשך עשרות שנים הציג תשואות חיוביות קבועות ויציבות של 10%–12% בשנה באמצעות אסטרטגיית מסחר פיקטיבית."
          - "בפועל, מיידוף הפקיד את כל כספי הלקוחות בחשבון בנק יחיד בבנק צ'ייס וזייף אישורי עסקאות ודוחות חודשיים."
          - "ההונאה התפוצצה במשבר הכלכלי של 2008 כשמשקיעים ביקשו לפדות 7 מיליארד דולר; מיידוף נידון ל-150 שנות מאסר."
      - title: "ויקטור לוסטיג: האיש שמכר את מגדל אייפל"
        points:
          - "בשנת 1925 קרא הנוכל האוסטרי הכריזמטי ויקטור לוסטיג שמגדל אייפל בפריז סובל מהזנחה קשה ועלויות אחזקה כבדות."
          - "כשהוא מתחזה לפקיד ממשל צרפתי בכיר, כינס לוסטיג סוחרי גרוטאות מתכת לפגישה סודית במלון יוקרה בפריז."
          - "הוא שכנע את הסוחר אנדרה פואסון שהמגדל עומד להיהרס ומכר לו את הזכויות על 7,000 טון מתכת תמורת שוחד ו-70,000 דולר במזומן."
          - "לוסטיג נמלט לווינה; פואסון היה מושפל מכדי להתלונן במשטרה, מה שגרם ללוסטיג לחזור לפריז ולנסות למכור את המגדל פעם נוספת!"
      - title: "פרנק אבגנייל: תפוס אותי אם תוכל"
        points:
          - "פרנק אבגנייל הבן התפרסם כמי שזייף ופדה המחאות במיליוני דולרים ב-26 מדינות ברחבי העולם בשנות ה-60."
          - "הוא טען כי התחזה בהצלחה לטייס משנה בחברת התעופה פאן אם, לרופא ילדים אחראי בג'ורג'יה ולעורך דין בלואיזיאנה."
          - "לאחר שריצה עונשי מאסר בצרפת, שוודיה וארה״ב, החל לעבוד כיועץ אבטחה ומניעת הונאות עבור ה-FBI ובנקים."
          - "סיפור חייו המרתק היווה השראה לסרטו המצליח של סטיבן ספילברג משנת 2002 'תפוס אותי אם תוכל' בכיכוב ליאונרדו דיקפריו."
      - title: "אנה סורוקין (אנה דלבי: היורשת המזויפת)"
        points:
          - "בין השנים 2013 ל-2017 התחזתה אנה סורוקין ילידת רוסיה ל'אנה דלבי', יורשת גרמנייה עשירה בעלת קרן נאמנות של 60 מיליון אירו."
          - "היא חדרה לחברה הגבוהה במנהטן, התגוררה במלונות בוטיק יוקרתיים, טסה במטוסים פרטיים וסעדה במסעדות מישלן על חשבון אשראי."
          - "סורוקין ניסתה להשיג הלוואת ענק של 22 מיליון דולר מבנקים בעזרת מסמכים פיננסיים מזויפים להקמת מועדון אמנות פרטי."
          - "היא הורשעה בעבירות גניבה והונאה מרובות ב-2019, וסיפורה הפך לסנסציה תקשורתית עולמית ולסדרת טלוויזיה מצליחה."
      - title: "פרדיננד דמארה: המתחזה הגדול"
        points:
          - "פרדיננד דמארה היה בעל זיכרון צילומי ותעוזה בלתי רגילה, והתחזה בהצלחה לעשרות בעלי מקצוע ללא שום הכשרה רשמית."
          - "במהלך מלחמת קוריאה התחזה לד״ר ג'וזף סיר, רופא מנתח בצי הקנדי, וביצע בהצלחה 16 ניתוחי שדה מורכבים תחת אש!"
          - "הוא שימש גם כמהנדס אזרחי, מרצה לפסיכולוגיה, חוקר סרטן, נזיר טראפיסטי וסגן מנהל בית סוהר."
          - "דמארה טען כי המניע שלו מעולם לא היה בצע כסף, אלא הריגוש האינטלקטואלי והאתגר שבאימוץ זהויות חדשות."
      - title: "ניסיון שוד יהלום המילניום (לונדון, 2000)"
        points:
          - "בנובמבר 2000 תכננה כנופיה חמושה לשדוד את יהלום 'כוכב המילניום' המושלם במשקל 203 קראט בשווי 200 מיליון ליש״ט מכיפת המילניום."
          - "הכנופיה השתמשה במחפר עפר כבד (JCB) כדי לפרוץ את קיר המבנה והשליכה רימוני עשן לעבר המבקרים."
          - "ללא ידיעת השודדים, יחידת העילית של משטרת לונדון עקבה אחריהם במשך חודשים והחליפה את היהלומים האמיתיים בהעתקי זכוכית."
          - "שוטרים חמושים שהתחפשו לעובדי ניקיון ותיירים עצרו את כל חברי הכנופיה בתוך שניות מרגע הפריצה."
      - title: "קריסת תאגיד אנרון (2001)"
        points:
          - "ענקית האנרגיה אנרון מיוסטון נבחרה ל'חברה החדשנית ביותר באמריקה' בידי מגזין פורצ'ן במשך שש שנים ברציפות."
          - "מנהלי החברה, ג'פרי סקילינג וקנת' ליי, הסתירו חובות עתק של מיליארדי דולרים בעזרת תרמיות חשבונאיות וישויות חוץ-מאזניות (SPE)."
          - "החברה פשטה רגל בדצמבר 2001, ומחקה 74 מיליארד דולר מכספי המשקיעים ופנסיות העובדים."
          - "השערורייה הובילה לפירוק פירמת רואי החשבון הבינלאומית ארתור אנדרסן ולחקיקת חוק סרבנס-אוקסלי (SOX) להגברת השקיפות בתאגידים."
    trivia:
      - type: multiple_choice
        question: "איזה מהגר איטלקי עמד מאחורי תרמית קופוני הדואר ב-1920 שהעניקה את שמה ל'הונאת פונזי'?"
        options: ["קרלו גמבינו", "צ'ארלס פונזי (Charles Ponzi)", "וינצ'נצו פרוג'ה", "פרנק קוסטלו"]
        correct: 1
      - type: single_qa
        question: "איזה מונומנט מפורסם בפריז 'מכר' הנוכל ויקטור לוסטיג לסוחר גרוטאות בשנת 1925?"
        answer: "מגדל אייפל (Eiffel Tower)"
