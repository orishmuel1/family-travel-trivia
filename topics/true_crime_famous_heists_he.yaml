id: true_crime_famous_heists_he
title: "פשע אמיתי ושודים מפורסמים"
description: >
  צעדו אל הצללים המרתקים של עולם הפשע! משודדי כספות יהלומים מתוחכמים 
  וגניבות אמנות נועזות ועד תעלומות רצח בלתי מפוענחות, גנגסטרים מתקופת היובש 
  ונוכלי-על אגדיים, גלו את מקרי הפשע האמיתי המרתקים ביותר בהיסטוריה.
lang: he
audience: adult
categories:
  - id: important_facts
    title: "עובדות חשובות"
    description: >
      פריצות דרך פורנזיות, פסיכולוגיה חקירתית ותולדות הקרימינולוגיה העולמית. 
      קראו את הכרטיסיות הללו יחד בקול לפני שתבחנו את הידע בסבב הטריוויה!
    cards:
      - title: "הולדת המדע הפורנזי"
        points:
          - "בשנת 1892 עשה קצין המשטרה הארגנטינאי חואן ווצ'טיץ' היסטוריה כשפענח רצח באמצעות טביעות אצבע מגואלות בדם, והקים את הלשכה הפורנזית הראשונה."
          - "הבלש הבדיוני שרלוק הולמס של ארתור קונאן דויל הפך לפופולריים שיטות כמו בליסטיקה, פענוח כתב יד ויציקות עקבות עוד לפני שהמשטרה אימצה אותן."
          - "ד״ר אדמונד לוקארד ניסח את עקרון היסוד הפורנזי הנודע: 'כל מגע מותיר עקבות' (Locard's Exchange Principle)."
          - "חוקרים מוקדמים הסתמכו על שיטת ברטיון (Bertillon)—מדידת 11 מידות גוף מדויקות—לפני שטביעות אצבע הוכחו כאמינות וייחודיות בהרבה."
      - title: "פרופיל DNA וגנאלוגיה גנטית"
        points:
          - "הגנטיקאי הבריטי סר אלק ג'פריס המציא את פרופיל ה-DNA בשנת 1984, שיטה שיושמה לראשונה לפענוח פרשת הרציחות של קולין פיצ'פורק ב-1986."
          - "בשנת 2018 נלכד 'הרוצח מגולדן סטייט' (ג'וזף דיאנג'לו) לאחר עשרות שנים, באמצעות שימוש פורץ דרך בגנאלוגיה גנטית דרך מאגרי אילנות יוחסין ציבוריים."
          - "טכנולוגיית DNA מגע (Touch DNA) מסוגלת כיום להפיק פרופיל גנטי שלם מתאי עור בודדים שהושארו על ידית דלת או כוס זכוכית."
          - "מאגר ה-DNA הלאומי של האף-בי-איי (CODIS) מכיל מעל 20 מיליון פרופילים וסייע לפענוח מאות אלפי תיקים פליליים ישנים."
      - title: "הסקוטלנד יארד וה-FBI"
        points:
          - "משטרת המטרופולין של לונדון הוקמה ב-1829 על ידי סר רוברט פיל, שוטריה כונו 'בוביז' (Bobbies) ומפקדתה נקראה 'סקוטלנד יארד'."
          - "הבולשת הפדרלית האמריקאית (FBI) נוסדה ב-1908 והתרחבה משמעותית תחת ג'יי אדגר הובר במאבק נגד כנופיות הגנגסטרים בשנות ה-30."
          - "רשימת 'עשרת הנמלטים המבוקשים ביותר' הושקה ב-1950 בעקבות שאלה של עיתונאי על 'הטיפוסים הכי קשוחים' שהבולשת רודפת."
          - "מעל 90% מכלל הפושעים שהופיעו ברשימת עשרת המבוקשים נלכדו או אותרו בסופו של דבר."
      - title: "פרופילאות פלילית ויחידת ה-BAU"
        points:
          - "היחידה לניתוח התנהגותי של ה-FBI (ה-BAU) פותחה בסוף שנות ה-70 על ידי הסוכנים ג'ון דאגלס ורוברט רסלר בקוונטיקו שבווירג'יניה."
          - "סוכני היחידה ערכו ראיונות עומק פסיכולוגיים מקיפים עם רוצחים סדרתיים מפורסמים בכלא, ביניהם טד בנדי, צ'ארלס מנסון ואד קמפר."
          - "בניית פרופיל מנתחת את זירת הפשע, בחירת הקורבנות וההתנהגות כדי להסיק על תכונותיו הפסיכולוגיות, הרגליו ומאפייניו של העבריין."
          - "רסלר טבע את המונח 'רוצח סדרתי' (Serial Killer) כדי לתאר רוצחים הפועלים בסדרת אירועים עם תקופות צינון ביניהם."
      - title: "ניתוח כתמי דם ולומינול"
        points:
          - "ניתוח דפוסי כתמי דם (BPA) עושה שימוש בפיזיקה והידרודינמיקה כדי לשחזר את תנועות הקורבן והתוקף, כיוון הפגיעה וסוג כלי הנשק."
          - "לומינול הוא חומר כימי הפולט זוהר כחלחל זוהר (כימולומינסנציה) כשהוא בא במגע עם ברזל בהמוגלובין, אפילו על משטחים שנשטפו באקונומיקה."
          - "נתזי דם במהירות גבוהה (ערפל דקיק) מעידים לרוב על ירי, בעוד דפוסי השלכה (Cast-off) מעידים על הנפת כלי נשק קהה."
          - "מעבדות זיהוי פלילי מודרניות משתמשות בסורקי לייזר תלת-ממדיים ובקרני אורכי גל משתנים למיפוי מדויק של זירות עבירה."
      - title: "האינטרפול והודעות אדומות"
        points:
          - "האינטרפול (ארגון השיטור הפלילי הבינלאומי) הוקם ב-1923 ומפקדתו בליון שבצרפת, ומחבר בין כוחות משטרה ב-196 מדינות."
          - "'הודעה אדומה' (Red Notice) של האינטרפול אינה צו מעצר בינלאומי, אלא בקשה רשמית מכוחות שיטור לאתר ולעצור נמלט לצורך הסגרה."
          - "הארגון מנהל מאגרי מידע עולמיים של יצירות אמנות גנובות, דרכונים גנובים, טביעות אצבע ורשתות פשע מאורגן חוצות גבולות."
          - "מוקדי תקשורת מאובטחים הפועלים 24 שעות ביממה מאפשרים תיאום מבצעי בינלאומי נגד טרור, סחר בבני אדם והלבנת הון."
      - title: "קוד השתיקה (אומרטה)"
        points:
          - "מקורו בדרום איטליה, 'אומרטה' (Omertà) הוא קוד השתיקה הנוקשה של הפשע המאורגן האוסר על שיתוף פעולה עם רשויות החוק."
          - "הפרת האומרטה נענשה באופן מסורתי על ידי המאפיה בהוצאה מיידית להורג של המלשין ובני משפחתו."
          - "הקוד נסדק בארה״ב כאשר איש המאפיה ג'ו ואלאצ'י העיד בפומבי בפני הסנאט האמריקאי ב-1963 וחשף את קיומה של ה-'קוזה נוסטרה'."
          - "חוק ה-RICO האמריקאי משנת 1970 חולל מהפכה באפשרות להעמיד לדין ראשי ארגוני פשע על עבירות שביצעו פקודיהם."
      - title: "פורנזיקה שגויה ופרויקט החפות"
        points:
          - "נוסד ב-1992 על ידי ברי שק ופיטר ניופלד, 'פרויקט החפות' זיכה מעל 375 מורשעים חפים מפשע בארה״ב בעזרת בדיקות DNA מאוחרות."
          - "מחקרים גילו כי זיהוי שגוי של עדי ראייה הוא הגורם המרכזי ביותר בלמעלה מ-70% מההרשעות השגויות שבוטלו בבדיקות DNA."
          - "שיטות פורנזיות ישנות שנחשבו לאמינות, כמו השוואת סימני נשיכה, בדיקות שיער במיקרוסקופ ודפוסי שריפה, ספגו ביקורת מדעית חריפה."
          - "רפורמות משפטיות מודרניות מחייבות מסדרי זיהוי בתנאי 'סמיות כפולה', הקלטת חקירות בווידאו ותקני תיקוף מדעי מחמירים."
    trivia:
      - type: multiple_choice
        question: "מי המציא את שיטת זיהוי ה-DNA הפורנזית בשנת 1984?"
        options: ["פרנסיס קריק", "סר אלק ג'פריס (Sir Alec Jeffreys)", "אלכסנדר פלמינג", "רוברט קוך"]
        correct: 1
      - type: single_qa
        question: "איזה עקרון פורנזי יסודי קובע כי 'כל מגע מותיר עקבות'?"
        answer: "עקרון החילוף של לוקארד (Locard's Exchange Principle)"
      - type: multiple_choice
        question: "איזה חומר כימי פולט זוהר כחלחל בעת מגע עם ברזל בדם, אפילו על משטחים שנשטפו?"
        options: ["מי חמצן", "לומינול (Luminol)", "פורמלין", "אתנול"]
        correct: 1
      - type: single_qa
        question: "איזה רוצח סדרתי ידוע לשמצה נלכד ב-2018 לאחר עשרות שנים באמצעות גנאלוגיה גנטית?"
        answer: "הרוצח מגולדן סטייט (ג'וזף דיאנג'לו)"
      - type: multiple_choice
        question: "מי הקים את משטרת לונדון ב-1829, וממנו נגזר כינוים של השוטרים הבריטים 'בוביז'?"
        options: ["וינסטון צ'רצ'יל", "סר רוברט פיל (Robert Peel)", "בנימין דיזראלי", "ויליאם גלדסטון"]
        correct: 1
      - type: single_qa
        question: "מה שמה של יחידת ה-FBI המתמחה בבניית פרופיל פסיכולוגי של עבריינים בקוונטיקו?"
        answer: "היחידה לניתוח התנהגותי (BAU / Behavioral Analysis Unit)"
      - type: multiple_choice
        question: "איזה צבע נושאת הודעת האינטרפול המבקשת לאתר ולעצור נמלט בינלאומי לצורך הסגרה?"
        options: ["הודעה כחולה", "הודעה אדומה (Red Notice)", "הודעה צהובה", "הודעה שחורה"]
        correct: 1
      - type: single_qa
        question: "כיצד נקרא קוד השתיקה המסורתי של המאפיה האיטלקית האוסר על שיתוף פעולה עם המשטרה?"
        answer: "אומרטה (Omertà)"
      - type: multiple_choice
        question: "מהו הגורם העיקרי שהוביל ללמעלה מ-70% מההרשעות השגויות שבוטלו בבדיקות DNA?"
        options: ["טביעות אצבע שגויות", "זיהוי שגוי של עדי ראייה", "שופטים מושחתים", "פריצת מחשבים"]
        correct: 1
      - type: single_qa
        question: "מי היה איש המאפיה הראשון ששבר בפומבי את קוד האומרטה והעיד בסנאט האמריקאי ב-1963?"
        answer: "ג'ו ואלאצ'י (Joe Valachi)"
      - type: multiple_choice
        question: "איזה חוק פדרלי משנת 1970 איפשר לתבוע ראשי מאפיה על פשעים שביצעו אנשיהם בארגון?"
        options: ["חוק הפטריוט", "חוק ה-RICO", "חוק וולסטד", "חוק בריידי"]
        correct: 1
      - type: single_qa
        question: "איזה בלש בדיוני מפורסם שיצר ארתור קונאן דויל הציג שיטות זיהוי פלילי עוד לפני המשטרה?"
        answer: "שרלוק הולמס"
      - type: multiple_choice
        question: "באיזו מדינה ממוקמת המפקדה הראשית העולמית של ארגון האינטרפול?"
        options: ["שווייץ (ז'נבה)", "צרפת (ליון)", "בריטניה (לונדון)", "הולנד (האג)"]
        correct: 1
      - type: single_qa
        question: "מהו שמו של מאגר ה-DNA הממוחשב הלאומי של ה-FBI?"
        answer: "CODIS (קודיס)"
      - type: multiple_choice
        question: "איזו שיטת זיהוי מהמאה ה-19 התבססה על 11 מידות גוף מדויקות לפני המעבר לטביעות אצבע?"
        options: ["שיטת גלטון", "שיטת ברטיון (Bertillon)", "לוח לומברוזו", "אינדקס הובר"]
        correct: 1
      - type: single_qa
        question: "איזה ארגון משפטי ללא מטרות רווח שהוקם ב-1992 פועל לזיכוי מורשעים חפים מפשע בעזרת DNA?"
        answer: "פרויקט החפות (The Innocence Project)"

  - id: greatest_art_diamond_heists
    title: "שודדי האמנות והיהלומים הגדולים"
    description: >
      היכנסו אל עולם הפריצות המתוחכמות, עקיפת חיישני לייזר ופיצוח כספות שמורות! 
      מציורי מופת יקרי ערך בבוסטון ועד מאות מיליונים ביהלומים באנטוורפן ובדרזדן.
    cards:
      - title: "שוד מוזיאון איזבלה סטיוארט גרדנר (1990)"
        points:
          - "בליל יום פטריק הקדוש ב-1990, נכנסו שני שודדים מחופשים לשוטרים למוזיאון בבוסטון וקשרו את המאבטחים במסקינטייפ."
          - "הם שהו במוזיאון 81 דקות וגנבו 13 יצירות מופת נדירות בשווי של למעלה מ-500 מיליון דולר—שוד האמנות הגדול בהיסטוריה."
          - "בין היצירות הגנובות: ציור הנוף הימי היחיד של רמברנדט ('הסערה בים כנרת'), 'הקונצרט' של ורמיר ורישומים של דגה."
          - "עד היום אף יצירה לא אותרה, מסגרות העץ הריקות עדיין תלויות על קירות המוזיאון ופרס של 10 מיליון דולר מוצע על מידע."
      - title: "שוד מרכז היהלומים באנטוורפן (2003)"
        points:
          - "בהובלת הגנב האיטלקי לאונרדו נוטרברטולו וכנופייתו ('אסכולת טורינו'), שוד זה נחשב לשוד היהלומים המתוחכם בהיסטוריה."
          - "הצוות חדר לכספת תת-קרקעית בבלגיה המוגנת ב-10 שכבות אבטחה, כולל מכ״ם דופלר, גלאי חום, אינפרא-אדום ושדה מגנטי."
          - "נוטרברטולו שכר משרד בבניין במשך שנתיים, והשתמש במצלמות זעירות בעטים כדי לשכפל מפתחות ולתעד קודי פתיחה."
          - "הם גנבו יהלומים וזהב בשווי מעל 100 מיליון דולר; השלל מעולם לא אותר לאחר שהכנופיה נחשפה בגלל כריך חצי-אכול שנזרק בשקית אשפה."
      - title: "גניבת המונה ליזה (1911)"
        points:
          - "יצירת המופת של לאונרדו דה וינצ'י נגנבה ממוזיאון הלובר בפריז על ידי וינצ'נצו פרוג'ה, זגג ושיפוצניק איטלקי שעבד במוזיאון."
          - "פרוג'ה התחבא בארון ציוד ביום ראשון, הסיר את הציור ממסגרתו בבוקר המחרת ויצא מהמוזיאון כשהציור מוחבא מתחת למעילו."
          - "הציור נעדר מעל 24 שעות לפני שמישהו שם לב; במהלך החקירה נעצרו ונחקרו אפילו המשורר אפולינר והצייר פבלו פיקאסו!"
          - "פרוג'ה נתפס כעבור שנתיים בפירנצה כשניסה למכור את הציור; הסיקור התקשורתי העולמי חסר התקדים הפך את המונה ליזה לציור המפורסם בעולם."
      - title: "שוד כספת היהלומים בדרזדן (2019)"
        points:
          - "שודדים פרצו ל'כספת הירוקה' (Grünes Gewölbe) בטירת דרזדן שבגרמניה, שהכילה את אוסף אוצרות המלוכה הגדול באירופה."
          - "הכנופיה הציתה ארון חשמל כדי להשבית פנסי רחוב, חתכה סורגי חלון וניפצה ויטרינות זכוכית בעזרת גרזנים בתוך דקות בודדות."
          - "הם גנבו 21 תכשיטים מלכותיים היסטוריים משובצים בלמעלה מ-4,300 יהלומים, אבני אודם וברקת בשווי מעל 120 מיליון דולר."
          - "משטרת גרמניה עצרה חברים מחמולת הפשע הידועה רמו בברלין, וחלק מהתכשיטים שניזוקו הוחזרו ב-2022."
      - title: "שוד הכספות בהאטון גארדן (לונדון, 2015)"
        points:
          - "במהלך חופשת חג הפסחא ב-2015, כנופיית פורצים ותיקים פרצה למתחם כספות תת-קרקעי ברובע היהלומים של לונדון."
          - "הפורצים השתלשלו בפיר מעלית, קדחו בקיר בטון מזוין בעובי 50 סנטימטרים במקדח יהלום תעשייתי ובזזו 73 כספות פרטיות."
          - "הם שדדו זהב, יהלומים ומזומנים בשווי מוערך של כ-14 מיליון ליש״ט ($19 מיליון)."
          - "התדהמה הציבורית גברה כשהתברר שראשי הכנופיה היו עבריינים קשישים בשנות ה-60 וה-70 לחייהם ('הסבים השודדים')."
      - title: "שוד לופטהנזה בנמל התעופה JFK (1978)"
        points:
          - "תוכנן בידי איש משפחת הפשע לוקזה ג'ימי בורק ('ג'ימי הג'נטלמן'), כנופיית מאפיה פשטה על מסוף המטענים של לופטהנזה בניו יורק."
          - "שודדים חמושים כפתו עובדים והעמיסו לוואן 5.875 מיליון דולר במזומנים ובתכשיטים שאינם ניתנים לאיתור בתוך פחות משעה."
          - "במשך עשרות שנים זה היה שוד המזומנים הגדול ביותר שבוצע אי פעם על אדמת ארצות הברית."
          - "בחשש ממלשינים, בורק הורה על חיסולם השיטתי של כמעט כל המעורבים בשוד; הפרשה היוותה השראה לסרט 'החבר'ה הטובים'."
      - title: "שוד הבנק המרכזי בפורטלזה (ברזיל, 2005)"
        points:
          - "כנופיית פושעים מתוחכמת שכרה מבנה מסחרי במרחק שני בלוקים מהבנק והתחזתה לחברה לייצור דשא סינתטי וגינון."
          - "במשך שלושה חודשים חפרו מנהרה תת-קרקעית באורך 78 מטרים, שכללה דיפון עץ, תאורת חשמל ומערכת מיזוג אוויר!"
          - "המנהרה הגיעה ישירות מתחת לרצפת הכספת של הבנק המרכזי, שם קדחו דרך 1.1 מטרים של בטון מזוין בפלדה."
          - "הם שדדו 160 מיליון ריאל ברזילאי ($70 מיליון) בשטרות משומשים במשקל 3.5 טונות מבלי לירות ירייה אחת."
      - title: "רשת הפנתרים הוורודים (Pink Panthers)"
        points:
          - "'הפנתרים הוורודים' הוא כינוי של האינטרפול לרשת בינלאומית של מעל 800 שודדי תכשיטים מיוגוסלביה לשעבר (סרביה ומונטנגרו)."
          - "הם זכו לכינוי לאחר שגנבו יהלום בשווי חצי מיליון ליש״ט בלונדון והחביאו אותו בתוך צנצנת קרם פנים, בדומה לסרט 'הפנתר הוורוד'."
          - "ידועים בפשיטות 'הכה וברח' מהירות במיוחד; בדובאי ב-2007 נסעו בשתי מכוניות אאודי ישירות לתוך קניון יוקרה ושדדו חנות ב-90 שניות."
          - "לפי הערכות האינטרפול, הרשת שדדה מעל 500 מיליון דולר ביהלומים ותכשיטי יוקרה בטוקיו, פריז, ז'נבה ולונדון."
